name: Graph fast development source checks

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact published Graph development source SHA
        type: string
        required: true
      base_sha:
        description: Existing ancestor commit to select changed source consumers
        type: string
        required: true

permissions:
  contents: read

# Safe to cancel: only inert source and fixture diagnostics run here.
# Authenticated R74, Native Host and physical acceptance are separate.
concurrency:
  group: graph-fast-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graph-source-intake:
    name: Graph first-case source intake (not Native G2)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      EXPECTED_GRAPH_SOURCE: ${{ inputs.expected_source_sha }}
      GRAPH_FAST_BASE: ${{ inputs.base_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 8
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check exact source and first-case owner/producer intake
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REPOSITORY" = seradotcom/motionwright
          test "$GITHUB_SHA" = "$EXPECTED_GRAPH_SOURCE"
          mkdir -p knowledge/runtime
          python3 -B tooling/ci_graph_dev_fast.py --repo . \
            --base "$GRAPH_FAST_BASE" --expected-source "$GITHUB_SHA" \
            --mode fast --timeout-seconds 60 \
            --report knowledge/runtime/graph-fast-source-result.json
      - name: Retain bounded source-only result, even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: graph-fast-source-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: knowledge/runtime/graph-fast-source-result.json
          if-no-files-found: warn
          retention-days: 7

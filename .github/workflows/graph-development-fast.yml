name: Graph fast development source checks

on:
  # A source-only push lane works on the integration branch before this
  # workflow is registered on default for optional workflow_dispatch.
  push:
    branches: ['integrate/phase1-final-composition-20261027']
    paths:
      - '.github/workflows/graph-development-fast.yml'
      - 'tooling/ci_graph_dev_fast.py'
      - '.github/workflows/graph-native-startup-dev.yml'
      - 'tooling/ci_graph_dev_native_startup.py'
      - 'tooling/tests/test_ci_graph_dev_native_startup.py'
      - 'tooling/tests/test_ci_graph_dev_native_budget.py'
      - 'tooling/ci_graph_dev_native_firstsave.py'
      - 'tooling/tests/test_ci_graph_dev_native_firstsave.py'
      - 'tooling/ci_graph_dev_portable_terminal_stdout.py'
      - 'tooling/tests/test_ci_graph_dev_portable_terminal_stdout.py'
      - 'tooling/ci_private_evidence.py'
      - 'tooling/requirements/mlt-g2-custody.txt'
      - 'tooling/tests/test_ci_graph_dev_fast.py'
      - 'tooling/tests/test_ci_graph_studio_selected.py'
      - 'tooling/native_graph_browser_owner.py'
      - 'tooling/graph_development.py'
      - 'tooling/tests/test_graph_development.py'
      - 'apps/studio/tooling/graph_dev_native_owner_port.ts'
      - 'apps/studio/tooling/graph_dev_first_save.spec.ts'
      - 'apps/studio/tooling/graph_dev_first_save.config.ts'
      - 'tooling/ci_canvas_service.py'
      - 'tooling/manim_graph_font_probe.py'
      - 'tooling/manim_bundled_font_intake.py'
      - 'tooling/manim_graph_runtime.py'
      - 'tooling/native_manim_graph_runtime_intake.py'
      - 'tooling/derive_manim_native_fonts.py'
      - 'tooling/tests/test_manim_graph_font_probe.py'
      - 'tooling/tests/test_native_manim_graph_manifest.py'
      - 'tooling/tests/test_ci_graph_sfnt_pango_source.py'
      - 'crates/manim-profile/**'
      - 'tooling/tests/test_ci_canvas_service.py'
      - 'tooling/tests/test_ci_graph_r74_singlecase.py'
      - 'tooling/graph_r74_external_reviewer.py'
      - 'tooling/tests/test_graph_r74_external_reviewer.py'
      - 'tooling/tests/test_graph_owner_native_quiescence.py'
      - 'tooling/tests/test_graph_owner_final_error_catalog.py'
      - 'tooling/tests/test_graph_owner_final_lifecycle_errors.py'
      - 'tooling/tests/test_graph_sdk_capture_layout.py'
      - 'tooling/tests/test_graph_owner_incomplete_terminal.py'
      - 'tooling/tests/test_graph_owner_session_ticket_custody.py'
      - 'tooling/tests/test_graph_owner_release_lease_roster.py'
      - 'tooling/tests/test_graph_owner_control_replay.py'
      - 'tooling/tests/test_graph_owner_restricted_startup_stderr.py'
      - 'tooling/tests/test_ci_graph_readonly_archive.py'
      - 'tooling/native_graph_build_reuse.py'
      - 'tooling/native_graph_build_transfer.py'
      - 'tooling/tests/test_graph_build_reuse.py'
      - 'tooling/tests/test_graph_build_transfer.py'
      - 'tooling/tests/test_graph_continuation.py'
      - '.github/workflows/studio-service-verification.yml'
      # Keep source push admission aligned with the impact router. This lane
      # runs inert checks only; it does not compile Rust or admit Native G2.
      - 'crates/domain/**'
      - 'crates/storage/**'
      - 'crates/storage/src/read_only.rs'
      - 'crates/storage/src/cas_retention.rs'
      - 'crates/service/**'
      - 'crates/native/**'
      - 'apps/studio/src/**'
      - 'apps/studio/tests/semantic-graph-*.spec.ts'
      - 'apps/studio/tests/support/scopedChangeService.ts'
      - 'rust-toolchain.toml'
      - 'crates/native/src/production/graph_authoring.rs'
      - 'crates/native/examples/native-graph-review-session.rs'
      - 'crates/service/examples/studio_review_session.rs'
      - 'apps/studio/tests/support/nativeGraphCase.ts'
      - 'apps/studio/tests/semantic-graph-service.spec.ts'
      - 'tooling/native_host_shared_state.py'
      - 'apps/studio/tests/support/graph-owner/**'
      - 'apps/studio/tooling/graph-owner/**'
      - 'SOURCE_LOCK.json'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - 'tooling/semwright_pin_atomicity.py'
      - 'tooling/tests/test_semwright_pin_atomicity.py'
      - 'tooling/source_lock_admission.py'
      - 'third_party/semwright-source-evidence/**'
  workflow_dispatch:
    inputs:
      verification_scope:
        description: Source-only Graph fast lane or precisely eight Studio regressions
        type: choice
        required: true
        default: source
        options: [source, studio-selected]
      expected_source_sha:
        description: Exact published Graph development source SHA
        type: string
        required: true
      base_sha:
        description: Existing ancestor commit to select changed source consumers
        type: string
        required: true

permissions:
  contents: read

# Safe to cancel: only inert source and fixture diagnostics run here.
# Authenticated R74, Native Host and physical acceptance are separate.
concurrency:
  group: graph-fast-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graph-source-intake:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.verification_scope == 'source' }}
    name: Graph first-case source intake (not Native G2)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      EXPECTED_GRAPH_SOURCE: ${{ github.event_name == 'push' && github.sha || inputs.expected_source_sha }}
      GRAPH_FAST_BASE: ${{ github.event_name == 'push' && github.event.before || inputs.base_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 32
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify exact source-locked Semwright dependencies without promotion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p knowledge/runtime
          # This is an offline consistency check, never a SOURCE_LOCK promotion.
          python3 -B -m unittest -q tooling.tests.test_semwright_pin_atomicity
          python3 -B tooling/semwright_pin_atomicity.py --root . \
            > knowledge/runtime/graph-fast-sem-pin-audit.original.json
      - name: Check exact source and first-case owner/producer intake
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$GITHUB_REF" = refs/heads/integrate/phase1-final-composition-20261027
          else
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
          fi
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REPOSITORY" = seradotcom/motionwright
          test "$GITHUB_SHA" = "$EXPECTED_GRAPH_SOURCE"
          mkdir -p knowledge/runtime
          python3 -B tooling/ci_graph_dev_fast.py --repo . \
            --base "$GRAPH_FAST_BASE" --expected-source "$GITHUB_SHA" \
            --mode fast --timeout-seconds 60 \
            --report knowledge/runtime/graph-fast-source-result.json
      - name: Verify GN1 startup and custody source contracts without Native effects
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/graph-fast-custody-venv"
          "$RUNNER_TEMP/graph-fast-custody-venv/bin/python" -m pip install \
            --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r tooling/requirements/mlt-g2-custody.txt
          "$RUNNER_TEMP/graph-fast-custody-venv/bin/python" -B -m unittest \
            tooling.tests.test_ci_graph_dev_fast \
            tooling.tests.test_ci_graph_sfnt_pango_source \
            tooling.tests.test_ci_graph_studio_selected \
            tooling.tests.test_ci_graph_dev_native_startup \
            tooling.tests.test_ci_graph_dev_native_budget \
            tooling.tests.test_ci_graph_dev_native_firstsave \
            tooling.tests.test_ci_graph_dev_portable_terminal_stdout \
            tooling.tests.test_ci_canvas_service.GraphR74JoinTests \
            tooling.tests.test_graph_development \
            tooling.tests.test_ci_graph_r74_singlecase \
            tooling.tests.test_graph_owner_native_quiescence \
            tooling.tests.test_graph_sdk_capture_layout \
            tooling.tests.test_graph_owner_final_error_catalog \
            tooling.tests.test_graph_owner_final_lifecycle_errors \
            tooling.tests.test_graph_owner_incomplete_terminal \
            tooling.tests.test_graph_owner_session_ticket_custody \
            tooling.tests.test_graph_owner_release_lease_roster \
            tooling.tests.test_ci_graph_readonly_archive -v \
            2>&1 | tee knowledge/runtime/graph-fast-gn1-unittest.original.log
          # Run original owner-control replay checks only when their source
          # module exists in this checkout. Earlier integration sources
          # remain valid without inventing a reviewer or Native result.
          if [ -f tooling/tests/test_graph_owner_control_replay.py ]; then
            "$RUNNER_TEMP/graph-fast-custody-venv/bin/python" -B -m unittest \
              tooling.tests.test_graph_owner_control_replay -v \
              2>&1 | tee -a knowledge/runtime/graph-fast-gn1-unittest.original.log
          fi
          # The selected restricted owner uses private first-party startup stderr.
          # Its source/negative test is mandatory on this integrated branch:
          # missing tests must fail G0 rather than silently skip coverage.
          test -f tooling/tests/test_graph_owner_restricted_startup_stderr.py
          "$RUNNER_TEMP/graph-fast-custody-venv/bin/python" -B -m unittest \
            tooling.tests.test_graph_owner_restricted_startup_stderr -v \
            2>&1 | tee -a knowledge/runtime/graph-fast-gn1-unittest.original.log
          # External R74 review must remain off GitHub runners; only the
          # source syntax and the explicit runner-denial boundary run in G0.
          "$RUNNER_TEMP/graph-fast-custody-venv/bin/python" -B - <<'PY' 2>&1 | tee -a knowledge/runtime/graph-fast-gn1-unittest.original.log
          import ast
          import os
          from pathlib import Path
          import sys
          for rel in ("tooling/graph_r74_external_reviewer.py",
                      "tooling/tests/test_graph_r74_external_reviewer.py"):
              ast.parse(Path(rel).read_text(encoding="utf-8"), filename=rel)
          sys.path.insert(0, str(Path("tooling").resolve()))
          import graph_r74_external_reviewer as reviewer
          if os.environ.get("GITHUB_ACTIONS") != "true":
              raise SystemExit("G0_REVIEWER_RUNNER_EXPECTED")
          try:
              reviewer.review(None, None, None, None, "", "", "")
          except reviewer.ReviewRejected as error:
              if str(error) != "GRAPH_REVIEW_INDEPENDENT_ONLY_NEVER_RUNNER":
                  raise
          else:
              raise SystemExit("G0_REVIEWER_RUNNER_DENIAL_ABSENT")
          print("PASS: R74 reviewer source syntax and GitHub-runner refusal only; independent review NOT_RUN")
          PY
      - name: Verify original Linux Pango SFNT and source-bound Graph runtime fixtures
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$(uname -m)" = x86_64
          test "$GITHUB_SHA" = "$EXPECTED_GRAPH_SOURCE"
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          import unittest

          selection = (
              "tooling.tests.test_manim_graph_font_probe.NativeFontProvenanceTests.test_real_native_files_bind_distinct_hashes_to_all_retained_sources",
              "tooling.tests.test_manim_graph_font_probe.NativeSfntFaceTests.test_real_bundled_sfnt_faces_have_exact_ascii_coverage_without_fallback",
              "tooling.tests.test_native_manim_graph_manifest",
          )
          loader = unittest.TestLoader()
          suite = unittest.TestSuite(loader.loadTestsFromName(name) for name in selection)
          result = unittest.TextTestRunner(stream=sys.stdout, verbosity=2).run(suite)
          if (result.testsRun != 24 or result.errors or result.failures
                  or result.skipped or result.expectedFailures or result.unexpectedSuccesses):
              raise SystemExit("Graph original Linux SFNT/Pango and owner manifest source tests failed")
          font_dir = Path("crates/manim-profile/testdata/graph-fonts")
          paths = sorted(font_dir.rglob("*.ttf"))
          if len(paths) != 7 or any(path.is_symlink() or not path.is_file() for path in paths):
              raise SystemExit("Graph seven source-bound SFNT files were not found")
          faces = [{"path": path.relative_to(font_dir).as_posix(),
                    "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                    "bytes": path.stat().st_size} for path in paths]
          receipt = {
              "schema": "motionwright.graph.sfnt-pango-g0/1",
              "source_sha": os.environ["GITHUB_SHA"],
              "status": "PASS",
              "executed": result.testsRun,
              "skipped": 0,
              "native_font_files": faces,
              "pango_scope": "REAL_LINUX_PRIVATE_FONTCONFIG_SOURCE_ONLY",
              "Native_Host": "NOT_RUN",
              "Graph_Save": "NOT_RUN",
              "G2": "NOT_GRANTED",
              "G3": "STOP",
          }
          dest = Path("knowledge/runtime/graph-fast-pango-sfnt-source.json")
          with dest.open("x", encoding="utf-8", newline="\n") as out:
              json.dump(receipt, out, indent=2, sort_keys=True)
              out.write("\n")
          print("Graph REAL private Linux Pango SFNT source PASS; no Native Host or Graph Save")
          PY
      - name: Verify original J1 reader, closed context and inspection source on Linux
        shell: bash
        run: |
          set -euo pipefail
          # Inert source fixtures only: no R74 statuses, Native Host, Store or G2.
          node --test apps/studio/tooling/graph-owner/producer_guard.test.mjs
          # Keep the existing Linux-only J1 source contract unchanged;
          # select initializer serialization, closed-context, Save and original CAS continuity.
          node --test \
            apps/studio/tooling/graph-owner/native_rpc_window.test.mjs \
            apps/studio/tooling/graph-owner/context_failure_decode.test.mjs \
            apps/studio/tooling/graph-owner/graph_inspection_lifecycle.test.mjs \
            apps/studio/tests/support/graph-owner/dev_live_reader_continuity.test.mjs
      - name: Retain bounded source-only result, even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: graph-fast-source-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            knowledge/runtime/graph-fast-source-result.json
            knowledge/runtime/graph-fast-gn1-unittest.original.log
            knowledge/runtime/graph-fast-sem-pin-audit.original.json
            knowledge/runtime/graph-fast-pango-sfnt-source.json
          if-no-files-found: warn
          retention-days: 7

  # Manual only; eight selected Studio source/editor tests. No native Graph effects.
  studio-graph-selected:
    # No native Graph effects; source/component tests only, never physical G2.
    name: Eight reviewed Studio Graph source regressions (not physical G2)
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'studio-selected') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: '1'
      NO_COLOR: '1'
      FORCE_COLOR: '0'
      EXPECTED_GRAPH_SHA: ${{ github.event_name == 'push' && github.sha || inputs.expected_source_sha }}
      GRAPH_SELECTED_BASE: ${{ github.event_name == 'push' && github.event.before || inputs.base_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 100
      - name: Select exact changed Studio sources, not a repeated full Graph run
        id: source_case
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_GRAPH_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GRAPH_SELECTED_BASE" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_GRAPH_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git cat-file -e "$GRAPH_SELECTED_BASE^{commit}"
          mkdir -p ci-evidence/graph-studio-selected
          printf '%s\n' "$GITHUB_SHA" > ci-evidence/graph-studio-selected/source-sha.original.txt
          python3 -B - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          selected_titles = {
              "apps/studio/src/semanticGraphDraft.test.ts": (
                  "removes the original saved UUID",
                  "still denies removal without the original source admission",
              ),
              "apps/studio/src/semanticGraph.test.ts": (
                  "suggests the earliest non-overlapping authored frame",
                  "uses the next edge when the first edge is full",
              ),
              "apps/studio/tests/semantic-graph-authority.spec.ts": (
                  "Graph removal uses the saved source",
                  "Graph flow adds sequential exact-frame events",
                  "Graph stale waypoint typing after removal cannot overwrite its successor",
                  "Vertex removal cannot silently remove edges, and flow exposes actual synthetic event controls",
              ),
          }
          impact = {
              ".github/workflows/graph-development-fast.yml",
              "apps/studio/src/SemanticGraphWorkbench.tsx",
              "apps/studio/src/semanticGraph.ts",
              "apps/studio/src/semanticGraphDraft.ts",
              "apps/studio/src/semanticGraph.test.ts",
              "apps/studio/src/semanticGraphDraft.test.ts",
              "apps/studio/tests/semantic-graph-authority.spec.ts",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", os.environ["GRAPH_SELECTED_BASE"], "HEAD"],
              text=True).splitlines())
          assert sum(map(len, selected_titles.values())) == 8
          ready = all(Path(path).is_file() and all(
              Path(path).read_text(encoding="utf-8").count(title) == 1
              for title in titles) for path, titles in selected_titles.items())
          affected = bool(changed & impact)
          selected = ready and (affected or os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch")
          state = "SELECTED_8_STUDIO_TESTS" if selected else "NOT_RUN_SOURCE_ROSTER_OR_IMPACT"
          Path("ci-evidence/graph-studio-selected/selection.original.json").write_text(
              json.dumps({"source_sha": os.environ["GITHUB_SHA"],
                          "base_sha": os.environ["GRAPH_SELECTED_BASE"],
                          "selection": state, "roster_present": ready,
                          "affected": affected}, sort_keys=True) + "\n",
              encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("selected=" + ("true" if selected else "false") + "\n")
          if selected:
              subprocess.run(["python3", "-B", "tooling/source_policy.py"], check=True)
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.source_case.outputs.selected == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - name: Install locked Studio test tools and verify editor security probe
        if: steps.source_case.outputs.selected == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix apps/studio --no-audit --no-fund
          node tooling/vite_editor_security_probe.mjs
      - name: Test exactly four changed Graph Vitest cases
        if: steps.source_case.outputs.selected == 'true'
        shell: bash
        run: |
          set -euo pipefail
          (
            cd apps/studio
            ./node_modules/.bin/vitest run \
              src/semanticGraphDraft.test.ts src/semanticGraph.test.ts \
              --testNamePattern 'removes the original saved UUID|still denies removal without the original source admission|suggests the earliest non-overlapping authored frame|uses the next edge when the first edge is full'
          ) 2>&1 | tee ci-evidence/graph-studio-selected/vitest.original.log
          python3 -B - <<'PY'
          from pathlib import Path
          import re
          raw = Path("ci-evidence/graph-studio-selected/vitest.original.log").read_text()
          plain = re.sub(r"\x1b\[[0-9;]*m", "", raw)
          assert re.search(r"\bTests\s+4 passed\b", plain), "EXPECTED_EXACT_4_VITEST"
          assert not re.search(r"\bTests\s+\d+ failed\b", plain), "VITEST_FAILED"
          PY
      - name: Prepare isolated Chromium browser
        if: steps.source_case.outputs.selected == 'true'
        shell: bash
        run: |
          set -euo pipefail
          (
            cd apps/studio
            ./node_modules/.bin/playwright install --with-deps chromium
          )
      - name: Test exactly four changed Graph source-component UI cases
        if: steps.source_case.outputs.selected == 'true'
        shell: bash
        run: |
          set -euo pipefail
          (
            cd apps/studio
            ./node_modules/.bin/playwright test \
              tests/semantic-graph-authority.spec.ts \
              --project=chromium --workers=1 \
              --grep 'Graph removal uses the saved source|Graph flow adds sequential exact-frame events|Graph stale waypoint typing after removal cannot overwrite its successor|Vertex removal cannot silently remove edges, and flow exposes actual synthetic event controls'
          ) 2>&1 | tee ci-evidence/graph-studio-selected/playwright.original.log
          python3 -B - <<'PY'
          from pathlib import Path
          import re
          raw = Path("ci-evidence/graph-studio-selected/playwright.original.log").read_text()
          plain = re.sub(r"\x1b\[[0-9;]*m", "", raw)
          assert re.search(r"(?m)^\s*4 passed\s*\(", plain), "EXPECTED_EXACT_4_PLAYWRIGHT"
          assert not re.search(r"(?m)^\s*[1-9]\d* failed\s*\(", plain), "PLAYWRIGHT_FAILED"
          PY
      - name: Hash retained original logs without writing status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-evidence/graph-studio-selected
          find ci-evidence/graph-studio-selected -name '*.original.log' -type f -print0 |
            sort -z | xargs -0 -r sha256sum \
              > ci-evidence/graph-studio-selected/originals.sha256
      - name: Retain exact selected source, Vitest and Playwright evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: graph-studio-selected-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/graph-studio-selected/
          retention-days: 7
          if-no-files-found: warn

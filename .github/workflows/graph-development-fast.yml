name: Graph fast development source checks

on:
  # A source-only push lane works on the integration branch before this
  # workflow is registered on default for optional workflow_dispatch.
  push:
    branches: ['integrate/phase1-final-composition-20261027']
    paths:
      - '.github/workflows/graph-development-fast.yml'
      - 'tooling/ci_graph_dev_fast.py'
      - '.github/workflows/graph-native-startup-dev.yml'
      - 'tooling/ci_graph_dev_native_startup.py'
      - 'tooling/tests/test_ci_graph_dev_native_startup.py'
      - 'tooling/tests/test_ci_graph_dev_native_budget.py'
      - 'tooling/ci_private_evidence.py'
      - 'tooling/requirements/mlt-g2-custody.txt'
      - 'tooling/tests/test_ci_graph_dev_fast.py'
      - 'tooling/native_graph_browser_owner.py'
      - 'tooling/ci_canvas_service.py'
      - 'tooling/tests/test_ci_canvas_service.py'
      - 'tooling/native_host_shared_state.py'
      - 'apps/studio/tests/support/graph-owner/**'
      - 'apps/studio/tooling/graph-owner/**'
      - 'SOURCE_LOCK.json'
      - 'Cargo.lock'
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact published Graph development source SHA
        type: string
        required: true
      base_sha:
        description: Existing ancestor commit to select changed source consumers
        type: string
        required: true

permissions:
  contents: read

# Safe to cancel: only inert source and fixture diagnostics run here.
# Authenticated R74, Native Host and physical acceptance are separate.
concurrency:
  group: graph-fast-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graph-source-intake:
    name: Graph first-case source intake (not Native G2)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      EXPECTED_GRAPH_SOURCE: ${{ github.event_name == 'push' && github.sha || inputs.expected_source_sha }}
      GRAPH_FAST_BASE: ${{ github.event_name == 'push' && github.event.before || inputs.base_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 32
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check exact source and first-case owner/producer intake
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$GITHUB_REF" = refs/heads/integrate/phase1-final-composition-20261027
          else
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
          fi
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REPOSITORY" = seradotcom/motionwright
          test "$GITHUB_SHA" = "$EXPECTED_GRAPH_SOURCE"
          mkdir -p knowledge/runtime
          python3 -B tooling/ci_graph_dev_fast.py --repo . \
            --base "$GRAPH_FAST_BASE" --expected-source "$GITHUB_SHA" \
            --mode fast --timeout-seconds 60 \
            --report knowledge/runtime/graph-fast-source-result.json
      - name: Verify GN1 startup and custody source contracts without Native effects
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/graph-fast-custody-venv"
          "$RUNNER_TEMP/graph-fast-custody-venv/bin/python" -m pip install \
            --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r tooling/requirements/mlt-g2-custody.txt
          "$RUNNER_TEMP/graph-fast-custody-venv/bin/python" -B -m unittest \
            tooling.tests.test_ci_graph_dev_native_startup \
            tooling.tests.test_ci_graph_dev_native_budget -v \
            2>&1 | tee knowledge/runtime/graph-fast-gn1-unittest.original.log
      - name: Verify original J1 Cargo reader and obsolete sandbox rejection on Linux
        shell: bash
        run: |
          set -euo pipefail
          # Inert source fixtures only: no R74 statuses, Native Host, Store or G2.
          node --test apps/studio/tooling/graph-owner/producer_guard.test.mjs
      - name: Retain bounded source-only result, even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: graph-fast-source-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            knowledge/runtime/graph-fast-source-result.json
            knowledge/runtime/graph-fast-gn1-unittest.original.log
          if-no-files-found: warn
          retention-days: 7

name: Verification Plan (shadow)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full lowercase comparison base; empty plans the entire candidate
        type: string
        required: false
        default: ""
      candidate:
        description: Plan all workflows and require full Studio scope when requested (no automatic matrix dispatch)
        type: boolean
        required: false
        default: true
      studio_service_source_sha:
        description: Exact product commit for the Windows real-service browser gate; empty leaves it unrequested
        type: string
        required: false
        default: ""
      studio_service_profile:
        description: Exact real-service case scope; a candidate requires full89
        type: choice
        required: false
        default: full89
        options:
          - full89
          - portable-export-4-plus-sidecar-control
          - damaged-project-row-negative-2
      package_link_source_sha:
        description: 'Optional exact reviewed source for four Linux package-link controls; empty leaves this job unselected'
        type: string
        required: false
        default: ''
      audit_source_currency:
        description: Run the strict source-currency audit; historical or insufficient evidence keeps exit 2
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Ordinary planning may supersede older cheap planning. An explicitly requested
# service or package-link gate retains its original run; it is never automatically retried.
concurrency:
  group: verification-plan-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && (inputs.studio_service_source_sha != '' || inputs.package_link_source_sha != '') && github.run_id || 'planning' }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.studio_service_source_sha != '' || inputs.package_link_source_sha != '')) }}

jobs:
  plan-and-contracts:
    name: Source-bound plan and conformance guardrails (shadow)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MW_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Require source and acceptance policy
        run: |
          python -B tooling/source_policy.py
          python -B tooling/acceptance_policy.py
      - name: Exercise conformance and selection controls in both real entrypoints
        shell: bash
        run: |
          python tooling/ci_test_runner.py --repo . \
            --test-directory tooling/tests \
            --pattern test_ci_impact_plan.py \
            --pattern test_studio_service_ci.py \
            --pattern test_studio_closed_store_readback.py \
            --pattern test_conformance_policy.py \
            --pattern test_conformance_currency_impact.py \
            --pattern test_acceptance_policy.py \
            --pattern test_acceptance_session.py \
            --pattern test_acceptance_evidence_identity.py \
            --pattern test_acceptance_cross_checkout.py \
            --mode both --expected-source "$MW_SOURCE_SHA" \
            --report "$RUNNER_TEMP/verification/g0-receipt.json" \
            --require-complete
      - name: Compute full-source shadow selection without dispatching jobs
        shell: python
        run: |
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          kind = os.environ["GITHUB_EVENT_NAME"]
          checkout = os.environ["GITHUB_SHA"]
          candidate = False
          if kind == "pull_request":
              base = event["pull_request"]["base"]["sha"]
              head = event["pull_request"]["head"]["sha"]
          elif kind == "push":
              base, head = event["before"], event["after"]
          elif kind == "workflow_dispatch":
              inputs = event.get("inputs") or {}
              base = inputs.get("base_sha") or checkout
              head = checkout
              candidate = (not inputs.get("base_sha") or
                           inputs.get("candidate") in (True, "true"))
          else:
              raise SystemExit("Unsupported source event")

          destination = Path(os.environ["RUNNER_TEMP"]) / "verification"
          destination.mkdir(parents=True, exist_ok=True)
          command = [
              sys.executable, "tooling/ci_impact_plan.py", "plan", "--repo", ".",
              "--repository", os.environ["GITHUB_REPOSITORY"], "--event", kind,
              "--base", base, "--head", head, "--checkout", checkout,
              "--output", str(destination / "impact-plan.json"),
          ]
          if candidate:
              command.append("--candidate")
          if kind == "pull_request":
              # Preserve the event base; reconcile only a proven descendant
              # first parent of this exact GitHub event checkout.
              command.append("--allow-advanced-pr-base")
          result = subprocess.run(command, capture_output=True, check=False)
          (destination / "plan-stdout.log").write_bytes(result.stdout)
          (destination / "plan-stderr.log").write_bytes(result.stderr)
          receipt = {
              "kind": "shadow-plan-execution", "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "event_sha": checkout, "workflow_sha": os.environ["GITHUB_WORKFLOW_SHA"],
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"], "argv": command,
              "exit_code": result.returncode,
              "stdout_sha256": hashlib.sha256(result.stdout).hexdigest(),
              "stderr_sha256": hashlib.sha256(result.stderr).hexdigest(),
              "executions_avoided": 0, "minutes_saved": 0,
              "product_test_verdict": "NOT_ASSERTED",
          }
          (destination / "planning-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          print(result.stdout.decode("utf-8", errors="replace"), end="")
          print(result.stderr.decode("utf-8", errors="replace"), end="", file=sys.stderr)
          if result.returncode:
              raise SystemExit(result.returncode)
          plan = json.loads((destination / "impact-plan.json").read_text())
          summary = (
              "## Shadow verification selection\n\n"
              f"Source: `{plan['source']['checkout_sha']}`\n\n"
              f"Plan: `{plan['plan_id']}`\n\n"
              f"Recommended workflows: {len(plan['selected_workflows'])}; "
              f"unknown paths: {len(plan['unknown_paths'])}; "
              f"unresolved dispositions: {len(plan['blockers'])}.\n\n"
              "Existing jobs remain unchanged. Executions avoided: 0. Minutes saved: 0. "
              "This run tests planning and evidence guardrails; it does not verify native output "
              "or establish release readiness.\n"
          )
          reconciled = plan["source"].get("pr_base_reconciliation")
          if reconciled and reconciled["advanced"]:
              summary += (
                  "\nThe PR event base remains recorded as "
                  f"`{reconciled['event_base_sha']}`; the exact merge first parent is "
                  f"`{reconciled['actual_merge_parent_sha']}`. "
                  "Their ancestry was verified and the full observed workflow inventory "
                  "was included in this shadow recommendation.\n"
              )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)
      - name: Preserve original planning and guardrail evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification
          if-no-files-found: error
          retention-days: 30

  windows-manifest-contracts:
    name: Windows manifest and NTFS conformance guardrails
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MW_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Exercise the complete manifest suite on real Windows in both entrypoints
        shell: pwsh
        env:
          # Private-evidence fixtures must be outside every source checkout.
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $verificationReport = Join-Path $env:RUNNER_TEMP 'verification-windows/g0-receipt.json'
          python -B -E -s tooling/ci_test_runner.py --repo . `
            --test-directory tooling/tests `
            --pattern test_acceptance_manifest_reparse.py `
            --mode both --expected-source "$env:MW_SOURCE_SHA" `
            --report "$verificationReport" --require-complete
          if ($LASTEXITCODE -ne 0) { throw 'The complete Windows manifest conformance suite failed' }
      - name: Preserve original Windows conformance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-windows-contracts-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification-windows
          if-no-files-found: error
          retention-days: 30

  source-currency-audit:
    name: Strict source-currency audit (manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.audit_source_currency }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
      VERIFIER_WORKFLOW_SHA: ${{ github.workflow_sha }}
      GIT_NO_REPLACE_OBJECTS: '1'
      GIT_GRAFT_FILE: /dev/null
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Bind the exact source and isolate the conformance verifier imports
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python3 -I -B -S - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          repo = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'source'
          env = {k: v for k, v in os.environ.items() if not k.startswith('GIT_')}
          env.update(GIT_NO_REPLACE_OBJECTS='1', GIT_GRAFT_FILE=os.devnull)
          def git(*args):
              p = subprocess.run(['git', '--no-replace-objects', '-C', str(repo), *args], env=env,
                                 capture_output=True, timeout=60, check=True)
              return p.stdout
          source = os.environ['EXPECTED_SOURCE_SHA']
          verifier = os.environ['VERIFIER_WORKFLOW_SHA']
          assert re.fullmatch('[0-9a-f]{40}', source) and re.fullmatch('[0-9a-f]{40}', verifier)
          assert git('rev-parse', 'HEAD').decode().strip() == source
          assert not git('status', '--porcelain', '--untracked-files=all', '--ignored=matching')
          tree = git('cat-file', '-p', source).splitlines()[0].decode().removeprefix('tree ')
          assert re.fullmatch('[0-9a-f]{40}', tree)
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / (
              'conformance-source-currency-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          root.mkdir(exist_ok=False)
          exports = root / 'verifier'
          exports.mkdir()
          names = [
              '.github/workflows/verification-plan.yml',
              'tooling/conformance_currency_impact.py', 'tooling/conformance_policy.py',
              'tooling/tests/test_conformance_currency_impact.py',
              'docs/acceptance/requirements-status.json',
              'docs/creative-production/requirements-status.json',
              'docs/acceptance/acceptance-status.json', 'SOURCE_LOCK.json', 'Cargo.lock']
          inputs = {}
          for name in names:
              entry = git('ls-tree', source, '--', name).decode().split()
              assert len(entry) == 4 and entry[0] in ('100644', '100755') and entry[1] == 'blob', name
              blob = git('cat-file', 'blob', entry[2])
              path = repo / name
              assert not path.is_symlink() and path.is_file() and path.read_bytes() == blob, name
              inputs[name] = {'sha256': hashlib.sha256(blob).hexdigest(), 'bytes': len(blob), 'git_blob': entry[2]}
              if name in ('tooling/conformance_currency_impact.py', 'tooling/conformance_policy.py'):
                  with (exports / path.name).open('xb') as stream:
                      stream.write(blob)
          workflow = '.github/workflows/verification-plan.yml'
          assert git('show', verifier + ':' + workflow) == git('show', source + ':' + workflow)
          manifest = {'schema': 'motionwright.conformance-currency-inputs/1', 'source_sha': source,
                      'source_tree': tree, 'verifier_workflow_sha': verifier, 'inputs': inputs,
                      'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                      'repository': os.environ['GITHUB_REPOSITORY'], 'job': os.environ['GITHUB_JOB']}
          (root / 'inputs.json').write_text(json.dumps(manifest, sort_keys=True, indent=2) + '\n')
          # The child starts outside both checkouts. All standard modules used by the original
          # tests are imported before the exact, exported conformance modules enter sys.path.
          runner = '''import copy, hashlib, importlib.util, json, os, pathlib, re, runpy, subprocess, sys, tempfile, unittest
          root = pathlib.Path(__file__).resolve().parent
          manifest = json.loads((root / "inputs.json").read_text())
          repo = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "source"
          env = {k: v for k, v in os.environ.items() if not k.startswith("GIT_")}
          env.update(GIT_NO_REPLACE_OBJECTS="1", GIT_GRAFT_FILE=os.devnull)
          os.environ.clear(); os.environ.update(env)
          def check():
              def git(*args):
                  return subprocess.run(["git", "--no-replace-objects", "-C", str(repo), *args],
                                        capture_output=True, timeout=60, check=True).stdout
              assert git("rev-parse", "HEAD").decode().strip() == manifest["source_sha"]
              assert not git("status", "--porcelain", "--untracked-files=all", "--ignored=matching")
              for name, desc in manifest["inputs"].items():
                  p = repo / name
                  assert not p.is_symlink() and hashlib.sha256(p.read_bytes()).hexdigest() == desc["sha256"], name
          check()
          exports = root / "verifier"
          for name in ("conformance_policy", "conformance_currency_impact"):
              path = exports / (name + ".py")
              assert hashlib.sha256(path.read_bytes()).hexdigest() == manifest["inputs"]["tooling/" + name + ".py"]["sha256"]
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              sys.modules[name] = module
              spec.loader.exec_module(module)
          mode = sys.argv[1]
          if mode == "contracts":
              suite = unittest.defaultTestLoader.discover(str(repo / "tooling/tests"), pattern="test_conformance_currency_impact.py")
              discovered = suite.countTestCases()
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              code = 0 if (discovered > 0 and result.testsRun == discovered and result.wasSuccessful()
                           and not result.skipped and not result.expectedFailures and not result.unexpectedSuccesses) else 1
              detail = {"discovered": discovered, "executed": result.testsRun, "failures": len(result.failures),
                        "errors": len(result.errors), "skipped": len(result.skipped),
                        "expected_failures": len(result.expectedFailures), "unexpected_successes": len(result.unexpectedSuccesses)}
              (root / "contracts-counts.json").write_text(json.dumps(detail, sort_keys=True) + "\\n")
          elif mode == "strict":
              code = sys.modules["conformance_currency_impact"].main([
                  "--repo", str(repo), "--target", manifest["source_sha"],
                  "--json", str(root / "source-currency.json"), "--strict"])
          else:
              raise ValueError("Unknown verification mode")
          check()
          raise SystemExit(code)
          '''
          (root / 'runner.py').write_text(runner, encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write('CURRENCY_ROOT=' + str(root) + '\n')
          print(json.dumps({'source_sha': source, 'source_tree': tree, 'verifier_workflow_sha': verifier,
                            'bound_inputs': len(inputs)}))
          PY
      - name: Run the original source-currency contracts without omissions
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set +e
          python3 -I -B -S "$CURRENCY_ROOT/runner.py" contracts > "$CURRENCY_ROOT/contracts.stdout" 2> "$CURRENCY_ROOT/contracts.stderr"
          result=$?
          printf '%s\n' "$result" > "$CURRENCY_ROOT/contracts.exit"
          cat "$CURRENCY_ROOT/contracts.stdout" "$CURRENCY_ROOT/contracts.stderr"
          exit "$result"
      - name: Reject historical PASS on the exact checked-out SHA
        if: ${{ !cancelled() && env.CURRENCY_ROOT != '' }}
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set +e
          python3 -I -B -S "$CURRENCY_ROOT/runner.py" strict > "$CURRENCY_ROOT/strict.stdout" 2> "$CURRENCY_ROOT/strict.stderr"
          result=$?
          printf '%s\n' "$result" > "$CURRENCY_ROOT/strict.exit"
          cat "$CURRENCY_ROOT/strict.stdout" "$CURRENCY_ROOT/strict.stderr"
          exit "$result"
      - name: Preserve the actual exits and source-bound evidence
        if: ${{ always() && env.CURRENCY_ROOT != '' }}
        working-directory: ${{ runner.temp }}
        shell: bash
        env:
          OBSERVED_JOB_STATUS: ${{ job.status }}
        run: |
          python3 -I -B -S - <<'PY'
          import hashlib, json, os, pathlib, platform, sys
          root = pathlib.Path(os.environ['CURRENCY_ROOT'])
          inputs = json.loads((root / 'inputs.json').read_bytes())
          names = ['inputs.json', 'contracts-counts.json', 'contracts.stdout', 'contracts.stderr',
                   'contracts.exit', 'source-currency.json', 'strict.stdout', 'strict.stderr', 'strict.exit']
          evidence = {}
          for name in names:
              path = root / name
              if path.is_file() and not path.is_symlink():
                  data = path.read_bytes()
                  evidence[name] = {'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}
          exits = {name: (root / (name + '.exit')).read_text().strip()
                   if (root / (name + '.exit')).is_file() else None for name in ('contracts', 'strict')}
          complete = all(name in evidence for name in names)
          receipt = {**inputs, 'schema': 'motionwright.conformance-currency-execution/1', 'exits': exits,
                     'status': 'PASS_WITHIN_SOURCE_CURRENCY_SCOPE' if complete and exits == {'contracts': '0', 'strict': '0'} and os.environ['OBSERVED_JOB_STATUS'] == 'success' else 'NOT_ADMITTED',
                     'job_status': os.environ['OBSERVED_JOB_STATUS'], 'python': sys.version,
                     'platform': platform.platform(),
                     'python_executable_sha256': hashlib.sha256(pathlib.Path(sys.executable).resolve().read_bytes()).hexdigest(),
                     'runner_sha256': hashlib.sha256((root / 'runner.py').read_bytes()).hexdigest(),
                     'evidence': evidence, 'formal_verdict': None,
                     'release_authorized': False, 'historical_pass_transferred': False}
          (root / 'receipt.json').write_text(json.dumps(receipt, sort_keys=True, indent=2) + '\n')
          print(json.dumps({'source_sha': receipt['source_sha'], 'exits': exits, 'status': receipt['status']}))
          if not complete:
              raise SystemExit('Missing execution evidence; omitted results cannot pass')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && env.CURRENCY_ROOT != '' }}
        with:
          name: conformance-source-currency-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ env.CURRENCY_ROOT }}/inputs.json
            ${{ env.CURRENCY_ROOT }}/receipt.json
            ${{ env.CURRENCY_ROOT }}/contracts-counts.json
            ${{ env.CURRENCY_ROOT }}/contracts.stdout
            ${{ env.CURRENCY_ROOT }}/contracts.stderr
            ${{ env.CURRENCY_ROOT }}/contracts.exit
            ${{ env.CURRENCY_ROOT }}/source-currency.json
            ${{ env.CURRENCY_ROOT }}/strict.stdout
            ${{ env.CURRENCY_ROOT }}/strict.stderr
            ${{ env.CURRENCY_ROOT }}/strict.exit

  g0-complete:
    name: G0 verification complete
    needs: [plan-and-contracts, windows-manifest-contracts]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both source-bound G0 jobs to succeed
        shell: python
        env:
          G0_JOB_RESULTS: ${{ toJSON(needs) }}
          MW_SOURCE_SHA: ${{ github.sha }}
        run: |
          import json
          import os

          required = {"plan-and-contracts", "windows-manifest-contracts"}
          observed = json.loads(os.environ["G0_JOB_RESULTS"])
          if not isinstance(observed, dict) or set(observed) != required:
              raise SystemExit("G0 requires exactly the Linux and Windows job results")
          results = {
              job: value.get("result") if isinstance(value, dict) else None
              for job, value in observed.items()
          }
          if any(result != "success" for result in results.values()):
              raise SystemExit("G0 incomplete: " + json.dumps(results, sort_keys=True))
          print("G0 guardrails complete for source " + os.environ["MW_SOURCE_SHA"]
                + ": Linux and Windows jobs succeeded; native product verification is not asserted")

  studio-service-windows:
    name: Selected Windows Studio real service
    needs: g0-complete
    if: github.event_name == 'workflow_dispatch' && inputs.studio_service_source_sha != ''
    uses: ./.github/workflows/studio-service-contracts.yml
    with:
      source_sha: ${{ inputs.studio_service_source_sha }}
      verification_profile: ${{ inputs.studio_service_profile }}
      release_candidate: ${{ inputs.candidate }}

  package-link-contracts:
    name: Four original Linux package-link contracts
    needs: [g0-complete]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_link_source_sha != '' && needs['g0-complete'].result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MW_LINK_SOURCE_SHA: ${{ inputs.package_link_source_sha }}
      MW_LINK_VERIFIER: ${{ github.workspace }}/link-verifier
      MW_LINK_SOURCE: ${{ github.workspace }}/link-source
    steps:
      - name: Require the reviewed source before checkout
        shell: bash
        run: |
          test "$MW_LINK_SOURCE_SHA" = fa9503bd46e41598b54a8343d69e6a6150be1850
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: link-verifier
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.package_link_source_sha }}
          path: link-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Execute the four reviewed original unittest IDs once
        env:
          MW_LINK_OUTPUT: ${{ runner.temp }}/package-link-contracts-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          python -B -I -S - <<'PY'
          """Execute only the reviewed Linux package-link controls on their original source."""
          import sys
          if not (sys.flags.isolated and sys.flags.no_site and sys.dont_write_bytecode):
              raise SystemExit("Use Python -B -I -S")
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          from datetime import datetime, timezone

          REVIEWED_SOURCE = "fa9503bd46e41598b54a8343d69e6a6150be1850"
          REVIEWED_TREE = "e09a821440fa789723060d495d363edb767fd40c"
          FROZEN_INPUTS = {
              "tooling/tests/test_candidate_smoke.py": "4727101162ef882ebde26d7203fe232d6c09cc3132f751d1000ee573cff6ac17",
              "tooling/candidate_smoke.py": "053bb9a38cde20c7df6a15c6916e0faddf44a6bed6c10127bba88dfbe71bf339",
              "tooling/tests/test_linux_cold_start.py": "8a9c3b9ed306b7267fcd0d1d4d22014bf4551f347f09e860f43b6d459b52933d",
              "tooling/linux_cold_start.py": "c8dd5e73b9deea491877cff0b2d7e3a617e3bbcde1c994a013a4122348918ab9",
              "tooling/linux_gui_probe.py": "e572c604d8d2e33e0904797c28e4252c0158393e60e6c2ece7158112d5e8eaa8",
              "tooling/ci_test_runner.py": "b7d39ad4c94be70abcac75880f92d00cf3c8d49eb0198b404a962ce5ab1a712f",
          }
          DATA_INPUTS = ("SOURCE_LOCK.json", "Cargo.toml", "Cargo.lock", "apps/desktop/src-tauri/tauri.conf.json")
          CASE_IDS = (
              "tooling.tests.test_candidate_smoke.CandidateSmokeTests.test_appimage_internal_desktop_symlink_is_allowed_but_escape_is_not",
              "tooling.tests.test_candidate_smoke.CandidateSmokeTests.test_symlink_substitution_is_rejected",
              "tooling.tests.test_linux_cold_start.InstalledColdStartEvidenceTests.test_unsafe_or_missing_database_rejected_before_inspection",
              "tooling.tests.test_linux_cold_start.InstalledColdStartEvidenceTests.test_nested_directory_symlink_is_never_followed",
          )

          def require(value, message):
              if not value:
                  raise ValueError(message)

          def now():
              return datetime.now(timezone.utc).isoformat()

          def digest(raw):
              return hashlib.sha256(raw).hexdigest()

          def identity(path):
              raw = path.read_bytes()
              return {"bytes": len(raw), "sha256": digest(raw)}

          def write_new(path, value):
              with path.open("x", encoding="utf-8", newline="\n") as handle:
                  json.dump(value, handle, indent=2, sort_keys=True)
                  handle.write("\n")

          context = {key: os.environ.get(key, "") for key in (
              "GITHUB_REPOSITORY", "GITHUB_EVENT_NAME", "GITHUB_SHA", "GITHUB_WORKFLOW_SHA",
              "GITHUB_WORKFLOW_REF", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_JOB")}
          source = Path(os.environ["MW_LINK_SOURCE"]).resolve(strict=True)
          verifier = Path(os.environ["MW_LINK_VERIFIER"]).resolve(strict=True)
          output = Path(os.environ["MW_LINK_OUTPUT"]).absolute()
          require(not output.exists(), "Output must be new; no replay or overwrite")
          require(output not in (source, verifier) and source not in output.parents
                  and verifier not in output.parents, "Result output must stay outside both checkouts")
          output.mkdir(parents=True, exist_ok=False)
          receipt = {"schema": "motionwright.linux-package-link-contracts/1", "status": "STARTED",
                     "started_at_utc": now(), "github": context,
                     "requested_source_sha": os.environ.get("MW_LINK_SOURCE_SHA"),
                     "reviewed_source_sha": REVIEWED_SOURCE, "test_ids": list(CASE_IDS),
                     "tests_expected": 4, "process_attempted": False, "process_started": None, "retry_attempted": False,
                     "scope": "Synthetic package and SQLite-path confinement with real Linux symbolic links",
                     "database_seeding": False, "installed_application_execution": False,
                     "native_renderer_execution": False, "formal_acceptance": False, "release_verdict": False,
                     "counts": None, "exit_code": None,
                     "capture_limit": "120-second subprocess timeout; no hard stream byte-cap claim"}
          write_new(output / "start.json", receipt)
          exit_code = 1
          try:
              require(sys.platform == "linux", "These controls require an actual Linux interpreter")
              require(context["GITHUB_REPOSITORY"] == "seradotcom/motionwright"
                      and context["GITHUB_EVENT_NAME"] == "workflow_dispatch", "Manual repository scope required")
              require(all(context.values()), "Missing workflow/run/job context")
              require(context["GITHUB_JOB"] == "package-link-contracts", "Wrong workflow job")
              require(os.environ["MW_LINK_SOURCE_SHA"] == REVIEWED_SOURCE,
                      "This frozen four-case profile needs source review before another SHA")
              require(re.fullmatch(r"[0-9a-f]{40}", context["GITHUB_SHA"])
                      and context["GITHUB_WORKFLOW_SHA"] == context["GITHUB_SHA"], "Verifier workflow source differs")
              git_path = Path(shutil.which("git") or "").resolve(strict=True)
              require(git_path.is_file() and source not in git_path.parents and verifier not in git_path.parents,
                      "Git must be a runner tool outside both checkouts")
              clean_env = {key: value for key, value in os.environ.items() if not key.upper().startswith("GIT_")}
              clean_env.update(GIT_NO_REPLACE_OBJECTS="1", GIT_GRAFT_FILE=os.devnull, GIT_NO_LAZY_FETCH="1",
                               GIT_CONFIG_NOSYSTEM="1", GIT_CONFIG_GLOBAL=os.devnull, GIT_OPTIONAL_LOCKS="0",
                               PYTHONDONTWRITEBYTECODE="1")
              os.environ.clear()
              os.environ.update(clean_env)
              def git(root, *args):
                  process = subprocess.run([str(git_path), "--no-replace-objects", "-c", "core.fsmonitor=false",
                                            "-C", str(root), *args], capture_output=True, timeout=30, env=clean_env)
                  require(type(process.returncode) is int and process.returncode == 0, "Git source read failed")
                  return process.stdout
              require(git(source, "rev-parse", "HEAD").decode().strip() == REVIEWED_SOURCE,
                      "Actual tested checkout is not the reviewed source")
              require(git(verifier, "rev-parse", "HEAD").decode().strip() == context["GITHUB_SHA"],
                      "Actual verifier checkout differs from this workflow")
              for root in (source, verifier):
                  require(not git(root, "status", "--porcelain", "--untracked-files=all", "--ignored=matching"),
                          "Source and verifier must be clean before execution")
              commit = git(source, "cat-file", "commit", REVIEWED_SOURCE)
              require(hashlib.sha1(b"commit " + str(len(commit)).encode() + b"\0" + commit).hexdigest() == REVIEWED_SOURCE,
                      "Source commit object identity differs")
              tree = commit.split(b"\n", 1)[0].decode().removeprefix("tree ")
              require(tree == REVIEWED_TREE, "Source tree differs from reviewed original")
              source_inputs = {}
              for relative in (*FROZEN_INPUTS, *DATA_INPUTS):
                  path = source / relative
                  require(path.is_file() and not path.is_symlink(), "Source dependency is not a regular file")
                  raw = path.read_bytes()
                  require(len(raw) <= 1024 * 1024 and raw == git(source, "show", REVIEWED_SOURCE + ":" + relative),
                          "Physical source dependency differs from its original Git blob")
                  if relative in FROZEN_INPUTS:
                      require(digest(raw) == FROZEN_INPUTS[relative], "Reviewed source dependency changed")
                  source_inputs[relative] = {"bytes": len(raw), "sha256": digest(raw)}
              workflow_path = verifier / ".github/workflows/verification-plan.yml"
              require(workflow_path.read_bytes() == git(verifier, "show", context["GITHUB_SHA"] + ":.github/workflows/verification-plan.yml"),
                      "Physical verifier workflow differs from Git")
              spec = importlib.util.spec_from_file_location("original_ci_test_runner", source / "tooling/ci_test_runner.py")
              require(spec is not None and spec.loader is not None, "Original unittest runner cannot be loaded")
              original = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(original)
              before = original.source_state(source, REVIEWED_SOURCE)
              require(before["tree_sha"] == tree, "Original runner source observation differs")
              receipt.update(executed_source_sha=REVIEWED_SOURCE, tree_sha=tree,
                             verifier_source_sha=context["GITHUB_SHA"],
                             verifier_tree_sha=git(verifier, "rev-parse", "HEAD^{tree}").decode().strip(),
                             verifier_workflow=identity(workflow_path), source_inputs=source_inputs,
                             original_runner_sha256=identity(source / "tooling/ci_test_runner.py")["sha256"],
                             python=sys.version, python_executable=identity(Path(sys.executable)), git_executable=identity(git_path))
              temporary = output / "fixtures"
              temporary.mkdir(exist_ok=False)
              child_env = dict(clean_env, TMPDIR=str(temporary), TEMP=str(temporary), TMP=str(temporary))
              command = [sys.executable, "-B", "-E", "-s", "-m", "unittest", *CASE_IDS, "-v"]
              receipt.update(command=command, process_attempted=True, process_attempted_at_utc=now())
              process_binding = {
                  "github": context, "command": command, "cwd": str(source),
                  "fixture_directory": str(temporary), "test_ids": list(CASE_IDS), "timeout_seconds": 120,
                  "source_sha": receipt["executed_source_sha"], "source_tree": receipt["tree_sha"],
                  "source_inputs": source_inputs, "verifier_sha": receipt["verifier_source_sha"],
                  "verifier_tree": receipt["verifier_tree_sha"], "verifier_workflow": receipt["verifier_workflow"],
                  "python": receipt["python"], "python_executable": receipt["python_executable"],
                  "git_executable": receipt["git_executable"], "retry_attempted": False,
                  "installed_application_execution": False, "formal_acceptance": False, "release_verdict": False,
              }
              write_new(output / "process-intent.json", {
                  **process_binding, "schema": "motionwright.linux-package-link-process-intent/1",
                  "state": "UNKNOWN_UNTIL_OUTCOME", "at_utc": receipt["process_attempted_at_utc"],
                  "process_attempted": True, "process_started": None,
                  "outcome_journal": "process-outcome.json", "semantic_result_admitted": False,
              })
              timed_out = False
              try:
                  completed = subprocess.run(command, cwd=source, env=child_env, capture_output=True, timeout=120)
                  stdout, stderr, returncode = completed.stdout, completed.stderr, completed.returncode
              except subprocess.TimeoutExpired as error:
                  stdout, stderr, returncode = error.stdout or b"", error.stderr or b"", 124
                  timed_out = True
              write_new(output / "process-outcome.json", {
                  **process_binding, "schema": "motionwright.linux-package-link-process-outcome/1",
                  "state": "TIMED_OUT_UNKNOWN" if timed_out else "PROCESS_RETURN_OBSERVED_UNASSESSED",
                  "at_utc": now(), "process_started": True, "timed_out": timed_out,
                  "original_exit_code": None if timed_out else returncode,
                  "wrapper_timeout_exit_code": 124 if timed_out else None,
                  "logs": {
                      "stdout": {"file": "stdout.log", "captured_bytes": len(stdout), "written": False},
                      "stderr": {"file": "stderr.log", "captured_bytes": len(stderr), "written": False},
                  },
                  "log_custody_recorded_later_in": "receipt.json", "semantic_result_admitted": False,
              })
              receipt.update(process_started=True, process_completed_at_utc=now(), process_timed_out=timed_out, exit_code=returncode)
              for stream, data in (("stdout", stdout), ("stderr", stderr)):
                  log = output / (stream + ".log")
                  with log.open("xb") as handle:
                      handle.write(data)
                  receipt[stream] = {"file": log.name, "bytes": len(data), "sha256": digest(data)}
              try:
                  counts = original.parse_unittest_summary(stderr.decode("utf-8", "strict"))
                  receipt["counts"] = counts
              except (ValueError, UnicodeError) as error:
                  counts = None
                  receipt["summary_error"] = type(error).__name__ + ": " + str(error)
              try:
                  require(original.source_state(source, REVIEWED_SOURCE) == before, "Tested source changed during execution")
                  require(all(identity(source / name) == value for name, value in source_inputs.items()),
                          "A source dependency changed during execution")
                  require(not git(verifier, "status", "--porcelain", "--untracked-files=all", "--ignored=matching")
                          and identity(workflow_path) == receipt["verifier_workflow"], "Verifier source changed during execution")
                  receipt["source_and_verifier_unchanged"] = True
              except BaseException as error:
                  receipt["source_postcheck_error"] = type(error).__name__ + ": " + str(error)
              if timed_out:
                  receipt["status"] = "UNKNOWN"
                  raise TimeoutError("Original unittest process timed out; no replay")
              require(type(returncode) is int and returncode == 0, "Selected original unittest process failed")
              require(counts is not None, "Original unittest summary is incomplete")
              require(receipt.get("source_and_verifier_unchanged") is True, "Source postcheck did not complete")
              require(counts["terminal_status"] == "OK"
                      and type(counts["tests_run"]) is int and counts["tests_run"] == 4
                      and type(counts["passed"]) is int and counts["passed"] == 4
                      and all(type(counts[key]) is int and counts[key] == 0 for key in
                              ("errors", "failures", "skipped", "expected_failures", "unexpected_successes")),
                      "Four original controls must finish with zero omissions")
              parsed_view = stderr.decode("utf-8", "strict").replace("\r\n", "\n").replace("\r", "\n")
              observed = re.findall(r"(?m)^test_\w+ \(([^()\n]+)\) \.\.\. ok$", parsed_view)
              require(len(observed) == 4 and set(observed) == set(CASE_IDS), "Verbose original case IDs differ")
              receipt.update(status="PASS_SELECTED_LINUX_LINK_CONTRACTS", original_case_ids=observed,
                             source_and_verifier_unchanged=True, unique_source_controls=4, new_product_cases=0)
              exit_code = 0
          except BaseException as error:
              if isinstance(error, (KeyboardInterrupt, SystemExit)) and receipt["process_attempted"]:
                  receipt["status"] = "UNKNOWN"
              elif receipt["status"] != "UNKNOWN":
                  receipt["status"] = "FAIL"
              receipt["error"] = type(error).__name__ + ": " + str(error)
              exit_code = 124 if receipt["status"] == "UNKNOWN" else 1
          receipt["completed_at_utc"] = now()
          receipt["wrapper_exit_code"] = exit_code
          write_new(output / "receipt.json", receipt)
          print(json.dumps({"status": receipt["status"], "source_sha": receipt.get("executed_source_sha"),
                            "verifier_sha": receipt.get("verifier_source_sha"), "counts": receipt["counts"],
                            "installed_application_execution": False, "formal_acceptance": False}))
          raise SystemExit(exit_code)
          PY
      - name: Preserve original Linux link-contract results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-package-link-contracts-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-link-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30

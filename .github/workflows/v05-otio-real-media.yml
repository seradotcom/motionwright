          import hashlib, json, os, pathlib, re, subprocess
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "otio-owner-cut-rust"
          root.mkdir(exist_ok=False)
          expected = {
              "tests::sqlite_owner_cut_commits_once_and_reopens_preserving_editable_source",
              "tests::retained_unknown_intent_prevents_any_second_apply",
              "tests::concurrent_source_change_rejects_before_owner_intent_or_commit",
          }
          def source():
              head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
              if head != os.environ["GITHUB_SHA"]:
                  raise ValueError("Owner-cut test source differs from dispatch")
              if subprocess.check_output(["git", "status", "--porcelain", "--untracked-files=no"]).strip():
                  raise ValueError("Owner-cut test source is dirty")
              paths = ["crates/native/examples/native_otio_owner_cut_e2e.rs", "Cargo.lock",
                       "SOURCE_LOCK.json", ".github/workflows/v05-otio-real-media.yml"]
              return {"sha": head,
                      "tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
                      "files": {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths}}
          before = source()
          argv = ["cargo", "test", "--locked", "-p", "motionwright-native",
                  "--example", "native_otio_owner_cut_e2e", "--", "--nocapture"]
          receipt = {"schema": "motionwright.native.otio-owner-cut-required-rust/1",
                     "source_before": before, "run_id": os.environ["GITHUB_RUN_ID"],
                     "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"], "command": argv,
                     "required": sorted(expected), "state": "INTENT", "automatic_retry": False,
                     "native_execution": False, "human_acceptance": False, "release_authorized": False}
          def retain():
              (root / "receipt.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          retain()
          try:
              result = subprocess.run(argv, capture_output=True, timeout=1200)
              stdout, stderr, code = result.stdout, result.stderr, result.returncode
          except subprocess.TimeoutExpired as original:
              stdout, stderr, code = original.stdout or b"", original.stderr or b"", 124
              receipt["state"] = "UNKNOWN_NO_RETRY"
          for label, raw in (("stdout", stdout), ("stderr", stderr)):
              with (root / (label + ".log")).open("xb") as stream:
                  stream.write(raw)
              receipt[label] = {"bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()}
          receipt["exit_code"] = code
          retain()
          view = stdout.decode("utf-8", "replace").replace("\r\n", "\n")
          names = re.findall(r"^test (\S+) \.\.\. ok$", view, re.M)
          summaries = re.findall(r"^test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored;", view, re.M)
          receipt["source_after"] = source()
          complete = (code == 0 and len(names) == 3 and set(names) == expected
                      and summaries == [("3", "0", "0")] and receipt["source_after"] == before)
          receipt.update(state="PASS" if complete else receipt["state"] if code == 124 else "FAIL",
                         observed=names, tests_run=len(names))
          retain()
          print(json.dumps(receipt, sort_keys=True))
          if not complete:
              raise SystemExit("Every original owner-cut Rust case must actually execute once")
          PY

name: V05 OTIO real media source interchange

on:
  workflow_dispatch:
    inputs:
      verification_scope:
        description: 'Source, accessibility observation, Kdenlive roundtrip, or admitted ALab metadata only'
        type: choice
        options: [source, accessibility-only, kdenlive-gui, external-alab-readonly]
        default: source
        required: true
      expected_source_sha:
        description: 'Exact source SHA; required for every explicit native selection'
        type: string
        default: ''
        required: false
      evidence_recipient:
        description: 'Existing admitted RSA-3072 public recipient JSON; required for native selections'
        type: string
        default: ''
        required: false
      external_alab_admission:
        description: 'Reviewed frozen ALab admission JSON; required only for external-alab-readonly'
        type: string
        default: ''
        required: false
      external_alab_admission_sha256:
        description: 'Exact SHA-256 of the supplied frozen ALab admission bytes'
        type: string
        default: ''
        required: false
  pull_request:
    paths:
      - 'tooling/otio-media/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'SOURCE_LOCK.json'
      - 'rust-toolchain.toml'
      - 'tooling/ci_private_evidence.py'
      - 'tooling/ci_otio_alab_readonly.py'
      - 'tooling/tests/test_ci_otio_alab_readonly.py'
      - 'tooling/ci_alab_source_control_custody.py'
      - 'tooling/tests/test_ci_alab_source_control_custody.py'
      - 'tooling/ci_test_runner.py'
      - 'tooling/cross_app_public_artifact.py'
      - 'tooling/mlt_official_runtime_intake.py'
      - 'tooling/requirements/mlt-g2-custody.txt'
      - 'crates/domain/**'
      - 'crates/storage/**'
      - 'crates/service/**'
      - 'crates/manim-profile/**'
      - 'crates/hyperframes-profile/**'
      - 'crates/native/**'
      - 'docs/creative-production/V05_OTIO_MEDIA_INTERCHANGE.md'
      - '.github/workflows/v05-otio-real-media.yml'
  push:
    branches: ['main']
    paths:
      - 'tooling/otio-media/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'SOURCE_LOCK.json'
      - 'rust-toolchain.toml'
      - 'tooling/ci_private_evidence.py'
      - 'tooling/ci_otio_alab_readonly.py'
      - 'tooling/tests/test_ci_otio_alab_readonly.py'
      - 'tooling/ci_alab_source_control_custody.py'
      - 'tooling/tests/test_ci_alab_source_control_custody.py'
      - 'tooling/ci_test_runner.py'
      - 'tooling/cross_app_public_artifact.py'
      - 'tooling/mlt_official_runtime_intake.py'
      - 'tooling/requirements/mlt-g2-custody.txt'
      - 'crates/domain/**'
      - 'crates/storage/**'
      - 'crates/service/**'
      - 'crates/manim-profile/**'
      - 'crates/hyperframes-profile/**'
      - 'crates/native/**'
      - 'docs/creative-production/V05_OTIO_MEDIA_INTERCHANGE.md'
      - '.github/workflows/v05-otio-real-media.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_scope != 'source' && format('kdenlive-native-exclusive-{0}', github.repository) || format('v05-otio-media-{0}', github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.verification_scope != 'source') }}

jobs:
  verified-native-rust-otio-and-open-timeline-io:
    if: github.event_name != 'workflow_dispatch' || inputs.verification_scope == 'source'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify ALab caller source contracts without external media
        id: alab_source_g0
        run: |
          set -euo pipefail
          python3 -m pip install --only-binary=:all: --require-hashes \
            -r tooling/requirements/mlt-g2-custody.txt
          python3 -B tooling/ci_test_runner.py \
            --pattern test_ci_otio_alab_readonly.py --pattern test_ci_alab_source_control_custody.py \
            --mode discovery --require-complete \
            --expected-source "$GITHUB_SHA" --timeout 120 \
            --report "$RUNNER_TEMP/alab-caller-g0.json"
      - name: Close bounded ALab g0 source-control originals
        id: alab_g0_custody
        if: always()
        env:
          SOURCE_CONTROL_STEP_OUTCOME: ${{ steps.alab_source_g0.outcome }}
        run: |
          set -euo pipefail
          python3 -B tooling/ci_alab_source_control_custody.py \
            --profile g0 --expected-source "$GITHUB_SHA" \
            --step-outcome "$SOURCE_CONTROL_STEP_OUTCOME" --github-output "$GITHUB_OUTPUT"
      - name: Retain the closed ALab g0 source-control artifact
        if: always() && steps.alab_g0_custody.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: alab-source-controls-g0-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.alab_g0_custody.outputs.directory }}/source-control-originals.tar
            ${{ steps.alab_g0_custody.outputs.directory }}/source-control-custody.json
          if-no-files-found: error
          retention-days: 7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: native-otio-real-media-1.98.1
          cache-on-failure: true
      - name: Verify existing canonical Rust exporter and new original source fixture
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked -p motionwright-domain otio_export_is_linear_and_carries_an_explicit_loss_report
          cargo clippy --locked -p motionwright-domain --example otio_real_media_fixture -- -D warnings
          cargo build --locked -p motionwright-domain --example otio_real_media_fixture
          cargo clippy --locked -p motionwright-native --example native_otio_owner_cut_e2e -- -D warnings
          cargo build --locked -p motionwright-native --example native_otio_owner_cut_e2e
          python3 -m py_compile tooling/otio-media/*.py
          python3 tooling/source_policy.py
          python3 tooling/creative_status_policy.py
      - name: Require the three original owner-cut Rust cases
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "otio-owner-cut-rust"
          root.mkdir(exist_ok=False)
          expected = {
              "tests::sqlite_owner_cut_commits_once_and_reopens_preserving_editable_source",
              "tests::retained_unknown_intent_prevents_any_second_apply",
              "tests::concurrent_source_change_rejects_before_owner_intent_or_commit",
          }
          def source():
              head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
              if head != os.environ["GITHUB_SHA"]:
                  raise ValueError("Owner-cut test source differs from dispatch")
              if subprocess.check_output(["git", "status", "--porcelain", "--untracked-files=no"]).strip():
                  raise ValueError("Owner-cut test source is dirty")
              paths = ["crates/native/examples/native_otio_owner_cut_e2e.rs", "Cargo.lock",
                       "SOURCE_LOCK.json", ".github/workflows/v05-otio-real-media.yml"]
              return {"sha": head,
                      "tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
                      "files": {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths}}
          before = source()
          argv = ["cargo", "test", "--locked", "-p", "motionwright-native",
                  "--example", "native_otio_owner_cut_e2e", "--", "--nocapture"]
          receipt = {"schema": "motionwright.native.otio-owner-cut-required-rust/1",
                     "source_before": before, "run_id": os.environ["GITHUB_RUN_ID"],
                     "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"], "command": argv,
                     "required": sorted(expected), "state": "INTENT", "automatic_retry": False,
                     "native_execution": False, "human_acceptance": False, "release_authorized": False}
          def retain():
              (root / "receipt.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          retain()
          try:
              result = subprocess.run(argv, capture_output=True, timeout=1200)
              stdout, stderr, code = result.stdout, result.stderr, result.returncode
          except subprocess.TimeoutExpired as original:
              stdout, stderr, code = original.stdout or b"", original.stderr or b"", 124
              receipt["state"] = "UNKNOWN_NO_RETRY"
          for label, raw in (("stdout", stdout), ("stderr", stderr)):
              with (root / (label + ".log")).open("xb") as stream:
                  stream.write(raw)
              receipt[label] = {"bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()}
          receipt["exit_code"] = code
          retain()
          view = stdout.decode("utf-8", "replace").replace("\r\n", "\n")
          names = re.findall(r"^test (\S+) \.\.\. ok$", view, re.M)
          summaries = re.findall(r"^test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored;", view, re.M)
          receipt["source_after"] = source()
          complete = (code == 0 and len(names) == 3 and set(names) == expected
                      and summaries == [("3", "0", "0")] and receipt["source_after"] == before)
          receipt.update(state="PASS" if complete else receipt["state"] if code == 124 else "FAIL",
                         observed=names, tests_run=len(names))
          retain()
          print(json.dumps(receipt, sort_keys=True))
          if not complete:
              raise SystemExit("Every original owner-cut Rust case must actually execute once")
          PY
      - name: Install and identify OpenTimelineIO, FFmpeg and FFprobe on disposable CI
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          python3 -m pip install --no-deps --only-binary=:all: 'opentimelineio==0.18.1'
          python3 -m pip check
          motionwright_ffmpeg="$(command -v ffmpeg)"
          motionwright_ffprobe="$(command -v ffprobe)"
          test -x "$motionwright_ffmpeg"
          test -x "$motionwright_ffprobe"
          git log -1 --format='OTIO_TEST_CHECKOUT %H TREE %T'
          "$motionwright_ffmpeg" -version
          "$motionwright_ffprobe" -version
          sha256sum -- "$motionwright_ffmpeg" "$motionwright_ffprobe"
          python3 -c 'import opentimelineio as o; print("OTIO_READER", o.__version__); assert o.__version__ == "0.18.1", "Unexpected OpenTimelineIO reader version"'
      - name: Run complete OTIO discovery with explicit platform-specific cases
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sys
          import unittest

          loader = unittest.TestLoader()
          suite = loader.discover("tooling/otio-media", pattern="test_*.py")

          def test_ids(node):
              if isinstance(node, unittest.TestSuite):
                  for child in node:
                      yield from test_ids(child)
              else:
                  yield node.id()

          discovered = list(test_ids(suite))
          contract_counts = {
              "test_kdenlive_gui_e2e": 142, "test_kdenlive_complete_g2_fixture": 10,
              "test_kdenlive_live_process": 24, "test_kdenlive_accessibility_diagnostics": 11,
              "test_kdenlive_owner_cut": 31, "test_kdenlive_accessibility_preflight": 9,
          }
          contract_groups = {name: [case for case in discovered if case.startswith(name + ".")]
                             for name in contract_counts}
          if any(len(contract_groups[name]) != count for name, count in contract_counts.items()):
              raise SystemExit("Incomplete GUI, route, owner or accessibility-preflight source cases")
          native_prefix = "test_native_media.NativeMediaAdmissionTests."
          required_native = {
              native_prefix + name
              for name in (
                  "test_complete_original_video_exports_and_imports_without_changing_bytes",
                  "test_faststart_truncation_is_refused_with_intact_stream_metadata",
                  "test_corrupt_source_is_refused_before_export_destination_exists",
                  "test_hash_matched_legacy_corrupt_bundle_is_refused_on_import",
                  "test_bound_native_cut_reads_real_source_and_preserves_every_raw_and_capsule_byte",
                  "test_cli_same_byte_relink_and_missing_clip_return_explicit_distinct_statuses",
                  "test_foreign_or_truncated_relink_bytes_cannot_use_the_original_media_name",
              )
          }
          required_windows = {
              "test_native_media.WindowsReparsePathTests." + name
              for name in (
                  "test_authorized_root_junction_is_rejected",
                  "test_authorized_root_ancestor_junction_is_rejected",
                  "test_candidate_junction_cannot_escape_plain_authorized_root",
              )
          }
          if (
              not sys.platform.startswith("linux")
              or len(discovered) < 76
              or len(discovered) != len(set(discovered))
              or not required_native.issubset(discovered)
              or not required_windows.issubset(discovered)
          ):
              raise SystemExit("Incomplete OTIO discovery: require existing tests, seven real media cases and three Windows junction cases")

          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print(json.dumps({
              "otio_python_discovery": len(discovered),
              "required_contract_modules": contract_groups,
              "existing_route_and_owner_cases": 190, "editor_render_source_controls": 28,
              "accessibility_preflight_cases": 9,
              "tests_run": result.testsRun,
              "required_native_tests": sorted(required_native),
              "skipped": [{"id": test.id(), "reason": reason} for test, reason in result.skipped],
              "required_windows_tests": sorted(required_windows),
              "failures": len(result.failures),
              "errors": len(result.errors),
              "expected_failures": len(result.expectedFailures),
              "unexpected_successes": len(result.unexpectedSuccesses),
          }, sort_keys=True), flush=True)
          complete = (
              result.wasSuccessful()
              and result.testsRun == len(discovered)
              and len(result.skipped) == len(required_windows)
              and {(test.id(), reason) for test, reason in result.skipped}
                  == {(name, "Real junction admission requires Windows") for name in required_windows}
              and not result.expectedFailures
              and not result.unexpectedSuccesses
          )
          raise SystemExit(0 if complete else 1)
          PY
      - name: Decode actual original MP4 and verify source-bound OTIO import/export
        run: |
          set -euo pipefail
          python3 tooling/otio-media/native_e2e.py
      - name: Stage source-bound synthetic-only public OTIO and H264 media
        if: always()
        env:
          OTIO_CI_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 tooling/otio-media/public_artifact.py \
            --source-sha "$GITHUB_SHA" \
            --evidence-root verification/otio-real-media \
            --public-root verification/otio-public \
            --job-status "$OTIO_CI_JOB_STATUS"
          python3 -m json.tool verification/otio-public/public-evidence.json >/dev/null
      - name: Publish synthetic OTIO and media only, never private owner evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v05-otio-synthetic-public-${{ github.sha }}
          path: verification/otio-public/
          if-no-files-found: error
          retention-days: 7

      - name: Retain original owner-cut source-test receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: otio-owner-source-rust-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/otio-owner-cut-rust/
          if-no-files-found: warn
          retention-days: 7

  verified-windows-junction-admission:
    if: github.event_name != 'workflow_dispatch' || inputs.verification_scope == 'source'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify three real Windows junction refusals without skips
        shell: pwsh
        run: |
          @'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import subprocess
          import sys
          import traceback
          import unittest

          root = Path("verification/otio-windows-reparse")
          root.mkdir(parents=True, exist_ok=False)
          receipt = {
              "schema": "motionwright.otio.windows-reparse-ci/1",
              "status": "NOT_VERIFIED",
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "platform": sys.platform,
              "python": sys.version,
              "native_media_execution": False,
              "nle_receiver_acceptance": "NOT_VERIFIED",
              "human_acceptance": False,
          }
          source_paths = [
              ".github/workflows/v05-otio-real-media.yml",
              "tooling/otio-media/bridge.py",
              "tooling/otio-media/test_bridge.py",
              "tooling/otio-media/test_native_media.py",
          ]
          required = {
              "test_native_media.WindowsReparsePathTests.test_authorized_root_junction_is_rejected",
              "test_native_media.WindowsReparsePathTests.test_authorized_root_ancestor_junction_is_rejected",
              "test_native_media.WindowsReparsePathTests.test_candidate_junction_cannot_escape_plain_authorized_root",
          }

          def source():
              def git(*args):
                  return subprocess.run(
                      ["git", *args], check=True, capture_output=True, timeout=20,
                  ).stdout.decode("utf-8").strip()
              files = {}
              for rel in source_paths:
                  path = Path(rel)
                  info = path.lstat()
                  if not stat.S_ISREG(info.st_mode) or info.st_size > 16 * 1024 * 1024 or path.is_symlink() or getattr(info, "st_file_attributes", 0) & 0x400:
                      raise RuntimeError("invalid_source_file")
                  with path.open("rb") as stream:
                      data = stream.read(16 * 1024 * 1024 + 1)
                  if len(data) != info.st_size:
                      raise RuntimeError("source_size_changed")
                  files[rel] = {"bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()}
              return {
                  "checkout": git("rev-parse", "HEAD"),
                  "tree": git("rev-parse", "HEAD^{tree}"),
                  "tracked_diff": git("diff", "--name-only", "HEAD"),
                  "files": files,
              }

          def ids(node):
              if isinstance(node, unittest.TestSuite):
                  for child in node:
                      yield from ids(child)
              else:
                  yield node.id()

          before = None
          try:
              if os.name != "nt":
                  raise RuntimeError("requires_actual_windows")
              before = source()
              receipt["source_before"] = before
              if not re.fullmatch(r"[0-9a-f]{40}", os.environ["GITHUB_SHA"]) or before["checkout"] != os.environ["GITHUB_SHA"] or before["tracked_diff"]:
                  raise RuntimeError("source_identity_differs")
              sys.path.insert(0, str(Path("tooling/otio-media").resolve(strict=True)))
              import test_native_media
              suite = unittest.TestLoader().loadTestsFromTestCase(test_native_media.WindowsReparsePathTests)
              discovered = list(ids(suite))
              receipt["discovered_ids"] = discovered
              if len(discovered) != 3 or set(discovered) != required:
                  raise RuntimeError("incomplete_windows_reparse_roster")
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              receipt["test_result"] = {
                  "tests_run": result.testsRun,
                  "skipped": [{"id": test.id(), "reason": reason} for test, reason in result.skipped],
                  "failures": [test.id() for test, _ in result.failures],
                  "errors": [test.id() for test, _ in result.errors],
                  "expected_failures": [test.id() for test, _ in result.expectedFailures],
                  "unexpected_successes": [test.id() for test in result.unexpectedSuccesses],
              }
              if not result.wasSuccessful() or result.testsRun != 3 or result.skipped or result.expectedFailures or result.unexpectedSuccesses:
                  raise RuntimeError("windows_reparse_tests_failed")
              receipt["status"] = "PASS_PATH_ADMISSION_ONLY"
          except Exception as error:
              receipt["failure"] = type(error).__name__ + ":" + str(error)
              (root / "error.log").write_text(traceback.format_exc(), encoding="utf-8")
          finally:
              try:
                  after = source()
                  receipt["source_after"] = after
                  if before is None or after != before:
                      receipt["status"] = "NOT_VERIFIED"
                      receipt["source_failure"] = "source_changed_or_unobserved"
              except Exception as error:
                  receipt["status"] = "NOT_VERIFIED"
                  receipt["source_failure"] = type(error).__name__ + ":" + str(error)
              (root / "receipt.json").write_text(
                  json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8",
              )
              print(json.dumps({"otio_windows_reparse": receipt["status"], "failure": receipt.get("failure")}), flush=True)
          raise SystemExit(0 if receipt["status"] == "PASS_PATH_ADMISSION_ONLY" else 1)
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain exact Windows path admission evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: otio-windows-path-admission-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/otio-windows-reparse/
          if-no-files-found: error
          retention-days: 7

  admitted-native-kdenlive-gui:
    if: github.event_name == 'workflow_dispatch' && (inputs.verification_scope == 'accessibility-only' || inputs.verification_scope == 'kdenlive-gui' || inputs.verification_scope == 'external-alab-readonly')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      MOTIONWRIGHT_KDENLIVE_GUI_SCOPE: ${{ inputs.verification_scope }}
      MOTIONWRIGHT_APPROVED_KDENLIVE_G2_SOURCE: ${{ inputs.verification_scope == 'external-alab-readonly' && '0' || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Admit a fresh manual attempt before any native operation
        env:
          NATIVE_RECIPIENT_JSON: ${{ inputs.evidence_recipient }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          ALAB_ADMISSION_JSON: ${{ inputs.external_alab_admission }}
          ALAB_ADMISSION_SHA256: ${{ inputs.external_alab_admission_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(id -u)" -ne 0
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$EXPECTED_SOURCE_SHA" = "$GITHUB_SHA"
          test "${#EXPECTED_SOURCE_SHA}" -eq 40
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          raw = os.environ["NATIVE_RECIPIENT_JSON"].encode("utf-8")
          if not 0 < len(raw) <= 8192:

name: V05 OTIO real media source interchange

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tooling/otio-media/**'
      - 'crates/domain/examples/otio_real_media_fixture.rs'
      - 'docs/creative-production/V05_OTIO_MEDIA_INTERCHANGE.md'
      - '.github/workflows/v05-otio-real-media.yml'
  push:
    branches: ['main']
    paths:
      - 'tooling/otio-media/**'
      - 'crates/domain/examples/otio_real_media_fixture.rs'
      - 'docs/creative-production/V05_OTIO_MEDIA_INTERCHANGE.md'
      - '.github/workflows/v05-otio-real-media.yml'

permissions:
  contents: read

concurrency:
  group: v05-otio-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verified-native-rust-otio-and-open-timeline-io:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: native-otio-real-media-1.98.1
          cache-on-failure: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify existing canonical Rust exporter and new original source fixture
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked -p motionwright-domain otio_export_is_linear_and_carries_an_explicit_loss_report
          cargo clippy --locked -p motionwright-domain --example otio_real_media_fixture -- -D warnings
          cargo build --locked -p motionwright-domain --example otio_real_media_fixture
          python3 -m py_compile tooling/otio-media/*.py
          python3 tooling/source_policy.py
          python3 tooling/creative_status_policy.py
      - name: Install and identify OpenTimelineIO, FFmpeg and FFprobe on disposable CI
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          python3 -m pip install --no-deps --only-binary=:all: 'opentimelineio==0.18.1'
          motionwright_ffmpeg="$(command -v ffmpeg)"
          motionwright_ffprobe="$(command -v ffprobe)"
          test -x "$motionwright_ffmpeg"
          test -x "$motionwright_ffprobe"
          git log -1 --format='OTIO_TEST_CHECKOUT %H TREE %T'
          "$motionwright_ffmpeg" -version
          "$motionwright_ffprobe" -version
          sha256sum -- "$motionwright_ffmpeg" "$motionwright_ffprobe"
          python3 -c 'import opentimelineio as o; print("OTIO_READER", o.__version__); assert o.__version__ == "0.18.1", "Unexpected OpenTimelineIO reader version"'
      - name: Run complete OTIO Python discovery with required native tests and no skips
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import unittest

          loader = unittest.TestLoader()
          suite = loader.discover("tooling/otio-media", pattern="test_*.py")

          def test_ids(node):
              if isinstance(node, unittest.TestSuite):
                  for child in node:
                      yield from test_ids(child)
              else:
                  yield node.id()

          discovered = list(test_ids(suite))
          native_prefix = "test_native_media.NativeMediaAdmissionTests."
          required_native = {
              native_prefix + name
              for name in (
                  "test_complete_original_video_exports_and_imports_without_changing_bytes",
                  "test_faststart_truncation_is_refused_with_intact_stream_metadata",
                  "test_corrupt_source_is_refused_before_export_destination_exists",
                  "test_hash_matched_legacy_corrupt_bundle_is_refused_on_import",
              )
          }
          if (
              len(discovered) < 41
              or len(discovered) != len(set(discovered))
              or not required_native.issubset(discovered)
          ):
              raise SystemExit("Incomplete OTIO discovery: require all existing tests and the four native media admission tests")

          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print(json.dumps({
              "otio_python_discovery": len(discovered),
              "tests_run": result.testsRun,
              "required_native_tests": sorted(required_native),
              "skipped": len(result.skipped),
              "failures": len(result.failures),
              "errors": len(result.errors),
              "expected_failures": len(result.expectedFailures),
              "unexpected_successes": len(result.unexpectedSuccesses),
          }, sort_keys=True), flush=True)
          complete = (
              result.wasSuccessful()
              and result.testsRun == len(discovered)
              and not result.skipped
              and not result.expectedFailures
          )
          raise SystemExit(0 if complete else 1)
          PY
      - name: Decode actual original MP4 and verify source-bound OTIO import/export
        run: |
          set -euo pipefail
          python3 tooling/otio-media/native_e2e.py
      - name: Stage source-bound synthetic-only public OTIO and H264 media
        if: always()
        env:
          OTIO_CI_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 tooling/otio-media/public_artifact.py \
            --source-sha "$GITHUB_SHA" \
            --evidence-root verification/otio-real-media \
            --public-root verification/otio-public \
            --job-status "$OTIO_CI_JOB_STATUS"
          python3 -m json.tool verification/otio-public/public-evidence.json >/dev/null
      - name: Publish synthetic OTIO and media only, never private owner evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v05-otio-synthetic-public-${{ github.sha }}
          path: verification/otio-public/
          if-no-files-found: error
          retention-days: 7

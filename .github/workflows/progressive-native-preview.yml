name: Source-bound Progressive Native Preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/studio/src/NativeFrameStage.tsx"
      - "apps/studio/src/nativeProgressivePreview*"
      - "apps/studio/src/nativeFrameSelection*"
      - "apps/studio/src/App.tsx"
      - "apps/studio/src/api.ts"
      - "apps/studio/src/styles.css"
      - "apps/studio/tests/native-preview.spec.ts"
      - "apps/studio/tests/native-progressive-preview.spec.ts"
      - "docs/creative-production/PROGRESSIVE_NATIVE_PREVIEW.md"
      - "docs/creative-production/requirements-status.json"
      - ".github/workflows/progressive-native-preview.yml"
  push:
    branches: ["main"]
    paths:
      - "apps/studio/src/NativeFrameStage.tsx"
      - "apps/studio/src/nativeProgressivePreview*"
      - ".github/workflows/progressive-native-preview.yml"

permissions:
  contents: read

concurrency:
  group: native-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 tooling/source_policy.py
      - run: python3 tooling/creative_status_policy.py
      - run: python3 tooling/acceptance_policy.py

  native-preview-browser:
    needs: source-policy
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run src/nativeProgressivePreview.test.ts src/nativeFrameSelection.test.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/native-preview.spec.ts tests/native-progressive-preview.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-bound-native-preview-browser
          path: |
            apps/studio/test-results
            apps/studio/playwright-report
          if-no-files-found: ignore

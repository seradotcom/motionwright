            "studio-service.original.log",
            "oracle.original.log",
          )
          observed=0
          print("SOURCE_G1_PRE_HOST_FAILURE: original_Rust_or_control_nonzero; NativeHost=NOT_STARTED; G2=NOT_GRANTED; G3=STOP")
          for name in names:
              log=root/name
              if not log.is_file() or log.is_symlink() or log.stat().st_size > 8*1024*1024:
                  continue
              lines=log.read_text(encoding="utf8",errors="replace").splitlines()
              for line in lines[-500:]:
                  t=re.sub(r"\x1b\[[0-9;]{1,15}m","",line).strip()
                  # Extract a fixed source-relative Rust coordinate even
                  # when Cargo prints the runner's full absolute path.
                  panic_location=re.search(r"crates/native/examples/native_clip_group_e2e[.]rs:([0-9]+):([0-9]+)",t)
                  if panic_location is not None:
                      print(name+": SOURCE_RUST_PANIC_LOCATION:crates/native/examples/native_clip_group_e2e.rs:"
                            +panic_location.group(1)+":"+panic_location.group(2))
                      observed+=1
                      if observed>=12:
                          break
                      continue
                  prefix="called "+chr(96)+"Result::unwrap()"+chr(96)+" on an "+chr(96)+"Err"+chr(96)+" value: "
                  source_error=re.fullmatch(re.escape(prefix)+r'"([A-Za-z0-9 ,._:-]{1,150})"',t)
                  safe=(
                      t.startswith(("error[E","error:","test result: FAILED","test result: FAILED.",
                                    "failures:","test " ))
                      or re.fullmatch(r"--> crates/native/[A-Za-z0-9_./-]+:[0-9]+:[0-9]+",t) is not None
                      or panic_location is not None or source_error is not None
                  )
                  if not safe or not (1 <= len(t) <= 180) or not all(32 <= ord(ch) < 127 for ch in t):
                      continue
                  if any(token in t.lower() for token in ("secret","token","credential","password","cookie","/home/runner","private/")):
                      continue
                  if t.startswith("test ") and not t.endswith(" ... FAILED"):
                      continue
                  if source_error is not None:
                      print(name+": SOURCE_RUST_DECLARED_ERROR:"+source_error.group(1))
                  else:
                      print(name+": "+t)
                  observed+=1
                  if observed >= 12:
                      break
              if observed>=12:
                  break
          if observed==0:
              print("SOURCE_G1_DIAGNOSTIC_NOT_EMITTED: original logs unavailable or not allowlisted")
          PY_SELECTED_SOURCE_FAILURE
            exit "$code"
          }

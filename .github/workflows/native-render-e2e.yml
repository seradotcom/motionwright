name: Native Motion Canvas production

on:
  workflow_dispatch:
    inputs:
      native_scope:
        description: "Closed native selection; scoped fixtures require explicit final-source admission"
        type: choice
        options: [standard, n83-preview, editable-source-cycle, out-cubic-xy]
        default: standard
        required: false
      geometry_e2e:
        description: "One exact-source Native shape geometry Host render; no repeat or formal G2 admission"
        type: boolean
        required: false
        default: false
      geometry_profile:
        description: "Closed geometry behavior; Hold requires one exact-source geometry E2E"
        type: choice
        options: [out-cubic, hold]
        required: false
        default: out-cubic
      layer_order_e2e:
        description: "One real source-bound Studio layer edit, Native pixels, and same-Store reopen"
        type: boolean
        required: false
        default: false
      clip_e2e:
        description: "One exact-source Studio Clip group Save, real Native pixels and Store reopen"
        type: boolean
        required: false
        default: false
      expected_source_sha:
        description: "Exact frozen Motionwright SHA; required for retained scopes and geometry E2E"
        type: string
        required: false
        default: ""
      recovery_recipient:
        description: "Existing admitted RSA3072 public recipient JSON; mandatory for n83-preview, editable-source-cycle or out-cubic-xy"
        type: string
        required: false
        default: ""
      v01_provider_repeat:
        description: "Run a second fresh Broker/Driver Host/owner project and compare native receipts (v0.1 reliability)"
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - 'SOURCE_LOCK.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/domain/**'
      - 'crates/service/**'
      - 'crates/storage/**'
      - 'crates/native/**'
      - 'apps/desktop/src-tauri/**'
      - 'apps/studio/**'
      - 'tooling/native_render_e2e.py'
      - 'tooling/native_motion_canvas_scope.py'
      - 'tooling/native_motion_canvas_cubic_xy.py'
      - 'tooling/tests/test_native_motion_canvas_scope.py'
      - 'tooling/tests/test_native_motion_canvas_cubic_xy.py'
      - 'tooling/tests/test_native_motion_canvas_retained_scope.py'
      - 'tooling/tests/test_native_out_cubic_pixels.py'
      - 'tooling/tests/test_native_layer_order_pixels.py'
      - 'tooling/tests/test_native_clip_group_pixels.py'
      - 'tooling/native_render_public_artifact.py'
      - 'tooling/cross_app_public_artifact.py'
      - 'tooling/tests/test_native_render_public_artifact.py'
      - 'tooling/tests/test_native_render_public_failure_category.py'
      - 'tooling/native_av_failure_guard.py'
      - 'tooling/tests/test_native_cli_failure_redaction.py'
      - 'tooling/native_provider_repeat.py'
      - 'tooling/tests/test_native_provider_repeat.py'
      - 'tooling/native_direct_mediated_parity.py'
      - 'tooling/native_render_stage_cost.py'
      - 'tooling/tests/test_native_render_stage_cost.py'
      - 'tooling/tests/test_native_direct_mediated_parity.py'
      - 'tooling/native_provider_lifecycle.py'
      - 'tooling/tests/test_native_provider_lifecycle.py'
      - 'tooling/native_provider_live_watch.py'
      - 'tooling/tests/test_native_provider_live_watch.py'
      - '.github/workflows/native-render-e2e.yml'

permissions:
  contents: read

concurrency:
  group: native-motion-production-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}${{ inputs.native_scope == 'n83-preview' && '-n83-preview' || inputs.native_scope == 'editable-source-cycle' && '-editable-source-cycle' || inputs.native_scope == 'out-cubic-xy' && '-out-cubic-xy' || '' }}${{ inputs.geometry_e2e && '-one-geometry' || '' }}${{ inputs.layer_order_e2e && '-one-layer' || '' }}${{ inputs.clip_e2e && '-one-clip' || '' }}
  cancel-in-progress: ${{ inputs.native_scope != 'n83-preview' && inputs.native_scope != 'editable-source-cycle' && inputs.native_scope != 'out-cubic-xy' && !inputs.geometry_e2e && !inputs.layer_order_e2e && !inputs.clip_e2e }}

defaults:
  run:
    shell: bash

env:
  MOTIONWRIGHT_NATIVE_SCOPE: ${{ (github.event_name == 'workflow_dispatch' && inputs.native_scope) || 'standard' }}
  MOTIONWRIGHT_NATIVE_GEOMETRY_E2E: ${{ (github.event_name == 'workflow_dispatch' && inputs.geometry_e2e) && '1' || '0' }}
  MOTIONWRIGHT_NATIVE_GEOMETRY_PROFILE: ${{ (github.event_name == 'workflow_dispatch' && inputs.geometry_profile) || 'out-cubic' }}
  MOTIONWRIGHT_NATIVE_LAYER_ORDER_E2E: ${{ (github.event_name == 'workflow_dispatch' && inputs.layer_order_e2e) && '1' || '0' }}
  MOTIONWRIGHT_NATIVE_CLIP_E2E: ${{ (github.event_name == 'workflow_dispatch' && inputs.clip_e2e) && '1' || '0' }}
  MW_NATIVE_EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
  MOTIONWRIGHT_N83_RECOVERY_RECIPIENT: ${{ inputs.recovery_recipient }}
  MOTIONWRIGHT_V01_PROVIDER_REPEAT: ${{ inputs.v01_provider_repeat && 'true' || 'false' }}
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  PLAYWRIGHT_BROWSERS_PATH: '0'
  SEMWRIGHT_CHECKOUT_PATH: ${{ inputs.native_scope == 'n83-preview' && 'verification/n83-sdk' || inputs.native_scope == 'editable-source-cycle' && 'verification/mc-cycle-sdk' || inputs.native_scope == 'out-cubic-xy' && 'verification/mc-xy-sdk' || '_semwright' }}
  SEMWRIGHT_CHECKOUT: ${{ github.workspace }}/${{ inputs.native_scope == 'n83-preview' && 'verification/n83-sdk' || inputs.native_scope == 'editable-source-cycle' && 'verification/mc-cycle-sdk' || inputs.native_scope == 'out-cubic-xy' && 'verification/mc-xy-sdk' || '_semwright' }}

jobs:
  real-native-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Admit closed native selection before bootstrap
        run: |
          python3 - <<'PY'
          import os, re
          scope = os.environ["MOTIONWRIGHT_NATIVE_SCOPE"]
          assert scope in {"standard", "n83-preview", "editable-source-cycle", "out-cubic-xy"}, "unsupported native scope"
          geometry_profile = os.environ["MOTIONWRIGHT_NATIVE_GEOMETRY_PROFILE"]
          assert geometry_profile in {"out-cubic", "hold"}, "unsupported geometry profile"
          layer_order = os.environ["MOTIONWRIGHT_NATIVE_LAYER_ORDER_E2E"]
          clip = os.environ["MOTIONWRIGHT_NATIVE_CLIP_E2E"]
          assert clip in {"0", "1"}, "unsupported clip selection"
          assert layer_order in {"0", "1"}, "unsupported layer source"
          if layer_order == "1":
              assert clip == "0", "layer and clip must be separate source effects"
              assert os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
              assert os.environ["GITHUB_RUN_ATTEMPT"] == "1", "no automatic replay"
              assert scope == "standard" and os.environ["MOTIONWRIGHT_NATIVE_GEOMETRY_E2E"] == "0"
              assert geometry_profile == "out-cubic", "layer source uses standard native grammar"
              assert os.environ["MOTIONWRIGHT_V01_PROVIDER_REPEAT"] == "false"
              sha = os.environ["MW_NATIVE_EXPECTED_SOURCE_SHA"]
              assert re.fullmatch("[0-9a-f]{40}", sha) and sha == os.environ["GITHUB_SHA"]
          if clip == "1":
              assert os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
              assert os.environ["GITHUB_RUN_ATTEMPT"] == "1", "no automatic clip retry"
              assert scope == "standard" and os.environ["MOTIONWRIGHT_NATIVE_GEOMETRY_E2E"] == "0"
              assert layer_order == "0" and geometry_profile == "out-cubic"
              assert os.environ["MOTIONWRIGHT_V01_PROVIDER_REPEAT"] == "false"
              sha = os.environ["MW_NATIVE_EXPECTED_SOURCE_SHA"]
              assert re.fullmatch("[0-9a-f]{40}", sha) and sha == os.environ["GITHUB_SHA"]
          if geometry_profile == "hold":
              assert os.environ["MOTIONWRIGHT_NATIVE_GEOMETRY_E2E"] == "1", "Hold requires one admitted geometry flow"
          if scope in {"n83-preview", "editable-source-cycle", "out-cubic-xy"} or os.environ["MOTIONWRIGHT_NATIVE_GEOMETRY_E2E"] == "1":
              assert os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
              assert os.environ["GITHUB_RUN_ATTEMPT"] == "1", "native rerun forbidden"
              sha = os.environ["MW_NATIVE_EXPECTED_SOURCE_SHA"]
              assert re.fullmatch("[0-9a-f]{40}", sha) and sha == os.environ["GITHUB_SHA"]
              assert os.environ["MOTIONWRIGHT_V01_PROVIDER_REPEAT"] == "false"
              if os.environ["MOTIONWRIGHT_NATIVE_GEOMETRY_E2E"] == "1":
                  assert scope == "standard", "geometry must use original standard Host only"
          PY

      - name: Install pinned custody and PNG verifier in a private runner venv
        if: ${{ inputs.native_scope == 'n83-preview' || inputs.native_scope == 'editable-source-cycle' || inputs.native_scope == 'out-cubic-xy' }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          assert root.is_absolute() and root.is_dir() and root.resolve(strict=True) == root
          assert not any(p.is_symlink() for p in (root, *root.parents))
          venv = root / "n83-custody-venv"
          venv.mkdir(mode=0o700, exist_ok=False)
          scope = os.environ["MOTIONWRIGHT_NATIVE_SCOPE"]
          if scope == "n83-preview":
              prefix = "mw-n83-preflight-"
          else:
              import sys
              sys.path.insert(0, str(Path("tooling").resolve()))
              from native_motion_canvas_scope import retained_scope
              prefix = retained_scope(scope).preflight_prefix
          preflight = root / (prefix + os.environ["GITHUB_RUN_ID"])
          preflight.mkdir(mode=0o700, exist_ok=False)
          PY
          python3 -m venv "$RUNNER_TEMP/n83-custody-venv"
          "$RUNNER_TEMP/n83-custody-venv/bin/python" -m pip install             --disable-pip-version-check --require-hashes --only-binary=:all:             -r tooling/requirements/mlt-g2-custody.txt
          "$RUNNER_TEMP/n83-custody-venv/bin/python" -m pip install             --disable-pip-version-check --only-binary=:all: --no-deps Pillow==10.2.0
          if [ "$MOTIONWRIGHT_NATIVE_SCOPE" = "n83-preview" ]; then
            "$RUNNER_TEMP/n83-custody-venv/bin/python" -B tooling/native_render_e2e.py --n83-admission-only
          else
            "$RUNNER_TEMP/n83-custody-venv/bin/python" -B tooling/native_render_e2e.py --cycle-admission-only
          fi


      - name: Verify exact OutCubic XY source controls before Native
        id: xy_source_controls
        if: ${{ inputs.native_scope == 'out-cubic-xy' }}
        run: |
          python="$RUNNER_TEMP/n83-custody-venv/bin/python"
          preflight="$RUNNER_TEMP/mw-mc-xy-preflight-$GITHUB_RUN_ID"
          "$python" -B - <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("tooling").resolve()))
          from native_motion_canvas_scope import retained_scope
          profile = retained_scope(os.environ["MOTIONWRIGHT_NATIVE_SCOPE"])
          assert profile.selection == "out-cubic-xy"
          assert profile.stages == ("original",)
          assert (profile.jobs, profile.hosts, profile.full_frames) == (2, 1, 120)
          root = Path(os.environ["RUNNER_TEMP"]) / (profile.preflight_prefix + os.environ["GITHUB_RUN_ID"])
          assert root.is_dir() and not root.is_symlink() and not (root.stat().st_mode & 0o077)
          selected = (
              "crates/native/examples/native-render-e2e.rs", "crates/native/src/film.rs",
              "tooling/native_motion_canvas_scope.py", "tooling/native_motion_canvas_cubic_xy.py",
              "tooling/native_render_e2e.py", "tooling/native_motion_canvas_roundtrip.py",
              "tooling/native_direct_mediated_parity.py", "tooling/native_render_stage_cost.py",
              "tooling/native_av_failure_guard.py", "tooling/native_caption_pixels.py",
              "tooling/native_provider_lifecycle.py", "tooling/native_provider_live_watch.py",
              "tooling/native_host_shared_state.py", "tooling/ci_private_evidence.py",
              "tooling/ci_test_runner.py", "tooling/requirements/mlt-g2-custody.txt",
              "tooling/tests/test_native_motion_canvas_scope.py",
              "tooling/tests/test_native_motion_canvas_cubic_xy.py",
              "tooling/tests/test_native_motion_canvas_retained_scope.py",
              "tooling/tests/test_native_out_cubic_pixels.py",
              ".github/workflows/native-render-e2e.yml",
              "SOURCE_LOCK.json", "Cargo.lock", "rust-toolchain.toml", "apps/studio/package-lock.json",
          )
          files = {}
          for relative in selected:
              source = Path(relative)
              assert source.is_file() and not source.is_symlink()
              original = source.read_bytes()
              committed = subprocess.check_output(["git", "show", "HEAD:" + relative], stderr=subprocess.PIPE)
              assert original == committed, "OutCubic XY source differs from its exact commit"
              target = root / "source" / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              with target.open("xb") as stream:
                  stream.write(original)
              files[relative] = {"bytes":len(original), "sha256":hashlib.sha256(original).hexdigest()}
          with (root / "source-originals.json").open("x") as stream:
              json.dump({"selection":profile.selection, "source_sha":os.environ["GITHUB_SHA"],
                  "semwright_sha":json.loads(Path("SOURCE_LOCK.json").read_bytes())["dependencies"]["semwright"]["revision"],
                  "run_id":os.environ["GITHUB_RUN_ID"], "run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
                  "selected_stages":list(profile.stages), "maximum_native_jobs":profile.jobs,
                  "maximum_host_processes":profile.hosts, "maximum_full_frames":profile.full_frames,
                  "native_execution_performed":False, "formal_acceptance":False, "files":files}, stream)
          PY
          "$python" -B tooling/ci_test_runner.py --repo "$GITHUB_WORKSPACE" \
            --test-directory tooling/tests \
            --pattern test_native_motion_canvas_scope.py \
            --pattern test_native_motion_canvas_cubic_xy.py \
            --pattern test_native_motion_canvas_retained_scope.py \
            --mode dotted --require-complete --expected-source "$GITHUB_SHA" --timeout 180 \
            --report "$preflight/source-controls.json" \
            >"$preflight/source-controls-runner.stdout.original" 2>"$preflight/source-controls-runner.stderr.original"
          "$python" -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / ("mw-mc-xy-preflight-" + os.environ["GITHUB_RUN_ID"])
          original = json.loads((root / "source-originals.json").read_bytes())
          report = json.loads((root / "source-controls.json").read_bytes())
          assert original["source_sha"] == report["executed_source_sha"] == os.environ["GITHUB_SHA"]
          assert report["status"] == "PASS" and report["require_complete"] is True and report["exit_code"] == 0
          expected = {
              "dotted:tooling.tests.test_native_motion_canvas_scope",
              "dotted:tooling.tests.test_native_motion_canvas_cubic_xy",
              "dotted:tooling.tests.test_native_motion_canvas_retained_scope",
          }
          assert len(report["steps"]) == 3 and {step["entry_point"] for step in report["steps"]} == expected
          for step in report["steps"]:
              assert step["status"] == "PASS" and step["exit_code"] == 0
              counts = step["counts"]
              assert type(counts["tests_run"]) is int and counts["tests_run"] > 0
              assert counts["terminal_status"] == "OK" and counts["passed"] == counts["tests_run"]
              assert all(counts[key] == 0 for key in (
                  "failures", "errors", "skipped", "expected_failures", "unexpected_successes"))
          expected_definitions = {
              "tooling/tests/" + name + ".py": original["files"]["tooling/tests/" + name + ".py"]["sha256"]
              for name in ("test_native_motion_canvas_scope", "test_native_motion_canvas_cubic_xy",
                           "test_native_motion_canvas_retained_scope")
          }
          assert report["test_definition_sha256"] == expected_definitions
          for relative, identity in original["files"].items():
              current = Path(relative).read_bytes()
              assert len(current) == identity["bytes"] and hashlib.sha256(current).hexdigest() == identity["sha256"]
          PY

      - name: Verify editable-source reader before any native attempt
        id: cycle_source_controls
        if: ${{ inputs.native_scope == 'editable-source-cycle' }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          python="$RUNNER_TEMP/n83-custody-venv/bin/python"
          preflight="$RUNNER_TEMP/mw-mc-cycle-preflight-$GITHUB_RUN_ID"
          "$python" -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / ("mw-mc-cycle-preflight-" + os.environ["GITHUB_RUN_ID"])
          files = {}
          for relative in (
              "crates/native/examples/native-render-e2e.rs", "tooling/native_render_e2e.py",
              "tooling/native_motion_canvas_roundtrip.py", "tooling/tests/test_native_motion_canvas_roundtrip.py",
              "tooling/tests/test_native_provider_live_watch.py", ".github/workflows/native-render-e2e.yml",
              "tooling/ci_private_evidence.py", "tooling/ci_test_runner.py", "tooling/native_host_shared_state.py",
              "SOURCE_LOCK.json", "Cargo.lock", "rust-toolchain.toml", "apps/studio/package-lock.json",
          ):
              original = Path(relative).read_bytes()
              target = root / "source" / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              with target.open("xb") as stream:
                  stream.write(original)
              files[relative] = {"bytes":len(original), "sha256":hashlib.sha256(original).hexdigest()}
          with (root / "source-originals.json").open("x") as stream:
              json.dump({"source_sha":os.environ["GITHUB_SHA"], "files":files}, stream)
          PY
          "$python" -B tooling/ci_test_runner.py --repo "$GITHUB_WORKSPACE" \
            --test-directory tooling/tests --pattern test_native_motion_canvas_roundtrip.py \
            --mode discovery --require-complete --expected-source "$GITHUB_SHA" --timeout 180 \
            --report "$preflight/reader.json" \
            >"$preflight/reader-runner.stdout.original" 2>"$preflight/reader-runner.stderr.original"
          "$python" -B - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / ("mw-mc-cycle-preflight-" + os.environ["GITHUB_RUN_ID"])
          report = json.loads((root / "reader.json").read_bytes())
          assert report["status"] == "PASS" and report["executed_source_sha"] == os.environ["GITHUB_SHA"]
          assert len(report["steps"]) == 1 and report["steps"][0]["status"] == "PASS"
          PY

      - name: Verify exact N83 source controls before Native
        id: n83_source_controls
        if: ${{ inputs.native_scope == 'n83-preview' }}
        run: |
          preflight="$RUNNER_TEMP/mw-n83-preflight-$GITHUB_RUN_ID"
          python="$RUNNER_TEMP/n83-custody-venv/bin/python"
          "$python" -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / ("mw-n83-preflight-" + os.environ["GITHUB_RUN_ID"])
          selected = (
              "crates/native/examples/native-incremental-e2e.rs",
              "tooling/native_incremental_reconstruction.py",
              "tooling/tests/test_native_incremental_reconstruction.py",
              "tooling/ci_test_runner.py", "tooling/native_render_e2e.py",
              ".github/workflows/native-render-e2e.yml", "SOURCE_LOCK.json", "Cargo.lock",
              "rust-toolchain.toml", "apps/studio/package-lock.json",
          )
          originals = {}
          for relative in selected:
              raw = Path(relative).read_bytes()
              target = root / "source" / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              with target.open("xb") as stream:
                  stream.write(raw)
              originals[relative] = {"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest()}
          with (root / "source-originals.json").open("x") as stream:
              json.dump({"expected_source_sha":os.environ["GITHUB_SHA"],"files":originals}, stream)
          PY
          "$python" -B - <<'PY'
          import json, os, unittest
          from pathlib import Path
          suite = unittest.defaultTestLoader.discover("tooling/tests", pattern="test_native_incremental_reconstruction.py")
          def ids(test):
              if isinstance(test, unittest.TestSuite):
                  for child in test:
                      yield from ids(child)
              else:
                  yield test.id()
          roster = sorted(ids(suite))
          assert len(roster) == 75 and len(set(roster)) == 75
          root = Path(os.environ["RUNNER_TEMP"]) / ("mw-n83-preflight-" + os.environ["GITHUB_RUN_ID"])
          with (root / "python75-roster.original.json").open("x") as stream:
              json.dump({"source_sha":os.environ["GITHUB_SHA"],"test_ids":roster}, stream)
          PY
          "$python" -B tooling/ci_test_runner.py             --repo "$GITHUB_WORKSPACE" --test-directory tooling/tests             --pattern test_native_incremental_reconstruction.py             --mode discovery --require-complete --expected-source "$GITHUB_SHA"             --timeout 180 --report "$preflight/python75.json"             >"$preflight/python75-runner.stdout.original" 2>"$preflight/python75-runner.stderr.original"
          "$python" -B - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / ("mw-n83-preflight-" + os.environ["GITHUB_RUN_ID"])
          result = json.loads((root / "python75.json").read_text())
          assert result["status"] == "PASS" and result["executed_source_sha"] == os.environ["GITHUB_SHA"]
          assert len(result["steps"]) == 1 and result["steps"][0]["status"] == "PASS"
          stderr = (root / "python75-00-stderr.log").read_text()
          assert len(re.findall(r"(?m)^Ran 75 tests in ", stderr)) == 1
          PY

      - name: Seal failed N83 source controls without any owner or Native attempt
        if: ${{ always() && inputs.native_scope == 'n83-preview' && steps.n83_source_controls.outcome == 'failure' }}
        run: '"$RUNNER_TEMP/n83-custody-venv/bin/python" -B tooling/native_render_e2e.py --n83-seal-preflight-failure'

      - name: Resolve exact Semwright source pin
        id: pin
        run: |
          sha="$(python3 -c 'import json; print(json.load(open("SOURCE_LOCK.json"))["dependencies"]["semwright"]["revision"])')"
          test "${#sha}" -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: seradotcom/semwright
          ref: ${{ steps.pin.outputs.sha }}
          path: ${{ env.SEMWRIGHT_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Verify immutable source identities
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git -C "$SEMWRIGHT_CHECKOUT" rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"
          python3 tooling/source_policy.py

      - name: Verify v0.1 native CLI failures never expose private job receipts
        run: python3 -m unittest discover -s tooling/tests -p 'test_native_cli_failure_redaction.py' -v

      - name: Reject raw Broker session or forged native parity in public evidence
        run: |
          python3 -m unittest discover -s tooling/tests -p 'test_native_render_public_artifact.py' -v
          python3 -m unittest discover -s tooling/tests -p 'test_native_render_public_failure_category.py' -v


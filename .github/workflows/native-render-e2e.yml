          sources = {
              "source": root / "geometry-source.original.json",
              "native": root / "geometry-render-result.original.json",
              "reader": root / "geometry-independent-store-readback.original.json",
              "pixels": root / "geometry-three-frame-pixel-review.json",
          }
          if profile == "hold":
              sources["studio"] = root / "geometry-studio-hold.original.json"
              sources["before_studio"] = root / "geometry-before-studio.original.json"
          originals = {label: read_file(path,4*1024*1024)
                       for label,path in sources.items()}
          reviewed = json.loads(originals["pixels"])
          readback = json.loads(originals["reader"])
          source_receipt = json.loads(originals["source"])
          require(reviewed.get("schema") == "motionwright.native-geometry-pixels/1"
                  and reviewed.get("status") == "SOURCE_BOUND_ORIGINAL_PNG_GEOMETRY_OBSERVED"
                  and reviewed.get("read_only_store_source_bound") is True
                  and reviewed.get("sampled_frame_roster") == frame_roster
                  and reviewed.get("geometry_profile") == profile
                  and reviewed.get("project",{}).get("geometry_profile") == profile
                  and reviewed.get("automatic_retry") is False
                  and reviewed.get("installed_tauri") is False
                  and reviewed.get("human_visual_acceptance") is False
                  and reviewed.get("formal_G2") is False
                  and reviewed.get("formal_G3") is False
                  and reviewed.get("release_authorized") is False,
                  "PIXEL_REVIEW_CONTRACT")
          require(readback.get("schema") == "motionwright.native-geometry-independent-store-readback/1"
                  and readback.get("reader_authority") == "StudioServiceReader"
                  and readback.get("source_project_unchanged") is True
                  and readback.get("source_history_unchanged") is True
                  and readback.get("same_physical_database") is True
                  and readback.get("source_receipt_sha256") == digest(originals["source"])
                  and reviewed.get("project",{}).get("source_receipt_sha256") == digest(originals["source"]),
                  "ORIGINAL_SQLITE_CAS_REOPEN")
          require(source_receipt.get("schema") == "motionwright.native-geometry-source/1"
                  and source_receipt.get("identity",{}).get("easing")
                    == ("hold" if profile == "hold" else "ease_out_cubic"),
                  "SOURCE_RECEIPT_SCHEMA_OR_PROFILE")
          studio_summary = None
          if profile == "hold":
              studio = json.loads(originals["studio"])
              before = json.loads(originals["before_studio"])
              require(studio.get("schema") == "motionwright.native-geometry-studio-hold/1"
                      and studio.get("status") == "FIVE_ORIGINAL_UI_SAVES_AND_CLOSED_STORE"
                      and studio.get("source_sha") == sha
                      and studio.get("seed_source_sha256") == digest(originals["before_studio"])
                      and studio.get("ui_save_count") == 5
                      and studio.get("closed_store_handoff") is True
                      and studio.get("automatic_retry") is False
                      and studio.get("native_execution") is False
                      and studio.get("installed_tauri") is False
                      and studio.get("human_approval") is False
                      and studio.get("lifecycle_taints") == [],
                      "ORIGINAL_STUDIO_HOLD_OUTCOME")
              exits = studio.get("process_exits")
              require(type(exits) is list and len(exits) == 1
                      and exits[0].get("code") == 0 and exits[0].get("signal") is None,
                      "ORIGINAL_STUDIO_WRITER_CLOSED")
              require(before.get("schema") == "motionwright.native-geometry-source/1"
                      and before.get("identity",{}).get("easing") == "ease_out_cubic"
                      and studio.get("initial_project") == before.get("project")
                      and studio.get("project") == source_receipt.get("project")
                      and studio.get("history") == source_receipt.get("history")
                      and source_receipt.get("identity",{}).get("studio_authoring_sha256") == digest(originals["studio"]),
                      "ORIGINAL_STUDIO_AND_NATIVE_SOURCE_JOIN")
              studio_summary = {
                  "original_receipt_sha256":digest(originals["studio"]),
                  "seed_original_sha256":digest(originals["before_studio"]),
                  "ui_save_count":5,"closed_store_handoff":True,
              }
          owners = root / "geometry-native-originals"
          require(owners.is_dir() and not owners.is_symlink(), "ORIGINAL_NATIVE_ROOT")
          children = [entry for entry in owners.iterdir() if entry.is_dir() and not entry.is_symlink()]
          require(len(children) == 1, "ONE_NATIVE_ARTIFACT")
          artifact = children[0]
          manifest_raw = read_file(artifact / "artifact-manifest.json",4*1024*1024)
          manifest = json.loads(manifest_raw)
          plan = manifest.get("plan",{})
          frames = manifest.get("frames",[])
          require(plan.get("frame_count") == 60 and plan.get("first_frame") == 0
                  and plan.get("end_frame_exclusive") == 60
                  and type(frames) is list and len(frames) == 60
                  and reviewed.get("artifact_manifest_sha256") == digest(manifest_raw),
                  "ORIGINAL_FRAME_MANIFEST")
          samples = reviewed.get("original_frames",[])
          require(type(samples) is list and [v.get("frame") for v in samples] == frame_roster,
                  "MEASURED_NATIVE_FRAME_ROSTER")
          verified = []
          size = 0
          for index,row in enumerate(frames):
              expected = f"frames/{index:06d}.png"
              require(type(row) is dict and row.get("index") == index
                      and row.get("file") == expected
                      and type(row.get("bytes")) is int
                      and 0 < row["bytes"] <= 24*1024*1024
                      and type(row.get("sha256")) is str and len(row["sha256"]) == 64,
                      "ORIGINAL_FRAME_ENTRY")
              path = artifact / expected
              raw = read_file(path,24*1024*1024)
              require(raw.startswith(b"\x89PNG\r\n\x1a\n")
                      and len(raw) == row["bytes"]
                      and digest(raw) == row["sha256"], "ORIGINAL_FRAME_DIGEST")
              size += len(raw)
              require(size <= 256*1024*1024, "ORIGINAL_FRAME_AGGREGATE")
              verified.append({"index":index,"bytes":len(raw),"sha256":row["sha256"]})
          for sample in samples:
              require(sample.get("original_png_sha256") == verified[sample["frame"]]["sha256"],
                      "SAMPLE_NATIVE_PIXEL_IDENTITY")
          held_identity = reviewed.get("held_frame_byte_identity")
          if profile == "hold":
              first, destination = verified[0]["sha256"], verified[30]["sha256"]
              require(first != destination
                      and all(row["sha256"] == first for row in verified[:30])
                      and all(row["sha256"] == destination for row in verified[30:]),
                      "COMPLETE_ORIGINAL_HOLD_INTERVALS")
              require(held_identity == {
                  "initial_interval":[0,30],"destination_interval":[30,60],
                  "verified_original_frames":60,"equality":"complete_original_png_bytes",
                  "first_png_sha256":first,"destination_png_sha256":destination,
              }, "HELD_ORACLE_MATCHES_ORIGINAL_FRAMES")
          else:
              require(held_identity is None, "UNREQUESTED_HOLD_EVIDENCE")
          published.mkdir(mode=0o700,parents=False,exist_ok=False)
          frames_root = published / "frames"
          frames_root.mkdir(mode=0o700)
          for row in verified:
              label = f"{row['index']:06d}.png"
              original = artifact / "frames" / label
              copied = frames_root / label
              shutil.copyfile(original,copied)
              require(copied.stat().st_size == row["bytes"]
                      and digest(copied.read_bytes()) == row["sha256"],"PUBLIC_ORIGINAL_CHANGED")
          pin = json.loads(Path("SOURCE_LOCK.json").read_bytes())["dependencies"]["semwright"]["revision"]
          result = {
              "schema":"motionwright.ci.native-geometry-safe-physical-evidence/1",
              "status":"ONE_REAL_HOST_RENDER_60_ORIGINAL_FRAMES_VERIFIED",
              "geometry_profile":profile,"studio_authoring":studio_summary,
              "held_frame_byte_identity":held_identity,
              "source_sha":sha, "semwright_source_pin":pin,
              "run_id":os.environ["GITHUB_RUN_ID"],"run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
              "native_effect_count":1, "original_frame_count":60,
              "original_frame_total_bytes":size,
              "original_source_sha256":digest(originals["source"]),
              "private_native_result_sha256":digest(originals["native"]),
              "private_reader_original_sha256":digest(originals["reader"]),
              "private_pixel_original_sha256":digest(originals["pixels"]),
              "original_manifest_sha256":digest(manifest_raw),
              "frame_originals":verified,
              "pixel_measurements":[{
                  "frame":s["frame"], "center":s["center"],
                  "width":s["width"], "height":s["height"],
                  "rotation_deg":s["rotation_deg"],
                  "original_png_sha256":s["original_png_sha256"],
              } for s in samples],
              "same_store_independent_reader":"VERIFIED",
              "unredacted_owner_or_broker_receipts_uploaded":False,
              "installed_tauri":"NOT_RUN", "human_approval":False,
              "G2":"NOT_GRANTED","G3":"STOP","release_authorized":False,
          }
          (published/"public-receipt.json").write_text(
              json.dumps(result,sort_keys=True,indent=2)+"\n")
          print("native-geometry-host=PASS original_frames=60 source="+sha+" G2=NOT_GRANTED")
          PY_GEOMETRY_HOST_EVIDENCE

      - name: Retain only verified original geometry PNGs and safe digest receipt
        if: ${{ inputs.geometry_e2e && success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-geometry-physical-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/native-geometry-public/
          if-no-files-found: error

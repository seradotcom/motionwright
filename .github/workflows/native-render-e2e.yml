      - name: Verify complete sealed N83 fixture outcome
        if: ${{ inputs.native_scope == 'n83-preview' }}
        run: |
          "$RUNNER_TEMP/n83-custody-venv/bin/python" - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path("verification/native-n83-public")
          value = json.loads((root / "public-evidence.json").read_text())
          assert value["schema"] == "motionwright.n83.sealed-public/1"
          assert value["status"] == "SCOPED_COMPLETED"
          assert value["selected_originals_complete"] is True
          assert value["daemon_shutdown_complete"] is True and value["source_unchanged"] is True
          assert value["context"] == {"source_sha":os.environ["GITHUB_SHA"], "semwright_sha":json.loads(Path("SOURCE_LOCK.json").read_text())["dependencies"]["semwright"]["revision"], "run_id":os.environ["GITHUB_RUN_ID"], "run_attempt":"1"}
          assert value["completed_stages"] == ["seed","before","edit","dirty","full-after","assemble-input","admit-preview","reopen-preview","dependency-negative"]
          assert value["automatic_retry"] is False and value["formal_acceptance"] is False
          assert value["ciphertext_file"] == "sealed-originals.bin"
          path = root / "sealed-originals.bin"
          with path.open("rb") as stream:
              observed = hashlib.file_digest(stream, "sha256").hexdigest()
          assert path.stat().st_size == value["ciphertext_bytes"] and observed == value["ciphertext_sha256"]
          PY

      - name: Publish only sealed N83 originals and closed manifest

name: Native Motion Canvas production

on:
  workflow_dispatch:
    inputs:
      v01_provider_repeat:
        description: "Run a second fresh Broker/Driver Host/owner project and compare native receipts (v0.1 reliability)"
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - 'SOURCE_LOCK.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/domain/**'
      - 'crates/service/**'
      - 'crates/storage/**'
      - 'crates/native/**'
      - 'apps/desktop/src-tauri/**'
      - 'apps/studio/**'
      - 'tooling/native_render_e2e.py'
      - 'tooling/native_render_public_artifact.py'
      - 'tooling/cross_app_public_artifact.py'
      - 'tooling/tests/test_native_render_public_artifact.py'
      - 'tooling/tests/test_native_render_public_failure_category.py'
      - 'tooling/native_av_failure_guard.py'
      - 'tooling/tests/test_native_cli_failure_redaction.py'
      - 'tooling/native_provider_repeat.py'
      - 'tooling/tests/test_native_provider_repeat.py'
      - 'tooling/native_direct_mediated_parity.py'
      - 'tooling/native_render_stage_cost.py'
      - 'tooling/tests/test_native_render_stage_cost.py'
      - 'tooling/tests/test_native_direct_mediated_parity.py'
      - 'tooling/native_provider_lifecycle.py'
      - 'tooling/tests/test_native_provider_lifecycle.py'
      - 'tooling/native_provider_live_watch.py'
      - 'tooling/tests/test_native_provider_live_watch.py'
      # native-impact-triggers-begin
      - 'tooling/ci_native_impact.py'
      - 'tooling/tests/test_ci_native_impact.py'
      # native-impact-triggers-end
      - '.github/workflows/native-render-e2e.yml'

permissions:
  contents: read

concurrency:
  group: native-motion-production-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  PLAYWRIGHT_BROWSERS_PATH: '0'
  SEMWRIGHT_CHECKOUT: ${{ github.workspace }}/_semwright

jobs:
  # native-impact-preflight-begin
  native-impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      native_required: ${{ steps.impact.outputs.native_required }}
      decision: ${{ steps.impact.outputs.decision }}
      receipt_sha256: ${{ steps.impact.outputs.receipt_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create isolated verification directories
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/native-impact-render/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$target"
          mkdir -p "$target/tmp"
          echo "MW_NATIVE_IMPACT_OUTPUT=$target/evidence" >> "$GITHUB_ENV"
          echo "MW_NATIVE_IMPACT_TEST_TMP=$target/tmp" >> "$GITHUB_ENV"
          echo "TMPDIR=$target/tmp" >> "$GITHUB_ENV"
          echo "TEMP=$target/tmp" >> "$GITHUB_ENV"
          echo "TMP=$target/tmp" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Run G0 and bind native selection to original Git inputs
        id: impact
        env:
          MW_NATIVE_WORKFLOW: .github/workflows/native-render-e2e.yml
        run: |
          python3 -B -I -S - <<'PY'
          import hashlib, os, pathlib, re, shutil, stat, subprocess, sys
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          expected = os.environ["GITHUB_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", expected):
              raise SystemExit("Invalid checkout SHA")
          git = pathlib.Path(shutil.which("git")).resolve(strict=True)
          if git.is_relative_to(root):
              raise SystemExit("Git resolves into source")
          for name in list(os.environ):
              if name.upper().startswith("GIT_"):
                  del os.environ[name]
          os.environ.update(GIT_NO_REPLACE_OBJECTS="1", GIT_GRAFT_FILE=os.devnull,
              GIT_CONFIG_GLOBAL=os.devnull, GIT_CONFIG_NOSYSTEM="1",
              GIT_NO_LAZY_FETCH="1", GIT_OPTIONAL_LOCKS="0", GIT_TERMINAL_PROMPT="0",
              GIT_CONFIG_COUNT="1", GIT_CONFIG_KEY_0="core.fsmonitor",
              GIT_CONFIG_VALUE_0="false")
          def read_git(*args):
              result = subprocess.run([str(git), "--no-replace-objects", *args],
                  cwd=root, capture_output=True, timeout=30, check=True)
              if len(result.stdout) > 2 * 1024 * 1024 or len(result.stderr) > 65536:
                  raise SystemExit("Bootstrap Git output exceeds budget")
              return result.stdout
          if read_git("rev-parse", "HEAD").strip().decode() != expected:
              raise SystemExit("Checkout differs from workflow source")
          target = root / "tooling/ci_native_impact.py"
          if target.is_symlink() or not target.is_file():
              raise SystemExit("Selector is not a regular source file")
          before = target.lstat()
          if not stat.S_ISREG(before.st_mode):
              raise SystemExit("Selector source mode differs")
          with target.open("rb") as stream:
              data = stream.read(256 * 1024 + 1)
          after = target.stat()
          token = lambda value: (value.st_dev, value.st_ino, value.st_size,
                                 value.st_mtime_ns, value.st_ctime_ns)
          if len(data) > 256 * 1024 or token(before) != token(after):
              raise SystemExit("Selector changed or exceeds budget")
          # Fixed-size rev-parse outputs only; the selector captures full status
          # with bounded pipes before loading any other checkout module.
          original_oid = read_git("rev-parse", "--verify", expected + ":tooling/ci_native_impact.py").strip().decode("ascii")
          actual_oid = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          if not re.fullmatch(r"[0-9a-f]{40}", original_oid) or actual_oid != original_oid:
              raise SystemExit("Selector bytes differ from original Git source")
          sys.argv = [str(target), "--repo", str(root), "--workflow",
              os.environ["MW_NATIVE_WORKFLOW"], "--output",
              os.environ["MW_NATIVE_IMPACT_OUTPUT"], "--github-output",
              os.environ["GITHUB_OUTPUT"]]
          # Execute the exact verified buffer without reopening the pathname.
          scope = {"__name__": "__main__", "__file__": str(target), "__package__": None}
          exec(compile(data, str(target), "exec"), scope)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-impact-render-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MW_NATIVE_IMPACT_OUTPUT }}
          if-no-files-found: error
          retention-days: 14
  # native-impact-preflight-end
  real-native-render:
    # native-impact-dependency-begin
    needs: native-impact
    if: ${{ needs.native-impact.result == 'success' && needs.native-impact.outputs.native_required == 'true' }}
    # native-impact-dependency-end
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Resolve exact Semwright source pin
        id: pin
        run: |
          sha="$(python3 -c 'import json; print(json.load(open("SOURCE_LOCK.json"))["dependencies"]["semwright"]["revision"])')"
          test "${#sha}" -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: seradotcom/semwright
          ref: ${{ steps.pin.outputs.sha }}
          path: _semwright
          persist-credentials: false

      - name: Verify immutable source identities
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git -C _semwright rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"
          python3 tooling/source_policy.py

      # native-impact-moved-render-0

      # native-impact-moved-render-1

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: motionwright-native-render-1.98.1
          cache-on-failure: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: _semwright/integrations/motion-canvas/runtime/package-lock.json

      - name: Configure disposable-runner Driver Host sandbox
        run: |
          bash _semwright/scripts/dev/ci-driver-bwrap-profile.sh \
            "$GITHUB_WORKSPACE/verification/native-render-e2e/sandbox-profile.txt"

      - name: Install Semwright daemon build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpipewire-0.3-dev pkg-config clang ffmpeg

      - name: Install exact Motion Canvas runtime and Firefox
        working-directory: _semwright/integrations/motion-canvas/runtime
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps firefox
          npm run probe

      - name: Build exact Semwright Broker, sandbox and Motion Canvas provider
        working-directory: _semwright
        run: |
          cargo build --locked -p semwright-daemon -p semwright-cli --bins
          cargo build --locked \
            -p semwright-plugin-host --bin semwright-sandbox \
            -p semwright-driver-motion-canvas --bin semwright-motion-canvas-driver

      - name: Build Motionwright production acceptance
        run: |
          cargo build --locked -p motionwright-native --example native-render-e2e
          cargo test --locked -p motionwright-native \
            motion_canvas_production_is_revision_bound_rendered_and_natively_verified \
            -- --nocapture
          cargo test --locked -p motionwright-native --lib \
            exact_linear_opacity_keys_preserve_native_fade_in_and_original_canvas \
            -- --nocapture
          cargo test --locked -p motionwright-native --lib \
            noncanonical_linear_opacity_keys_fail_without_approximation \
            -- --nocapture
          cargo test --locked -p motionwright-native --lib \
            exact_cubic_out_ -- --nocapture
          cargo test --locked -p motionwright-native --lib \
            smoothstep_is_still_rejected_as_not_equivalent_to_native_inout_cubic -- --nocapture

      - name: Verify direct-vs-mediated parity invariants before native rendering
        run: python3 -m unittest discover -s tooling/tests -p 'test_native_direct_mediated_parity.py' -v

      - name: Reject synthetic or incorrectly interpolated cubic ROI evidence
        run: python3 -m unittest discover -s tooling/tests -p 'test_native_out_cubic_pixels.py' -v
      - name: Reject invented render stage timing claims
        run: python3 -m unittest discover -s tooling/tests -p 'test_native_render_stage_cost.py' -v

      - name: Verify bounded provider lifecycle diagnostics
        run: |
          python3 -m unittest discover -s tooling/tests -p 'test_native_provider_lifecycle.py' -v
          python3 -m unittest discover -s tooling/tests -p 'test_native_provider_live_watch.py' -v

      - name: Reject fabricated independent-run reliability evidence
        run: python3 -m unittest discover -s tooling/tests -p 'test_native_provider_repeat.py' -v

      - name: Render application-owned revision through real Broker and Driver Host
        env:
          SEMWRIGHT_TEST_DRIVER_SANDBOX: '1'
          MOTIONWRIGHT_V01_PROVIDER_EVENT_REPLAY: '1'
          SEMWRIGHT_TEST_SANDBOX_HELPER: ${{ github.workspace }}/_semwright/target/debug/semwright-sandbox
        run: |
          python3 tooling/native_render_e2e.py | tee verification/native-render-e2e/run.log

      - name: Verify review evidence
        run: |
          test -s "verification/native-render-e2e/${GITHUB_SHA}/result.json"
          test -s "verification/native-render-e2e/${GITHUB_SHA}/motionwright-render-evidence.json"
          test -s "verification/native-render-e2e/${GITHUB_SHA}/artifact-manifest.json"
          test -s "verification/native-render-e2e/${GITHUB_SHA}/frame-first.png"
          test -s "verification/native-render-e2e/${GITHUB_SHA}/frame-middle.png"
          test -s "verification/native-render-e2e/${GITHUB_SHA}/frame-last.png"
          test -s "verification/native-render-e2e/${GITHUB_SHA}/native-provider-lifecycle.json"
          test -s "verification/native-render-e2e/${GITHUB_SHA}/native-provider-live-broker-events.json"
          test -s "verification/native-render-e2e/${GITHUB_SHA}/motionwright-direct-parity-film.json"
          test -s "verification/native-render-e2e/${GITHUB_SHA}/native-direct-mediated-parity.json"
          test -s "verification/native-render-e2e/${GITHUB_SHA}/native-render-stage-cost.json"
          for frame in 000000 000015 000030 000059; do
            test -s "verification/native-render-e2e/${GITHUB_SHA}/mediated-native-frame-${frame}.png"
            test -s "verification/native-render-e2e/${GITHUB_SHA}/direct-native-frame-${frame}.png"
          done
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("verification/native-render-e2e") / os.environ["GITHUB_SHA"]
          result = json.loads((root / "result.json").read_text())
          assert result["native_render_e2e"] == "PASS"
          assert result["motionwright_sha"] == os.environ["GITHUB_SHA"]
          assert result["frame_count"] == 60
          assert result["linear_position_motion_sampled"] is True
          assert result["native_motion_frame_sha256"]["start"] != result["native_motion_frame_sha256"]["end_of_linear_tween"]
          assert result["linear_opacity_motion_sampled"] is True
          cubic = result["native_cubic_out_region"]
          assert cubic["native_original_pixels_verified"] is True
          assert cubic["interpolation"] == "ease_out_cubic"
          assert cubic["native_motion_easing"] == "out_cubic"
          assert cubic["position_sampled_frames"] == [0, 2, 8, 30]
          assert cubic["opacity_sampled_frames"] == [0, 15, 30]
          assert cubic["pixel_difference_interpreted_as_visual_approval"] is False
          assert result["direct_mediated_native_frame_parity"] == "PASS"
          assert len(result["direct_mediated_same_film_sha256"]) == 64
          comparison = json.loads((root / "native-direct-mediated-parity.json").read_text())
          assert comparison["schema"] == "motionwright-native-direct-mediated-parity/1"
          assert comparison["motionwright_sha"] == os.environ["GITHUB_SHA"]
          assert comparison["project_generation"] == result["project"]["generation"]
          assert comparison["project_revision"] == result["project"]["revision"]
          assert comparison["semwright_sha"] == result["semwright_sha"]
          assert comparison["source_film_sha256"] == result["direct_mediated_same_film_sha256"]
          assert comparison["direct_job_distinct_from_mediated"] is True
          assert comparison["direct_native_validation_checks"] > 0
          assert comparison["pixels"]["frame_count"] == 60
          pixels = comparison["pixels"]
          assert pixels["all_frames_decoded_rgba_pixel_identical"] is True
          assert pixels["raw_rgba_pixel_format"] == "rgba_1920x1080"
          assert type(pixels["png_container_byte_identical"]) is bool
          assert 0 <= pixels["png_container_mismatch_count"] <= 60
          assert len(pixels["ordered_rgba_frame_digests_sha256"]) == 64
          assert pixels["checked_frames"] == [0, 15, 30, 59]
          assert all(len(value) == 64 for value in pixels["checked_frame_rgba_sha256"])
          assert comparison["human_visual_acceptance"] == "NOT_RUN"
          assert comparison["arbitrary_renderer_property_parity"] == "NOT_PROVEN"
          assert "exact_out_cubic_xy_position" in comparison["compared_properties"]
          assert "exact_out_cubic_opacity_fade" in comparison["compared_properties"]
          stage = json.loads((root / "native-render-stage-cost.json").read_text())
          assert stage["schema"] == "motionwright.native-render-stage-cost/1"
          assert stage["source_sha"] == os.environ["GITHUB_SHA"]
          assert stage["semwright_sha"] == result["semwright_sha"]
          assert stage["canonical_film_sha256"] == comparison["source_film_sha256"]
          assert stage["verified_frames_per_leg"] == 60
          assert stage["verified_rgba_frames_across_both_legs"] == 120
          assert stage["ordered_rgba_frame_digests_sha256"] == comparison["pixels"]["ordered_rgba_frame_digests_sha256"]
          assert set(stage["direct_broker_substage_micros"]) == {"plan", "apply", "start", "terminal_wait", "result", "verify"}
          assert all(type(us) is int and us >= 0 for us in stage["observations_micros"].values())
          assert stage["comparison"]["cache_savings"] is None
          assert stage["comparison"]["saved_native_renderer_frames"] is None
          assert stage["comparison"]["cross_run_wallclock_speedup_claim"] == "NOT_COMPARABLE_SEQUENTIAL_RUNS"
          assert stage["comparison"]["actual_human_creative_approval"] == "NOT_RUN"
          assert stage["v05_requirement_complete"] is False
          region = result["native_linear_opacity_region"]
          assert region["scope"] == "actual_pinned_motion_canvas_png_rgb24_region_only"
          assert region["rect"] == [1150, 750, 180, 90]
          assert region["frames"] == [0, 15, 30]
          assert len(region["rgb24_sha256"]) == 3
          assert all(len(value) == 64 for value in region["rgb24_sha256"])
          distances = region["mean_byte_distance"]
          assert distances["start_to_end"] >= 18
          assert distances["start_to_middle"] >= 8
          assert 5 <= distances["middle_to_end"] < distances["start_to_end"] * 0.85
          assert len(result["artifact_manifest_sha256"]) == 64
          health = json.loads((root / "native-provider-lifecycle.json").read_text())
          assert health["schema"] == "motionwright-ci-provider-lifecycle/1"
          assert health["authority"] == "passive-ci-process-status-not-driver-evidence"
          assert health["sample_count"] >= 1
          assert health["daemon_exit_before_owner_cleanup"] is None
          live = json.loads((root / "native-provider-live-broker-events.json").read_text())
          assert live["schema"] == "motionwright-ci-native-provider-broker-events/1"
          assert live["motionwright_source_sha"] == os.environ["GITHUB_SHA"]
          assert live["semwright_source_pin"] == result["semwright_sha"]
          assert live["capture_mode"] == "bounded-read-only-owner-session-live-watch"
          assert type(live["started_before_render"]) is bool
          assert live["history_exhaustive"] is False
          assert live["native_provider_causation_proven"] is False
          assert live["terminal_native_result_verified"] is False
          assert live["original_render_retry_permitted"] is False
          assert live["public_owner_payloads_copied"] is False
          assert live["installed_owner_recovery"] == "NOT_RUN"
          assert live["trusted_lifecycle_event_count"] == len(live["events"])
          allowed = {
              "provider.connected", "provider.disconnected",
              "provider.capabilities.changed", "provider.generation.invalidated",
              "provider.removed",
          }
          assert all(
              set(event) == {"kind", "generation", "revision"}
              and event["kind"] in allowed
              for event in live["events"]
          )
          PY

      - name: Repeat native render with a fresh owner Broker and Driver Host (v0.1 diagnostic only)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.v01_provider_repeat) || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/v01-provider-repeat-ci')) }}
        env:
          MOTIONWRIGHT_NATIVE_RUN_LABEL: 'repeat-02'
          SEMWRIGHT_TEST_DRIVER_SANDBOX: '1'
          MOTIONWRIGHT_V01_PROVIDER_EVENT_REPLAY: '1'
          SEMWRIGHT_TEST_SANDBOX_HELPER: ${{ github.workspace }}/_semwright/target/debug/semwright-sandbox
        run: |
          set -euo pipefail
          python3 tooling/native_render_e2e.py | tee verification/native-render-e2e/repeat-run.log
          python3 tooling/native_provider_repeat.py             --source-sha "$GITHUB_SHA"             --semwright-pin "${{ steps.pin.outputs.sha }}"             --first "verification/native-render-e2e/$GITHUB_SHA"             --second "verification/native-render-e2e/$GITHUB_SHA-repeat-02"             --output "verification/native-render-e2e/$GITHUB_SHA/v01-independent-provider-repeat.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads((Path("verification/native-render-e2e")/os.environ["GITHUB_SHA"]/"v01-independent-provider-repeat.json").read_text())
          assert report["status"]=="TWO_INDEPENDENT_NATIVE_E2E_RUNS_VERIFIED"
          assert report["same_pinned_native_provider_bytes"] is True
          assert report["fresh_owner_project_and_generation_each_run"] is True
          assert report["intermittent_driver_host_loss_fixed"] == "NOT_PROVEN"
          assert report["real_owner_installed_acceptance"]=="NOT_RUN"
          assert report["motionwright_v01_release_ready"] is False
          PY

      - name: Stage only verified v0.1 native PNG review, not original Broker receipts
        if: always()
        env:
          NATIVE_CI_JOB_STATUS: ${{ job.status }}
        run: |
          python3 tooling/native_render_public_artifact.py \
            --source-sha "$GITHUB_SHA" \
            --evidence-root "verification/native-render-e2e/$GITHUB_SHA" \
            --output-root "verification/native-render-public" \
            --job-status "$NATIVE_CI_JOB_STATUS"
          python3 -m json.tool verification/native-render-public/public-evidence.json >/dev/null

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: motionwright-native-render-${{ github.sha }}
          path: verification/native-render-public
          if-no-files-found: error
          retention-days: 14

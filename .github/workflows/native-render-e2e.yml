          fi
          for case in \
            authored_rectangular_clip_group_has_real_native_parent_and_local_child_geometry \
            nested_rectangular_clip_group_is_refused_without_mask_or_preview_substitution \
            exact_fade_out_opacity_keeps_visible_source_and_real_native_zero_target; do
            cargo test --locked -p motionwright-native --lib \
              "film::tests::$case" -- --exact --test-threads=1 \
              > "$root/$case.original.log" 2>&1
          done
          cargo build --locked -p motionwright-native --example native-render-e2e \
            > "$root/native-build.original.log" 2>&1
          cargo build --locked -p motionwright-service --example studio_review_session \
            > "$root/studio-service.original.log" 2>&1
          test -x "$GITHUB_WORKSPACE/target/debug/examples/studio_review_session"
          cd apps/studio
          npm ci --no-audit --no-fund > "$root/npm.original.log" 2>&1
          npx --no-install vitest run src/nativeFadeOutMotion.test.ts src/canvasClip.test.ts \
            --reporter=dot > "$root/vitest.original.log" 2>&1
          npx --no-install tsc --noEmit --project tsconfig.json \
            > "$root/types.original.log" 2>&1
          npx --no-install playwright install --with-deps chromium \
            > "$root/browser.original.log" 2>&1
          cd ../..
          NATIVE_LAYER_G1_ROOT="$root" python3 -B -E -s - <<'PY_LAYER_G1'
          import os
          from pathlib import Path
          root=Path(os.environ["NATIVE_LAYER_G1_ROOT"])

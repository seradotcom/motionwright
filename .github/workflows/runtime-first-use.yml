name: Owner Runtime First-Use Audit

on:
  push:
    branches: ["main", "feat/**"]
    paths:
      - "tooling/runtime_first_use_audit.py"
      - "tooling/tests/test_runtime_first_use*.py"
      - "tooling/ci_test_runner.py"
      - "tooling/tests/test_ci_test_runner.py"
      - "tooling/owner_candidate_provenance.py"
      - "tooling/tests/test_owner_candidate_provenance.py"
      - "apps/desktop/src-tauri/src/runtime_setup.rs"
      - "docs/owner-native-runtime-onboarding.md"
      - "docs/runtime-first-use-audit.md"
      - ".github/workflows/runtime-first-use.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "tooling/runtime_first_use_audit.py"
      - "tooling/tests/test_runtime_first_use*.py"
      - "tooling/ci_test_runner.py"
      - "tooling/tests/test_ci_test_runner.py"
      - "tooling/owner_candidate_provenance.py"
      - "tooling/tests/test_owner_candidate_provenance.py"
      - "apps/desktop/src-tauri/src/runtime_setup.rs"
      - "docs/owner-native-runtime-onboarding.md"
      - "docs/runtime-first-use-audit.md"
      - ".github/workflows/runtime-first-use.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      verification_scope:
        description: Select preflight-only for test-runner/import changes; registry behavior changes require all
        type: choice
        options: [all, preflight]
        required: true
        default: all
      preflight_os:
        description: Select one runner only with manual preflight; all preserves the full OS matrix
        type: choice
        options: [all, ubuntu-24.04, windows-2025, macos-15]
        required: true
        default: all
      source_sha:
        description: Full lowercase source commit SHA; empty uses the event checkout
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  MW_VERIFIER_SHA: ${{ github.workflow_sha }}
  MW_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
  MW_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  MW_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

concurrency:
  group: first-use-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || '' }}-${{ inputs.verification_scope || 'all' }}${{ github.event_name == 'workflow_dispatch' && inputs.preflight_os != '' && inputs.preflight_os != 'all' && format('-os-{0}', inputs.preflight_os) || '' }}
  cancel-in-progress: true

jobs:
  portable-preflight:
    name: First-use preflight (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'preflight' && (inputs.preflight_os == 'ubuntu-24.04' && '["ubuntu-24.04"]' || inputs.preflight_os == 'windows-2025' && '["windows-2025"]' || inputs.preflight_os == 'macos-15' && '["macos-15"]') || '["ubuntu-24.04","windows-2025","macos-15"]') }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.MW_SOURCE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Validate manual preflight platform selection
        shell: python
        env:
          MW_PREFLIGHT_SCOPE: ${{ inputs.verification_scope }}
          MW_PREFLIGHT_OS: ${{ inputs.preflight_os }}
          MW_PREFLIGHT_RUNNER: ${{ matrix.os }}
        run: |
          import json
          import os

          allowed = ("ubuntu-24.04", "windows-2025", "macos-15")
          event = os.environ["GITHUB_EVENT_NAME"]
          scope = os.environ.get("MW_PREFLIGHT_SCOPE", "") or "all"
          selection = os.environ.get("MW_PREFLIGHT_OS", "") or "all"
          if event not in ("push", "pull_request", "workflow_dispatch"):
              raise SystemExit("unsupported first-use verification event")
          if scope not in ("all", "preflight") or selection not in ("all", *allowed):
              raise SystemExit("invalid first-use verification scope or runner")
          if event != "workflow_dispatch" and (scope != "all" or selection != "all"):
              raise SystemExit("automatic first-use verification requires the full OS matrix")
          if selection != "all" and not (event == "workflow_dispatch" and scope == "preflight"):
              raise SystemExit("a single OS is permitted only for manual preflight")
          selected = list(allowed) if selection == "all" else [selection]
          if os.environ["MW_PREFLIGHT_RUNNER"] not in selected:
              raise SystemExit("preflight runner does not match the admitted selection")
          print(json.dumps({
              "kind": "runtime-first-use-platform-selection",
              "event": event, "verification_scope": scope,
              "preflight_os": selection, "selected_runners": selected,
              "actual_runner": os.environ["MW_PREFLIGHT_RUNNER"],
              "source_sha": os.environ["MW_SOURCE_SHA"],
              "verifier_sha": os.environ["MW_VERIFIER_SHA"],
          }, sort_keys=True), flush=True)
      - name: Verify and record actual source checkout
        shell: python
        run: |
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          requested = os.environ["MW_SOURCE_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", requested):
              raise SystemExit("source_sha must be a full lowercase commit SHA")
          actual = git("rev-parse", "HEAD")
          if actual != requested:
              raise SystemExit(f"checkout mismatch: requested={requested} actual={actual}")
          print(json.dumps({
              "kind": "runtime-registry-source",
              "requested_source_sha": requested,
              "checkout_sha": actual,
              "tree_sha": git("rev-parse", "HEAD^{tree}"),
              "event_sha": os.environ.get("GITHUB_SHA", ""),
              "workflow_ref": os.environ.get("GITHUB_WORKFLOW_REF", ""),
              "pr_head_sha": os.environ.get("MW_PR_HEAD_SHA", ""),
              "pr_base_sha": os.environ.get("MW_PR_BASE_SHA", ""),
              "runtime_setup_sha256": hashlib.sha256(
                  Path("apps/desktop/src-tauri/src/runtime_setup.rs").read_bytes()
              ).hexdigest(),
              "cargo_lock_sha256": hashlib.sha256(
                  Path("Cargo.lock").read_bytes()
              ).hexdigest(),
          }, sort_keys=True), flush=True)
      - name: Check out the exact verification tool independently of the tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.MW_VERIFIER_SHA }}
          path: .ci-verification
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tooling/ci_test_runner.py
            tooling/tests/test_ci_test_runner.py
      - name: Keep verifier inputs outside the tested checkout
        shell: python
        run: |
          import os
          from pathlib import Path
          import shutil

          target = Path(os.environ["RUNNER_TEMP"]) / "ci-verification-source"
          if target.exists():
              raise SystemExit("Verifier checkout destination already exists")
          shutil.move(".ci-verification", target)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("MW_CI_VERIFIER_ROOT=" + str(target) + "\n")
      - name: Verify failure propagation and fresh entry-point isolation
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys

          command = [
              sys.executable, "-B", str(Path(os.environ["MW_CI_VERIFIER_ROOT"]) / "tooling" / "ci_test_runner.py"),
              "--repo", os.environ["MW_CI_VERIFIER_ROOT"], "--pattern", "test_ci_test_runner.py",
              "--mode", "both", "--expected-source", os.environ["MW_VERIFIER_SHA"],
              "--report", str(Path(os.environ["RUNNER_TEMP"]) / "first-use-verification" / "runner.json"),
          ]
          if sys.platform == "win32":
              command.append("--require-complete")
          subprocess.run(command, check=True)
      - name: Unprivileged first-use tests through discovery and dotted modules
        shell: python
        run: |
          import ast
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          sys.dont_write_bytecode = True
          root = Path.cwd().resolve(strict=True)
          sys.path.insert(0, str(root / "tooling"))
          from source_checkout_observation import source_observation, regular_file

          source = os.environ["MW_SOURCE_SHA"]
          folder = Path(os.environ["RUNNER_TEMP"]) / "first-use-verification"
          folder.mkdir(exist_ok=True)
          verifier = Path(os.environ["MW_CI_VERIFIER_ROOT"]) / "tooling/ci_test_runner.py"
          verifier_identity = regular_file(verifier)
          runtime_names = (
              "test_runtime_first_use_atomic_receipt.py",
              "test_runtime_first_use_audit.py",
              "test_runtime_first_use_reparse.py",
          )
          found = sorted(path.name for path in (root / "tooling/tests").glob("test_runtime_first_use*.py"))
          if found != sorted(runtime_names):
              raise RuntimeError("first_use_wildcard_source_roster_changed")
          definitions = {
              "test_runtime_first_use_audit": ("FirstUseAuditTests", 43),
              "test_runtime_first_use_atomic_receipt": ("AtomicSupportReceiptTests", 9),
              "test_runtime_first_use_reparse": ("ReparseRejectionTests", 8),
              "test_owner_candidate_provenance": ("OwnerCandidateProvenanceTests", 26),
          }
          paths = (
              ".github/workflows/runtime-first-use.yml", "tooling/ci_test_runner.py",
              "tooling/source_checkout_observation.py", "tooling/runtime_first_use_audit.py",
              "tooling/owner_candidate_provenance.py", "tooling/candidate_attestation_input.py",
              "tooling/package_receipt.py", "tooling/release_manifest.py", "tooling/v01_release_readiness.py",
              *(f"tooling/tests/{module}.py" for module in definitions),
              "Cargo.lock", "SOURCE_LOCK.json", "apps/studio/package-lock.json",
          )
          before = source_observation(root, source, paths)
          rosters = {}
          for module, (class_name, count) in definitions.items():
              tree = ast.parse((root / f"tooling/tests/{module}.py").read_bytes())
              classes = [node for node in tree.body if isinstance(node, ast.ClassDef)
                         and any(isinstance(method, ast.FunctionDef) and method.name.startswith("test_")
                                 for method in node.body)]
              methods = [f"{module}.{node.name}.{method.name}" for node in classes for method in node.body
                         if isinstance(method, ast.FunctionDef) and method.name.startswith("test_")]
              all_methods = [node for node in ast.walk(tree)
                             if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                             and node.name.startswith("test_")]
              if ([node.name for node in classes] != [class_name]
                      or len(methods) != len(set(methods)) or len(methods) != count or len(all_methods) != count):
                  raise RuntimeError("first_use_nominal_source_roster_changed:" + module)
              rosters[module] = sorted(methods)
          expected_union = sorted(name for values in rosters.values() for name in values)
          if not len(expected_union) == len(set(expected_union)) == 86:
              raise RuntimeError("first_use_nominal_union_changed")

          def publish(name, value):
              with (folder / name).open("x", encoding="utf-8", newline="\n") as stream:
                  json.dump(value, stream, sort_keys=True, indent=2)
                  stream.write("\n")
                  stream.flush()
                  os.fsync(stream.fileno())

          publish("first-use-source-before.json", {
              "source": before, "nominal_rosters": rosters,
              "verifier_sha": os.environ["MW_VERIFIER_SHA"], "verifier": verifier_identity,
              "scope": "source tests only; runtime publication and provenance fixtures",
          })
          patterns = {
              "discovery": ("test_runtime_first_use*.py", "test_owner_candidate_provenance.py"),
              "dotted": ("test_runtime_first_use_audit.py", "test_runtime_first_use_reparse.py",
                         "test_owner_candidate_provenance.py"),
          }
          expected_steps = {
              "discovery": [
                  ("discovery:test_runtime_first_use*.py",
                   sorted(name for module in definitions if module.startswith("test_runtime_first_use_")
                          for name in rosters[module])),
                  ("discovery:test_owner_candidate_provenance.py", rosters["test_owner_candidate_provenance"]),
              ],
              "dotted": [
                  ("dotted:tooling.tests.test_owner_candidate_provenance", rosters["test_owner_candidate_provenance"]),
                  ("dotted:tooling.tests.test_runtime_first_use_audit",
                   sorted(rosters["test_runtime_first_use_audit"] + rosters["test_runtime_first_use_atomic_receipt"])),
                  ("dotted:tooling.tests.test_runtime_first_use_reparse", rosters["test_runtime_first_use_reparse"]),
              ],
          }
          admitted = {}
          github = {name: os.environ.get(name, "") for name in (
              "GITHUB_SHA", "GITHUB_WORKFLOW_REF", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_JOB")}
          for mode, chosen in patterns.items():
              report = folder / ("first-use-" + mode + ".json")
              command = [sys.executable, "-B", str(verifier), "--repo", "."]
              for pattern in chosen:
                  command += ["--pattern", pattern]
              command += ["--mode", mode, "--expected-source", source, "--report", str(report)]
              # Existing runner records UNKNOWN and nonzero exits; check=True prevents
              # starting a later mode after an uncertain/failed mode. There is no retry.
              subprocess.run(command, check=True)
              receipt_identity = regular_file(report)
              receipt = json.loads(report.read_bytes())
              selected_definitions = set(definitions) if mode == "discovery" else set(definitions) - {
                  "test_runtime_first_use_atomic_receipt"}
              if not (
                  receipt.get("schema") == "motionwright.unittest-execution/1"
                  and receipt.get("status") in ("PASS", "PASS_WITH_OMISSIONS")
                  and type(receipt.get("exit_code")) is int and receipt["exit_code"] == 0
                  and receipt.get("executed_source_sha") == source and receipt.get("tree_sha") == before["tree"]
                  and receipt.get("github") == github and not receipt.get("source_postcheck_error")
                  and receipt.get("runner_sha256") == verifier_identity["sha256"]
                  and receipt.get("test_definition_sha256") == {
                      f"tooling/tests/{module}.py": before["files"][f"tooling/tests/{module}.py"]["checkout"]["sha256"]
                      for module in selected_definitions}
                  and [step.get("entry_point") for step in receipt.get("steps", [])]
                      == [label for label, _ in expected_steps[mode]]
              ):
                  raise RuntimeError("first_use_original_receipt_identity_or_selection_changed")
              entries, observed_union = [], []
              for index, (step, (label, expected)) in enumerate(zip(receipt["steps"], expected_steps[mode])):
                  streams = {}
                  for stream in ("stdout", "stderr"):
                      path = report.with_name(f"{report.stem}-{index:02d}-{stream}.log")
                      actual = regular_file(path, maximum=8 * 1024 * 1024)
                      if step.get(stream) != {"file": path.name, "sha256": actual["sha256"]}:
                          raise RuntimeError("first_use_original_stream_identity_changed")
                      streams[stream] = {"file": path.name, **actual}
                  raw = report.with_name(f"{report.stem}-{index:02d}-stderr.log").read_bytes()
                  text = raw.decode("utf-8", "strict").replace("\r\n", "\n")
                  rows = re.findall(r"(?m)^(test_\w+) \(([^()\n]+)\)(?: \.\.\. .*)?$", text)
                  names = []
                  for method, name in rows:
                      if mode == "dotted":
                          if not name.startswith("tooling.tests."):
                              raise RuntimeError("first_use_foreign_dotted_identity")
                          name = name[len("tooling.tests."):]
                      identity = name if name.endswith("." + method) else name + "." + method
                      names.append(identity)
                  counts = step.get("counts", {})
                  if not (
                      sorted(names) == expected and len(names) == len(set(names))
                      and type(counts.get("tests_run")) is int and counts["tests_run"] == len(expected)
                      and counts.get("terminal_status") == "OK"
                      and type(step.get("exit_code")) is int and step["exit_code"] == 0
                      and step.get("status") in ("PASS", "PASS_WITH_OMISSIONS")
                      and all(type(counts.get(k)) is int and counts[k] == 0 for k in
                              ("failures", "errors", "unexpected_successes"))
                      and all(type(counts.get(k)) is int and counts[k] >= 0 for k in
                              ("passed", "skipped", "expected_failures"))
                      and counts["passed"] + counts["skipped"] + counts["expected_failures"] == len(expected)
                  ):
                      raise RuntimeError("first_use_nominal_omission_duplication_or_failure")
                  observed_union += names
                  entries.append({"entry_point": label, "observed_test_ids": sorted(names),
                                  "counts": counts, "original_streams": streams})
              if sorted(observed_union) != expected_union or len(observed_union) != len(set(observed_union)):
                  raise RuntimeError("first_use_family_missing_or_repeated")
              if regular_file(report) != receipt_identity:
                  raise RuntimeError("first_use_receipt_changed_after_readback")
              admitted[mode] = {"receipt": receipt_identity, "entrypoints": entries,
                                "observed_test_ids": sorted(observed_union)}
          after = source_observation(root, source, paths)
          publish("first-use-source-after.json", {"source": after, "nominal_rosters": rosters})
          if before != after or regular_file(verifier) != verifier_identity:
              raise RuntimeError("first_use_source_or_verifier_changed")
          omissions = sum(step["counts"]["skipped"] + step["counts"]["expected_failures"]
                          for entry in admitted.values() for step in entry["entrypoints"])
          publish("first-use-entrypoint-readback.json", {
              "schema": "motionwright.first-use-family-inventory/1",
              "status": "ACCOUNTED_WITH_OMISSIONS" if omissions else "ACCOUNTED_WITHOUT_OMISSIONS",
              "source_before": before, "source_after": after, "github": github,
              "verifier": verifier_identity, "entrypoints": admitted,
              "nominal_cases_per_mode": len(expected_union), "nominal_invocations": 2 * len(expected_union),
              "omitted_or_skipped_invocations": omissions,
              "installer_execution": "NOT_RUN", "runtime_owner_connection": "NOT_RUN",
              "human_acceptance": "NOT_RUN", "formal_acceptance": False,
          })
      - name: Retain original unittest source identities, failures and omissions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: first-use-verification-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/first-use-verification
          if-no-files-found: error
          retention-days: 14
      - name: Reject unpinned runtime source or leaked project-private files
        run: python tooling/source_policy.py

  windows-reference-preservation:
    if: github.event_name != 'workflow_dispatch' || inputs.verification_scope != 'preflight'
    name: ${{ matrix.check_name }}
    needs: portable-preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            check_name: Windows saved reference crash-safety
          - os: ubuntu-24.04
            check_name: Linux saved reference confinement
          - os: macos-15
            check_name: macOS saved reference confinement
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.MW_SOURCE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Verify and record actual source checkout
        shell: python
        run: |
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          requested = os.environ["MW_SOURCE_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", requested):
              raise SystemExit("source_sha must be a full lowercase commit SHA")
          actual = git("rev-parse", "HEAD")
          if actual != requested:
              raise SystemExit(f"checkout mismatch: requested={requested} actual={actual}")
          print(json.dumps({
              "kind": "runtime-registry-source",
              "requested_source_sha": requested,
              "checkout_sha": actual,
              "tree_sha": git("rev-parse", "HEAD^{tree}"),
              "event_sha": os.environ.get("GITHUB_SHA", ""),
              "workflow_ref": os.environ.get("GITHUB_WORKFLOW_REF", ""),
              "pr_head_sha": os.environ.get("MW_PR_HEAD_SHA", ""),
              "pr_base_sha": os.environ.get("MW_PR_BASE_SHA", ""),
              "runtime_setup_sha256": hashlib.sha256(
                  Path("apps/desktop/src-tauri/src/runtime_setup.rs").read_bytes()
              ).hexdigest(),
              "cargo_lock_sha256": hashlib.sha256(
                  Path("Cargo.lock").read_bytes()
              ).hexdigest(),
          }, sort_keys=True), flush=True)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master resolved
        with:
          toolchain: 1.98.1
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - name: Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Verify macOS compiler and SDK
        if: runner.os == 'macOS'
        run: |
          xcode-select -p
          xcrun --find clang
          xcrun --show-sdk-path
      - name: Format native registry
        run: cargo fmt --all -- --check
      - name: Install trusted desktop frontend dependencies
        run: npm --prefix apps/studio ci --no-audit --no-fund
      - name: Build trusted desktop frontend for Tauri build script
        run: npm --prefix apps/studio run build
      - name: Prepare isolated real NTFS junction fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixtureRoot = Join-Path $env:RUNNER_TEMP "mw-registry-junctions-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $fixtureRoot) {
            throw "Registry junction fixture path already exists"
          }
          $volumeRoot = [System.IO.Path]::GetPathRoot($fixtureRoot)
          $fileSystem = ([System.IO.DriveInfo]::new($volumeRoot)).DriveFormat
          if ($fileSystem -ne 'NTFS') {
            throw "Registry junction gate requires NTFS; observed $fileSystem"
          }
          New-Item -ItemType Directory -Path $fixtureRoot | Out-Null
          $cases = @(
            'root-read', 'root-write', 'root-clear',
            'ancestor-read', 'ancestor-write', 'ancestor-clear',
            'alias-initial', 'alias-retarget'
          )
          foreach ($case in $cases) {
            $caseRoot = Join-Path $fixtureRoot $case
            $originalApp = Join-Path $caseRoot 'original\app-data'
            $decoyApp = Join-Path $caseRoot 'decoy\app-data'
            $originalRegistry = Join-Path $originalApp 'owner-native-connections'
            $decoyRegistry = Join-Path $decoyApp 'owner-native-connections'
            New-Item -ItemType Directory -Path $originalRegistry, $decoyRegistry -Force | Out-Null
            if ($case.StartsWith('root-')) {
              $target = $decoyRegistry
            } elseif ($case.StartsWith('ancestor-')) {
              $target = Join-Path $caseRoot 'decoy'
            } else {
              $target = $originalApp
            }
            $links = @(@{ name = 'prepared-junction'; target = $target })
            if ($case -eq 'alias-retarget') {
              $links += @{ name = 'replacement-junction'; target = $decoyApp }
            }
            foreach ($link in $links) {
              $path = Join-Path $caseRoot $link.name
              New-Item -ItemType Junction -Path $path -Target $link.target | Out-Null
              $entry = Get-Item -LiteralPath $path -Force
              if ($entry.LinkType -ne 'Junction' -or
                  ($entry.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -eq 0) {
                throw "Expected an actual junction at $path"
              }
              [pscustomobject]@{
                kind = 'runtime-registry-ntfs-fixture'
                case = $case
                path = $path
                target = $link.target
                filesystem = $fileSystem
                attributes = $entry.Attributes.ToString()
              } | ConvertTo-Json -Compress
            }
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "MW_REGISTRY_JUNCTION_FIXTURE=$fixtureRoot"
      - name: Exercise registry confinement and preserve existing controls
        shell: python
        run: |
          import json
          import os
          import re
          import subprocess
          import sys

          prefix = "runtime_setup::tests::"
          required = {
              prefix + "saved_reference_is_project_and_generation_scoped_and_survives_reopen",
              prefix + "verified_replacement_is_persistent_and_no_runtime_secrets_are_copied",
              prefix + "forged_scope_and_corrupted_records_are_rejected",
              prefix + "clear_saved_rejects_corrupt_reference_without_deleting_bytes",
              prefix + "clear_saved_rejects_foreign_project_scope_without_deleting_bytes",
              prefix + "clear_saved_rejects_relative_reference_without_deleting_bytes",
              prefix + "selecting_new_connection_never_overwrites_foreign_project_record",
              prefix + "missing_registry_root_rejects_all_operations",
          }
          if sys.platform == "win32":
              if not os.environ.get("MW_REGISTRY_JUNCTION_FIXTURE"):
                  raise SystemExit("The real NTFS fixture was not prepared")
              required.add(prefix + "failed_windows_replace_preserves_last_verified_reference")
              area = prefix + "junction_integrity::"
          else:
              required.add(prefix + "saved_reference_symlink_and_world_readable_files_fail_closed")
              area = prefix + "root_integrity::"
              required.update(
                  area + operation + "_rejects_non_private_root"
                  for operation in ("read", "write", "clear")
              )
          required.update(
              area + operation + "_rejects_" + boundary + "_substitution"
              for operation in ("read", "write", "clear")
              for boundary in ("root", "ancestor")
          )
          required.update({
              area + "initial_app_data_alias_supports_normal_round_trip",
              area + "retargeted_initial_alias_keeps_original_physical_registry",
          })
          command = [
              "cargo", "test", "--locked",
              "-p", "motionwright-desktop",
              "--bin", "motionwright-desktop",
              "runtime_setup::tests",
              "--", "--nocapture", "--include-ignored", "--test-threads=1",
          ]
          print(json.dumps({"kind": "runtime-registry-command", "argv": command}), flush=True)
          process = subprocess.Popen(
              command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              text=True, encoding="utf-8", errors="replace",
          )
          output = []
          for line in process.stdout:
              print(line, end="", flush=True)
              output.append(line)
          returncode = process.wait()
          if returncode:
              raise SystemExit(returncode)
          text = re.sub(r"\x1b\[[0-9;]*m", "", "".join(output))
          summaries = re.findall(
              r"(?m)^test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;",
              text,
          )
          if len(summaries) != 1:
              raise SystemExit("Expected exactly one Rust registry test summary")
          state, passed, failed, ignored = summaries[0]
          passed, failed, ignored = map(int, (passed, failed, ignored))
          missing = sorted(
              name for name in required
              if not re.search(r"(?m)^test " + re.escape(name) + r" \.\.\.", text)
          )
          if state != "ok" or failed or ignored or passed < len(required) or missing:
              raise SystemExit(
                  f"Registry coverage incomplete: passed={passed} failed={failed} "
                  f"ignored={ignored} missing={missing}"
              )
          print(json.dumps({
              "kind": "runtime-registry-complete",
              "platform": sys.platform,
              "required_test_count": len(required),
              "passed": passed,
              "failed": failed,
              "ignored": ignored,
              "required_test_ids": sorted(required),
          }, sort_keys=True), flush=True)

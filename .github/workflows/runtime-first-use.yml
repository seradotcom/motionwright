name: Owner Runtime First-Use Audit

on:
  push:
    branches: ["main", "feat/**"]
    paths:
      - "tooling/runtime_first_use_audit.py"
      - "tooling/tests/test_runtime_first_use*.py"
      - "tooling/ci_test_runner.py"
      - "tooling/tests/test_ci_test_runner.py"
      - "tooling/owner_candidate_provenance.py"
      - "tooling/tests/test_owner_candidate_provenance.py"
      - "apps/desktop/src-tauri/src/runtime_setup.rs"
      - "docs/owner-native-runtime-onboarding.md"
      - "docs/runtime-first-use-audit.md"
      - ".github/workflows/runtime-first-use.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "tooling/runtime_first_use_audit.py"
      - "tooling/tests/test_runtime_first_use*.py"
      - "tooling/ci_test_runner.py"
      - "tooling/tests/test_ci_test_runner.py"
      - "tooling/owner_candidate_provenance.py"
      - "tooling/tests/test_owner_candidate_provenance.py"
      - "apps/desktop/src-tauri/src/runtime_setup.rs"
      - "docs/owner-native-runtime-onboarding.md"
      - "docs/runtime-first-use-audit.md"
      - ".github/workflows/runtime-first-use.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      verification_scope:
        description: Select preflight-only for test-runner/import changes; registry behavior changes require all
        type: choice
        options: [all, preflight]
        required: true
        default: all
      source_sha:
        description: Full lowercase source commit SHA; empty uses the event checkout
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  MW_VERIFIER_SHA: ${{ github.workflow_sha }}
  MW_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
  MW_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  MW_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

concurrency:
  group: first-use-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || '' }}-${{ inputs.verification_scope || 'all' }}
  cancel-in-progress: true

jobs:
  portable-preflight:
    name: First-use preflight (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.MW_SOURCE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Verify and record actual source checkout
        shell: python
        run: |
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          requested = os.environ["MW_SOURCE_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", requested):
              raise SystemExit("source_sha must be a full lowercase commit SHA")
          actual = git("rev-parse", "HEAD")
          if actual != requested:
              raise SystemExit(f"checkout mismatch: requested={requested} actual={actual}")
          print(json.dumps({
              "kind": "runtime-registry-source",
              "requested_source_sha": requested,
              "checkout_sha": actual,
              "tree_sha": git("rev-parse", "HEAD^{tree}"),
              "event_sha": os.environ.get("GITHUB_SHA", ""),
              "workflow_ref": os.environ.get("GITHUB_WORKFLOW_REF", ""),
              "pr_head_sha": os.environ.get("MW_PR_HEAD_SHA", ""),
              "pr_base_sha": os.environ.get("MW_PR_BASE_SHA", ""),
              "runtime_setup_sha256": hashlib.sha256(
                  Path("apps/desktop/src-tauri/src/runtime_setup.rs").read_bytes()
              ).hexdigest(),
              "cargo_lock_sha256": hashlib.sha256(
                  Path("Cargo.lock").read_bytes()
              ).hexdigest(),
          }, sort_keys=True), flush=True)
      - name: Check out the exact verification tool independently of the tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.MW_VERIFIER_SHA }}
          path: .ci-verification
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tooling/ci_test_runner.py
            tooling/tests/test_ci_test_runner.py
      - name: Keep verifier inputs outside the tested checkout
        shell: python
        run: |
          import os
          from pathlib import Path
          import shutil

          target = Path(os.environ["RUNNER_TEMP"]) / "ci-verification-source"
          if target.exists():
              raise SystemExit("Verifier checkout destination already exists")
          shutil.move(".ci-verification", target)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("MW_CI_VERIFIER_ROOT=" + str(target) + "\n")
      - name: Verify failure propagation and fresh entry-point isolation
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys

          command = [
              sys.executable, "-B", str(Path(os.environ["MW_CI_VERIFIER_ROOT"]) / "tooling" / "ci_test_runner.py"),
              "--repo", os.environ["MW_CI_VERIFIER_ROOT"], "--pattern", "test_ci_test_runner.py",
              "--mode", "both", "--expected-source", os.environ["MW_VERIFIER_SHA"],
              "--report", str(Path(os.environ["RUNNER_TEMP"]) / "first-use-verification" / "runner.json"),
          ]
          if sys.platform == "win32":
              command.append("--require-complete")
          subprocess.run(command, check=True)
      - name: Unprivileged first-use tests through discovery and dotted modules
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys

          subprocess.run([
              sys.executable, "-B", str(Path(os.environ["MW_CI_VERIFIER_ROOT"]) / "tooling" / "ci_test_runner.py"),
              "--repo", ".", "--pattern", "test_runtime_first_use*.py",
              "--pattern", "test_owner_candidate_provenance.py", "--mode", "both",
              "--expected-source", os.environ["MW_SOURCE_SHA"],
              "--report", str(Path(os.environ["RUNNER_TEMP"]) / "first-use-verification" / "first-use.json"),
          ], check=True)
      - name: Retain original unittest source identities, failures and omissions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: first-use-verification-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/first-use-verification
          if-no-files-found: error
          retention-days: 14
      - name: Reject unpinned runtime source or leaked project-private files
        run: python tooling/source_policy.py

  windows-reference-preservation:
    if: github.event_name != 'workflow_dispatch' || inputs.verification_scope != 'preflight'
    name: ${{ matrix.check_name }}
    needs: portable-preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            check_name: Windows saved reference crash-safety
          - os: ubuntu-24.04
            check_name: Linux saved reference confinement
          - os: macos-15
            check_name: macOS saved reference confinement
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.MW_SOURCE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Verify and record actual source checkout
        shell: python
        run: |
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          requested = os.environ["MW_SOURCE_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", requested):
              raise SystemExit("source_sha must be a full lowercase commit SHA")
          actual = git("rev-parse", "HEAD")
          if actual != requested:
              raise SystemExit(f"checkout mismatch: requested={requested} actual={actual}")
          print(json.dumps({
              "kind": "runtime-registry-source",
              "requested_source_sha": requested,
              "checkout_sha": actual,
              "tree_sha": git("rev-parse", "HEAD^{tree}"),
              "event_sha": os.environ.get("GITHUB_SHA", ""),
              "workflow_ref": os.environ.get("GITHUB_WORKFLOW_REF", ""),
              "pr_head_sha": os.environ.get("MW_PR_HEAD_SHA", ""),
              "pr_base_sha": os.environ.get("MW_PR_BASE_SHA", ""),
              "runtime_setup_sha256": hashlib.sha256(
                  Path("apps/desktop/src-tauri/src/runtime_setup.rs").read_bytes()
              ).hexdigest(),
              "cargo_lock_sha256": hashlib.sha256(
                  Path("Cargo.lock").read_bytes()
              ).hexdigest(),
          }, sort_keys=True), flush=True)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master resolved
        with:
          toolchain: 1.98.1
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - name: Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Verify macOS compiler and SDK
        if: runner.os == 'macOS'
        run: |
          xcode-select -p
          xcrun --find clang
          xcrun --show-sdk-path
      - name: Format native registry
        run: cargo fmt --all -- --check
      - name: Install trusted desktop frontend dependencies
        run: npm --prefix apps/studio ci --no-audit --no-fund
      - name: Build trusted desktop frontend for Tauri build script
        run: npm --prefix apps/studio run build
      - name: Prepare isolated real NTFS junction fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixtureRoot = Join-Path $env:RUNNER_TEMP "mw-registry-junctions-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $fixtureRoot) {
            throw "Registry junction fixture path already exists"
          }
          $volumeRoot = [System.IO.Path]::GetPathRoot($fixtureRoot)
          $fileSystem = ([System.IO.DriveInfo]::new($volumeRoot)).DriveFormat
          if ($fileSystem -ne 'NTFS') {
            throw "Registry junction gate requires NTFS; observed $fileSystem"
          }
          New-Item -ItemType Directory -Path $fixtureRoot | Out-Null
          $cases = @(
            'root-read', 'root-write', 'root-clear',
            'ancestor-read', 'ancestor-write', 'ancestor-clear',
            'alias-initial', 'alias-retarget'
          )
          foreach ($case in $cases) {
            $caseRoot = Join-Path $fixtureRoot $case
            $originalApp = Join-Path $caseRoot 'original\app-data'
            $decoyApp = Join-Path $caseRoot 'decoy\app-data'
            $originalRegistry = Join-Path $originalApp 'owner-native-connections'
            $decoyRegistry = Join-Path $decoyApp 'owner-native-connections'
            New-Item -ItemType Directory -Path $originalRegistry, $decoyRegistry -Force | Out-Null
            if ($case.StartsWith('root-')) {
              $target = $decoyRegistry
            } elseif ($case.StartsWith('ancestor-')) {
              $target = Join-Path $caseRoot 'decoy'
            } else {
              $target = $originalApp
            }
            $links = @(@{ name = 'prepared-junction'; target = $target })
            if ($case -eq 'alias-retarget') {
              $links += @{ name = 'replacement-junction'; target = $decoyApp }
            }
            foreach ($link in $links) {
              $path = Join-Path $caseRoot $link.name
              New-Item -ItemType Junction -Path $path -Target $link.target | Out-Null
              $entry = Get-Item -LiteralPath $path -Force
              if ($entry.LinkType -ne 'Junction' -or
                  ($entry.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -eq 0) {
                throw "Expected an actual junction at $path"
              }
              [pscustomobject]@{
                kind = 'runtime-registry-ntfs-fixture'
                case = $case
                path = $path
                target = $link.target
                filesystem = $fileSystem
                attributes = $entry.Attributes.ToString()
              } | ConvertTo-Json -Compress
            }
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "MW_REGISTRY_JUNCTION_FIXTURE=$fixtureRoot"
      - name: Exercise registry confinement and preserve existing controls
        shell: python
        run: |
          import json
          import os
          import re
          import subprocess
          import sys

          prefix = "runtime_setup::tests::"
          required = {
              prefix + "saved_reference_is_project_and_generation_scoped_and_survives_reopen",
              prefix + "verified_replacement_is_persistent_and_no_runtime_secrets_are_copied",
              prefix + "forged_scope_and_corrupted_records_are_rejected",
              prefix + "clear_saved_rejects_corrupt_reference_without_deleting_bytes",
              prefix + "clear_saved_rejects_foreign_project_scope_without_deleting_bytes",
              prefix + "clear_saved_rejects_relative_reference_without_deleting_bytes",
              prefix + "selecting_new_connection_never_overwrites_foreign_project_record",
              prefix + "missing_registry_root_rejects_all_operations",
          }
          if sys.platform == "win32":
              if not os.environ.get("MW_REGISTRY_JUNCTION_FIXTURE"):
                  raise SystemExit("The real NTFS fixture was not prepared")
              required.add(prefix + "failed_windows_replace_preserves_last_verified_reference")
              area = prefix + "junction_integrity::"
          else:
              required.add(prefix + "saved_reference_symlink_and_world_readable_files_fail_closed")
              area = prefix + "root_integrity::"
              required.update(
                  area + operation + "_rejects_non_private_root"
                  for operation in ("read", "write", "clear")
              )
          required.update(
              area + operation + "_rejects_" + boundary + "_substitution"
              for operation in ("read", "write", "clear")
              for boundary in ("root", "ancestor")
          )
          required.update({
              area + "initial_app_data_alias_supports_normal_round_trip",
              area + "retargeted_initial_alias_keeps_original_physical_registry",
          })
          command = [
              "cargo", "test", "--locked",
              "-p", "motionwright-desktop",
              "--bin", "motionwright-desktop",
              "runtime_setup::tests",
              "--", "--nocapture", "--include-ignored", "--test-threads=1",
          ]
          print(json.dumps({"kind": "runtime-registry-command", "argv": command}), flush=True)
          process = subprocess.Popen(
              command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              text=True, encoding="utf-8", errors="replace",
          )
          output = []
          for line in process.stdout:
              print(line, end="", flush=True)
              output.append(line)
          returncode = process.wait()
          if returncode:
              raise SystemExit(returncode)
          text = re.sub(r"\x1b\[[0-9;]*m", "", "".join(output))
          summaries = re.findall(
              r"(?m)^test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;",
              text,
          )
          if len(summaries) != 1:
              raise SystemExit("Expected exactly one Rust registry test summary")
          state, passed, failed, ignored = summaries[0]
          passed, failed, ignored = map(int, (passed, failed, ignored))
          missing = sorted(
              name for name in required
              if not re.search(r"(?m)^test " + re.escape(name) + r" \.\.\.", text)
          )
          if state != "ok" or failed or ignored or passed < len(required) or missing:
              raise SystemExit(
                  f"Registry coverage incomplete: passed={passed} failed={failed} "
                  f"ignored={ignored} missing={missing}"
              )
          print(json.dumps({
              "kind": "runtime-registry-complete",
              "platform": sys.platform,
              "required_test_count": len(required),
              "passed": passed,
              "failed": failed,
              "ignored": ignored,
              "required_test_ids": sorted(required),
          }, sort_keys=True), flush=True)

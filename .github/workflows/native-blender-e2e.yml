  # Register this composed producer profile in the release verification catalogue.
  # A selector is not evidence: this job's original G0/G1/G2 results
  # must be admitted on the exact candidate source/run/attempt separately.
  native-blender-lit-still:
    if: github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'lit-still'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERIFICATION_SCOPE: ${{ inputs.verification_scope }}
      EXPECTED_SOURCE: ${{ inputs.expected_source_sha }}
      MOTIONWRIGHT_EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      RECOVERY_RECIPIENT: ${{ inputs.recovery_recipient }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Reject implicit source, unsupported scope and native retries
      run: |
        python3 - <<'PY'
        import os, re
        if (os.environ['GITHUB_EVENT_NAME'] != 'workflow_dispatch'
            or os.environ['VERIFICATION_SCOPE'] != 'lit-still'
            or os.environ['GITHUB_RUN_ATTEMPT'] != '1'
            or re.fullmatch(r'[0-9a-f]{40}', os.environ['EXPECTED_SOURCE']) is None
            or os.environ['EXPECTED_SOURCE'] != os.environ['GITHUB_SHA']):
            raise SystemExit('Explicit first attempt on the exact composed source required')
        PY
    - name: Resolve exact Semwright source pin
      id: lit_pin
      run: |
        python3 - <<'PY'
        import json, os, re
        from pathlib import Path
        sha = json.loads(Path('SOURCE_LOCK.json').read_bytes())['dependencies']['semwright']['revision']
        if type(sha) is not str or re.fullmatch(r'[0-9a-f]{40}', sha) is None:
            raise SystemExit('Invalid Semwright source pin')
        with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
            out.write('sha=' + sha + '\n')
        PY

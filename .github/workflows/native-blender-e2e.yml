    - name: Verify affected lit producer contracts on source requests
      id: lit_source
      if: github.event_name == 'pull_request' || inputs.verification_scope == 'source'
      run: |
        set +e
        "$RUNNER_TEMP/blender-original-venv/bin/python" tooling/ci_test_runner.py \
          --pattern test_native_blender_lit_still_oracle.py \
          --pattern test_native_blender_lit_seed_policy.py \
          --mode both --require-complete --expected-source "$GITHUB_SHA" \
          --report "$RUNNER_TEMP/blender-lit-source-tests.json" \
          > "$RUNNER_TEMP/blender-lit-source-console.stdout" 2> "$RUNNER_TEMP/blender-lit-source-console.stderr"
        source_exit=$?
        set -e
        SOURCE_TEST_EXIT="$source_exit" python3 - <<'PY'
        import json, os
        from pathlib import Path
        def require(value, code):
            if not value:
                raise ValueError(code)

        def strict(raw):
            def pairs(items):
                result = {}
                for key, value in items:
                    require(key not in result, "duplicate-json-key")
                    result[key] = value
                return result
            return json.loads(raw, object_pairs_hook=pairs,
                              parse_constant=lambda _: (_ for _ in ()).throw(ValueError("json-nonfinite")))

        def closed_g0_summary(report, runner_exit, source_sha):
            """Public PR diagnostic only; original-readback admission stays separate."""
            entries = {
                "discovery:test_native_blender_lit_still_oracle.py": 63,
                "dotted:tooling.tests.test_native_blender_lit_still_oracle": 63,
                "discovery:test_native_blender_lit_seed_policy.py": 6,
                "dotted:tooling.tests.test_native_blender_lit_seed_policy": 6,
            }
            keys = ("tests_run", "passed", "failures", "errors", "skipped", "expected_failures", "unexpected_successes")
            safe = []
            valid = (type(runner_exit) is int and runner_exit == 0 and type(report) is dict
                     and report.get("status") == "PASS" and type(report.get("exit_code")) is int
                     and report.get("exit_code") == 0 and report.get("executed_source_sha") == source_sha)
            rows = report.get("steps", []) if type(report) is dict else []
            if type(rows) is not list or len(rows) != len(entries):
                valid = False
                rows = []
            for row in rows:
                counts = row.get("counts", {}) if type(row) is dict else {}
                if (type(row) is not dict or row.get("entry_point") not in entries
                        or type(counts) is not dict
                        or not all(type(counts.get(k)) is int and 0 <= counts[k] <= 10000 for k in keys)):
                    valid = False
                    continue
                safe.append({"entry_point": row["entry_point"], "counts": {k: counts[k] for k in keys}})
                valid = valid and row.get("status") == "PASS" and type(row.get("exit_code")) is int and row.get("exit_code") == 0
                count = entries[row["entry_point"]]
                valid = valid and counts["tests_run"] == count and counts["passed"] == count and all(counts[k] == 0 for k in keys[2:])
            valid = valid and len(safe) == len(entries) and {r["entry_point"] for r in safe} == set(entries)
            return {"schema": "motionwright.blender.lit-still-source-summary/2", "source_sha": source_sha,
                    "status": "PASS" if valid else "FAIL", "entrypoints": safe,
                    "source_logs_upload_requested": True,
                    "source_logs_public_retention": "NOT_VERIFIED_BY_THIS_SUMMARY",
                    "original_evidence_admitted": False,
                    "formal_acceptance": False}
        try:
            path = Path(os.environ["RUNNER_TEMP"]) / "blender-lit-source-tests.json"
            with path.open("rb") as stream:
                raw = stream.read(4 * 1024 * 1024 + 1)
            require(len(raw) <= 4 * 1024 * 1024, "summary-receipt-budget")
            report = strict(raw)
        except (ValueError, OSError):
            report = None
        summary = closed_g0_summary(report, int(os.environ["SOURCE_TEST_EXIT"]), os.environ["GITHUB_SHA"])
        output = Path("verification/native-blender-lit-source-public")
        output.mkdir(parents=True, exist_ok=False)
        with (output / "source-summary.json").open("x", encoding="utf-8") as handle:
            json.dump(summary, handle, sort_keys=True)
            handle.write("\n")
        print(json.dumps(summary, sort_keys=True))
        raise SystemExit(0 if summary["status"] == "PASS" else 1)
        PY

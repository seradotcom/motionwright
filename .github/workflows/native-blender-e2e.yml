      run: |
        "$RUNNER_TEMP/blender-lit-venv/bin/python" "$RUNNER_TEMP/blender-lit-wiring.py" g1
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: seradotcom/semwright
        ref: ${{ steps.lit_pin.outputs.sha }}

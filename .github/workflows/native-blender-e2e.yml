        def retain():
            (out / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
        retain()
        try:
            if len(ROSTER) != 29 or len({r["name"] for r in ROSTER}) != 29:
                raise ValueError("required Rust roster differs")
            build_argv = ["cargo", "build", "--locked", "-p", "motionwright-native",
                          "--example", "native-blender-lit-still-e2e"]

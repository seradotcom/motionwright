    - name: Install verified Blender and decoded-media dependencies
      env:
        BLENDER_URL: https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz
        BLENDER_SHA256: 9ba871ff2ecd36526b77432745980b7e6664ecd0c7ca11c48849073dcfe06da3
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y \
          bubblewrap fontconfig xz-utils libpipewire-0.3-dev pkg-config clang ffmpeg
        curl --fail --location --retry 3 --output "$RUNNER_TEMP/blender-lit.tar.xz" "$BLENDER_URL"
        echo "$BLENDER_SHA256  $RUNNER_TEMP/blender-lit.tar.xz" | sha256sum --check -
        sudo tar -xJf "$RUNNER_TEMP/blender-lit.tar.xz" -C /usr/local
        test "$("$SEMWRIGHT_TEST_BLENDER_ROOT/blender" --version | head -1)" = "Blender 4.5.14 LTS"
        ffmpeg -version
        bwrap --version
    - name: Configure disposable-runner Driver Host sandbox
      run: |
        bash _semwright/scripts/dev/ci-driver-bwrap-profile.sh \
          "$RUNNER_TEMP/blender-lit-sandbox-profile.txt"
    - name: Build exact SDK Broker, sandbox and Blender provider
      working-directory: _semwright
      run: |
        cargo build --locked -p semwright-daemon -p semwright-cli --bins
        cargo build --locked -p semwright-plugin-host --bin semwright-sandbox \
          -p semwright-driver-blender --bin semwright-blender-driver \
          --bin semwright-blender-session-runner
    - name: G2 one explicit lit create-edit-reopen-light-control attempt
      id: lit_native
      if: success() && steps.lit_g1.outcome == 'success'
      env:
        EXACT_SEMWRIGHT_SHA: ${{ steps.lit_pin.outputs.sha }}
        SEMWRIGHT_TEST_DRIVER_SANDBOX: '1'
        SEMWRIGHT_TEST_SANDBOX_HELPER: ${{ github.workspace }}/_semwright/target/debug/semwright-sandbox
      run: |
        "$RUNNER_TEMP/blender-lit-venv/bin/python" "$RUNNER_TEMP/blender-lit-wiring.py" native
    - name: Seal already-selected private originals and retain UNKNOWN as failure
      id: lit_seal
      if: always() && steps.lit_preflight.outcome == 'success'
      env:
        NATIVE_STEP_OUTCOME: ${{ steps.lit_native.outcome }}
        EXACT_SEMWRIGHT_SHA: ${{ steps.lit_pin.outputs.sha }}
      run: |
        "$RUNNER_TEMP/blender-lit-venv/bin/python" "$RUNNER_TEMP/blender-lit-wiring.py" seal
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always() && steps.lit_seal.outputs.sealed == 'true'
      with:
        name: motionwright-blender-lit-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          verification/native-blender-lit-still-staged/public-evidence.json
          verification/native-blender-lit-still-staged/private-evidence.mwseal
        if-no-files-found: error
        retention-days: 14

name: Native Blender round-trip

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'SOURCE_LOCK.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/domain/**'
      - 'crates/service/**'
      - 'crates/storage/**'
      - 'crates/native/**'
      - 'tooling/native_blender_e2e.py'
      - '.github/workflows/native-blender-e2e.yml'

permissions:
  contents: read

concurrency:
  group: native-blender-roundtrip-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  SEMWRIGHT_CHECKOUT: ${{ github.workspace }}/_semwright
  SEMWRIGHT_TEST_BLENDER_ROOT: /usr/local/blender-4.5.14-linux-x64

jobs:
  native-blender-roundtrip:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Resolve exact Semwright source pin
        id: pin
        run: |
          sha="$(python3 -c 'import json; print(json.load(open("SOURCE_LOCK.json"))["dependencies"]["semwright"]["revision"])')"
          test "${#sha}" -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: seradotcom/semwright
          ref: ${{ steps.pin.outputs.sha }}
          path: _semwright
          persist-credentials: false

      - name: Verify immutable source identities
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git -C _semwright rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"
          python3 tooling/source_policy.py

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: motionwright-native-blender-1.98.1
          cache-on-failure: true

      - name: Install verified Blender and sandbox dependencies
        env:
          BLENDER_URL: https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz
          BLENDER_SHA256: 9ba871ff2ecd36526b77432745980b7e6664ecd0c7ca11c48849073dcfe06da3
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bubblewrap fontconfig xz-utils libpipewire-0.3-dev pkg-config clang
          curl --fail --location --retry 3 --output /tmp/blender.tar.xz "$BLENDER_URL"
          echo "$BLENDER_SHA256  /tmp/blender.tar.xz" | sha256sum --check -
          sudo tar -xJf /tmp/blender.tar.xz -C /usr/local
          test "$("$SEMWRIGHT_TEST_BLENDER_ROOT/blender" --version | head -1)" = "Blender 4.5.14 LTS"
          bwrap --version

      - name: Configure disposable-runner Driver Host sandbox
        run: |
          bash _semwright/scripts/dev/ci-driver-bwrap-profile.sh \
            "$GITHUB_WORKSPACE/verification/native-blender-e2e/sandbox-profile.txt"

      - name: Build exact Semwright Broker, sandbox and Blender provider
        working-directory: _semwright
        run: |
          cargo build --locked -p semwright-daemon -p semwright-cli --bins
          cargo build --locked \
            -p semwright-plugin-host --bin semwright-sandbox \
            -p semwright-driver-blender \
            --bin semwright-blender-driver \
            --bin semwright-blender-session-runner

      - name: Build bounded Motionwright Blender acceptance
        run: |
          cargo build --locked -p motionwright-native --example native-blender-e2e
          cargo test --locked -p motionwright-native blender -- --nocapture

      - name: Realize application-owned scene through real Broker and Blender Driver Host
        env:
          SEMWRIGHT_TEST_DRIVER_SANDBOX: '1'
          SEMWRIGHT_TEST_SANDBOX_HELPER: ${{ github.workspace }}/_semwright/target/debug/semwright-sandbox
        run: |
          python3 tooling/native_blender_e2e.py \
            | tee verification/native-blender-e2e/run.log

      - name: Verify Blender review evidence
        run: |
          test -s "verification/native-blender-e2e/${GITHUB_SHA}/result.json"
          test -s "verification/native-blender-e2e/${GITHUB_SHA}/motionwright-blender-evidence.json"
          test -s "verification/native-blender-e2e/${GITHUB_SHA}/motionwright-contribution.glb"
          python3 - <<'PY'
          import json, os, struct
          from pathlib import Path
          root = Path("verification/native-blender-e2e") / os.environ["GITHUB_SHA"]
          result = json.loads((root / "result.json").read_text())
          assert result["native_blender_e2e"] == "PASS"
          assert result["motionwright_sha"] == os.environ["GITHUB_SHA"]
          assert len(result["semwright_sha"]) == 40
          assert result["glb"]["meshes"] >= 2
          assert result["glb"]["materials"] >= 2
          data = (root / "motionwright-contribution.glb").read_bytes()
          magic, version, length = struct.unpack("<4sII", data[:12])
          assert magic == b"glTF" and version == 2 and length == len(data)
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: motionwright-native-blender-${{ github.sha }}
          path: verification/native-blender-e2e
          if-no-files-found: error
          retention-days: 14

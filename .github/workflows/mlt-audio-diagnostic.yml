name: MLT audio observer source checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/mlt-audio-diagnostic.yml'
      - 'tooling/mlt-audio-diagnostic/**'
      - 'tooling/mlt_repair_verification.py'
      - 'tooling/tests/test_mlt_repair_verification.py'
permissions:
  contents: read
concurrency:
  group: mlt-audio-observer-source-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  observer-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare isolated source verification
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/mw-mlt-source-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$work"
          mkdir "$work"/{source,build,constructors,public,tmp,control}
          control="$work/control"
          export MW_DIAG_SOURCE="$control/source"
          export MW_DIAG_VERIFY="$control/verification"
          export MW_DIAG_CHECK="$control/check-source.py"
          echo "MW_DIAG_WORK=$work" >> "$GITHUB_ENV"
          echo "TMPDIR=$work/tmp" >> "$GITHUB_ENV"
          echo "MW_DIAG_SOURCE=$MW_DIAG_SOURCE" >> "$GITHUB_ENV"
          echo "MW_DIAG_VERIFY=$MW_DIAG_VERIFY" >> "$GITHUB_ENV"
          echo "MW_DIAG_CHECK=$MW_DIAG_CHECK" >> "$GITHUB_ENV"
          cat > "$MW_DIAG_CHECK" <<'PY'
          import ast,hashlib,json,os,pathlib,re,shutil,stat,subprocess,sys

          def require(ok,message):
              if not ok: raise SystemExit(message)

          repo=pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          export=pathlib.Path(os.environ["MW_DIAG_SOURCE"])
          verifier=pathlib.Path(os.environ["MW_DIAG_VERIFY"])
          expected=os.environ["GITHUB_SHA"]
          require(re.fullmatch(r"[0-9a-f]{40}",expected),"invalid source SHA")
          for directory in (export,verifier):
              require(directory.is_absolute() and not directory.resolve().is_relative_to(repo),
                      "export must be outside checkout")
          env={k:v for k,v in os.environ.items() if not k.upper().startswith("GIT_")}
          env.update(GIT_CONFIG_NOSYSTEM="1",GIT_CONFIG_SYSTEM=os.devnull,
                     GIT_CONFIG_GLOBAL=os.devnull,GIT_GRAFT_FILE=os.devnull,
                     GIT_NO_LAZY_FETCH="1",GIT_OPTIONAL_LOCKS="0",GIT_TERMINAL_PROMPT="0")
          git_exe=shutil.which("git")
          require(git_exe is not None,"git unavailable")
          def git(*args):
              return subprocess.check_output([git_exe,"--no-replace-objects","-C",str(repo),
                                              "-c","core.fsmonitor=false",*args],env=env)

          folder="tooling/mlt-audio-diagnostic"
          names={"audio_tap.h","instrument_consumer.py","verify_trace.py",
                 "test_verify_trace.py","test_audio_tap.c","README.md",
                 "repair_planar_source.py","test_repair_planar_source.py","test_planar_padding.c"}
          verify_paths={"tooling/mlt_repair_verification.py",
                        "tooling/tests/test_mlt_repair_verification.py"}
          source_paths={folder+"/"+name for name in names}|verify_paths
          attestor_paths={"tooling/native_mlt_loaded_module.py",
                          "tooling/tests/test_native_mlt_loaded_module.py"}
          workflow_path=".github/workflows/mlt-audio-diagnostic.yml"
          require(pathlib.Path(git("rev-parse","--show-toplevel").decode().strip()).resolve()==repo,
                  "wrong worktree")
          require(git("rev-parse","HEAD").decode().strip()==expected,"HEAD differs from requested SHA")
          require(not git("status","--porcelain=v1","--untracked-files=all"),"checkout changed or untracked")
          require(not git("ls-files","--others","--ignored","--exclude-standard","-z"),
                  "ignored checkout files")
          for p in (repo/"tooling",repo/folder,repo/"tooling/tests",repo/".github",
                    repo/".github/workflows"):
              require(p.is_dir() and not p.is_symlink(),"source directory is not regular")
          require({p.name for p in (repo/folder).iterdir()}==names,"diagnostic source set is not closed")
          originals={}
          oids={}
          for path in sorted(source_paths|attestor_paths|{workflow_path}):
              entries=git("ls-tree","-rz",expected,"--",path).split(b"\0")
              require(len(entries)==2 and entries[-1]==b"","expected one source blob")
              metadata,raw_path=entries[0].split(b"\t",1)
              mode,kind,oid=metadata.split()
              require(mode in (b"100644",b"100755") and kind==b"blob","nonregular source blob")
              require(raw_path.decode("utf-8")==path,"source path differs")
              data=git("cat-file","blob",oid.decode("ascii"))
              require(hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
                      ==oid.decode("ascii"),"Git blob object digest differs")
              p=repo/path
              require(stat.S_ISREG(p.lstat().st_mode) and p.read_bytes()==data,
                      "worktree bytes differ from Git blob")
              originals[path]=data
              oids[path]=oid.decode("ascii")
          require(set(originals)==source_paths|attestor_paths|{workflow_path},
                  "missing source or attestor blob")
          # G0: all 3 G1 suites must remain bound to the exact committed tests.
          # Reuse authenticated Git blobs; execute BEFORE FFmpeg package installation
          # or the upstream MLT download. Do not replace any later result guards.
          def static_test_count(path,minimum):
              module=ast.parse(originals[path].decode("utf-8"))
              require(not any(isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef))
                              and node.name=="load_tests" for node in ast.walk(module)),
                      "dynamic MLT unittest loading cannot authorize G1")
              classes=[cls for cls in module.body if isinstance(cls,ast.ClassDef)
                       and any(isinstance(parent,ast.Attribute)
                               and isinstance(parent.value,ast.Name)
                               and parent.value.id=="unittest" and parent.attr=="TestCase"
                               for parent in cls.bases)]
              cases=[(cls.name,method.name) for cls in classes for method in cls.body
                     if isinstance(method,ast.FunctionDef) and method.name.startswith("test_")]
              all_cases=[(cls.name,method.name) for cls in module.body if isinstance(cls,ast.ClassDef)
                         for method in cls.body if isinstance(method,ast.FunctionDef)
                         and method.name.startswith("test_")]
              require(len(cases)>=minimum and len(cases)==len(all_cases)
                      and len(set(cases))==len(cases),
                      "MLT source test inventory incomplete or ambiguous")
              return len(cases)
          workflow=originals[workflow_path].decode("utf-8")
          def required_step(label):
              marker="\n      - name: "+label+"\n        run: |"
              require(workflow.count(marker)==1,"MLT G1 step missing or ambiguous")
              return workflow.split(marker,1)[1].split("\n      - name:",1)[0]
          inventories=(
              ("tooling/tests/test_mlt_repair_verification.py",26,
               "Verify source composition and identity contracts",
               ((r'suite\.countTestCases\(\)!=(\d+)',"step"),
                (r'result\.testsRun==(\d+) and result\.wasSuccessful\(\)',"step"),
                (r'\("composition-contracts\.json",(\d+)\)',"workflow"),
                (r'"source_composition":(\d+)',"workflow"))),
              ("tooling/mlt-audio-diagnostic/test_verify_trace.py",32,
               "Independently decode constructor traces",
               ((r'suite\.countTestCases\(\)!=(\d+)',"step"),
                (r'result\.testsRun!=(\d+)',"step"),
                (r'Ran (\d+) tests in ',"step"),
                (r'"original_observer":(\d+)',"workflow"))),
              ("tooling/mlt-audio-diagnostic/test_repair_planar_source.py",13,
               "Verify the pinned planar repair source",
               ((r'suite\.countTestCases\(\)!=(\d+)',"step"),
                (r'result\.testsRun==(\d+) and result\.wasSuccessful\(\)',"step"),
                (r'\("repair-contracts\.json",(\d+)\)',"workflow"),
                (r'"planar_repair":(\d+)',"workflow")))
          )
          for test_path,minimum,step_name,checks in inventories:
              case_count=static_test_count(test_path,minimum)
              step=required_step(step_name)
              for pattern,scope in checks:
                  matches=re.findall(pattern,step if scope=="step" else workflow)
                  require(len(matches)==1 and int(matches[0])==case_count,
                          "MLT G1 count differs from exact committed test inventory")
          require(len(sys.argv)==2 and sys.argv[1] in ("export","verify"),"expected export or verify")
          if sys.argv[1]=="export":
              export.mkdir(exist_ok=False)
              verifier.mkdir(exist_ok=False)
              for path in sorted(source_paths):
                  destination=(verifier if path in verify_paths else export)/pathlib.Path(path).name
                  with destination.open("xb") as handle: handle.write(originals[path])
          for directory,expected_names in (
              (export,names),(verifier,{pathlib.Path(path).name for path in verify_paths})
          ):
              require(directory.is_dir() and not directory.is_symlink(),"export directory is not regular")
              require({p.name for p in directory.iterdir()}==expected_names,"export source set changed")
          for path in source_paths:
              p=(verifier if path in verify_paths else export)/pathlib.Path(path).name
              require(stat.S_ISREG(p.lstat().st_mode) and p.read_bytes()==originals[path],"export bytes changed")
          print(json.dumps({"schema":"motionwright.mlt-observer-source-inputs/1",
                            "source_sha":expected,"tree":git("rev-parse",expected+"^{tree}").decode().strip(),
                            "sources":{path:hashlib.sha256(originals[path]).hexdigest()
                                       for path in sorted(source_paths)},
                            "source_blob_oids":{path:oids[path] for path in sorted(source_paths)},
                            "attestor_sources":{path:hashlib.sha256(originals[path]).hexdigest()
                                                for path in sorted(attestor_paths)},
                            "attestor_blob_oids":{path:oids[path] for path in sorted(attestor_paths)},
                            "workflow":{"path":workflow_path,"sha256":hashlib.sha256(originals[workflow_path]).hexdigest(),
                                        "git_blob_oid":oids[workflow_path]}},sort_keys=True,indent=2))
          PY
          python3 -B -I -S "$MW_DIAG_CHECK" export > "$work/public/source-inputs.json"
      - name: Verify original loaded MLT module attestor source controls (G0)
        run: |
          set -euo pipefail
          python3 -B tooling/ci_test_runner.py --repo . --test-directory tooling/tests \
            --pattern test_native_mlt_loaded_module.py --mode both \
            --expected-source "$GITHUB_SHA" --require-complete \
            --report "$MW_DIAG_WORK/public/loaded-module-contracts.json"
          python3 -B -I -S - <<'PY'
          import hashlib,json,os,pathlib
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          root=pathlib.Path(os.environ["MW_DIAG_WORK"])/"public"
          source=json.loads((root/"source-inputs.json").read_text())
          receipt=json.loads((root/"loaded-module-contracts.json").read_text())
          test="tooling/tests/test_native_mlt_loaded_module.py"
          reader="tooling/native_mlt_loaded_module.py"
          expected={reader:"e072a2d02a8ac358b1652a105cb183d5df3b7c8564bd6a95d2a441cab3bc08fd",
                    test:"eac8fdf9c83725b58eccabc7a3fbbeeb974d4a87cf7ed486f0bb93204c8549be"}
          assert source["source_sha"]==receipt["executed_source_sha"]==os.environ["GITHUB_SHA"]
          assert source["attestor_sources"]==expected
          assert set(source["attestor_blob_oids"])==set(expected)
          assert receipt["status"]=="PASS" and receipt["require_complete"] is True
          assert receipt["test_definition_sha256"]=={test:expected[test]}
          assert len(receipt["steps"])==2
          assert {row["entry_point"] for row in receipt["steps"]}=={
              "discovery:test_native_mlt_loaded_module.py",
              "dotted:tooling.tests.test_native_mlt_loaded_module"}
          for row in receipt["steps"]:
              counts=row["counts"]
              assert row["exit_code"]==0 and row["status"]=="PASS"
              assert counts["tests_run"]==counts["passed"]==15
              assert counts["terminal_status"]=="OK"
              for key in ("errors","failures","skipped","expected_failures","unexpected_successes"):
                  assert counts[key]==0
              for kind in ("stdout","stderr"):
                  assert sha(root/row[kind]["file"])==row[kind]["sha256"]
          PY
      - name: Check source and acceptance policies
        run: |
          set -euo pipefail
          python3 -B tooling/source_policy.py > "$MW_DIAG_WORK/public/source-policy.stdout.log" 2> "$MW_DIAG_WORK/public/source-policy.stderr.log"
          python3 -B tooling/acceptance_policy.py > "$MW_DIAG_WORK/public/acceptance-policy.stdout.log" 2> "$MW_DIAG_WORK/public/acceptance-policy.stderr.log"
          python3 -B tooling/creative_status_policy.py > "$MW_DIAG_WORK/public/creative-status-policy.stdout.log" 2> "$MW_DIAG_WORK/public/creative-status-policy.stderr.log"
      - name: Verify source composition and identity contracts
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python3 -B -I -S - > "$MW_DIAG_WORK/public/composition-contracts.stdout.log" \
            2> "$MW_DIAG_WORK/public/composition-contracts.stderr.log" <<'PY'
          import importlib.util,json,os,pathlib,sys,unittest
          source=pathlib.Path(os.environ["MW_DIAG_VERIFY"])
          spec=importlib.util.spec_from_file_location("test_mlt_repair_verification",
                                                     source/"test_mlt_repair_verification.py")
          if spec is None or spec.loader is None: raise SystemExit("missing exact composition contracts")
          tests=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=tests
          spec.loader.exec_module(tests)
          suite=unittest.defaultTestLoader.loadTestsFromModule(tests)
          if suite.countTestCases()!=26: raise SystemExit("expected exactly 26 composition contracts")
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          complete=(result.testsRun==26 and result.wasSuccessful() and not result.skipped
                    and not result.expectedFailures and not result.unexpectedSuccesses)
          report={"tests_run":result.testsRun,"failures":len(result.failures),"errors":len(result.errors),
                  "skipped":len(result.skipped),"expected_failures":len(result.expectedFailures),
                  "unexpected_successes":len(result.unexpectedSuccesses),"complete":bool(complete)}
          (pathlib.Path(os.environ["MW_DIAG_WORK"])/"public/composition-contracts.json").write_text(
              json.dumps(report,indent=2)+"\n")
          if not complete: raise SystemExit(1)
          PY
      - name: Install compiler and exact FFmpeg 6.1.1 development libraries
        run: |
          set -euo pipefail
          ffmpeg_version='7:6.1.1-3ubuntu5'
          ffmpeg_packages=(libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev
                           libavdevice-dev libswscale-dev libswresample-dev)
          requested=()
          for package in "${ffmpeg_packages[@]}"; do
            requested+=("$package=$ffmpeg_version")
          done
          printf '%s\n' "${requested[@]}" > "$MW_DIAG_WORK/public/dependency-request.txt"
          sudo apt-get update
          apt-cache policy "${ffmpeg_packages[@]}" > "$MW_DIAG_WORK/public/dependency-candidates.txt"
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake pkg-config curl "${requested[@]}"
          dpkg-query -W -f='${Package} ${Version}\n' "${ffmpeg_packages[@]}" \
            > "$MW_DIAG_WORK/public/dependency-versions.txt"
          for package in "${ffmpeg_packages[@]}"; do
            actual="$(dpkg-query -W -f='${Version}' "$package")"
            if [[ "$actual" != "$ffmpeg_version" ]]; then
              printf 'FFmpeg dependency differs: %s expected %s observed %s\n' \
                "$package" "$ffmpeg_version" "$actual" >&2
              exit 1
            fi
          done
          pkg-config --modversion libavcodec libavutil > "$MW_DIAG_WORK/public/library-api-versions.txt"
          printf '60.31.102\n58.29.100\n' > "$MW_DIAG_WORK/public/library-api-versions.expected.txt"
          if ! cmp "$MW_DIAG_WORK/public/library-api-versions.expected.txt" \
                   "$MW_DIAG_WORK/public/library-api-versions.txt"; then
            printf 'FFmpeg API versions differ from the exact admitted source fixture\n' >&2
            exit 1
          fi
          cc --version > "$MW_DIAG_WORK/public/compiler-version.txt"
      - name: Retrieve exact upstream MLT consumer source
        run: |
          set -euo pipefail
          cd "$MW_DIAG_WORK/source"
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            https://archive.ubuntu.com/ubuntu/pool/universe/m/mlt/mlt_7.22.0.orig.tar.gz \
            -o mlt.orig.tar.gz
          echo '7cf4d9573a061d76902c6e12a2f09f5f461e7c697635233df82a63a3fe4d6da6  mlt.orig.tar.gz' | sha256sum --check
          tar -xzf mlt.orig.tar.gz
          source_root="$MW_DIAG_WORK/source/mlt-7.22.0"
          echo "MW_MLT_SOURCE=$source_root" >> "$GITHUB_ENV"
          echo "c1c8850ff049a8775bb3d24c64be9b9365659773ce019902585c056f5be2f910  $source_root/src/modules/avformat/consumer_avformat.c" | sha256sum --check
      - name: Compile and execute sanitized buffer constructors
        run: |
          set -euo pipefail
          source="$MW_DIAG_SOURCE"
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -O1 -g \
            -Wall -Wextra -Wpedantic \
            -Werror=implicit-function-declaration \
            -Werror=incompatible-pointer-types -Werror=return-type \
            -Werror=deprecated-declarations \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -fno-omit-frame-pointer -I"$source" \
            "$source/test_audio_tap.c" \
            $(pkg-config --cflags --libs libavcodec libavutil) \
            -o "$MW_DIAG_WORK/build/test_audio_tap"
          ldd "$MW_DIAG_WORK/build/test_audio_tap" > "$MW_DIAG_WORK/public/constructor-loaded-libraries.txt"
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            "$MW_DIAG_WORK/build/test_audio_tap" "$MW_DIAG_WORK/constructors" \
            > "$MW_DIAG_WORK/public/constructor.stdout.log" \
            2> "$MW_DIAG_WORK/public/constructor.stderr.log"
      - name: Independently decode constructor traces
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          MOTIONWRIGHT_TAP_CONSTRUCTOR_DIR="$MW_DIAG_WORK/constructors" \
            python3 -B -I -S - > "$MW_DIAG_WORK/public/python.stdout.log" \
            2> "$MW_DIAG_WORK/public/python.stderr.log" <<'PY'
          import importlib.util,os,pathlib,sys,unittest
          source=pathlib.Path(os.environ["MW_DIAG_SOURCE"])
          def load(name):
              spec=importlib.util.spec_from_file_location(name,source/(name+".py"))
              if spec is None or spec.loader is None: raise SystemExit("missing exact reader module")
              module=importlib.util.module_from_spec(spec)
              sys.modules[name]=module
              spec.loader.exec_module(module)
              return module
          load("verify_trace")
          tests=load("test_verify_trace")
          suite=unittest.defaultTestLoader.loadTestsFromModule(tests)
          if suite.countTestCases()!=32: raise SystemExit("expected exactly 32 contract tests")
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          if (result.testsRun!=32 or not result.wasSuccessful() or result.skipped
                  or result.expectedFailures or result.unexpectedSuccesses):
              raise SystemExit(1)
          PY
          python3 -B -I -S - <<'PY'
          import os,pathlib,re
          text=(pathlib.Path(os.environ["MW_DIAG_WORK"])/"public/python.stderr.log").read_text()
          assert re.search(r"Ran 32 tests in ",text),text
          assert re.search(r"\nOK\s*$",text),text
          assert "skipped=" not in text
          PY
      - name: Verify the pinned planar repair source
        run: |
          set -euo pipefail
          original="$MW_MLT_SOURCE/src/modules/avformat/consumer_avformat.c"
          echo "c1c8850ff049a8775bb3d24c64be9b9365659773ce019902585c056f5be2f910  $original" | sha256sum --check
          cd "$RUNNER_TEMP"
          MOTIONWRIGHT_MLT_V722_ORIGINAL="$original" \
            python3 -B -I -S - > "$MW_DIAG_WORK/public/repair-contracts.stdout.log" \
            2> "$MW_DIAG_WORK/public/repair-contracts.stderr.log" <<'PY'
          import importlib.util,json,os,pathlib,sys,unittest
          source=pathlib.Path(os.environ["MW_DIAG_SOURCE"])
          spec=importlib.util.spec_from_file_location("test_repair_planar_source",
                                                     source/"test_repair_planar_source.py")
          if spec is None or spec.loader is None: raise SystemExit("missing exact repair contracts")
          tests=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=tests
          spec.loader.exec_module(tests)
          suite=unittest.defaultTestLoader.loadTestsFromModule(tests)
          if suite.countTestCases()!=13: raise SystemExit("expected exactly 13 repair contracts")
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          complete=(result.testsRun==13 and result.wasSuccessful() and not result.skipped
                    and not result.expectedFailures and not result.unexpectedSuccesses)
          report={"tests_run":result.testsRun,"failures":len(result.failures),"errors":len(result.errors),
                  "skipped":len(result.skipped),"expected_failures":len(result.expectedFailures),
                  "unexpected_successes":len(result.unexpectedSuccesses),"complete":bool(complete)}
          (pathlib.Path(os.environ["MW_DIAG_WORK"])/"public/repair-contracts.json").write_text(
              json.dumps(report,indent=2)+"\n")
          if not complete: raise SystemExit(1)
          PY
      - name: Prepare the exact repaired and instrumented consumer
        run: |
          set -euo pipefail
          python3 -B -I -S "$MW_DIAG_VERIFY/mlt_repair_verification.py" prepare \
            --source-dir "$MW_DIAG_SOURCE" --verification-source-dir "$MW_DIAG_VERIFY" \
            --source-receipt "$MW_DIAG_WORK/public/source-inputs.json" \
            --original-consumer "$MW_MLT_SOURCE/src/modules/avformat/consumer_avformat.c" \
            --output-dir "$MW_DIAG_WORK/build/repair-prepared" --expected-source "$GITHUB_SHA" \
            > "$MW_DIAG_WORK/public/repair-prepare.stdout.log" \
            2> "$MW_DIAG_WORK/public/repair-prepare.stderr.log"
          cp "$MW_DIAG_WORK/build/repair-prepared/prepare-receipt.json" \
            "$MW_DIAG_WORK/public/prepare-receipt.json"
      - name: Reject the exact historical zero-padding helper with the new C oracle
        run: |
          set -euo pipefail
          python3 -B -I -S - <<'PY'
          import hashlib,importlib.util,json,os,pathlib,shlex,shutil,subprocess
          work=pathlib.Path(os.environ["MW_DIAG_WORK"])
          public=work/"public"
          source=pathlib.Path(os.environ["MW_DIAG_SOURCE"])
          prepared=work/"build/repair-prepared"
          legacy=work/"build/legacy-planar"
          legacy.mkdir(exist_ok=False)
          spec=importlib.util.spec_from_file_location(
              "mlt_repair_verification",pathlib.Path(os.environ["MW_DIAG_VERIFY"])/"mlt_repair_verification.py")
          assert spec is not None and spec.loader is not None
          verify=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(verify)
          header=verify.read_regular(prepared/"legacy-planar-helper-under-test.h")
          assert header==verify.legacy_planar_helper()
          verify.write_new(legacy/"planar-helper-under-test.h",header)
          test_source=source/"test_planar_padding.c"
          test_sha=hashlib.sha256(verify.read_regular(test_source)).hexdigest()
          assert test_sha==verify.DIAGNOSTIC_DIGESTS["test_planar_padding.c"]
          flags=subprocess.check_output(
              ["pkg-config","--cflags","--libs","libavcodec","libavutil"],text=True)
          compiler=shutil.which("cc")
          assert compiler is not None
          compiler_path=pathlib.Path(compiler).resolve(strict=True)
          binary=legacy/"test_planar_padding"
          args=[str(compiler_path),"-std=c11","-O1","-g","-Wall","-Wextra","-Werror",
                "-fsanitize=address,undefined","-fno-sanitize-recover=all",
                "-fno-omit-frame-pointer","-I"+str(legacy),str(test_source),
                *shlex.split(flags),"-o",str(binary)]
          command={"argv":args,"compiler_path":str(compiler_path),
                   "compiler_sha256":hashlib.sha256(compiler_path.read_bytes()).hexdigest(),
                   "fixture_sha256":test_sha,"helper_sha256":verify.LEGACY_HELPER_SHA256}
          (public/"legacy-planar-compile-command.json").write_text(json.dumps(command,indent=2)+"\n")
          with (public/"legacy-planar-compile.log").open("xb") as out:
              subprocess.run(args,stdout=out,stderr=subprocess.STDOUT,check=True)
          with (public/"legacy-planar-loaded-libraries.txt").open("xb") as out:
              subprocess.run(["ldd",str(binary)],stdout=out,stderr=subprocess.STDOUT,check=True)
          environment={**os.environ,"ASAN_OPTIONS":"detect_leaks=1:halt_on_error=1",
                       "UBSAN_OPTIONS":"halt_on_error=1:print_stacktrace=1"}
          with (public/"legacy-planar.stdout.log").open("xb") as out, \
                  (public/"legacy-planar.stderr.log").open("xb") as err:
              result=subprocess.run([str(binary)],stdout=out,stderr=err,env=environment,timeout=30)
          (public/"legacy-planar.exit.txt").write_text(str(result.returncode)+"\n")
          report=verify.validate_legacy_rejection(
              result.returncode,(public/"legacy-planar.stdout.log").read_bytes(),
              (public/"legacy-planar.stderr.log").read_bytes())
          inputs=json.loads((public/"source-inputs.json").read_text())
          report.update(schema="motionwright.mlt-legacy-u8p-negative/1",
                        source_sha=os.environ["GITHUB_SHA"],tree=inputs["tree"],
                        run_id=os.environ["GITHUB_RUN_ID"],run_attempt=os.environ["GITHUB_RUN_ATTEMPT"],
                        fixture_sha256=test_sha,helper_sha256=verify.LEGACY_HELPER_SHA256,
                        historical_source_reference=verify.LEGACY_HELPER_REFERENCE,
                        binary_sha256=hashlib.sha256(binary.read_bytes()).hexdigest(),
                        compiler_command_sha256=hashlib.sha256(
                            (public/"legacy-planar-compile-command.json").read_bytes()).hexdigest())
          with (public/"legacy-planar-negative.json").open("x") as out:
              json.dump(report,out,indent=2)
              out.write("\n")
          PY
      - name: Compile and execute the twelve sanitized planar layout cases
        run: |
          set -euo pipefail
          prepared="$MW_DIAG_WORK/build/repair-prepared"
          cc -std=c11 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer \
            -I"$prepared" "$MW_DIAG_SOURCE/test_planar_padding.c" \
            $(pkg-config --cflags --libs libavcodec libavutil) \
            -o "$MW_DIAG_WORK/build/test_planar_padding"
          ldd "$MW_DIAG_WORK/build/test_planar_padding" > "$MW_DIAG_WORK/public/planar-loaded-libraries.txt"
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            "$MW_DIAG_WORK/build/test_planar_padding" \
            > "$MW_DIAG_WORK/public/planar.stdout.log" \
            2> "$MW_DIAG_WORK/public/planar.stderr.log"
          python3 -B -I -S - <<'PY'
          import os,pathlib
          public=pathlib.Path(os.environ["MW_DIAG_WORK"])/"public"
          expected=b"MLT_PLANAR_LAYOUT_PASS checks=12 source-layout-only, no native master\n"
          assert (public/"planar.stdout.log").read_bytes()==expected,"planar case receipt differs"
          assert (public/"planar.stderr.log").read_bytes()==b"","unexpected planar diagnostics"
          PY
      - name: Compile the complete repaired consumer with the observer
        run: |
          set -euo pipefail
          source="$MW_DIAG_WORK/build/repaired-mlt-source"
          test ! -e "$source"
          cp -a "$MW_MLT_SOURCE" "$source"
          cp "$MW_DIAG_WORK/build/repair-prepared/consumer_avformat.c" \
            "$MW_DIAG_WORK/build/repair-prepared/audio_tap.h" "$source/src/modules/avformat/"
          echo "MW_MLT_COMBINED_SOURCE=$source" >> "$GITHUB_ENV"
          export MW_MLT_COMBINED_SOURCE="$source"
          python3 -B -I -S - <<'PY'
          import hashlib,os,pathlib,re,subprocess
          source=pathlib.Path(os.environ["MW_MLT_COMBINED_SOURCE"])
          work=pathlib.Path(os.environ["MW_DIAG_WORK"])
          original=pathlib.Path(os.environ["MW_MLT_SOURCE"])/"src/modules/avformat/consumer_avformat.c"
          combined=source/"src/modules/avformat/consumer_avformat.c"
          assert hashlib.sha256(original.read_bytes()).hexdigest()=="c1c8850ff049a8775bb3d24c64be9b9365659773ce019902585c056f5be2f910"
          assert hashlib.sha256(combined.read_bytes()).hexdigest()=="579eba9bb5a128e78cf078e0ae47f72a6ddbeb9147cf4451a4900541ed9eb56c"
          modules=re.findall(r"^option\((MOD_[A-Z0-9_]+) ",(source/"CMakeLists.txt").read_text(),re.M)
          assert "MOD_AVFORMAT" in modules
          args=["cmake","-S",str(source),"-B",str(work/"build/mlt"),
                "-DCMAKE_BUILD_TYPE=RelWithDebInfo","-DBUILD_TESTING=OFF",
                "-DBUILD_DOCS=OFF","-DCLANG_FORMAT=OFF","-DCMAKE_EXPORT_COMPILE_COMMANDS=ON"]
          args += ["-D"+name+"="+("ON" if name=="MOD_AVFORMAT" else "OFF") for name in modules]
          with (work/"public/cmake-configure.log").open("wb") as log:
              subprocess.run(args,stdout=log,stderr=subprocess.STDOUT,check=True)
          PY
          cmake --build "$MW_DIAG_WORK/build/mlt" --target mltavformat --parallel 2 \
            > "$MW_DIAG_WORK/public/consumer-module-build.log" 2>&1
          cp "$MW_DIAG_WORK/build/mlt/compile_commands.json" "$MW_DIAG_WORK/public/compile_commands.json"
          python3 -B -I -S - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          work=pathlib.Path(os.environ["MW_DIAG_WORK"])
          source=pathlib.Path(os.environ["MW_MLT_COMBINED_SOURCE"])
          consumer=(source/"src/modules/avformat/consumer_avformat.c").resolve(strict=True)
          assert hashlib.sha256(consumer.read_bytes()).hexdigest()=="579eba9bb5a128e78cf078e0ae47f72a6ddbeb9147cf4451a4900541ed9eb56c"
          compile_rows=json.loads((work/"build/mlt/compile_commands.json").read_text())
          def compiled_file(row):
              path=pathlib.Path(row["file"])
              return (path if path.is_absolute() else pathlib.Path(row["directory"])/path).resolve()
          selected=[row for row in compile_rows if compiled_file(row)==consumer]
          assert len(selected)==1,"expected one actual combined consumer compile command"
          directory=pathlib.Path(selected[0]["directory"]).resolve(strict=True)
          assert directory.is_relative_to((work/"build/mlt").resolve(strict=True))
          assert selected[0].get("command") or selected[0].get("arguments")
          module=list((work/"build/mlt").rglob("libmltavformat.so"))
          objects=list((work/"build/mlt").rglob("consumer_avformat.c.o"))
          assert len(module)==1 and len(objects)==1
          with (work/"public/consumer-loaded-libraries.txt").open("wb") as log:
              subprocess.run(["ldd",str(module[0])],stdout=log,stderr=subprocess.STDOUT,check=True)
          (work/"public/combined-consumer-compile-command.json").write_text(
              json.dumps(selected[0],indent=2)+"\n")
          PY
      - name: Bind completed planar repair source evidence
        run: |
          set -euo pipefail
          python3 -B -I -S "$MW_DIAG_CHECK" verify > "$MW_DIAG_WORK/source-inputs-after.json"
          cmp "$MW_DIAG_WORK/public/source-inputs.json" "$MW_DIAG_WORK/source-inputs-after.json"
          python3 -B -I -S "$MW_DIAG_VERIFY/mlt_repair_verification.py" verify-prepared \
            --source-dir "$MW_DIAG_SOURCE" --verification-source-dir "$MW_DIAG_VERIFY" \
            --source-receipt "$MW_DIAG_WORK/public/source-inputs.json" \
            --original-consumer "$MW_MLT_SOURCE/src/modules/avformat/consumer_avformat.c" \
            --output-dir "$MW_DIAG_WORK/build/repair-prepared" --expected-source "$GITHUB_SHA" \
            > "$MW_DIAG_WORK/public/repair-verify.stdout.log" \
            2> "$MW_DIAG_WORK/public/repair-verify.stderr.log"
          cmp "$MW_DIAG_WORK/build/repair-prepared/prepare-receipt.json" \
            "$MW_DIAG_WORK/public/prepare-receipt.json"
          python3 -B -I -S - <<'PY'
          import hashlib,importlib.util,json,os,pathlib,re,shutil,sys
          work=pathlib.Path(os.environ["MW_DIAG_WORK"])
          public=work/"public"
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          def json_file(name):return json.loads((public/name).read_text())
          inputs=json_file("source-inputs.json")
          assert inputs["source_sha"]==os.environ["GITHUB_SHA"]
          prepared=json_file("prepare-receipt.json")
          assert prepared["schema"]=="motionwright.mlt-planar-repair-preparation/2"
          assert prepared["source_sha"]==inputs["source_sha"] and prepared["tree"]==inputs["tree"]
          assert prepared["source_inputs_sha256"]==sha(public/"source-inputs.json")
          assert prepared["sources"]==inputs["sources"] and prepared["source_blob_oids"]==inputs["source_blob_oids"]
          assert prepared["C_layout_checks"]==prepared["full_consumer_compile"]==prepared["physical_runtime"]=="NOT_RUN"
          assert prepared["legacy_C_negative_checks"]=="NOT_RUN"
          assert prepared["outputs"]["consumer_avformat.c"]=="579eba9bb5a128e78cf078e0ae47f72a6ddbeb9147cf4451a4900541ed9eb56c"
          assert prepared["outputs"]["planar-helper-under-test.h"]=="d90db74a261da8053a7f8258f1b9975e692ab54888408cd0a2818ee26e720bf9"
          assert prepared["outputs"]["legacy-planar-helper-under-test.h"]=="fa56e6635f8731f62c9fca1305ee1b916e752526bbeeaaa4404addb24e327013"
          for name in ("provider_compiled","provider_admitted","native_dispatched",
                       "master_audio_tail_corrected","production_master_accepted","release_authorized"):
              assert prepared[name] is False
          for name,expected in (("composition-contracts.json",26),("repair-contracts.json",13)):
              result=json_file(name)
              assert result=={"tests_run":expected,"failures":0,"errors":0,"skipped":0,
                              "expected_failures":0,"unexpected_successes":0,"complete":True}
          observer=(public/"python.stderr.log").read_text()
          assert re.search(r"Ran 32 tests in ",observer) and re.search(r"\nOK\s*$",observer)
          assert "skipped=" not in observer
          assert (public/"planar.stdout.log").read_bytes()==b"MLT_PLANAR_LAYOUT_PASS checks=12 source-layout-only, no native master\n"
          assert not (public/"planar.stderr.log").read_bytes()
          spec=importlib.util.spec_from_file_location(
              "mlt_repair_verification",pathlib.Path(os.environ["MW_DIAG_VERIFY"])/"mlt_repair_verification.py")
          assert spec is not None and spec.loader is not None
          verify=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(verify)
          negative=json_file("legacy-planar-negative.json")
          expected_negative=verify.validate_legacy_rejection(
              int((public/"legacy-planar.exit.txt").read_text()),
              (public/"legacy-planar.stdout.log").read_bytes(),
              (public/"legacy-planar.stderr.log").read_bytes())
          for key,value in expected_negative.items():
              assert negative[key]==value,"historical negative outcome changed"
          assert negative["schema"]=="motionwright.mlt-legacy-u8p-negative/1"
          assert negative["source_sha"]==inputs["source_sha"] and negative["tree"]==inputs["tree"]
          assert negative["run_id"]==os.environ["GITHUB_RUN_ID"] and negative["run_attempt"]==os.environ["GITHUB_RUN_ATTEMPT"]
          assert negative["fixture_sha256"]==inputs["sources"]["tooling/mlt-audio-diagnostic/test_planar_padding.c"]
          assert negative["helper_sha256"]==verify.LEGACY_HELPER_SHA256
          assert negative["historical_source_reference"]==prepared["legacy_helper_reference"]==verify.LEGACY_HELPER_REFERENCE
          legacy_binary=work/"build/legacy-planar/test_planar_padding"
          assert negative["binary_sha256"]==sha(legacy_binary)
          assert sha(work/"build/legacy-planar/planar-helper-under-test.h")==verify.LEGACY_HELPER_SHA256
          assert negative["compiler_command_sha256"]==sha(public/"legacy-planar-compile-command.json")
          negative_command=json_file("legacy-planar-compile-command.json")
          assert negative_command["compiler_sha256"]==sha(pathlib.Path(negative_command["compiler_path"]))
          requested=dict(line.split("=",1) for line in (public/"dependency-request.txt").read_text().splitlines())
          observed=dict(line.split() for line in (public/"dependency-versions.txt").read_text().splitlines())
          expected_packages={"libavcodec-dev","libavformat-dev","libavutil-dev","libavfilter-dev",
                             "libavdevice-dev","libswscale-dev","libswresample-dev"}
          assert set(requested)==set(observed)==expected_packages
          assert all(requested[name]==observed[name]=="7:6.1.1-3ubuntu5" for name in expected_packages)
          assert (public/"library-api-versions.txt").read_bytes()==b"60.31.102\n58.29.100\n"
          original=pathlib.Path(os.environ["MW_MLT_SOURCE"])/"src/modules/avformat/consumer_avformat.c"
          source=pathlib.Path(os.environ["MW_MLT_COMBINED_SOURCE"])

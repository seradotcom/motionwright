          assert sha(original)=="c1c8850ff049a8775bb3d24c64be9b9365659773ce019902585c056f5be2f910"
          assert sha(consumer)==prepared["outputs"]["consumer_avformat.c"]
          assert sha(source/"src/modules/avformat/audio_tap.h")==prepared["outputs"]["audio_tap.h"]
          command=json_file("combined-consumer-compile-command.json")
          compiled_path=pathlib.Path(command["file"])
          if not compiled_path.is_absolute():
              compiled_path=pathlib.Path(command["directory"])/compiled_path
          assert compiled_path.resolve(strict=True)==consumer.resolve(strict=True)
          module=list((work/"build/mlt").rglob("libmltavformat.so"))
          consumer_object=list((work/"build/mlt").rglob("consumer_avformat.c.o"))
          assert len(module)==1 and len(consumer_object)==1
          tools={}
          for name in ("cc","cmake","pkg-config","python3","ld"):
              located=shutil.which(name)

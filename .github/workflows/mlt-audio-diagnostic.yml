                  "compile_commands_sha256":sha(public/"compile_commands.json"),
                  "module_sha256":sha(module[0]),"consumer_object_sha256":sha(consumer_object[0]),
                  "constructor_binary_sha256":sha(work/"build/test_audio_tap"),
                  "planar_test_binary_sha256":sha(work/"build/test_planar_padding"),
                  "observed_tools":tools,"observed_loaded_libraries":libraries,
                  "expected_ffmpeg_packages":requested,"observed_ffmpeg_packages":observed,
                  "expected_library_api_versions":["60.31.102","58.29.100"],
                  "legacy_zero_padding_negative":negative,
                  "legacy_negative_receipt_sha256":sha(public/"legacy-planar-negative.json"),
                  "python_version":sys.version,"platform":sys.platform,
                  "python_contract_tests":{"source_composition":26,"original_observer":32,"planar_repair":13},
                  "python_skipped":0,"planar_C_layout_cases":12,
                  "constructor_C_sanitizers":"PASS","planar_layout_C_sanitizers":"PASS",
                  "actual_combined_consumer_module_compile":"PASS",
                  "instrumented_original_module_compiled_in_this_run":False,
                  "consumer_runtime_sanitizers":"NOT_RUN","physical_runtime":"NOT_RUN",
                  "original_distro_runtime_reproduced":False,"provider_admission":"NOT_ESTABLISHED",
                  "native_render":"NOT_RUN","native_dispatched":False,

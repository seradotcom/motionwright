    if: github.event_name == 'workflow_dispatch' && inputs.native_scenario == 'hyperframes'
    needs: production-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: native-hyperframes-original
      cancel-in-progress: false

                  if not line.startswith("{"):
                      continue
                  try:
                      value = json.loads(line)
                  except ValueError:
                      continue
                  if value.get("reason") == "compiler-artifact" and value.get("profile", {}).get("test") and value.get("executable"):
                      target = value["target"]
                      target_key = (value["package_id"], target["name"], tuple(target["kind"]), target["src_path"])
                      require(target_key in cargo_targets[package], "compiled_target_not_in_selected_manifest")
                      path = Path(value["executable"]).resolve()
                      require(path.is_relative_to(source / "target"), "test_binary_outside_target")
                      result[path.relative_to(source).as_posix()] = record(path, TEST_BINARY_MAX_BYTES)
              require(result, "no_compiled_test_artifacts")
              return result

          def run_tests(label, command, required_ids):
              listed_row, listed = run(label + "-list", command + ["--message-format=json", "--", "--list"])
              require(listed_row["exit_code"] == 0, label + "_listing_failed")
              ids = re.findall(r"^([A-Za-z0-9_:]+): test$", listed, re.MULTILINE)
              totals = re.findall(r"^(\d+) tests?, (\d+) benchmarks?$", listed, re.MULTILINE)
              require(ids and len(ids) == len(set(ids)) and totals
                      and sum(int(n) for n, _ in totals) == len(ids)
                      and all(int(n) == 0 for _, n in totals), label + "_listing_incomplete_or_ambiguous")
              if label == "original-mix-attempt":
                  require(len(ids) == 9 and all(name.startswith("canonical_film_source_custody::original_mix_attempt_classification::original_mix_attempt_") for name in ids),
                          "original_mix_attempt_expected_nine")
              if required_ids is not None:
                  require(set(ids) == set(required_ids) and len(ids) == len(required_ids), label + "_expected_roster_differs")
              package = command[command.index("-p") + 1]
              binaries = test_artifacts(listed, package)
              observation = {"label": label, "compiled_selected_ids": ids,
                             "binary_before": binaries, "status": "NOT_VERIFIED"}
              receipt["selected_tests"].append(observation)
              save()
              row, output = run(label, command + ["--message-format=json", "--", "--test-threads=1"])
              observed = re.findall(r"^test ([A-Za-z0-9_:]+) \.\.\. (ok|FAILED|ignored(?:[^\r\n]*)?)$", output, re.MULTILINE)
              summaries = re.findall(r"^test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored; "
                                     r"(\d+) measured; (\d+) filtered out; finished in [0-9.]+s$", output, re.MULTILINE)
              names = [name for name, _ in observed]
              passed = [name for name, status in observed if status == "ok"]
              failed = [name for name, status in observed if status == "FAILED"]
              ignored = [name for name, status in observed if status.startswith("ignored")]
              observation.update(exit_code=row["exit_code"], actual_ids=names, passed_ids=passed,
                                 failed_ids=failed, ignored_ids=ignored, summaries=summaries)
              observation["binary_after"] = {path: record(source / path, TEST_BINARY_MAX_BYTES) for path in binaries}
              observation["actual_compiler_artifacts"] = test_artifacts(output, package)
              save()
              require(len(names) == len(set(names)) and set(names) == set(ids) and summaries, label + "_actual_roster_differs")
              require(sum(int(s[1]) for s in summaries) == len(passed)
                      and sum(int(s[2]) for s in summaries) == len(failed)
                      and sum(int(s[3]) for s in summaries) == len(ignored)
                      and all(int(s[4]) == 0 for s in summaries), label + "_summary_differs")
              require(observation["binary_before"] == observation["binary_after"] ==
                      observation["actual_compiler_artifacts"], label + "_binary_changed")
              require(not ignored, label + "_ignored_tests")
              observation["status"] = "PASS" if row["exit_code"] == 0 and not failed else "FAIL"
              save()
              # Expected-failure evidence is assessed separately; the job still records a real failure.
              # No expected-failure inversion and no continue-on-error.
              require(observation["status"] == "PASS", label + "_test_failure")

          save()
          try:
              before = binding()
              receipt["source_before"] = before
              require(before["C"] == requested and re.fullmatch(r"[0-9a-f]{40}", before["T"]) and not before["status"],
                      "target_checkout_not_exact_or_clean")
              lock = json.loads((source / "SOURCE_LOCK.json").read_text())
              require(lock["dependencies"]["semwright"]["revision"] == PIN, "source_lock_sdk_pin_differs")
              cargo_lock = tomllib.loads((source / "Cargo.lock").read_text())
              sdk_packages = [p for p in cargo_lock["package"] if p.get("source", "").startswith(
                  "git+https://github.com/seradotcom/semwright")]
              require(sdk_packages and any(p["name"] == "semwright-native-sdk" for p in sdk_packages)
                      and all(p["source"].endswith("#" + PIN) for p in sdk_packages), "cargo_lock_sdk_pin_differs")
              receipt["sdk_pin"] = PIN
              # --list must reach libtest, never an example/bin main with harness=false.
              for package in sorted(selected_packages):
                  manifest = tomllib.loads((source / package_manifests[package]).read_text())
                  require(manifest["package"]["name"] == package, "selected_package_name_differs")
                  for kind in ("lib", "bin", "example", "test", "bench"):
                      declared = manifest.get(kind, [])
                      if isinstance(declared, dict):
                          declared = [declared]
                      require(isinstance(declared, list) and all(isinstance(t, dict) and
                              t.get("harness", True) is True and t.get("test", True) is True
                              for t in declared), "selected_manifest_disables_libtest")
              row, raw_metadata = run("cargo-metadata", ["cargo", "metadata", "--locked", "--no-deps",
                                                        "--format-version", "1"], 120)
              require(row["exit_code"] == 0, "cargo_metadata_failed")
              metadata = json.loads(raw_metadata)
              require(Path(metadata["workspace_root"]).resolve() == source and
                      Path(metadata["target_directory"]).resolve() == source / "target", "cargo_target_root_differs")
              receipt["cargo_targets"] = {}
              for package in sorted(selected_packages):
                  matches = [value for value in metadata["packages"] if value["name"] == package]
                  require(len(matches) == 1 and
                          Path(matches[0]["manifest_path"]).resolve() == source / package_manifests[package],
                          "cargo_selected_package_differs")
                  item = matches[0]
                  receipt["cargo_targets"][package] = item["targets"]
                  cargo_targets[package] = {(item["id"], t["name"], tuple(t["kind"]), t["src_path"])
                                            for t in item["targets"]}
              save()
              print("NATIVE_SELECTED_SOURCE", scope, "WORKFLOW", receipt["workflow"]["head"],
                    "C", before["C"], "T", before["T"], flush=True)
              row, version = run("rustc-version", ["rustc", "-Vv"], 20)
              require(row["exit_code"] == 0 and version.startswith("rustc 1.98.1 "), "rust_toolchain_differs")
              row, _ = run("source-policy", ["python3", "-B", "tooling/source_policy.py"], 60)
              require(row["exit_code"] == 0, "source_policy_failed")
              for label, command, expected in selectors[scope]:
                  if expected is False:
                      row, _ = run(label, command)
                      require(row["exit_code"] == 0, label + "_failed")
                  else:
                      run_tests(label, command, expected)
              receipt["status"] = "PASS_SOURCE_ONLY"
          except Exception as error:
              receipt["status"] = "FAIL"
              receipt["failure"] = str(error)
          finally:
              try:
                  receipt["source_after"] = binding()
                  require(receipt.get("source_before") == receipt["source_after"], "source_changed_during_gate")
              except Exception as error:
                  receipt["source_binding_failure"] = str(error)
                  receipt["status"] = "NOT_VERIFIED"
              try:
                  workflow_file = Path(".github/workflows/native-production.yml")
                  receipt["workflow_after"] = record(workflow_file, 1024 * 1024)
                  require(receipt["workflow_after"] == receipt["workflow"]["file"], "workflow_source_changed")
              except Exception as error:
                  receipt["workflow_binding_failure"] = str(error)
                  receipt["status"] = "NOT_VERIFIED"
              try:
                  receipt["retained_logs"] = {path.name: record(path, 128 * 1024 * 1024)
                                              for path in sorted(root.glob("*.log"))}
              except Exception as error:
                  receipt["retention_failure"] = str(error)
                  receipt["status"] = "NOT_VERIFIED"
              save()
              print(json.dumps({"native_selected_source": receipt["status"], "scope": scope,
                                "C": receipt.get("source_before", {}).get("C"),
                                "T": receipt.get("source_before", {}).get("T"),
                                "failure": receipt.get("failure")}, sort_keys=True), flush=True)
          raise SystemExit(0 if receipt["status"] == "PASS_SOURCE_ONLY" else 1)
          PY
      - name: Retain selected source logs and partial receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-selected-source-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/native-selected-source/
          if-no-files-found: error
          retention-days: 7

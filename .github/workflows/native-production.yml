          GATE_G1: ${{ steps.g1.outcome }}
          GATE_G1_SDK: ${{ steps.g1_sdk.outcome }}
          GATE_BINARIES: ${{ steps.binaries.outcome }}
          GATE_INTAKE: ${{ steps.intake.outcome }}
          GATE_NATIVE: ${{ steps.native.outcome }}
        run: |
          set -euo pipefail
          test -d "$HF_ROOT/public" || exit 0
          python3 -B - <<'PY'
          import json, os, re
          from pathlib import Path
          observed_sdk = os.environ["OBSERVED_SEMWRIGHT_SHA"] or None
          if observed_sdk is not None:
              assert re.fullmatch(r"[0-9a-f]{40}", observed_sdk)
              assert observed_sdk == os.environ["ADMITTED_SEMWRIGHT_SHA"]
          value = {
              "schema": "motionwright.hyperframes.actions-gates/1",
              "source_sha": os.environ["GITHUB_SHA"],
              "semwright_sha": observed_sdk,
              "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "gates": {key: os.environ.get("GATE_" + key.upper(), "") or "NOT_RUN"
                        for key in ("setup", "g0_python", "g0_node", "sandbox", "g1", "g1_sdk", "binaries", "intake", "native")},
              "automatic_retry": False, "formal_acceptance": False,
              "human_acceptance": False, "release_authorized": False}
          target = Path(os.environ["HF_ROOT"]) / "public/gates.json"
          with target.open("x") as output:
              json.dump(value, output, sort_keys=True)
              output.write("\n")
          PY

      - name: Retain first-party G0 and Rust gate originals
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hyperframes-gates-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.HF_ROOT }}/g0/
            ${{ env.HF_ROOT }}/g1/
          if-no-files-found: warn
          retention-days: 14

      - name: Retain sealed selected originals and closed public results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hyperframes-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.HF_ROOT }}/public/selected-originals.sealed
            ${{ env.HF_ROOT }}/public/actions-result.json
            ${{ env.HF_ROOT }}/public/gates.json
          if-no-files-found: warn
          retention-days: 14

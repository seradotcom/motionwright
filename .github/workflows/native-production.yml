          "$HF_ROOT/venv/bin/python" -B - <<'PY'
          import os, re
          from pathlib import Path
          text = (Path(os.environ["HF_ROOT"]) / "g0/node.tap").read_text()
          for label, expected in (("tests",54),("pass",54),("fail",0),("cancelled",0),("skipped",0),("todo",0)):

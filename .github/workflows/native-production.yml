          run_contract direct-consumer 4 cargo test --locked -p motionwright-driver-hyperframes \
            --example native-hyperframes-direct-reference -- --nocapture
          run_contract native-projection 4 cargo test --locked -p motionwright-native \
            --lib hyperframes -- --nocapture
          run_contract native-example 7 cargo test --locked -p motionwright-native \
            --example native-hyperframes-e2e -- --nocapture
          cargo build --locked -p motionwright-driver-hyperframes \
            --bin semwright-hyperframes-driver --example native-hyperframes-direct-reference
          cargo build --locked -p motionwright-native --example native-hyperframes-e2e

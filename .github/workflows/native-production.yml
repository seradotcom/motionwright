                                                 stdin=subprocess.DEVNULL, start_new_session=True)
                      row["state"] = "STARTED"
                      save()
                      deadline = time.monotonic() + seconds
                      while process.poll() is None:
                          if time.monotonic() >= deadline:
                              row["timeout"] = True
                              raise TimeoutError("source_command_deadline")
                          if max(out_path.stat().st_size, err_path.stat().st_size) > 64 * 1024 * 1024:
                              row["output_limit"] = True
                              raise RuntimeError("source_command_output_limit")
                          time.sleep(.1)

                              except ProcessLookupError:
                                  pass
                              except OSError:
                                  row["cleanup_signal_unverified"] = True
                              try:
                                  row["cleanup_exit_code"] = process.wait(timeout=5)
                              except BaseException:
                                  row["cleanup_reap_unverified"] = True
                          else:
                              row["cleanup_exit_code"] = process.returncode
                      # The original exit is never replaced by an exit caused by cleanup.
                      try:
                          out.flush()
                          err.flush()
                          row["stdout"] = record(out_path, 128 * 1024 * 1024)
                          row["stderr"] = record(err_path, 128 * 1024 * 1024)
                          (root / (label + ".exit-code.log")).write_text(
                              ("UNOBSERVED" if row["exit_code"] is None else str(row["exit_code"])) + "\n")
                          save()
                      except BaseException as error:
                          row["retention_error"] = type(error).__name__
                          if primary is None:
                              primary = error
              if primary is not None:
                  raise RuntimeError(label + "_not_verified") from primary

name: Canonical Film Projection

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "SOURCE_LOCK.json"
      - "crates/domain/**"
      - "crates/native/**"
      - ".github/workflows/canonical-film.yml"
  push:
    branches: ["main", "feat/**"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "SOURCE_LOCK.json"
      - "crates/domain/**"
      - "crates/native/**"
      - ".github/workflows/canonical-film.yml"
  workflow_dispatch:
    inputs:
      verification_scope:
        description: Select the full projection suite or the adjacent-shot source case
        type: choice
        default: projection
        options: [projection, adjacent-shot-source]

permissions:
  contents: read

jobs:
  canonical-film:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Prepare native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpipewire-0.3-dev pkg-config clang
      - name: Source policy
        run: python3 tooling/source_policy.py
      - name: Inspect the original adjacent-shot Film projection
        if: github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'adjacent-shot-source'
        run: cargo test --locked --jobs 2 -p motionwright-native --lib film::tests::adjacent_saved_scenes_emit_one_frame_exact_native_shot_each -- --exact --nocapture
      - name: Motionwright Film projection
        if: github.event_name != 'workflow_dispatch' || inputs.verification_scope != 'adjacent-shot-source'
        run: cargo test --locked --jobs 2 -p motionwright-native --lib film::tests
      - name: Canonical Film clippy
        if: github.event_name != 'workflow_dispatch' || inputs.verification_scope != 'adjacent-shot-source'
        run: cargo clippy --locked --jobs 2 -p motionwright-native --all-targets -- -D warnings

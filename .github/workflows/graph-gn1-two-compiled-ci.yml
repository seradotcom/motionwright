name: A6 GN1 two compiled Native reservation checks

# The development Native owner remains ONLY in graph-native-startup-dev.yml.
# This push-triggered workflow runs source validation and inert Rust tests only.
on:
  push:
    branches: ['integrate/phase1-final-composition-20261027']
    paths:
      - '.github/workflows/graph-gn1-two-compiled-ci.yml'
      - 'crates/native/examples/native-graph-review-session.rs'
      - '.github/workflows/graph-native-startup-dev.yml'
      - 'tooling/ci_graph_dev_native_firstsave.py'
      - 'tooling/ci_graph_dev_native_startup.py'
      - 'tooling/ci_graph_dev_terminal_stdout.py'
      - 'tooling/tests/test_ci_graph_dev_native_firstsave.py'
      - 'tooling/tests/test_ci_graph_dev_portable_terminal_stdout.py'
      - 'tooling/tests/test_ci_graph_gn1_selected.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'SOURCE_LOCK.json'

permissions:
  contents: read

concurrency:
  group: gn1-two-source-only-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gn1-source-and-rust-two:
    name: Source-bound GN1 Python denial roster and two compiled Native reservation tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/integrate/phase1-final-composition-20261027' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Bind exact source, preserve Native-owner manual-only invariant
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/gn1-two-rust-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$evidence"
          mkdir -m 700 "$evidence"
          echo "GN1_TWO_EVIDENCE=$evidence" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/gn1-two-compiled-target-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_SHA" > "$evidence/source-sha.original.txt"
          printf '%s\n' "GN1_INERT_SOURCE_AND_RUST_ONLY_NO_NATIVE_OWNER_NO_GRAPH_SAVE" \
            > "$evidence/scope.original.txt"
          test "$GITHUB_REPOSITORY" = seradotcom/motionwright
          test "$GITHUB_REF" = refs/heads/integrate/phase1-final-composition-20261027
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 -B tooling/source_policy.py > "$evidence/source-policy.original.stdout" 2> "$evidence/source-policy.original.stderr"
          python3 -B -m unittest -q tooling.tests.test_ci_graph_gn1_selected > "$evidence/source-selector.original.stdout" 2> "$evidence/source-selector.original.stderr"
          python3 -B - <<'PY' > "$evidence/source-contract.original.stdout" 2> "$evidence/source-contract.original.stderr"
          from pathlib import Path
          import re
          gn1 = Path(".github/workflows/graph-native-startup-dev.yml").read_text()
          assert "\n  push:" not in gn1, "NATIVE_OWNER_MUST_REMAIN_MANUAL_ONLY"
          assert "\n  workflow_dispatch:" in gn1 and "\n  workflow_call:" in gn1
          assert "inputs.one_original_owner == 'allow-one-original'" in gn1
          rust = Path("crates/native/examples/native-graph-review-session.rs").read_text()
          exact = (
              "smaller_parent_retains_two_sequential_originals_without_expanding_eight_mib",
              "smaller_parent_refuses_unreserved_oversized_result_without_publishing",
          )
          for test in exact:
              assert len(re.findall(r"(?m)^\s*fn\s+" + test + r"\s*\(", rust)) == 1, test
          source = Path("tooling/tests/test_ci_graph_dev_native_firstsave.py").read_text()
          found = re.findall(r"(?m)^\s+def (test_[A-Za-z0-9_]+)\s*\(", source)
          assert len(found) == len(set(found)) and len(found) >= 18, "GN1_SOURCE_TEST_ROSTER_INVALID"
          for required in (
              "test_large_stdout_is_bounded_unknown_and_never_replayed",
              "test_large_stderr_does_not_mask_unknown_as_custody_admission",
              "test_timeout_with_no_observed_bytes_preserves_unknown_and_no_fake_newline",
              "test_returned_json_is_bound_and_empty_stderr_is_not_fabricated",
          ):
              assert found.count(required) == 1, required
          # A source-built opened-pager witness has two additional safety cases.
          # Admission requires both as soon as the original Native writer supports it.
          runner = Path("tooling/ci_graph_dev_native_firstsave.py").read_text()
          if "require_same_opened_sqlite_witness(" in runner:
              for required in (
                  "test_writer_and_independent_opened_pager_witness_are_exact_and_unforgeable",
                  "test_invalid_writer_opened_pager_identity_never_reopens_or_retries",
              ):
                  assert found.count(required) == 1, required
          print(f"GN1_SOURCE_TEST_COUNT={len(found)}")
          PY

      - name: Run exact GN1 source and custody denial tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest -q tooling.tests.test_ci_graph_dev_native_firstsave \
            > "$GN1_TWO_EVIDENCE/python.original.log" 2>&1
          python3 -B - <<'PY'
          from pathlib import Path
          import os, re
          folder = Path(os.environ["GN1_TWO_EVIDENCE"])
          raw = (folder / "python.original.log").read_text(encoding="utf-8")
          contract = (folder / "source-contract.original.stdout").read_text(encoding="utf-8")
          selected = re.findall(r"(?m)^GN1_SOURCE_TEST_COUNT=([0-9]+)$", contract)
          assert len(selected) == 1 and int(selected[0]) >= 18, "GN1_SOURCE_COUNT_UNBOUND"
          observed = re.findall(r"(?m)^Ran ([0-9]+) tests? in [0-9.]+s$", raw)
          assert len(observed) == 1 and observed[0] == selected[0], "GN1_PYTHON_ROSTER_MISMATCH"
          assert re.search(r"(?m)^OK$", raw), "GN1_PYTHON_NOT_ALL_PASS"
          assert not re.search(r"(?m)^FAILED|^OK \(skipped", raw), "GN1_PYTHON_FAILURE_OR_SKIP"
          PY
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.98.1
        with:
          toolchain: '1.98.1'
      - name: Install native compiler prerequisites only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libpipewire-0.3-dev pkg-config clang
      - name: Compile then execute exactly two bounded PrivateOriginals tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --jobs 2 -p motionwright-native \
            --example native-graph-review-session \
            smaller_parent_ -- --test-threads=1 \
            > "$GN1_TWO_EVIDENCE/rust.original.log" \
            2> "$GN1_TWO_EVIDENCE/rust-stderr.original.log"
          python3 -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import re
          folder = Path(os.environ["GN1_TWO_EVIDENCE"])
          stdout = (folder / "rust.original.log").read_bytes()
          stderr = (folder / "rust-stderr.original.log").read_bytes()
          plain = re.sub(r"\x1b\[[0-9;]*m", "",
                         (stdout + b"\n" + stderr).decode("utf-8", errors="replace"))
          observed = re.findall(r"(?m)^test ([A-Za-z0-9_:]+) \.\.\. ok\r?$", plain)
          expected = {
              "smaller_parent_retains_two_sequential_originals_without_expanding_eight_mib",
              "smaller_parent_refuses_unreserved_oversized_result_without_publishing",
          }
          assert len(observed) == len(set(observed)) == 2, "RUST2_NOT_EXACT"
          assert {name.rsplit("::", 1)[-1] for name in observed} == expected
          assert re.search(
              r"test result: ok\. 2 passed; 0 failed; 0 ignored; 0 measured; "
              r"[0-9]+ filtered out;", plain), "RUST2_NOT_COMPILATION_PASS"
          result = {
              "schema": "motionwright.gn1-source-compiled-two-G1/1",
              "source_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "Rust_compiled_two": "PASS_EXACT_TWO",
              "rust_tests": sorted(expected),
              "original_stdout_sha256": hashlib.sha256(stdout).hexdigest(),
              "original_stderr_sha256": hashlib.sha256(stderr).hexdigest(),
              "Native_owner_startup": "NOT_RUN",
              "Graph_Save": "NOT_RUN",
              "Graph6": "0/6",
              "G2": "NOT_GRANTED",
              "F": "HOLD",
          }
          (folder / "selected.original.json").write_text(
              json.dumps(result, sort_keys=True, indent=2) + "\n",
              encoding="utf-8")
          PY
      - name: Hash retained originals with relative portable paths
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GN1_TWO_EVIDENCE:-}" || exit 0
          test -d "$GN1_TWO_EVIDENCE"
          (
            cd "$GN1_TWO_EVIDENCE"
            find . -maxdepth 1 -type f ! -name originals.sha256 -print0 |
              LC_ALL=C sort -z | xargs -0 -r sha256sum
          ) > "$GN1_TWO_EVIDENCE/originals.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gn1-inert-two-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.GN1_TWO_EVIDENCE || 'missing-gn1-inert-originals' }}
          if-no-files-found: warn
          retention-days: 14

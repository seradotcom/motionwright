                          index += 1
                      contract_need(count <= 16 and index < len(lines) and lines[index] == "ok",
                                    "Source group diagnostic has no terminal success")
                      index += 1
                  observed.append(identity)
              contract_need(observed == expected, "Source group duplicate/missing/foreign nominal cases")
              return observed


          def contract_check_receipt(receipt, source, github, definitions, runner_sha, locks, interpreter_sha):

        def contract_nominal(raw, expected):
            text = raw.decode("utf-8", "strict").replace("\r\n", "\n")
            contract_need(not any(c in text for c in ("\r", "\x00", "\v", "\f", "\x85", "\u2028", "\u2029")),
                     "Source group noncanonical line separator")

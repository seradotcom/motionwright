  native-mlt-sequence:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.fixedtxt_mode != 'deliver' && (inputs.verification_scope == 'normal' || inputs.verification_scope == 'repaired-g2' || inputs.verification_scope == 'film180-g2') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (inputs.verification_scope == 'repaired-g2' || inputs.verification_scope == 'film180-g2') && '["final-mp4"]' || '["pcm","video-only","final-mp4","captioned-mp4"]') }}
    env:
      MOTIONWRIGHT_MLT_MODE: ${{ matrix.mode }}
      MW_MLT_SCOPE: ${{ github.event_name == 'workflow_dispatch' && (inputs.verification_scope == 'repaired-g2' || inputs.verification_scope == 'film180-g2') && inputs.verification_scope || 'normal' }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify optional original-attempt selection before effects
        env:
          REQUESTED_MLT_SCOPE: ${{ inputs.verification_scope || 'normal' }}
        run: |
          set -euo pipefail
          case "$REQUESTED_MLT_SCOPE" in normal|repaired-g2|film180-g2) ;; *) exit 2 ;; esac
          if [[ "$MW_MLT_SCOPE" != 'normal' ]]; then
            test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
            test "$GITHUB_RUN_ATTEMPT" = '1'
            test "$MOTIONWRIGHT_MLT_MODE" = 'final-mp4'
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install hash-pinned private-evidence cryptography
        if: matrix.mode != 'pcm' && matrix.mode != 'video-only'
        id: custody_python
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3.12-venv
          /usr/bin/python3.12 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          venv="$RUNNER_TEMP/mw-mlt-custody-python-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$venv"
          /usr/bin/python3.12 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-cache-dir \
            --only-binary=:all: --require-hashes -r tooling/requirements/mlt-g2-custody.txt
          "$venv/bin/python" -m pip check
          echo "python=$venv/bin/python" >> "$GITHUB_OUTPUT"

      - name: Initialize closed preflight source custody without admission or native effects
        id: g2_preflight_initialize
        if: env.MW_MLT_SCOPE != 'normal'
        env:
          CUSTODY_PYTHON: ${{ steps.custody_python.outputs.python }}
          MW_MLT_G2_ADMISSION: ${{ inputs.g2_admission }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$CUSTODY_PYTHON"
          "$CUSTODY_PYTHON" -B -E -s - initialize <<'PY'
          # BEGIN A6_MLT_PREFLIGHT_CUSTODY
          import json
          import os
          from pathlib import Path
          import stat
          import sys


          def p1_need(value, reason):
              if not value:
                  raise ValueError(reason)


          def p1_exists(path):
              try:
                  path.lstat()
              except FileNotFoundError:
                  return False
              return True


          def p1_private(path, directory):
              info = path.lstat()
              p1_need(path.is_absolute() and path.resolve(strict=True) == path
                      and not any(item.is_symlink() for item in path.parents), "preflight noncanonical path")
              p1_need((stat.S_ISDIR(info.st_mode) if directory else stat.S_ISREG(info.st_mode))
                      and stat.S_IMODE(info.st_mode) == (0o700 if directory else 0o600)
                      and info.st_uid == os.geteuid()
                      and (directory or info.st_nlink == 1), "preflight private original permissions")


          def p1_locations(env, native):
              current = native.context(env)
              base = native.runner_root(env)
              suffix = current["run_id"] + "-" + current["run_attempt"]
              root = base / ("mw-mlt-preflight-custody-" + suffix)
              common = base / ("mw-mlt-g2-contracts-" + suffix)
              film = base / ("mw-film180-contracts-" + suffix)
              workflow = base / ("mw-mlt-workflow-contracts-" + suffix)
              control, installed, session = native.names(env)
              return current, root, common, film, workflow, control, installed, session


          def p1_observed_outcomes(env):
              keys = ("P1_COMMON_OUTCOME", "P1_FILM_OUTCOME", "P1_PUBLICATION_OUTCOME",
                      "P1_PREPARE_OUTCOME", "P1_ADMISSION_OUTCOME", "P1_PRODUCER_OUTCOME")
              return {key: env.get(key, "") for key in keys}


          def p1_native_terminal(outcomes, initial_absence, installed_present, session_present, producer_marker_present):
              # Absence at the final read alone cannot undo an observed invocation.
              no_effect = (initial_absence is True
                           and outcomes.get("P1_ADMISSION_OUTCOME") == "skipped"
                           and outcomes.get("P1_PRODUCER_OUTCOME") == "skipped"
                           and installed_present is False and session_present is False
                           and producer_marker_present is False)
              return "NOT_STARTED" if no_effect else "ERROR_OR_UNKNOWN"


          def p1_report_names(label):
              count = {"common": 12, "film": 3, "workflow": 1}[label]
              names = {"contracts.json", "contracts-admission.json", "runner.stdout", "runner.stderr", "runner-exit.json"}
              names |= {f"contracts-{index:02d}-{stream}.log" for index in range(count) for stream in ("stdout", "stderr")}
              if label == "common":
                  names |= {"publication-binding.json", "original-wav-rust.log", "film180-rust-source.log", "film180-rust-source.receipt.json", "film180-rust-source.discovery.log", "film180-rust-source.discovery.receipt.json"}
                  names |= {f"publication-binding-{index:02d}-{stream}.log" for index in range(2) for stream in ("stdout", "stderr")}
              return names


          def p1_copy_reports(root, original_roots, custody):
              # Only the source-owned flat receipt/log inventory is copied. Unknown
              # neighboring files and subdirectories are never opened or encrypted.
              captured_roots, observations, errors = {}, [], []
              target = root / "source-report-snapshot"
              target.mkdir(mode=0o700)
              for label, directory in original_roots.items():
                  output = target / label
                  output.mkdir(mode=0o700)
                  captured_roots[label] = output
                  if not p1_exists(directory):
                      errors.append({"label": label, "status": "ORIGINAL_ROOT_ABSENT", "automatic_retry": False})
                      continue
                  try:
                      p1_private(directory, True)
                      inventory = sorted(path.name for path in directory.iterdir())
                      missing = sorted({"contracts.json", "runner.stdout", "runner.stderr", "runner-exit.json"} - set(inventory))
                      if missing:
                          errors.append({"label": label, "status": "SOURCE_REPORT_RECORDS_ABSENT", "names": missing})
                      unknown = sorted(set(inventory) - p1_report_names(label))
                      if unknown:
                          errors.append({"label": label, "status": "UNSELECTED_NEIGHBORS_NOT_CAPTURED", "names": unknown})
                      for name in sorted(set(inventory) & p1_report_names(label)):
                          path = directory / name
                          try:
                              p1_private(path, False)
                              before = custody.metadata_identity(path.lstat())
                              raw, observation = custody.regular(path)
                              custody.new_bytes(output / name, raw)
                              p1_need(custody.metadata_identity(path.lstat()) == before, "source original changed during copy")
                              observations.append({"root": label, "relative_path": name, "original": observation,
                                                   "copied_sha256": custody.sha(raw), "copied_bytes": len(raw)})
                          except Exception as error:
                              errors.append({"label": label, "name": name, "type": type(error).__name__,
                                             "message": str(error), "original_not_modified_by_capture": True, "automatic_retry": False})
                      p1_need(inventory == sorted(path.name for path in directory.iterdir()), "source report inventory changed")
                  except Exception as error:
                      errors.append({"label": label, "type": type(error).__name__, "message": str(error),
                                     "original_not_modified_by_capture": True, "automatic_retry": False})
              return captured_roots, observations, errors


          def p1_initialize(env, custody, native, source_state):
              current, root, common, film, workflow, control, installed, session = p1_locations(env, native)
              raw = env.get("MW_MLT_G2_ADMISSION", "").encode("utf-8")
              dispatch = native.validate_dispatch(raw, current, scenario=env["MW_MLT_SCOPE"])
              custody.public_key(dispatch["recipient"])
              checkout = Path(env["GITHUB_WORKSPACE"])
              state = source_state(checkout, current["source_sha"])
              physical = native.source_guard(checkout, current, scenario=env["MW_MLT_SCOPE"])
              for path in (root, common, film, workflow, control, installed, session):
                  p1_need(not p1_exists(path), "preflight namespace is not fresh")
              # Everything above is validation/read-only. This does not call prepare,
              # intake, runtime admission, a producer, or a renderer.
              root.mkdir(mode=0o700)
              for name in ("records", "public"):
                  (root / name).mkdir(mode=0o700)
              custody.new_bytes(root / "records/dispatch.original.json", raw)
              custody.new_json(root / "records/source-before.json", {"git": state, "physical": physical})
              custody.new_json(root / "records/initial.json", {
                  "schema": "motionwright.native.mlt-preflight-initial/1", "context": current,
                  "github_job": env["GITHUB_JOB"], "scope": env["MW_MLT_SCOPE"],
                  "effect_namespaces_initially_absent": True, "dispatch_input_sha256": custody.sha(raw),
                  "admission_granted": False, "native_effect_started": False, "automatic_retry": False})
              for directory in (root, root / "records", root / "public"):
                  p1_private(directory, True)
              return root


          def p1_finish(env, custody, native, source_state):
              current, root, common, film, workflow, control, installed, session = p1_locations(env, native)
              p1_private(root, True)
              p1_private(root / "records", True)
              p1_private(root / "public", True)
              p1_need(not any((root / "public").iterdir()), "preflight public output is not fresh")
              initial_raw = custody.regular(root / "records/initial.json", custody.MAX_JSON)[0]
              before_raw = custody.regular(root / "records/source-before.json", custody.MAX_JSON)[0]
              dispatch_raw = custody.regular(root / "records/dispatch.original.json", custody.MAX_JSON)[0]
              initial = custody.strict(initial_raw)
              p1_need(initial.get("schema") == "motionwright.native.mlt-preflight-initial/1"
                      and initial.get("context") == current and initial.get("github_job") == env["GITHUB_JOB"]
                      and initial.get("scope") == env["MW_MLT_SCOPE"]
                      and initial.get("effect_namespaces_initially_absent") is True
                      and initial.get("dispatch_input_sha256") == custody.sha(dispatch_raw)
                      and initial.get("admission_granted") is False
                      and initial.get("native_effect_started") is False
                      and initial.get("automatic_retry") is False, "preflight initial binding differs")
              dispatch = native.validate_dispatch(dispatch_raw, current, scenario=env["MW_MLT_SCOPE"])
              custody.public_key(dispatch["recipient"])
              outcomes = p1_observed_outcomes(env)
              effect_observations = {}
              for label, path in (("installation", installed), ("session", session),
                                  ("producer-marker", control / "records/producer-started.json")):
                  try:
                      effect_observations[label] = {"present": p1_exists(path)}
                  except OSError as error:
                      effect_observations[label] = {"present": None, "type": type(error).__name__, "message": str(error)}
              terminal = p1_native_terminal(outcomes, initial["effect_namespaces_initially_absent"],
                  effect_observations["installation"]["present"], effect_observations["session"]["present"],
                  effect_observations["producer-marker"]["present"])
              source_unchanged, source_error = False, None
              try:
                  checkout = Path(env["GITHUB_WORKSPACE"])
                  # Each canonical source test already performs its strict complete-input
                  # postcheck immediately, before SDK checkout/build. At this later phase
                  # the existing native job has legitimately created _semwright/target.
                  # Preserve the native physical source-binding guard; do not weaken the
                  # canonical runner or claim this is another empty-input source epoch.
                  after = {"physical": native.source_guard(checkout, current, scenario=env["MW_MLT_SCOPE"]),
                           "scope": "Existing native source_guard: exact HEAD/tree, tracked changes and selected physical files",
                           "strict_full_input_preflight_postchecks": "retained in original canonical unittest receipts",
                           "full_checkout_input_postcheck_at_final_seal": False}
                  custody.new_json(root / "records/source-after.json", after)
                  source_unchanged = (custody.json_bytes(custody.strict(before_raw)["physical"])
                                      == custody.json_bytes(after["physical"]))
              except Exception as error:
                  # The original failure and all available source reports remain private.
                  source_error = {"type": type(error).__name__, "message": str(error), "automatic_retry": False}
              native_dispatch_valid = False
              dispatch_error = None
              try:
                  native_raw, native_observation = custody.regular(control / "records/dispatch.json", custody.MAX_JSON)
                  custody.new_bytes(root / "records/native-dispatch-observed.json", native_raw)
                  custody.new_json(root / "records/native-dispatch-observation.json", native_observation)
                  actual = native.validate_dispatch(native_raw, current, scenario=env["MW_MLT_SCOPE"])
                  p1_need(custody.json_bytes(actual) == custody.json_bytes(dispatch), "native dispatch differs from original preflight input")
                  native_dispatch_valid = True
              except Exception as error:
                  dispatch_error = {"type": type(error).__name__, "message": str(error), "automatic_retry": False}
              custody.new_json(root / "records/finish.json", {
                  "schema": "motionwright.native.mlt-preflight-finish/1", "context": current,
                  "github_job": env["GITHUB_JOB"], "outcomes": outcomes, "native_terminal": terminal,
                  "effect_observations": effect_observations,
                  "native_dispatch_valid": native_dispatch_valid, "native_dispatch_error": dispatch_error,
                  "selected_source_bindings_unchanged": source_unchanged, "source_error": source_error,
                  "native_originals_modified_by_preflight": False, "native_originals_claimed_in_this_capsule": False,
                  "automatic_retry": False})
              # A new exclusive intent makes capture/encryption one-shot, even after a
              # partial exception. This phase never reruns tests or native operations.
              custody.new_json(root / "records/seal-intent.json", {"context": current, "automatic_retry": False})
              copies, observations, private_errors = p1_copy_reports(root, {"common": common, "film": film, "workflow": workflow}, custody)
              roots = {"records": root / "records", **copies}
              custody.new_json(root / "records/source-report-capture.json", {
                  "observed_originals": observations, "errors": private_errors,
                  "scope": "Only named source report/log files; unknown neighbors are not captured",
                  "automatic_retry": False})
              plaintext, captured = custody.gather_snapshot(roots, preserve_partial=True)
              encrypted = custody.encrypt_snapshot(plaintext, dispatch["recipient"], current)
              public = {
                  "schema": "motionwright.native.mlt-preflight-public/1", "context": current,
                  "github_job": env["GITHUB_JOB"], "scope": "source-preflight-originals-only",
                  "status": "SOURCE_ORIGINALS_SEALED" if captured and not private_errors else "PARTIAL_SOURCE_ORIGINALS_SEALED",
                  "selected_source_bindings_unchanged": source_unchanged,
                  "full_checkout_input_postcheck_at_final_seal": False,
                  "captured_source_originals_complete": captured and not private_errors,
                  "native_terminal": terminal, "native_dispatch_valid": native_dispatch_valid,
                  "sealed_originals_sha256": custody.sha(encrypted), "sealed_originals_bytes": len(encrypted),
                  "recipient_spki_sha256": dispatch["recipient"]["sha256"],
                  "native_originals_claimed": False, "source_test_pass_claimed": False,
                  "admission_granted": False, "native_operation_retried": False,
                  "physical_AV_master_acceptance": False, "human_acceptance": False, "release_authorized": False}
              custody.new_bytes(root / "public/sealed-source-originals.bin", encrypted)
              custody.new_json(root / "public/source-public-evidence.json", public)
              p1_need({path.name for path in (root / "public").iterdir()}
                      == {"sealed-source-originals.bin", "source-public-evidence.json"}, "preflight public closure differs")
              complete = captured and not private_errors and source_unchanged
              return public, 0 if complete and native_dispatch_valid else 2


          def p1_main():
              sys.path.insert(0, str(Path.cwd() / "tooling"))
              import ci_private_evidence as custody
              import native_mlt_g2_custody as native
              from ci_test_runner import source_state
              p1_need(len(sys.argv) == 2 and sys.argv[1] in {"initialize", "finish"}, "preflight action")
              if sys.argv[1] == "initialize":
                  p1_initialize(os.environ, custody, native, source_state)
                  return 0
              public, code = p1_finish(os.environ, custody, native, source_state)
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8", newline="\n") as handle:
                  handle.write("native_dispatch=" + ("true" if public["native_dispatch_valid"] else "false") + "\n")
              return code


          if __name__ == "__main__":
              raise SystemExit(p1_main())
          # END A6_MLT_PREFLIGHT_CUSTODY
          PY

      - name: Verify preflight custody infrastructure controls
        id: g2_workflow_contracts
        if: matrix.mode != 'pcm' && matrix.mode != 'video-only'
        env:
          CUSTODY_PYTHON: ${{ steps.custody_python.outputs.python }}
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/mw-mlt-workflow-contracts-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$root"
          mkdir -m 700 "$root"
          report="$root/contracts.json"
          set +e
          "$CUSTODY_PYTHON" -B -E -s tooling/ci_test_runner.py \
            --repo "$GITHUB_WORKSPACE" --mode dotted --require-complete \
            --expected-source "$GITHUB_SHA" --report "$report" \
            --pattern test_native_mlt_workflow_preflight.py \
            > "$root/runner.stdout" 2> "$root/runner.stderr"
          runner_exit=$?
          set -e
          "$CUSTODY_PYTHON" -B -E -s - "$root/runner-exit.json" "$runner_exit" <<'PY'
          import json, sys
          from pathlib import Path
          value = {"schema": "motionwright.ci.source-runner-terminal/1", "exit_code": int(sys.argv[2]), "automatic_retry": False}
          with Path(sys.argv[1]).open("x", encoding="utf-8", newline="\n") as handle:
              json.dump(value, handle, sort_keys=True)
              handle.write("\n")
          PY
          if [ "$runner_exit" -ne 0 ]; then exit "$runner_exit"; fi
          "$CUSTODY_PYTHON" -B -E -s - "$root" "$report" <<'PY'
          SUITES = [('tooling/tests/test_native_mlt_workflow_preflight.py', 16, '1d9c5cfe023fbc7dbb0dad8aac422ba90d06a792cb7bf2a606f50d93e5525cfc')]
          MODE = 'dotted'
          GROUP = 'workflow'
          TOTAL = 16

          import ast
          from datetime import datetime
          import hashlib
          import json
          import math
          import os
          from pathlib import Path
          import re
          import stat
          import sys


          def contract_need(value, message):
              if not value:
                  raise ValueError(message)


          def contract_sha(raw):
              return hashlib.sha256(raw).hexdigest()


          def contract_private(path, directory=False):
              path = Path(path)
              mark = path.lstat()
              wanted = stat.S_ISDIR if directory else stat.S_ISREG
              contract_need(wanted(mark.st_mode) and not path.is_symlink()
                       and path.resolve(strict=True) == path and mark.st_uid == os.geteuid(),
                       "Source group source-report identity/owner/type")
              contract_need(stat.S_IMODE(mark.st_mode) == (0o700 if directory else 0o600),
                       "Source group source-report must already be private; no retroactive chmod")
              return mark


          def contract_original(path):
              before = contract_private(path)
              raw = Path(path).read_bytes()
              after = contract_private(path)
              keys = ("st_dev", "st_ino", "st_mode", "st_uid", "st_gid", "st_nlink", "st_size", "st_mtime_ns", "st_ctime_ns")
              contract_need(before.st_nlink == 1 and tuple(getattr(before, k) for k in keys) == tuple(getattr(after, k) for k in keys)
                       and len(raw) == before.st_size, "Source group original changed/aliased during readback")
              return raw


          def contract_json(raw):
              def pairs(rows):
                  result = {}
                  for key, value in rows:
                      contract_need(key not in result, "Source group duplicate JSON key")
                      result[key] = value
                  return result
              return json.loads(raw, object_pairs_hook=pairs,
                                parse_constant=lambda _: contract_need(False, "Source group nonfinite JSON"))


          def contract_roster(raw, path, count, expected_sha):
              tree = ast.parse(raw, filename=path)
              contract_need(not any(isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name == "load_tests"
                               for n in ast.walk(tree)), "Unreviewed dynamic Source group discovery")
              names, classes = [], []
              for cls in tree.body:
                  if not isinstance(cls, ast.ClassDef):
                      continue
                  methods = [n.name for n in cls.body if isinstance(n, ast.FunctionDef) and n.name.startswith("test_")]
                  if methods:
                      contract_need([ast.unparse(base) for base in cls.bases] == ["unittest.TestCase"]
                               and cls.name not in classes and len(methods) == len(set(methods)), "Source group class/method roster changed")
                      classes.append(cls.name)
                      names.extend(cls.name + "." + name for name in methods)
              names.sort()
              contract_need(len(names) == len(set(names)) == count
                       and contract_sha(("\n".join(names) + "\n").encode()) == expected_sha, "Source group nominal source roster requires review")
              return names


          def contract_nominal(raw, expected):
              text = raw.decode("utf-8", "strict").replace("\r\n", "\n")
              contract_need(not any(c in text for c in ("\r", "\x00", "\v", "\f", "\x85", "\u2028", "\u2029")),
                       "Source group noncanonical line separator")
              footer = re.search(r"\n-{70}\nRan ([0-9]+) tests? in [0-9]+(?:\.[0-9]+)?s\n\nOK\n\Z", text)
              contract_need(footer is not None and footer.group(1) == str(len(expected)), "Source group incomplete/failed unittest footer")
              body = text[:footer.start()]
              contract_need(body.endswith("\n"), "Source group terminal/footer separation")
              observed = []
              lines = body[:-1].split("\n")
              index = 0
              diagnostic = "MLT G2 secondary evidence failure; native outcome retained."
              diagnostic_modules = (".test_native_mlt_g2_observation.", ".test_native_mlt_live_observer_diagnostics.",
                                    ".test_native_film180_original_g2.")
              while index < len(lines):
                  match = re.fullmatch(r"(test_[A-Za-z0-9_]+) \(([A-Za-z_][A-Za-z0-9_.]*)\) \.\.\. (.*)", lines[index])
                  contract_need(match is not None, "Source group foreign/omitted/unreviewed nominal outcome")
                  method, identity, terminal = match.groups()
                  identity = identity if identity.rsplit(".", 1)[-1] == method else identity + "." + method
                  contract_need(identity in expected, "Source group diagnostic/terminal has no selected case")
                  index += 1
                  if terminal != "ok":
                      contract_need(terminal == diagnostic and any(part in "." + identity for part in diagnostic_modules),
                                    "Source group unreviewed diagnostic")
                      count = 1
                      while index < len(lines) and lines[index] == diagnostic:
                          count += 1
                          index += 1
                      contract_need(count <= 16 and index < len(lines) and lines[index] == "ok",
                                    "Source group diagnostic has no terminal success")
                      index += 1
                  observed.append(identity)
              contract_need(observed == expected, "Source group duplicate/missing/foreign nominal cases")
              return observed


          def contract_check_receipt(receipt, source, github, definitions, runner_sha, locks, interpreter_sha):
              contract_need(type(receipt) is dict and receipt.get("schema") == "motionwright.unittest-execution/1", "Source group receipt schema")
              contract_need(receipt.get("executed_source_sha") == source["executed_source_sha"]
                       and receipt.get("tree_sha") == source["tree_sha"] and receipt.get("github") == github,
                       "Source group source/run/attempt/job differs")
              contract_need(receipt.get("status") == "PASS" and type(receipt.get("exit_code")) is int and receipt["exit_code"] == 0
                       and receipt.get("require_complete") is True and "source_postcheck_error" not in receipt,
                       "Source group failed/incomplete/uncertain source receipt")
              contract_need(receipt.get("test_definition_sha256") == definitions and receipt.get("runner_sha256") == runner_sha
                       and receipt.get("source_locks") == locks and receipt.get("python_executable_sha256") == interpreter_sha,
                       "Source group physical input/runner/interpreter identity differs")
              contract_need(type(receipt.get("steps")) is list and len(receipt["steps"]) == len(SUITES), "Source group requires its entire closed module set")
              contract_need(datetime.fromisoformat(receipt["started_at_utc"]) <= datetime.fromisoformat(receipt["completed_at_utc"]),
                       "Source group receipt chronology")


          def contract_check_step(step, path, count, mode, ids, logs, executable):
              module = path[:-3].replace("/", ".")
              label = "discovery:" + Path(path).name if mode == "discovery" else "dotted:" + module
              command = [executable, "-B", "-E", "-s", "-m", "unittest"]
              command += ["discover", "-s", "tooling/tests", "-p", Path(path).name, "-v"] if mode == "discovery" else [module, "-v"]
              contract_need(step.get("entry_point") == label and step.get("command") == command, "Source group wrong entry point/interpreter")
              contract_need(step.get("status") == "PASS" and type(step.get("exit_code")) is int and step["exit_code"] == 0,
                       "Source group nonterminal/failed process")
              counts = step.get("counts")
              expected = {"terminal_status": "OK", "tests_run": count, "passed": count, "failures": 0, "errors": 0,
                          "skipped": 0, "expected_failures": 0, "unexpected_successes": 0}
              contract_need(type(counts) is dict and set(counts) == set(expected)
                       and counts["terminal_status"] == "OK"
                       and all(type(counts[k]) is int and counts[k] == v for k, v in expected.items() if k != "terminal_status"),
                       "Source group omitted/noninteger/wrong counts")
              duration = step.get("duration_seconds")
              contract_need(type(duration) in (int, float) and math.isfinite(duration) and duration >= 0, "Source group invalid duration")
              for stream, raw in logs.items():
                  contract_need(type(step.get(stream)) is dict and set(step[stream]) == {"file", "sha256"}
                           and step[stream]["sha256"] == contract_sha(raw), "Source group original stream hash differs")
              prefix = Path(path).stem if mode == "discovery" else module
              return contract_nominal(logs["stderr"], [prefix + "." + name for name in ids])


          def admit_contract_source():
              # Use the existing canonical verifier; no test/native command is started here.
              from tooling.ci_test_runner import source_state
              root, report = Path(sys.argv[1]), Path(sys.argv[2])
              contract_private(root, directory=True)
              contract_need(report.parent == root, "Source group report must use its reserved root")
              contract_private(report.parent, directory=True)
              wanted = {"contracts.json", "runner.stdout", "runner.stderr", "runner-exit.json"} | {f"contracts-{i:02d}-{stream}.log" for i in range(len(SUITES)) for stream in ("stdout", "stderr")}
              contract_need(set(p.name for p in report.parent.iterdir()) == wanted, "Source group full source-report original closure differs")
              before = source_state(Path.cwd(), os.environ["GITHUB_SHA"])
              github = {key: os.environ.get(key, "") for key in
                        ("GITHUB_SHA", "GITHUB_WORKFLOW_REF", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_JOB")}
              contract_need(all(github.values()), "Source group job identity incomplete")
              raw = contract_original(report)
              receipt = contract_json(raw)
              originals = {str(report): contract_sha(raw)}
              terminal_raw = contract_original(root / "runner-exit.json")
              terminal = contract_json(terminal_raw)
              contract_need(terminal == {"schema": "motionwright.ci.source-runner-terminal/1",
                                        "exit_code": 0, "automatic_retry": False}
                            and type(terminal["exit_code"]) is int,
                            "Source group original runner exit differs")
              originals[str(root / "runner-exit.json")] = contract_sha(terminal_raw)
              for name in ("runner.stdout", "runner.stderr"):
                  originals[str(root / name)] = contract_sha(contract_original(root / name))

              definitions, rosters = {}, {}
              for path, count, nominal_sha in SUITES:
                  body = Path(path).read_bytes()
                  definitions[path] = contract_sha(body)
                  rosters[path] = contract_roster(body, path, count, nominal_sha)
              locks = {path: contract_sha(Path(path).read_bytes()) for path in
                       ("Cargo.lock", "SOURCE_LOCK.json", "apps/studio/package-lock.json") if Path(path).is_file()}
              runner_sha = contract_sha(Path("tooling/ci_test_runner.py").read_bytes())
              interpreter_sha = contract_sha(Path(sys.executable).read_bytes())
              contract_check_receipt(receipt, before, github, definitions, runner_sha, locks, interpreter_sha)
              # Canonical runner preserves requested discovery order, then sorted dotted files.
              plan = [(row, MODE) for row in (SUITES if MODE == "discovery" else sorted(SUITES))]
              observed = []
              for index, ((path, count, nominal_sha), mode) in enumerate(plan):
                  step = receipt["steps"][index]
                  logs = {}
                  for stream in ("stdout", "stderr"):
                      name = f"contracts-{index:02d}-{stream}.log"
                      contract_need(step[stream]["file"] == name, "Source group aliased stream path")
                      body = contract_original(report.parent / name)
                      logs[stream] = body
                      originals[str(report.parent / name)] = contract_sha(body)
                  ids = contract_check_step(step, path, count, mode, rosters[path], logs, str(sys.executable))
                  observed.append({"entry_point": step["entry_point"], "nominal_ids": ids, "source_path": path})
              contract_need(sum(len(row["nominal_ids"]) for row in observed) == TOTAL, "Source group incomplete invocation roster")
              contract_need(source_state(Path.cwd(), os.environ["GITHUB_SHA"]) == before
                       and definitions == {path: contract_sha(Path(path).read_bytes()) for path in definitions}
                       and all(contract_sha(contract_original(Path(path))) == pin for path, pin in originals.items()), "Source group source/originals changed")
              value = {"schema": "motionwright.closed-source-contract-group/1", "group": GROUP, **before, "github": github,
                       "status": "PASS_SOURCE_CONTRACTS_ONLY", "unique_methods": TOTAL, "invocations": TOTAL,
                       "steps": observed, "original_receipt_sha256": contract_sha(raw), "original_streams": originals,
                       "scope": "Source/custody contracts only; no physical production or human acceptance",
                       "native_execution": False, "formal_acceptance": False, "automatic_retry": False}
              destination = report.parent / "contracts-admission.json"
              with destination.open("x", encoding="utf-8", newline="\n") as handle:
                  json.dump(value, handle, indent=2, sort_keys=True)
                  handle.write("\n")
              contract_private(destination)


          admit_contract_source()
          PY

      - name: Verify complete source-only G2 custody contracts
        id: g2_common_contracts
        if: matrix.mode != 'pcm' && matrix.mode != 'video-only'
        env:

              contract_check_receipt(receipt, before, github, definitions, runner_sha, locks, interpreter_sha)
              # Canonical runner preserves requested discovery order, then sorted dotted files.
              plan = [(row, MODE) for row in (SUITES if MODE == "discovery" else sorted(SUITES))]
              observed = []
              for index, ((path, count, nominal_sha), mode) in enumerate(plan):
                  step = receipt["steps"][index]
                  logs = {}
                  for stream in ("stdout", "stderr"):

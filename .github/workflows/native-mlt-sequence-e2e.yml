              mark = path.lstat()
              wanted = stat.S_ISDIR if directory else stat.S_ISREG
              contract_need(wanted(mark.st_mode) and not path.is_symlink()
                       and path.resolve(strict=True) == path and mark.st_uid == os.geteuid(),

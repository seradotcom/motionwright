name: Native Motionwright MLT multisegment timeline

on:
  workflow_dispatch:
    inputs:
      verification_scope:
        description: Native verification selection
        type: choice
        options: [normal, repaired-g2, film180-g2]
        default: normal
        required: true
      g2_admission:
        description: Admitted runtime source artifacts and public recovery key for the selected G2
        type: string
        default: ''
        required: false
  pull_request:
    paths:
      - 'SOURCE_LOCK.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/domain/**'
      - 'crates/service/**'
      - 'crates/storage/**'
      - 'crates/native/**'
      - 'apps/studio/**'
      - 'tooling/native_mlt_sequence_e2e.py'
      - 'tooling/native_film180_original_g2.py'
      - 'tooling/native_film180_media_readback.py'
      - 'tooling/tests/test_native_film180_original_g2.py'
      - 'tooling/tests/test_native_film180_media_readback.py'
      - 'tooling/ci_private_evidence.py'
      - 'tooling/native_mlt_g2_custody.py'
      - 'tooling/mlt-audio-diagnostic/repair_planar_source.py'
      - 'tooling/tests/test_native_mlt_compiler_intake.py'
      - 'tooling/native_mlt_g2_observation.py'
      - 'tooling/native_mlt_runtime_admission.py'
      - 'tooling/native_mlt_loaded_module.py'
      - 'tooling/mlt_official_runtime_intake.py'
      - 'tooling/native_mlt_ci_pcm_envelope.py'
      - 'tooling/native_pcm_source_fidelity.py'
      - 'tooling/requirements/mlt-g2-custody.txt'
      - 'tooling/tests/test_native_mlt_owner_workspace.py'
      - 'tooling/tests/test_native_mlt_g2_custody.py'
      - 'tooling/tests/test_native_mlt_g2_observation.py'
      - 'tooling/tests/test_native_mlt_live_observer_diagnostics.py'
      - 'tooling/tests/test_native_mlt_host_tool_observation.py'
      - 'tooling/tests/test_native_mlt_publication_binding.py'
      - 'tooling/tests/test_native_mlt_linux_descriptor_custody.py'
      - 'tooling/tests/test_native_mlt_loaded_module.py'
      - 'tooling/tests/test_native_mlt_executable_alias.py'
      - 'tooling/tests/test_native_mlt_ci_audio.py'
      - 'tooling/native_mlt_caption_pixels.py'
      - 'tooling/tests/test_native_mlt_caption_pixels.py'
      - 'tooling/native_mlt_public_artifact.py'
      - 'tooling/cross_app_public_artifact.py'
      - 'tooling/tests/test_native_mlt_public_artifact.py'
      - 'tooling/native_av_failure_guard.py'
      - 'tooling/tests/test_native_cli_failure_redaction.py'
      - 'tooling/mlt_failure_diagnostic.py'
      - 'tooling/tests/test_mlt_failure_diagnostic.py'
      - '.github/workflows/native-mlt-sequence-e2e.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && (inputs.verification_scope == 'repaired-g2' || inputs.verification_scope == 'film180-g2') && 'native-mlt-repaired-g2-exclusive' || format('native-mlt-sequence-{0}-{1}', github.event_name, github.head_ref || github.ref_name) }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.verification_scope == 'repaired-g2' || inputs.verification_scope == 'film180-g2')) }}

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  PLAYWRIGHT_BROWSERS_PATH: '0'
  SEMWRIGHT_CHECKOUT: ${{ github.workspace }}/_semwright

jobs:
  native-mlt-sequence:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (inputs.verification_scope == 'repaired-g2' || inputs.verification_scope == 'film180-g2') && '["final-mp4"]' || '["pcm","video-only","final-mp4","captioned-mp4"]') }}
    env:
      MOTIONWRIGHT_MLT_MODE: ${{ matrix.mode }}
      MW_MLT_SCOPE: ${{ github.event_name == 'workflow_dispatch' && (inputs.verification_scope == 'repaired-g2' || inputs.verification_scope == 'film180-g2') && inputs.verification_scope || 'normal' }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify optional original-attempt selection before effects
        env:
          REQUESTED_MLT_SCOPE: ${{ inputs.verification_scope || 'normal' }}
        run: |
          set -euo pipefail
          case "$REQUESTED_MLT_SCOPE" in normal|repaired-g2|film180-g2) ;; *) exit 2 ;; esac
          if [[ "$MW_MLT_SCOPE" != 'normal' ]]; then
            test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
            test "$GITHUB_RUN_ATTEMPT" = '1'
            test "$MOTIONWRIGHT_MLT_MODE" = 'final-mp4'
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install hash-pinned private-evidence cryptography
        if: matrix.mode == 'final-mp4'
        id: custody_python
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3.12-venv
          /usr/bin/python3.12 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          venv="$RUNNER_TEMP/mw-mlt-custody-python-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$venv"
          /usr/bin/python3.12 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-cache-dir \
            --only-binary=:all: --require-hashes -r tooling/requirements/mlt-g2-custody.txt
          "$venv/bin/python" -m pip check
          echo "python=$venv/bin/python" >> "$GITHUB_OUTPUT"

      - name: Verify complete source-only G2 custody contracts
        if: matrix.mode == 'final-mp4'
        env:
          CUSTODY_PYTHON: ${{ steps.custody_python.outputs.python }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/mw-mlt-g2-contracts-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/contracts.json"
          "$CUSTODY_PYTHON" -B -E -s tooling/ci_test_runner.py \
            --repo "$GITHUB_WORKSPACE" --mode dotted --require-complete \
            --expected-source "$GITHUB_SHA" --report "$report" \
            --pattern test_native_mlt_owner_workspace.py \
            --pattern test_native_mlt_g2_custody.py \
            --pattern test_native_mlt_g2_observation.py \
            --pattern test_native_mlt_live_observer_diagnostics.py \
            --pattern test_native_mlt_host_tool_observation.py \
            --pattern test_native_mlt_loaded_module.py \
            --pattern test_native_mlt_executable_alias.py \
            --pattern test_native_mlt_compiler_intake.py
          "$CUSTODY_PYTHON" -B -E -s - "$report" <<'PY'
          import json, os, sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_bytes())
          assert result["status"] == "PASS" and result["exit_code"] == 0
          assert result["executed_source_sha"] == os.environ["GITHUB_SHA"]
          assert "source_postcheck_error" not in result
          expected = {
              "dotted:tooling.tests.test_native_mlt_owner_workspace": 8,
              "dotted:tooling.tests.test_native_mlt_g2_custody": 27,
              "dotted:tooling.tests.test_native_mlt_g2_observation": 23,
              "dotted:tooling.tests.test_native_mlt_live_observer_diagnostics": 30,
              "dotted:tooling.tests.test_native_mlt_host_tool_observation": 44,
              "dotted:tooling.tests.test_native_mlt_loaded_module": 18,
              "dotted:tooling.tests.test_native_mlt_executable_alias": 24,
              "dotted:tooling.tests.test_native_mlt_compiler_intake": 24,
          }
          assert {step["entry_point"] for step in result["steps"]} == set(expected)
          assert len(result["steps"]) == len(expected)
          for step in result["steps"]:
              counts = step["counts"]
              assert step["status"] == "PASS" and step["exit_code"] == 0
              assert counts["terminal_status"] == "OK"
              assert counts["tests_run"] == counts["passed"] == expected[step["entry_point"]]
              assert all(counts[key] == 0 for key in (
                  "errors", "failures", "skipped", "expected_failures", "unexpected_successes"))
          PY

      - name: Verify complete Film source and original-custody contracts
        if: matrix.mode == 'final-mp4'
        env:
          CUSTODY_PYTHON: ${{ steps.custody_python.outputs.python }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/mw-film180-contracts-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/contracts.json"
          "$CUSTODY_PYTHON" -B -E -s tooling/ci_test_runner.py \
            --repo "$GITHUB_WORKSPACE" --mode dotted --require-complete \
            --expected-source "$GITHUB_SHA" --report "$report" \
            --pattern test_native_film180_original_g2.py \
            --pattern test_native_film180_media_readback.py
          "$CUSTODY_PYTHON" -B -E -s - "$report" <<'PY'
          import json, os, sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_bytes())
          assert result["status"] == "PASS" and result["exit_code"] == 0
          assert result["executed_source_sha"] == os.environ["GITHUB_SHA"]
          assert "source_postcheck_error" not in result
          expected = {
              "dotted:tooling.tests.test_native_film180_original_g2": 77,
              "dotted:tooling.tests.test_native_film180_media_readback": 17,
          }
          assert {step["entry_point"] for step in result["steps"]} == set(expected)
          assert len(result["steps"]) == len(expected)
          for step in result["steps"]:
              counts = step["counts"]
              assert step["status"] == "PASS" and step["exit_code"] == 0
              assert counts["terminal_status"] == "OK"
              assert counts["tests_run"] == counts["passed"] == expected[step["entry_point"]]
              assert all(counts[key] == 0 for key in (
                  "errors", "failures", "skipped", "expected_failures", "unexpected_successes"))
          PY

      - name: Verify original consumer publication and Linux descriptor custody
        if: matrix.mode == 'final-mp4'
        env:
          CUSTODY_PYTHON: ${{ steps.custody_python.outputs.python }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/mw-mlt-g2-contracts-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/publication-binding.json"
          "$CUSTODY_PYTHON" -B -E -s tooling/ci_test_runner.py \
            --repo "$GITHUB_WORKSPACE" --mode dotted --require-complete \
            --expected-source "$GITHUB_SHA" --report "$report" \
            --pattern test_native_mlt_publication_binding.py \
            --pattern test_native_mlt_linux_descriptor_custody.py
          "$CUSTODY_PYTHON" -B -E -s - "$report" <<'PY'
          import json, os, sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_bytes())
          assert result["status"] == "PASS" and result["exit_code"] == 0
          assert result["executed_source_sha"] == os.environ["GITHUB_SHA"]
          assert "source_postcheck_error" not in result
          expected = {
              "dotted:tooling.tests.test_native_mlt_publication_binding": 7,
              "dotted:tooling.tests.test_native_mlt_linux_descriptor_custody": 1,
          }
          assert {step["entry_point"] for step in result["steps"]} == set(expected)
          assert len(result["steps"]) == len(expected)
          for step in result["steps"]:
              counts = step["counts"]
              assert step["status"] == "PASS" and step["exit_code"] == 0
              assert counts["terminal_status"] == "OK"
              assert counts["tests_run"] == counts["passed"] == expected[step["entry_point"]]
              assert all(counts[key] == 0 for key in (
                  "errors", "failures", "skipped", "expected_failures", "unexpected_successes"))
          PY

      - name: Resolve exact Semwright source pin
        id: pin
        run: |
          set -euo pipefail
          sha="$(python3 -c 'import json; print(json.load(open("SOURCE_LOCK.json"))["dependencies"]["semwright"]["revision"])')"
          test "${#sha}" -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: seradotcom/semwright
          ref: ${{ steps.pin.outputs.sha }}
          path: _semwright
          persist-credentials: false

      - name: Verify immutable source identities
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git -C _semwright rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"
          python3 tooling/source_policy.py

      - name: Verify v0.1 native CLI failures never expose private job receipts
        run: python3 -m unittest discover -s tooling/tests -p 'test_native_cli_failure_redaction.py' -v

      - name: Reject private MLT CI uploads and false success before native execution
        run: python3 -m unittest discover -s tooling/tests -p 'test_native_mlt_public_artifact.py' -v

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: motionwright-native-mlt-sequence-1.98.1
          cache-on-failure: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: _semwright/integrations/motion-canvas/runtime/package-lock.json

      - name: Install pinned native runtimes
        if: env.MW_MLT_SCOPE == 'normal'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bubblewrap apparmor-profiles apparmor-utils \
            melt ffmpeg libpipewire-0.3-dev pkg-config clang
          mkdir -p verification/native-mlt-sequence-e2e
          {
            melt -version | head -5
            ffmpeg -version | head -3
            ffprobe -version | head -3
            bwrap --version
          } > verification/native-mlt-sequence-e2e/native-runtime-versions.txt

      - name: Install admitted distribution versions for original G2
        if: env.MW_MLT_SCOPE != 'normal'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bubblewrap apparmor-profiles apparmor-utils \
            libmlt7=7.22.0-1build6 melt=7.22.0-1build6 \
            ffmpeg libpipewire-0.3-dev pkg-config clang
          mkdir -p verification/native-mlt-sequence-e2e
          dpkg-query -W -f='${Package} ${Version}\n' libmlt7 melt \
            > verification/native-mlt-sequence-e2e/native-runtime-versions.txt

      - name: Configure disposable-runner Driver Host sandbox
        run: |
          set -euo pipefail
          bash _semwright/scripts/dev/ci-driver-bwrap-profile.sh \
            "$GITHUB_WORKSPACE/verification/native-mlt-sequence-e2e/sandbox-profile.txt"

      - name: Install exact Motion Canvas runtime and Firefox
        working-directory: _semwright/integrations/motion-canvas/runtime
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps firefox
          npm run probe

      - name: Build exact Semwright Broker and native providers
        working-directory: _semwright
        run: |
          set -euo pipefail
          cargo build --locked -p semwright-daemon -p semwright-cli --bins
          cargo build --locked \
            -p semwright-plugin-host --bin semwright-sandbox \
            -p semwright-driver-motion-canvas --bin semwright-motion-canvas-driver \
            -p semwright-mlt-video-driver --bin semwright-mlt-video-driver \
            -p semwright-mlt-video-driver --bin semwright-mlt-runtime-runner
          test -x target/debug/semwright
          test -x target/debug/semwrightd
          test -x target/debug/semwright-sandbox
          test -x target/debug/semwright-motion-canvas-driver
          test -x target/debug/semwright-mlt-video-driver
          test -x target/debug/semwright-mlt-runtime-runner

      - name: Build Motionwright native multisegment timeline acceptance
        run: |
          set -euo pipefail
          cargo build --locked -p motionwright-native --example native-mlt-sequence-e2e
          cargo test --locked -p motionwright-native mlt_timeline -- --nocapture

      - name: Verify original-WAV staging contracts without native execution
        if: matrix.mode == 'final-mp4'
        env:
          CUSTODY_PYTHON: ${{ steps.custody_python.outputs.python }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/mw-mlt-g2-contracts-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cargo test --locked -p motionwright-native --example native-mlt-sequence-e2e \
            -- --nocapture 2>&1 | tee "$evidence/original-wav-rust.log"
          "$CUSTODY_PYTHON" -B -E -s - "$evidence/original-wav-rust.log" <<'PY'
          import re, sys
          from pathlib import Path
          log = Path(sys.argv[1]).read_text()
          rows = re.findall(
              r"(?m)^test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out;",
              log)
          assert rows == [("5", "0", "0", "0", "0")]
          PY

      - name: Build the existing Film180 producer and verify its source contracts
        if: matrix.mode == 'final-mp4'
        env:
          CUSTODY_PYTHON: ${{ steps.custody_python.outputs.python }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/mw-mlt-g2-contracts-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cargo build --locked -p motionwright-native --example native-film180-e2e
          cargo test --locked -p motionwright-native --example native-film180-e2e \
            -- --nocapture 2>&1 | tee "$evidence/film180-rust-source.log"
          "$CUSTODY_PYTHON" -B -E -s - "$evidence/film180-rust-source.log" <<'PY'
          import re, sys
          from pathlib import Path
          log = Path(sys.argv[1]).read_text()
          rows = re.findall(
              r"(?m)^test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out;",
              log)
          assert rows == [("4", "0", "0", "0", "0")]
          PY

      - name: Test redacted native observation diagnostics
        run: python3 -m unittest discover -s tooling/tests -p 'test_mlt_failure_diagnostic.py' -v

      - name: Reject silent swapped and duplicated measured stereo CI sources
        run: python3 -m unittest discover -s tooling/tests -p 'test_native_mlt_ci_audio.py' -v

      - name: Reject forged or absent decoded caption pixels before native execution
        run: python3 -m unittest discover -s tooling/tests -p 'test_native_mlt_caption_pixels.py' -v

      - name: Retain admitted original G2 source artifacts
        if: env.MW_MLT_SCOPE != 'normal'
        env:
          GH_TOKEN: ${{ github.token }}
          MW_MLT_G2_ADMISSION: ${{ inputs.g2_admission }}
          CUSTODY_PYTHON: ${{ steps.custody_python.outputs.python }}
        run: |
          set -euo pipefail
          "$CUSTODY_PYTHON" -B -E -s tooling/native_mlt_g2_custody.py prepare

      - name: Admit reviewed module once and preserve privileged originals
        if: env.MW_MLT_SCOPE != 'normal'
        env:
          CUSTODY_PYTHON: ${{ steps.custody_python.outputs.python }}
        run: |
          set -euo pipefail
          control="$RUNNER_TEMP/mw-mlt-g2-control-$GITHUB_RUN_ID-1"
          installed="$RUNNER_TEMP/mw-mlt-g2-installation-$GITHUB_RUN_ID-1"
          "$CUSTODY_PYTHON" -B -E -s tooling/native_mlt_g2_custody.py guard
          original_sha="$("$CUSTODY_PYTHON" -B -E -s - "$control/records/dispatch.json" <<'PY'
          import json, sys
          from pathlib import Path
          print(json.loads(Path(sys.argv[1]).read_bytes())["official_runtime"]["known_original_module_sha256"])
          PY
          )"
          common_env=(
            "PATH=/usr/sbin:/usr/bin:/sbin:/bin" "CI=true" "GITHUB_ACTIONS=true"
            "RUNNER_OS=Linux" "RUNNER_TEMP=$RUNNER_TEMP" "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
            "GITHUB_SHA=$GITHUB_SHA" "GITHUB_RUN_ID=$GITHUB_RUN_ID" "GITHUB_RUN_ATTEMPT=1"
            "GITHUB_EVENT_NAME=workflow_dispatch" "MW_MLT_SCOPE=$MW_MLT_SCOPE"
            "MOTIONWRIGHT_APPROVED_MLT_G2=1" "PYTHONDONTWRITEBYTECODE=1"
          )
          set +e
          sudo -n env -i "${common_env[@]}" "$CUSTODY_PYTHON" -B -E -s \
            tooling/native_mlt_runtime_admission.py \
            --original-source "$control/intake/original_c_source" \
            --repaired-source "$control/intake/repaired_c_source" \
            --compiled-module "$control/intake/compiled_module" \
            --compiled-module-sha256 c97df9c4b1d33dd6ea0ad5745501a70734f883709480622b680b8fcd512f7404 \
            --compiler-receipt "$control/intake/compiler_receipt_path" \
            --compiler-receipt-sha256 0ec0d1a8fd000c3abd32f3b50d94fb20708b6d61327b216727b7a4551b202f75 \
            --installed-original-sha256 "$original_sha" --admit \
            --new-runner-private-evidence "$installed" \
            > "$control/logs/admission.stdout" 2> "$control/logs/admission.stderr"
          admission_exit=$?
          sudo -n env -i "${common_env[@]}" "$CUSTODY_PYTHON" -B -E -s \
            tooling/native_mlt_g2_custody.py handoff --uid "$(id -u)" --gid "$(id -g)" \
            > "$control/logs/handoff.stdout" 2> "$control/logs/handoff.stderr"
          handoff_exit=$?
          set -e
          "$CUSTODY_PYTHON" -B -E -s - "$control" "$admission_exit" "$handoff_exit" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tooling")
          from ci_private_evidence import new_json
          new_json(Path(sys.argv[1]) / "records/admission-exit.json",
                   {"admission_exit_code": int(sys.argv[2]), "handoff_exit_code": int(sys.argv[3]),
                    "automatic_retry": False, "producer_executed_as_root": False})
          PY
          test "$admission_exit" -eq 0
          test "$handoff_exit" -eq 0
          "$CUSTODY_PYTHON" -B -E -s tooling/native_mlt_g2_custody.py inputs

      - name: Produce exact two-segment native FFV1 intermediary through pinned Driver Host
        env:
          CUSTODY_PYTHON: ${{ steps.custody_python.outputs.python }}
        run: |
          set -euo pipefail
          if [[ "$MW_MLT_SCOPE" = 'normal' ]]; then
            python3 tooling/native_mlt_sequence_e2e.py | tee verification/native-mlt-sequence-e2e/run.log
          else
            test "$(id -u)" -ne 0
            control="$RUNNER_TEMP/mw-mlt-g2-control-$GITHUB_RUN_ID-1"
            "$CUSTODY_PYTHON" -B -E -s tooling/native_mlt_g2_custody.py begin
            set +e
            if [[ "$MW_MLT_SCOPE" = 'film180-g2' ]]; then
              MOTIONWRIGHT_APPROVED_MLT_G2=1 MOTIONWRIGHT_APPROVED_FILM180_G2=1 \
                "$CUSTODY_PYTHON" -B -E -s tooling/native_film180_original_g2.py \
                --g2-inputs "$control/records/g2-inputs.json" \
                > "$control/logs/producer.stdout" 2> "$control/logs/producer.stderr"
              producer_exit=$?
            else
              MOTIONWRIGHT_APPROVED_MLT_G2=1 "$CUSTODY_PYTHON" -B -E -s \
                tooling/native_mlt_sequence_e2e.py --g2-inputs "$control/records/g2-inputs.json" \
                > "$control/logs/producer.stdout" 2> "$control/logs/producer.stderr"
              producer_exit=$?
            fi
            set -e
            "$CUSTODY_PYTHON" -B -E -s tooling/native_mlt_g2_custody.py exit --exit-code "$producer_exit"
            exit "$producer_exit"
          fi

      - name: Verify source- and artifact-SHA-pinned FFV1 timeline evidence
        if: env.MW_MLT_SCOPE == 'normal'
        run: |
          set -euo pipefail
          root="verification/native-mlt-sequence-e2e/$GITHUB_SHA"
          test -s "$root/result.json"
          test -s "$root/native-multisegment-timeline-evidence.json"
          if [[ "$MOTIONWRIGHT_MLT_MODE" = 'video-only' || "$MOTIONWRIGHT_MLT_MODE" = 'final-mp4' || "$MOTIONWRIGHT_MLT_MODE" = 'captioned-mp4' ]]; then
            test -s "$root/native-two-segment-video-only.mkv"
          else
            test -s "$root/native-two-segment-lossless.mkv"
          fi
          python3 - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tooling')
          from native_mlt_public_artifact import (
              SOURCE_WAV_NAME, mode_contract, read_synthetic_source_wav,
              strict_object, verify_staged_source_receipt,
          )
          mode = os.environ['MOTIONWRIGHT_MLT_MODE']
          contract = mode_contract(mode)
          root = Path("verification/native-mlt-sequence-e2e") / os.environ["GITHUB_SHA"]
          result = json.loads((root / "result.json").read_text())
          evidence = json.loads((root / "native-multisegment-timeline-evidence.json").read_text())
          assert result["native_mlt_multisegment_e2e"] == "PASS"
          assert result["motionwright_sha"] == os.environ["GITHUB_SHA"]
          assert result["assembled_video_frames"] == contract.video_frames
          assert result["rendered_source_frames"] == list(contract.source_segment_frames)
          assert result["assembled_video_codec"] == "ffv1"
          assert result["mode"] == mode
          video_only = mode in ("video-only", "final-mp4", "captioned-mp4")
          assert result["assembled_video_has_audio"] is (not video_only)
          assert result["transport_audio_codec"] == (None if video_only else "pcm_s16le")
          assert evidence["transport_pcm_audio"] is (not video_only)
          assert evidence["native_render_profile"] == ("lossless-video-only" if video_only else "lossless")
          if video_only:
              assert evidence["native_frame_count_observed"] == contract.video_frames
          assert evidence["provider_project_cleanup"] == "not_requested_requires_foreground_broker_consent"
          assert result["provider_project_cleanup"] == evidence["provider_project_cleanup"]
          inventory_file = root / "native-mlt-lifetime-inventory.json"
          inventory_bytes = inventory_file.read_bytes()
          inventory = json.loads(inventory_bytes)
          assert hashlib.sha256(inventory_bytes).hexdigest() == result["native_mlt_lifetime_inventory_sha256"]
          assert inventory["schema"] == "motionwright.v01-mlt-cleanup-inventory/1"
          assert inventory["project_id"] == result["project"]["project_id"]
          assert inventory["generation"] == result["project"]["generation"]
          assert inventory["revision"] == result["project"]["revision"]
          assert inventory["confirmed_native_creations_current_revision"] >= 1
          assert inventory["confirmed_native_creations_current_revision"] <= 4
          assert result["native_mlt_lifetime_confirmed_current_creations"] == inventory["confirmed_native_creations_current_revision"]
          assert result["native_mlt_lifetime_receipts_scanned"] == inventory["source_receipts_scanned"]
          assert inventory["unconfirmed_or_invalid_creation_requests"] == 0
          assert inventory["observed_close_request_identities"] == 0
          assert inventory["disposition"] == "project_lifetime_unverified_foreground_consent_required"
          assert inventory["complete_source_receipt_snapshot"] is True
          assert inventory["native_provider_liveness_verified"] is False
          assert inventory["foreground_cleanup_consent_obtained"] is False
          assert inventory["verified_native_project_cleanup"] is False
          assert inventory["automatic_destructive_cleanup_allowed"] is False
          assert result["native_mlt_cleanup_verified"] is False
          scope = ("actual-native-mlt-ffv1-no-audio-exact-decoded-frames-not-final-master"
                   if video_only else "actual-native-mlt-ffv1-pcm-intermediate-not-approved-sound-or-master")
          assert evidence["evidence_scope"] == result["evidence_scope"] == scope
          assert evidence["frame_count"] == contract.video_frames
          assert len(evidence["source"]["verified_video_segments"]) == len(contract.source_segment_frames)
          artifact = root / ("native-two-segment-video-only.mkv" if video_only
                             else "native-two-segment-lossless.mkv")
          assert hashlib.sha256(artifact.read_bytes()).hexdigest() == result["video_sha256"]
          assert artifact.stat().st_size == result["video_bytes"]
          if mode in ("final-mp4", "captioned-mp4"):
              assert result["final_master_frames"] == contract.video_frames
              assert result["measured_voice_pcm_frames"] == contract.pcm_frames
              assert result["final_master_video_codec"] == "h264"
              assert result["final_master_audio_codec"] == "aac"
              assert result["final_master_audio_rate"] == contract.sample_rate
              assert result["final_master_audio_channels"] == contract.channels
              assert result["decoded_stereo_content"] == "distinct_source_400hz_left_600hz_right"
              assert contract.pcm_frames <= result["decoded_master_pcm_frames"] <= contract.pcm_frames + 1024
              assert (root / "decoded-stereo-content-proof.json").is_file()
              expected_scope = (
                  "actual-native-mlt-h264-aac-native-caption-source-not-decoded-pixel-or-human-approved"
                  if mode == "captioned-mp4" else
                  "actual-native-source-bound-multisegment-h264-aac-measured-voice-not-human-approved"
              )
              assert result["final_evidence_scope"] == expected_scope
              master = root / "native-multisegment-master.mp4"
              assert master.is_file()
              assert hashlib.sha256(master.read_bytes()).hexdigest() == result["final_master_sha256"]
              assert master.stat().st_size == result["final_master_bytes"]
              source_wav = root / SOURCE_WAV_NAME
              assert source_wav.is_file()
              _, source_proof, _ = read_synthetic_source_wav(source_wav, mode)
              assert result["retained_source_audio"] == source_proof
              source_receipt = strict_object(
                  (root / "native-multisegment-av-master-evidence.json").read_bytes()
              )
              verify_staged_source_receipt(source_receipt, mode)
              if mode == "captioned-mp4":
                  proof = json.loads((root / "captioned-master-pixel-evidence.json").read_text())
                  assert proof["captioned_master_decoded_pixels"] == "PASS"
                  assert proof["motionwright_source_sha"] == os.environ["GITHUB_SHA"]
                  assert proof["human_readability"] == "NOT_RUN"
                  assert proof["commercial_release_authorized"] is False
                  assert proof["native_cue_count"] == result["captioned_source_cue_count"] == 2
                  assert set(proof["active_caption_frames"]) == {"15", "32"}
                  assert result["captioned_master_decoded_pixels"] == "PASS"
                  assert proof["original_ffv1_sha256"] == result["video_sha256"]
                  assert proof["actual_master_mp4_sha256"] == result["final_master_sha256"]
          PY

      - name: Publish only verified v0.1 MLT media, not owner/Broker receipts
        if: always() && env.MW_MLT_SCOPE == 'normal'
        env:
          NATIVE_CI_JOB_STATUS: ${{ job.status }}
        run: |
          python3 tooling/native_mlt_public_artifact.py \
            --source-sha "$GITHUB_SHA" \
            --mode "$MOTIONWRIGHT_MLT_MODE" \
            --evidence-root "verification/native-mlt-sequence-e2e/$GITHUB_SHA" \
            --output-root "verification/native-mlt-sequence-public" \
            --job-status "$NATIVE_CI_JOB_STATUS"
          python3 -m json.tool verification/native-mlt-sequence-public/public-evidence.json >/dev/null

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && env.MW_MLT_SCOPE == 'normal'
        with:
          name: motionwright-native-mlt-sequence-${{ matrix.mode }}-${{ github.sha }}
          path: verification/native-mlt-sequence-public
          if-no-files-found: error
          retention-days: 14

      - name: Seal original G2 evidence and emit closed public status
        if: always() && env.MW_MLT_SCOPE != 'normal'
        env:
          CUSTODY_PYTHON: ${{ steps.custody_python.outputs.python }}
          NATIVE_CI_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          control="$RUNNER_TEMP/mw-mlt-g2-control-$GITHUB_RUN_ID-1"
          test -n "$CUSTODY_PYTHON"
          test -f "$control/records/dispatch.json"
          "$CUSTODY_PYTHON" -B -E -s tooling/native_mlt_g2_custody.py seal \
            --job-status "$NATIVE_CI_JOB_STATUS"

      - name: Retain only authenticated ciphertext and the closed G2 projection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && env.MW_MLT_SCOPE != 'normal'
        with:
          name: ${{ env.MW_MLT_SCOPE == 'film180-g2' && 'motionwright-native-film180-g2-sealed' || 'motionwright-native-mlt-g2-sealed' }}-${{ github.sha }}-${{ github.run_id }}-1
          path: |
            ${{ runner.temp }}/mw-mlt-g2-control-${{ github.run_id }}-1/public/sealed-originals.bin
            ${{ runner.temp }}/mw-mlt-g2-control-${{ github.run_id }}-1/public/public-evidence.json
          if-no-files-found: error
          retention-days: 14

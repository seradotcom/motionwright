            wanted = {"contracts.json", "runner.stdout", "runner.stderr", "runner-exit.json"} | {f"contracts-{i:02d}-{stream}.log" for i in range(len(SUITES)) for stream in ("stdout", "stderr")}
            contract_need(set(p.name for p in report.parent.iterdir()) == wanted, "Source group full source-report original closure differs")
            before = source_state(Path.cwd(), os.environ["GITHUB_SHA"])

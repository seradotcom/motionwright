', 'stdin_readback::tests::interrupted_delivery_is_preserved_without_completion', 'stdin_readback::tests::not_observed_remains_uncertain_after_matching', 'stdin_readback::tests::observer_close_schema_and_scope_are_strict', 'stdin_readback::tests::observer_closure_does_not_erase_losses_or_discarded_captures', 'stdin_readback::tests::original_reader_keeps_private_mode_and_single_link_requirements', 'stdin_readback::tests::original_reader_preserves_private_bytes_empty_presence_and_the_bound', 'stdin_readback::tests::original_reader_rejects_fifo_replacement_without_a_writer', 'stdin_readback::tests::original_reader_rejects_replaced_regular_and_symlink_after_metadata', 'stdin_readback::tests::provider_process_transition_is_not_same_owner_lifetime', 'stdin_readback::tests::publication_waits_for_delayed_original_terminal_without_upgrading_its_state', 'stdin_readback::tests::selected_capture_joins_original_parent_session_and_bytes', 'stdin_readback::tests::terminal_unknown_duplicate_missing_or_extra_fields_are_rejected', 'stdin_readback::tests::unavailable_terminal_formats_remain_distinct', 'tests::changed_saved_source_intent_or_caption_boundaries_fail_before_native_dispatch', 'tests::editable_second_revision_uses_distinct_native_identity_and_requires_original_result', 'tests::original_av_requires_single_bounded_source_wav_and_exact_digest', 'tests::six_second_saved_source_reopens_and_retains_original_clock']

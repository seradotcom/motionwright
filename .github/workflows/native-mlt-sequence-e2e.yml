              contract_need(stat.S_IMODE(mark.st_mode) == (0o700 if directory else 0o600),
                       "Source group source-report must already be private; no retroactive chmod")
              return mark


          def contract_original(path):
              before = contract_private(path)
              raw = Path(path).read_bytes()
              after = contract_private(path)
              keys = ("st_dev", "st_ino", "st_mode", "st_uid", "st_gid", "st_nlink", "st_size", "st_mtime_ns", "st_ctime_ns")
              contract_need(before.st_nlink == 1 and tuple(getattr(before, k) for k in keys) == tuple(getattr(after, k) for k in keys)
                       and len(raw) == before.st_size, "Source group original changed/aliased during readback")
              return raw


          def contract_json(raw):
              def pairs(rows):
                  result = {}
                  for key, value in rows:
                      contract_need(key not in result, "Source group duplicate JSON key")
                      result[key] = value
                  return result
              return json.loads(raw, object_pairs_hook=pairs,
                                parse_constant=lambda _: contract_need(False, "Source group nonfinite JSON"))


          def contract_roster(raw, path, count, expected_sha):
              tree = ast.parse(raw, filename=path)
              contract_need(not any(isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name == "load_tests"
                               for n in ast.walk(tree)), "Unreviewed dynamic Source group discovery")
              names, classes, actual_descriptions = [], [], {}
              for cls in tree.body:
                  if not isinstance(cls, ast.ClassDef):
                      continue
                  methods = [n.name for n in cls.body if isinstance(n, ast.FunctionDef) and n.name.startswith("test_")]
                  if methods:
                      contract_need([ast.unparse(base) for base in cls.bases] == ["unittest.TestCase"]
                               and cls.name not in classes and len(methods) == len(set(methods)), "Source group class/method roster changed")
                      classes.append(cls.name)
                      names.extend(cls.name + "." + name for name in methods)
                      for method in cls.body:
                          if isinstance(method, ast.FunctionDef) and method.name in methods:
                              description = ast.get_docstring(method)
                              if description:
                                  actual_descriptions[cls.name + "." + method.name] = description.strip().splitlines()[0].strip()
              names.sort()
              contract_need(len(names) == len(set(names)) == count
                       and contract_sha(("\n".join(names) + "\n").encode()) == expected_sha, "Source group nominal source roster requires review")
              contract_need(actual_descriptions == DESCRIPTIONS.get(path, {}),
                       "Source group nominal source descriptions require review")
              return names


          def contract_nominal(raw, expected, descriptions):
              text = raw.decode("utf-8", "strict").replace("\r\n", "\n")
              contract_need(not any(c in text for c in ("\r", "\x00", "\v", "\f", "\x85", "\u2028", "\u2029")),
                       "Source group noncanonical line separator")
              contract_need(type(descriptions) is dict and set(descriptions) <= set(expected)
                       and all(type(value) is str and value and not any(c in value for c in "\r\n")
                               for value in descriptions.values()), "Source group description scope differs")
              footer = re.search(r"\n-{70}\nRan ([0-9]+) tests? in [0-9]+(?:\.[0-9]+)?s\n\nOK\n\Z", text)
              contract_need(footer is not None and footer.group(1) == str(len(expected)), "Source group incomplete/failed unittest footer")
              body = text[:footer.start()]
              contract_need(body.endswith("\n"), "Source group terminal/footer separation")
              observed = []
              lines = body[:-1].split("\n")
              index = 0
              diagnostic = "MLT G2 secondary evidence failure; native outcome retained."
              diagnostic_modules = (".test_native_mlt_g2_observation.", ".test_native_mlt_live_observer_diagnostics.",
                                    ".test_native_film180_original_g2.")
              while index < len(lines):
                  match = re.fullmatch(r"(test_[A-Za-z0-9_]+) \(([A-Za-z_][A-Za-z0-9_.]*)\)(?: \.\.\. (.*))?", lines[index])
                  contract_need(match is not None, "Source group foreign/omitted/unreviewed nominal outcome")
                  method, identity, terminal = match.groups()
                  identity = identity if identity.rsplit(".", 1)[-1] == method else identity + "." + method

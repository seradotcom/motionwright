            "RUNNER_OS=Linux" "RUNNER_TEMP=$RUNNER_TEMP" "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
            "GITHUB_SHA=$GITHUB_SHA" "GITHUB_RUN_ID=$GITHUB_RUN_ID" "GITHUB_RUN_ATTEMPT=1"
            "GITHUB_EVENT_NAME=workflow_dispatch" "MW_MLT_SCOPE=$MW_MLT_SCOPE"
            "MOTIONWRIGHT_APPROVED_MLT_G2=1" "PYTHONDONTWRITEBYTECODE=1"
          )
          set +e
          sudo -n env -i "${common_env[@]}" "$CUSTODY_PYTHON" -B -E -s \
            tooling/native_mlt_runtime_admission.py \
            --original-source "$control/intake/original_c_source" \
            --repaired-source "$control/intake/repaired_c_source" \
            --compiled-module "$control/intake/compiled_module" \
            --compiled-module-sha256 e0d32f13536d568762be4b426edf9dce11602a3ec0eea4bc334d5346316b515a \
            --compiler-receipt "$control/intake/compiler_receipt_path" \
            --compiler-receipt-sha256 cefa3ed54d02eaf894245248c07a39439489566d56a94b7f356748eba63cb2e8 \
            --installed-original-sha256 "$original_sha" --admit \
            --new-runner-private-evidence "$installed" \
            > "$control/logs/admission.stdout" 2> "$control/logs/admission.stderr"
          admission_exit=$?
          sudo -n env -i "${common_env[@]}" "$CUSTODY_PYTHON" -B -E -s \
            tooling/native_mlt_g2_custody.py handoff --uid "$(id -u)" --gid "$(id -g)" \
            > "$control/logs/handoff.stdout" 2> "$control/logs/handoff.stderr"
          handoff_exit=$?
          set -e
          "$CUSTODY_PYTHON" -B -E -s - "$control" "$admission_exit" "$handoff_exit" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tooling")
          from ci_private_evidence import new_json
          new_json(Path(sys.argv[1]) / "records/admission-exit.json",
                   {"admission_exit_code": int(sys.argv[2]), "handoff_exit_code": int(sys.argv[3]),
                    "automatic_retry": False, "producer_executed_as_root": False})
          PY
          test "$admission_exit" -eq 0
          test "$handoff_exit" -eq 0
          "$CUSTODY_PYTHON" -B -E -s tooling/native_mlt_g2_custody.py inputs

      - name: Produce exact two-segment native FFV1 intermediary through pinned Driver Host
        id: g2_production
        env:
          CUSTODY_PYTHON: ${{ steps.custody_python.outputs.python }}
        run: |
          set -euo pipefail
          if [[ "$MW_MLT_SCOPE" = 'normal' ]]; then
            python3 tooling/native_mlt_sequence_e2e.py | tee verification/native-mlt-sequence-e2e/run.log
          else
            test "$(id -u)" -ne 0
            control="$RUNNER_TEMP/mw-mlt-g2-control-$GITHUB_RUN_ID-1"
            "$CUSTODY_PYTHON" -B -E -s tooling/native_mlt_g2_custody.py begin
            set +e
            if [[ "$MW_MLT_SCOPE" = 'film180-g2' ]]; then
              MOTIONWRIGHT_APPROVED_MLT_G2=1 MOTIONWRIGHT_APPROVED_FILM180_G2=1 \
                "$CUSTODY_PYTHON" -B -E -s tooling/native_film180_original_g2.py \
                --g2-inputs "$control/records/g2-inputs.json" \
                > "$control/logs/producer.stdout" 2> "$control/logs/producer.stderr"
              producer_exit=$?
            else
              MOTIONWRIGHT_APPROVED_MLT_G2=1 "$CUSTODY_PYTHON" -B -E -s \
                tooling/native_mlt_sequence_e2e.py --g2-inputs "$control/records/g2-inputs.json" \
                > "$control/logs/producer.stdout" 2> "$control/logs/producer.stderr"
              producer_exit=$?
            fi
            set -e
            "$CUSTODY_PYTHON" -B -E -s tooling/native_mlt_g2_custody.py exit --exit-code "$producer_exit"
            exit "$producer_exit"
          fi

      - name: Verify source- and artifact-SHA-pinned FFV1 timeline evidence
        if: env.MW_MLT_SCOPE == 'normal'
        run: |
          set -euo pipefail
          root="verification/native-mlt-sequence-e2e/$GITHUB_SHA"
          test -s "$root/result.json"
          test -s "$root/native-multisegment-timeline-evidence.json"
          if [[ "$MOTIONWRIGHT_MLT_MODE" = 'video-only' || "$MOTIONWRIGHT_MLT_MODE" = 'final-mp4' || "$MOTIONWRIGHT_MLT_MODE" = 'captioned-mp4' ]]; then
            test -s "$root/native-two-segment-video-only.mkv"
          else
            test -s "$root/native-two-segment-lossless.mkv"
          fi
          python3 - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tooling')
          from native_mlt_public_artifact import (
              SOURCE_WAV_NAME, mode_contract, read_synthetic_source_wav,
              strict_object, verify_staged_source_receipt,
          )
          mode = os.environ['MOTIONWRIGHT_MLT_MODE']
          contract = mode_contract(mode)
          root = Path("verification/native-mlt-sequence-e2e") / os.environ["GITHUB_SHA"]
          result = json.loads((root / "result.json").read_text())
          evidence = json.loads((root / "native-multisegment-timeline-evidence.json").read_text())
          assert result["native_mlt_multisegment_e2e"] == "PASS"
          assert result["motionwright_sha"] == os.environ["GITHUB_SHA"]
          assert result["assembled_video_frames"] == contract.video_frames
          assert result["rendered_source_frames"] == list(contract.source_segment_frames)
          assert result["assembled_video_codec"] == "ffv1"
          assert result["mode"] == mode
          video_only = mode in ("video-only", "final-mp4", "captioned-mp4")
          assert result["assembled_video_has_audio"] is (not video_only)
          assert result["transport_audio_codec"] == (None if video_only else "pcm_s16le")
          assert evidence["transport_pcm_audio"] is (not video_only)
          assert evidence["native_render_profile"] == ("lossless-video-only" if video_only else "lossless")
          if video_only:
              assert evidence["native_frame_count_observed"] == contract.video_frames
          assert evidence["provider_project_cleanup"] == "not_requested_requires_foreground_broker_consent"
          assert result["provider_project_cleanup"] == evidence["provider_project_cleanup"]
          inventory_file = root / "native-mlt-lifetime-inventory.json"
          inventory_bytes = inventory_file.read_bytes()
          inventory = json.loads(inventory_bytes)
          assert hashlib.sha256(inventory_bytes).hexdigest() == result["native_mlt_lifetime_inventory_sha256"]
          assert inventory["schema"] == "motionwright.v01-mlt-cleanup-inventory/1"
          assert inventory["project_id"] == result["project"]["project_id"]
          assert inventory["generation"] == result["project"]["generation"]
          assert inventory["revision"] == result["project"]["revision"]
          assert inventory["confirmed_native_creations_current_revision"] >= 1
          assert inventory["confirmed_native_creations_current_revision"] <= 4
          assert result["native_mlt_lifetime_confirmed_current_creations"] == inventory["confirmed_native_creations_current_revision"]
          assert result["native_mlt_lifetime_receipts_scanned"] == inventory["source_receipts_scanned"]
          assert inventory["unconfirmed_or_invalid_creation_requests"] == 0
          assert inventory["observed_close_request_identities"] == 0
          assert inventory["disposition"] == "project_lifetime_unverified_foreground_consent_required"
          assert inventory["complete_source_receipt_snapshot"] is True
          assert inventory["native_provider_liveness_verified"] is False
          assert inventory["foreground_cleanup_consent_obtained"] is False
          assert inventory["verified_native_project_cleanup"] is False
          assert inventory["automatic_destructive_cleanup_allowed"] is False
          assert result["native_mlt_cleanup_verified"] is False
          scope = ("actual-native-mlt-ffv1-no-audio-exact-decoded-frames-not-final-master"
                   if video_only else "actual-native-mlt-ffv1-pcm-intermediate-not-approved-sound-or-master")
          assert evidence["evidence_scope"] == result["evidence_scope"] == scope
          assert evidence["frame_count"] == contract.video_frames
          assert len(evidence["source"]["verified_video_segments"]) == len(contract.source_segment_frames)
          artifact = root / ("native-two-segment-video-only.mkv" if video_only
                             else "native-two-segment-lossless.mkv")
          assert hashlib.sha256(artifact.read_bytes()).hexdigest() == result["video_sha256"]
          assert artifact.stat().st_size == result["video_bytes"]
          if mode in ("final-mp4", "captioned-mp4"):
              assert result["final_master_frames"] == contract.video_frames
              assert result["measured_voice_pcm_frames"] == contract.pcm_frames
              assert result["final_master_video_codec"] == "h264"
              assert result["final_master_audio_codec"] == "aac"
              assert result["final_master_audio_rate"] == contract.sample_rate
              assert result["final_master_audio_channels"] == contract.channels
              assert result["decoded_stereo_content"] == "distinct_source_400hz_left_600hz_right"
              assert contract.pcm_frames <= result["decoded_master_pcm_frames"] <= contract.pcm_frames + 1024
              assert (root / "decoded-stereo-content-proof.json").is_file()
              expected_scope = (
                  "actual-native-mlt-h264-aac-native-caption-source-not-decoded-pixel-or-human-approved"
                  if mode == "captioned-mp4" else
                  "actual-native-source-bound-multisegment-h264-aac-measured-voice-not-human-approved"
              )
              assert result["final_evidence_scope"] == expected_scope
              master = root / "native-multisegment-master.mp4"
              assert master.is_file()
              assert hashlib.sha256(master.read_bytes()).hexdigest() == result["final_master_sha256"]
              assert master.stat().st_size == result["final_master_bytes"]
              source_wav = root / SOURCE_WAV_NAME
              assert source_wav.is_file()
              _, source_proof, _ = read_synthetic_source_wav(source_wav, mode)
              assert result["retained_source_audio"] == source_proof
              source_receipt = strict_object(
                  (root / "native-multisegment-av-master-evidence.json").read_bytes()
              )
              verify_staged_source_receipt(source_receipt, mode)
              if mode == "captioned-mp4":
                  proof = json.loads((root / "captioned-master-pixel-evidence.json").read_text())
                  assert proof["captioned_master_decoded_pixels"] == "PASS"
                  assert proof["motionwright_source_sha"] == os.environ["GITHUB_SHA"]
                  assert proof["human_readability"] == "NOT_RUN"
                  assert proof["commercial_release_authorized"] is False
                  assert proof["native_cue_count"] == result["captioned_source_cue_count"] == 2
                  assert set(proof["active_caption_frames"]) == {"15", "32"}
                  assert result["captioned_master_decoded_pixels"] == "PASS"
                  assert proof["original_ffv1_sha256"] == result["video_sha256"]
                  assert proof["actual_master_mp4_sha256"] == result["final_master_sha256"]
          PY

      - name: Publish only verified v0.1 MLT media, not owner/Broker receipts
        if: always() && env.MW_MLT_SCOPE == 'normal'
        env:
          NATIVE_CI_JOB_STATUS: ${{ job.status }}
        run: |
          python3 tooling/native_mlt_public_artifact.py \
            --source-sha "$GITHUB_SHA" \
            --mode "$MOTIONWRIGHT_MLT_MODE" \
            --evidence-root "verification/native-mlt-sequence-e2e/$GITHUB_SHA" \
            --output-root "verification/native-mlt-sequence-public" \
            --job-status "$NATIVE_CI_JOB_STATUS"
          python3 -m json.tool verification/native-mlt-sequence-public/public-evidence.json >/dev/null

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && env.MW_MLT_SCOPE == 'normal'
        with:
          name: motionwright-native-mlt-sequence-${{ matrix.mode }}-${{ github.sha }}
          path: verification/native-mlt-sequence-public
          if-no-files-found: error
          retention-days: 14

      - name: Seal preflight source originals independently of native preparation
        id: g2_preflight_finish
        if: always() && env.MW_MLT_SCOPE != 'normal'
        env:
          CUSTODY_PYTHON: ${{ steps.custody_python.outputs.python }}
          P1_COMMON_OUTCOME: ${{ steps.g2_common_contracts.outcome }}
          P1_FILM_OUTCOME: ${{ steps.g2_film_contracts.outcome }}
          P1_PUBLICATION_OUTCOME: ${{ steps.g2_publication_contracts.outcome }}
          P1_PREPARE_OUTCOME: ${{ steps.g2_prepare.outcome }}
          P1_ADMISSION_OUTCOME: ${{ steps.g2_admission.outcome }}
          P1_PRODUCER_OUTCOME: ${{ steps.g2_production.outcome }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$CUSTODY_PYTHON"
          "$CUSTODY_PYTHON" -B -E -s - finish <<'PY'
          # BEGIN A6_MLT_PREFLIGHT_CUSTODY
          import json
          import os
          from pathlib import Path
          import stat
          import sys


          def p1_need(value, reason):
              if not value:
                  raise ValueError(reason)


          def p1_exists(path):
              try:
                  path.lstat()
              except FileNotFoundError:
                  return False
              return True


          def p1_private(path, directory):
              info = path.lstat()
              p1_need(path.is_absolute() and path.resolve(strict=True) == path
                      and not any(item.is_symlink() for item in path.parents), "preflight noncanonical path")
              p1_need((stat.S_ISDIR(info.st_mode) if directory else stat.S_ISREG(info.st_mode))
                      and stat.S_IMODE(info.st_mode) == (0o700 if directory else 0o600)
                      and info.st_uid == os.geteuid()
                      and (directory or info.st_nlink == 1), "preflight private original permissions")


          def p1_locations(env, native):
              current = native.context(env)
              base = native.runner_root(env)
              suffix = current["run_id"] + "-" + current["run_attempt"]
              root = base / ("mw-mlt-preflight-custody-" + suffix)
              common = base / ("mw-mlt-g2-contracts-" + suffix)
              film = base / ("mw-film180-contracts-" + suffix)
              workflow = base / ("mw-mlt-workflow-contracts-" + suffix)
              control, installed, session = native.names(env)
              return current, root, common, film, workflow, control, installed, session


          def p1_observed_outcomes(env):
              keys = ("P1_COMMON_OUTCOME", "P1_FILM_OUTCOME", "P1_PUBLICATION_OUTCOME",
                      "P1_PREPARE_OUTCOME", "P1_ADMISSION_OUTCOME", "P1_PRODUCER_OUTCOME")
              return {key: env.get(key, "") for key in keys}


          def p1_native_terminal(outcomes, initial_absence, installed_present, session_present, producer_marker_present):
              # Absence at the final read alone cannot undo an observed invocation.
              no_effect = (initial_absence is True
                           and outcomes.get("P1_ADMISSION_OUTCOME") == "skipped"
                           and outcomes.get("P1_PRODUCER_OUTCOME") == "skipped"
                           and installed_present is False and session_present is False
                           and producer_marker_present is False)
              return "NOT_STARTED" if no_effect else "ERROR_OR_UNKNOWN"


          def p1_report_names(label):
              count = {"common": 12, "film": 3, "workflow": 1}[label]
              names = {"contracts.json", "contracts-admission.json", "runner.stdout", "runner.stderr", "runner-exit.json"}
              names |= {f"contracts-{index:02d}-{stream}.log" for index in range(count) for stream in ("stdout", "stderr")}
              if label == "common":
                  names |= {"publication-binding.json", "original-wav-rust.log", "film180-rust-source.log", "film180-rust-source.receipt.json", "film180-rust-source.discovery.log", "film180-rust-source.discovery.receipt.json"}
                  names |= {f"publication-binding-{index:02d}-{stream}.log" for index in range(2) for stream in ("stdout", "stderr")}
              return names


          def p1_copy_reports(root, original_roots, custody):
              # Only the source-owned flat receipt/log inventory is copied. Unknown
              # neighboring files and subdirectories are never opened or encrypted.
              captured_roots, observations, errors = {}, [], []
              target = root / "source-report-snapshot"
              target.mkdir(mode=0o700)
              for label, directory in original_roots.items():
                  output = target / label
                  output.mkdir(mode=0o700)
                  captured_roots[label] = output
                  if not p1_exists(directory):
                      errors.append({"label": label, "status": "ORIGINAL_ROOT_ABSENT", "automatic_retry": False})
                      continue
                  try:
                      p1_private(directory, True)
                      inventory = sorted(path.name for path in directory.iterdir())
                      missing = sorted({"contracts.json", "runner.stdout", "runner.stderr", "runner-exit.json"} - set(inventory))
                      if missing:
                          errors.append({"label": label, "status": "SOURCE_REPORT_RECORDS_ABSENT", "names": missing})
                      unknown = sorted(set(inventory) - p1_report_names(label))
                      if unknown:
                          errors.append({"label": label, "status": "UNSELECTED_NEIGHBORS_NOT_CAPTURED", "names": unknown})
                      for name in sorted(set(inventory) & p1_report_names(label)):
                          path = directory / name
                          try:
                              p1_private(path, False)
                              before = custody.metadata_identity(path.lstat())
                              raw, observation = custody.regular(path)
                              custody.new_bytes(output / name, raw)
                              p1_need(custody.metadata_identity(path.lstat()) == before, "source original changed during copy")
                              observations.append({"root": label, "relative_path": name, "original": observation,
                                                   "copied_sha256": custody.sha(raw), "copied_bytes": len(raw)})
                          except Exception as error:
                              errors.append({"label": label, "name": name, "type": type(error).__name__,
                                             "message": str(error), "original_not_modified_by_capture": True, "automatic_retry": False})
                      p1_need(inventory == sorted(path.name for path in directory.iterdir()), "source report inventory changed")
                  except Exception as error:
                      errors.append({"label": label, "type": type(error).__name__, "message": str(error),
                                     "original_not_modified_by_capture": True, "automatic_retry": False})
              return captured_roots, observations, errors


          def p1_initialize(env, custody, native, source_state):
              current, root, common, film, workflow, control, installed, session = p1_locations(env, native)
              raw = env.get("MW_MLT_G2_ADMISSION", "").encode("utf-8")
              dispatch = native.validate_dispatch(raw, current, scenario=env["MW_MLT_SCOPE"])
              custody.public_key(dispatch["recipient"])
              checkout = Path(env["GITHUB_WORKSPACE"])
              state = source_state(checkout, current["source_sha"])
              physical = native.source_guard(checkout, current, scenario=env["MW_MLT_SCOPE"])
              for path in (root, common, film, workflow, control, installed, session):
                  p1_need(not p1_exists(path), "preflight namespace is not fresh")
              # Everything above is validation/read-only. This does not call prepare,
              # intake, runtime admission, a producer, or a renderer.
              root.mkdir(mode=0o700)
              for name in ("records", "public"):
                  (root / name).mkdir(mode=0o700)
              custody.new_bytes(root / "records/dispatch.original.json", raw)
              custody.new_json(root / "records/source-before.json", {"git": state, "physical": physical})
              custody.new_json(root / "records/initial.json", {
                  "schema": "motionwright.native.mlt-preflight-initial/1", "context": current,
                  "github_job": env["GITHUB_JOB"], "scope": env["MW_MLT_SCOPE"],
                  "effect_namespaces_initially_absent": True, "dispatch_input_sha256": custody.sha(raw),
                  "admission_granted": False, "native_effect_started": False, "automatic_retry": False})
              for directory in (root, root / "records", root / "public"):
                  p1_private(directory, True)
              return root


          def p1_finish(env, custody, native, source_state):
              current, root, common, film, workflow, control, installed, session = p1_locations(env, native)
              p1_private(root, True)
              p1_private(root / "records", True)
              p1_private(root / "public", True)
              p1_need(not any((root / "public").iterdir()), "preflight public output is not fresh")
              initial_raw = custody.regular(root / "records/initial.json", custody.MAX_JSON)[0]
              before_raw = custody.regular(root / "records/source-before.json", custody.MAX_JSON)[0]
              dispatch_raw = custody.regular(root / "records/dispatch.original.json", custody.MAX_JSON)[0]
              initial = custody.strict(initial_raw)
              p1_need(initial.get("schema") == "motionwright.native.mlt-preflight-initial/1"
                      and initial.get("context") == current and initial.get("github_job") == env["GITHUB_JOB"]
                      and initial.get("scope") == env["MW_MLT_SCOPE"]
                      and initial.get("effect_namespaces_initially_absent") is True
                      and initial.get("dispatch_input_sha256") == custody.sha(dispatch_raw)
                      and initial.get("admission_granted") is False
                      and initial.get("native_effect_started") is False
                      and initial.get("automatic_retry") is False, "preflight initial binding differs")
              dispatch = native.validate_dispatch(dispatch_raw, current, scenario=env["MW_MLT_SCOPE"])
              custody.public_key(dispatch["recipient"])
              outcomes = p1_observed_outcomes(env)
              effect_observations = {}
              for label, path in (("installation", installed), ("session", session),
                                  ("producer-marker", control / "records/producer-started.json")):
                  try:
                      effect_observations[label] = {"present": p1_exists(path)}
                  except OSError as error:
                      effect_observations[label] = {"present": None, "type": type(error).__name__, "message": str(error)}
              terminal = p1_native_terminal(outcomes, initial["effect_namespaces_initially_absent"],
                  effect_observations["installation"]["present"], effect_observations["session"]["present"],
                  effect_observations["producer-marker"]["present"])
              source_unchanged, source_error = False, None
              try:
                  checkout = Path(env["GITHUB_WORKSPACE"])
                  # Each canonical source test already performs its strict complete-input
                  # postcheck immediately, before SDK checkout/build. At this later phase
                  # the existing native job has legitimately created _semwright/target.
                  # Preserve the native physical source-binding guard; do not weaken the
                  # canonical runner or claim this is another empty-input source epoch.
                  after = {"physical": native.source_guard(checkout, current, scenario=env["MW_MLT_SCOPE"]),
                           "scope": "Existing native source_guard: exact HEAD/tree, tracked changes and selected physical files",
                           "strict_full_input_preflight_postchecks": "retained in original canonical unittest receipts",
                           "full_checkout_input_postcheck_at_final_seal": False}
                  custody.new_json(root / "records/source-after.json", after)
                  source_unchanged = (custody.json_bytes(custody.strict(before_raw)["physical"])
                                      == custody.json_bytes(after["physical"]))
              except Exception as error:
                  # The original failure and all available source reports remain private.
                  source_error = {"type": type(error).__name__, "message": str(error), "automatic_retry": False}
              native_dispatch_valid = False
              dispatch_error = None
              try:
                  native_raw, native_observation = custody.regular(control / "records/dispatch.json", custody.MAX_JSON)
                  custody.new_bytes(root / "records/native-dispatch-observed.json", native_raw)
                  custody.new_json(root / "records/native-dispatch-observation.json", native_observation)
                  actual = native.validate_dispatch(native_raw, current, scenario=env["MW_MLT_SCOPE"])
                  p1_need(custody.json_bytes(actual) == custody.json_bytes(dispatch), "native dispatch differs from original preflight input")
                  native_dispatch_valid = True
              except Exception as error:
                  dispatch_error = {"type": type(error).__name__, "message": str(error), "automatic_retry": False}
              custody.new_json(root / "records/finish.json", {
                  "schema": "motionwright.native.mlt-preflight-finish/1", "context": current,
                  "github_job": env["GITHUB_JOB"], "outcomes": outcomes, "native_terminal": terminal,
                  "effect_observations": effect_observations,
                  "native_dispatch_valid": native_dispatch_valid, "native_dispatch_error": dispatch_error,
                  "selected_source_bindings_unchanged": source_unchanged, "source_error": source_error,
                  "native_originals_modified_by_preflight": False, "native_originals_claimed_in_this_capsule": False,
                  "automatic_retry": False})
              # A new exclusive intent makes capture/encryption one-shot, even after a
              # partial exception. This phase never reruns tests or native operations.
              custody.new_json(root / "records/seal-intent.json", {"context": current, "automatic_retry": False})
              copies, observations, private_errors = p1_copy_reports(root, {"common": common, "film": film, "workflow": workflow}, custody)
              roots = {"records": root / "records", **copies}
              custody.new_json(root / "records/source-report-capture.json", {
                  "observed_originals": observations, "errors": private_errors,
                  "scope": "Only named source report/log files; unknown neighbors are not captured",
                  "automatic_retry": False})
              plaintext, captured = custody.gather_snapshot(roots, preserve_partial=True)
              encrypted = custody.encrypt_snapshot(plaintext, dispatch["recipient"], current)
              public = {
                  "schema": "motionwright.native.mlt-preflight-public/1", "context": current,
                  "github_job": env["GITHUB_JOB"], "scope": "source-preflight-originals-only",
                  "status": "SOURCE_ORIGINALS_SEALED" if captured and not private_errors else "PARTIAL_SOURCE_ORIGINALS_SEALED",
                  "selected_source_bindings_unchanged": source_unchanged,
                  "full_checkout_input_postcheck_at_final_seal": False,
                  "captured_source_originals_complete": captured and not private_errors,
                  "native_terminal": terminal, "native_dispatch_valid": native_dispatch_valid,
                  "sealed_originals_sha256": custody.sha(encrypted), "sealed_originals_bytes": len(encrypted),
                  "recipient_spki_sha256": dispatch["recipient"]["sha256"],
                  "native_originals_claimed": False, "source_test_pass_claimed": False,
                  "admission_granted": False, "native_operation_retried": False,
                  "physical_AV_master_acceptance": False, "human_acceptance": False, "release_authorized": False}
              custody.new_bytes(root / "public/sealed-source-originals.bin", encrypted)
              custody.new_json(root / "public/source-public-evidence.json", public)
              p1_need({path.name for path in (root / "public").iterdir()}
                      == {"sealed-source-originals.bin", "source-public-evidence.json"}, "preflight public closure differs")
              complete = captured and not private_errors and source_unchanged
              return public, 0 if complete and native_dispatch_valid else 2


          def p1_main():
              sys.path.insert(0, str(Path.cwd() / "tooling"))
              import ci_private_evidence as custody
              import native_mlt_g2_custody as native
              from ci_test_runner import source_state
              p1_need(len(sys.argv) == 2 and sys.argv[1] in {"initialize", "finish"}, "preflight action")
              if sys.argv[1] == "initialize":
                  p1_initialize(os.environ, custody, native, source_state)
                  return 0
              public, code = p1_finish(os.environ, custody, native, source_state)
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8", newline="\n") as handle:
                  handle.write("native_dispatch=" + ("true" if public["native_dispatch_valid"] else "false") + "\n")
              return code


          if __name__ == "__main__":
              raise SystemExit(p1_main())
          # END A6_MLT_PREFLIGHT_CUSTODY
          PY

      - name: Seal original G2 evidence and emit closed public status
        id: g2_native_seal
        if: always() && env.MW_MLT_SCOPE != 'normal'
        env:
          CUSTODY_PYTHON: ${{ steps.custody_python.outputs.python }}
          NATIVE_CI_JOB_STATUS: ${{ job.status }}
          MW_MLT_G2_ADMISSION: ${{ inputs.g2_admission }}
        run: |
          set -euo pipefail
          control="$RUNNER_TEMP/mw-mlt-g2-control-$GITHUB_RUN_ID-1"
          test -n "$CUSTODY_PYTHON"
          test -f "$control/records/dispatch.json"
          "$CUSTODY_PYTHON" -B -E -s - "$control/records/dispatch.json" <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, "tooling")
          import native_mlt_g2_custody as custody
          current = custody.context(os.environ)
          scenario = os.environ["MW_MLT_SCOPE"]
          expected = custody.validate_dispatch(os.environ["MW_MLT_G2_ADMISSION"].encode(), current, scenario=scenario)
          actual = custody.validate_dispatch(custody.regular(Path(sys.argv[1]), custody.MAX_JSON)[0], current, scenario=scenario)
          custody.require(custody.json_bytes(actual) == custody.json_bytes(expected), "original_dispatch_input_changed")
          PY
          echo "native_dispatch=true" >> "$GITHUB_OUTPUT"
          "$CUSTODY_PYTHON" -B -E -s tooling/native_mlt_g2_custody.py seal \
            --job-status "$NATIVE_CI_JOB_STATUS"

      - name: Retain only authenticated ciphertext and the closed G2 projection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && env.MW_MLT_SCOPE != 'normal' && steps.g2_native_seal.outputs.native_dispatch == 'true'
        with:
          name: ${{ env.MW_MLT_SCOPE == 'film180-g2' && 'motionwright-native-film180-g2-sealed' || 'motionwright-native-mlt-g2-sealed' }}-${{ github.sha }}-${{ github.run_id }}-1
          path: |
            ${{ runner.temp }}/mw-mlt-g2-control-${{ github.run_id }}-1/public/sealed-originals.bin
            ${{ runner.temp }}/mw-mlt-g2-control-${{ github.run_id }}-1/public/public-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Retain the separate encrypted source-preflight capsule
        if: always() && env.MW_MLT_SCOPE != 'normal'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: motionwright-mlt-preflight-sealed-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mw-mlt-preflight-custody-${{ github.run_id }}-${{ github.run_attempt }}/public/sealed-source-originals.bin
            ${{ runner.temp }}/mw-mlt-preflight-custody-${{ github.run_id }}-${{ github.run_attempt }}/public/source-public-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Retain normal-profile source originals without native receipts
        if: always() && env.MW_MLT_SCOPE == 'normal' && matrix.mode != 'pcm' && matrix.mode != 'video-only'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: motionwright-mlt-preflight-source-${{ matrix.mode }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mw-mlt-g2-contracts-${{ github.run_id }}-${{ github.run_attempt }}
            ${{ runner.temp }}/mw-film180-contracts-${{ github.run_id }}-${{ github.run_attempt }}
            ${{ runner.temp }}/mw-mlt-workflow-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14

  fixedtxt-original-owner:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'fixedtxt-v4-one-fixture' && inputs.fixedtxt_mode == 'prepare' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(inputs.fixedtxt_request || '{"attempt_minutes":1}').attempt_minutes }}
    env:
      MW_MLT_SCOPE: fixedtxt-v4-one-fixture
      MOTIONWRIGHT_APPROVED_MLT_G2: '1'
      CI: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Retain the one original clock before checkout and preparation
        id: fixedtxt_clock
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          MW_FIXEDTXT_REQUEST: ${{ inputs.fixedtxt_request }}
          MW_FIXEDTXT_BOOTSTRAP: ${{ inputs.g2_admission }}
          MW_FIXEDTXT_DELIVERY: ${{ inputs.fixedtxt_delivery }}
        run: |
          set -euo pipefail
          umask 077
          python3 -B - <<'PY_CLOCK'
          import hashlib, json, math, os, re, time
          from pathlib import Path
          start = time.monotonic()
          class WorkflowRejected(ValueError):
              pass

          def need(value, reason):
              if not value:
                  raise WorkflowRejected(reason)

          def preflight_request_capacity(value, *, source_zip_bytes=0):
              """Reject an already impossible declaration before checkout/install effects.

              This pure subset also runs in the inline bootstrap. Its closed role counts
              are compared with the existing R28 selector after checkout. Unknown future
              originals are still checked by the unchanged final plan validator.
              """
              fixture = value["fixture"]
              counts_by_fixture = {
                  "fixed-causal": 4, "flow-control-base": 3, "flow-control-with-fixed": 3,
                  "flow-text-control": 4, "fixed-multirun": 4, "fixed-multirun-control": 4,
                  "fixed-transform-clip": 3, "fixed-camera-scene": 4, "fixed-counter-captions": 7,
                  "fixed-layer-behind": 4, "fixed-layer-equal": 4, "fixed-layer-front": 4,
              }
              need(type(fixture) is str and fixture in counts_by_fixture, "fixedtxt-capacity-closed-fixture")
              once = (
                  "authored-film", "canvas-observations", "case-final-custody", "case-inputs",
                  "compile-component", "compiled-project", "cycle-inputs", "cycle-observation",
                  "final-custody", "fixture-expectations", "fixture-set", "font-inventory",
                  "font-readiness", "generated-inventory", "host-capture", "host-readback",
                  "host-readback-intent", "host-return-snapshot", "host-session", "host-source-binding",
                  "host-stdin", "host-terminal", "native-frame-manifest", "native-observations",
                  "native-observations-receipt", "native-result", "owner-close", "owner-closed-original",
                  "owner-shutdown-intent", "owner-shutdown-terminal", "owner-workspace",
                  "owner-workspace-terminal", "project-snapshot-original", "selected-originals", "selection-plan",
              )
              counts = {role: 1 for role in once}
              counts["native-png"] = 180
              counts.update({role: counts_by_fixture[fixture] for role in
                             ("selected-png", "selected-rgba", "decoder-stderr", "decoder-terminal")})
              roles, limits = value["role_limits"], value["limits"]
              need(type(roles) is dict and set(roles) == set(counts)
                   and all(type(bound) is int and 0 <= bound <= 256 * 1024 * 1024
                           and (bound > 0 or role == "decoder-stderr") for role, bound in roles.items()),
                   "fixedtxt-capacity-closed-role-bounds")
              need(roles["selection-plan"] == 512 * 1024 and roles["selected-rgba"] == 1920 * 1080 * 4,
                   "fixedtxt-capacity-unchanged-full-originals")
              need(type(limits) is dict and set(limits) == {"capsule_bytes", "files", "attempt_seconds", "custody_seconds"}
                   and type(limits["capsule_bytes"]) is int and 0 < limits["capsule_bytes"] <= 256 * 1024 * 1024
                   and type(limits["files"]) is int and 0 < limits["files"] <= 4096,
                   "fixedtxt-capacity-existing-limits")
              bounds = [roles[role] for role, count in counts.items() for _ in range(count)]
              # The exact twelve fixed workflow additions in make_plan: runtime input,
              # Broker receipt, five supervision and five transport originals. Reserve
              # the three starting originals too; their existing maxima are unchanged.
              bounds.extend([65536, 8 * 1024 * 1024,
                             65536, 65536, 1024 * 1024 + 1, 1024 * 1024 + 1, 65536,
                             1024 * 1024, 65536, 65536, 65536, 65536,
                             49152, 65536, 16384])
              need(len(bounds) <= limits["files"], "fixedtxt-preparation-declared-file-budget")
              # Same USTAR headers/padding, metadata, record rounding, envelope and
              # public-projection reserve as the existing R28 plan validator.
              total = sum(bounds)
              tar_bound = sum(512 + ((bound + 511) // 512) * 512 for bound in bounds)
              tar_bound += 512 + 512 * 1024 + 1024
              tar_bound = ((tar_bound + 10239) // 10240) * 10240
              capsule_bound = tar_bound + 8192 + 64 + 512 * 1024
              need(total <= 512 * 1024 * 1024 and capsule_bound <= limits["capsule_bytes"],
                   "fixedtxt-preparation-declared-capsule-budget")
              # The intermediate encrypted review uses the same USTAR packer. Reserve
              # its known mandatory subset before setup, not just the final native plan.
              # P/R/Q and starting-original maxima are the existing readers' bounds.
              # Unknown future API/runtime originals still require the exact later check.
              review = value["review_capsule_bytes"]
              stream = value["preparation_stream_bytes"]
              need(type(review) is int and 0 < review <= limits["capsule_bytes"]
                   and type(stream) is int and 0 < stream <= 8 * 1024 * 1024
                   and type(source_zip_bytes) is int and 0 <= source_zip_bytes <= 256 * 1024 * 1024,
                   "fixedtxt-preparation-review-existing-bounds")
              sources = value["sources"]
              review_bounds = [49152, 65536, 16384, 512 * 1024, 65536, 1024 * 1024]
              for key, maximum in (("template_film", 4 * 1024 * 1024), ("managed_project", 4 * 1024 * 1024),
                  ("caption_source", 65536), ("red_native", 2 * 1024 * 1024), ("measurement_protocol", 65536)):
                  bound = sources[key]["bytes"]
                  need(type(bound) is int and 0 < bound <= maximum, "fixedtxt-review-declared-source-size")
                  review_bounds.append(bound)
              need(type(sources["project_files"]) is list and len(sources["project_files"]) <= 256,
                   "fixedtxt-review-declared-asset-roster")
              for item in sources["project_files"]:
                  bound = item["original"]["bytes"]
                  need(type(bound) is int and 0 < bound <= 16 * 1024 * 1024, "fixedtxt-review-declared-asset-size")
                  review_bounds.append(bound)
              # Fifteen existing preparation children each retain stdout/stderr under
              # the declared ceiling and four metadata originals. Their unknown metadata
              # payloads contribute headers only here; no future size is certified.
              review_bounds.extend([stream, stream, 0, 0, 0, 0] * 15)
              # The intake archive appears verbatim twice: API original + source-kit copy.
              # Before download its size is unknown; after download this same arithmetic
              # runs with the observed length before the second copy or next command.
              review_bounds.extend([source_zip_bytes, source_zip_bytes])
              review_total = sum(review_bounds)
              review_tar = sum(512 + ((bound + 511) // 512) * 512 for bound in review_bounds)
              review_tar += 512 + 512 * 1024 + 1024
              review_tar = ((review_tar + 10239) // 10240) * 10240
              # Existing encrypted envelope/public-projection reserves plus the review
              # ZIP's existing 8192 bytes. Keep collect_workflow_originals' 1 MiB reserve.
              review_bound = review_tar + 8192 + 64 + 512 * 1024 + 8192
              need(len(review_bounds) <= limits["files"] and review_total <= review - 1024 * 1024
                   and review_bound <= review, "fixedtxt-preparation-declared-review-capsule-budget")
              return {"mandatory_role_counts": counts, "declared_files": len(bounds),
                      "declared_raw_bytes": total, "declared_capsule_bound": capsule_bound,
                      "review_declared_files": len(review_bounds), "review_declared_raw_bytes": review_total,
                      "review_declared_capsule_bound": review_bound, "source_zip_observed_bytes": source_zip_bytes,
                      "future_original_sizes_verified": False}
          raw = os.environ['MW_FIXEDTXT_REQUEST'].encode()
          bootstrap = os.environ['MW_FIXEDTXT_BOOTSTRAP'].encode()
          assert 0 < len(raw) <= 49152 and 0 < len(bootstrap) <= 16384
          # Workflow_dispatch payload itself has a finite platform bound; no file or
          # installed effect occurs until this original clock and raw input are kept.
          assert len(raw) + len(bootstrap) <= 60000
          def strict_pairs(rows):
              value = {}
              for key, item in rows:
                  assert key not in value
                  value[key] = item
              return value
          request = json.loads(raw, object_pairs_hook=strict_pairs)
          assert os.environ['MW_FIXEDTXT_DELIVERY'] == ''
          assert request['schema'] == 'motionwright.native.fixedtxt-workflow-request/1'
          assert os.environ['GITHUB_REPOSITORY'] == 'seradotcom/motionwright'
          assert os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          assert os.environ['GITHUB_RUN_ATTEMPT'] == '1'
          assert os.environ['EXPECTED_SOURCE_SHA'] == request['source_sha'] == os.environ['GITHUB_SHA']
          assert re.fullmatch('[0-9a-f]{40}', request['semwright_sha'])
          limits = request['limits']
          assert all(type(limits[k]) is int for k in ('attempt_seconds','custody_seconds'))
          assert 0 < limits['custody_seconds'] < limits['attempt_seconds'] <= 65 * 60
          assert type(request['attempt_minutes']) is int
          assert request['attempt_minutes'] * 60 == limits['attempt_seconds']
          assert all(type(request[k]) is int and request[k] > 0 for k in ('preparation_seconds','native_seconds','upload_seconds'))
          assert request['preparation_seconds'] + request['native_seconds'] + limits['custody_seconds'] < limits['attempt_seconds']
          assert request['upload_seconds'] < limits['custody_seconds']
          preflight_request_capacity(request)
          current = dict(source_sha=os.environ['GITHUB_SHA'], semwright_sha=request['semwright_sha'],
                         run_id=os.environ['GITHUB_RUN_ID'], run_attempt='1')
          clock = dict(schema='motionwright.native.fixedtxt-original-clock/1', context=current,
                       boot_id=Path('/proc/sys/kernel/random/boot_id').read_text().strip(),
                       started_monotonic=start, deadline_monotonic=start+limits['attempt_seconds'],
                       request_sha256=hashlib.sha256(raw).hexdigest())
          root = Path(os.environ['RUNNER_TEMP'])
          assert root.resolve(strict=True) == root and str(root).startswith('/home/runner/work/_temp')
          assert re.fullmatch('[1-9][0-9]*', current['run_id'])
          control = root / ('mw-fixedtxt-g2-control-' + current['run_id'] + '-1')
          control.mkdir(mode=0o700, exist_ok=False)
          for name, value in [('request.original.json',raw), ('runtime-bootstrap.original.json',bootstrap),
                              ('clock.original.json',(json.dumps(clock,sort_keys=True,separators=(',',':'))+'\n').encode())]:
              with (control/name).open('xb') as output:
                  output.write(value); output.flush(); os.fsync(output.fileno())
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('sdk_sha=' + current['semwright_sha'] + '\n')
          PY_CLOCK

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind the early capacity counts to the original selector before setup
        run: |
          set -euo pipefail
          python3 -B - <<'PY_CAPACITY_SOURCE'
          import hashlib
          from pathlib import Path
          source = Path('tooling/native_film180_evidence_selection.py').read_bytes()
          assert hashlib.sha256(source).hexdigest() == '4b81a292ac2b54579708715d1cfe84aef953274cafffa99a92bd9284b2fbaeee'
          PY_CAPACITY_SOURCE

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: seradotcom/semwright
          ref: ${{ steps.fixedtxt_clock.outputs.sdk_sha }}
          path: _semwright
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.22.0'

      - name: Prepare the existing pinned custody Python and empty owner cgroups
        id: fixedtxt_python
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B tooling/source_policy.py
          sudo -n apt-get update
          sudo -n apt-get install --no-install-recommends -y python3.12-venv
          /usr/bin/python3.12 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          venv="$RUNNER_TEMP/mw-fixedtxt-custody-python-$GITHUB_RUN_ID-1"
          test ! -e "$venv"
          /usr/bin/python3.12 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-cache-dir             --only-binary=:all: --require-hashes -r tooling/requirements/mlt-g2-custody.txt
          "$venv/bin/python" -m pip check
          group="/sys/fs/cgroup/motionwright-fixedtxt-$GITHUB_RUN_ID-1"
          test ! -e "$group"
          sudo -n mkdir -- "$group"
          for phase in preparation work custody; do
            sudo -n mkdir -- "$group/$phase"
            sudo -n chown -- "$(id -u):$(id -g)" "$group/$phase"               "$group/$phase/cgroup.procs" "$group/$phase/cgroup.kill"
            test ! -s "$group/$phase/cgroup.procs"
          done
          echo "python=$venv/bin/python" >> "$GITHUB_OUTPUT"

      - name: Prepare real originals with the existing provider and runtime installation
        id: fixedtxt_prepare
        env:
          GH_TOKEN: ${{ github.token }}
          CUSTODY_PYTHON: ${{ steps.fixedtxt_python.outputs.python }}
        run: |
          set -euo pipefail
          "$CUSTODY_PYTHON" -B -E -s tooling/native_fixedtxt_workflow.py --prepare-originals

      - name: Upload original encrypted P R Q for independent owner review
        id: fixedtxt_review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: motionwright-fixedtxt-preparation-${{ github.run_id }}-1
          path: |
            ${{ steps.fixedtxt_prepare.outputs.review_directory }}/sealed-preparation.bin
            ${{ steps.fixedtxt_prepare.outputs.review_directory }}/preparation-public.json
          if-no-files-found: error
          overwrite: false
          compression-level: 0
          retention-days: 14

      - name: Consume one external R28 original then execute the existing owner once
        id: fixedtxt_owner
        env:
          GH_TOKEN: ${{ github.token }}
          CUSTODY_PYTHON: ${{ steps.fixedtxt_python.outputs.python }}
          MW_FIXEDTXT_REVIEW_ARTIFACT_ID: ${{ steps.fixedtxt_review.outputs.artifact-id }}
          MW_FIXEDTXT_REVIEW_ARTIFACT_SHA256: ${{ steps.fixedtxt_review.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          exec "$CUSTODY_PYTHON" -B -E -s tooling/native_fixedtxt_workflow.py --receive-and-run

      - name: Retain workflow originals even after preparation or transport failure
        if: always() && steps.fixedtxt_python.outcome == 'success'
        env:
          CUSTODY_PYTHON: ${{ steps.fixedtxt_python.outputs.python }}
        run: |
          set -euo pipefail
          "$CUSTODY_PYTHON" -B -E -s tooling/native_fixedtxt_workflow.py --seal-workflow-originals

      - name: Upload encrypted workflow originals without inferring a native result
        if: always() && steps.fixedtxt_python.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: motionwright-fixedtxt-workflow-${{ github.run_id }}-1
          path: |
            ${{ runner.temp }}/mw-fixedtxt-g2-workflow-${{ github.run_id }}-1/sealed-workflow-originals.bin
            ${{ runner.temp }}/mw-fixedtxt-g2-workflow-${{ github.run_id }}-1/workflow-public.json
          if-no-files-found: error
          overwrite: false
          compression-level: 0
          retention-days: 14

      - name: Upload only the existing selected originals and public projection
        if: always() && steps.fixedtxt_owner.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: motionwright-fixedtxt-originals-${{ github.run_id }}-1
          path: |
            ${{ runner.temp }}/mw-fixedtxt-g2-sealed-${{ github.run_id }}-1/sealed-originals.bin
            ${{ runner.temp }}/mw-fixedtxt-g2-sealed-${{ github.run_id }}-1/public-evidence.json
          if-no-files-found: error
          overwrite: false
          compression-level: 0
          retention-days: 14

  fixedtxt-r28-original-delivery:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.fixedtxt_mode == 'deliver' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    steps:
      - name: Carry the independently authored R28 original for the actual live target
        id: delivery
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          MW_FIXEDTXT_DELIVERY: ${{ inputs.fixedtxt_delivery }}
          MW_FIXEDTXT_EXTERNAL_DISPATCH: ${{ inputs.g2_admission }}
          MW_FIXEDTXT_REQUEST: ${{ inputs.fixedtxt_request }}
          REQUESTED_SCOPE: ${{ inputs.verification_scope }}
        run: |
          set -euo pipefail
          umask 077
          python3 -B - <<'PY_DELIVERY'
          import hashlib, json, os, re, subprocess, time
          from datetime import datetime
          from pathlib import Path
          REPO = 'seradotcom/motionwright'
          WORKFLOW_PATH = '.github/workflows/native-mlt-sequence-e2e.yml'
          WORKFLOW_ENDPOINT = 'repos/' + REPO + '/actions/workflows/native-mlt-sequence-e2e.yml'
          DELIVERY_MAX = 65536
          DELIVERY_MEMBERS_MAX = 60 * 1024
          SHA = re.compile(r'[0-9a-f]{64}\Z')
          RUN = re.compile(r'[1-9][0-9]*\Z')


          class WorkflowRejected(ValueError):
              pass

          def need(value, reason):
              if not value:
                  raise WorkflowRejected(reason)

          def sha(raw):
              return hashlib.sha256(raw).hexdigest()

          def canonical(value):
              return (json.dumps(value, sort_keys=True, separators=(",", ":"),
                                 ensure_ascii=True, allow_nan=False) + "\n").encode()

          def strict(raw, maximum=DELIVERY_MAX):
              need(type(raw) is bytes and 0 < len(raw) <= maximum, "fixedtxt-workflow-json-bound")
              def pairs(rows):
                  value = {}
                  for key, item in rows:
                      need(key not in value, "fixedtxt-workflow-duplicate-key")
                      value[key] = item
                  return value
              value = json.loads(raw, object_pairs_hook=pairs,
                  parse_constant=lambda _: (_ for _ in ()).throw(WorkflowRejected("nonfinite JSON")))
              need(type(value) is dict, "fixedtxt-workflow-object")
              return value

          def artifact_name(target_run):
              need(type(target_run) is str and RUN.fullmatch(target_run), "fixedtxt-delivery-target")
              return "motionwright-fixedtxt-r28-delivery-" + target_run + "-1"

          def original_descriptor(raw):
              return {"bytes": len(raw), "sha256": sha(raw)}

          def checked_workflow(workflow):
              need(type(workflow) is dict and type(workflow.get("id")) is int and workflow["id"] > 0
                   and workflow.get("path") == WORKFLOW_PATH and workflow.get("state") == "active",
                   "fixedtxt-delivery-workflow")
              return workflow["id"]

          def checked_run(run, *, run_id, source_sha, workflow_id):
              need(type(run) is dict and type(run.get("id")) is int and str(run["id"]) == run_id
                   and type(run.get("run_attempt")) is int and run["run_attempt"] == 1
                   and run.get("event") == "workflow_dispatch"
                   and run.get("head_sha") == source_sha and run.get("workflow_id") == workflow_id
                   and run.get("path") == WORKFLOW_PATH, "fixedtxt-delivery-exact-run")
              repo, head, actor = run.get("repository"), run.get("head_repository"), run.get("actor")
              need(type(repo) is dict and type(repo.get("id")) is int and repo["id"] > 0
                   and repo.get("full_name") == REPO and type(head) is dict and head.get("id") == repo["id"],
                   "fixedtxt-delivery-repository")
              need(type(actor) is dict and actor.get("type") == "User"
                   and type(actor.get("id")) is int and actor["id"] > 0,
                   "fixedtxt-delivery-external-user")
              return repo["id"], actor["id"]

          def checked_delivery_runs(target, delivery, workflow, *, current):
              workflow_id = checked_workflow(workflow)
              original = checked_run(target, run_id=current["run_id"],
                                     source_sha=current["source_sha"], workflow_id=workflow_id)
              need(type(delivery.get("id")) is int and str(delivery["id"]) != current["run_id"],
                   "fixedtxt-delivery-must-be-independent-invocation")
              sender = checked_run(delivery, run_id=str(delivery["id"]),
                                   source_sha=current["source_sha"], workflow_id=workflow_id)
              need(sender == original, "fixedtxt-delivery-actor-or-repository-changed")
              timestamps = [run.get("created_at") for run in (target, delivery)]
              need(all(type(value) is str and re.fullmatch(r"\d{4}-\d\d-\d\dT\d\d:\d\d:\d\dZ", value)
                       for value in timestamps), "fixedtxt-original-server-times")
              need(datetime.fromisoformat(timestamps[1]) >= datetime.fromisoformat(timestamps[0]),
                   "fixedtxt-delivery-precedes-target")
              return workflow_id, original[0], original[1]

          def checked_artifact(item, *, run, expected_name, maximum):
              need(type(item) is dict and item.get("name") == expected_name
                   and type(item.get("id")) is int and item["id"] > 0
                   and item.get("expired") is False and type(item.get("size_in_bytes")) is int
                   and 0 < item["size_in_bytes"] <= maximum
                   and type(item.get("digest")) is str and item["digest"].startswith("sha256:")
                   and SHA.fullmatch(item["digest"][7:]), "fixedtxt-delivery-artifact-metadata")
              origin = item.get("workflow_run")
              need(type(origin) is dict and origin.get("id") == run["id"]
                   and origin.get("head_sha") == run["head_sha"]
                   and origin.get("repository_id") == run["repository"]["id"]
                   and origin.get("head_repository_id") == run["repository"]["id"],
                   "fixedtxt-delivery-artifact-run")
              return item

          def api_stream_file_limit():
              import resource
              prior = resource.getrlimit(resource.RLIMIT_FSIZE)
              maximum = min([DELIVERY_MAX, *(bound for bound in prior if bound != resource.RLIM_INFINITY)])
              need(0 < maximum <= DELIVERY_MAX, "fixedtxt-delivery-original-file-limit")
              return maximum

          def limit_api_stream_files():
              """The courier applies this only in its gh child, before exec or bytes."""
              import resource
              maximum = api_stream_file_limit()
              resource.setrlimit(resource.RLIMIT_FSIZE, (maximum, maximum))

          def main():
              # No checkout, installation, build, render, commit status or API write.
              need(os.environ['REQUESTED_SCOPE'] == 'fixedtxt-v4-one-fixture'
                   and os.environ['MW_FIXEDTXT_REQUEST'] == ''
                   and os.environ['GITHUB_REPOSITORY'] == REPO
                   and os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
                   and os.environ['GITHUB_RUN_ATTEMPT'] == '1'
                   and os.environ['EXPECTED_SOURCE_SHA'] == os.environ['GITHUB_SHA'], 'delivery-current-run')
              selection = strict(os.environ['MW_FIXEDTXT_DELIVERY'].encode(), 4096)
              need(set(selection) == {'target_run_id','review_artifact_id','review_artifact_sha256'}
                   and type(selection['target_run_id']) is str and RUN.fullmatch(selection['target_run_id'])
                   and type(selection['review_artifact_id']) is int and selection['review_artifact_id'] > 0
                   and type(selection['review_artifact_sha256']) is str and SHA.fullmatch(selection['review_artifact_sha256']),
                   'delivery-exact-target-and-original-review')
              dispatch = os.environ['MW_FIXEDTXT_EXTERNAL_DISPATCH'].encode()
              parsed = strict(dispatch, 16384)
              need(parsed.get('schema') == 'motionwright.native.fixedtxt-g2-dispatch/1'
                   and parsed.get('motionwright_sha') == os.environ['GITHUB_SHA'], 'delivery-original-R28-source')
              current = dict(source_sha=os.environ['GITHUB_SHA'], semwright_sha=parsed.get('semwright_sha'),
                             run_id=selection['target_run_id'],run_attempt='1')
              need(re.fullmatch('[0-9a-f]{40}',current['semwright_sha'])
                   and parsed.get('fixedtxt',{}).get('context') == current, 'delivery-original-R28-context')
              root = Path(os.environ['RUNNER_TEMP'])
              need(root.resolve(strict=True) == root, 'delivery-real-temporary-root')
              directory = root / ('mw-fixedtxt-r28-delivery-' + os.environ['GITHUB_RUN_ID'] + '-1')
              directory.mkdir(mode=0o700, exist_ok=False)
              until = time.monotonic() + 100  # inside the two-minute delivery job; target deadline is never reset
              originals = {}
              def get(route,name):
                  need(route.startswith('repos/'+REPO+'/actions/') and time.monotonic() < until,'delivery-read-only-route')
                  command = ['/usr/bin/gh','api','--method','GET',route]
                  maximum = api_stream_file_limit()
                  # Raw streams remain private runner originals. Only successful bounded
                  # API originals enter the six-member transport artifact.
                  with (directory/(name+'.stdout')).open('xb') as output, (directory/(name+'.stderr')).open('xb') as error:
                      result = subprocess.run(command,stdin=subprocess.DEVNULL,stdout=output,stderr=error,
                          env={'PATH':'/usr/bin:/bin','GH_HOST':'github.com','GH_TOKEN':os.environ['GH_TOKEN']},
                          timeout=max(0.001,min(30,until-time.monotonic())),check=False,
                          preexec_fn=limit_api_stream_files)
                  # At the hard ceiling, completeness is unknown even if gh handled
                  # SIGXFSZ/EFBIG and returned zero. Preserve the bounded originals; DENY.
                  need(all((directory/(name+'.'+stream)).stat().st_size < maximum
                           for stream in ('stdout','stderr')), 'delivery-original-stream-limit-reached')
                  need(result.returncode == 0,'delivery-read-failed-no-retry')
                  raw = (directory/(name+'.stdout')).read_bytes()
                  need(0 < len(raw) <= DELIVERY_MAX,'delivery-original-response-bound')
                  originals[name+'.original.json'] = raw
                  return strict(raw)
              workflow = get(WORKFLOW_ENDPOINT,'workflow')
              target = get('repos/'+REPO+'/actions/runs/'+current['run_id'],'target-run')
              delivery = get('repos/'+REPO+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],'delivery-run')
              checked_delivery_runs(target,delivery,workflow,current=current)
              need(target.get('status') == 'in_progress' and delivery.get('status') == 'in_progress','delivery-real-live-contexts')
              review = get('repos/'+REPO+'/actions/artifacts/'+str(selection['review_artifact_id']),'review-artifact')
              checked_artifact(review,run=target,expected_name='motionwright-fixedtxt-preparation-'+current['run_id']+'-1',
                               maximum=256*1024*1024)
              need(review['digest'] == 'sha256:'+selection['review_artifact_sha256'],'delivery-reviewed-original-digest')
              originals['dispatch.original.json'] = dispatch
              originals['handoff.original.json'] = canonical(dict(schema='motionwright.native.fixedtxt-workflow-delivery/1',
                  target_run_id=current['run_id'],delivery_run_id=os.environ['GITHUB_RUN_ID'],source_sha=current['source_sha'],
                  workflow_id=workflow['id'],review_artifact_id=review['id'],review_artifact_sha256=selection['review_artifact_sha256'],
                  dispatch_original=original_descriptor(dispatch)))
              need(sum(map(len,originals.values())) <= DELIVERY_MEMBERS_MAX,'delivery-original-member-budget')
              output = directory/'artifact'
              output.mkdir(mode=0o700,exist_ok=False)
              for name,raw in originals.items():
                  with (output/name).open('xb') as stream:
                      stream.write(raw);stream.flush();os.fsync(stream.fileno())
              need(time.monotonic() < until,'delivery-original-job-budget')
              with Path(os.environ['GITHUB_OUTPUT']).open('a') as stream:
                  stream.write('directory='+str(output)+'\nname='+artifact_name(current['run_id'])+'\n')

          main()
          PY_DELIVERY

      - name: Upload the six original transport members once
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.delivery.outputs.name }}
          path: ${{ steps.delivery.outputs.directory }}/*
          if-no-files-found: error
          overwrite: false
          compression-level: 0
          retention-days: 14

          import hashlib, json, os, re, subprocess, sys
          from pathlib import Path
          FILM_REQUIRED = ['brand_font::tests::bundled_instrument_and_ibm_are_not_managed_font_evidence', 'brand_font::tests::changed_pinned_inputs_and_noncanonical_parent_fail_before_source_writes', 'brand_font::tests::different_imported_digest_cannot_replace_pinned_face_or_destroy_original_cas', 'brand_font::tests::mixed_saved_family_is_rejected_without_native_receipts', 'brand_font::tests::saved_selection_reopens_exact_cas_film_and_history', 'brand_font::tests::selected_deliverable_overrides_reject_before_label_edit_and_native_receipts', 'brand_font::tests::source_component_label_edit_reopens_without_fabricated_native_success', 'brand_font::tests::unknown_font_import_identity_blocks_before_any_further_dispatch', 'fixed_text_v4::tests::compiler_members_cannot_escape_the_original_directory', 'fixed_text_v4::tests::conflicting_assets_for_same_managed_family_are_rejected', 'fixed_text_v4::tests::duplicate_original_descriptor_fields_are_rejected', 'fixed_text_v4::tests::native_return_requires_fresh_checked_provenance', 'fixed_text_v4::tests::one_managed_digest_cannot_alias_distinct_family_joins', 'fixed_text_v4::tests::pins_require_exact_lowercase_sha256', 'fixed_text_v4::tests::repeated_managed_family_with_same_asset_has_one_join', 'fixed_text_v4::tests::samples_cover_all_twelve_cases_and_caption_boundaries', 'stdin_readback::tests::absent_terminal_does_not_turn_capture_into_delivery', 'stdin_readback::tests::another_parents_complete_capture_does_not_end_publication_wait', 'stdin_readback::tests::changed_original_stdin_or_length_is_rejected', 'stdin_readback::tests::completed_write_without_input_is_not_accepted', 'stdin_readback::tests::crossed_parent_or_session_never_matches', 'stdin_readback::tests::crossed_provider_or_tool_is_rejected', 'stdin_readback::tests::duplicate_or_invalid_retained_metadata_stops_publication_wait', 'stdin_readback::tests::duplicate_parent_captures_are_not_selected_arbitrarily', 'stdin_readback::tests::failed_write_retains_original_io_details', 'stdin_readback::tests::interrupted_delivery_is_preserved_without_completion', 'stdin_readback::tests::not_observed_remains_uncertain_after_matching', 'stdin_readback::tests::observer_close_schema_and_scope_are_strict', 'stdin_readback::tests::observer_closure_does_not_erase_losses_or_discarded_captures', 'stdin_readback::tests::original_reader_keeps_private_mode_and_single_link_requirements', 'stdin_readback::tests::original_reader_preserves_private_bytes_empty_presence_and_the_bound', 'stdin_readback::tests::original_reader_rejects_fifo_replacement_without_a_writer', 'stdin_readback::tests::original_reader_rejects_replaced_regular_and_symlink_after_metadata', 'stdin_readback::tests::provider_process_transition_is_not_same_owner_lifetime', 'stdin_readback::tests::publication_waits_for_delayed_original_terminal_without_upgrading_its_state', 'stdin_readback::tests::selected_capture_joins_original_parent_session_and_bytes', 'stdin_readback::tests::terminal_unknown_duplicate_missing_or_extra_fields_are_rejected', 'stdin_readback::tests::unavailable_terminal_formats_remain_distinct', 'tests::changed_saved_source_intent_or_caption_boundaries_fail_before_native_dispatch', 'tests::editable_second_revision_uses_distinct_native_identity_and_requires_original_result', 'tests::original_av_requires_single_bounded_source_wav_and_exact_digest', 'tests::six_second_saved_source_reopens_and_retains_original_clock']
          path, phase = Path(sys.argv[1]), sys.argv[2]
          exit_code, capture_exit = int(sys.argv[3]), int(sys.argv[4])
          command = sys.argv[5:]
          assert phase in ("discovery", "execution") and command
          assert len(FILM_REQUIRED) == len(set(FILM_REQUIRED)) == 42
          raw = path.read_bytes()
          text = re.sub(r"\x1b\[[0-9;]*m", "", raw.decode("utf-8", "replace").replace("\r\n", "\n"))
          listed = re.findall(r"(?m)^(\S+): (test|benchmark)$", text)
          list_footer = re.findall(r"(?m)^([0-9]+) tests?, ([0-9]+) benchmarks?$", text)
          actual = re.findall(r"(?m)^test (\S+) \.\.\. (ok|FAILED|ignored)$", text)
          rows = re.findall(r"(?m)^test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out;", text)
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          dirty = subprocess.check_output(["git", "status", "--porcelain", "--untracked-files=no"]).strip()
          discovery_ok = (len(listed) == 42 and sorted(listed) == [(name, "test") for name in FILM_REQUIRED]
                          and list_footer == [("42", "0")] and not actual and not rows)
          execution_ok = (len(actual) == 42 and sorted(actual) == [(name, "ok") for name in FILM_REQUIRED]
                          and rows == [("ok", "42", "0", "0", "0", "0")] and not listed and not list_footer)
          complete = (exit_code == 0 and capture_exit == 0 and head == os.environ["GITHUB_SHA"] and not dirty
                      and (discovery_ok if phase == "discovery" else execution_ok))
          source_path = "crates/native/examples/native-film180-e2e.rs"
          receipt = {"schema": "motionwright.film180.closed-source-roster/1", "source_sha": head, "tree_sha": tree,
                     "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                     "job": os.environ["GITHUB_JOB"], "source_path": source_path,
                     "source_file_sha256": hashlib.sha256(Path(source_path).read_bytes()).hexdigest(),
                     "phase": phase, "command": command, "required": FILM_REQUIRED,
                     "discovered": listed, "discovery_footer": list_footer, "observed": actual,
                     "terminal_rows": rows, "exit_code": exit_code, "capture_exit_code": capture_exit,
                     "log": {"file": path.name, "bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()},
                     "stream_representation": "Original process stdout/stderr merged by shell",
                     "status": "PASS" if complete else "FAIL", "native_execution": False,
                     "formal_acceptance": False, "automatic_retry": False}
          with path.with_suffix(".receipt.json").open("x", encoding="utf-8") as stream:
              json.dump(receipt, stream, indent=2, sort_keys=True)
              stream.write("\n")
          print(json.dumps({"phase": phase, "source_sha": head, "status": receipt["status"],
                            "required_count": 42, "observed_count": len(listed if phase == "discovery" else actual),
                            "exit_code": exit_code, "capture_exit_code": capture_exit}))
          if not complete:
              raise SystemExit("Exact Film180 source roster omitted, renamed, duplicated, skipped, failed or source changed")
          PY
          done


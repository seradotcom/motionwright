              contract_need(receipt.get("executed_source_sha") == source["executed_source_sha"]
                       and receipt.get("tree_sha") == source["tree_sha"] and receipt.get("github") == github,
                       "Source group source/run/attempt/job differs")
              contract_need(receipt.get("status") == "PASS" and type(receipt.get("exit_code")) is int and receipt["exit_code"] == 0
                       and receipt.get("require_complete") is True and "source_postcheck_error" not in receipt,
                       "Source group failed/incomplete/uncertain source receipt")
              contract_need(receipt.get("test_definition_sha256") == definitions and receipt.get("runner_sha256") == runner_sha
                       and receipt.get("source_locks") == locks and receipt.get("python_executable_sha256") == interpreter_sha,
                       "Source group physical input/runner/interpreter identity differs")
              contract_need(type(receipt.get("steps")) is list and len(receipt["steps"]) == len(SUITES), "Source group requires its entire closed module set")
              contract_need(datetime.fromisoformat(receipt["started_at_utc"]) <= datetime.fromisoformat(receipt["completed_at_utc"]),
                       "Source group receipt chronology")


          def contract_check_step(step, path, count, mode, ids, logs, executable):
              module = path[:-3].replace("/", ".")
              label = "discovery:" + Path(path).name if mode == "discovery" else "dotted:" + module
              command = [executable, "-B", "-E", "-s", "-m", "unittest"]
              command += ["discover", "-s", "tooling/tests", "-p", Path(path).name, "-v"] if mode == "discovery" else [module, "-v"]
              contract_need(step.get("entry_point") == label and step.get("command") == command, "Source group wrong entry point/interpreter")
              contract_need(step.get("status") == "PASS" and type(step.get("exit_code")) is int and step["exit_code"] == 0,
                       "Source group nonterminal/failed process")
              counts = step.get("counts")
              expected = {"terminal_status": "OK", "tests_run": count, "passed": count, "failures": 0, "errors": 0,
                          "skipped": 0, "expected_failures": 0, "unexpected_successes": 0}
              contract_need(type(counts) is dict and set(counts) == set(expected)
                       and counts["terminal_status"] == "OK"
                       and all(type(counts[k]) is int and counts[k] == v for k, v in expected.items() if k != "terminal_status"),
                       "Source group omitted/noninteger/wrong counts")
              duration = step.get("duration_seconds")
              contract_need(type(duration) in (int, float) and math.isfinite(duration) and duration >= 0, "Source group invalid duration")
              for stream, raw in logs.items():
                  contract_need(type(step.get(stream)) is dict and set(step[stream]) == {"file", "sha256"}
                           and step[stream]["sha256"] == contract_sha(raw), "Source group original stream hash differs")
              prefix = Path(path).stem if mode == "discovery" else module
              return contract_nominal(logs["stderr"], [prefix + "." + name for name in ids])


          def admit_contract_source():
              # Use the existing canonical verifier; no test/native command is started here.
              from tooling.ci_test_runner import source_state
              root, report = Path(sys.argv[1]), Path(sys.argv[2])
              contract_private(root, directory=True)
              contract_need(report.parent == root, "Source group report must use its reserved root")
              contract_private(report.parent, directory=True)
              wanted = {"contracts.json", "runner.stdout", "runner.stderr", "runner-exit.json"} | {f"contracts-{i:02d}-{stream}.log" for i in range(len(SUITES)) for stream in ("stdout", "stderr")}
              contract_need(set(p.name for p in report.parent.iterdir()) == wanted, "Source group full source-report original closure differs")
              before = source_state(Path.cwd(), os.environ["GITHUB_SHA"])
              github = {key: os.environ.get(key, "") for key in
                        ("GITHUB_SHA", "GITHUB_WORKFLOW_REF", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_JOB")}
              contract_need(all(github.values()), "Source group job identity incomplete")
              raw = contract_original(report)
              receipt = contract_json(raw)
              originals = {str(report): contract_sha(raw)}
              terminal_raw = contract_original(root / "runner-exit.json")
              terminal = contract_json(terminal_raw)
              contract_need(terminal == {"schema": "motionwright.ci.source-runner-terminal/1",
                                        "exit_code": 0, "automatic_retry": False}
                            and type(terminal["exit_code"]) is int,
                            "Source group original runner exit differs")
              originals[str(root / "runner-exit.json")] = contract_sha(terminal_raw)
              for name in ("runner.stdout", "runner.stderr"):
                  originals[str(root / name)] = contract_sha(contract_original(root / name))

              definitions, rosters = {}, {}
              for path, count, nominal_sha in SUITES:
                  body = Path(path).read_bytes()
                  definitions[path] = contract_sha(body)
                  rosters[path] = contract_roster(body, path, count, nominal_sha)
              locks = {path: contract_sha(Path(path).read_bytes()) for path in
                       ("Cargo.lock", "SOURCE_LOCK.json", "apps/studio/package-lock.json") if Path(path).is_file()}
              runner_sha = contract_sha(Path("tooling/ci_test_runner.py").read_bytes())
              interpreter_sha = contract_sha(Path(sys.executable).read_bytes())
              contract_check_receipt(receipt, before, github, definitions, runner_sha, locks, interpreter_sha)
              # Canonical runner preserves requested discovery order, then sorted dotted files.
              plan = [(row, MODE) for row in (SUITES if MODE == "discovery" else sorted(SUITES))]
              observed = []
              for index, ((path, count, nominal_sha), mode) in enumerate(plan):
                  step = receipt["steps"][index]
                  logs = {}
                  for stream in ("stdout", "stderr"):
                      name = f"contracts-{index:02d}-{stream}.log"
                      contract_need(step[stream]["file"] == name, "Source group aliased stream path")
                      body = contract_original(report.parent / name)
                      logs[stream] = body
                      originals[str(report.parent / name)] = contract_sha(body)
                  ids = contract_check_step(step, path, count, mode, rosters[path], logs, str(sys.executable))
                  observed.append({"entry_point": step["entry_point"], "nominal_ids": ids, "source_path": path})
              contract_need(sum(len(row["nominal_ids"]) for row in observed) == TOTAL, "Source group incomplete invocation roster")
              contract_need(source_state(Path.cwd(), os.environ["GITHUB_SHA"]) == before
                       and definitions == {path: contract_sha(Path(path).read_bytes()) for path in definitions}
                       and all(contract_sha(contract_original(Path(path))) == pin for path, pin in originals.items()), "Source group source/originals changed")
              value = {"schema": "motionwright.closed-source-contract-group/1", "group": GROUP, **before, "github": github,
                       "status": "PASS_SOURCE_CONTRACTS_ONLY", "unique_methods": TOTAL, "invocations": TOTAL,
                       "steps": observed, "original_receipt_sha256": contract_sha(raw), "original_streams": originals,
                       "scope": "Source/custody contracts only; no physical production or human acceptance",
                       "native_execution": False, "formal_acceptance": False, "automatic_retry": False}
              destination = report.parent / "contracts-admission.json"
              with destination.open("x", encoding="utf-8", newline="\n") as handle:
                  json.dump(value, handle, indent=2, sort_keys=True)
                  handle.write("\n")
              contract_private(destination)


          admit_contract_source()
          PY

      - name: Verify original consumer publication and Linux descriptor custody
        id: g2_publication_contracts

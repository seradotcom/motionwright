              verify_staged_source_receipt(source_receipt, mode)
              if mode == "captioned-mp4":
                  proof = json.loads((root / "captioned-master-pixel-evidence.json").read_text())
                  assert proof["captioned_master_decoded_pixels"] == "PASS"
                  assert proof["motionwright_source_sha"] == os.environ["GITHUB_SHA"]
                  assert proof["human_readability"] == "NOT_RUN"
                  assert proof["commercial_release_authorized"] is False
                  assert proof["native_cue_count"] == result["captioned_source_cue_count"] == 2
                  assert set(proof["active_caption_frames"]) == {"15", "32"}
                  assert result["captioned_master_decoded_pixels"] == "PASS"
                  assert proof["original_ffv1_sha256"] == result["video_sha256"]
                  assert proof["actual_master_mp4_sha256"] == result["final_master_sha256"]
          PY

      - name: Publish only verified v0.1 MLT media, not owner/Broker receipts
        if: always() && env.MW_MLT_SCOPE == 'normal'
        env:
          NATIVE_CI_JOB_STATUS: ${{ job.status }}
        run: |
          python3 tooling/native_mlt_public_artifact.py \
            --source-sha "$GITHUB_SHA" \
            --mode "$MOTIONWRIGHT_MLT_MODE" \
            --evidence-root "verification/native-mlt-sequence-e2e/$GITHUB_SHA" \
            --output-root "verification/native-mlt-sequence-public" \
            --job-status "$NATIVE_CI_JOB_STATUS"
          python3 -m json.tool verification/native-mlt-sequence-public/public-evidence.json >/dev/null

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && env.MW_MLT_SCOPE == 'normal'
        with:
          name: motionwright-native-mlt-sequence-${{ matrix.mode }}-${{ github.sha }}
          path: verification/native-mlt-sequence-public
          if-no-files-found: error
          retention-days: 14

      - name: Seal preflight source originals independently of native preparation
        id: g2_preflight_finish
        if: always() && env.MW_MLT_SCOPE != 'normal'
        env:
          CUSTODY_PYTHON: ${{ steps.custody_python.outputs.python }}
          P1_COMMON_OUTCOME: ${{ steps.g2_common_contracts.outcome }}
          P1_FILM_OUTCOME: ${{ steps.g2_film_contracts.outcome }}
          P1_PUBLICATION_OUTCOME: ${{ steps.g2_publication_contracts.outcome }}
          P1_PREPARE_OUTCOME: ${{ steps.g2_prepare.outcome }}
          P1_ADMISSION_OUTCOME: ${{ steps.g2_admission.outcome }}
          P1_PRODUCER_OUTCOME: ${{ steps.g2_production.outcome }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$CUSTODY_PYTHON"
          "$CUSTODY_PYTHON" -B -E -s - finish <<'PY'
          # BEGIN A6_MLT_PREFLIGHT_CUSTODY
          import json
          import os
          from pathlib import Path
          import stat
          import sys


          def p1_need(value, reason):
              if not value:
                  raise ValueError(reason)


          def p1_exists(path):
              try:
                  path.lstat()
              except FileNotFoundError:
                  return False
              return True


          def p1_private(path, directory):
              info = path.lstat()
              p1_need(path.is_absolute() and path.resolve(strict=True) == path
                      and not any(item.is_symlink() for item in path.parents), "preflight noncanonical path")
              p1_need((stat.S_ISDIR(info.st_mode) if directory else stat.S_ISREG(info.st_mode))
                      and stat.S_IMODE(info.st_mode) == (0o700 if directory else 0o600)
                      and info.st_uid == os.geteuid()
                      and (directory or info.st_nlink == 1), "preflight private original permissions")


          def p1_locations(env, native):
              current = native.context(env)
              base = native.runner_root(env)
              suffix = current["run_id"] + "-" + current["run_attempt"]
              root = base / ("mw-mlt-preflight-custody-" + suffix)
              common = base / ("mw-mlt-g2-contracts-" + suffix)
              film = base / ("mw-film180-contracts-" + suffix)
              workflow = base / ("mw-mlt-workflow-contracts-" + suffix)
              control, installed, session = native.names(env)
              return current, root, common, film, workflow, control, installed, session


          def p1_observed_outcomes(env):
              keys = ("P1_COMMON_OUTCOME", "P1_FILM_OUTCOME", "P1_PUBLICATION_OUTCOME",
                      "P1_PREPARE_OUTCOME", "P1_ADMISSION_OUTCOME", "P1_PRODUCER_OUTCOME")
              return {key: env.get(key, "") for key in keys}


          def p1_native_terminal(outcomes, initial_absence, installed_present, session_present, producer_marker_present):
              # Absence at the final read alone cannot undo an observed invocation.
              no_effect = (initial_absence is True
                           and outcomes.get("P1_ADMISSION_OUTCOME") == "skipped"
                           and outcomes.get("P1_PRODUCER_OUTCOME") == "skipped"
                           and installed_present is False and session_present is False
                           and producer_marker_present is False)
              return "NOT_STARTED" if no_effect else "ERROR_OR_UNKNOWN"


          def p1_report_names(label):
              count = {"common": 12, "film": 3, "workflow": 1}[label]
              names = {"contracts.json", "contracts-admission.json", "runner.stdout", "runner.stderr", "runner-exit.json"}
              names |= {f"contracts-{index:02d}-{stream}.log" for index in range(count) for stream in ("stdout", "stderr")}
              if label == "common":
                  names |= {"publication-binding.json", "original-wav-rust.log", "film180-rust-source.log"}
                  names |= {f"publication-binding-{index:02d}-{stream}.log" for index in range(2) for stream in ("stdout", "stderr")}
              return names


          def p1_copy_reports(root, original_roots, custody):
              # Only the source-owned flat receipt/log inventory is copied. Unknown
              # neighboring files and subdirectories are never opened or encrypted.
              captured_roots, observations, errors = {}, [], []
              target = root / "source-report-snapshot"
              target.mkdir(mode=0o700)
              for label, directory in original_roots.items():
                  output = target / label
                  output.mkdir(mode=0o700)
                  captured_roots[label] = output
                  if not p1_exists(directory):
                      errors.append({"label": label, "status": "ORIGINAL_ROOT_ABSENT", "automatic_retry": False})
                      continue
                  try:
                      p1_private(directory, True)
                      inventory = sorted(path.name for path in directory.iterdir())
                      missing = sorted({"contracts.json", "runner.stdout", "runner.stderr", "runner-exit.json"} - set(inventory))
                      if missing:
                          errors.append({"label": label, "status": "SOURCE_REPORT_RECORDS_ABSENT", "names": missing})
                      unknown = sorted(set(inventory) - p1_report_names(label))
                      if unknown:
                          errors.append({"label": label, "status": "UNSELECTED_NEIGHBORS_NOT_CAPTURED", "names": unknown})
                      for name in sorted(set(inventory) & p1_report_names(label)):
                          path = directory / name
                          try:
                              p1_private(path, False)
                              before = custody.metadata_identity(path.lstat())
                              raw, observation = custody.regular(path)
                              custody.new_bytes(output / name, raw)
                              p1_need(custody.metadata_identity(path.lstat()) == before, "source original changed during copy")
                              observations.append({"root": label, "relative_path": name, "original": observation,
                                                   "copied_sha256": custody.sha(raw), "copied_bytes": len(raw)})
                          except Exception as error:
                              errors.append({"label": label, "name": name, "type": type(error).__name__,
                                             "message": str(error), "original_not_modified_by_capture": True, "automatic_retry": False})
                      p1_need(inventory == sorted(path.name for path in directory.iterdir()), "source report inventory changed")
                  except Exception as error:
                      errors.append({"label": label, "type": type(error).__name__, "message": str(error),
                                     "original_not_modified_by_capture": True, "automatic_retry": False})
              return captured_roots, observations, errors


          def p1_initialize(env, custody, native, source_state):
              current, root, common, film, workflow, control, installed, session = p1_locations(env, native)
              raw = env.get("MW_MLT_G2_ADMISSION", "").encode("utf-8")
              dispatch = native.validate_dispatch(raw, current, scenario=env["MW_MLT_SCOPE"])
              custody.public_key(dispatch["recipient"])
              checkout = Path(env["GITHUB_WORKSPACE"])
              state = source_state(checkout, current["source_sha"])
              physical = native.source_guard(checkout, current, scenario=env["MW_MLT_SCOPE"])
              for path in (root, common, film, workflow, control, installed, session):
                  p1_need(not p1_exists(path), "preflight namespace is not fresh")
              # Everything above is validation/read-only. This does not call prepare,
              # intake, runtime admission, a producer, or a renderer.
              root.mkdir(mode=0o700)
              for name in ("records", "public"):
                  (root / name).mkdir(mode=0o700)
              custody.new_bytes(root / "records/dispatch.original.json", raw)
              custody.new_json(root / "records/source-before.json", {"git": state, "physical": physical})
              custody.new_json(root / "records/initial.json", {
                  "schema": "motionwright.native.mlt-preflight-initial/1", "context": current,
                  "github_job": env["GITHUB_JOB"], "scope": env["MW_MLT_SCOPE"],
                  "effect_namespaces_initially_absent": True, "dispatch_input_sha256": custody.sha(raw),
                  "admission_granted": False, "native_effect_started": False, "automatic_retry": False})
              for directory in (root, root / "records", root / "public"):
                  p1_private(directory, True)
              return root


          def p1_finish(env, custody, native, source_state):
              current, root, common, film, workflow, control, installed, session = p1_locations(env, native)
              p1_private(root, True)
              p1_private(root / "records", True)
              p1_private(root / "public", True)
              p1_need(not any((root / "public").iterdir()), "preflight public output is not fresh")
              initial_raw = custody.regular(root / "records/initial.json", custody.MAX_JSON)[0]
              before_raw = custody.regular(root / "records/source-before.json", custody.MAX_JSON)[0]
              dispatch_raw = custody.regular(root / "records/dispatch.original.json", custody.MAX_JSON)[0]
              initial = custody.strict(initial_raw)
              p1_need(initial.get("schema") == "motionwright.native.mlt-preflight-initial/1"
                      and initial.get("context") == current and initial.get("github_job") == env["GITHUB_JOB"]
                      and initial.get("scope") == env["MW_MLT_SCOPE"]
                      and initial.get("effect_namespaces_initially_absent") is True
                      and initial.get("dispatch_input_sha256") == custody.sha(dispatch_raw)
                      and initial.get("admission_granted") is False
                      and initial.get("native_effect_started") is False
                      and initial.get("automatic_retry") is False, "preflight initial binding differs")
              dispatch = native.validate_dispatch(dispatch_raw, current, scenario=env["MW_MLT_SCOPE"])
              custody.public_key(dispatch["recipient"])
              outcomes = p1_observed_outcomes(env)
              effect_observations = {}
              for label, path in (("installation", installed), ("session", session),
                                  ("producer-marker", control / "records/producer-started.json")):
                  try:
                      effect_observations[label] = {"present": p1_exists(path)}
                  except OSError as error:
                      effect_observations[label] = {"present": None, "type": type(error).__name__, "message": str(error)}
              terminal = p1_native_terminal(outcomes, initial["effect_namespaces_initially_absent"],
                  effect_observations["installation"]["present"], effect_observations["session"]["present"],
                  effect_observations["producer-marker"]["present"])
              source_unchanged, source_error = False, None
              try:
                  checkout = Path(env["GITHUB_WORKSPACE"])
                  # Each canonical source test already performs its strict complete-input
                  # postcheck immediately, before SDK checkout/build. At this later phase
                  # the existing native job has legitimately created _semwright/target.
                  # Preserve the native physical source-binding guard; do not weaken the
                  # canonical runner or claim this is another empty-input source epoch.
                  after = {"physical": native.source_guard(checkout, current, scenario=env["MW_MLT_SCOPE"]),
                           "scope": "Existing native source_guard: exact HEAD/tree, tracked changes and selected physical files",
                           "strict_full_input_preflight_postchecks": "retained in original canonical unittest receipts",
                           "full_checkout_input_postcheck_at_final_seal": False}
                  custody.new_json(root / "records/source-after.json", after)
                  source_unchanged = (custody.json_bytes(custody.strict(before_raw)["physical"])
                                      == custody.json_bytes(after["physical"]))
              except Exception as error:
                  # The original failure and all available source reports remain private.
                  source_error = {"type": type(error).__name__, "message": str(error), "automatic_retry": False}
              native_dispatch_valid = False
              dispatch_error = None
              try:
                  native_raw, native_observation = custody.regular(control / "records/dispatch.json", custody.MAX_JSON)
                  custody.new_bytes(root / "records/native-dispatch-observed.json", native_raw)
                  custody.new_json(root / "records/native-dispatch-observation.json", native_observation)
                  actual = native.validate_dispatch(native_raw, current, scenario=env["MW_MLT_SCOPE"])
                  p1_need(custody.json_bytes(actual) == custody.json_bytes(dispatch), "native dispatch differs from original preflight input")
                  native_dispatch_valid = True
              except Exception as error:
                  dispatch_error = {"type": type(error).__name__, "message": str(error), "automatic_retry": False}
              custody.new_json(root / "records/finish.json", {
                  "schema": "motionwright.native.mlt-preflight-finish/1", "context": current,
                  "github_job": env["GITHUB_JOB"], "outcomes": outcomes, "native_terminal": terminal,
                  "effect_observations": effect_observations,
                  "native_dispatch_valid": native_dispatch_valid, "native_dispatch_error": dispatch_error,
                  "selected_source_bindings_unchanged": source_unchanged, "source_error": source_error,
                  "native_originals_modified_by_preflight": False, "native_originals_claimed_in_this_capsule": False,
                  "automatic_retry": False})
              # A new exclusive intent makes capture/encryption one-shot, even after a
              # partial exception. This phase never reruns tests or native operations.
              custody.new_json(root / "records/seal-intent.json", {"context": current, "automatic_retry": False})
              copies, observations, private_errors = p1_copy_reports(root, {"common": common, "film": film, "workflow": workflow}, custody)
              roots = {"records": root / "records", **copies}
              custody.new_json(root / "records/source-report-capture.json", {
                  "observed_originals": observations, "errors": private_errors,
                  "scope": "Only named source report/log files; unknown neighbors are not captured",
                  "automatic_retry": False})
              plaintext, captured = custody.gather_snapshot(roots, preserve_partial=True)
              encrypted = custody.encrypt_snapshot(plaintext, dispatch["recipient"], current)
              public = {
                  "schema": "motionwright.native.mlt-preflight-public/1", "context": current,
                  "github_job": env["GITHUB_JOB"], "scope": "source-preflight-originals-only",
                  "status": "SOURCE_ORIGINALS_SEALED" if captured and not private_errors else "PARTIAL_SOURCE_ORIGINALS_SEALED",
                  "selected_source_bindings_unchanged": source_unchanged,
                  "full_checkout_input_postcheck_at_final_seal": False,
                  "captured_source_originals_complete": captured and not private_errors,
                  "native_terminal": terminal, "native_dispatch_valid": native_dispatch_valid,
                  "sealed_originals_sha256": custody.sha(encrypted), "sealed_originals_bytes": len(encrypted),
                  "recipient_spki_sha256": dispatch["recipient"]["sha256"],
                  "native_originals_claimed": False, "source_test_pass_claimed": False,
                  "admission_granted": False, "native_operation_retried": False,
                  "physical_AV_master_acceptance": False, "human_acceptance": False, "release_authorized": False}
              custody.new_bytes(root / "public/sealed-source-originals.bin", encrypted)
              custody.new_json(root / "public/source-public-evidence.json", public)
              p1_need({path.name for path in (root / "public").iterdir()}
                      == {"sealed-source-originals.bin", "source-public-evidence.json"}, "preflight public closure differs")
              complete = captured and not private_errors and source_unchanged
              return public, 0 if complete and native_dispatch_valid else 2


          def p1_main():
              sys.path.insert(0, str(Path.cwd() / "tooling"))
              import ci_private_evidence as custody
              import native_mlt_g2_custody as native
              from ci_test_runner import source_state
              p1_need(len(sys.argv) == 2 and sys.argv[1] in {"initialize", "finish"}, "preflight action")
              if sys.argv[1] == "initialize":
                  p1_initialize(os.environ, custody, native, source_state)
                  return 0
              public, code = p1_finish(os.environ, custody, native, source_state)
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8", newline="\n") as handle:
                  handle.write("native_dispatch=" + ("true" if public["native_dispatch_valid"] else "false") + "\n")
              return code


          if __name__ == "__main__":
              raise SystemExit(p1_main())
          # END A6_MLT_PREFLIGHT_CUSTODY
          PY

      - name: Seal original G2 evidence and emit closed public status
        id: g2_native_seal
        if: always() && env.MW_MLT_SCOPE != 'normal'
        env:
          CUSTODY_PYTHON: ${{ steps.custody_python.outputs.python }}
          NATIVE_CI_JOB_STATUS: ${{ job.status }}
          MW_MLT_G2_ADMISSION: ${{ inputs.g2_admission }}
        run: |
          set -euo pipefail
          control="$RUNNER_TEMP/mw-mlt-g2-control-$GITHUB_RUN_ID-1"
          test -n "$CUSTODY_PYTHON"
          test -f "$control/records/dispatch.json"
          "$CUSTODY_PYTHON" -B -E -s - "$control/records/dispatch.json" <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, "tooling")
          import native_mlt_g2_custody as custody
          current = custody.context(os.environ)
          scenario = os.environ["MW_MLT_SCOPE"]
          expected = custody.validate_dispatch(os.environ["MW_MLT_G2_ADMISSION"].encode(), current, scenario=scenario)
          actual = custody.validate_dispatch(custody.regular(Path(sys.argv[1]), custody.MAX_JSON)[0], current, scenario=scenario)
          custody.require(custody.json_bytes(actual) == custody.json_bytes(expected), "original_dispatch_input_changed")
          PY
          echo "native_dispatch=true" >> "$GITHUB_OUTPUT"
          "$CUSTODY_PYTHON" -B -E -s tooling/native_mlt_g2_custody.py seal \
            --job-status "$NATIVE_CI_JOB_STATUS"

      - name: Retain only authenticated ciphertext and the closed G2 projection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && env.MW_MLT_SCOPE != 'normal' && steps.g2_native_seal.outputs.native_dispatch == 'true'
        with:
          name: ${{ env.MW_MLT_SCOPE == 'film180-g2' && 'motionwright-native-film180-g2-sealed' || 'motionwright-native-mlt-g2-sealed' }}-${{ github.sha }}-${{ github.run_id }}-1
          path: |
            ${{ runner.temp }}/mw-mlt-g2-control-${{ github.run_id }}-1/public/sealed-originals.bin
            ${{ runner.temp }}/mw-mlt-g2-control-${{ github.run_id }}-1/public/public-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Retain the separate encrypted source-preflight capsule
        if: always() && env.MW_MLT_SCOPE != 'normal'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: motionwright-mlt-preflight-sealed-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mw-mlt-preflight-custody-${{ github.run_id }}-${{ github.run_attempt }}/public/sealed-source-originals.bin
            ${{ runner.temp }}/mw-mlt-preflight-custody-${{ github.run_id }}-${{ github.run_attempt }}/public/source-public-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Retain normal-profile source originals without native receipts
        if: always() && env.MW_MLT_SCOPE == 'normal' && matrix.mode != 'pcm' && matrix.mode != 'video-only'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: motionwright-mlt-preflight-source-${{ matrix.mode }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mw-mlt-g2-contracts-${{ github.run_id }}-${{ github.run_attempt }}
            ${{ runner.temp }}/mw-film180-contracts-${{ github.run_id }}-${{ github.run_attempt }}
            ${{ runner.temp }}/mw-mlt-workflow-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14

  audio-source:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.verification_scope == 'audio-source-g0' || inputs.verification_scope == 'audio-source-g1')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 220
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MW_MLT_SCOPE: ${{ github.event_name == 'push' && 'audio-source-g0' || inputs.verification_scope }}
      MW_EXPECTED_GATE_SHA: ${{ inputs.expected_source_sha }}
      MW_EXPECTED_SDK_SHA: ${{ inputs.expected_sdk_sha }}
      LD_PRELOAD: ''
      LD_LIBRARY_PATH: ''
      LD_AUDIT: ''
      SEMWRIGHT_CHECKOUT: ''
    # Finite step caps sum to 214 minutes; the job retains six minutes of overhead.
    # The SDK observer keeps its original 170-minute clock inside its 172-minute step.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          path: gate
          persist-credentials: false
      - name: Admit the exact source-only selection
        timeout-minutes: 2
        env:
          G2_ADMISSION: ${{ inputs.g2_admission }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$(git -C gate rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$G2_ADMISSION"
          case "$GITHUB_EVENT_NAME:$MW_MLT_SCOPE" in
            push:audio-source-g0) test -z "$MW_EXPECTED_GATE_SHA"; test -z "$MW_EXPECTED_SDK_SHA" ;;
            workflow_dispatch:audio-source-g0)
              test "$MW_EXPECTED_GATE_SHA" = "$GITHUB_SHA"
              test -z "$MW_EXPECTED_SDK_SHA"
              ;;
            workflow_dispatch:audio-source-g1)
              test "$MW_EXPECTED_GATE_SHA" = "$GITHUB_SHA"
              test "$MW_EXPECTED_SDK_SHA" = b4a71f0c10d3e1d49e71212de7cb5de02b72a9c6
              ;;
            *) exit 2 ;;
          esac
          controls="$RUNNER_TEMP/mw-audio-source-controls-$GITHUB_RUN_ID-1"
          test ! -e "$controls"
          mkdir -m 700 "$controls"
          echo "MW_AUDIO_CONTROLS=$controls" >> "$GITHUB_ENV"
          echo "MW_AUDIO_ORIGINALS=$RUNNER_TEMP/mw-audio-source-$GITHUB_RUN_ID-1/evidence" >> "$GITHUB_ENV"
      - name: Prepare the existing custody interpreter and SDK source-check dependencies
        timeout-minutes: 6
        run: |
          set -euo pipefail
          sudo apt-get update > "$MW_AUDIO_CONTROLS/apt-update.stdout" 2> "$MW_AUDIO_CONTROLS/apt-update.stderr"
          sudo apt-get install --no-install-recommends -y python3.12-venv python3-jsonschema python3-yaml \
            > "$MW_AUDIO_CONTROLS/apt-install.stdout" 2> "$MW_AUDIO_CONTROLS/apt-install.stderr"
          dpkg-query -W python3.12-venv python3-jsonschema python3-yaml > "$MW_AUDIO_CONTROLS/dependency-versions.txt"
          python3.12 -m venv --system-site-packages "$MW_AUDIO_CONTROLS/python"
          "$MW_AUDIO_CONTROLS/python/bin/python" -m pip install --disable-pip-version-check --no-input --no-cache-dir \
            --only-binary=:all: --require-hashes -r gate/tooling/requirements/mlt-g2-custody.txt \
            > "$MW_AUDIO_CONTROLS/pip.stdout" 2> "$MW_AUDIO_CONTROLS/pip.stderr"
          "$MW_AUDIO_CONTROLS/python/bin/python" -m pip check > "$MW_AUDIO_CONTROLS/pip-check.txt"
          echo "MW_AUDIO_PYTHON=$MW_AUDIO_CONTROLS/python/bin/python" >> "$GITHUB_ENV"
      - name: Source policy and public surface on the actual gate
        timeout-minutes: 5
        working-directory: gate
        run: |
          set -euo pipefail
          "$MW_AUDIO_PYTHON" -B -E -s tooling/source_policy.py \
            > "$MW_AUDIO_CONTROLS/source-policy.stdout" 2> "$MW_AUDIO_CONTROLS/source-policy.stderr"
          "$MW_AUDIO_PYTHON" -B -E -s tooling/public_surface_policy.py \
            > "$MW_AUDIO_CONTROLS/public-surface.stdout" 2> "$MW_AUDIO_CONTROLS/public-surface.stderr"
          git diff --check
      - name: All existing and additive MLT selection and custody controls
        if: ${{ !cancelled() && env.MW_AUDIO_PYTHON != '' }}
        timeout-minutes: 16
        working-directory: gate
        run: |
          set -euo pipefail
          "$MW_AUDIO_PYTHON" -B -E -s tooling/ci_test_runner.py --repo "$PWD" \
            --mode both --require-complete --expected-source "$GITHUB_SHA" --timeout 150 \
            --pattern test_native_mlt_g2_custody.py --pattern test_native_mlt_evidence_selection.py \
            --pattern test_native_mlt_workflow_preflight.py \
            --report "$MW_AUDIO_CONTROLS/contracts.json" \
            > "$MW_AUDIO_CONTROLS/runner.stdout" 2> "$MW_AUDIO_CONTROLS/runner.stderr"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 3
        if: ${{ success() && inputs.verification_scope == 'audio-source-g1' }}
        with:
          repository: seradotcom/semwright
          ref: b4a71f0c10d3e1d49e71212de7cb5de02b72a9c6
          path: sdk
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        timeout-minutes: 3
        if: ${{ success() && inputs.verification_scope == 'audio-source-g1' }}
        with:
          node-version: '22'
      - name: Observe SDK G0, exact producers, lists and 184 affected source cases
        if: ${{ success() && inputs.verification_scope == 'audio-source-g1' }}
        timeout-minutes: 172
        run: |
          set -euo pipefail
          set +e
          "$MW_AUDIO_PYTHON" -B -E -s gate/tooling/native_mlt_g2_custody.py audio-source-g1 \
            --gate "$GITHUB_WORKSPACE/gate" --sdk "$GITHUB_WORKSPACE/sdk" \
            --output "$RUNNER_TEMP/mw-audio-source-$GITHUB_RUN_ID-1" \
            > "$MW_AUDIO_CONTROLS/outer.stdout" 2> "$MW_AUDIO_CONTROLS/outer.stderr"
          result=$?
          set -e
          "$MW_AUDIO_PYTHON" -B -I -X utf8 - "$MW_AUDIO_CONTROLS/outer-exit.json" "$result" <<'PY'
          import json,sys
          with open(sys.argv[1],"x",encoding="utf-8",newline="\n") as handle:
              json.dump({"exit_code":int(sys.argv[2]),"automatic_retry":False},handle,sort_keys=True)
              handle.write("\n")
          PY
          exit "$result"
      - name: Retain source originals for this exact attempt
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: audio-source-originals-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.MW_AUDIO_CONTROLS }}/*.json
            ${{ env.MW_AUDIO_CONTROLS }}/*.log
            ${{ env.MW_AUDIO_CONTROLS }}/*.stdout
            ${{ env.MW_AUDIO_CONTROLS }}/*.stderr
            ${{ env.MW_AUDIO_CONTROLS }}/*.txt
            ${{ env.MW_AUDIO_ORIGINALS }}
          if-no-files-found: error
          retention-days: 14

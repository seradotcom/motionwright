name: Linux WebKitGTK HTML text editable interface matrix
on:
  push:
    branches:
      - integrate/phase1-final-composition-20261027
    paths:
      - '.github/workflows/linux-webkit-html-editable-source.yml'
      - 'tooling/ci_linux_webkit_editable_matrix.py'
permissions:
  contents: read
jobs:
  html-input-a11y-matrix:
    if: github.repository == 'seradotcom/motionwright' && github.ref == 'refs/heads/integrate/phase1-final-composition-20261027' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install standalone WebKitGTK system GI and AT-SPI prerequisites
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 gir1.2-atspi-2.0 at-spi2-core libatk-adaptor libglib2.0-bin xvfb dbus-x11 x11-utils
          /usr/bin/python3 -B -E -s - <<'PY_ABI'
          import ast
          from pathlib import Path
          ast.parse(Path('tooling/ci_linux_webkit_editable_matrix.py').read_bytes())
          import gi
          gi.require_version('Gtk','3.0')
          gi.require_version('WebKit2','4.1')
          gi.require_version('Atspi','2.0')
          from gi.repository import Gtk,WebKit2,Atspi
          print('ubuntu-webkitgtk-gir-source-admitted=PASS')
          PY_ABI
      - name: Inspect five real GTK/WebKitGTK inputs in one fresh Xvfb session without mutation
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          scope="$RUNNER_TEMP/mw-webkit-input-matrix-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$scope"
          mkdir -m 700 "$scope"
          timeout -k 5s 75s xvfb-run -a -s "-screen 0 1440x940x24" dbus-run-session -- /usr/bin/python3 -B -E -s \
            tooling/ci_linux_webkit_editable_matrix.py \
            --ready "$scope/fixture-ready.json" --output "$scope/matrix.original.json"
      - name: Retain only original standalone widget interface observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-webkit-html-editable-matrix-original-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mw-webkit-input-matrix-${{ github.run_id }}-${{ github.run_attempt }}/matrix.original.json
            ${{ runner.temp }}/mw-webkit-input-matrix-${{ github.run_id }}-${{ github.run_attempt }}/fixture-ready.json
            ${{ runner.temp }}/mw-webkit-input-matrix-${{ github.run_id }}-${{ github.run_attempt }}/webkit-fixture-server.stdout
          if-no-files-found: warn
          retention-days: 30

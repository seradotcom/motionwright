name: Studio desktop verification build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/studio-desktop-verification-build.yml'

permissions:
  contents: read

jobs:
  linux-desktop:
    name: Build the Linux Studio development executable
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify source controls
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -B tooling/source_policy.py
          python -B tooling/public_surface_policy.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.98.1'
      - name: Install desktop build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libpipewire-0.3-dev pkg-config clang
      - name: Verify bounded native Film partitioning
        run: cargo test --locked -p motionwright-native --lib film::tests::long_film_partitions_native_observations_at_exact_scene_boundaries -- --exact
      - name: Build Studio with the embedded frontend
        run: |
          set -euo pipefail
          npm --prefix apps/studio ci --no-audit --no-fund
          (
            cd apps/desktop
            npm --prefix ../studio exec -- tauri build --debug --no-bundle
          )
          test -x target/debug/motionwright-desktop
          readelf -h target/debug/motionwright-desktop
          export OUTPUT="$RUNNER_TEMP/studio-desktop"
          mkdir "$OUTPUT"
          install -m 0755 target/debug/motionwright-desktop "$OUTPUT/motionwright-desktop"
          install -m 0644 LICENSE THIRD_PARTY_NOTICES.md "$OUTPUT/"
          python -B - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path

          root = Path(os.environ["OUTPUT"])
          files = {}
          for path in sorted(root.iterdir()):
              with path.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              files[path.name] = {"bytes": path.stat().st_size, "sha256": digest}
          assert set(files) == {"motionwright-desktop", "LICENSE", "THIRD_PARTY_NOTICES.md"}
          receipt = {
              "schema": "motionwright.desktop-verification-build/1",
              "source": os.environ["GITHUB_SHA"],
              "tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "platform": os.environ["RUNNER_OS"],
              "architecture": os.environ["RUNNER_ARCH"],
              "distribution": "development-executable-only",
              "files": files,
          }
          (root / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          PY
          tar -C "$OUTPUT" -czf "$RUNNER_TEMP/studio-desktop-linux-x64.tar.gz" motionwright-desktop LICENSE THIRD_PARTY_NOTICES.md receipt.json
      - name: Retain the verification executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-desktop-verification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/studio-desktop-linux-x64.tar.gz
          retention-days: 7
          if-no-files-found: error

name: Performance Acceptance Evidence

on:
  pull_request:
    paths:
      - "crates/domain/**"
      - "crates/storage/**"
      - "crates/service/**"
      - "apps/studio/**"
      - "apps/desktop/src-tauri/src/**"
      - "tooling/**"
      - "docs/testing.md"
      - "docs/audio.md"
      - ".github/workflows/performance-acceptance.yml"
  push:
    branches: ["main", "feat/**"]
    paths:
      - "crates/domain/**"
      - "crates/storage/**"
      - "crates/service/**"
      - "apps/studio/**"
      - "apps/desktop/src-tauri/src/**"
      - "tooling/**"
      - "docs/testing.md"
      - "docs/audio.md"
      - ".github/workflows/performance-acceptance.yml"
  workflow_dispatch:
    inputs:
      scope:
        description: Run all performance jobs, or only the one original UI selection case
        type: choice
        required: false
        default: all
        options:
          - all
          - ui
  schedule:
    - cron: "41 5 * * 2"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  revision-ten:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.scope == 'ui') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Source and acceptance policy
        run: |
          python3 tooling/source_policy.py
          python3 tooling/acceptance_policy.py
      - name: Reject fabricated creative stage-cost evidence
        run: python3 -m unittest discover -s tooling/tests -p test_creative_stage_cost.py -v
      - name: Reject first editable scene and ten-revision evidence tampering
        run: python3 -m unittest discover -s tooling/tests -p test_first_scene_reuse.py -v
      - name: Build revision-ten benchmark before runtime measurement
        run: |
          mkdir -p verification/performance
          git rev-parse HEAD > verification/performance/checkout-sha.txt
          git rev-parse 'HEAD^{tree}' > verification/performance/checkout-tree.txt
          status=0
          cargo build --locked -p motionwright-service --example acceptance_bench --release \
            > verification/performance/build.stdout.log 2> verification/performance/build.stderr.log || status=$?
          printf '%s\n' "$status" > verification/performance/build-exit-code.txt
          cat verification/performance/build.stdout.log
          cat verification/performance/build.stderr.log >&2
          exit "$status"
      - name: S M L × three unrelated briefs × revision ten
        env:
          MOTIONWRIGHT_LATENCY_BUDGET_MS: "2000"
        run: |
          mkdir -p verification/performance
          sha256sum target/release/examples/acceptance_bench > verification/performance/benchmark-sha256.txt
          status=0
          /usr/bin/time -v -o verification/performance/resource-usage.txt \
            target/release/examples/acceptance_bench \
            > verification/performance/report.json 2> verification/performance/stderr.log || status=$?
          printf '%s\n' "$status" > verification/performance/exit-code.txt
          cat verification/performance/stderr.log >&2
          exit "$status"
      - name: Validate evidence shape
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("verification/performance/report.json").read_text())
          assert report["schema"]=="motionwright.performance.v1"
          assert report["datasets"]==9 and report["briefs"]==3
          rows=report["results"]
          assert {r["size"] for r in rows}=={"S","M","L"}
          assert len({r["brief"] for r in rows})==3
          assert all(r["revision_delta"]==10 for r in rows)
          assert all(len(r["operations"])==10 for r in rows)
          assert all(r["fresh_store_open_micros"]>0 for r in rows)
          assert all(r["fresh_project_create_micros"]>0 for r in rows)
          assert all(0<r["first_editable_scene_micros"]<=r["seed_micros"] for r in rows)
          assert all(r["first_scene_preserved_after_revision_ten"] is True for r in rows)
          assert report["human_feedback"].startswith("NOT_RUN")
          assert report["comparative_claims"].startswith("NONE")
          cache=report["cache_evidence"]
          assert cache["implemented"] is True
          assert cache["lookup_attempts"]==9 and cache["hits"]==9
          assert cache["avoided_work_count"]==sum(r["scene_count"] for r in rows)
          assert cache["work_unit"]=="scene preview-index regeneration units"
          assert cache["validated_bytes"]>0
          assert all(r["cache"]["validated_bytes"]==r["cache"]["stored_bytes"] for r in rows)
          assert all(len(r["cache"]["fingerprint_sha256"])==64 for r in rows)
          print(
              "performance-evidence=ok datasets=9 revision-ten=10 "
              f"cache_hits={cache['hits']} declared_index_scene_units={cache['avoided_work_count']} "
              "human=NOT_RUN"
          )
          PY
      - name: Retain all revision-ten measurements after a forced budget failure
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          directory=Path("verification/performance/budget-failure")
          directory.mkdir(parents=True, exist_ok=True)
          environment={**os.environ, "MOTIONWRIGHT_LATENCY_BUDGET_MS": "0"}
          with (directory/"report.json").open("wb") as stdout, (directory/"stderr.log").open("wb") as stderr:
              result=subprocess.run(
                  ["target/release/examples/acceptance_bench"],
                  env=environment, stdout=stdout, stderr=stderr, check=False)
          (directory/"exit-code.txt").write_text(f"{result.returncode}\n", encoding="utf-8")
          diagnostic=(directory/"stderr.log").read_text(encoding="utf-8")
          assert result.returncode != 0, "zero budget unexpectedly passed"
          assert "measured commit budget exceeded:" in diagnostic
          report=json.loads((directory/"report.json").read_text(encoding="utf-8"))
          assert report["schema"]=="motionwright.performance.v1"
          assert report["source_sha"]==subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True).strip()
          assert report["latency_budget_ms"]==0
          assert report["datasets"]==9 and report["briefs"]==3
          rows=report["results"]
          expected={(brief, size, scenes)
                    for brief in ("harbor-safety", "museum-night", "bike-route")
                    for size, scenes in (("S", 8), ("M", 32), ("L", 96))}
          assert len(rows)==9
          assert {(r["brief"], r["size"], r["scene_count"]) for r in rows}==expected
          assert all(r["revision_delta"]==10 for r in rows)
          assert all(len(r["operations"])==10 for r in rows)
          assert all(len({op["name"] for op in r["operations"]})==10 for r in rows)
          assert all(r["max_commit_micros"]==max(op["micros"] for op in r["operations"])
                     for r in rows)
          assert any(r["max_commit_micros"]>0 for r in rows)
          assert all(r["first_scene_preserved_after_revision_ten"] is True for r in rows)
          assert all(r["reopen_micros"]>0 for r in rows)
          assert report["human_feedback"].startswith("NOT_RUN")
          assert report["comparative_claims"].startswith("NONE")
          print(f"expected-budget-failure=revision-ten exit={result.returncode} datasets=9 operations=90")
          PY
      - name: Account for measured creative stage costs without invented render savings
        run: |
          python3 tooling/creative_stage_cost.py \
            --input verification/performance/report.json \
            --source-sha "$(git rev-parse HEAD)" \
            --output verification/performance/creative-stage-cost.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("verification/performance/creative-stage-cost.json").read_text())
          assert report["schema"]=="motionwright.v05-creative-stage-cost/1"
          assert report["status"]=="BOUNDED_EDIT_COST_OBSERVED"
          assert report["dataset_count"]==9
          assert len(report["per_dataset"])==9
          assert report["cache_evidence"]["wallclock_render_time_saved_micros"] is None
          assert report["cache_evidence"]["actual_renderer_frames_avoided"] is None
          assert report["real_native_renderer_evaluated"]=="NOT_RUN"
          assert report["human_interaction_evaluated"]=="NOT_RUN"
          assert report["claims"]["release_ready"] is False
          print("creative-stage-cost=verified nine_datasets=9 no_false_render_speedup")
          PY
      - name: Bind technical first editable scene and reuse to source revision
        run: |
          python3 tooling/first_scene_reuse.py \
            --input verification/performance/report.json \
            --source-sha "$(git rev-parse HEAD)" \
            --output verification/performance/first-scene-reuse.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("verification/performance/first-scene-reuse.json").read_text())
          assert p["schema"]=="motionwright.v05-first-scene-reuse/1"
          assert p["source_sha"]==__import__("subprocess").check_output(
              ["git","rev-parse","HEAD"],text=True).strip()
          assert p["projects"]==9 and p["recorded_revisions_per_project"]==10
          assert p["first_scene_identity_preserved_across_reopen"] is True
          assert p["end_user_first_useful_result"]=="NOT_MEASURED"
          assert p["installed_desktop_first_frame"]=="NOT_MEASURED"
          assert p["human_first_use"]=="NOT_RUN"
          assert p["reuse"]["renderer_saved_wallclock_micros"] is None
          assert p["claims"]["release_ready"] is False
          print("first-scene-reuse=source_verified human=NOT_RUN first_value=NOT_MEASURED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-acceptance-evidence
          path: verification/performance
          if-no-files-found: error

  waveform-lazy:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.scope == 'ui') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Source and acceptance policy
        run: |
          python3 tooling/source_policy.py
          python3 tooling/acceptance_policy.py
      - name: Build bounded-memory waveform benchmark
        run: |
          mkdir -p verification/waveform
          git rev-parse HEAD > verification/waveform/checkout-sha.txt
          git rev-parse 'HEAD^{tree}' > verification/waveform/checkout-tree.txt
          status=0
          cargo build --locked -p motionwright-service --example waveform_bench --release \
            > verification/waveform/build.stdout.log 2> verification/waveform/build.stderr.log || status=$?
          printf '%s\n' "$status" > verification/waveform/build-exit-code.txt
          cat verification/waveform/build.stdout.log
          cat verification/waveform/build.stderr.log >&2
          exit "$status"
      - name: One-hour audio proxy and paged read
        run: |
          mkdir -p verification/waveform
          sha256sum target/release/examples/waveform_bench > verification/waveform/benchmark-sha256.txt
          status=0
          /usr/bin/time -v -o verification/waveform/resource-usage.txt \
            target/release/examples/waveform_bench \
            > verification/waveform/report.json 2> verification/waveform/stderr.log || status=$?
          printf '%s\n' "$status" > verification/waveform/exit-code.txt
          cat verification/waveform/stderr.log >&2
          exit "$status"
      - name: Validate lazy waveform evidence
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          report=json.loads(Path("verification/waveform/report.json").read_text())
          usage=Path("verification/waveform/resource-usage.txt").read_text()
          match=re.search(r"Maximum resident set size \(kbytes\):\s*(\d+)", usage)
          assert match, usage
          rss_kib=int(match.group(1))

          assert report["schema"]=="motionwright.waveform-performance.v1"
          assert report["duration_seconds"]==3600
          assert report["sample_rate_hz"]==8000 and report["channels"]==1
          assert report["source_bytes"]>50_000_000
          assert report["frames"]==28_800_000
          assert report["peak_count"]>10_000
          assert report["proxy_bytes"]<64*1024
          assert report["page_size"]==256
          assert report["first_page_peaks"]==256
          assert 0<report["distant_page_peaks"]<=256
          assert report["algorithm"]=="sample-peak-max-abs-v1"
          assert len(report["source_sha256"])==64
          assert rss_kib < 192*1024, f"RSS too high for paged waveform proxy: {rss_kib} KiB"
          assert report["cached_distant_page_micros"] < 2_000_000
          print(
              "waveform-evidence=ok duration=60m "
              f"source_bytes={report['source_bytes']} proxy_bytes={report['proxy_bytes']} "
              f"page_peaks={report['page_size']} rss_kib={rss_kib} "
              f"cached_page_us={report['cached_distant_page_micros']}"
          )
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: waveform-performance-evidence
          path: verification/waveform
          if-no-files-found: error

  responsiveness-service:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.scope == 'ui') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Source and acceptance policy
        run: |
          python3 tooling/source_policy.py
          python3 tooling/acceptance_policy.py
      - name: Build S-profile responsiveness benchmark
        run: |
          mkdir -p verification/responsiveness
          git rev-parse HEAD > verification/responsiveness/checkout-sha.txt
          git rev-parse 'HEAD^{tree}' > verification/responsiveness/checkout-tree.txt
          status=0
          cargo build --locked -p motionwright-service --example responsiveness_bench --release \
            > verification/responsiveness/build.stdout.log 2> verification/responsiveness/build.stderr.log || status=$?
          printf '%s\n' "$status" > verification/responsiveness/build-exit-code.txt
          cat verification/responsiveness/build.stdout.log
          cat verification/responsiveness/build.stderr.log >&2
          exit "$status"
      - name: Measure small commits and S-profile reopen
        env:
          MOTIONWRIGHT_SMALL_COMMIT_P95_BUDGET_MS: "250"
          MOTIONWRIGHT_S_REOPEN_BUDGET_MS: "2000"
        run: |
          mkdir -p verification/responsiveness
          sha256sum target/release/examples/responsiveness_bench > verification/responsiveness/benchmark-sha256.txt
          status=0
          /usr/bin/time -v -o verification/responsiveness/resource-usage.txt \
            target/release/examples/responsiveness_bench \
            > verification/responsiveness/service.json 2> verification/responsiveness/stderr.log || status=$?
          printf '%s\n' "$status" > verification/responsiveness/exit-code.txt
          cat verification/responsiveness/stderr.log >&2
          exit "$status"
      - name: Validate service responsiveness evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path("verification/responsiveness/service.json").read_text())
          assert report["schema"]=="motionwright.responsiveness.v1"
          dataset=report["dataset"]
          assert dataset["scenes"]==12
          assert dataset["beats"]==80
          assert dataset["canvas_nodes"]==300
          assert dataset["voice_seconds"]==300
          assert dataset["width"]==1920 and dataset["height"]==1080
          assert dataset["frame_rate"]=="30/1"
          commit=report["small_commit"]
          assert commit["samples"]==40
          assert len(commit["samples_micros"])==40
          assert commit["budget_ms"]==250
          assert commit["p95_micros"] < 250_000
          assert report["reopen_budget_ms"]==2000
          assert report["reopen_micros"] < 2_000_000
          assert report["human_feedback"].startswith("NOT_RUN")
          assert report["comparative_claims"].startswith("NONE")
          print(
              "responsiveness-service=ok "
              f"commit_p95_us={commit['p95_micros']} "
              f"reopen_us={report['reopen_micros']} "
              f"db_bytes={report['database_bytes']}"
          )
          PY
      - name: Retain all responsiveness measurements after each forced budget failure
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          cases=(
              ("commit-budget-failure", "0", "2000", "S-profile small commit p95 "),
              ("reopen-budget-failure", "60000", "0", "S-profile reopen "),
          )
          for label, commit_budget, reopen_budget, expected_diagnostic in cases:
              directory=Path("verification/responsiveness")/label
              directory.mkdir(parents=True, exist_ok=True)
              environment={
                  **os.environ,
                  "MOTIONWRIGHT_SMALL_COMMIT_P95_BUDGET_MS": commit_budget,
                  "MOTIONWRIGHT_S_REOPEN_BUDGET_MS": reopen_budget,
              }
              with (directory/"report.json").open("wb") as stdout, (directory/"stderr.log").open("wb") as stderr:
                  result=subprocess.run(
                      ["target/release/examples/responsiveness_bench"],
                      env=environment, stdout=stdout, stderr=stderr, check=False)
              (directory/"exit-code.txt").write_text(f"{result.returncode}\n", encoding="utf-8")
              diagnostic=(directory/"stderr.log").read_text(encoding="utf-8")
              assert result.returncode != 0, f"{label} unexpectedly passed"
              assert expected_diagnostic in diagnostic and "exceeds 0us budget" in diagnostic
              report=json.loads((directory/"report.json").read_text(encoding="utf-8"))
              assert report["schema"]=="motionwright.responsiveness.v1"
              assert report["source_sha"]==subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True).strip()
              dataset=report["dataset"]
              assert (dataset["scenes"], dataset["beats"], dataset["canvas_nodes"])==(12, 80, 300)
              assert (dataset["voice_seconds"], dataset["voice_sample_rate_hz"])==(300, 8000)
              assert (dataset["width"], dataset["height"], dataset["frame_rate"])==(1920, 1080, "30/1")
              commit=report["small_commit"]
              samples=commit["samples_micros"]
              assert commit["samples"]==40 and len(samples)==40
              assert all(type(value) is int and value>=0 for value in samples)
              assert commit["p95_micros"]==sorted(samples)[37]
              assert commit["max_micros"]==max(samples)
              assert commit["budget_ms"]==int(commit_budget)
              assert report["reopen_budget_ms"]==int(reopen_budget)
              assert report["reopen_micros"]>0
              if label=="reopen-budget-failure":
                  assert commit["p95_micros"]<int(commit_budget)*1000
              assert report["human_feedback"].startswith("NOT_RUN")
              assert report["comparative_claims"].startswith("NONE")
              print(f"expected-budget-failure={label} exit={result.returncode} samples=40 reopen=recorded")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsiveness-service-evidence
          path: verification/responsiveness
          if-no-files-found: error

  ui-selection:
    runs-on: ubuntu-24.04
    # Explicit UI observations are not cancelled by later requests or retried.
    concurrency:
      group: performance-ui-${{ github.run_id }}
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Check Actions syntax and contexts with pinned actionlint
        id: actions_schema
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python3 -I -B -S - <<'PY'
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import subprocess
          import tarfile
          import urllib.request

          VERSION = '1.7.12'
          URL = 'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz'
          ARCHIVE_SHA256 = '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'

          def require(ok, message):
              if not ok:
                  raise ValueError(message)

          def read(path, limit=16 * 1024 * 1024):
              path = Path(path).absolute()
              for component in (path, *path.parents):
                  info = component.lstat()
                  require(not stat.S_ISLNK(info.st_mode), 'Linked source or tool evidence')
              before = path.stat()
              require(stat.S_ISREG(before.st_mode) and 0 <= before.st_size <= limit, 'Unbounded input')
              with path.open('rb') as stream:
                  opened = os.fstat(stream.fileno())
                  raw = stream.read(before.st_size + 1)
                  closed = os.fstat(stream.fileno())
              signature = lambda value: (value.st_dev, value.st_ino, value.st_size, value.st_mtime_ns)
              require(signature(before) == signature(opened) == signature(closed) == signature(path.stat())
                      and len(raw) == before.st_size, 'Input changed while read')
              return raw

          def identity(raw):
              return {'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()}

          context = {name: os.environ.get(name, '') for name in ('GITHUB_SHA', 'GITHUB_WORKFLOW_SHA', 'GITHUB_WORKFLOW_REF',
                     'GITHUB_REPOSITORY', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB')}
          require(all(context.values()), 'Incomplete workflow execution identity')
          require(re.fullmatch(r'[0-9a-f]{40}', context['GITHUB_SHA']) and re.fullmatch(r'[0-9a-f]{40}', context['GITHUB_WORKFLOW_SHA']),
                  'Missing exact source and verifier identity')
          require(all(context[name].isdecimal() and int(context[name]) > 0 for name in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT'))
                  and re.fullmatch(r'[A-Za-z0-9_-]+', context['GITHUB_JOB']), 'Invalid run or job identity')
          repo = Path(os.environ['GITHUB_WORKSPACE']).absolute()
          output = Path(os.environ['RUNNER_TEMP']).absolute() / 'motionwright-actionlint' / (
              context['GITHUB_RUN_ID'] + '-' + context['GITHUB_RUN_ATTEMPT'] + '-' + context['GITHUB_JOB'])
          require(repo not in (output, *output.parents), 'Tool output must be outside checkout')
          for part in output.parents:
              if part.exists() or part.is_symlink():
                  require(part.is_dir() and not part.is_symlink(), 'Linked output ancestor')
          output.mkdir(parents=True, exist_ok=False)

          def write(name, raw):
              with (output / name).open('xb') as stream:
                  require(stream.write(raw) == len(raw), 'Short retained write')
                  stream.flush()
                  os.fsync(stream.fileno())
              require(read(output / name) == raw, 'Retained write readback differs')

          def save(name, value):
              write(name, (json.dumps(value, sort_keys=True, indent=2, allow_nan=False) + '\n').encode())

          environment = {key: value for key, value in os.environ.items() if not key.upper().startswith('GIT_')}
          environment.update(GIT_NO_REPLACE_OBJECTS='1', GIT_GRAFT_FILE=os.devnull, GIT_NO_LAZY_FETCH='1',
                             GIT_CONFIG_NOSYSTEM='1', GIT_CONFIG_GLOBAL=os.devnull, GIT_OPTIONAL_LOCKS='0')

          def git(*args):
              process = subprocess.run(['git', '--no-replace-objects', '-c', 'core.fsmonitor=false', '-C', str(repo), *args],
                                       env=environment, capture_output=True, timeout=45)
              require(process.returncode == 0, 'Original Git source read failed')
              return process.stdout

          result = {'schema': 'motionwright.actionlint-g0-result/1', 'execution_context': context,
                    'tool_version': VERSION, 'archive_url': URL, 'expected_archive_sha256': ARCHIVE_SHA256,
                    'original_exit_code': None, 'state': 'NOT_ADMITTED', 'test_case_results_admitted': False,
                    'product_or_native_execution': False, 'formal_acceptance': False}
          try:
              sha = context['GITHUB_SHA']
              require(git('rev-parse', 'HEAD').decode().strip() == sha, 'Checkout SHA differs')
              require(not git('status', '--porcelain=v1', '--untracked-files=all', '--ignored=matching'), 'Source checkout is not clean')
              commit = git('cat-file', 'commit', sha)
              require(hashlib.sha1(b'commit ' + str(len(commit)).encode() + b'\0' + commit).hexdigest() == sha, 'Raw commit differs')
              result['source_commit'] = identity(commit)
              trees = [line[5:].decode() for line in commit.split(b'\n\n', 1)[0].splitlines() if line.startswith(b'tree ')]
              require(len(trees) == 1 and re.fullmatch(r'[0-9a-f]{40}', trees[0]), 'Missing original tree')
              result['source_tree'] = trees[0]
              inputs = {}
              for row in git('ls-tree', '-rz', sha, '--', '.github/workflows').split(b'\0'):
                  if not row:
                      continue
                  metadata, name = row.split(b'\t', 1)
                  name = name.decode('utf-8')
                  if not name.endswith(('.yml', '.yaml')):
                      continue
                  mode, kind, oid = metadata.decode().split()
                  require(name.count('/') == 2 and mode in ('100644', '100755') and kind == 'blob', 'Nonregular workflow input')
                  raw = read(repo / name)
                  require(hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == oid, 'Raw workflow blob differs')
                  inputs[name] = {'git_blob': oid, **identity(raw)}
              require(inputs, 'No original workflows selected')
              save('inputs.json', {'execution_context': context, 'source_tree': trees[0], 'workflows': inputs})
              with urllib.request.urlopen(URL, timeout=30) as response:
                  archive = response.read(8 * 1024 * 1024 + 1)
              require(len(archive) == 2353908 and hashlib.sha256(archive).hexdigest() == ARCHIVE_SHA256, 'Actionlint archive identity differs')
              result['archive'] = identity(archive)
              with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as bundle:
                  members = [item for item in bundle.getmembers() if item.name == 'actionlint']
                  require(len(members) == 1 and members[0].isfile() and 0 < members[0].size <= 16 * 1024 * 1024,
                          'Missing bounded actionlint executable')
                  with bundle.extractfile(members[0]) as stream:
                      executable = stream.read(members[0].size + 1)
                  require(len(executable) == members[0].size, 'Truncated actionlint executable')
              write('actionlint', executable)
              binary = output / 'actionlint'
              binary.chmod(0o700)
              result['executable'] = identity(executable)
              version = subprocess.run([str(binary), '-version'], env=environment, capture_output=True, timeout=15)
              write('version.stdout.log', version.stdout)
              write('version.stderr.log', version.stderr)
              result['version_exit_code'] = version.returncode
              require(version.returncode == 0 and version.stdout.splitlines()[0] == VERSION.encode(), 'Actionlint version differs')
              # Empty explicit configuration prevents hidden per-path ignores.
              # Shell/Python checks retain their existing gates and budgets.
              write('no-ignores.yml', b'{}\n')
              result['configuration'] = identity(b'{}\n')
              command = [str(binary), '-oneline', '-shellcheck=', '-pyflakes=', '-config-file', str(output / 'no-ignores.yml'), *sorted(inputs)]
              save('intent.json', {'execution_context': context, 'source_tree': trees[0], 'command': command,
                                  'input_count': len(inputs), 'state': 'NOT_COMPLETED', 'retry_attempted': False})
              with (output / 'stdout.log').open('xb') as stdout, (output / 'stderr.log').open('xb') as stderr:
                  process = subprocess.run(command, cwd=repo, env=environment, stdout=stdout, stderr=stderr, timeout=120)
                  result['original_exit_code'] = process.returncode
              result['stdout'] = identity(read(output / 'stdout.log'))
              result['stderr'] = identity(read(output / 'stderr.log'))
              require(git('rev-parse', 'HEAD').decode().strip() == sha
                      and not git('status', '--porcelain=v1', '--untracked-files=all', '--ignored=matching'), 'Source changed during syntax validation')
              require(all(identity(read(repo / name)) == {key: value for key, value in data.items() if key != 'git_blob'}
                          for name, data in inputs.items()), 'Workflow input changed during syntax validation')
              require(identity(read(binary)) == result['executable'], 'Actionlint executable changed')
              require(read(output / 'no-ignores.yml') == b'{}\n', 'Actionlint configuration changed')
              result['input_count'] = len(inputs)
              result['state'] = 'ACTIONS_SYNTAX_AND_CONTEXTS_VALID' if process.returncode == 0 else 'ACTIONLINT_FAILED'
          except subprocess.TimeoutExpired as error:
              result['state'] = 'READ_ONLY_TOOL_UNKNOWN'
              result['error'] = type(error).__name__
          except (OSError, ValueError, KeyError, TypeError, IndexError, tarfile.TarError, subprocess.SubprocessError) as error:
              result['error'] = type(error).__name__ + ': ' + str(error)
          save('result.json', result)
          print(json.dumps(result, sort_keys=True, allow_nan=False))
          code = result['original_exit_code']
          raise SystemExit(code if type(code) is int and code > 0 else 128 - code if type(code) is int and code < 0 else
                           0 if result['state'] == 'ACTIONS_SYNTAX_AND_CONTEXTS_VALID' else 2)
          PY
      - name: Source and acceptance policy before UI dependencies
        working-directory: .
        run: |
          python3 -B tooling/source_policy.py
          python3 -B tooling/acceptance_policy.py
      - name: Reject stale, omitted or fabricated UI observations and conformance evidence
        id: ui_evidence_guards
        working-directory: .
        run: >-
          python3 -I -B tooling/ci_test_runner.py
          --repo "$GITHUB_WORKSPACE" --mode both --require-complete
          --pattern test_ui_performance_evidence.py
          --pattern test_acceptance_policy.py
          --pattern test_conformance_policy.py
          --expected-source "$GITHUB_SHA"
          --report "$RUNNER_TEMP/ui-performance-g0/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB/result.json"
      - name: Retain the original UI evidence guard results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && (steps.ui_evidence_guards.outcome == 'success' || steps.ui_evidence_guards.outcome == 'failure' || steps.ui_evidence_guards.outcome == 'cancelled') }}
        with:
          name: ui-performance-g0-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ runner.temp }}/ui-performance-g0/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          if-no-files-found: error
      - name: Retain Actions syntax inputs and original result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && (steps.actions_schema.outcome == 'success' || steps.actions_schema.outcome == 'failure' || steps.actions_schema.outcome == 'cancelled') }}
        with:
          name: ui-performance-actionlint-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ runner.temp }}/motionwright-actionlint/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          if-no-files-found: error
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Retain one explicit UI performance command
        id: ui_command
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'ui' }}
        working-directory: ${{ runner.temp }}
        env:
          MW_UI_PERFORMANCE_SCOPE: ${{ inputs.scope }}
        run: >-
          python3 -I -B -S "$GITHUB_WORKSPACE/tooling/ui_performance_evidence.py" capture
          --repo "$GITHUB_WORKSPACE"
          --output "$RUNNER_TEMP/ui-performance-original/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
      - name: Admit only the original single-case UI measurement without omissions
        id: ui_admission
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.scope == 'ui' && (steps.ui_command.outcome == 'success' || steps.ui_command.outcome == 'failure' || steps.ui_command.outcome == 'cancelled') }}
        working-directory: ${{ runner.temp }}
        env:
          MW_UI_PERFORMANCE_SCOPE: ${{ inputs.scope }}
          MW_UI_COMMAND_STATUS: ${{ steps.ui_command.outcome }}
          MW_UI_JOB_STATUS: ${{ job.status }}
        run: >-
          python3 -I -B -S "$GITHUB_WORKSPACE/tooling/ui_performance_evidence.py" verify
          --repo "$GITHUB_WORKSPACE"
          --output "$RUNNER_TEMP/ui-performance-original/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          --command-step-status "$MW_UI_COMMAND_STATUS" --job-status "$MW_UI_JOB_STATUS"
      - name: Retain original UI command, samples, attachment and failure outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.scope == 'ui' && (steps.ui_command.outcome == 'success' || steps.ui_command.outcome == 'failure' || steps.ui_command.outcome == 'cancelled') }}
        with:
          name: ui-performance-original-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ui-performance-original/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          if-no-files-found: error
          include-hidden-files: true
      - name: Measure selection to inspector paint
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.scope == 'ui') }}
        env:
          MOTIONWRIGHT_PERF_ACCEPTANCE: "1"
          MOTIONWRIGHT_UI_PERF_REPORT: "../../verification/responsiveness/ui-selection.json"
        run: npx playwright test tests/performance.spec.ts
      - name: Validate UI responsiveness evidence
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.scope == 'ui') }}
        run: |
          cd ../..
          python3 - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path("verification/responsiveness/ui-selection.json").read_text())
          assert report["schema"]=="motionwright.ui-selection.v1"
          assert report["dataset"]["scenes"]==12
          assert report["dataset"]["samples"]==60
          assert report["budget_ms"]==100
          assert report["p95_ms"] < 100
          print(
              "responsiveness-ui=ok "
              f"selection_p95_ms={report['p95_ms']:.3f} "
              f"selection_max_ms={report['max_ms']:.3f}"
          )
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.scope == 'ui') }}
        with:
          name: responsiveness-ui-evidence
          path: |
            verification/responsiveness/ui-selection.json
            apps/studio/test-results
          if-no-files-found: ignore

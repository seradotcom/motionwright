name: Performance Acceptance Evidence

on:
  pull_request:
    paths:
      - "crates/domain/**"
      - "crates/storage/**"
      - "crates/service/**"
      - "apps/studio/**"
      - "apps/desktop/src-tauri/src/**"
      - "tooling/**"
      - "docs/testing.md"
      - "docs/audio.md"
      - ".github/workflows/performance-acceptance.yml"
  push:
    branches: ["main", "feat/**", "verify/performance-cache-consumer-*"]
    paths:
      - "crates/domain/**"
      - "crates/storage/**"
      - "crates/service/**"
      - "apps/studio/**"
      - "apps/desktop/src-tauri/src/**"
      - "tooling/**"
      - "docs/testing.md"
      - "docs/audio.md"
      - ".github/workflows/performance-acceptance.yml"
  workflow_dispatch:
    inputs:
      selection:
        description: "Historical four-job compatibility, or the reviewed cache consumer only"
        type: choice
        options: [historical, cache-consumer]
        default: historical
      reviewed_source:
        description: "Required for cache-consumer: exact reviewed 40-character SHA of this workflow"
        type: string
        default: ""
  schedule:
    - cron: "41 5 * * 2"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  revision-ten:
    if: >-
      ${{ (github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/verify/performance-cache-consumer-')) &&
          (github.event_name != 'workflow_dispatch' || inputs.selection == 'historical') }}
    runs-on: ubuntu-24.04
    env:
      MOTIONWRIGHT_BENCH_ARTIFACT_ROOT: ${{ github.workspace }}/verification/performance/originals
      MOTIONWRIGHT_REFERENCE_PROFILES: "historical"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Source and acceptance policy
        run: |
          python3 tooling/source_policy.py
          python3 tooling/acceptance_policy.py
      - name: Reject fabricated creative stage-cost evidence
        run: python3 -m unittest discover -s tooling/tests -p test_creative_stage_cost.py -v
      - name: Reject first editable scene and ten-revision evidence tampering
        run: python3 -m unittest discover -s tooling/tests -p test_first_scene_reuse.py -v
      - name: Build revision-ten benchmark before runtime measurement
        run: |
          mkdir -p verification/performance
          git rev-parse HEAD > verification/performance/checkout-sha.txt
          git rev-parse 'HEAD^{tree}' > verification/performance/checkout-tree.txt
          test "$(cat verification/performance/checkout-sha.txt)" = "$GITHUB_SHA"
          git diff --exit-code HEAD -- Cargo.lock crates/service/examples/acceptance_bench.rs crates/service/examples/responsiveness_bench.rs
          RUSTC_VERSION="$(rustc --version)"
          export RUSTC_VERSION
          printf '%s\n' "$RUSTC_VERSION" > verification/performance/compiler-version.txt
          printf 'RUSTC_VERSION=%s\n' "$RUSTC_VERSION" >> "$GITHUB_ENV"
          sha256sum Cargo.lock > verification/performance/cargo-lock-before.sha256
          status=0
          cargo build --locked -p motionwright-service --example acceptance_bench --release \
            > verification/performance/build.stdout.log 2> verification/performance/build.stderr.log || status=$?
          printf '%s\n' "$status" > verification/performance/build-exit-code.txt
          cat verification/performance/build.stdout.log
          cat verification/performance/build.stderr.log >&2
          if [ "$status" -eq 0 ]; then
            sha256sum --check verification/performance/cargo-lock-before.sha256
          fi
          exit "$status"
      - name: S M L × three unrelated briefs × revision ten
        env:
          MOTIONWRIGHT_LATENCY_BUDGET_MS: "2000"
        run: |
          mkdir -p verification/performance
          sha256sum target/release/examples/acceptance_bench > verification/performance/benchmark-sha256.txt
          cp target/release/examples/acceptance_bench verification/performance/acceptance_bench
          status=0
          /usr/bin/time -v -o verification/performance/resource-usage.txt \
            target/release/examples/acceptance_bench \
            > verification/performance/report.json 2> verification/performance/stderr.log || status=$?
          printf '%s\n' "$status" > verification/performance/exit-code.txt
          cat verification/performance/stderr.log >&2
          exit "$status"
      - name: Validate evidence shape
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("verification/performance/report.json").read_text())
          assert report["schema"]=="motionwright.performance.v1"
          import hashlib
          import os
          expected_sha=Path("verification/performance/checkout-sha.txt").read_text().strip()
          expected_compiler=Path("verification/performance/compiler-version.txt").read_text().strip()
          assert expected_sha==os.environ["GITHUB_SHA"]
          assert expected_compiler.startswith("rustc ") and expected_compiler==os.environ["RUSTC_VERSION"]
          assert report["source_sha"]==expected_sha
          assert report["source_binding_consistent"] is True
          assert report["source_attribution_verified"] is False
          binary=Path("target/release/examples/acceptance_bench")
          retained_binary=Path("verification/performance/acceptance_bench")
          binary_sha=hashlib.sha256(binary.read_bytes()).hexdigest()
          assert hashlib.sha256(retained_binary.read_bytes()).hexdigest()==binary_sha
          for context in (report["source_context"]["before"], report["source_context"]["after"]):
              assert context["source_sha_compiled"]==expected_sha
              assert context["source_sha_runtime"]==expected_sha
              assert context["compiler_version"]==expected_compiler
              assert context["executable"]["sha256"]==binary_sha
              assert context["executable"]["size_bytes"]==binary.stat().st_size
          assert report["datasets"]==9 and report["briefs"]==3
          rows=report["results"]
          assert {r["size"] for r in rows}=={"S","M","L"}
          assert len({r["brief"] for r in rows})==3
          assert all(r["revision_delta"]==10 for r in rows)
          assert all(len(r["operations"])==10 for r in rows)
          assert all(r["fresh_store_open_micros"]>0 for r in rows)
          assert all(r["fresh_project_create_micros"]>0 for r in rows)
          assert all(0<r["first_editable_scene_micros"]<=r["seed_micros"] for r in rows)
          assert all(r["first_scene_preserved_after_revision_ten"] is True for r in rows)
          assert report["human_feedback"].startswith("NOT_RUN")
          assert report["comparative_claims"].startswith("NONE")
          cache=report["cache_evidence"]
          assert cache["implemented"] is True
          assert cache["lookup_attempts"]==9 and cache["hits"]==9
          assert cache["avoided_work_count"]==sum(r["scene_count"] for r in rows)
          assert cache["work_unit"]=="scene preview-index regeneration units"
          assert cache["validated_bytes"]>0
          assert all(r["cache"]["validated_bytes"]==r["cache"]["stored_bytes"] for r in rows)
          assert all(len(r["cache"]["fingerprint_sha256"])==64 for r in rows)
          print(
              "performance-evidence=ok datasets=9 revision-ten=10 "
              f"cache_hits={cache['hits']} declared_index_scene_units={cache['avoided_work_count']} "
              "human=NOT_RUN"
          )
          PY
      - name: Retain all revision-ten measurements after a forced budget failure
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          directory=Path("verification/performance/budget-failure")
          directory.mkdir(parents=True, exist_ok=True)
          environment={**os.environ, "MOTIONWRIGHT_LATENCY_BUDGET_MS": "0",
                       "MOTIONWRIGHT_BENCH_ARTIFACT_ROOT": str((directory/"originals").resolve())}
          with (directory/"report.json").open("wb") as stdout, (directory/"stderr.log").open("wb") as stderr:
              result=subprocess.run(
                  ["target/release/examples/acceptance_bench"],
                  env=environment, stdout=stdout, stderr=stderr, check=False)
          (directory/"exit-code.txt").write_text(f"{result.returncode}\n", encoding="utf-8")
          diagnostic=(directory/"stderr.log").read_text(encoding="utf-8")
          assert result.returncode != 0, "zero budget unexpectedly passed"
          assert "measured commit budget exceeded:" in diagnostic
          report=json.loads((directory/"report.json").read_text(encoding="utf-8"))
          assert report["schema"]=="motionwright.performance.v1"
          import hashlib
          import os
          expected_sha=Path("verification/performance/checkout-sha.txt").read_text().strip()
          expected_compiler=Path("verification/performance/compiler-version.txt").read_text().strip()
          assert expected_sha==os.environ["GITHUB_SHA"]
          assert expected_compiler.startswith("rustc ") and expected_compiler==os.environ["RUSTC_VERSION"]
          assert report["source_sha"]==expected_sha
          assert report["source_binding_consistent"] is True
          assert report["source_attribution_verified"] is False
          binary=Path("target/release/examples/acceptance_bench")
          retained_binary=Path("verification/performance/acceptance_bench")
          binary_sha=hashlib.sha256(binary.read_bytes()).hexdigest()
          assert hashlib.sha256(retained_binary.read_bytes()).hexdigest()==binary_sha
          for context in (report["source_context"]["before"], report["source_context"]["after"]):
              assert context["source_sha_compiled"]==expected_sha
              assert context["source_sha_runtime"]==expected_sha
              assert context["compiler_version"]==expected_compiler
              assert context["executable"]["sha256"]==binary_sha
              assert context["executable"]["size_bytes"]==binary.stat().st_size
          assert report["source_sha"]==subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True).strip()
          assert report["latency_budget_ms"]==0
          assert report["datasets"]==9 and report["briefs"]==3
          rows=report["results"]
          expected={(brief, size, scenes)
                    for brief in ("harbor-safety", "museum-night", "bike-route")
                    for size, scenes in (("S", 8), ("M", 32), ("L", 96))}
          assert len(rows)==9
          assert {(r["brief"], r["size"], r["scene_count"]) for r in rows}==expected
          assert all(r["revision_delta"]==10 for r in rows)
          assert all(len(r["operations"])==10 for r in rows)
          assert all(len({op["name"] for op in r["operations"]})==10 for r in rows)
          assert all(r["max_commit_micros"]==max(op["micros"] for op in r["operations"])
                     for r in rows)
          assert any(r["max_commit_micros"]>0 for r in rows)
          assert all(r["first_scene_preserved_after_revision_ten"] is True for r in rows)
          assert all(r["reopen_micros"]>0 for r in rows)
          assert report["human_feedback"].startswith("NOT_RUN")
          assert report["comparative_claims"].startswith("NONE")
          print(f"expected-budget-failure=revision-ten exit={result.returncode} datasets=9 operations=90")
          PY
      - name: Account for measured creative stage costs without invented render savings
        run: |
          python3 tooling/creative_stage_cost.py \
            --input verification/performance/report.json \
            --source-sha "$(git rev-parse HEAD)" \
            --output verification/performance/creative-stage-cost.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("verification/performance/creative-stage-cost.json").read_text())
          assert report["schema"]=="motionwright.v05-creative-stage-cost/1"
          assert report["status"]=="BOUNDED_EDIT_COST_OBSERVED"
          assert report["dataset_count"]==9
          assert len(report["per_dataset"])==9
          assert report["cache_evidence"]["wallclock_render_time_saved_micros"] is None
          assert report["cache_evidence"]["actual_renderer_frames_avoided"] is None
          assert report["real_native_renderer_evaluated"]=="NOT_RUN"
          assert report["human_interaction_evaluated"]=="NOT_RUN"
          assert report["claims"]["release_ready"] is False
          print("creative-stage-cost=verified nine_datasets=9 no_false_render_speedup")
          PY
      - name: Bind technical first editable scene and reuse to source revision
        run: |
          python3 tooling/first_scene_reuse.py \
            --input verification/performance/report.json \
            --source-sha "$(git rev-parse HEAD)" \
            --output verification/performance/first-scene-reuse.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("verification/performance/first-scene-reuse.json").read_text())
          assert p["schema"]=="motionwright.v05-first-scene-reuse/1"
          assert p["source_sha"]==__import__("subprocess").check_output(
              ["git","rev-parse","HEAD"],text=True).strip()
          assert p["projects"]==9 and p["recorded_revisions_per_project"]==10
          assert p["first_scene_identity_preserved_across_reopen"] is True
          assert p["end_user_first_useful_result"]=="NOT_MEASURED"
          assert p["installed_desktop_first_frame"]=="NOT_MEASURED"
          assert p["human_first_use"]=="NOT_RUN"
          assert p["reuse"]["renderer_saved_wallclock_micros"] is None
          assert p["claims"]["release_ready"] is False
          print("first-scene-reuse=source_verified human=NOT_RUN first_value=NOT_MEASURED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-acceptance-evidence
          path: verification/performance
          if-no-files-found: error

  waveform-lazy:
    if: >-
      ${{ (github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/verify/performance-cache-consumer-')) &&
          (github.event_name != 'workflow_dispatch' || inputs.selection == 'historical') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Source and acceptance policy
        run: |
          python3 tooling/source_policy.py
          python3 tooling/acceptance_policy.py
      - name: Build bounded-memory waveform benchmark
        run: |
          mkdir -p verification/waveform
          git rev-parse HEAD > verification/waveform/checkout-sha.txt
          git rev-parse 'HEAD^{tree}' > verification/waveform/checkout-tree.txt
          status=0
          cargo build -p motionwright-service --example waveform_bench --release \
            > verification/waveform/build.stdout.log 2> verification/waveform/build.stderr.log || status=$?
          printf '%s\n' "$status" > verification/waveform/build-exit-code.txt
          cat verification/waveform/build.stdout.log
          cat verification/waveform/build.stderr.log >&2
          exit "$status"
      - name: One-hour audio proxy and paged read
        run: |
          mkdir -p verification/waveform
          sha256sum target/release/examples/waveform_bench > verification/waveform/benchmark-sha256.txt
          status=0
          /usr/bin/time -v -o verification/waveform/resource-usage.txt \
            target/release/examples/waveform_bench \
            > verification/waveform/report.json 2> verification/waveform/stderr.log || status=$?
          printf '%s\n' "$status" > verification/waveform/exit-code.txt
          cat verification/waveform/stderr.log >&2
          exit "$status"
      - name: Validate lazy waveform evidence
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          report=json.loads(Path("verification/waveform/report.json").read_text())
          usage=Path("verification/waveform/resource-usage.txt").read_text()
          match=re.search(r"Maximum resident set size \(kbytes\):\s*(\d+)", usage)
          assert match, usage
          rss_kib=int(match.group(1))

          assert report["schema"]=="motionwright.waveform-performance.v1"
          assert report["duration_seconds"]==3600
          assert report["sample_rate_hz"]==8000 and report["channels"]==1
          assert report["source_bytes"]>50_000_000
          assert report["frames"]==28_800_000
          assert report["peak_count"]>10_000
          assert report["proxy_bytes"]<64*1024
          assert report["page_size"]==256
          assert report["first_page_peaks"]==256
          assert 0<report["distant_page_peaks"]<=256
          assert report["algorithm"]=="sample-peak-max-abs-v1"
          assert len(report["source_sha256"])==64
          assert rss_kib < 192*1024, f"RSS too high for paged waveform proxy: {rss_kib} KiB"
          assert report["cached_distant_page_micros"] < 2_000_000
          print(
              "waveform-evidence=ok duration=60m "
              f"source_bytes={report['source_bytes']} proxy_bytes={report['proxy_bytes']} "
              f"page_peaks={report['page_size']} rss_kib={rss_kib} "
              f"cached_page_us={report['cached_distant_page_micros']}"
          )
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: waveform-performance-evidence
          path: verification/waveform
          if-no-files-found: error

  responsiveness-service:
    if: >-
      ${{ (github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/verify/performance-cache-consumer-')) &&
          (github.event_name != 'workflow_dispatch' || inputs.selection == 'historical') }}
    runs-on: ubuntu-24.04
    env:
      MOTIONWRIGHT_BENCH_ARTIFACT_ROOT: ${{ github.workspace }}/verification/responsiveness/originals
      MOTIONWRIGHT_RESPONSIVENESS_PROFILE: "S"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Source and acceptance policy
        run: |
          python3 tooling/source_policy.py
          python3 tooling/acceptance_policy.py
      - name: Build S-profile responsiveness benchmark
        run: |
          mkdir -p verification/responsiveness
          git rev-parse HEAD > verification/responsiveness/checkout-sha.txt
          git rev-parse 'HEAD^{tree}' > verification/responsiveness/checkout-tree.txt
          test "$(cat verification/responsiveness/checkout-sha.txt)" = "$GITHUB_SHA"
          git diff --exit-code HEAD -- Cargo.lock crates/service/examples/acceptance_bench.rs crates/service/examples/responsiveness_bench.rs
          RUSTC_VERSION="$(rustc --version)"
          export RUSTC_VERSION
          printf '%s\n' "$RUSTC_VERSION" > verification/responsiveness/compiler-version.txt
          printf 'RUSTC_VERSION=%s\n' "$RUSTC_VERSION" >> "$GITHUB_ENV"
          sha256sum Cargo.lock > verification/responsiveness/cargo-lock-before.sha256
          status=0
          cargo build --locked -p motionwright-service --example responsiveness_bench --release \
            > verification/responsiveness/build.stdout.log 2> verification/responsiveness/build.stderr.log || status=$?
          printf '%s\n' "$status" > verification/responsiveness/build-exit-code.txt
          cat verification/responsiveness/build.stdout.log
          cat verification/responsiveness/build.stderr.log >&2
          if [ "$status" -eq 0 ]; then
            sha256sum --check verification/responsiveness/cargo-lock-before.sha256
          fi
          exit "$status"
      - name: Measure small commits and S-profile reopen
        env:
          MOTIONWRIGHT_SMALL_COMMIT_P95_BUDGET_MS: "250"
          MOTIONWRIGHT_S_REOPEN_BUDGET_MS: "2000"
        run: |
          mkdir -p verification/responsiveness
          sha256sum target/release/examples/responsiveness_bench > verification/responsiveness/benchmark-sha256.txt
          cp target/release/examples/responsiveness_bench verification/responsiveness/responsiveness_bench
          status=0
          /usr/bin/time -v -o verification/responsiveness/resource-usage.txt \
            target/release/examples/responsiveness_bench \
            > verification/responsiveness/service.json 2> verification/responsiveness/stderr.log || status=$?
          printf '%s\n' "$status" > verification/responsiveness/exit-code.txt
          cat verification/responsiveness/stderr.log >&2
          exit "$status"
      - name: Validate service responsiveness evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path("verification/responsiveness/service.json").read_text())
          assert report["schema"]=="motionwright.responsiveness.v1"
          import hashlib
          import os
          expected_sha=Path("verification/responsiveness/checkout-sha.txt").read_text().strip()
          expected_compiler=Path("verification/responsiveness/compiler-version.txt").read_text().strip()
          assert expected_sha==os.environ["GITHUB_SHA"]
          assert expected_compiler.startswith("rustc ") and expected_compiler==os.environ["RUSTC_VERSION"]
          assert report["source_sha"]==expected_sha
          assert report["source_binding_consistent"] is True
          assert report["source_attribution_verified"] is False
          binary=Path("target/release/examples/responsiveness_bench")
          retained_binary=Path("verification/responsiveness/responsiveness_bench")
          binary_sha=hashlib.sha256(binary.read_bytes()).hexdigest()
          assert hashlib.sha256(retained_binary.read_bytes()).hexdigest()==binary_sha
          for context in (report["source_context_before"], report["source_context_after"]):
              assert context["source_sha_compiled"]==expected_sha
              assert context["source_sha_runtime"]==expected_sha
              assert context["compiler_version"]==expected_compiler
              assert context["executable"]["sha256"]==binary_sha
              assert context["executable"]["size_bytes"]==binary.stat().st_size
          dataset=report["dataset"]
          assert dataset["scenes"]==12
          assert dataset["beats"]==80
          assert dataset["canvas_nodes"]==300
          assert dataset["voice_seconds"]==300
          assert dataset["width"]==1920 and dataset["height"]==1080
          assert dataset["frame_rate"]=="30/1"
          commit=report["small_commit"]
          assert commit["samples"]==40
          assert len(commit["samples_micros"])==40
          assert commit["budget_ms"]==250
          assert commit["p95_micros"] < 250_000
          assert report["reopen_budget_ms"]==2000
          assert report["reopen_micros"] < 2_000_000
          assert report["human_feedback"].startswith("NOT_RUN")
          assert report["comparative_claims"].startswith("NONE")
          print(
              "responsiveness-service=ok "
              f"commit_p95_us={commit['p95_micros']} "
              f"reopen_us={report['reopen_micros']} "
              f"db_bytes={report['database_bytes']}"
          )
          PY
      - name: Retain all responsiveness measurements after each forced budget failure
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          cases=(
              ("commit-budget-failure", "0", "2000", "S-profile small commit p95 "),
              ("reopen-budget-failure", "60000", "0", "S-profile reopen "),
          )
          for label, commit_budget, reopen_budget, expected_diagnostic in cases:
              directory=Path("verification/responsiveness")/label
              directory.mkdir(parents=True, exist_ok=True)
              environment={
                  **os.environ,
                  "MOTIONWRIGHT_SMALL_COMMIT_P95_BUDGET_MS": commit_budget,
                  "MOTIONWRIGHT_S_REOPEN_BUDGET_MS": reopen_budget,
                  "MOTIONWRIGHT_BENCH_ARTIFACT_ROOT": str((directory/"originals").resolve()),
              }
              with (directory/"report.json").open("wb") as stdout, (directory/"stderr.log").open("wb") as stderr:
                  result=subprocess.run(
                      ["target/release/examples/responsiveness_bench"],
                      env=environment, stdout=stdout, stderr=stderr, check=False)
              (directory/"exit-code.txt").write_text(f"{result.returncode}\n", encoding="utf-8")
              diagnostic=(directory/"stderr.log").read_text(encoding="utf-8")
              assert result.returncode != 0, f"{label} unexpectedly passed"
              assert expected_diagnostic in diagnostic and "exceeds 0us budget" in diagnostic
              report=json.loads((directory/"report.json").read_text(encoding="utf-8"))
              assert report["schema"]=="motionwright.responsiveness.v1"
              import hashlib
              import os
              expected_sha=Path("verification/responsiveness/checkout-sha.txt").read_text().strip()
              expected_compiler=Path("verification/responsiveness/compiler-version.txt").read_text().strip()
              assert expected_sha==os.environ["GITHUB_SHA"]
              assert expected_compiler.startswith("rustc ") and expected_compiler==os.environ["RUSTC_VERSION"]
              assert report["source_sha"]==expected_sha
              assert report["source_binding_consistent"] is True
              assert report["source_attribution_verified"] is False
              binary=Path("target/release/examples/responsiveness_bench")
              retained_binary=Path("verification/responsiveness/responsiveness_bench")
              binary_sha=hashlib.sha256(binary.read_bytes()).hexdigest()
              assert hashlib.sha256(retained_binary.read_bytes()).hexdigest()==binary_sha
              for context in (report["source_context_before"], report["source_context_after"]):
                  assert context["source_sha_compiled"]==expected_sha
                  assert context["source_sha_runtime"]==expected_sha
                  assert context["compiler_version"]==expected_compiler
                  assert context["executable"]["sha256"]==binary_sha
                  assert context["executable"]["size_bytes"]==binary.stat().st_size
              assert report["source_sha"]==subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True).strip()
              dataset=report["dataset"]
              assert (dataset["scenes"], dataset["beats"], dataset["canvas_nodes"])==(12, 80, 300)
              assert (dataset["voice_seconds"], dataset["voice_sample_rate_hz"])==(300, 8000)
              assert (dataset["width"], dataset["height"], dataset["frame_rate"])==(1920, 1080, "30/1")
              commit=report["small_commit"]
              samples=commit["samples_micros"]
              assert commit["samples"]==40 and len(samples)==40
              assert all(type(value) is int and value>=0 for value in samples)
              assert commit["p95_micros"]==sorted(samples)[37]
              assert commit["max_micros"]==max(samples)
              assert commit["budget_ms"]==int(commit_budget)
              assert report["reopen_budget_ms"]==int(reopen_budget)
              assert report["reopen_micros"]>0
              if label=="reopen-budget-failure":
                  assert commit["p95_micros"]<int(commit_budget)*1000
              assert report["human_feedback"].startswith("NOT_RUN")
              assert report["comparative_claims"].startswith("NONE")
              print(f"expected-budget-failure={label} exit={result.returncode} samples=40 reopen=recorded")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsiveness-service-evidence
          path: verification/responsiveness
          if-no-files-found: error

  ui-selection:
    if: >-
      ${{ (github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/verify/performance-cache-consumer-')) &&
          (github.event_name != 'workflow_dispatch' || inputs.selection == 'historical') }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Measure selection to inspector paint
        env:
          MOTIONWRIGHT_PERF_ACCEPTANCE: "1"
          MOTIONWRIGHT_UI_PERF_REPORT: "../../verification/responsiveness/ui-selection.json"
        run: npx playwright test tests/performance.spec.ts
      - name: Validate UI responsiveness evidence
        run: |
          cd ../..
          python3 - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path("verification/responsiveness/ui-selection.json").read_text())
          assert report["schema"]=="motionwright.ui-selection.v1"
          assert report["dataset"]["scenes"]==12
          assert report["dataset"]["samples"]==60
          assert report["budget_ms"]==100
          assert report["p95_ms"] < 100
          print(
              "responsiveness-ui=ok "
              f"selection_p95_ms={report['p95_ms']:.3f} "
              f"selection_max_ms={report['max_ms']:.3f}"
          )
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsiveness-ui-evidence
          path: |
            verification/responsiveness/ui-selection.json
            apps/studio/test-results
          if-no-files-found: ignore

  cache-source-g0:
    name: Cache consumer source controls
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_HOME: ${{ github.workspace }}/.cache-g0-tools/cargo
      RUSTUP_HOME: ${{ github.workspace }}/.cache-g0-tools/rustup
      TMPDIR: ${{ github.workspace }}/.cache-g0-tmp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: source
          persist-credentials: false
      - name: Create isolated source-control directories
        run: mkdir -p "$CARGO_HOME" "$RUSTUP_HOME" "$TMPDIR" cache-source-g0-evidence
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Fast policies and Rust formatting
        working-directory: source
        run: |
          python3 -B tooling/source_policy.py
          python3 -B tooling/acceptance_policy.py
          python3 -B tooling/creative_status_policy.py
          python3 -B tooling/public_surface_policy.py
          cargo fmt --all -- --check
      - name: Require complete source-bound cache helper controls in both entry modes
        working-directory: source
        run: >-
          python3 -B tooling/ci_test_runner.py --repo . --mode both
          --pattern test_performance_cache_consumer.py
          --expected-source "$GITHUB_SHA" --require-complete
          --report ../cache-source-g0-evidence/receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cache-source-g0-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: cache-source-g0-evidence
          if-no-files-found: error
          retention-days: 30

  cache-consumer:
    name: Cache consumer originals (independent admission required)
    if: github.event_name == 'workflow_dispatch' && inputs.selection == 'cache-consumer'
    needs: cache-source-g0
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: performance-cache-consumer-${{ github.ref }}
      cancel-in-progress: false
    env:
      CARGO_HOME: ${{ github.workspace }}/.cache-consumer-tools/cargo
      RUSTUP_HOME: ${{ github.workspace }}/.cache-consumer-tools/rustup
      TMPDIR: ${{ github.workspace }}/.cache-consumer-tmp
      REVIEWED_SOURCE: ${{ inputs.reviewed_source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: source
          persist-credentials: false
      - name: Create isolated runner directories
        run: mkdir -p "$CARGO_HOME" "$RUSTUP_HOME" "$TMPDIR"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.1
      - name: Capture the exact 15 source tests and one historical cache-consumer invocation
        run: |
          python3 -B - <<'PY_CACHE_CONSUMER'
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import re
          import shutil
          import signal
          import stat
          import subprocess
          import sys
          import time

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          source = workspace / "source"
          output = workspace / "cache-consumer-evidence"
          if output.exists():
              raise SystemExit("evidence destination exists; no uncertain repeat")
          output.mkdir()
          sys.path.insert(0, str(source / "tooling"))
          import performance_cache_consumer as contract
          assert Path(contract.__file__).resolve() == source / "tooling/performance_cache_consumer.py"

          def write(path, value):
              path.write_text(json.dumps(value, indent=2, sort_keys=True, allow_nan=False) + "\n", encoding="utf-8")

          def digest(path):
              value = hashlib.sha256()
              size = 0
              with path.open("rb") as stream:
                  while chunk := stream.read(1024 * 1024):
                      size += len(chunk)
                      value.update(chunk)
              return {"sha256": value.hexdigest(), "bytes": size}

          def probe(argv):
              return subprocess.check_output(argv, cwd=source, timeout=30).decode("utf-8").strip()

          def snapshot():
              return {"source_sha": probe(["git", "rev-parse", "HEAD"]),
                      "source_tree": probe(["git", "rev-parse", "HEAD^{tree}"]),
                      "git_status_porcelain": probe(["git", "status", "--porcelain", "--untracked-files=all"]),
                      "sources": {name: digest(source / name) for name in contract.SOURCES},
                      "infrastructure": {name: digest(source / name) for name in (
                          ".github/workflows/performance-acceptance.yml",
                          "tooling/performance_cache_consumer.py",
                          "tooling/tests/test_performance_cache_consumer.py")}}

          def interrupt(signum, frame):
              raise InterruptedError("runner interrupted")

          signal.signal(signal.SIGTERM, interrupt)

          def run(label, argv, environment, budget):
              if any(item["execution"]["status"] == "UNKNOWN" for item in state["commands"]):
                  raise RuntimeError("UNKNOWN prevents subsequent command execution or retry")
              directory = output / label
              directory.mkdir()
              receipt = {"schema": "motionwright.performance-cache-consumer-execution/2",
                         "argv": argv, "cwd": str(source), "timeout_seconds": budget,
                         "started_unix": time.time(), "status": "STARTING", "returncode": None,
                         "retry_count": 0, "timeout_policy": "UNKNOWN; preserve originals; no retry",
                         "process_boundary": "OWNED_POSIX_SESSION_GROUP",
                         "owned_process_group_after_wait": "NOT_OBSERVED",
                         "descendants_outside_owned_group": "NOT_OBSERVED", "cleanup": []}
              state["commands"].append({"label": label, "execution": receipt})
              write(directory / "execution.json", receipt)
              started, process = time.monotonic(), None

              def group_state():
                  # This Linux gate starts a separate session. A zero root exit does not
                  # establish that descendants in the inherited process group exited.
                  # Descendants that deliberately leave that group are not observed here.
                  try:
                      os.killpg(process.pid, 0)
                  except ProcessLookupError:
                      return "ABSENT"
                  return "PRESENT"

              def stop_error(event, stage, error):
                  message = str(error) or type(error).__name__
                  event[stage + "_error"] = {"type": type(error).__name__, "message": message}
                  prior = receipt.get("stop_observation", "UNKNOWN; stop interrupted or failed")
                  receipt["stop_observation"] = prior + "; " + stage + ": " + message

              with (directory / "stdout.log").open("xb") as stdout, (directory / "stderr.log").open("xb") as stderr:
                  try:
                      process = subprocess.Popen(argv, cwd=source, env=environment,
                                                 stdout=stdout, stderr=stderr, start_new_session=True)
                      receipt.update(status="RUNNING", pid=process.pid)
                      write(directory / "execution.json", receipt)
                      receipt["returncode"] = process.wait(timeout=budget)
                      if type(receipt["returncode"]) is not int:
                          raise RuntimeError("process wait did not produce an integer exit code")
                      receipt["owned_process_group_after_wait"] = group_state()
                      if receipt["owned_process_group_after_wait"] != "ABSENT":
                          raise RuntimeError("owned process group remains after root exit; capture is not terminal")
                      receipt["status"] = "COMPLETED"
                  except (Exception, KeyboardInterrupt) as error:
                      uncertain = process is not None or isinstance(error,
                          (subprocess.TimeoutExpired, KeyboardInterrupt, InterruptedError))
                      receipt.update(status="UNKNOWN" if uncertain else "START_FAILED",
                                     reason=str(error) or type(error).__name__)
                      write(directory / "execution.json", receipt)
                  finally:
                      if receipt["status"] == "UNKNOWN" and process is not None:
                          # Stop only this invocation's group, even if the root already
                          # exited. Never start the command again; cleanup cannot turn
                          # UNKNOWN into success. Each signal/wait/probe is bounded.
                          for stop_signal in (signal.SIGTERM, signal.SIGKILL):
                              event = {"signal": stop_signal}
                              try:
                                  os.killpg(process.pid, stop_signal)
                                  event["signal_requested"] = True
                              except ProcessLookupError:
                                  event["process_group_missing"] = True
                              except (Exception, KeyboardInterrupt) as error:
                                  stop_error(event, "signal", error)
                              try:
                                  process.wait(timeout=5)
                                  event["wait_returncode"] = process.returncode
                              except (Exception, KeyboardInterrupt) as error:
                                  stop_error(event, "wait", error)
                              try:
                                  event["group_after_cleanup"] = group_state()
                              except (Exception, KeyboardInterrupt) as error:
                                  stop_error(event, "group_probe", error)
                              receipt["cleanup"].append(event)
                              if type(process.returncode) is int and event.get("group_after_cleanup") == "ABSENT":
                                  break
                          receipt["returncode_after_stop"] = process.returncode
                          if receipt["cleanup"][-1].get("group_after_cleanup") != "ABSENT":
                              receipt.setdefault("stop_observation", "UNKNOWN; owned process group still present or unobserved after stop budget")
                      receipt.update(finished_unix=time.time(), elapsed_seconds=time.monotonic() - started)
                      try:
                          write(directory / "execution.json", receipt)
                      except (Exception, KeyboardInterrupt) as error:
                          receipt["observed_status_before_receipt_failure"] = receipt["status"]
                          receipt.update(status="UNKNOWN", receipt_persistence="UNKNOWN",
                                         receipt_write_error=str(error) or type(error).__name__)
                          raise
              return receipt

          def inventory():
              members, directories, total = {}, [], 0
              for directory, dirs, files in os.walk(output, followlinks=False):
                  for name in dirs:
                      path = Path(directory) / name
                      assert not path.is_symlink() and stat.S_ISDIR(path.lstat().st_mode), "nonregular directory"
                      directories.append(path.relative_to(output).as_posix())
                  for name in files:
                      path = Path(directory) / name
                      assert not path.is_symlink() and stat.S_ISREG(path.lstat().st_mode), "nonregular original"
                      relative = path.relative_to(output).as_posix()
                      if relative == "custody-manifest.json":
                          continue
                      size = path.stat().st_size
                      assert size <= 1024**3, "original member exceeds operational custody bound"
                      total += size
                      assert total <= 2 * 1024**3 and len(members) < 20000, "operational custody budget exhausted"
                      members[relative] = digest(path)
              return {"members": members, "directories": sorted(directories), "total_bytes": total}

          state = {"schema": "motionwright.performance-cache-consumer-capture/1", "status": "NOT_READY",
                   "source_sha": os.environ["GITHUB_SHA"], "reviewed_source": os.environ["REVIEWED_SOURCE"],
                   "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                   "job": os.environ["GITHUB_JOB"], "commands": [],
                   "original_byte_admission": "REQUIRED", "sqlite_admission": "REQUIRED",
                   "native_cache_claim": False, "formal_acceptance": False, "release_authorized": False}
          environment = {key: value for key, value in os.environ.items()
                         if not key.startswith("MOTIONWRIGHT_") and key not in
                         ("RUSTFLAGS", "CARGO_ENCODED_RUSTFLAGS", "RUSTC", "RUSTC_WRAPPER", "RUSTC_WORKSPACE_WRAPPER")}
          try:
              expected = state["reviewed_source"]
              assert re.fullmatch(r"[a-f0-9]{40}", expected) and expected == state["source_sha"], "explicit reviewed source must equal workflow SHA"
              before = snapshot()
              write(output / "source-before.json", before)
              assert before["source_sha"] == expected and not before["git_status_porcelain"], "source checkout is not exact and clean"
              free = shutil.disk_usage(workspace).free
              write(output / "machine.json", {"platform": platform.platform(), "machine": platform.machine(),
                  "cpu_count": os.cpu_count(), "free_disk_bytes": free, "operational_disk_minimum_bytes": 1024**3,
                  "scope": "observed runner resources; no normative hardware or wall-clock speedup claim"})
              assert free >= 1024**3, "insufficient observed operational disk budget"
              tools = output / "tools"
              tools.mkdir()
              for name, argv in (
                  ("rustc-version", ["rustc", "--version"]), ("rustc-vV", ["rustc", "-vV"]),
                  ("cargo-version", ["cargo", "--version"]), ("python-version", ["python3", "--version"]),
                  ("git-version", ["git", "--version"])):
                  capture = subprocess.run(argv, cwd=source, capture_output=True, timeout=30, check=False)
                  (tools / (name + ".stdout")).write_bytes(capture.stdout)
                  (tools / (name + ".stderr")).write_bytes(capture.stderr)
                  write(tools / (name + ".json"), {"argv": argv, "returncode": capture.returncode,
                        "resolved_executable": shutil.which(argv[0])})
                  assert capture.returncode == 0, "tool observation failed"
              compiler = (tools / "rustc-version.stdout").read_text().strip()
              target = workspace / "cache-consumer-build-target"
              assert not target.exists(), "build target exists; no uncertain repeat"
              target.mkdir()
              environment.update(RUSTC_VERSION=compiler, GITHUB_SHA=expected, CARGO_TARGET_DIR=str(target),
                                 CARGO_TERM_COLOR="never", RUST_BACKTRACE="1")
              commands = (
                  ("source-archive", ["git", "archive", "--format=tar", "--output=" + str(output / "source.tar"), expected], 60),
                  ("source-g1", ["cargo", "test", "--locked", "--release", "-p", "motionwright-service",
                                 "--example", "acceptance_bench", "--", "--nocapture", "--test-threads=1"], 900),
                  ("build", ["cargo", "build", "--locked", "--release", "-p", "motionwright-service",
                             "--example", "acceptance_bench"], 900),
              )
              for label, argv, budget in commands:
                  receipt = run(label, argv, environment, budget)
                  write(output / "capture.json", state)
                  contract.require_complete_execution(receipt, argv, str(source))
                  if label == "source-g1":
                      roster = contract.source_test_roster((output / label / "stdout.log").read_text(encoding="utf-8"))
                      write(output / "source-test-roster.json", roster)
              after_build = snapshot()
              write(output / "source-after-build.json", after_build)
              assert before == after_build, "source changed during G1/build"
              binary = output / "bin" / "acceptance_bench"
              binary.parent.mkdir()
              shutil.copy2(target / "release/examples/acceptance_bench", binary)
              info = digest(binary)
              fixtures = output / "fixtures"
              fixtures.mkdir()
              bindings = {"source_sha": expected, "source_tree": before["source_tree"],
                  "source_directory": str(source), "compiler_version": compiler, "sources": before["sources"],
                  "executable": {"path": str(binary), "sha256": info["sha256"], "size_bytes": info["bytes"]},
                  "artifact_root": str(fixtures), "scope": "runner observations; independent originals admission still required"}
              write(output / "bindings.json", bindings)
              environment.update(MOTIONWRIGHT_REFERENCE_PROFILES="historical",
                                 MOTIONWRIGHT_LATENCY_BUDGET_MS="2000",
                                 MOTIONWRIGHT_BENCH_ARTIFACT_ROOT=str(fixtures))
              argv = ["/usr/bin/time", "-v", "-o", str(output / "benchmark/resource-usage.txt"), str(binary)]
              receipt = run("benchmark", argv, environment, 300)
              write(output / "capture.json", state)
              contract.require_complete_execution(receipt, argv, str(source))
              report_original = (output / "benchmark/stdout.log").read_bytes()
              report = contract.decode_json(report_original)
              original_report = Path(report["artifact_directory"]) / "report.json"
              assert original_report.resolve().is_relative_to(fixtures.resolve()), "report original escapes fixtures"
              assert original_report.read_bytes() + b"\n" == report_original, "stdout differs from untouched original report"
              result = contract.validate_bound_report(report, expected,
                  before["sources"]["crates/service/examples/acceptance_bench.rs"]["sha256"], bindings)
              result.update(input_report_sha256=hashlib.sha256(report_original).hexdigest(),
                            bindings_sha256=digest(output / "bindings.json")["sha256"])
              write(output / "report-check.json", result)
              after = snapshot()
              write(output / "source-after.json", after)
              assert before == after, "source changed during benchmark"
              assert digest(binary) == info, "executed binary bytes changed"
              state.update(status="CAPTURE_COMPLETE_REPORT_CONSISTENT_ONLY", expected_datasets=9,
                           source_tests=15, historical_warm_requests=9, measured_phase_requests=36,
                           separate_control_setup_requests=9)
          except (Exception, KeyboardInterrupt) as error:
              state.update(status="UNKNOWN" if any(item["execution"]["status"] == "UNKNOWN"
                                                 for item in state["commands"]) else "NOT_READY",
                           error=str(error) or type(error).__name__)
          finally:
              write(output / "capture.json", state)
              try:
                  first = inventory()
                  write(output / "custody-manifest.json", {
                      "schema": "motionwright.performance-cache-consumer-custody/1",
                      "source_sha": state["source_sha"], "run_id": state["run_id"], "run_attempt": state["run_attempt"],
                      "capture_status": state["status"], "root": output.name, **first,
                      "original_byte_admission": "REQUIRED", "sqlite_admission": "REQUIRED",
                      "formal_acceptance": False, "release_authorized": False})
                  assert inventory() == first, "original inventory changed during sealing"
              except (Exception, KeyboardInterrupt) as error:
                  uncertain = state["status"] == "UNKNOWN" or isinstance(error, (KeyboardInterrupt, InterruptedError)) or any(
                      item["execution"]["status"] == "UNKNOWN" for item in state["commands"])
                  state.update(status="UNKNOWN" if uncertain else "NOT_READY",
                               custody_error=str(error) or type(error).__name__)
                  write(output / "capture.json", state)
              print(json.dumps({"status": state["status"], "source_sha": state["source_sha"],
                                "original_byte_admission": "REQUIRED", "sqlite_admission": "REQUIRED",
                                "formal_acceptance": False}))
          raise SystemExit(0 if state["status"] == "CAPTURE_COMPLETE_REPORT_CONSISTENT_ONLY" else 1)
          PY_CACHE_CONSUMER
      - name: Preserve the complete original tree and checksum
        if: always()
        run: |
          test -d cache-consumer-evidence
          tar -czf cache-consumer-evidence.tar.gz cache-consumer-evidence
          sha256sum cache-consumer-evidence.tar.gz > cache-consumer-evidence.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cache-consumer-originals-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cache-consumer-evidence.tar.gz
            cache-consumer-evidence.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

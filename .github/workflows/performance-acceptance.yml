              expected_compiler=Path("verification/responsiveness/compiler-version.txt").read_text().strip()
              assert expected_sha==os.environ["GITHUB_SHA"]
              assert expected_compiler.startswith("rustc ") and expected_compiler==os.environ["RUSTC_VERSION"]
              assert report["source_sha"]==expected_sha
              assert report["source_binding_consistent"] is True
              assert report["source_attribution_verified"] is False
              binary=Path("target/release/examples/responsiveness_bench")
              retained_binary=Path("verification/responsiveness/responsiveness_bench")
              binary_sha=hashlib.sha256(binary.read_bytes()).hexdigest()
              assert hashlib.sha256(retained_binary.read_bytes()).hexdigest()==binary_sha
              for context in (report["source_context_before"], report["source_context_after"]):
                  assert context["source_sha_compiled"]==expected_sha
                  assert context["source_sha_runtime"]==expected_sha
                  assert context["compiler_version"]==expected_compiler
                  assert context["executable"]["sha256"]==binary_sha
                  assert context["executable"]["size_bytes"]==binary.stat().st_size
              assert report["source_sha"]==subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True).strip()
              dataset=report["dataset"]
              assert (dataset["scenes"], dataset["beats"], dataset["canvas_nodes"])==(12, 80, 300)
              assert (dataset["voice_seconds"], dataset["voice_sample_rate_hz"])==(300, 8000)
              assert (dataset["width"], dataset["height"], dataset["frame_rate"])==(1920, 1080, "30/1")
              commit=report["small_commit"]
              samples=commit["samples_micros"]
              assert commit["samples"]==40 and len(samples)==40

          cat verification/responsiveness/stderr.log >&2
          exit "$status"
      - name: Validate service responsiveness evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path("verification/responsiveness/service.json").read_text())
          assert report["schema"]=="motionwright.responsiveness.v1"
          import hashlib

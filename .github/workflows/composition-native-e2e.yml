name: Joint original composition native design evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/domain/src/measured_data.rs'
      - 'crates/domain/src/product_stage.rs'
      - 'crates/domain/src/procedural.rs'
      - 'crates/domain/tests/composition_stack.rs'
      - 'crates/domain/src/lib.rs'
      - 'crates/domain/src/production_design.rs'
      - 'crates/native/src/film.rs'
      - 'crates/native/examples/native-render-e2e.rs'
      - 'crates/storage/src/lib.rs'
      - 'tooling/native_av_master_e2e.py'
      - 'tooling/native_av_media_probe.py'
      - 'tooling/tests/test_native_av_media_probe.py'
      - 'tooling/composition_native_evidence.py'
      - 'tooling/native_tests/test_composition_native_evidence.py'
      - 'tooling/composition_native_public_artifact.py'
      - 'tooling/tests/test_composition_native_public_artifact.py'
      - '.github/workflows/composition-native-e2e.yml'
  push:
    branches: ['main']
    paths:
      - 'crates/domain/src/measured_data.rs'
      - 'crates/domain/src/product_stage.rs'
      - 'crates/domain/src/procedural.rs'
      - 'crates/domain/tests/composition_stack.rs'
      - 'crates/native/examples/native-render-e2e.rs'
      - 'tooling/composition_native_evidence.py'
      - '.github/workflows/composition-native-e2e.yml'

permissions:
  contents: read

concurrency:
  group: composition-native-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  PLAYWRIGHT_BROWSERS_PATH: '0'
  SEMWRIGHT_CHECKOUT: ${{ github.workspace }}/_semwright

jobs:
  composition-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Resolve exact Semwright source pin
        id: pin
        run: |
          set -euo pipefail
          sha="$(python3 -c 'import json; print(json.load(open("SOURCE_LOCK.json"))["dependencies"]["semwright"]["revision"])')"
          test "${#sha}" -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: seradotcom/semwright
          ref: ${{ steps.pin.outputs.sha }}
          path: _semwright
          persist-credentials: false

      - name: Verify immutable source identities
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git -C _semwright rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"
          python3 tooling/source_policy.py

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: motionwright-native-av-master-1.98.1
          cache-on-failure: true
          workspaces: |
            . -> target
            _semwright -> target
          cache-workspace-crates: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: _semwright/integrations/motion-canvas/runtime/package-lock.json

      - name: Install pinned native runtimes
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bubblewrap apparmor-profiles apparmor-utils \
            melt ffmpeg python3-pil libpipewire-0.3-dev pkg-config clang
          mkdir -p verification/native-av-master-e2e
          {
            melt -version | head -5
            ffmpeg -version | head -3
            ffprobe -version | head -3
            bwrap --version
          } > verification/native-av-master-e2e/native-runtime-versions.txt

      - name: Configure disposable-runner Driver Host sandbox
        run: |
          set -euo pipefail
          bash _semwright/scripts/dev/ci-driver-bwrap-profile.sh \
            "$GITHUB_WORKSPACE/verification/native-av-master-e2e/sandbox-profile.txt"

      - name: Install exact Motion Canvas runtime and Firefox
        working-directory: _semwright/integrations/motion-canvas/runtime
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps firefox
          npm run probe

      - name: Build exact Semwright Broker and native providers
        working-directory: _semwright
        run: |
          set -euo pipefail
          cargo build --locked -p semwright-daemon -p semwright-cli --bins
          cargo build --locked \
            -p semwright-plugin-host --bin semwright-sandbox \
            -p semwright-driver-motion-canvas --bin semwright-motion-canvas-driver \
            -p semwright-mlt-video-driver --bin semwright-mlt-video-driver \
            -p semwright-mlt-video-driver --bin semwright-mlt-runtime-runner
          test -x target/debug/semwright
          test -x target/debug/semwrightd
          test -x target/debug/semwright-sandbox
          test -x target/debug/semwright-motion-canvas-driver
          test -x target/debug/semwright-mlt-video-driver
          test -x target/debug/semwright-mlt-runtime-runner

      - name: Build Motionwright native AV acceptance
        run: |
          set -euo pipefail
          cargo build --locked -p motionwright-native --example native-render-e2e
          cargo test --locked -p motionwright-native --test composition_stack -- --nocapture
          cargo test --locked -p motionwright-domain --test composition_stack -- --nocapture

      - name: Check the exact three-scene source seed before any native render mutation
        run: cargo test --locked -p motionwright-native --example native-render-e2e composition_seed_contract_tests

      - name: Reject fake synthetic source and blank three-scene media
        run: python3 -m unittest discover -s tooling/native_tests -p 'test_composition_native_evidence.py' -v

      - name: Refuse private source leaks or unverifiable joint-master publication
        run: python3 -m unittest tooling.tests.test_composition_native_public_artifact -v

      - name: Validate exact 18-second stereo source and decoded media profiles before native execution
        run: python3 -m unittest tooling.tests.test_native_av_media_probe -v

      - name: Render three authored native scenes through pinned Semwright
        run: |
          set -euo pipefail
          mkdir -p verification/composition-native-e2e
          MOTIONWRIGHT_E2E_FIXTURE=composition-stack python3 tooling/native_av_master_e2e.py |
            tee verification/composition-native-e2e/run.log

      - name: Confirm exact Stage, procedural, metric and decoded MP4 source evidence
        run: |
          set -euo pipefail
          python3 - <<'PY_COMPOSITION'
          import hashlib, json, os
          from pathlib import Path
          folder=Path("verification/composition-native-e2e") / os.environ["GITHUB_SHA"] / "composition-stack"
          digest=lambda file: hashlib.sha256(file.read_bytes()).hexdigest()
          result=json.loads((folder/"result.json").read_text())
          seed=result["project"]
          source=json.loads((folder/"editable-project.json").read_text())
          review=json.loads((folder/"composition-native-inspection.json").read_text())
          assert result["native_av_master_e2e"]=="PASS"
          assert result["fixture"]=="composition-stack"
          assert seed["fixture"]=="composition-stack/1"
          assert result["motionwright_sha"]==os.environ["GITHUB_SHA"]
          assert result["frame_count"]==result["decoded_video_frames"]==540
          assert seed["original_ui_not_real_capture"] is True
          assert seed["data_truth"]=="synthetic_fixture_not_real_world_metric"
          assert len(source["scenes"])==3
          assert seed["scene_ids"]==[scene["id"] for scene in source["scenes"]]
          assert source["production_design"]["stages"][0]["id"]==seed["stage_id"]
          assert source["production_design"]["procedural_fields"][0]["id"]==seed["procedural_id"]
          assert source["production_design"]["measured_tables"][0]["id"]==seed["measured_table_id"]
          assert digest(folder/"composition-synthetic-source.json")==seed["source_sha256"]
          assert (folder/"composition.motionwright"/"manifest.json").is_file()
          assert source["generation"]==seed["generation"] and source["revision"]==seed["revision"]
          assert review["technical_sampling"]=="PASS"
          assert review["source_project_sha256"]==digest(folder/"editable-project.json")
          assert review["frame_indices"]==[140,270,480]
          assert review["source_truth"]=="first-party-original-and-synthetic-only"
          assert review["decoded_master"]["technical_sampling"]=="PASS"
          assert review["decoded_master"]["mp4_sha256"]==digest(folder/"motionwright-master.mp4")
          assert review["decoded_master"]["mp4_sha256"]==result["master_sha256"]
          assert review["decoded_master"]["frame_indices"]==[140,270,480]
          assert review["contact_sheet"]["sha256"]==digest(folder/review["contact_sheet"]["path"])
          assert result["joint_native_pixel_evidence_sha256"]==digest(folder/"composition-native-inspection.json")
          assert result["decoded_stereo_channel_identity"]=="confirmed_distinct_source_tones"
          print("Three original source-authored Film scenes, 540 real frames and decoded H264/AAC MP4 independently verified. Creative approval is required.")
          PY_COMPOSITION

      - name: Stage curated technical MP4 and source contact sheet only
        if: always()
        env:
          NATIVE_CI_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 tooling/composition_native_public_artifact.py \
            --source-sha "$GITHUB_SHA" \
            --evidence-root verification/composition-native-e2e \
            --output-root verification/composition-native-public \
            --job-status "$NATIVE_CI_JOB_STATUS"
          python3 -m json.tool verification/composition-native-public/public-evidence.json >/dev/null

      - name: Upload public joint-master media without owner-native receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: composition-native-public-${{ github.sha }}
          path: verification/composition-native-public/
          if-no-files-found: error
          retention-days: 7

name: Bounded planar camera native source evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/domain/src/camera_reframe.rs'
      - 'crates/domain/src/lib.rs'
      - 'crates/domain/src/production_design.rs'
      - 'crates/native/src/film.rs'
      - 'crates/native/examples/native-render-e2e.rs'
      - 'crates/native/tests/camera_reframe.rs'
      - 'tooling/native_av_master_e2e.py'
      - 'tooling/camera_reframe_native_evidence.py'
      - 'tooling/native_tests/test_camera_reframe_native_evidence.py'
      - '.github/workflows/camera-reframe-e2e.yml'
  push:
    branches: ['main']
    paths:
      - 'crates/domain/src/camera_reframe.rs'
      - 'crates/native/src/film.rs'
      - 'crates/native/examples/native-render-e2e.rs'
      - 'tooling/camera_reframe_native_evidence.py'
      - '.github/workflows/camera-reframe-e2e.yml'

permissions:
  contents: read

concurrency:
  group: camera-reframe-native-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  PLAYWRIGHT_BROWSERS_PATH: '0'
  SEMWRIGHT_CHECKOUT: ${{ github.workspace }}/_semwright

jobs:
  camera-reframe-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Resolve exact Semwright source pin
        id: pin
        run: |
          set -euo pipefail
          sha="$(python3 -c 'import json; print(json.load(open("SOURCE_LOCK.json"))["dependencies"]["semwright"]["revision"])')"
          test "${#sha}" -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: seradotcom/semwright
          ref: ${{ steps.pin.outputs.sha }}
          path: _semwright
          persist-credentials: false

      - name: Verify immutable source identities
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git -C _semwright rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"
          python3 tooling/source_policy.py

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: motionwright-native-av-master-1.98.1
          cache-on-failure: true
          workspaces: |
            . -> target
            _semwright -> target
          cache-workspace-crates: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: _semwright/integrations/motion-canvas/runtime/package-lock.json

      - name: Install pinned native runtimes
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bubblewrap apparmor-profiles apparmor-utils \
            melt ffmpeg python3-pil libpipewire-0.3-dev pkg-config clang
          mkdir -p verification/native-av-master-e2e
          {
            melt -version | head -5
            ffmpeg -version | head -3
            ffprobe -version | head -3
            bwrap --version
          } > verification/native-av-master-e2e/native-runtime-versions.txt

      - name: Configure disposable-runner Driver Host sandbox
        run: |
          set -euo pipefail
          bash _semwright/scripts/dev/ci-driver-bwrap-profile.sh \
            "$GITHUB_WORKSPACE/verification/native-av-master-e2e/sandbox-profile.txt"

      - name: Install exact Motion Canvas runtime and Firefox
        working-directory: _semwright/integrations/motion-canvas/runtime
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps firefox
          npm run probe

      - name: Build exact Semwright Broker and native providers
        working-directory: _semwright
        run: |
          set -euo pipefail
          cargo build --locked -p semwright-daemon -p semwright-cli --bins
          cargo build --locked \
            -p semwright-plugin-host --bin semwright-sandbox \
            -p semwright-driver-motion-canvas --bin semwright-motion-canvas-driver \
            -p semwright-mlt-video-driver --bin semwright-mlt-video-driver \
            -p semwright-mlt-video-driver --bin semwright-mlt-runtime-runner
          test -x target/debug/semwright
          test -x target/debug/semwrightd
          test -x target/debug/semwright-sandbox
          test -x target/debug/semwright-motion-canvas-driver
          test -x target/debug/semwright-mlt-video-driver
          test -x target/debug/semwright-mlt-runtime-runner

      - name: Build Motionwright native AV acceptance
        run: |
          set -euo pipefail
          cargo build --locked -p motionwright-native --example native-render-e2e
          cargo test --locked -p motionwright-native \
            motion_canvas_production_is_revision_bound_rendered_and_natively_verified \
            -- --nocapture

      - name: Reject fake/stationary/blank/small camera evidence
        run: python3 -m unittest discover -s tooling/native_tests -p 'test_camera_reframe_native_evidence.py' -v

      - name: Render original bounded camera pan through pinned Semwright
        run: |
          set -euo pipefail
          mkdir -p verification/camera-reframe-e2e
          MOTIONWRIGHT_E2E_FIXTURE=camera-reframe python3 tooling/native_av_master_e2e.py |
            tee verification/camera-reframe-e2e/run.log

      - name: Independently prove original camera motion in native PNG and decoded H264
        run: |
          set -euo pipefail
          python3 - <<'PY_CAMERA'
          import hashlib,json,os
          from pathlib import Path
          folder=Path("verification/camera-reframe-e2e") / os.environ["GITHUB_SHA"] / "camera-reframe"
          digest=lambda file: hashlib.sha256(file.read_bytes()).hexdigest()
          read=lambda name:json.loads((folder/name).read_text())
          result=read("result.json")
          project=read("editable-project.json")
          report=read("camera-native-inspection.json")
          seed=result["project"]
          assert result["native_av_master_e2e"]=="PASS"
          assert seed["fixture"]=="camera-reframe/1"
          assert result["motionwright_sha"]==os.environ["GITHUB_SHA"]
          assert result["semwright_sha"]==report["semwright_sha"]
          assert result["frame_count"]==result["decoded_video_frames"]==180
          assert result["decoded_stereo_channel_identity"]=="confirmed_distinct_source_tones"
          assert seed["real_product_capture"] is False
          assert project["generation"]==seed["generation"]
          assert project["revision"]==seed["revision"]==report["source_revision"]
          assert report["project_id"]==project["id"]
          assert report["technical_sampling"]=="PASS"
          assert report["creative_approval"]=="required"
          assert report["optical_orbit_dolly"]=="not_implemented"
          assert report["source_sha256"]==digest(folder/"editable-project.json")
          assert report["camera_instance"]==seed["camera_reframe_id"]
          assert report["native_original_to_terminal"]["shift_x_px"]==18
          assert report["native_midpoint_to_terminal"]["shift_x_px"]==9
          assert report["native_original_to_terminal"]["authored_motion_alignment"]>.85
          assert report["decoded_mp4"]["technical_sampling"]=="PASS"
          assert report["decoded_mp4"]["source_aligned_translation"]["shift_x_px"]==18
          assert report["decoded_mp4"]["mp4_sha256"]==result["master_sha256"]==digest(folder/"motionwright-master.mp4")
          assert result["camera_native_pixel_evidence_sha256"]==digest(folder/"camera-native-inspection.json")
          assert report["contact_sheet"]["sha256"]==digest(folder/report["contact_sheet"]["path"])
          assert (folder/"stage.motionwright"/"manifest.json").is_file()
          print("Real original 2D camera pan: source-sha, native pixels, H264 movement and portable project verified; 3D/creative approval NOT claimed")
          PY_CAMERA

      - name: Upload bounded camera pan native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: camera-reframe-native-${{ github.sha }}
          path: verification/camera-reframe-e2e/
          if-no-files-found: ignore
          retention-days: 7

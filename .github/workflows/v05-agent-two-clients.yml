name: V05 two independent local agent clients

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/native/examples/local_agent_actor.rs'
      - 'tooling/agent-local/**'
      - 'docs/creative-production/V05_EXTERNAL_AGENT_LOCAL_CLIENTS.md'
      - 'docs/creative-production/requirements-status.json'
      - '.github/workflows/v05-agent-two-clients.yml'

permissions:
  contents: read

concurrency:
  group: motionwright-owner-local-clients-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-native-sdk-two-processes:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: v05-agent-owner-local-1.98.1
          cache-on-failure: true
      - name: Compile real Semwright Native SDK and canonical StudioService actor
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked -p motionwright-native --example local_agent_actor
          cargo build --locked -p motionwright-native --example local_agent_actor
          cargo clippy --locked -p motionwright-native --example local_agent_actor -- -D warnings
          python3 -m py_compile tooling/agent-local/two_clients_e2e.py tooling/agent-local/public_artifact.py tooling/agent-local/test_public_artifact.py
          python3 -m unittest discover -s tooling/agent-local -p 'test_public_artifact.py' -v
          python3 tooling/source_policy.py
          python3 tooling/creative_status_policy.py
      - name: Run owner-local independent OS clients against one real SQLite project
        run: |
          set -euo pipefail
          python3 tooling/agent-local/two_clients_e2e.py
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          p=Path('verification/native-agent-two-clients/result.json')
          report=json.loads(p.read_text())
          assert report['same_sha']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert report['same_sqlite_project'] and report['independent_subprocess_per_request']
          assert report['owner_local_cas_revisions']==3
          assert report['host_authenticated_agent_write']=='NOT_TESTED_OR_GRANTED'
          assert report['remote_listener']=='NONE'
          print('source-bound-two-agent-clients=OWNER-LOCAL-PASS')
          PY
      - name: Stage source-bound local-client facts without owner event journal or SQLite
        if: always()
        env:
          NATIVE_CLIENT_CI_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 tooling/agent-local/public_artifact.py --source-sha "$GITHUB_SHA" --private-root verification/native-agent-two-clients --public-root verification/agent-local-public --job-status "$NATIVE_CLIENT_CI_JOB_STATUS"
          python3 -m json.tool verification/agent-local-public/public-evidence.json >/dev/null
      - name: Upload bounded public Native SDK two-client facts only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v05-agent-local-public-${{ github.sha }}
          path: verification/agent-local-public/
          if-no-files-found: error
          retention-days: 7

name: Native Source Property Fidelity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/domain/src/production_design.rs"
      - "crates/domain/tests/native_property_fidelity.rs"
      - "crates/domain/tests/production_design.rs"
      - "crates/service/tests/native_property_fidelity.rs"
      - "apps/studio/src/creativeProduction.ts"
      - "apps/studio/src/ProductionDesignWorkspace.tsx"
      - "apps/studio/src/NativePropertyFidelityWorkbench.tsx"
      - "apps/studio/src/nativePropertyFidelity.test.ts"
      - "apps/studio/src/production-design.css"
      - "apps/studio/tests/native-property-fidelity.spec.ts"
      - "docs/creative-production/requirements-status.json"
      - "docs/creative-production/NATIVE_PROPERTY_FIDELITY.md"
      - ".github/workflows/native-property-fidelity.yml"
  push:
    branches: ["main"]
    paths:
      - "crates/domain/src/production_design.rs"
      - "apps/studio/src/NativePropertyFidelityWorkbench.tsx"
      - ".github/workflows/native-property-fidelity.yml"

permissions:
  contents: read

jobs:
  source-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 tooling/source_policy.py
      - run: python3 tooling/creative_status_policy.py
      - run: python3 tooling/acceptance_policy.py

  rust-domain-and-sqlite:
    needs: source-policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p motionwright-domain --test native_property_fidelity -- --nocapture
      - run: cargo test --locked -p motionwright-domain --test production_design -- --nocapture
      - run: cargo test --locked -p motionwright-service --test native_property_fidelity -- --nocapture
      - run: cargo clippy --locked -p motionwright-domain -p motionwright-service --all-targets -- -D warnings

  studio-and-browser:
    needs: source-policy
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run src/nativePropertyFidelity.test.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/native-property-fidelity.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-property-fidelity-browser-evidence
          path: |
            apps/studio/test-results
            apps/studio/playwright-report
          if-no-files-found: ignore

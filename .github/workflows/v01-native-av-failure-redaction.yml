name: v0.1 Native AV Failure Redaction

on:
  pull_request:
    paths:
      - 'tooling/native_av_failure_guard.py'
      - 'tooling/native_av_master_e2e.py'
      - 'tooling/tests/test_native_av_failure_guard.py'
      - 'tooling/tests/test_native_cli_failure_redaction.py'
      - 'tooling/native_render_e2e.py'
      - 'tooling/native_mlt_sequence_e2e.py'
      - 'tooling/native_host_shared_state.py'
      - '.github/workflows/v01-native-av-failure-redaction.yml'
  push:
    branches: ['main', 'fix/v01-native-av-safe-failure-*']
    paths:
      - 'tooling/native_av_failure_guard.py'
      - 'tooling/native_av_master_e2e.py'
      - 'tooling/tests/test_native_av_failure_guard.py'
      - 'tooling/tests/test_native_cli_failure_redaction.py'
      - 'tooling/native_render_e2e.py'
      - 'tooling/native_mlt_sequence_e2e.py'
      - 'tooling/native_host_shared_state.py'
      - '.github/workflows/v01-native-av-failure-redaction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-failure-classification:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Validate source boundary and synthetic redaction regression
        run: |
          set -euo pipefail
          python3 tooling/source_policy.py
          python3 -m py_compile tooling/native_av_failure_guard.py tooling/native_av_master_e2e.py
          python3 -m unittest discover -s tooling/tests -p 'test_native_av_failure_guard.py' -v
          python3 -m unittest discover -s tooling/tests -p 'test_native_cli_failure_redaction.py' -v
      - name: Check no automatic success promotion is claimed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          from sys import path
          path.insert(0,"tooling")
          from native_av_failure_guard import classify_native_command_failure
          report=classify_native_command_failure(
              stdout=b"",stderr=json.dumps({
                  "error":{"code":"Unavailable","outcome_known":False,
                           "message":"Provider capability generation is inactive"},
                  "receipts":[{"command":"driver.motion-canvas.render.status",
                               "payload":{"error":{"code":"Timeout"}}}],
              }).encode(),exit_code=1)
          assert report["source_outcome"]=="UNKNOWN"
          assert report["provider_generation_inactive_observed"] is True
          assert report["terminal_native_result_verified"] is False
          assert report["automatically_restarted_mutating_render"] is False
          print("native-av-safe-failure-contract=PASS source_sha="+os.environ["GITHUB_SHA"])
          PY

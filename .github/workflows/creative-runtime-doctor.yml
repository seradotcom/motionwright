name: Native Creative Runtime Doctor

on:
  workflow_dispatch:
    inputs:
      verification_scope:
        description: Select full creative doctor or the compiled Tauri Graph context ABI
        type: choice
        required: true
        default: full
        options: [full, graph-context-abi]
      expected_source_sha:
        description: Exact published source SHA required for Graph context G1
        type: string
        required: false
        default: ""
  pull_request:
    paths:
      - "crates/native/src/creative_doctor.rs"
      - "crates/native/src/lib.rs"
      - "apps/desktop/src-tauri/src/main.rs"
      - "apps/studio/src/creativeDoctor*"
      - "apps/studio/src/CreativeRuntimeDoctorPanel.tsx"
      - "apps/studio/src/creative-runtime-doctor.css"
      - "apps/studio/src/IntegrationsWorkspace.tsx"
      - "apps/studio/src/fixture.ts"
      - "apps/studio/src/api.ts"
      - "apps/studio/src/types.ts"
      - "apps/studio/tests/creative-runtime-doctor.spec.ts"
      - "docs/creative-production/CREATIVE_RUNTIME_DOCTOR.md"
      - "docs/creative-production/requirements-status.json"
      - ".github/workflows/creative-runtime-doctor.yml"
  push:
    branches: ["main", "feat/**"]
    paths:
      - "crates/native/src/creative_doctor.rs"
      - "apps/desktop/src-tauri/src/main.rs"
      - "apps/studio/src/creativeDoctor*"
      - "apps/studio/src/CreativeRuntimeDoctorPanel.tsx"
      - ".github/workflows/creative-runtime-doctor.yml"

permissions:
  contents: read

jobs:
  source-boundaries:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.verification_scope == 'full' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tooling/source_policy.py
      - run: python tooling/creative_status_policy.py
      - run: python tooling/acceptance_policy.py

  native-contracts:
    needs: source-boundaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo test -p motionwright-native --lib creative_doctor::tests -- --nocapture
      - run: cargo clippy -p motionwright-native --lib -- -D warnings

  studio-browser:
    needs: source-boundaries
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run src/creativeDoctor.test.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/creative-runtime-doctor.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creative-runtime-doctor-browser
          path: |
            apps/studio/test-results
            apps/studio/playwright-report
          if-no-files-found: ignore

  desktop-windows:
    needs: [source-boundaries, studio-browser]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm --prefix apps/studio ci --no-audit --no-fund
      - run: npm --prefix apps/studio run build
      - run: cargo check -p motionwright-desktop --bin motionwright-desktop

  # Selected compiled Desktop source regression, never Native/Store physical G2.
  graph-context-abi-g1:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'graph-context-abi' }}
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: "1.98.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - name: Admit exact published clean source
        shell: bash
        env:
          MW_EXPECTED_SOURCE: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          [[ "$MW_EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$MW_EXPECTED_SOURCE" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          python -B tooling/source_policy.py
      - name: Compile actual Desktop and four Graph context ABI tests
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          mkdir -p ci-evidence/graph-context-abi-g1
          printf '%s\n' "$GITHUB_SHA" > ci-evidence/graph-context-abi-g1/source-sha.txt
          npm --prefix apps/studio ci --no-audit --no-fund
          npm --prefix apps/studio run build
          cargo check --locked -p motionwright-desktop --bin motionwright-desktop 2>&1 | tee ci-evidence/graph-context-abi-g1/desktop-check.original.log
          cargo test --locked -p motionwright-desktop --bin motionwright-desktop semantic_graph_context_failure::tests:: -- --nocapture 2>&1 | tee ci-evidence/graph-context-abi-g1/graph-context-tests.original.log
          grep -Eq '^test result: ok[.] 4 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out;' ci-evidence/graph-context-abi-g1/graph-context-tests.original.log
          grep -Fxq 'test semantic_graph_context_failure::tests::context_success_cannot_hide_an_unconfirmed_transport ... ok' ci-evidence/graph-context-abi-g1/graph-context-tests.original.log
          sha256sum ci-evidence/graph-context-abi-g1/*.original.log > ci-evidence/graph-context-abi-g1/originals.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: graph-context-abi-g1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/graph-context-abi-g1/
          if-no-files-found: warn
          retention-days: 7

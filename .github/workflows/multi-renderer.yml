              if not re.fullmatch(r"[0-9a-f]{64}", expected_list_sha) or hashlib.sha256(receipt_raw).hexdigest() != expected_list_sha:
                  raise SystemExit("Compiled-list receipt changed before execution/readback")
              prior = json.loads(receipt_raw)
              required_context = {"source_sha": head, "tree_sha": tree,
                                  "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                                  "job": os.environ["GITHUB_JOB"], "label": label, "required": sorted(required)}
              if (prior.get("schema") != "motionwright.native.closed-compiled-list/1"
                      or prior.get("status") != "PASS_COMPILED_LIST" or prior.get("phase") != "list"
                      or prior.get("executed_test_count") != 0
                      or any(prior.get(key) != value for key, value in required_context.items())):
                  raise SystemExit("Compiled-list context is foreign or incomplete")
              for key, basename in (("log", label + ".list.stdout.log"), ("stderr", label + ".list.stderr.log")):
                  item = prior[key]
                  if item.get("file") != basename:
                      raise SystemExit("Compiled-list original path is foreign")
                  original = receipt_path.parent / basename
                  if original.is_symlink() or not original.is_file():
                      raise SystemExit("Compiled-list original is absent or aliased")
                  value = original.read_bytes()
                  if len(value) != item.get("bytes") or hashlib.sha256(value).hexdigest() != item.get("sha256"):
                      raise SystemExit("Compiled-list original changed before execution/readback")
              return expected_list_sha

          compiled_list_sha = None
          if mode != "list":
              list_receipt = path.with_suffix(".receipt.json") if mode == "check-list" else auxiliary
              compiled_list_sha = bound_compiled_list(list_receipt)
          complete = (exit_code == 0 and capture_exit == 0 and head == os.environ["GITHUB_SHA"] and not dirty
                      and parse_error is None and len(actual) == len(required))
          if mode == "execute":
              complete = (complete and sorted(actual) == sorted((name, "ok") for name in required)
                          and len(rows) == 1 and rows[0][:5] == ["ok", str(expected_count), "0", "0", "0"])
          receipt = {"schema": "motionwright.native.closed-source-roster/1" if mode == "execute" else "motionwright.native.closed-compiled-list/1",
                     "phase": mode, "executed_test_count": len(actual) if mode == "execute" and complete else 0,
                     "compiled_list_receipt_sha256": compiled_list_sha, "source_sha": head, "tree_sha": tree,
                     "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                     "job": os.environ["GITHUB_JOB"], "label": label, "required": sorted(required),
                     "observed": actual, "terminal_rows": rows, "exit_code": exit_code, "capture_exit_code": capture_exit,
                     "parse_error": parse_error, "diagnostics": diagnostics,
                     "log": {"file": path.name, "bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()},
                     "stream_representation": "Original process stdout/stderr merged by shell" if mode == "execute" else "Original compiled-list stdout; separate original stderr",
                     "status": ("PASS" if mode == "execute" else "PASS_COMPILED_LIST") if complete else "FAIL", "native_execution": False,
                     "formal_acceptance": False}
          if mode != "execute":
              original_stderr = auxiliary.read_bytes()
              receipt["stderr"] = {"file": auxiliary.name, "bytes": len(original_stderr),
                                   "sha256": hashlib.sha256(original_stderr).hexdigest()}
          if mode != "check-list":
              with path.with_suffix(".receipt.json").open("x", encoding="utf-8") as stream:
                  json.dump(receipt, stream, indent=2, sort_keys=True)
                  stream.write("\n")
          print(json.dumps({"label": label, "status": receipt["status"], "source_sha": head,
                            "required_count": expected_count, "observed_count": len(actual), "exit_code": exit_code}))
          if not complete:
              raise SystemExit("Exact source roster omitted, renamed, duplicated, skipped, failed or source changed")
          PY
          }
          run_contract() {
            label="$1"
            expected="$2"
            shift 2
            list_stdout="$g1_logs/$label.list.stdout.log"
            list_stderr="$g1_logs/$label.list.stderr.log"
            list_receipt="$g1_logs/$label.list.stdout.receipt.json"
            if [ "$contract_phase" = list ]; then
              set +e
              "$@" --list --format terse >"$list_stdout" 2>"$list_stderr"
              list_exit="$?"
              set -e
              admit_contract list "$list_stdout" "$expected" "$label" "$list_exit" 0 "$list_stderr" -
              list_hash=$(sha256sum "$list_receipt")
              list_hash="${list_hash%% *}"
              [[ "$list_hash" =~ ^[0-9a-f]{64}$ ]]
              compiled_list_sha["$label"]="$list_hash"
              return
            fi
            test "$contract_phase" = execute
            list_hash="${compiled_list_sha[$label]}"
            admit_contract check-list "$list_stdout" "$expected" "$label" 0 0 "$list_stderr" "$list_hash"
            set +e
            "$@" 2>&1 | tee "$g1_logs/$label.log"
            contract_statuses=("${PIPESTATUS[@]}")
            set -e
            if [ "${#contract_statuses[@]}" -ne 2 ]; then
              printf '%s\n' "Unexpected source/capture pipeline width" >&2
              return 2
            fi
            contract_exit="${contract_statuses[0]}"
            capture_exit="${contract_statuses[1]}"
            admit_contract execute "$g1_logs/$label.log" "$expected" "$label" "$contract_exit" "$capture_exit" "$list_receipt" "$list_hash"
          }
          cargo build --locked -p motionwright-manim-community-driver --bins 2>&1 | tee "$g1_logs/build-manim-bins.log"
          cargo build --locked -p motionwright-native --example native-manim-e2e 2>&1 | tee "$g1_logs/build-manim-example.log"
          # Reconcile every compiled scope before executing any test method.
          for contract_phase in list execute; do
            run_contract projections 18 cargo test --locked -p motionwright-native \
              --lib multi_renderer::tests:: -- --nocapture --test-threads=1
            run_contract native-manim-example 23 cargo test --locked -p motionwright-native \
              --example native-manim-e2e -- --nocapture --test-threads=1
            # The runner was removed from the earlier package-wide invocation so
            # these exact 22 cases execute once. Graph coordinator tests already run
            # in the existing Production driver boundaries step below.
            run_contract manim-runtime-runner 22 cargo test --locked -p motionwright-manim-community-driver \
              --bin motionwright-manim-runner -- --nocapture --test-threads=1
            run_contract graph-projection21 21 cargo test --locked -p motionwright-native \
              --test manim_graph_projection -- --nocapture --test-threads=1
            run_contract graph-source-cycle12 12 cargo test --locked -p motionwright-native \
              --lib manim_graph_projection::source_cycle_tests:: -- --nocapture --test-threads=1
            run_contract graph-admission20 20 cargo test --locked -p motionwright-native \
              --lib production::manim_graph::tests:: -- --nocapture --test-threads=1
            run_contract graph-profile11 11 cargo test --locked -p motionwright-native \
              --lib production::manim_graph_profile::tests:: -- --nocapture --test-threads=1
            run_contract graph-transport8 8 cargo test --locked -p motionwright-native \
              --lib production::transport_custody::tests:: -- --nocapture --test-threads=1
            run_contract native-film180-example30 30 cargo test --locked -p motionwright-native \
              --example native-film180-e2e -- --nocapture --test-threads=1
            run_contract manim-static-projection 5 cargo test --locked -p motionwright-native \
              --test manim_static_projection -- --nocapture --test-threads=1
            run_contract manim-editable-projection 7 cargo test --locked -p motionwright-native \
              --test manim_editable_projection -- --nocapture --test-threads=1
            run_contract fractional-rate-admission 1 cargo test --locked -p motionwright-native \
              --lib production::tests::fractional_rate_conversion_is_refused_before_dispatch_and_exact_rate_runs \
              -- --exact --nocapture --test-threads=1
            run_contract partitioned-master-clock 1 cargo test --locked -p motionwright-native \
              --lib film::tests::rational_frame_identity_preserves_partitioned_master_without_accumulated_error \
              -- --exact --nocapture --test-threads=1
            run_contract profile-rate-drift 1 cargo test --locked -p motionwright-native \
              --lib film::tests::native_render_rejects_frame_rate_drift_from_profile \
              -- --exact --nocapture --test-threads=1
            run_contract brand-fonts 5 cargo test --locked -p motionwright-service \
              --lib brand_fonts::tests:: -- --nocapture --test-threads=1
            run_contract native-brand-fonts 7 cargo test --locked -p motionwright-native \
              --lib production::brand_fonts::tests:: -- --nocapture --test-threads=1
          done
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code --quiet
      - name: Production driver boundaries
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p motionwright-native production::tests --all-targets 2>&1 | tee "$RUNNER_TEMP/multi-renderer-source-g1/production-boundaries.log"
      - name: Manim camera source persistence and reopen
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p motionwright-native --test manim_camera_source 2>&1 | tee "$RUNNER_TEMP/multi-renderer-source-g1/manim-camera-source.log"
      - name: Multi-renderer clippy
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p motionwright-native -p motionwright-manim-profile -p motionwright-manim-community-driver --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/multi-renderer-source-g1/clippy.log"
      - name: Retain multi-renderer source G1 originals
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: multi-renderer-source-g1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/multi-renderer-source-g1/
          if-no-files-found: error
          retention-days: 14

  locked-blender-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - name: Resolve pinned Semwright revision
        timeout-minutes: 1
        id: lock
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          lock = json.load(open("SOURCE_LOCK.json", encoding="utf-8"))
          print("sha=" + lock["dependencies"]["semwright"]["revision"])
          PY
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          repository: seradotcom/semwright
          ref: ${{ steps.lock.outputs.sha }}
          path: semwright
      - uses: dtolnay/rust-toolchain@master
        timeout-minutes: 10
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 3
        with:
          workspaces: semwright
      - name: Verify curated Blender driver catalog has no generic Python escape
        timeout-minutes: 15
        working-directory: semwright
        shell: bash
        run: |
          set -euo pipefail
          catalog_log="$RUNNER_TEMP/blender-catalog-original.log"
          cargo test --locked -p semwright-driver-blender --bin semwright-blender-driver tests::curated_commands_are_migrated_without_generic_python_escape -- --exact --nocapture 2>&1 | tee "$catalog_log"
          python3 - "$catalog_log" <<'PY'
          from pathlib import Path
          import re
          import sys
          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          text = re.sub(r"\x1b\[[0-9;]*m", "", text)
          expected = "tests::curated_commands_are_migrated_without_generic_python_escape"
          actual = re.findall(r"(?m)^test ([\w:]+) \.\.\. (ok|FAILED|ignored)$", text)
          assert actual == [(expected, "ok")], "Catalogue assertion was omitted, duplicated or failed"
          summaries = re.findall(
              r"(?m)^test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; "
              r"(\d+) ignored; (\d+) measured; (\d+) filtered out;", text)
          assert len(summaries) == 1, "Catalogue terminal summary is missing or ambiguous"
          assert summaries[0][:5] == ("ok", "1", "0", "0", "0"), "Catalogue assertion did not pass"
          print("blender-catalog-contract=PASS actual_tests=1")
          PY

      - name: Retain canonical Blender catalog original
        timeout-minutes: 4
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: blender-catalog-source-original-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/blender-catalog-original.log
          if-no-files-found: error
          retention-days: 14

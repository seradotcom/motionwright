name: HyperFrames native profile

on:
  workflow_dispatch:
  push:
    branches: ['ci/v05-hyperframes-native']
  pull_request:
    paths:
      - 'crates/hyperframes-profile/**'
      - 'crates/driver-hyperframes/**'
      - 'runtime/hyperframes/**'
      - 'tooling/hyperframes/**'
      - '.github/workflows/hyperframes-native.yml'

permissions:
  contents: read
concurrency:
  group: hyperframes-profile-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  creative-library-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: creative-library-1.98.1
          cache-on-failure: true
      - name: Verify every first-party creative realization and its determinism
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked -p motionwright-creative-library --all-targets
          cargo clippy --locked -p motionwright-creative-library --all-targets -- -D warnings

  native-studio-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - name: Studio native editor contracts and build
        run: |
          set -euo pipefail
          npm --prefix apps/studio ci --no-audit --no-fund
          npm --prefix apps/studio test
          npm --prefix apps/studio run build
          cd apps/studio
          npx playwright install --with-deps chromium
          npx playwright test tests/native-creative.spec.ts tests/creative-production.spec.ts
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: native-studio-desktop-1.98.1
          cache-on-failure: true
      - name: Desktop native command and read-grant boundary
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
          cargo test --locked -p motionwright-desktop --all-targets
          cargo clippy --locked -p motionwright-desktop --all-targets -- -D warnings
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-creative-studio-${{ github.sha }}
          path: |
            apps/studio/test-results/
            apps/studio/dist/
          if-no-files-found: warn
          retention-days: 7

  creative-integration-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: hyperframes-app-contracts-1.98.1
          cache-on-failure: true
      - name: Preserve existing application contracts and new native source boundaries
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked -p motionwright-domain -p motionwright-storage -p motionwright-service -p motionwright-native --all-targets
          cargo clippy --locked -p motionwright-domain -p motionwright-storage -p motionwright-service -p motionwright-native --all-targets -- -D warnings

  native-profile:
    # This profile keeps Chromium's sandbox enabled and uses a worker that
    # supports unprivileged browser namespaces without relaxing host controls.
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: hyperframes-native-profile-1.98.1
          cache-on-failure: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: runtime/hyperframes/package-lock.json
      - name: Validate the bounded source and driver contracts
        run: |
          set -euo pipefail
          python3 tooling/source_policy.py
          cargo fmt --all -- --check
          cargo test --locked -p motionwright-hyperframes-profile -p motionwright-hyperframes-driver --all-targets
          cargo clippy --locked -p motionwright-hyperframes-profile -p motionwright-hyperframes-driver --all-targets -- -D warnings
          cargo build --locked -p motionwright-hyperframes-driver --bins
          cargo build --locked -p motionwright-hyperframes-profile --example native_fixture
          node --check runtime/hyperframes/authoring.js
          node --check runtime/hyperframes/capture.mjs
      - name: Provision the exact opt-in native runtime on this disposable worker
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg python3-pil
          cd runtime/hyperframes
          npm ci --ignore-scripts --no-audit --no-fund
          PLAYWRIGHT_BROWSERS_PATH="$PWD/.browsers" npx playwright install --with-deps chromium
          PLAYWRIGHT_BROWSERS_PATH="$PWD/.browsers" node prepare-runtime.mjs
      - name: Capture actual native frames, alpha, custom curves and rational clocks
        run: |
          set -euo pipefail
          /usr/bin/python3 tooling/hyperframes/native_smoke.py
      - name: Resolve the canonical Broker dependency
        id: provider
        run: |
          set -euo pipefail
          echo "sha=$(python3 -c 'import json; print(json.load(open("SOURCE_LOCK.json"))["dependencies"]["semwright"]["revision"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: seradotcom/semwright
          ref: ${{ steps.provider.outputs.sha }}
          path: _semwright
          persist-credentials: false
      - name: Build exact canonical Broker and Driver Host
        run: |
          set -euo pipefail
          test "$(git -C _semwright rev-parse HEAD)" = "${{ steps.provider.outputs.sha }}"
          sudo apt-get install -y --no-install-recommends bubblewrap libpipewire-0.3-dev pkg-config clang
          cargo build --locked -p motionwright-native --example native-hyperframes-e2e
          cd _semwright
          cargo build --locked -p semwright-daemon -p semwright-cli --bins
          cargo build --locked -p semwright-plugin-host --bin semwright-sandbox
      - name: Exercise the real Driver Host and compare every frame with the direct engine
        env:
          SEMWRIGHT_CHECKOUT: ${{ github.workspace }}/_semwright
          SEMWRIGHT_TEST_DRIVER_SANDBOX: '1'
          SEMWRIGHT_TEST_SANDBOX_HELPER: ${{ github.workspace }}/_semwright/target/debug/semwright-sandbox
        run: |
          set -euo pipefail
          mkdir -p verification/hyperframes-broker
          bash _semwright/scripts/dev/ci-driver-bwrap-profile.sh "$GITHUB_WORKSPACE/verification/hyperframes-broker/sandbox-profile.txt"
          /usr/bin/python3 tooling/hyperframes/broker_smoke.py

      - name: Publish source-bound native evidence, not creative acceptance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hyperframes-native-${{ github.sha }}
          path: |
            verification/hyperframes-native/
            verification/hyperframes-broker/
          if-no-files-found: warn
          retention-days: 7

name: HyperFrames native profile

on:
  workflow_dispatch:
    inputs:
      selected_gate:
        description: "Select a specific expensive native gate for disposable CI iteration"
        type: choice
        required: true
        default: full
        options:
          - full
          - broker
          - creative-library
          - creative-design
          - browser-inspection
  push:
    branches: ['ci/v05-hyperframes-native', 'ci/v05-native-fidelity-continuation']
  pull_request:
    paths:
      - 'crates/hyperframes-profile/**'
      - 'crates/driver-hyperframes/**'
      - 'runtime/hyperframes/**'
      - 'tooling/hyperframes/**'
      - '.github/workflows/hyperframes-native.yml'

permissions:
  contents: read
concurrency:
  group: hyperframes-profile-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  creative-library-contracts:
    if: github.event_name != 'workflow_dispatch' || inputs.selected_gate == 'full' || inputs.selected_gate == 'creative-library'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: creative-library-1.98.1
          cache-on-failure: true
      - name: Verify every first-party creative realization and its determinism
        run: |
          set -euo pipefail
          python3 tooling/hyperframes/test_owner_provision.py -v
          python3 tooling/hyperframes/test_design_review_bundle.py -v
          python3 tooling/hyperframes/test_requirement_audit.py -v
          cargo fmt --all -- --check
          cargo test --locked -p motionwright-creative-library --all-targets
          cargo clippy --locked -p motionwright-creative-library --all-targets -- -D warnings

  sealed-browser-admission:
    if: github.event_name != 'workflow_dispatch' || inputs.selected_gate == 'full' || inputs.selected_gate == 'browser-inspection'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: runtime/hyperframes/package-lock.json
      - name: Verify exact built-in Playwright browser sizes against sealed Host limit
        run: |
          set -euo pipefail
          cd runtime/hyperframes
          npm ci --ignore-scripts --no-audit --no-fund
          PLAYWRIGHT_BROWSERS_PATH="$PWD/.browsers" npx playwright install chromium
          PLAYWRIGHT_BROWSERS_PATH="$PWD/.browsers" node prepare-runtime.mjs
          cd ../..
          node tooling/hyperframes/sealed_browser_probe.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: exact-browser-sealed-tool-admission-${{ github.sha }}
          path: verification/browser-tool-profile/
          if-no-files-found: warn
          retention-days: 7

  native-blender-stage-preview:
    if: github.event_name != 'workflow_dispatch' || inputs.selected_gate == 'full' || inputs.selected_gate == 'creative-design'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: native-blender-stage-1.98.1
          cache-on-failure: true
      - name: Install disposable CPU-only Blender and native source dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender python3-pil python3-numpy libegl1 libgbm1 libgles2 libgl1-mesa-dri xvfb xauth ffmpeg
          blender -b --version | head -1
          python3 -m py_compile runtime/blender-stage/fixed_render.py runtime/blender-stage/inspect_scene.py runtime/blender-stage/render_clip.py
      - name: Build typed stage plan and reopen actual Blender camera/geometry
        run: |
          set -euo pipefail
          cargo build --locked -p motionwright-creative-library --example native_catalog_fixture
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x1024x24" /usr/bin/python3 tooling/blender-stage/native_e2e.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: original-blender-stage-preview-${{ github.sha }}
          path: verification/blender-native-stage/
          if-no-files-found: warn
          retention-days: 7

  creative-original-audio:
    if: github.event_name != 'workflow_dispatch' || inputs.selected_gate == 'full' || inputs.selected_gate == 'creative-design'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: creative-original-pcm-1.98.1
          cache-on-failure: true
      - name: Verify original sound through an independent PCM decoder
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg python3-pil
          cargo build --locked -p motionwright-creative-library --example original_sound_fixture
          python3 tooling/hyperframes/original_sound_e2e.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: original-audio-${{ github.sha }}
          path: verification/creative-original-audio/
          if-no-files-found: warn
          retention-days: 7

  native-studio-desktop:
    if: github.event_name != 'workflow_dispatch' || inputs.selected_gate == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - name: Studio native editor contracts and build
        run: |
          set -euo pipefail
          npm --prefix apps/studio ci --no-audit --no-fund
          npm --prefix apps/studio test
          npm --prefix apps/studio run build
          cd apps/studio
          npx playwright install --with-deps chromium
          npx playwright test tests/native-creative.spec.ts tests/creative-production.spec.ts
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: native-studio-desktop-1.98.1
          cache-on-failure: true
      - name: Desktop native command and read-grant boundary
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
          cargo test --locked -p motionwright-desktop --all-targets
          cargo clippy --locked -p motionwright-desktop --all-targets -- -D warnings
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-creative-studio-${{ github.sha }}
          path: |
            apps/studio/test-results/
            apps/studio/dist/
          if-no-files-found: warn
          retention-days: 7

  creative-integration-contracts:
    if: github.event_name != 'workflow_dispatch' || inputs.selected_gate == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: hyperframes-app-contracts-1.98.1
          cache-on-failure: true
      - name: Preserve existing application contracts and new native source boundaries
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked -p motionwright-domain -p motionwright-storage -p motionwright-service -p motionwright-native --all-targets
          cargo clippy --locked -p motionwright-domain -p motionwright-storage -p motionwright-service -p motionwright-native --all-targets -- -D warnings

  native-profile:
    if: github.event_name != 'workflow_dispatch' || inputs.selected_gate == 'full'
    # This profile keeps Chromium's sandbox enabled and uses a worker that
    # supports unprivileged browser namespaces without relaxing host controls.
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: hyperframes-native-profile-1.98.1
          cache-on-failure: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: runtime/hyperframes/package-lock.json
      - name: Validate the bounded source and driver contracts
        run: |
          set -euo pipefail
          python3 tooling/source_policy.py
          cargo fmt --all -- --check
          cargo test --locked -p motionwright-hyperframes-profile -p motionwright-hyperframes-driver --all-targets
          cargo clippy --locked -p motionwright-hyperframes-profile -p motionwright-hyperframes-driver --all-targets -- -D warnings
          cargo build --locked -p motionwright-hyperframes-driver --bins
          cargo build --locked -p motionwright-hyperframes-profile --example native_fixture
          node --check runtime/hyperframes/authoring.js
          node --check runtime/hyperframes/capture.mjs
          node --test runtime/hyperframes/sandbox_policy.test.mjs
      - name: Provision the exact opt-in native runtime on this disposable worker
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg python3-pil
          cd runtime/hyperframes
          npm ci --ignore-scripts --no-audit --no-fund
          PLAYWRIGHT_BROWSERS_PATH="$PWD/.browsers" npx playwright install --with-deps chromium
          PLAYWRIGHT_BROWSERS_PATH="$PWD/.browsers" node prepare-runtime.mjs
      - name: Capture actual native frames, alpha, custom curves and rational clocks
        run: |
          set -euo pipefail
          /usr/bin/python3 tooling/hyperframes/native_smoke.py
      - name: Publish source-bound native evidence, not creative acceptance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hyperframes-native-${{ github.sha }}
          path: verification/hyperframes-native/
          if-no-files-found: warn
          retention-days: 7

  creative-visual-review:
    if: github.event_name != 'workflow_dispatch' || inputs.selected_gate == 'full' || inputs.selected_gate == 'creative-design'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: creative-visual-${{ matrix.shard }}-1.98.1
          cache-on-failure: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: runtime/hyperframes/package-lock.json
      - name: Provision isolated native renderer without executing imported source programs
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg python3-pil
          cd runtime/hyperframes
          npm ci --ignore-scripts --no-audit --no-fund
          PLAYWRIGHT_BROWSERS_PATH="$PWD/.browsers" npx playwright install --with-deps chromium
          PLAYWRIGHT_BROWSERS_PATH="$PWD/.browsers" node prepare-runtime.mjs
      - name: Build typed catalog/renderer profile and execute native frame review
        run: |
          set -euo pipefail
          cargo build --locked -p motionwright-hyperframes-driver --bin motionwright-hyperframes-runner
          cargo build --locked -p motionwright-creative-library --example native_catalog_fixture
          /usr/bin/python3 tooling/hyperframes/creative_visual_e2e.py ${{ matrix.shard }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-creative-review-shard-${{ matrix.shard }}-${{ github.sha }}
          path: verification/hyperframes-creative/
          if-no-files-found: warn
          retention-days: 7

  creative-human-review-pack:
    if: github.event_name != 'workflow_dispatch' || inputs.selected_gate == 'full' || inputs.selected_gate == 'creative-design'
    needs:
      - creative-visual-review
      - native-blender-stage-preview
      - creative-original-audio
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-creative-review-shard-*-${{ github.sha }}
          path: _review_inputs/visual
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: original-blender-stage-preview-${{ github.sha }}
          path: _review_inputs/blender
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: original-audio-${{ github.sha }}
          path: _review_inputs/audio
      - name: Assemble compact exact-head native design review material
        run: |
          set -euo pipefail
          python3 -m py_compile tooling/hyperframes/design_review_bundle.py
          python3 tooling/hyperframes/design_review_bundle.py _review_inputs/visual _review_inputs/blender _review_inputs/audio verification/human-review/motionwright-v05-creative-review.zip "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: creative-v05-human-review-pack-${{ github.sha }}
          path: verification/human-review/
          if-no-files-found: warn
          retention-days: 7

  canonical-broker:
    if: github.event_name != 'workflow_dispatch' || inputs.selected_gate == 'full' || inputs.selected_gate == 'broker'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve pinned Semwright version
        id: pin
        run: |
          echo "sha=$(python3 -c 'import json; print(json.load(open("SOURCE_LOCK.json"))["dependencies"]["semwright"]["revision"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: seradotcom/semwright
          ref: ${{ steps.pin.outputs.sha }}
          path: _semwright
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: hyperframes-broker-1.98.1
          cache-on-failure: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: runtime/hyperframes/package-lock.json
      - name: Provision disposable sandbox-compatible browser and pinned runtime
        run: |
          set -euo pipefail
          test "$(git -C _semwright rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"
          python3 tooling/source_policy.py
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap ffmpeg python3-pil libpipewire-0.3-dev pkg-config clang
          # The exact Semwright source pin installs its scoped AppArmor bwrap
          # profile below. Do NOT disable host unprivileged-userns restrictions.
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" != 0
          test "$(sysctl -n kernel.unprivileged_userns_clone)" = 1
          cd runtime/hyperframes
          npm ci --ignore-scripts --no-audit --no-fund
          PLAYWRIGHT_BROWSERS_PATH="$PWD/.browsers" npx playwright install --with-deps chromium
          PLAYWRIGHT_BROWSERS_PATH="$PWD/.browsers" node prepare-runtime.mjs
      - name: Build application driver and pinned Semwright Host
        run: |
          set -euo pipefail
          cargo build --locked -p motionwright-hyperframes-driver --bins
          cargo build --locked -p motionwright-hyperframes-profile --example native_fixture
          cargo build --locked -p motionwright-native --example native-hyperframes-e2e
          cd _semwright
          cargo build --locked -p semwright-daemon -p semwright-cli --bins
          cargo build --locked -p semwright-plugin-host --bin semwright-sandbox
      - name: Compare canonical Host execution against the same source in the direct renderer
        env:
          SEMWRIGHT_CHECKOUT: ${{ github.workspace }}/_semwright
          SEMWRIGHT_TEST_DRIVER_SANDBOX: '1'
          SEMWRIGHT_TEST_SANDBOX_HELPER: ${{ github.workspace }}/_semwright/target/debug/semwright-sandbox
        run: |
          set -euo pipefail
          mkdir -p verification/hyperframes-broker
          bash _semwright/scripts/dev/ci-driver-bwrap-profile.sh "$GITHUB_WORKSPACE/verification/hyperframes-broker/sandbox-profile.txt"
          /usr/bin/python3 tooling/hyperframes/broker_smoke.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: hyperframes-canonical-broker-${{ github.sha }}
          path: verification/hyperframes-broker/
          if-no-files-found: warn
          retention-days: 7

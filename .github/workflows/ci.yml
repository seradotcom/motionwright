name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  # This plan controls only the jobs below. No neutral exclusions are currently
  # admitted: unresolved runtime consumers keep all original tests selected.
  plan:
    runs-on: ubuntu-latest
    outputs:
      plan_id: ${{ steps.plan.outputs.plan_id }}
      rust_tests: ${{ steps.plan.outputs.rust_tests }}
      studio_tests: ${{ steps.plan.outputs.studio_tests }}
      browser_acceptance: ${{ steps.plan.outputs.browser_acceptance }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Compute applicability from original Git source and event
        id: plan
        run: >-
          python3 -I -B tooling/ci_job_plan.py plan
          --repo "$GITHUB_WORKSPACE" --event-path "$GITHUB_EVENT_PATH"
          --output "$RUNNER_TEMP/motionwright-ci/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/plan/plan.json"
          --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-job-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/motionwright-ci/${{ github.run_id }}-${{ github.run_attempt }}/plan/plan.json
          if-no-files-found: error

  source-policy:
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      checkout_sha: ${{ steps.source.outputs.checkout_sha }}
      tree_sha: ${{ steps.source.outputs.tree_sha }}
      workflow_sha256: ${{ steps.source.outputs.workflow_sha256 }}
      planner_git_sha256: ${{ steps.source.outputs.planner_git_sha256 }}
      planner_execution_sha256: ${{ steps.source.outputs.planner_execution_sha256 }}
      cargo_lock_git_sha256: ${{ steps.source.outputs.cargo_lock_git_sha256 }}
      cargo_lock_worktree_sha256: ${{ steps.source.outputs.cargo_lock_worktree_sha256 }}
      plan_id: ${{ steps.source.outputs.plan_id }}
      run_id: ${{ steps.source.outputs.run_id }}
      run_attempt: ${{ steps.source.outputs.run_attempt }}
      emitter_job: ${{ steps.source.outputs.emitter_job }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Check Actions syntax and contexts with pinned actionlint
        id: actions_schema
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python3 -I -B -S - <<'PY'
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import subprocess
          import tarfile
          import urllib.request

          VERSION = '1.7.12'
          URL = 'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz'
          ARCHIVE_SHA256 = '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'

          def require(ok, message):
              if not ok:
                  raise ValueError(message)

          def read(path, limit=16 * 1024 * 1024):
              path = Path(path).absolute()
              for component in (path, *path.parents):
                  info = component.lstat()
                  require(not stat.S_ISLNK(info.st_mode), 'Linked source or tool evidence')
              before = path.stat()
              require(stat.S_ISREG(before.st_mode) and 0 <= before.st_size <= limit, 'Unbounded input')
              with path.open('rb') as stream:
                  opened = os.fstat(stream.fileno())
                  raw = stream.read(before.st_size + 1)
                  closed = os.fstat(stream.fileno())
              signature = lambda value: (value.st_dev, value.st_ino, value.st_size, value.st_mtime_ns)
              require(signature(before) == signature(opened) == signature(closed) == signature(path.stat())
                      and len(raw) == before.st_size, 'Input changed while read')
              return raw

          def identity(raw):
              return {'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()}

          context = {name: os.environ.get(name, '') for name in ('GITHUB_SHA', 'GITHUB_WORKFLOW_SHA', 'GITHUB_WORKFLOW_REF',
                     'GITHUB_REPOSITORY', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB')}
          require(all(context.values()), 'Incomplete workflow execution identity')
          require(re.fullmatch(r'[0-9a-f]{40}', context['GITHUB_SHA']) and re.fullmatch(r'[0-9a-f]{40}', context['GITHUB_WORKFLOW_SHA']),
                  'Missing exact source and verifier identity')
          require(all(context[name].isdecimal() and int(context[name]) > 0 for name in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT'))
                  and re.fullmatch(r'[A-Za-z0-9_-]+', context['GITHUB_JOB']), 'Invalid run or job identity')
          repo = Path(os.environ['GITHUB_WORKSPACE']).absolute()
          output = Path(os.environ['RUNNER_TEMP']).absolute() / 'motionwright-actionlint' / (
              context['GITHUB_RUN_ID'] + '-' + context['GITHUB_RUN_ATTEMPT'] + '-' + context['GITHUB_JOB'])
          require(repo not in (output, *output.parents), 'Tool output must be outside checkout')
          for part in output.parents:
              if part.exists() or part.is_symlink():
                  require(part.is_dir() and not part.is_symlink(), 'Linked output ancestor')
          output.mkdir(parents=True, exist_ok=False)

          def write(name, raw):
              with (output / name).open('xb') as stream:
                  require(stream.write(raw) == len(raw), 'Short retained write')
                  stream.flush()
                  os.fsync(stream.fileno())
              require(read(output / name) == raw, 'Retained write readback differs')

          def save(name, value):
              write(name, (json.dumps(value, sort_keys=True, indent=2, allow_nan=False) + '\n').encode())

          environment = {key: value for key, value in os.environ.items() if not key.upper().startswith('GIT_')}
          environment.update(GIT_NO_REPLACE_OBJECTS='1', GIT_GRAFT_FILE=os.devnull, GIT_NO_LAZY_FETCH='1',
                             GIT_CONFIG_NOSYSTEM='1', GIT_CONFIG_GLOBAL=os.devnull, GIT_OPTIONAL_LOCKS='0')

          def git(*args):
              process = subprocess.run(['git', '--no-replace-objects', '-c', 'core.fsmonitor=false', '-C', str(repo), *args],
                                       env=environment, capture_output=True, timeout=45)
              require(process.returncode == 0, 'Original Git source read failed')
              return process.stdout

          result = {'schema': 'motionwright.actionlint-g0-result/1', 'execution_context': context,
                    'tool_version': VERSION, 'archive_url': URL, 'expected_archive_sha256': ARCHIVE_SHA256,
                    'original_exit_code': None, 'state': 'NOT_ADMITTED', 'test_case_results_admitted': False,
                    'product_or_native_execution': False, 'formal_acceptance': False}
          try:
              sha = context['GITHUB_SHA']
              require(git('rev-parse', 'HEAD').decode().strip() == sha, 'Checkout SHA differs')
              require(not git('status', '--porcelain=v1', '--untracked-files=all', '--ignored=matching'), 'Source checkout is not clean')
              commit = git('cat-file', 'commit', sha)
              require(hashlib.sha1(b'commit ' + str(len(commit)).encode() + b'\0' + commit).hexdigest() == sha, 'Raw commit differs')
              result['source_commit'] = identity(commit)
              trees = [line[5:].decode() for line in commit.split(b'\n\n', 1)[0].splitlines() if line.startswith(b'tree ')]
              require(len(trees) == 1 and re.fullmatch(r'[0-9a-f]{40}', trees[0]), 'Missing original tree')
              result['source_tree'] = trees[0]
              inputs = {}
              for row in git('ls-tree', '-rz', sha, '--', '.github/workflows').split(b'\0'):
                  if not row:
                      continue
                  metadata, name = row.split(b'\t', 1)
                  name = name.decode('utf-8')
                  if not name.endswith(('.yml', '.yaml')):
                      continue
                  mode, kind, oid = metadata.decode().split()
                  require(name.count('/') == 2 and mode in ('100644', '100755') and kind == 'blob', 'Nonregular workflow input')
                  raw = read(repo / name)
                  require(hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == oid, 'Raw workflow blob differs')
                  inputs[name] = {'git_blob': oid, **identity(raw)}
              require(inputs, 'No original workflows selected')
              save('inputs.json', {'execution_context': context, 'source_tree': trees[0], 'workflows': inputs})
              with urllib.request.urlopen(URL, timeout=30) as response:
                  archive = response.read(8 * 1024 * 1024 + 1)
              require(len(archive) == 2353908 and hashlib.sha256(archive).hexdigest() == ARCHIVE_SHA256, 'Actionlint archive identity differs')
              result['archive'] = identity(archive)
              with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as bundle:
                  members = [item for item in bundle.getmembers() if item.name == 'actionlint']
                  require(len(members) == 1 and members[0].isfile() and 0 < members[0].size <= 16 * 1024 * 1024,
                          'Missing bounded actionlint executable')
                  with bundle.extractfile(members[0]) as stream:
                      executable = stream.read(members[0].size + 1)
                  require(len(executable) == members[0].size, 'Truncated actionlint executable')
              write('actionlint', executable)
              binary = output / 'actionlint'
              binary.chmod(0o700)
              result['executable'] = identity(executable)
              version = subprocess.run([str(binary), '-version'], env=environment, capture_output=True, timeout=15)
              write('version.stdout.log', version.stdout)
              write('version.stderr.log', version.stderr)
              result['version_exit_code'] = version.returncode
              require(version.returncode == 0 and version.stdout.splitlines()[0] == VERSION.encode(), 'Actionlint version differs')
              # Empty explicit configuration prevents hidden per-path ignores.
              # Shell/Python checks retain their existing gates and budgets.
              write('no-ignores.yml', b'{}\n')
              result['configuration'] = identity(b'{}\n')
              command = [str(binary), '-oneline', '-shellcheck=', '-pyflakes=', '-config-file', str(output / 'no-ignores.yml'), *sorted(inputs)]
              save('intent.json', {'execution_context': context, 'source_tree': trees[0], 'command': command,
                                  'input_count': len(inputs), 'state': 'NOT_COMPLETED', 'retry_attempted': False})
              with (output / 'stdout.log').open('xb') as stdout, (output / 'stderr.log').open('xb') as stderr:
                  process = subprocess.run(command, cwd=repo, env=environment, stdout=stdout, stderr=stderr, timeout=120)
                  result['original_exit_code'] = process.returncode
              result['stdout'] = identity(read(output / 'stdout.log'))
              result['stderr'] = identity(read(output / 'stderr.log'))
              require(git('rev-parse', 'HEAD').decode().strip() == sha
                      and not git('status', '--porcelain=v1', '--untracked-files=all', '--ignored=matching'), 'Source changed during syntax validation')
              require(all(identity(read(repo / name)) == {key: value for key, value in data.items() if key != 'git_blob'}
                          for name, data in inputs.items()), 'Workflow input changed during syntax validation')
              require(identity(read(binary)) == result['executable'], 'Actionlint executable changed')
              require(read(output / 'no-ignores.yml') == b'{}\n', 'Actionlint configuration changed')
              result['input_count'] = len(inputs)
              result['state'] = 'ACTIONS_SYNTAX_AND_CONTEXTS_VALID' if process.returncode == 0 else 'ACTIONLINT_FAILED'
          except subprocess.TimeoutExpired as error:
              result['state'] = 'READ_ONLY_TOOL_UNKNOWN'
              result['error'] = type(error).__name__
          except (OSError, ValueError, KeyError, TypeError, IndexError, tarfile.TarError, subprocess.SubprocessError) as error:
              result['error'] = type(error).__name__ + ': ' + str(error)
          save('result.json', result)
          print(json.dumps(result, sort_keys=True, allow_nan=False))
          code = result['original_exit_code']
          raise SystemExit(code if type(code) is int and code > 0 else 128 - code if type(code) is int and code < 0 else
                           0 if result['state'] == 'ACTIONS_SYNTAX_AND_CONTEXTS_VALID' else 2)
          PY
      - name: Retain original Actions syntax verifier evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: actionlint-original-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: |
            ${{ runner.temp }}/motionwright-actionlint/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/inputs.json
            ${{ runner.temp }}/motionwright-actionlint/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/intent.json
            ${{ runner.temp }}/motionwright-actionlint/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/result.json
            ${{ runner.temp }}/motionwright-actionlint/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/no-ignores.yml
            ${{ runner.temp }}/motionwright-actionlint/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/version.stdout.log
            ${{ runner.temp }}/motionwright-actionlint/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/version.stderr.log
            ${{ runner.temp }}/motionwright-actionlint/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/stdout.log
            ${{ runner.temp }}/motionwright-actionlint/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/stderr.log
          if-no-files-found: error
      - name: Preserve browser custody failures, original exits and UNKNOWN without replay
        id: browser_custody_guards
        env:
          MW_CI_BROWSER_TEST_TMP: ${{ runner.temp }}
        run: >-
          python3 -I -B tooling/ci_test_runner.py
          --repo "$GITHUB_WORKSPACE"
          --pattern test_ci_browser_evidence.py --mode both --require-complete
          --expected-source "$GITHUB_SHA"
          --report "$RUNNER_TEMP/motionwright-ci/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/browser-custody-guards/result.json"
      - name: Retain original G0 browser custody guard results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-browser-custody-guards-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: |
            ${{ runner.temp }}/motionwright-ci/${{ github.run_id }}-${{ github.run_attempt }}/browser-custody-guards/result.json
            ${{ runner.temp }}/motionwright-ci/${{ github.run_id }}-${{ github.run_attempt }}/browser-custody-guards/result-*-stdout.log
            ${{ runner.temp }}/motionwright-ci/${{ github.run_id }}-${{ github.run_attempt }}/browser-custody-guards/result-*-stderr.log
          if-no-files-found: error
      - name: Verify public source boundary and Semwright pin
        run: python3 tooling/source_policy.py
      - name: Verify source distribution hygiene guards
        run: python3 -m unittest discover -s tooling/tests -p 'test_public_surface_policy.py' -v
      - name: Verify acceptance ledger invariants
        run: python3 tooling/acceptance_policy.py
      - name: Verify creative expansion traceability without promoting acceptance
        run: |
          python3 tooling/creative_status_policy.py
          python3 -m unittest discover -s tooling/tests -p 'test_creative_status_policy.py' -v
      - name: Exercise independent acceptance evidence intake guardrails
        run: |
          python3 -m unittest discover -s tooling/tests -p 'test_acceptance_session.py' -v
          python3 -m unittest discover -s tooling/tests -p 'test_acceptance_evidence_identity.py' -v
      - name: Reject silent, swapped or static decoded native AV fixtures
        run: python3 -m unittest discover -s tooling/tests -p 'test_native_av_media_probe.py' -v
      - name: Verify portable MP4 integrity checker trust boundaries
        run: python3 -m unittest discover -s tooling/tests -p 'test_verify_delivered_media.py' -v
      - name: Verify read-only Semwright first-use security guardrails
        run: python3 -m unittest discover -s tooling/tests -p 'test_runtime_first_use_audit.py' -v
      - name: Reject stale source, invalid applicability and omitted selected results
        env:
          MW_CI_JOB_TEST_TMP: ${{ runner.temp }}
        run: python3 -I -B -m unittest discover -s tooling/tests -p 'test_ci_job_plan.py' -v
      - name: Bind job result to original source, plan and execution
        id: source
        if: always()
        working-directory: .
        env:
          CI_PLAN_ID: ${{ needs.plan.outputs.plan_id }}
        run: >-
          python3 -I -B tooling/ci_job_plan.py observe
          --repo "$GITHUB_WORKSPACE" --plan-id "$CI_PLAN_ID"
          --github-output "$GITHUB_OUTPUT"

  rust-core:
    needs: [plan, source-policy]
    runs-on: ubuntu-latest
    outputs:
      checkout_sha: ${{ steps.source.outputs.checkout_sha }}
      tree_sha: ${{ steps.source.outputs.tree_sha }}
      workflow_sha256: ${{ steps.source.outputs.workflow_sha256 }}
      planner_git_sha256: ${{ steps.source.outputs.planner_git_sha256 }}
      planner_execution_sha256: ${{ steps.source.outputs.planner_execution_sha256 }}
      cargo_lock_git_sha256: ${{ steps.source.outputs.cargo_lock_git_sha256 }}
      cargo_lock_worktree_sha256: ${{ steps.source.outputs.cargo_lock_worktree_sha256 }}
      plan_id: ${{ steps.source.outputs.plan_id }}
      run_id: ${{ steps.source.outputs.run_id }}
      run_attempt: ${{ steps.source.outputs.run_attempt }}
      emitter_job: ${{ steps.source.outputs.emitter_job }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked -p motionwright-domain -p motionwright-storage -p motionwright-service -p motionwright-native --all-targets -- -D warnings
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-lockfile
          path: Cargo.lock
          if-no-files-found: error
      - name: Bind job result to original source, plan and execution
        id: source
        if: always()
        working-directory: .
        env:
          CI_PLAN_ID: ${{ needs.plan.outputs.plan_id }}
        run: >-
          python3 -I -B tooling/ci_job_plan.py observe
          --repo "$GITHUB_WORKSPACE" --plan-id "$CI_PLAN_ID"
          --github-output "$GITHUB_OUTPUT"

  rust-tests:
    needs: [plan, rust-core]
    if: ${{ needs.plan.outputs.rust_tests == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      checkout_sha: ${{ steps.source.outputs.checkout_sha }}
      tree_sha: ${{ steps.source.outputs.tree_sha }}
      workflow_sha256: ${{ steps.source.outputs.workflow_sha256 }}
      planner_git_sha256: ${{ steps.source.outputs.planner_git_sha256 }}
      planner_execution_sha256: ${{ steps.source.outputs.planner_execution_sha256 }}
      cargo_lock_git_sha256: ${{ steps.source.outputs.cargo_lock_git_sha256 }}
      cargo_lock_worktree_sha256: ${{ steps.source.outputs.cargo_lock_worktree_sha256 }}
      plan_id: ${{ steps.source.outputs.plan_id }}
      run_id: ${{ steps.source.outputs.run_id }}
      run_attempt: ${{ steps.source.outputs.run_attempt }}
      emitter_job: ${{ steps.source.outputs.emitter_job }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
      - name: Core and Native SDK consumer tests
        run: cargo test --locked -p motionwright-domain -p motionwright-storage -p motionwright-service -p motionwright-native --all-targets
      - name: Bind job result to original source, plan and execution
        id: source
        if: always()
        working-directory: .
        env:
          CI_PLAN_ID: ${{ needs.plan.outputs.plan_id }}
        run: >-
          python3 -I -B tooling/ci_job_plan.py observe
          --repo "$GITHUB_WORKSPACE" --plan-id "$CI_PLAN_ID"
          --github-output "$GITHUB_OUTPUT"

  studio:
    needs: [plan, source-policy]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio
    outputs:
      checkout_sha: ${{ steps.source.outputs.checkout_sha }}
      tree_sha: ${{ steps.source.outputs.tree_sha }}
      workflow_sha256: ${{ steps.source.outputs.workflow_sha256 }}
      planner_git_sha256: ${{ steps.source.outputs.planner_git_sha256 }}
      planner_execution_sha256: ${{ steps.source.outputs.planner_execution_sha256 }}
      cargo_lock_git_sha256: ${{ steps.source.outputs.cargo_lock_git_sha256 }}
      cargo_lock_worktree_sha256: ${{ steps.source.outputs.cargo_lock_worktree_sha256 }}
      plan_id: ${{ steps.source.outputs.plan_id }}
      run_id: ${{ steps.source.outputs.run_id }}
      run_attempt: ${{ steps.source.outputs.run_attempt }}
      emitter_job: ${{ steps.source.outputs.emitter_job }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck and production build
        run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-dist
          path: apps/studio/dist
          if-no-files-found: error
      - name: Bind job result to original source, plan and execution
        id: source
        if: always()
        working-directory: .
        env:
          CI_PLAN_ID: ${{ needs.plan.outputs.plan_id }}
        run: >-
          python3 -I -B tooling/ci_job_plan.py observe
          --repo "$GITHUB_WORKSPACE" --plan-id "$CI_PLAN_ID"
          --github-output "$GITHUB_OUTPUT"

  studio-tests:
    needs: [plan, studio]
    if: ${{ needs.plan.outputs.studio_tests == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio
    outputs:
      checkout_sha: ${{ steps.source.outputs.checkout_sha }}
      tree_sha: ${{ steps.source.outputs.tree_sha }}
      workflow_sha256: ${{ steps.source.outputs.workflow_sha256 }}
      planner_git_sha256: ${{ steps.source.outputs.planner_git_sha256 }}
      planner_execution_sha256: ${{ steps.source.outputs.planner_execution_sha256 }}
      cargo_lock_git_sha256: ${{ steps.source.outputs.cargo_lock_git_sha256 }}
      cargo_lock_worktree_sha256: ${{ steps.source.outputs.cargo_lock_worktree_sha256 }}
      plan_id: ${{ steps.source.outputs.plan_id }}
      run_id: ${{ steps.source.outputs.run_id }}
      run_attempt: ${{ steps.source.outputs.run_attempt }}
      emitter_job: ${{ steps.source.outputs.emitter_job }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Unit contracts
        run: npm test
      - name: Bind job result to original source, plan and execution
        id: source
        if: always()
        working-directory: .
        env:
          CI_PLAN_ID: ${{ needs.plan.outputs.plan_id }}
        run: >-
          python3 -I -B tooling/ci_job_plan.py observe
          --repo "$GITHUB_WORKSPACE" --plan-id "$CI_PLAN_ID"
          --github-output "$GITHUB_OUTPUT"

  browser-acceptance:
    needs: [plan, studio, studio-tests]
    if: ${{ needs.plan.outputs.browser_acceptance == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio
    outputs:
      checkout_sha: ${{ steps.source.outputs.checkout_sha }}
      tree_sha: ${{ steps.source.outputs.tree_sha }}
      workflow_sha256: ${{ steps.source.outputs.workflow_sha256 }}
      planner_git_sha256: ${{ steps.source.outputs.planner_git_sha256 }}
      planner_execution_sha256: ${{ steps.source.outputs.planner_execution_sha256 }}
      cargo_lock_git_sha256: ${{ steps.source.outputs.cargo_lock_git_sha256 }}
      cargo_lock_worktree_sha256: ${{ steps.source.outputs.cargo_lock_worktree_sha256 }}
      plan_id: ${{ steps.source.outputs.plan_id }}
      run_id: ${{ steps.source.outputs.run_id }}
      run_attempt: ${{ steps.source.outputs.run_attempt }}
      emitter_job: ${{ steps.source.outputs.emitter_job }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Browser acceptance
        id: browser
        working-directory: .
        env:
          CI_PLAN_ID: ${{ needs.plan.outputs.plan_id }}
        run: >-
          python3 -I -B tooling/ci_browser_evidence.py
          --repo "$GITHUB_WORKSPACE" --plan-id "$CI_PLAN_ID"
          --output "$RUNNER_TEMP/motionwright-ci/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/browser-original"
      - name: Retain the original browser command, streams and JSON
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && (steps.browser.outcome == 'success' || steps.browser.outcome == 'failure' || steps.browser.outcome == 'cancelled') }}
        with:
          name: ci-browser-original-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: |
            ${{ runner.temp }}/motionwright-ci/${{ github.run_id }}-${{ github.run_attempt }}/browser-original/intent.json
            ${{ runner.temp }}/motionwright-ci/${{ github.run_id }}-${{ github.run_attempt }}/browser-original/process-started.json
            ${{ runner.temp }}/motionwright-ci/${{ github.run_id }}-${{ github.run_attempt }}/browser-original/process-outcome.json
            ${{ runner.temp }}/motionwright-ci/${{ github.run_id }}-${{ github.run_attempt }}/browser-original/stdout.log
            ${{ runner.temp }}/motionwright-ci/${{ github.run_id }}-${{ github.run_attempt }}/browser-original/stderr.log
            ${{ runner.temp }}/motionwright-ci/${{ github.run_id }}-${{ github.run_attempt }}/browser-original/playwright-report.json
            ${{ runner.temp }}/motionwright-ci/${{ github.run_id }}-${{ github.run_attempt }}/browser-original/receipt.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-acceptance-evidence
          path: |
            apps/studio/test-results
            apps/studio/playwright-report
          if-no-files-found: ignore
      - name: Bind job result to original source, plan and execution
        id: source
        if: always()
        working-directory: .
        env:
          CI_PLAN_ID: ${{ needs.plan.outputs.plan_id }}
        run: >-
          python3 -I -B tooling/ci_job_plan.py observe
          --repo "$GITHUB_WORKSPACE" --plan-id "$CI_PLAN_ID"
          --github-output "$GITHUB_OUTPUT"

  desktop-linux:
    needs: [plan, rust-core, rust-tests, studio, studio-tests]
    # A deliberate test exclusion must not propagate a skipped dependency into
    # this mandatory build. Any required failed/cancelled/missing test blocks it.
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
          needs['rust-core'].result == 'success' && needs.studio.result == 'success' &&
          ((needs.plan.outputs.rust_tests == 'true' && needs['rust-tests'].result == 'success') ||
           (needs.plan.outputs.rust_tests == 'false' && needs['rust-tests'].result == 'skipped')) &&
          ((needs.plan.outputs.studio_tests == 'true' && needs['studio-tests'].result == 'success') ||
           (needs.plan.outputs.studio_tests == 'false' && needs['studio-tests'].result == 'skipped')) }}
    runs-on: ubuntu-24.04
    outputs:
      checkout_sha: ${{ steps.source.outputs.checkout_sha }}
      tree_sha: ${{ steps.source.outputs.tree_sha }}
      workflow_sha256: ${{ steps.source.outputs.workflow_sha256 }}
      planner_git_sha256: ${{ steps.source.outputs.planner_git_sha256 }}
      planner_execution_sha256: ${{ steps.source.outputs.planner_execution_sha256 }}
      cargo_lock_git_sha256: ${{ steps.source.outputs.cargo_lock_git_sha256 }}
      cargo_lock_worktree_sha256: ${{ steps.source.outputs.cargo_lock_worktree_sha256 }}
      plan_id: ${{ steps.source.outputs.plan_id }}
      run_id: ${{ steps.source.outputs.run_id }}
      run_attempt: ${{ steps.source.outputs.run_attempt }}
      emitter_job: ${{ steps.source.outputs.emitter_job }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - name: Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: npm --prefix apps/studio ci --no-audit --no-fund
      - run: npm --prefix apps/studio run build
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Check desktop shell
        run: cargo check --locked -p motionwright-desktop
      - name: Exercise read-only native portable MP4 verifier
        run: cargo test --locked -p motionwright-desktop --bin motionwright-desktop media_integrity::tests -- --nocapture
      - name: Bind job result to original source, plan and execution
        id: source
        if: always()
        working-directory: .
        env:
          CI_PLAN_ID: ${{ needs.plan.outputs.plan_id }}
        run: >-
          python3 -I -B tooling/ci_job_plan.py observe
          --repo "$GITHUB_WORKSPACE" --plan-id "$CI_PLAN_ID"
          --github-output "$GITHUB_OUTPUT"

  ci-complete:
    if: always()
    needs: [plan, source-policy, rust-core, rust-tests, studio, studio-tests, browser-acceptance, desktop-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ci-job-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/motionwright-ci/${{ github.run_id }}-${{ github.run_attempt }}/original-plan
      - name: Reconcile selected jobs against this source and execution
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          python3 -I -B tooling/ci_job_plan.py aggregate
          --repo "$GITHUB_WORKSPACE"
          --plan "$RUNNER_TEMP/motionwright-ci/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/original-plan/plan.json"
          --output "$RUNNER_TEMP/motionwright-ci/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/outcomes.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-job-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/motionwright-ci/${{ github.run_id }}-${{ github.run_attempt }}/outcomes.json
          if-no-files-found: error

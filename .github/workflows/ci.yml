name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  # This plan controls only the jobs below. No neutral exclusions are currently
  # admitted: unresolved runtime consumers keep all original tests selected.
  plan:
    runs-on: ubuntu-latest
    outputs:
      plan_id: ${{ steps.plan.outputs.plan_id }}
      rust_tests: ${{ steps.plan.outputs.rust_tests }}
      studio_tests: ${{ steps.plan.outputs.studio_tests }}
      browser_acceptance: ${{ steps.plan.outputs.browser_acceptance }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Compute applicability from original Git source and event
        id: plan
        run: >-
          python3 -I -B tooling/ci_job_plan.py plan
          --repo "$GITHUB_WORKSPACE" --event-path "$GITHUB_EVENT_PATH"
          --output "$RUNNER_TEMP/motionwright-ci/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/plan/plan.json"
          --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-job-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/motionwright-ci/${{ github.run_id }}-${{ github.run_attempt }}/plan/plan.json
          if-no-files-found: error

  source-policy:
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      checkout_sha: ${{ steps.source.outputs.checkout_sha }}
      tree_sha: ${{ steps.source.outputs.tree_sha }}
      workflow_sha256: ${{ steps.source.outputs.workflow_sha256 }}
      planner_git_sha256: ${{ steps.source.outputs.planner_git_sha256 }}
      planner_execution_sha256: ${{ steps.source.outputs.planner_execution_sha256 }}
      cargo_lock_git_sha256: ${{ steps.source.outputs.cargo_lock_git_sha256 }}
      cargo_lock_worktree_sha256: ${{ steps.source.outputs.cargo_lock_worktree_sha256 }}
      plan_id: ${{ steps.source.outputs.plan_id }}
      run_id: ${{ steps.source.outputs.run_id }}
      run_attempt: ${{ steps.source.outputs.run_attempt }}
      emitter_job: ${{ steps.source.outputs.emitter_job }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      # native-impact-tests-begin
      - name: Verify exact CAS native selection and full fallback contracts
        env:
          MW_NATIVE_IMPACT_TEST_TMP: ${{ runner.temp }}
        run: >-
          python3 -B -I -S tooling/ci_test_runner.py
          --repo "$GITHUB_WORKSPACE" --pattern test_ci_native_impact.py
          --mode both --require-complete --expected-source "$GITHUB_SHA"
          --report "$RUNNER_TEMP/native-impact-tests/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/result.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-impact-contracts-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-impact-tests/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
      # native-impact-tests-end
      - name: Verify public source boundary and Semwright pin
        run: python3 tooling/source_policy.py
      - name: Verify source distribution hygiene guards
        run: python3 -m unittest discover -s tooling/tests -p 'test_public_surface_policy.py' -v
      - name: Verify acceptance ledger invariants
        run: python3 tooling/acceptance_policy.py
      - name: Verify creative expansion traceability without promoting acceptance
        run: |
          python3 tooling/creative_status_policy.py
          python3 -m unittest discover -s tooling/tests -p 'test_creative_status_policy.py' -v
      - name: Exercise independent acceptance evidence intake guardrails
        run: |
          python3 -m unittest discover -s tooling/tests -p 'test_acceptance_session.py' -v
          python3 -m unittest discover -s tooling/tests -p 'test_acceptance_evidence_identity.py' -v
      - name: Reject silent, swapped or static decoded native AV fixtures
        run: python3 -m unittest discover -s tooling/tests -p 'test_native_av_media_probe.py' -v
      - name: Verify portable MP4 integrity checker trust boundaries
        run: python3 -m unittest discover -s tooling/tests -p 'test_verify_delivered_media.py' -v
      - name: Verify read-only Semwright first-use security guardrails
        run: python3 -m unittest discover -s tooling/tests -p 'test_runtime_first_use_audit.py' -v
      - name: Reject stale source, invalid applicability and omitted selected results
        env:
          MW_CI_JOB_TEST_TMP: ${{ runner.temp }}
        run: python3 -I -B -m unittest discover -s tooling/tests -p 'test_ci_job_plan.py' -v
      - name: Bind job result to original source, plan and execution
        id: source
        if: always()
        working-directory: .
        env:
          CI_PLAN_ID: ${{ needs.plan.outputs.plan_id }}
        run: >-
          python3 -I -B tooling/ci_job_plan.py observe
          --repo "$GITHUB_WORKSPACE" --plan-id "$CI_PLAN_ID"
          --github-output "$GITHUB_OUTPUT"

  rust-core:
    needs: [plan, source-policy]
    runs-on: ubuntu-latest
    outputs:
      checkout_sha: ${{ steps.source.outputs.checkout_sha }}
      tree_sha: ${{ steps.source.outputs.tree_sha }}
      workflow_sha256: ${{ steps.source.outputs.workflow_sha256 }}
      planner_git_sha256: ${{ steps.source.outputs.planner_git_sha256 }}
      planner_execution_sha256: ${{ steps.source.outputs.planner_execution_sha256 }}
      cargo_lock_git_sha256: ${{ steps.source.outputs.cargo_lock_git_sha256 }}
      cargo_lock_worktree_sha256: ${{ steps.source.outputs.cargo_lock_worktree_sha256 }}
      plan_id: ${{ steps.source.outputs.plan_id }}
      run_id: ${{ steps.source.outputs.run_id }}
      run_attempt: ${{ steps.source.outputs.run_attempt }}
      emitter_job: ${{ steps.source.outputs.emitter_job }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked -p motionwright-domain -p motionwright-storage -p motionwright-service -p motionwright-native --all-targets -- -D warnings
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-lockfile
          path: Cargo.lock
          if-no-files-found: error
      - name: Bind job result to original source, plan and execution
        id: source
        if: always()
        working-directory: .
        env:
          CI_PLAN_ID: ${{ needs.plan.outputs.plan_id }}
        run: >-
          python3 -I -B tooling/ci_job_plan.py observe
          --repo "$GITHUB_WORKSPACE" --plan-id "$CI_PLAN_ID"
          --github-output "$GITHUB_OUTPUT"

  rust-tests:
    needs: [plan, rust-core]
    if: ${{ needs.plan.outputs.rust_tests == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      checkout_sha: ${{ steps.source.outputs.checkout_sha }}
      tree_sha: ${{ steps.source.outputs.tree_sha }}
      workflow_sha256: ${{ steps.source.outputs.workflow_sha256 }}
      planner_git_sha256: ${{ steps.source.outputs.planner_git_sha256 }}
      planner_execution_sha256: ${{ steps.source.outputs.planner_execution_sha256 }}
      cargo_lock_git_sha256: ${{ steps.source.outputs.cargo_lock_git_sha256 }}
      cargo_lock_worktree_sha256: ${{ steps.source.outputs.cargo_lock_worktree_sha256 }}
      plan_id: ${{ steps.source.outputs.plan_id }}
      run_id: ${{ steps.source.outputs.run_id }}
      run_attempt: ${{ steps.source.outputs.run_attempt }}
      emitter_job: ${{ steps.source.outputs.emitter_job }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
      - name: Core and Native SDK consumer tests
        run: cargo test --locked -p motionwright-domain -p motionwright-storage -p motionwright-service -p motionwright-native --all-targets
      - name: Bind job result to original source, plan and execution
        id: source
        if: always()
        working-directory: .
        env:
          CI_PLAN_ID: ${{ needs.plan.outputs.plan_id }}
        run: >-
          python3 -I -B tooling/ci_job_plan.py observe
          --repo "$GITHUB_WORKSPACE" --plan-id "$CI_PLAN_ID"
          --github-output "$GITHUB_OUTPUT"

  studio:
    needs: [plan, source-policy]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio
    outputs:
      checkout_sha: ${{ steps.source.outputs.checkout_sha }}
      tree_sha: ${{ steps.source.outputs.tree_sha }}
      workflow_sha256: ${{ steps.source.outputs.workflow_sha256 }}
      planner_git_sha256: ${{ steps.source.outputs.planner_git_sha256 }}
      planner_execution_sha256: ${{ steps.source.outputs.planner_execution_sha256 }}
      cargo_lock_git_sha256: ${{ steps.source.outputs.cargo_lock_git_sha256 }}
      cargo_lock_worktree_sha256: ${{ steps.source.outputs.cargo_lock_worktree_sha256 }}
      plan_id: ${{ steps.source.outputs.plan_id }}
      run_id: ${{ steps.source.outputs.run_id }}
      run_attempt: ${{ steps.source.outputs.run_attempt }}
      emitter_job: ${{ steps.source.outputs.emitter_job }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck and production build
        run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-dist
          path: apps/studio/dist
          if-no-files-found: error
      - name: Bind job result to original source, plan and execution
        id: source
        if: always()
        working-directory: .
        env:
          CI_PLAN_ID: ${{ needs.plan.outputs.plan_id }}
        run: >-
          python3 -I -B tooling/ci_job_plan.py observe
          --repo "$GITHUB_WORKSPACE" --plan-id "$CI_PLAN_ID"
          --github-output "$GITHUB_OUTPUT"

  studio-tests:
    needs: [plan, studio]
    if: ${{ needs.plan.outputs.studio_tests == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio
    outputs:
      checkout_sha: ${{ steps.source.outputs.checkout_sha }}
      tree_sha: ${{ steps.source.outputs.tree_sha }}
      workflow_sha256: ${{ steps.source.outputs.workflow_sha256 }}
      planner_git_sha256: ${{ steps.source.outputs.planner_git_sha256 }}
      planner_execution_sha256: ${{ steps.source.outputs.planner_execution_sha256 }}
      cargo_lock_git_sha256: ${{ steps.source.outputs.cargo_lock_git_sha256 }}
      cargo_lock_worktree_sha256: ${{ steps.source.outputs.cargo_lock_worktree_sha256 }}
      plan_id: ${{ steps.source.outputs.plan_id }}
      run_id: ${{ steps.source.outputs.run_id }}
      run_attempt: ${{ steps.source.outputs.run_attempt }}
      emitter_job: ${{ steps.source.outputs.emitter_job }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Unit contracts
        run: npm test
      - name: Bind job result to original source, plan and execution
        id: source
        if: always()
        working-directory: .
        env:
          CI_PLAN_ID: ${{ needs.plan.outputs.plan_id }}
        run: >-
          python3 -I -B tooling/ci_job_plan.py observe
          --repo "$GITHUB_WORKSPACE" --plan-id "$CI_PLAN_ID"
          --github-output "$GITHUB_OUTPUT"

  browser-acceptance:
    needs: [plan, studio, studio-tests]
    if: ${{ needs.plan.outputs.browser_acceptance == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio
    outputs:
      checkout_sha: ${{ steps.source.outputs.checkout_sha }}
      tree_sha: ${{ steps.source.outputs.tree_sha }}
      workflow_sha256: ${{ steps.source.outputs.workflow_sha256 }}
      planner_git_sha256: ${{ steps.source.outputs.planner_git_sha256 }}
      planner_execution_sha256: ${{ steps.source.outputs.planner_execution_sha256 }}
      cargo_lock_git_sha256: ${{ steps.source.outputs.cargo_lock_git_sha256 }}
      cargo_lock_worktree_sha256: ${{ steps.source.outputs.cargo_lock_worktree_sha256 }}
      plan_id: ${{ steps.source.outputs.plan_id }}
      run_id: ${{ steps.source.outputs.run_id }}
      run_attempt: ${{ steps.source.outputs.run_attempt }}
      emitter_job: ${{ steps.source.outputs.emitter_job }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Browser acceptance
        run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-acceptance-evidence
          path: |
            apps/studio/test-results
            apps/studio/playwright-report
          if-no-files-found: ignore
      - name: Bind job result to original source, plan and execution
        id: source
        if: always()
        working-directory: .
        env:
          CI_PLAN_ID: ${{ needs.plan.outputs.plan_id }}
        run: >-
          python3 -I -B tooling/ci_job_plan.py observe
          --repo "$GITHUB_WORKSPACE" --plan-id "$CI_PLAN_ID"
          --github-output "$GITHUB_OUTPUT"

  desktop-linux:
    needs: [plan, rust-core, rust-tests, studio, studio-tests]
    # A deliberate test exclusion must not propagate a skipped dependency into
    # this mandatory build. Any required failed/cancelled/missing test blocks it.
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
          needs['rust-core'].result == 'success' && needs.studio.result == 'success' &&
          ((needs.plan.outputs.rust_tests == 'true' && needs['rust-tests'].result == 'success') ||
           (needs.plan.outputs.rust_tests == 'false' && needs['rust-tests'].result == 'skipped')) &&
          ((needs.plan.outputs.studio_tests == 'true' && needs['studio-tests'].result == 'success') ||
           (needs.plan.outputs.studio_tests == 'false' && needs['studio-tests'].result == 'skipped')) }}
    runs-on: ubuntu-24.04
    outputs:
      checkout_sha: ${{ steps.source.outputs.checkout_sha }}
      tree_sha: ${{ steps.source.outputs.tree_sha }}
      workflow_sha256: ${{ steps.source.outputs.workflow_sha256 }}
      planner_git_sha256: ${{ steps.source.outputs.planner_git_sha256 }}
      planner_execution_sha256: ${{ steps.source.outputs.planner_execution_sha256 }}
      cargo_lock_git_sha256: ${{ steps.source.outputs.cargo_lock_git_sha256 }}
      cargo_lock_worktree_sha256: ${{ steps.source.outputs.cargo_lock_worktree_sha256 }}
      plan_id: ${{ steps.source.outputs.plan_id }}
      run_id: ${{ steps.source.outputs.run_id }}
      run_attempt: ${{ steps.source.outputs.run_attempt }}
      emitter_job: ${{ steps.source.outputs.emitter_job }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - name: Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: npm --prefix apps/studio ci --no-audit --no-fund
      - run: npm --prefix apps/studio run build
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Check desktop shell
        run: cargo check --locked -p motionwright-desktop
      - name: Exercise read-only native portable MP4 verifier
        run: cargo test --locked -p motionwright-desktop --bin motionwright-desktop media_integrity::tests -- --nocapture
      - name: Bind job result to original source, plan and execution
        id: source
        if: always()
        working-directory: .
        env:
          CI_PLAN_ID: ${{ needs.plan.outputs.plan_id }}
        run: >-
          python3 -I -B tooling/ci_job_plan.py observe
          --repo "$GITHUB_WORKSPACE" --plan-id "$CI_PLAN_ID"
          --github-output "$GITHUB_OUTPUT"

  ci-complete:
    if: always()
    needs: [plan, source-policy, rust-core, rust-tests, studio, studio-tests, browser-acceptance, desktop-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ci-job-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/motionwright-ci/${{ github.run_id }}-${{ github.run_attempt }}/original-plan
      - name: Reconcile selected jobs against this source and execution
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          python3 -I -B tooling/ci_job_plan.py aggregate
          --repo "$GITHUB_WORKSPACE"
          --plan "$RUNNER_TEMP/motionwright-ci/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/original-plan/plan.json"
          --output "$RUNNER_TEMP/motionwright-ci/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/outcomes.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-job-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/motionwright-ci/${{ github.run_id }}-${{ github.run_attempt }}/outcomes.json
          if-no-files-found: error

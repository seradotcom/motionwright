name: Graph file limit boundary

on:
  push:
    branches: ['codex/graph6-closure-*', 'codex/graph-composed-source-rpc-20261108', 'integrate/phase1-final-composition-20261027']
    paths:
      - '.github/workflows/graph-file-limit-boundary.yml'
      - 'tooling/ci_canvas_service.py'
      - 'tooling/tests/test_ci_graph_file_limits.py'
      - 'tooling/tests/test_ci_canvas_service.py'
      - 'apps/studio/tests/support/scopedChangeService.ts'
      - 'apps/studio/tests/support/graph-owner/factory.mjs'
      - 'apps/studio/tooling/graph-owner/owner_environment_layout.test.mjs'
      - 'crates/service/examples/studio_review_session.rs'
      - 'crates/native/examples/native-graph-review-session.rs'
      - 'apps/desktop/src-tauri/src/semantic_graph_mutation_error.rs'
      - 'apps/desktop/src-tauri/src/semantic_graph_recovery.rs'
      - 'apps/desktop/src-tauri/src/semantic_graph_recovery_tests.rs'
      # Only source modules consumed by these bounded real Graph transports.
      # Broader unrelated Native changes use their separate impact lanes.
      - 'crates/native/src/production/graph_authoring.rs'
      - 'crates/native/src/production/graph_authoring_tests.rs'
      - 'crates/service/src/semantic_graph.rs'
      - 'crates/service/src/semantic_graph_admission.rs'
      - 'crates/service/src/read_only.rs'
      - 'crates/storage/src/read_only.rs'
      - 'crates/storage/src/integrity.rs'
      - 'crates/service/Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check verified staging allowance and actual kernel file limit
        run: |
          python -B -m unittest tooling.tests.test_ci_graph_file_limits tooling.tests.test_ci_canvas_service.GraphR74JoinTests -v
      - name: Check closed child environments and actual Linux limit observation
        run: |
          node --test apps/studio/tooling/graph-owner/owner_environment_layout.test.mjs
          node --test --test-name-pattern='Native Graph service child env is closed' apps/studio/tooling/graph-owner/producer_guard.test.mjs
  compile-transports:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: motionwright-graph-file-limits-1.98.1
      - name: Check source formatting
        run: cargo fmt --all -- --check
      - name: Prepare native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpipewire-0.3-dev pkg-config clang
      - name: Compile the actual Store transports
        run: |
          cargo check --locked -p motionwright-service --example studio_review_session
          cargo check --locked -p motionwright-native --example native-graph-review-session
      - name: Check the Native journal and callback lifecycle
        run: |
          set -euo pipefail
          cargo test --locked -p motionwright-native --example native-graph-review-session \
            native_graph_adapter_tests:: -- --nocapture \
            | tee "$RUNNER_TEMP/graph-native-adapter.tests.original.log"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          raw = (Path(os.environ["RUNNER_TEMP"]) / "graph-native-adapter.tests.original.log").read_text()
          passed = re.findall(r"^test native_graph_adapter_tests::([^\r\n ]*) \.\.\. ok$", raw, re.M)
          required = {
              "graph_context_public_stage_and_pinned_error_code_rosters_are_closed",
              "graph_context_success_requires_a_confirmed_original_transport",
              "graph_context_public_error_projection_redacts_every_private_message",
              "parent_journal_file_slice_rejects_before_publishing_an_unreserved_request",
              "parent_journal_byte_slice_preserves_charges_and_existing_originals",
              "parent_journal_32mib_factory_then_context_reserves_result_before_dispatch",
              "parent_journal_32mib_denies_without_result_capacity_or_refund",
              "exclusive_private_originals_do_not_replace_a_previous_request_or_resume_after_failure",
              "failed_mutation_result_publication_preserves_originals_and_only_emits_unknown",
              "failed_read_result_publication_is_an_ordinary_error_before_any_ready_or_decode",
          }
          assert required.issubset(passed)
          assert re.search(rf"^test result: ok\. {len(passed)} passed; 0 failed;", raw, re.M)
          PY
      - name: Check exact Graph mutation and recovery failure projections
        run: |
          set -euo pipefail
          test_index=0
          for test_name in \
            semantic_graph_mutation_error::tests::unconfirmed_original_transport_overrules_even_a_known_native_rejection \
            semantic_graph_mutation_error::tests::invalid_keys_never_emit_a_typed_error_or_reflect_private_input \
            semantic_graph_recovery::tests::confirmed_recovery_transport_is_required_before_using_even_a_valid_record
          do
            test_index=$((test_index + 1))
            log_path="$RUNNER_TEMP/graph-mutation-$test_index.tests.original.log"
            cargo test --locked -p motionwright-native --example native-graph-review-session \
              "$test_name" -- --exact --nocapture 2>&1 | tee "$log_path"
            python3 - "$test_name" "$log_path" <<'PY'
          import re, sys
          from pathlib import Path
          name, path = sys.argv[1:]
          raw = Path(path).read_text()
          assert re.search(r"^test " + re.escape(name) + r" \.\.\. ok$", raw, re.M)
          assert re.search(r"^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out;", raw, re.M)
          PY
          done

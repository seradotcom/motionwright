name: Graph file limit boundary

on:
  push:
    branches: ['codex/graph6-closure-*', 'integrate/phase1-final-composition-20261027']
    paths:
      - '.github/workflows/graph-file-limit-boundary.yml'
      - 'tooling/ci_canvas_service.py'
      - 'tooling/tests/test_ci_graph_file_limits.py'
      - 'tooling/tests/test_ci_canvas_service.py'
      - 'apps/studio/tests/support/scopedChangeService.ts'
      - 'apps/studio/tests/support/graph-owner/factory.mjs'
      - 'apps/studio/tooling/graph-owner/owner_environment_layout.test.mjs'
      - 'crates/service/examples/studio_review_session.rs'
      - 'crates/native/examples/native-graph-review-session.rs'
      - 'crates/service/Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check verified staging allowance and actual kernel file limit
        run: |
          python -B -m unittest tooling.tests.test_ci_graph_file_limits tooling.tests.test_ci_canvas_service.GraphR74JoinTests -v
      - name: Check closed child environments and actual Linux limit observation
        run: |
          node --test apps/studio/tooling/graph-owner/owner_environment_layout.test.mjs
          node --test --test-name-pattern='Native Graph service child env is closed' apps/studio/tooling/graph-owner/producer_guard.test.mjs
  compile-transports:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.98.1'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: motionwright-graph-file-limits-1.98.1
      - name: Prepare native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpipewire-0.3-dev pkg-config clang
      - name: Compile the actual Store transports
        run: |
          cargo check --locked -p motionwright-service --example studio_review_session
          cargo check --locked -p motionwright-native --example native-graph-review-session
      - name: Check closed context failures in the compiled Native example
        run: |
          set -euo pipefail
          cargo test --locked -p motionwright-native --example native-graph-review-session \
            graph_context_public_ -- --nocapture \
            | tee "$RUNNER_TEMP/graph-context-public.tests.original.log"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          raw = (Path(os.environ["RUNNER_TEMP"]) / "graph-context-public.tests.original.log").read_text()
          assert len(re.findall(r"^test native_graph_adapter_tests::graph_context_public_[^\r\n]* \.\.\. ok$", raw, re.M)) == 2
          assert re.search(r"^test result: ok\. 2 passed; 0 failed;", raw, re.M)
          PY

name: Graph file limit boundary

on:
  push:
    branches: ['codex/graph6-closure-*', 'codex/graph-composed-source-rpc-20261108', 'integrate/phase1-final-composition-20261027']
    paths:
      - '.github/workflows/graph-file-limit-boundary.yml'
      - 'tooling/ci_canvas_service.py'
      - 'tooling/tests/test_ci_graph_file_limits.py'
      - 'tooling/tests/test_ci_canvas_service.py'
      - 'apps/studio/tests/support/scopedChangeService.ts'
      - 'apps/studio/tests/support/graph-owner/factory.mjs'
      - 'apps/studio/tooling/graph-owner/owner_environment_layout.test.mjs'
      - 'crates/service/examples/studio_review_session.rs'
      - 'apps/desktop/src-tauri/src/otio_bridge.rs'
      - 'apps/desktop/src-tauri/src/project_export.rs'
      - 'apps/desktop/src-tauri/src/file_import.rs'
      - 'crates/service/tests/desktop_project_export.rs'
      - 'crates/native/examples/native-graph-review-session.rs'
      - 'apps/desktop/src-tauri/src/semantic_graph_mutation_error.rs'
      - 'apps/desktop/src-tauri/src/semantic_graph_recovery.rs'
      - 'apps/desktop/src-tauri/src/semantic_graph_recovery_tests.rs'
      # Only source modules consumed by these bounded real Graph transports.
      # Broader unrelated Native changes use their separate impact lanes.
      - 'crates/native/src/production/graph_authoring.rs'
      - 'crates/native/src/production/graph_authoring_tests.rs'
      - 'crates/service/src/semantic_graph.rs'
      - 'crates/service/src/semantic_graph_admission.rs'
      - 'crates/service/tests/semantic_graph_admission.rs'
      - 'crates/storage/tests/production_operation_budget.rs'
      - 'crates/storage/tests/schema_migration_atomicity.rs'
      - 'crates/service/src/read_only.rs'
      - 'crates/storage/src/read_only.rs'
      - 'crates/storage/src/sqlite_identity.rs'
      - 'crates/storage/src/sqlite_identity_macos.rs'
      - 'crates/storage/tests/macos_region_abi.c'
      - 'crates/storage/src/integrity.rs'
      - 'crates/service/Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
    inputs:
      verify_macos_store:
        description: "Verify macOS SQLite/CAS continuity when Store or macOS source changes"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  process-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check verified staging allowance and actual kernel file limit
        run: |
          python -B -m unittest tooling.tests.test_ci_graph_file_limits tooling.tests.test_ci_canvas_service.GraphR74JoinTests -v
      - name: Check closed child environments and actual Linux limit observation
        run: |
          node --test apps/studio/tooling/graph-owner/owner_environment_layout.test.mjs
          node --test --test-name-pattern='Native Graph service child env is closed' apps/studio/tooling/graph-owner/producer_guard.test.mjs
  compile-transports:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: motionwright-graph-file-limits-1.98.1
      - name: Check source formatting
        run: cargo fmt --all -- --check
      - name: Prepare native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpipewire-0.3-dev pkg-config clang
      - name: Compile the actual Store transports
        run: |
          cargo check --locked -p motionwright-service --example studio_review_session
          cargo check --locked -p motionwright-native --example native-graph-review-session
      - name: Preserve Linux retained identity and original Store handoff
        run: |
          set -euo pipefail
          cargo test --locked --jobs 2 -p motionwright-storage --lib sqlite_identity:: -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/linux-sqlite-identity.log"
          cargo test --locked --jobs 2 -p motionwright-storage --lib read_only:: -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/linux-original-reader.log"
          python3 -B - <<'PY'
          import os, re
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          for filename, count in (("linux-sqlite-identity.log", 6), ("linux-original-reader.log", 15)):
              raw = (root / filename).read_text()
              assert re.search(r"(?m)^test result: ok\. " + str(count) + r" passed; 0 failed; 1 ignored;", raw), filename
          print("LINUX_RETAINED_STORE_REGRESSION=PASS; identity=6; reader=15; helpers=2")
          PY
      - name: Verify the actual Desktop OTIO intake through its Service consumer
        run: |
          set -euo pipefail
          cargo test --locked --jobs 2 -p motionwright-service --example studio_review_session \
            'otio_bridge::tests::' -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/otio-source-intake.log"
          python3 -B - <<'PY'
          import os, re
          from pathlib import Path
          raw = (Path(os.environ["RUNNER_TEMP"]) / "otio-source-intake.log").read_text()
          required = {
              "isolated_original_bridge_stages_the_real_decoder_supervisor_source",
              "refused_otio_names_and_missing_bundle_never_touch_media_or_grants",
              "uncertain_otio_process_retains_original_and_blocks_another_dispatch_after_reopen",
              "original_source_identity_rejects_same_size_name_replacement_and_symlink",
              "portable_otio_publication_never_clobbers_a_racing_directory_or_dangling_symlink",
              "request_rejects_foreign_fields_before_bridge_authority",
              "media_bundle_export_rejects_implicit_rights_and_noncanonical_origins",
              "original_source_open_never_follows_a_racing_symlink",
              "original_source_open_rejects_racing_fifo_without_waiting_for_a_writer",
              "otio_original_source_choice_is_closed_and_has_no_implicit_fallback",
              "imported_otio_source_survives_original_path_move_and_store_reopen",
              "unsafe_otio_folder_preserves_preview_grant_before_opening_documents",
          }
          passed = re.findall(r"(?m)^test otio_bridge::tests::([A-Za-z0-9_]+) \.\.\. ok$", raw)
          assert set(passed) == required and len(passed) == len(required), passed
          assert re.search(r"(?m)^test result: ok\. 12 passed; 0 failed; 0 ignored;", raw)
          print("OTIO_ORIGINAL_FILE_INTAKE=PASS; source_tests=12; NativeHost=NOT_RUN; G2=NOT_GRANTED")
          PY
      - name: Run all 23 actual Graph Service admission and SQLite lease tests
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/graph-semantic-admission.original.log"
          cargo test --locked --jobs 2 -p motionwright-service --test semantic_graph_admission -- --test-threads=1 2>&1 | tee "$log"
          python3 -B - "$log" <<'PY'
          from pathlib import Path
          import re
          import sys

          raw = Path(sys.argv[1]).read_text(encoding="utf-8")
          tests = re.findall(r"(?m)^test ([a-z0-9_]+) \.\.\. ok$", raw)
          assert len(tests) == len(set(tests)) == 23, "Graph admission test roster incomplete"
          assert re.search(
              r"(?m)^test result: ok\. 23 passed; 0 failed; 0 ignored; "
              r"0 measured; 0 filtered out;",
              raw,
          ), "Graph admission did not execute all 23 cases"
          print("GRAPH_SERVICE_SQLITE_LEASE_23_TESTS=PASS; formal G2 NOT_GRANTED")
          PY
      - name: Verify native source export and reimport preserve both original versions
        run: |
          set -euo pipefail
          cargo test --locked --jobs 2 -p motionwright-service --test desktop_project_export \
            project_export::tests::native_source_export_then_reimport_preserves_both_original_versions_and_reopens_store \
            -- --exact --test-threads=1 2>&1 | tee "$RUNNER_TEMP/native-source-reopen.log"
          python3 -B - <<'PY'
          import os, re
          from pathlib import Path
          raw = (Path(os.environ["RUNNER_TEMP"]) / "native-source-reopen.log").read_text()
          name = "project_export::tests::native_source_export_then_reimport_preserves_both_original_versions_and_reopens_store"
          assert re.search(r"(?m)^test " + re.escape(name) + r" \.\.\. ok$", raw)
          assert re.search(r"(?m)^test result: ok\. 1 passed; 0 failed; 0 ignored;", raw)
          print("NATIVE_EDITABLE_SOURCE_EXPORT_REIMPORT_REOPEN=PASS; editor=NOT_LAUNCHED")
          PY
      - name: Compile and lint every Graph Store and Native Rust source target
        run: |
          set -euo pipefail
          cargo clippy --locked --jobs 2 -p motionwright-storage -p motionwright-service -p motionwright-native --all-targets -- -D warnings
      - name: Reject partial Graph acknowledgement documents
        run: |
          set -euo pipefail
          test_name=production::graph_authoring::tests::graph_recipe_acknowledgement_refuses_silent_project_field_loss_or_default_fill
          log="$RUNNER_TEMP/graph-receipt-document.log"
          cargo test --locked --jobs 2 -p motionwright-native --lib "$test_name" -- --exact | tee "$log"
          grep -F "test $test_name ... ok" "$log"
      - name: Check the Native journal and callback lifecycle
        run: |
          set -euo pipefail
          cargo test --locked -p motionwright-native --example native-graph-review-session \
            native_graph_adapter_tests:: -- --nocapture \
            | tee "$RUNNER_TEMP/graph-native-adapter.tests.original.log"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          raw = (Path(os.environ["RUNNER_TEMP"]) / "graph-native-adapter.tests.original.log").read_text()
          passed = re.findall(r"^test native_graph_adapter_tests::([^\r\n ]*) \.\.\. ok$", raw, re.M)
          required = {
              "graph_context_public_stage_and_pinned_error_code_rosters_are_closed",
              "graph_context_success_requires_a_confirmed_original_transport",
              "graph_context_public_error_projection_redacts_every_private_message",
              "parent_journal_file_slice_rejects_before_publishing_an_unreserved_request",
              "parent_journal_byte_slice_preserves_charges_and_existing_originals",
              "parent_journal_32mib_factory_then_context_reserves_result_before_dispatch",
              "parent_journal_32mib_denies_without_result_capacity_or_refund",
              "exclusive_private_originals_do_not_replace_a_previous_request_or_resume_after_failure",
              "failed_mutation_result_publication_preserves_originals_and_only_emits_unknown",
              "failed_read_result_publication_is_an_ordinary_error_before_any_ready_or_decode",
          }
          assert required.issubset(passed)
          assert re.search(rf"^test result: ok\. {len(passed)} passed; 0 failed;", raw, re.M)
          PY
      - name: Check exact Graph mutation and recovery failure projections
        run: |
          set -euo pipefail
          test_index=0
          for test_name in \
            semantic_graph_mutation_error::tests::unconfirmed_original_transport_overrules_even_a_known_native_rejection \
            semantic_graph_mutation_error::tests::invalid_keys_never_emit_a_typed_error_or_reflect_private_input \
            semantic_graph_recovery::tests::confirmed_recovery_transport_is_required_before_using_even_a_valid_record
          do
            test_index=$((test_index + 1))
            log_path="$RUNNER_TEMP/graph-mutation-$test_index.tests.original.log"
            cargo test --locked -p motionwright-native --example native-graph-review-session \
              "$test_name" -- --exact --nocapture 2>&1 | tee "$log_path"
            python3 - "$test_name" "$log_path" <<'PY'
          import re, sys
          from pathlib import Path
          name, path = sys.argv[1:]
          raw = Path(path).read_text()
          assert re.search(r"^test " + re.escape(name) + r" \.\.\. ok$", raw, re.M)
          assert re.search(r"^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out;", raw, re.M)
          PY
          done

  macos-original-store:
    # Share the bounded workflow and serialize heavy compilation with Linux.
    # This is Store continuity on macOS, not a Native render or a release grant.
    needs: compile-transports
    # Select this platform lane explicitly by impact. Unrelated Studio/Native
    # source fixes reuse valid original Store observations instead of running
    # another platform matrix. A selected failed job still fails this run.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.verify_macos_store }}
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.98.1'
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: motionwright-macos-retained-store-1.98.1
      - name: Prepare physical temporary directory for no-follow Store fixtures
        run: |
          python3 -B - <<'PY'
          import os, tempfile
          from pathlib import Path
          # Darwin's default /var temporary alias is deliberately refused by
          # SQLITE_OPEN_NOFOLLOW. Resolve only the runner-owned parent of a NEW
          # fixture directory; never resolve or reopen a project database path.
          parent = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          assert parent.is_dir() and not any(p.is_symlink() for p in (parent, *parent.parents))
          root = Path(tempfile.mkdtemp(prefix="motionwright-original-store-", dir=parent))
          assert root.resolve(strict=True) == root and not root.is_symlink()
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as environment:
              environment.write("TMPDIR=" + str(root) + "\n")
          print("Physical fixture parent admitted; SQLite NOFOLLOW remains enabled")
          PY
      - name: Verify retained-file binding against the native public SDK
        run: clang -std=c11 -Werror -fsyntax-only crates/storage/tests/macos_region_abi.c
      - name: Check actual macOS Store and Service compilation
        run: |
          set -euo pipefail
          cargo clippy --locked --jobs 2 -p motionwright-storage --lib -- -D warnings
          cargo check --locked --jobs 2 -p motionwright-service --example studio_review_session
      - name: Verify retained SQLite identity, locks and original process reopen
        run: |
          set -euo pipefail
          cargo test --locked --jobs 2 -p motionwright-storage --lib sqlite_identity:: -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/macos-sqlite-identity.log"
          cargo test --locked --jobs 2 -p motionwright-storage --lib read_only:: -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/macos-original-reader.log"
          python3 -B - <<'PY'
          import os, re
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          def checked_roster(file, required, child):
              raw = (root / file).read_text()
              passed = re.findall(r"(?m)^test ([a-zA-Z0-9_:]+) \.\.\. ok$", raw)
              assert set(passed) == required and len(passed) == len(required), (file, passed)
              # This one helper is explicitly executed in a child by a passing
              # parent test; it must not become a false no-op standalone pass.
              assert re.search(r"(?m)^test " + re.escape(child) + r" \.\.\. ignored", raw)
              assert re.search(r"(?m)^test result: ok\. " + str(len(required)) + r" passed; 0 failed; 1 ignored;", raw)

          identity = {
              "independent_connections_to_the_same_file_have_the_same_identity",
              "identity_query_preserves_an_active_write_transaction",
              "copied_logical_database_has_a_different_physical_identity",
              "memory_database_cannot_supply_a_physical_file_identity",
              "retained_identity_survives_path_replacement_and_reopen",
              "repeated_identity_queries_restore_the_actual_vfs_mmap_limit",
          }
          required_identity = {"sqlite_identity::tests::" + name for name in identity}
          required_identity.add("sqlite_identity::macos::tests::anonymous_or_null_memory_cannot_supply_a_database_vnode")
          checked_roster("macos-sqlite-identity.log", required_identity, "sqlite_identity::tests::external_writer_lock_probe")
          reader = {
              "reader_requires_explicit_handoff_without_creating_wal_sidecars",
              "handoff_requires_competing_sqlite_connection_to_close",
              "handoff_requires_second_full_store_to_release_original_database",
              "reader_uses_original_connection_and_sqlite_rejects_writes",
              "reader_rejects_negative_history_hidden_by_page_and_cursor",
              "reader_rejects_hidden_non_change_kind_on_original_sqlite",
              "reader_does_not_create_missing_database_or_cas",
              "reader_rejects_byte_identical_database_substitution",
              "reader_rejects_corrupted_managed_cas_catalog_at_open_and_observe",
              "reader_rejects_rechecksummed_catalog_drift_after_open",
              "corrupt_managed_catalog_blocks_writer_before_wal_handoff",
              "reader_rejects_older_schema_without_migration",
          }
          required_reader = {"read_only::tests::" + name for name in reader}
          required_reader |= {"read_only::original_handoff_tests::" + name for name in (
              "original_read_only_handoff_preserves_sqlite_and_cas",
              "independent_process_reopens_original_sqlite_and_cas",
              "independent_process_rejects_hidden_graph_history_gap",
          )}
          checked_roster("macos-original-reader.log", required_reader, "read_only::original_handoff_tests::original_child_reader_entrypoint")
          print("MACOS_ORIGINAL_SQLITE_CAS_REOPEN=PASS; identity=7; reader=15; child_helpers=2; NativeHost=NOT_RUN; G2=NOT_GRANTED; G3=STOP")
          PY

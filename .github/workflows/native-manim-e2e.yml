                          index += 1
                      rust_need(index < len(body) and body[index] == "ok", "Missing terminal ok for Rust case")
                      diagnostics.append({"test_id": name, "diagnostic_lines": len(pending),
                                          "diagnostic_evidence_credit": False})
                  found.append(name)
                  index += 1
              rust_need(found == expected, "Rust cases are duplicated, omitted or out of order")
              return diagnostics


          def run_named_rust_contracts():
              rust_need(sys.platform.startswith("linux"), "This lane requires the complete Linux roster; Windows empty scope is NOT_APPLICABLE")
              output = Path(os.environ["RUNNER_TEMP"]) / "manim-rust-source-contracts"
              output.mkdir(exist_ok=False)
              record = {"schema": "motionwright.manim.rust-source-contracts/1", "status": "FAIL_SOURCE_CONTRACTS",
                        "scope": "23 example + 4 renderer-version + 3 runtime-version source contracts on Linux; no native Manim render",
                        "formal_acceptance": False, "automatic_retry": False, "commands": [], "scopes": []}
              uncertain = False
              def source_state():
                  def git(*args):
                      return subprocess.check_output(["git", *args]).decode("utf-8", "strict").strip()
                  head, tree = git("rev-parse", "HEAD"), git("rev-parse", "HEAD^{tree}")
                  rust_need(head == os.environ["GITHUB_SHA"] and re.fullmatch(r"[0-9a-f]{40}", head)
                            and not git("status", "--porcelain", "--untracked-files=no"), "Rust checkout/source is dirty or foreign")
                  # Actual compiled selection is independently checked by full --list.
                  # Tracked physical bytes are observed around Cargo; generated target
                  # files and the separately owned native SDK checkout are not credited.
                  paths = subprocess.check_output(["git", "ls-files", "-z"]).decode("utf-8", "strict").split("\0")
                  rust_need(paths[-1] == "" and len(paths[:-1]) == len(set(paths[:-1])), "Invalid tracked source closure")
                  physical = {}
                  for name in paths[:-1]:
                      path = Path(name)
                      rust_need(not path.is_absolute() and ".." not in path.parts and path.is_file()
                                and not path.is_symlink(), "Tracked source is missing/aliased/nonregular")
                      raw = path.read_bytes()
                      physical[name] = {"bytes": len(raw), "sha256": rust_sha(raw)}
                  return {"executed_source_sha": head, "tree_sha": tree, "tracked_physical_files": physical}
              def capture(label, command):
                  nonlocal uncertain
                  rust_need(not uncertain, "Prior UNKNOWN forbids any subsequent command/retry")
                  started = time.monotonic()
                  row = {"label": label, "command": command, "status": "UNKNOWN_NO_RETRY", "exit_code": None}
                  record["commands"].append(row)
                  try:
                      completed = subprocess.run(command, capture_output=True, timeout=900,
                                                 env=dict(os.environ, CARGO_TERM_COLOR="never"))
                      stdout, stderr, code = completed.stdout, completed.stderr, completed.returncode
                      uncertain = type(code) is not int or code < 0
                  except subprocess.TimeoutExpired as exc:
                      stdout, stderr, code = exc.stdout or b"", exc.stderr or b"", None
                      uncertain = True
                  row.update(exit_code=code, duration_seconds=round(time.monotonic() - started, 6),
                             status="UNKNOWN_NO_RETRY" if uncertain else "PASS" if code == 0 else "FAIL")
                  for stream, raw in (("stdout", stdout), ("stderr", stderr)):
                      name = label + "-" + stream + ".log"
                      with (output / name).open("xb") as handle:
                          handle.write(raw)
                      row[stream] = {"file": name, "bytes": len(raw), "sha256": rust_sha(raw)}
                  if uncertain:
                      record["status"] = "UNKNOWN_NO_RETRY"
                  rust_need(type(code) is int and code == 0, "Cargo command is failed/uncertain; no retry")
                  return stdout
              try:
                  before = source_state()
                  record["source_before"] = before
                  record.update(executed_source_sha=before["executed_source_sha"], tree_sha=before["tree_sha"],
                                github={key: os.environ.get(key, "") for key in
                                        ("GITHUB_SHA", "GITHUB_WORKFLOW_REF", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_JOB")})
                  rust_need(all(record["github"].values()), "Rust run/job identity is incomplete")
                  base = ["cargo", "test", "--locked", "-p", "motionwright-native"]
                  # Both complete lists are captured before execution; intentional
                  # exclusions are named separately and never promoted to PASS.
                  lib_names = rust_list(capture("lib-list", base + ["--lib", "--", "--list", "--format", "terse"]))
                  example_names = rust_list(capture("example-list", base + ["--example", "native-manim-e2e", "--", "--list", "--format", "terse"]))
                  plans = [
                      ("example23", example_names, None, ["--example", "native-manim-e2e"]),
                      ("renderer4", lib_names, "production::renderer_versions::tests", ["--lib", "production::renderer_versions::tests"]),
                      ("runtime3", lib_names, "production::tests::manim_runtime_version_", ["--lib", "production::tests::manim_runtime_version_"]),
                  ]
                  selected = []
                  for label, names, prefix, args in plans:
                      not_selected = rust_selected(names, RUST_CASES[label], prefix)
                      row = {"scope": label, "selected_ids": RUST_CASES[label], "not_selected_ids": not_selected,
                             "not_selected_status": "NOT_SELECTED_NO_CREDIT", "status": "NOT_RUN"}
                      record["scopes"].append(row)
                      selected.append((label, args, row))
                  for label, args, row in selected:
                      raw = capture(label + "-execute", base + args + ["--", "--nocapture", "--test-threads=1"])
                      row["diagnostics"] = rust_result(raw, row["selected_ids"], row["not_selected_ids"])
                      row["status"] = "PASS_SOURCE_CONTRACTS"
                  after = source_state()
                  record["source_after"] = after
                  rust_need(after == before, "Source changed while compiling/discovering/executing Rust contracts")
                  record.update(status="PASS_SOURCE_CONTRACTS", unique_selected_tests=30)
              except BaseException as exc:
                  if uncertain:
                      record["status"] = "UNKNOWN_NO_RETRY"
                  record["error"] = str(exc)
                  raise
              finally:
                  # After UNKNOWN this is custody-only: no Git, Cargo or later scope runs.
                  with (output / "receipt.json").open("x", encoding="utf-8", newline="\n") as handle:
                      json.dump(record, handle, indent=2, sort_keys=True)
                      handle.write("\n")


          run_named_rust_contracts()
          PY

      - name: Admit rust-upload within the original editable deadline

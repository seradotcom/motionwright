name: Native Manim Community round-trip

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Source contracts, static scene, original camera, or one saved-source camera cycle
        type: choice
        options: [source-contracts, static-scene, camera120, camera120-source-cycle]
        default: static-scene
      evidence_recipient_spki:
        description: Canonical RSA-3072 public SPKI DER in base64 for private originals
        type: string
        required: false
      evidence_recipient_sha256:
        description: Independently retained SHA-256 of the public SPKI DER
        type: string
        required: false
  pull_request:
    paths:
      - 'SOURCE_LOCK.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/domain/**'
      - 'crates/service/**'
      - 'crates/storage/**'
      - 'crates/native/**'
      - 'crates/manim-profile/**'
      - 'crates/driver-manim-community/**'
      - 'tooling/native_manim_e2e.py'
      - 'tooling/native_evidence_projection.py'
      - 'tooling/native_manim_evidence_selection.py'
      - 'tooling/tests/test_native_evidence_projection.py'
      - 'tooling/tests/test_native_manim_evidence_selection.py'
      - 'tooling/native_manim_camera_evidence.py'
      - 'tooling/native_manim_camera_cycle.py'
      - 'tooling/native_manim_camera_pixels.py'
      - 'tooling/ci_private_evidence.py'
      - 'tooling/mlt_official_runtime_intake.py'
      - 'tooling/requirements/mlt-g2-custody.txt'
      - 'tooling/tests/test_native_manim_camera_evidence.py'
      - 'tooling/tests/test_native_manim_camera_cycle.py'
      - 'tooling/tests/test_native_manim_camera_cycle_publication.py'
      - 'tooling/tests/test_native_manim_camera_pixels.py'
      - 'tooling/ci_test_runner.py'
      - 'tooling/native_scene_public_artifact.py'
      - 'tooling/cross_app_public_artifact.py'
      - 'tooling/tests/test_native_scene_public_artifact.py'
      - '.github/workflows/native-manim-e2e.yml'

permissions:
  contents: read

concurrency:
  group: ${{ (inputs.scenario == 'camera120' || inputs.scenario == 'camera120-source-cycle') && 'native-manim-camera-original' || format('native-manim-roundtrip-{0}-{1}', github.event_name, github.head_ref || github.ref_name) }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  SEMWRIGHT_CHECKOUT: ${{ github.workspace }}/_semwright
  SEMWRIGHT_TEST_MANIM_RUNTIME: /tmp/motionwright-manim-runtime

jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate requested workflow scenario
        env:
          WORKFLOW_EVENT: ${{ github.event_name }}
          MANIM_REQUESTED_SCENARIO: ${{ inputs.scenario }}
        run: |
          python3 -B - <<'PY'
          import os
          event = os.environ["WORKFLOW_EVENT"]
          scenario = os.environ["MANIM_REQUESTED_SCENARIO"]
          if event == "workflow_dispatch":
              if scenario not in {"source-contracts", "static-scene", "camera120", "camera120-source-cycle"}:
                  raise SystemExit("Unsupported Manim workflow scenario")
          elif event != "pull_request":
              raise SystemExit("Unsupported Manim workflow event")
          PY

      - name: Install pinned private-custody test dependencies outside the checkout
        run: |
          python3 -m venv "$RUNNER_TEMP/manim-custody-venv"
          "$RUNNER_TEMP/manim-custody-venv/bin/python" -m pip install \
            --disable-pip-version-check --require-hashes \
            -r tooling/requirements/mlt-g2-custody.txt

      - name: Require 44 selected evidence and Linux filesystem contracts
        run: |
          "$RUNNER_TEMP/manim-custody-venv/bin/python" -B tooling/ci_test_runner.py \
            --pattern test_native_evidence_projection.py \
            --mode discovery --require-complete --expected-source "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/manim-selection-v2-g0/report.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads((Path(os.environ["RUNNER_TEMP"]) / "manim-selection-v2-g0/report.json").read_bytes())
          assert value["status"] == "PASS" and value["exit_code"] == 0 and len(value["steps"]) == 1
          counts = value["steps"][0]["counts"]
          assert counts["tests_run"] == counts["passed"] == 44
          assert counts["skipped"] == counts["expected_failures"] == counts["unexpected_successes"] == 0
          PY

      - name: Require 38 closed Manim selected evidence contracts
        run: |
          "$RUNNER_TEMP/manim-custody-venv/bin/python" -B tooling/ci_test_runner.py \
            --pattern test_native_manim_evidence_selection.py \
            --mode discovery --require-complete --expected-source "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/manim-selection-adapter-g0/report.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads((Path(os.environ["RUNNER_TEMP"]) / "manim-selection-adapter-g0/report.json").read_bytes())
          assert value["status"] == "PASS" and value["exit_code"] == 0 and len(value["steps"]) == 1
          counts = value["steps"][0]["counts"]
          assert counts["tests_run"] == counts["passed"] == 38
          assert counts["skipped"] == counts["expected_failures"] == counts["unexpected_successes"] == 0
          PY

      - name: Require 24 complete source-bound camera pixel regressions
        run: |
          python3 -B tooling/ci_test_runner.py \
            --pattern test_native_manim_camera_pixels.py \
            --mode discovery --require-complete --expected-source "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/manim-camera-pixel-g0/report.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads((Path(os.environ["RUNNER_TEMP"]) / "manim-camera-pixel-g0/report.json").read_text())
          assert value["status"] == "PASS" and value["exit_code"] == 0
          assert len(value["steps"]) == 1
          counts = value["steps"][0]["counts"]
          assert counts["tests_run"] == counts["passed"] == 24
          assert counts["skipped"] == counts["expected_failures"] == 0
          PY

      - name: Verify camera original-custody and publication regressions
        run: |
          "$RUNNER_TEMP/manim-custody-venv/bin/python" -B tooling/ci_test_runner.py \
            --pattern test_native_manim_camera_evidence.py \
            --mode discovery --require-complete --expected-source "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/manim-camera-custody-g0/report.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads((Path(os.environ["RUNNER_TEMP"]) / "manim-camera-custody-g0/report.json").read_text())
          counts = value["steps"][0]["counts"]
          assert value["status"] == "PASS" and value["exit_code"] == 0 and len(value["steps"]) == 1
          assert counts["tests_run"] == counts["passed"] == 30
          assert counts["skipped"] == counts["expected_failures"] == 0
          PY

      - name: Require 35 complete saved-source camera cycle regressions
        run: |
          "$RUNNER_TEMP/manim-custody-venv/bin/python" -B tooling/ci_test_runner.py \
            --pattern test_native_manim_camera_cycle.py \
            --mode discovery --require-complete --expected-source "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/manim-camera-cycle-g0/report.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads((Path(os.environ["RUNNER_TEMP"]) / "manim-camera-cycle-g0/report.json").read_text())
          assert value["status"] == "PASS" and value["exit_code"] == 0 and len(value["steps"]) == 1
          counts = value["steps"][0]["counts"]
          assert counts["tests_run"] == counts["passed"] == 35
          assert counts["skipped"] == counts["expected_failures"] == 0
          PY

      - name: Require 8 complete source-cycle publication regressions
        run: |
          "$RUNNER_TEMP/manim-custody-venv/bin/python" -B tooling/ci_test_runner.py \
            --pattern test_native_manim_camera_cycle_publication.py \
            --mode discovery --require-complete --expected-source "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/manim-camera-cycle-publication-g0/report.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(
              (Path(os.environ["RUNNER_TEMP"])
               / "manim-camera-cycle-publication-g0/report.json").read_bytes()
          )
          assert value["status"] == "PASS" and value["exit_code"] == 0
          assert value["executed_source_sha"] == os.environ["GITHUB_SHA"]
          assert value["require_complete"] is True
          assert "source_postcheck_error" not in value
          assert len(value["steps"]) == 1
          step = value["steps"][0]
          assert step["entry_point"] == (
              "discovery:test_native_manim_camera_cycle_publication.py"
          )
          assert step["status"] == "PASS" and step["exit_code"] == 0
          counts = step["counts"]
          assert counts["terminal_status"] == "OK"
          assert counts["tests_run"] == counts["passed"] == 8
          assert all(counts[key] == 0 for key in (
              "errors", "failures", "skipped",
              "expected_failures", "unexpected_successes",
          ))
          PY

      - name: Require 13 complete public scene artifact contracts
        run: |
          "$RUNNER_TEMP/manim-custody-venv/bin/python" -B tooling/ci_test_runner.py \
            --pattern test_native_scene_public_artifact.py \
            --mode discovery --require-complete --expected-source "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/manim-public-artifact-g0/report.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(
              (Path(os.environ["RUNNER_TEMP"])
               / "manim-public-artifact-g0/report.json").read_bytes()
          )
          assert value["status"] == "PASS" and value["exit_code"] == 0
          assert value["executed_source_sha"] == os.environ["GITHUB_SHA"]
          assert value["require_complete"] is True
          assert "source_postcheck_error" not in value
          assert len(value["steps"]) == 1
          step = value["steps"][0]
          assert step["entry_point"] == (
              "discovery:test_native_scene_public_artifact.py"
          )
          assert step["status"] == "PASS" and step["exit_code"] == 0
          counts = step["counts"]
          assert counts["terminal_status"] == "OK"
          assert counts["tests_run"] == counts["passed"] == 13
          assert all(counts[key] == 0 for key in (
              "errors", "failures", "skipped",
              "expected_failures", "unexpected_successes",
          ))
          PY

      - name: Retain original source-contract reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: manim-camera-source-contracts-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/manim-selection-v2-g0/
            ${{ runner.temp }}/manim-selection-adapter-g0/
            ${{ runner.temp }}/manim-camera-pixel-g0/
            ${{ runner.temp }}/manim-camera-custody-g0/
            ${{ runner.temp }}/manim-camera-cycle-g0/
            ${{ runner.temp }}/manim-camera-cycle-publication-g0/
            ${{ runner.temp }}/manim-public-artifact-g0/
          if-no-files-found: error
          retention-days: 14

  native-manim-roundtrip:
    needs: source-contracts
    if: >-
      ${{ github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' &&
           (inputs.scenario == 'static-scene' ||
            inputs.scenario == 'camera120' ||
            inputs.scenario == 'camera120-source-cycle')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned private-custody test dependencies outside the checkout
        run: |
          python3 -m venv "$RUNNER_TEMP/manim-custody-venv"
          "$RUNNER_TEMP/manim-custody-venv/bin/python" -m pip install \
            --disable-pip-version-check --require-hashes \
            -r tooling/requirements/mlt-g2-custody.txt

      - name: Validate one camera dispatch and public recovery key
        if: github.event_name == 'workflow_dispatch' && (inputs.scenario == 'camera120' || inputs.scenario == 'camera120-source-cycle')
        env:
          PRIVATE_EVIDENCE_RECIPIENT_SPKI: ${{ inputs.evidence_recipient_spki }}
          PRIVATE_EVIDENCE_RECIPIENT_SHA256: ${{ inputs.evidence_recipient_sha256 }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          mkdir -m 700 "$RUNNER_TEMP/manim-camera-private" "$RUNNER_TEMP/manim-camera-sealed"
          "$RUNNER_TEMP/manim-custody-venv/bin/python" -B - <<'PY'
          import os, sys
          sys.path.insert(0, "tooling")
          from ci_private_evidence import public_key
          public_key({"spki_der_base64": os.environ["PRIVATE_EVIDENCE_RECIPIENT_SPKI"],
                      "sha256": os.environ["PRIVATE_EVIDENCE_RECIPIENT_SHA256"]})
          PY

      - name: Resolve exact Semwright source pin
        id: pin
        run: |
          sha="$(python3 -c 'import json; print(json.load(open("SOURCE_LOCK.json"))["dependencies"]["semwright"]["revision"])')"
          test "${#sha}" -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: seradotcom/semwright
          ref: ${{ steps.pin.outputs.sha }}
          path: _semwright
          persist-credentials: false

      - name: Verify immutable source identities
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git -C _semwright rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"
          python3 tooling/source_policy.py

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: motionwright-native-manim-1.98.1
          cache-on-failure: true

      - name: Install sandbox and Manim Community build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bubblewrap ffmpeg fontconfig libcairo2-dev libpango1.0-dev pkg-config \
            python3-pip python3-dev libpipewire-0.3-dev clang
          bwrap --version
          ffmpeg -version | head -1
          python3 --version

      - name: Provision read-only Manim Community 0.21.0 runtime bundle
        run: |
          runtime="$SEMWRIGHT_TEST_MANIM_RUNTIME"
          mkdir -p "$runtime/site-packages"
          python3 -m pip install \
            --disable-pip-version-check \
            --no-compile \
            --target "$runtime/site-packages" \
            'manim==0.21.0'
          cat > "$runtime/runtime.json" <<'JSON'
          {"schema":1,"manim_version":"0.21.0"}
          JSON
          PYTHONPATH="$runtime/site-packages" \
            PYTHONNOUSERSITE=1 \
            PYTHONDONTWRITEBYTECODE=1 \
            python3 -c 'import manim,sys; assert manim.__version__ == "0.21.0"; print(manim.__version__)'
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["SEMWRIGHT_TEST_MANIM_RUNTIME"])
          rows = []
          for path in sorted((root / "site-packages").rglob("*")):
              if not path.is_file() or path.is_symlink():
                  continue
              rel = path.relative_to(root).as_posix()
              h = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      h.update(chunk)
              rows.append((rel, path.stat().st_size, h.hexdigest()))
          payload = json.dumps(rows, separators=(",", ":"), ensure_ascii=True).encode()
          receipt = {
              "schema": 1,
              "manim_version": "0.21.0",
              "files": len(rows),
              "inventory_sha256": hashlib.sha256(payload).hexdigest(),
          }
          Path("verification/native-manim-e2e").mkdir(parents=True, exist_ok=True)
          Path("verification/native-manim-e2e/runtime-inventory.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Configure disposable-runner Driver Host sandbox
        run: |
          bash _semwright/scripts/dev/ci-driver-bwrap-profile.sh \
            "$GITHUB_WORKSPACE/verification/native-manim-e2e/sandbox-profile.txt"

      - name: Build exact Semwright Broker and sandbox
        working-directory: _semwright
        run: |
          cargo build --locked -p semwright-daemon -p semwright-cli --bins
          cargo build --locked -p semwright-plugin-host --bin semwright-sandbox

      - name: Build and lint bounded Motionwright Manim provider
        run: |
          cargo build --locked -p motionwright-manim-community-driver --bins
          cargo test --locked -p motionwright-manim-profile -p motionwright-manim-community-driver
          cargo clippy --locked -p motionwright-manim-profile -p motionwright-manim-community-driver \
            --all-targets -- -D warnings
          cargo build --locked -p motionwright-native \
            --example native-manim-e2e --example native-manim-camera-seed \
            --example native-manim-camera-e2e
          cargo test --locked -p motionwright-native --example native-manim-camera-seed
          cargo test --locked -p motionwright-native multi_renderer::tests -- --nocapture
          cargo test --locked -p motionwright-native \
            production::tests::production_allowlist_binds_blender_to_the_native_driver \
            -- --nocapture

      - name: Realize application-owned scene through real Broker and Manim Driver Host
        env:
          SEMWRIGHT_TEST_DRIVER_SANDBOX: '1'
          SEMWRIGHT_TEST_SANDBOX_HELPER: ${{ github.workspace }}/_semwright/target/debug/semwright-sandbox
          MANIM_NATIVE_SCENARIO: ${{ inputs.scenario || 'static-scene' }}
          PRIVATE_EVIDENCE_RECIPIENT_SPKI: ${{ inputs.evidence_recipient_spki }}
          PRIVATE_EVIDENCE_RECIPIENT_SHA256: ${{ inputs.evidence_recipient_sha256 }}
        run: |
          if [ "$MANIM_NATIVE_SCENARIO" = "camera120-source-cycle" ]; then
            "$RUNNER_TEMP/manim-custody-venv/bin/python" -B tooling/native_manim_e2e.py \
              --scenario camera120-source-cycle \
              --evidence-root "$RUNNER_TEMP/manim-camera-private/original-$GITHUB_SHA" \
              --sealed-originals "$RUNNER_TEMP/manim-camera-sealed/originals.mwci" \
              --edited-evidence-root "$RUNNER_TEMP/manim-camera-private/edited-$GITHUB_SHA" \
              --sealed-edited "$RUNNER_TEMP/manim-camera-sealed/edited.mwci" \
              | tee "$RUNNER_TEMP/manim-camera-cycle-wrapper.log"
          elif [ "$MANIM_NATIVE_SCENARIO" = "camera120" ]; then
            "$RUNNER_TEMP/manim-custody-venv/bin/python" -B tooling/native_manim_e2e.py \
              --scenario camera120 \
              --evidence-root "$RUNNER_TEMP/manim-camera-private/$GITHUB_SHA" \
              --sealed-originals "$RUNNER_TEMP/manim-camera-sealed/originals.mwci" \
              | tee "$RUNNER_TEMP/manim-camera-wrapper.log"
          else
            python3 tooling/native_manim_e2e.py \
              | tee verification/native-manim-e2e/run.log
          fi

      - name: Reject unsafe public Blender and Manim scene media
        run: python3 -m unittest discover -s tooling/tests -p 'test_native_scene_public_artifact.py' -v

      - name: Verify original camera evidence and completed sealed custody
        if: github.event_name == 'workflow_dispatch' && inputs.scenario == 'camera120'
        run: |
          "$RUNNER_TEMP/manim-custody-venv/bin/python" -B - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "manim-camera-private" / os.environ["GITHUB_SHA"]
          result = json.loads((root / "result.json").read_bytes())
          sealed = json.loads((root / "camera-custody.json").read_bytes())
          assert result["native_manim_camera_e2e"] == "PASS"
          assert result["motionwright_sha"] == os.environ["GITHUB_SHA"]
          assert result["native_effect_invocations"] == 1
          assert result["mp4"]["frame_count"] == 120
          assert sealed["schema"] == "motionwright.manim.camera.sealed-custody/2"
          assert sealed["status"] == "PASS" and sealed["required_layers_complete"] is True
          assert sealed["native_terminal_complete"] is True
          assert sealed["secondary_error_count"] == 0 and sealed["native_result_retained"] is True
          import sys
          sys.path.insert(0, "tooling")
          from native_manim_camera_evidence import verified_publication
          pin = json.loads(Path("SOURCE_LOCK.json").read_bytes())["dependencies"]["semwright"]["revision"]
          verified_publication(root, os.environ["GITHUB_SHA"], pin,
              Path(os.environ["RUNNER_TEMP"]) / "manim-camera-sealed" / "originals.mwci",
              fixture="original", scenario="camera120")
          PY

      - name: Verify Manim review evidence
        if: inputs.scenario != 'camera120' && inputs.scenario != 'camera120-source-cycle'
        run: |
          test -s "verification/native-manim-e2e/${GITHUB_SHA}/result.json"
          test -s "verification/native-manim-e2e/${GITHUB_SHA}/motionwright-manim-evidence.json"
          test -s "verification/native-manim-e2e/${GITHUB_SHA}/motionwright-manim-community.mp4"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("verification/native-manim-e2e") / os.environ["GITHUB_SHA"]
          result = json.loads((root / "result.json").read_text())
          assert result["native_manim_e2e"] == "PASS"
          assert result["motionwright_sha"] == os.environ["GITHUB_SHA"]
          assert len(result["semwright_sha"]) == 40
          assert result["semwright_version"] == "1.0.0"
          assert result["manim_version"] == "0.21.0"
          assert result["mp4"]["width"] == 640
          assert result["mp4"]["height"] == 360
          assert result["mp4"]["bytes"] > 0
          assert len(result["mp4"]["sha256"]) == 64
          PY

      - name: Stage only verified Manim MP4, not original Broker receipts
        if: always()
        env:
          NATIVE_CI_JOB_STATUS: ${{ job.status }}
          MANIM_NATIVE_SCENARIO: ${{ inputs.scenario || 'static-scene' }}
        run: |
          if [ "$MANIM_NATIVE_SCENARIO" = "camera120-source-cycle" ]; then
            "$RUNNER_TEMP/manim-custody-venv/bin/python" -B - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path


          def verified_cycle_summary(original, edited, sealed_original, sealed_edited, source, pin):
              # Publication reads the already retained outcomes. It never invokes a producer.
              from native_manim_camera_evidence import (
                  EVIDENCE_NAME, read, read_object, require, sha, verified_publication,
              )
              from native_manim_camera_cycle import _checked_edit_contract, _verify_native_link

              require(type(source) is str and re.fullmatch(r"[0-9a-f]{40}", source)
                      and type(pin) is str and re.fullmatch(r"[0-9a-f]{40}", pin),
                      "cycle_public_source_identity")
              require(len({original, edited, sealed_original, sealed_edited}) == 4,
                      "cycle_public_distinct_paths")
              first_media, first = verified_publication(
                  original, source, pin, sealed_original, fixture="original", scenario="camera120-source-cycle")
              first_media_sha = sha(first_media)
              del first_media
              second_media, second = verified_publication(
                  edited, source, pin, sealed_edited, fixture="edited1040", scenario="camera120-source-cycle")
              second_media_sha = sha(second_media)
              del second_media
              require(first["sealed_originals_recipient_sha256"]
                          == second["sealed_originals_recipient_sha256"]
                      and first["sealed_originals_sha256"] != second["sealed_originals_sha256"],
                      "cycle_public_two_distinct_seals")
              observation = read_object(edited / "source-cycle-observation.json")
              first_native = read_object(original / EVIDENCE_NAME)
              second_native = read_object(edited / EVIDENCE_NAME)
              first_result = read_object(original / "result.json")
              second_result = read_object(edited / "result.json")
              require(observation.get("schema") == "motionwright.manim.camera.source-cycle-observation/1"
                      and observation.get("source_cycle_observation") == "PASS_REQUIRES_SEALED_CUSTODY"
                      and observation.get("motionwright_sha") == source
                      and observation.get("semwright_sha") == pin
                      and type(observation.get("native_effect_invocations")) is int
                      and observation["native_effect_invocations"] == 2,
                      "cycle_public_observation_scope")
              require(all(observation.get(key) is True for key in (
                  "saved_camera_source_cycle_verified", "same_sqlite_store_reopened_in_fresh_process",
                  "current_export_equals_second_native_carrier", "original_native_receipts_unchanged",
                  "fresh_requests_and_distinct_once_scopes",
              )) and all(observation.get(key) is False for key in (
                  "source_export_grants_native_authority", "motion_canvas_equivalence_verified",
                  "voice_or_caption_mixing_verified", "human_acceptance", "automatic_retry",
              )), "cycle_public_observation_authority")
              require(observation.get("original_request_id") == first_native["request_id"]
                      and observation.get("edited_request_id") == second_native["request_id"]
                      and first_native["request_id"] != second_native["request_id"],
                      "cycle_public_fresh_requests")
              require(observation.get("original_plan_sha256") == first["compiled_plan_sha256"]
                      and observation.get("edited_plan_sha256") == second["compiled_plan_sha256"]
                      and first["compiled_plan_sha256"] != second["compiled_plan_sha256"]
                      and first_media_sha != second_media_sha,
                      "cycle_public_distinct_source_and_media")
              retained = {
                  "original_native_evidence_sha256": original / EVIDENCE_NAME,
                  "edited_native_evidence_sha256": edited / EVIDENCE_NAME,
                  "edit_receipt_sha256": edited / "source-cycle-edit.json",
                  "fresh_source_readback_sha256": edited / "source-cycle-readback.json",
                  "original_media_negative_sha256": edited / "original-media-edited-geometry-negative.json",
              }
              require(all(observation.get(key) == sha(read(path)) for key, path in retained.items()),
                      "cycle_public_retained_receipt_digest")
              edit = read_object(retained["edit_receipt_sha256"])
              binding = _checked_edit_contract(edit, {
                  "prepared": {"binding": first_result["project"]},
                  "native": first_native, "native_path": original / EVIDENCE_NAME,
              })
              require(binding == second_result["project"], "cycle_public_edited_binding")
              readback = read_object(retained["fresh_source_readback_sha256"])
              stamp = {key: binding[key] for key in ("generation", "revision")}
              stamp["resource"] = "project:" + binding["project_id"]
              require(readback.get("schema") == "motionwright.manim.camera.source-cycle/1"
                      and readback.get("phase") == "source-cycle-readback"
                      and readback.get("canonical_stamp") == stamp
                      and all(readback.get(key) == binding[key]
                              for key in ("project_id", "scene_id", "deliverable_id"))
                      and readback.get("production_receipt_window_limit") == 256,
                      "cycle_public_readback_binding")
              require(all(readback.get(key) is True for key in (
                  "fresh_sqlite_readback", "original_native_receipts_unchanged",
                  "production_receipt_window_unchanged", "saved_export_matches_native_carrier",
              )) and all(readback.get(key) is False for key in (
                  "source_changed_by_example", "native_execution_performed",
                  "native_compiler_registered", "provider_dispatch_performed",
                  "new_render_job_created", "imported_source_authority_used",
                  "fresh_registered_source_reopen_verified", "native_video_frame_content_verified",
                  "human_acceptance",
              )), "cycle_public_readback_authority")
              require(all(readback.get(key) == edit[key] for key in (
                  "original_source_asset_id", "edited_source_asset_id", "original_source_sha256",
                  "edited_source_sha256", "source_project_sha256", "current_export_bundle_sha256",
              )) and readback.get("edit_receipt_sha256") == sha(read(retained["edit_receipt_sha256"])),
                  "cycle_public_source_history")
              carrier = _verify_native_link(readback.get("edited_native"), second_native,
                                            edited / EVIDENCE_NAME)
              inspected = readback.get("current_source_inspection", {})
              require(inspected == edit["current_source_inspection"]
                      and inspected.get("current_binding") == binding
                      and inspected.get("current_closure") == carrier.get("closure")
                      and carrier.get("sha256") == readback.get("current_export_bundle_sha256")
                      and carrier.get("closure", {}).get("plan_sha256") == second["compiled_plan_sha256"]
                      and carrier.get("closure", {}).get("source_sha256") == second_result["program_sha256"],
                      "cycle_public_export_carrier_closure")
              negative = read_object(retained["original_media_negative_sha256"])
              require(negative.get("schema") == "motionwright.manim.camera.original-media-negative/1"
                      and negative.get("status") == "EXPECTED_GEOMETRIC_REJECTION"
                      and negative.get("original_media_sha256") == first_media_sha
                      and negative.get("edited_plan_sha256") == second["compiled_plan_sha256"]
                      and negative.get("original_native_evidence_sha256")
                          == observation["original_native_evidence_sha256"]
                      and negative.get("decoded_frame_count") == 120
                      and negative.get("metadata_and_original_digest_verified_before_geometry") is True
                      and all(negative.get(key) is False for key in (
                          "synthetic_media_used", "provider_dispatch_performed",
                          "automatic_retry", "human_acceptance",
                      )), "cycle_public_original_media_negative")
              # This explicit allowlist omits native identities, file paths and original receipts.
              return {
                  "schema": "motionwright.manim.camera.source-cycle-public/1",
                  "status": "VERIFIED_SCOPED_CAMERA_CYCLE",
                  "motionwright_sha": source, "semwright_sha": pin,
                  "profile": "camera120-source-cycle",
                  "native_effect_invocations": 2, "publisher_native_effect_invocations": 0,
                  "original": {
                      "media_sha256": first_media_sha, "plan_sha256": first["compiled_plan_sha256"],
                      "sealed_originals_sha256": first["sealed_originals_sha256"],
                      "decoded_frame_count": first["decoded_frame_count"],
                  },
                  "edited": {
                      "media_sha256": second_media_sha, "plan_sha256": second["compiled_plan_sha256"],
                      "sealed_originals_sha256": second["sealed_originals_sha256"],
                      "decoded_frame_count": second["decoded_frame_count"],
                  },
                  "saved_camera_source_cycle_observed": True,
                  "original_media_rejected_by_edited_geometry": True,
                  "source_export_grants_native_authority": False,
                  "motion_canvas_equivalence_verified": False,
                  "voice_or_caption_mixing_verified": False,
                  "full_manim_fidelity_verified": False, "human_acceptance": False,
                  "automatic_retry": False, "release_approved": False,
              }


          def main():
              sys.path.insert(0, "tooling")
              summary = {
                  "schema": "motionwright.manim.camera.source-cycle-public/1",
                  "status": "NOT_PUBLISHED",
                  "reason": "cycle_or_prior_job_verification_incomplete",
                  "publisher_native_effect_invocations": 0,
                  "human_acceptance": False, "automatic_retry": False, "release_approved": False,
              }
              if os.environ.get("NATIVE_CI_JOB_STATUS") == "success":
                  try:
                      source = os.environ["GITHUB_SHA"]
                      pin = json.loads(Path("SOURCE_LOCK.json").read_bytes())["dependencies"]["semwright"]["revision"]
                      temporary = Path(os.environ["RUNNER_TEMP"])
                      summary = verified_cycle_summary(
                          temporary / "manim-camera-private" / ("original-" + source),
                          temporary / "manim-camera-private" / ("edited-" + source),
                          temporary / "manim-camera-sealed" / "originals.mwci",
                          temporary / "manim-camera-sealed" / "edited.mwci", source, pin)
                  except BaseException:
                      # Publication failures disclose no private details in the public artifact.
                      pass
              output = Path("verification/native-manim-public")
              output.mkdir(parents=True, exist_ok=False)
              with (output / "public-evidence.json").open("x", encoding="utf-8") as stream:
                  stream.write(json.dumps(summary, sort_keys=True, indent=2) + "\n")
              if summary["status"] != "VERIFIED_SCOPED_CAMERA_CYCLE":
                  raise SystemExit("Camera cycle publication withheld; inspect encrypted originals. No replay.")


          if __name__ == "__main__":
              main()
          PY
          elif [ "$MANIM_NATIVE_SCENARIO" = "camera120" ]; then
            "$RUNNER_TEMP/manim-custody-venv/bin/python" -B tooling/native_scene_public_artifact.py \
              --scene manim --profile camera120 \
              --source-sha "$GITHUB_SHA" \
              --evidence-root "$RUNNER_TEMP/manim-camera-private/$GITHUB_SHA" \
              --sealed-originals "$RUNNER_TEMP/manim-camera-sealed/originals.mwci" \
              --output-root "verification/native-manim-public" \
              --job-status "$NATIVE_CI_JOB_STATUS"
          else
            python3 tooling/native_scene_public_artifact.py \
              --scene manim \
              --source-sha "$GITHUB_SHA" \
              --evidence-root "verification/native-manim-e2e/$GITHUB_SHA" \
              --output-root "verification/native-manim-public" \
              --job-status "$NATIVE_CI_JOB_STATUS"
          fi
          python3 -m json.tool verification/native-manim-public/public-evidence.json >/dev/null

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: motionwright-native-manim-${{ github.sha }}
          path: verification/native-manim-public
          if-no-files-found: error
          retention-days: 14

      - name: Retain both encrypted source-cycle outcomes without replay
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && github.event_name == 'workflow_dispatch' && inputs.scenario == 'camera120-source-cycle'
        with:
          name: motionwright-manim-camera-cycle-originals-${{ github.sha }}-${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/manim-camera-sealed/originals.mwci
            ${{ runner.temp }}/manim-camera-sealed/edited.mwci
          if-no-files-found: error
          retention-days: 14

      - name: Retain encrypted camera originals on every terminal outcome
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && github.event_name == 'workflow_dispatch' && inputs.scenario == 'camera120'
        with:
          name: motionwright-manim-camera-originals-${{ github.sha }}-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/manim-camera-sealed/originals.mwci
          if-no-files-found: error
          retention-days: 14

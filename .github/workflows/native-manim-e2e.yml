      - name: Admit private-upload within the original editable deadline
        id: editable_private_upload_budget
        if: always() && inputs.scenario == 'editable-source-cycle' && steps.editable_outer_origin.outcome == 'success'
        timeout-minutes: 1
        run: |
          python3 -B tooling/native_manim_editable_outer.py admit-action --label private-upload

      - name: Retain attempted editable source-cycle outcomes without replay
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        timeout-minutes: ${{ fromJSON(steps.editable_private_upload_budget.outputs.minutes) }}
        if: always() && github.event_name == 'workflow_dispatch' && inputs.scenario == 'editable-source-cycle' && steps.editable_private_upload_budget.outcome == 'success'
        with:
          name: motionwright-manim-editable-originals-${{ github.sha }}-${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/manim-editable-sealed-${{ github.sha }}/original.mwseal
            ${{ runner.temp }}/manim-editable-sealed-${{ github.sha }}/reopen-original.mwseal
            ${{ runner.temp }}/manim-editable-sealed-${{ github.sha }}/edited.mwseal

          private = Path(os.environ["RUNNER_TEMP"]) / "manim-runtime-provision"
          wheels = list((private / "wheels").glob("av-15.0.0-*.whl"))
          if len(wheels) != 1 or not wheels[0].is_file() or wheels[0].is_symlink():
              raise SystemExit("Require exactly one observed platform PyAV wheel")
          wheel = wheels[0]
          original = {"filename": wheel.name, "bytes": wheel.stat().st_size,

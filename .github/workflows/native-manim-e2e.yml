vives_sidecar_collision_and_secondary_custody_failures', 'runtime_probe_custody_tests::successful_probe_retains_exact_seven_field_sidecar_without_terminal_publication', 'runtime_probe_custody_tests::successful_probe_still_blocks_on_sidecar_failure_and_preserves_observation'], 'renderer4': ['production::renderer_versions::tests::manim_runtime_version_parser_preserves_four_distinct_outcomes', 'production::renderer_versions::tests::manim_runtime_version_parser_rejects_metadata_and_forged_observations', 'production::renderer_versions::tests::original_probe_error_is_preserved_after_peer_revision_commits', 'production::renderer_versions::tests::successful_probe_is_not_admitted_after_peer_revision_commits'], 'runtime3': ['production::tests::manim_runtime_version_scope_and_transport_error_never_claim_absence', 'production::tests::manim_runtime_version_transport_preserves_observation_and_project', 'production::tests::manim_runtime_version_transport_rejects_foreign_or_unbound_observations']}



name: Native Manim Community round-trip

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Source contracts, static scene, camera, or an original editable-source cycle
        type: choice
        options: [source-contracts, static-scene, camera120, camera120-source-cycle, editable-source-cycle]
        default: source-contracts
      evidence_recipient_spki:
        description: Canonical RSA-3072 public SPKI DER in base64 for private originals
        type: string
        required: false
      evidence_recipient_sha256:
        description: Independently retained SHA-256 of the public SPKI DER
        type: string
        required: false
  pull_request:
    paths:
      - 'SOURCE_LOCK.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/domain/**'
      - 'crates/service/**'
      - 'crates/storage/**'
      - 'crates/native/**'
      - 'crates/manim-profile/**'
      - 'crates/hyperframes-profile/**'
      - 'crates/driver-manim-community/**'
      - 'tooling/native_manim_e2e.py'
      - 'tooling/native_manim_editable_cycle.py'
      - 'tooling/native_manim_editable_outer.py'
      - 'tooling/native_manim_editable_pixels.py'
      - 'tooling/test_native_manim_editable_cycle.py'
      - 'tooling/test_native_manim_editable_pixels.py'
      - 'tooling/test_native_manim_editable_outer_custody.py'
      - 'tooling/test_native_manim_outer_publication.py'
      - 'tooling/tests/test_native_manim_editable_workflow.py'
      - 'tooling/native_manim_camera_evidence.py'
      - 'tooling/native_manim_camera_cycle.py'
      - 'tooling/native_manim_camera_pixels.py'
      - 'tooling/ci_private_evidence.py'
      - 'tooling/mlt_official_runtime_intake.py'
      - 'tooling/requirements/mlt-g2-custody.txt'
      - 'tooling/tests/test_native_manim_camera_evidence.py'
      - 'tooling/tests/test_native_manim_static_custody.py'
      - 'tooling/tests/test_native_manim_camera_cycle.py'
      - 'tooling/tests/test_native_manim_camera_cycle_publication.py'
      - 'tooling/tests/test_native_manim_camera_pixels.py'
      - 'tooling/tests/test_native_manim_runtime_receipt.py'
      - 'tooling/ci_test_runner.py'
      - 'tooling/native_scene_public_artifact.py'
      - 'tooling/cross_app_public_artifact.py'
      - 'tooling/tests/test_native_scene_public_artifact.py'
      - '.github/workflows/native-manim-e2e.yml'

permissions:
  contents: read

concurrency:
  group: ${{ (inputs.scenario == 'camera120' || inputs.scenario == 'camera120-source-cycle' || inputs.scenario == 'editable-source-cycle') && 'native-manim-camera-original' || format('native-manim-roundtrip-{0}-{1}', github.event_name, github.head_ref || github.ref_name) }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  SEMWRIGHT_CHECKOUT: ${{ github.workspace }}/_semwright
  SEMWRIGHT_TEST_MANIM_RUNTIME: /tmp/motionwright-manim-runtime

jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate requested workflow scenario
        env:
          WORKFLOW_EVENT: ${{ github.event_name }}
          MANIM_REQUESTED_SCENARIO: ${{ inputs.scenario }}
        run: |
          python3 -B - <<'PY'
          import os
          event = os.environ["WORKFLOW_EVENT"]
          scenario = os.environ["MANIM_REQUESTED_SCENARIO"]
          if event == "workflow_dispatch":
              if scenario not in {"source-contracts", "static-scene", "camera120", "camera120-source-cycle", "editable-source-cycle"}:
                  raise SystemExit("Unsupported Manim workflow scenario")
          elif event != "pull_request":
              raise SystemExit("Unsupported Manim workflow event")
          PY

      - name: Quick source and conformance policies
        run: |
          python3 -B tooling/source_policy.py
          python3 -B tooling/acceptance_policy.py
          python3 -B tooling/creative_status_policy.py
          python3 -B tooling/public_surface_policy.py

      - name: Install pinned private-custody test dependencies outside the checkout
        run: |
          python3 -m venv "$RUNNER_TEMP/manim-custody-venv"
          "$RUNNER_TEMP/manim-custody-venv/bin/python" -m pip install \
            --disable-pip-version-check --require-hashes \
            -r tooling/requirements/mlt-g2-custody.txt
          "$RUNNER_TEMP/manim-custody-venv/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: --no-deps Pillow==10.2.0
          "$RUNNER_TEMP/manim-custody-venv/bin/python" -B -c \
            'import PIL; assert PIL.__version__ == "10.2.0"'

      - name: Require 13 writer and 32 native-observer source contracts
        run: |
          python3 -B tooling/ci_test_runner.py \
            --test-directory crates/driver-manim-community/tests \
            --pattern test_native_color_writer.py \
            --pattern test_native_video_observer.py \
            --mode discovery --require-complete --expected-source "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/manim-n3-g0/report.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads((Path(os.environ["RUNNER_TEMP"]) / "manim-n3-g0/report.json").read_bytes())
          assert value["status"] == "PASS" and value["exit_code"] == 0
          assert value["executed_source_sha"] == os.environ["GITHUB_SHA"]
          assert value["require_complete"] is True and "source_postcheck_error" not in value
          expected = {"discovery:test_native_color_writer.py": 13,
                      "discovery:test_native_video_observer.py": 32}
          assert len(value["steps"]) == len(expected)
          assert {step["entry_point"] for step in value["steps"]} == set(expected)
          for step in value["steps"]:
              assert step["status"] == "PASS" and step["exit_code"] == 0
              counts = step["counts"]
              assert counts["terminal_status"] == "OK"
              assert counts["tests_run"] == counts["passed"] == expected[step["entry_point"]]
              assert all(counts[key] == 0 for key in (
                  "errors", "failures", "skipped", "expected_failures", "unexpected_successes"))
          PY

      - name: Require 16 runtime receipt and original-video admission regressions
        run: |
          python3 -B tooling/ci_test_runner.py \
            --pattern test_native_manim_runtime_receipt.py \
            --mode discovery --require-complete --expected-source "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/manim-runtime-receipt-g0/report.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads((Path(os.environ["RUNNER_TEMP"]) / "manim-runtime-receipt-g0/report.json").read_bytes())
          assert value["status"] == "PASS" and value["exit_code"] == 0
          assert value["executed_source_sha"] == os.environ["GITHUB_SHA"]
          assert value["require_complete"] is True and "source_postcheck_error" not in value
          assert len(value["steps"]) == 1
          step = value["steps"][0]
          assert step["entry_point"] == "discovery:test_native_manim_runtime_receipt.py"
          assert step["status"] == "PASS" and step["exit_code"] == 0
          counts = step["counts"]
          assert counts["terminal_status"] == "OK" and counts["tests_run"] == counts["passed"] == 16
          assert all(counts[key] == 0 for key in (
              "errors", "failures", "skipped", "expected_failures", "unexpected_successes"))
          PY

      - name: Require 24 complete source-bound camera pixel regressions
        run: |
          python3 -B tooling/ci_test_runner.py \
            --pattern test_native_manim_camera_pixels.py \
            --mode discovery --require-complete --expected-source "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/manim-camera-pixel-g0/report.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads((Path(os.environ["RUNNER_TEMP"]) / "manim-camera-pixel-g0/report.json").read_text())
          assert value["status"] == "PASS" and value["exit_code"] == 0
          assert len(value["steps"]) == 1
          counts = value["steps"][0]["counts"]
          assert counts["tests_run"] == counts["passed"] == 24
          assert counts["skipped"] == counts["expected_failures"] == 0
          PY

      - name: Verify camera original-custody and publication regressions
        run: |
          "$RUNNER_TEMP/manim-custody-venv/bin/python" -B tooling/ci_test_runner.py \
            --pattern test_native_manim_camera_evidence.py \
            --mode discovery --require-complete --expected-source "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/manim-camera-custody-g0/report.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads((Path(os.environ["RUNNER_TEMP"]) / "manim-camera-custody-g0/report.json").read_text())
          counts = value["steps"][0]["counts"]
          assert value["status"] == "PASS" and value["exit_code"] == 0 and len(value["steps"]) == 1
          assert counts["tests_run"] == counts["passed"] == 30
          assert counts["skipped"] == counts["expected_failures"] == 0
          PY

      - name: Require 35 complete saved-source camera cycle regressions
        run: |
          "$RUNNER_TEMP/manim-custody-venv/bin/python" -B tooling/ci_test_runner.py \
            --pattern test_native_manim_camera_cycle.py \
            --mode discovery --require-complete --expected-source "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/manim-camera-cycle-g0/report.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads((Path(os.environ["RUNNER_TEMP"]) / "manim-camera-cycle-g0/report.json").read_text())
          assert value["status"] == "PASS" and value["exit_code"] == 0 and len(value["steps"]) == 1
          counts = value["steps"][0]["counts"]
          assert counts["tests_run"] == counts["passed"] == 35
          assert counts["skipped"] == counts["expected_failures"] == 0
          PY

      - name: Require 8 complete source-cycle publication regressions
        run: |
          "$RUNNER_TEMP/manim-custody-venv/bin/python" -B tooling/ci_test_runner.py \
            --pattern test_native_manim_camera_cycle_publication.py \
            --mode discovery --require-complete --expected-source "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/manim-camera-cycle-publication-g0/report.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(
              (Path(os.environ["RUNNER_TEMP"])
               / "manim-camera-cycle-publication-g0/report.json").read_bytes()
          )
          assert value["status"] == "PASS" and value["exit_code"] == 0
          assert value["executed_source_sha"] == os.environ["GITHUB_SHA"]
          assert value["require_complete"] is True
          assert "source_postcheck_error" not in value
          assert len(value["steps"]) == 1
          step = value["steps"][0]
          assert step["entry_point"] == (
              "discovery:test_native_manim_camera_cycle_publication.py"
          )
          assert step["status"] == "PASS" and step["exit_code"] == 0
          counts = step["counts"]
          assert counts["terminal_status"] == "OK"
          assert counts["tests_run"] == counts["passed"] == 8
          assert all(counts[key] == 0 for key in (
              "errors", "failures", "skipped",
              "expected_failures", "unexpected_successes",
          ))
          PY

      - name: Require 29 complete static original-custody regressions on Linux
        run: |
          "$RUNNER_TEMP/manim-custody-venv/bin/python" -B tooling/ci_test_runner.py \
            --pattern test_native_manim_static_custody.py \
            --mode discovery --require-complete --expected-source "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/manim-static-custody-g0/report.json"
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "manim-static-custody-g0/report.json").read_bytes()
          )
          assert value["status"] == "PASS" and type(value["exit_code"]) is int and value["exit_code"] == 0
          assert value["executed_source_sha"] == os.environ["GITHUB_SHA"]
          assert value["require_complete"] is True and "source_postcheck_error" not in value
          assert len(value["steps"]) == 1
          step = value["steps"][0]
          assert step["entry_point"] == "discovery:test_native_manim_static_custody.py"
          assert step["status"] == "PASS" and type(step["exit_code"]) is int and step["exit_code"] == 0
          counts = step["counts"]
          assert counts["terminal_status"] == "OK"
          assert all(type(counts[key]) is int and counts[key] == 29 for key in ("tests_run", "passed"))
          assert all(type(counts[key]) is int and counts[key] == 0 for key in (
              "errors", "failures", "skipped", "expected_failures", "unexpected_successes",
          ))
          PY

      - name: Require 12 editable-cycle, 10 original-pixel, 34 outer-deadline/custody, and 8 outer-publication source contracts
        run: |
          "$RUNNER_TEMP/manim-custody-venv/bin/python" -B tooling/ci_test_runner.py \
            --test-directory tooling \
            --pattern test_native_manim_editable_cycle.py \
            --pattern test_native_manim_editable_pixels.py \
            --pattern test_native_manim_editable_outer_custody.py \
            --pattern test_native_manim_outer_publication.py \
            --mode discovery --require-complete --expected-source "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/manim-editable-cycle-g0/report.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads((Path(os.environ["RUNNER_TEMP"]) / "manim-editable-cycle-g0/report.json").read_bytes())
          assert value["status"] == "PASS" and value["exit_code"] == 0
          assert value["executed_source_sha"] == os.environ["GITHUB_SHA"]
          assert value["require_complete"] is True and "source_postcheck_error" not in value
          expected = {"discovery:test_native_manim_editable_cycle.py": 12,
                      "discovery:test_native_manim_editable_pixels.py": 10,
                      "discovery:test_native_manim_editable_outer_custody.py": 34,
                      "discovery:test_native_manim_outer_publication.py": 8}
          assert len(value["steps"]) == len(expected)
          assert {step["entry_point"] for step in value["steps"]} == set(expected)
          for step in value["steps"]:
              assert step["status"] == "PASS" and step["exit_code"] == 0
              counts = step["counts"]
              assert counts["terminal_status"] == "OK"
              assert counts["tests_run"] == counts["passed"] == expected[step["entry_point"]]
              assert all(counts[key] == 0 for key in (
                  "errors", "failures", "skipped", "expected_failures", "unexpected_successes"))
          PY

      - name: Require 9 original editable-workflow publication controls
        run: |
          "$RUNNER_TEMP/manim-custody-venv/bin/python" -B tooling/ci_test_runner.py \
            --pattern test_native_manim_editable_workflow.py \
            --mode discovery --require-complete --expected-source "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/manim-editable-workflow-g0/report.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads((Path(os.environ["RUNNER_TEMP"]) / "manim-editable-workflow-g0/report.json").read_bytes())
          assert value["status"] == "PASS" and value["exit_code"] == 0
          assert value["executed_source_sha"] == os.environ["GITHUB_SHA"]
          assert value["require_complete"] is True and "source_postcheck_error" not in value
          assert len(value["steps"]) == 1
          step = value["steps"][0]
          assert step["entry_point"] == "discovery:test_native_manim_editable_workflow.py"
          assert step["status"] == "PASS" and step["exit_code"] == 0
          counts = step["counts"]
          assert counts["terminal_status"] == "OK" and counts["tests_run"] == counts["passed"] == 9
          assert all(counts[key] == 0 for key in (
              "errors", "failures", "skipped", "expected_failures", "unexpected_successes"))
          PY

      - name: Require 24 public-scene source contracts with custody dependencies
        run: |
          "$RUNNER_TEMP/manim-custody-venv/bin/python" -B tooling/ci_test_runner.py \
            --pattern test_native_scene_public_artifact.py \
            --mode discovery --require-complete --expected-source "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/manim-scene-publication-g0/report.json"

      - name: Admit the closed 284 Python source contracts and original streams
        run: |
          python3 -B - <<'PY'
          import ast
          from datetime import datetime
          import hashlib
          import json
          import math
          import os
          from pathlib import Path
          import re
          import stat
          import subprocess
          import sys

          # Replaced by the materializer with the reviewed 14 closed source rosters.
          SUITES = [('crates/driver-manim-community/tests/test_native_color_writer.py', 'manim-n3-g0', 13, 'system', '2a2d0b95b89597f1e96d6d91308229a35cc50ad421edc0d885c6eed9406af404'), ('crates/driver-manim-community/tests/test_native_video_observer.py', 'manim-n3-g0', 32, 'system', 'e683cb00e1fb542a15e3f73b59c848b79d79c5e0173797f50b7d8d7c075c87b0'), ('tooling/tests/test_native_manim_runtime_receipt.py', 'manim-runtime-receipt-g0', 16, 'system', 'c5bd64a581e06366f054c711e84366b7eee04685ad815178f7d26ecf8a5052eb'), ('tooling/tests/test_native_manim_camera_pixels.py', 'manim-camera-pixel-g0', 24, 'system', 'b97699ede776bd27b3caa910cbaa3c0240fc290bd17ce76de6f833fe77470a4a'), ('tooling/tests/test_native_manim_camera_evidence.py', 'manim-camera-custody-g0', 30, 'custody', '6b0a140d1c6ad05182f56c661fbc8c8035a108e16b29ad0ddb75118a65060061'), ('tooling/tests/test_native_manim_camera_cycle.py', 'manim-camera-cycle-g0', 35, 'custody', '373ce2df1cdebce3862568e8db6ed5577f7ed6ae4c390a843efe2244e2ce85c6'), ('tooling/tests/test_native_manim_camera_cycle_publication.py', 'manim-camera-cycle-publication-g0', 8, 'custody', 'a2aaef843216e8c237c1fcb1d0b517d3b5ed127ed4e6b6336780ee5f1d313724'), ('tooling/tests/test_native_manim_static_custody.py', 'manim-static-custody-g0', 29, 'custody', 'ed3ff504746851d9efa0712b1807f9c29c7328734ed6b34376a9c5ce0ac8bd80'), ('tooling/test_native_manim_editable_cycle.py', 'manim-editable-cycle-g0', 12, 'custody', '188a66131e17ca1f34ed43ec74833e7c22c2bac2c22687ce32a89893282ca5b3'), ('tooling/test_native_manim_editable_pixels.py', 'manim-editable-cycle-g0', 10, 'custody', '1c1d11e4d9ecdb206dc818c11136980b6bb9480f735adfbd56b980a8e7bb4ee0'), ('tooling/test_native_manim_editable_outer_custody.py', 'manim-editable-cycle-g0', 34, 'custody', 'ca4d67fb2c6d6b1cc2214aa238023d32b7b3c5c4ed94ebc9b27a82cf6f2ad08e'), ('tooling/tests/test_native_manim_editable_workflow.py', 'manim-editable-workflow-g0', 9, 'custody', '50c0a209c076c25737b4196c113eb44e044f03356fd33f8ac321e91ad7513b30'), ('tooling/tests/test_native_scene_public_artifact.py', 'manim-scene-publication-g0', 24, 'custody', '9320b244e95e794b4422066053933ed457290830088751e18e9dca2c656fc9a2'), ('tooling/test_native_manim_outer_publication.py', 'manim-editable-cycle-g0', 8, 'custody', 'e3172529ad84f2c691a60e122307a30a0e02db18bd817f3d98ab06fa0db3d87e')]

          REVIEWED_DIAGNOSTICS = {
              "test_native_manim_camera_evidence.CameraOriginalCustodyTests.test_late_receipt_write_failure_keeps_result_and_ciphertext": ("Manim camera original custody is incomplete; no replay.",),
              "test_native_manim_camera_evidence.CameraOriginalCustodyTests.test_partial_original_capture_blocks_pass_but_retains_native_ok": ("Manim camera original custody is incomplete; no replay.",),
              "test_native_manim_camera_evidence.CameraOriginalCustodyTests.test_successful_callback_survives_stream_sync_failure_without_false_pass": ("Manim camera original custody is incomplete; no replay.",),
              "test_native_manim_static_custody.StaticCustodyTests.test_broker_cleanup_failure_still_closes_and_retains_log_before_sealing": ("Manim camera original custody is incomplete; no replay.",),
              "test_native_manim_static_custody.StaticCustodyTests.test_real_partial_snapshot_retains_readable_originals_and_never_writes_pass": ("Manim camera original custody is incomplete; no replay.",),
              "test_native_manim_static_custody.StaticCustodyTests.test_seal_failure_keeps_owner_streams_and_native_ok_without_legacy_pass": ("Manim camera original custody is incomplete; no replay.",),
          }


          def need(value, message):
              if not value:
                  raise ValueError(message)


          def digest(raw):
              return hashlib.sha256(raw).hexdigest()


          def strict_json(raw):
              def pairs(items):
                  result = {}
                  for key, value in items:
                      need(key not in result, "Duplicate JSON key")
                      result[key] = value
                  return result
              return json.loads(raw, object_pairs_hook=pairs,
                                parse_constant=lambda _: need(False, "Nonfinite JSON"))


          def original_bytes(path):
              path = Path(path)
              before = path.lstat()
              need(stat.S_ISREG(before.st_mode) and not path.is_symlink(), "Original must be regular")
              raw = path.read_bytes()
              after = path.lstat()
              keys = ("st_dev", "st_ino", "st_size", "st_mtime_ns", "st_ctime_ns")
              need(tuple(getattr(before, key) for key in keys) == tuple(getattr(after, key) for key in keys)
                   and len(raw) == before.st_size, "Original changed during readback")
              return raw


          def suite_ids(raw, path, count, roster_sha256):
              tree = ast.parse(raw, filename=path)
              need(not any(isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                           and node.name == "load_tests" for node in ast.walk(tree)), "Dynamic discovery is not reviewed")
              names, classes = [], []
              for cls in tree.body:
                  if not isinstance(cls, ast.ClassDef):
                      continue
                  methods = [node.name for node in cls.body if isinstance(node, ast.FunctionDef)
                             and node.name.startswith("test_")]
                  if methods:
                      need([ast.unparse(base) for base in cls.bases] == ["unittest.TestCase"]
                           and cls.name not in classes and len(set(methods)) == len(methods),
                           "Inherited/dynamic/duplicate test roster is not reviewed")
                      classes.append(cls.name)
                      names.extend(Path(path).stem + "." + cls.name + "." + method for method in methods)
              names.sort()
              need(len(names) == count and len(set(names)) == count
                   and digest(("\n".join(names) + "\n").encode()) == roster_sha256,
                   "Source nominal roster changed; require review")
              return names


          def nominal_cases(raw, expected_ids):
              """Strict CPython class-only/full-method names and six reviewed diagnostics.

              Only the parsing view normalizes CRLF; originals are never rewritten.
              """
              text = raw.decode("utf-8", "strict").replace("\r\n", "\n")
              need(not any(character in text for character in ("\r", "\x00", "\v", "\f", "\x85", "\u2028", "\u2029")),
                   "Unreviewed control or line-separator bytes")
              footer = re.search(r"\n-{70}\nRan ([0-9]+) tests? in [0-9]+(?:\.[0-9]+)?s\n\nOK\n\Z", text)
              need(footer is not None and footer.group(1) == str(len(expected_ids)), "Final canonical unittest footer is absent")
              body = text[:footer.start()]
              need(body.endswith("\n"), "Missing nominal terminal before footer")

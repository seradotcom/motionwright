      - name: Verify four original editable phases and sealed custody
        if: github.event_name == 'workflow_dispatch' && inputs.scenario == 'editable-source-cycle'
        env:
          PRIVATE_EVIDENCE_RECIPIENT_SHA256: ${{ inputs.evidence_recipient_sha256 }}
        run: |
          if [ "$MANIM_NATIVE_SCENARIO" = "editable-source-cycle" ]; then
            exec python3 -B "$GITHUB_WORKSPACE/tooling/native_manim_editable_outer.py" \
              workflow-step --label verify-cycle --script "$0"
          fi
          # MANIM_EDITABLE_OUTER_ORIGINAL_BODY
          "$RUNNER_TEMP/manim-custody-venv/bin/python" -B - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "tooling")

          def verified_editable_cycle_summary(evidence_root, sealed_root, current, recipient_sha256):
              """Read the original cycle and seals; never dispatch or decode native video."""
              import base64
              import re
              from ci_private_evidence import (
                  HEX, MAGIC, MAX_FILES, MAX_TOTAL, SEAL_SCHEMA, json_bytes, regular, strict,
              )
              from native_manim_camera_evidence import read, read_object, require, sha
              from native_manim_editable_cycle import PHASES, EVIDENCE_NAME, verify_phase
              from native_manim_editable_cycle import verified_outer_cycle

              require(set(current) == {"source_sha", "semwright_sha", "run_id", "run_attempt"}
                      and all(type(current[key]) is str and re.fullmatch(r"[0-9a-f]{40}", current[key])
                              for key in ("source_sha", "semwright_sha"))
                      and type(current["run_id"]) is str and current["run_id"].isdigit()
                      and current["run_attempt"] == "1"
                      and type(recipient_sha256) is str and re.fullmatch(r"[0-9a-f]{64}", recipient_sha256),
                      "editable_public_original_context")
              result_path = evidence_root / "cycle-result.json"
              result = read_object(result_path)
              observed_flags = (
                  "fresh_process_and_session_per_phase", "same_saved_store",
                  "typed_edit_import_and_fresh_readback",
                  "original_bundle_byte_preserving_native_reopen",
                  "edited_bundle_byte_preserving_native_reopen",
                  "all_24_decoded_frames_equal_for_both_reopens",
                  "edited_text_observed_in_all_frames",
                  "license_and_origin_retained_alongside_original_font",
              )
              require(result.get("schema") == "motionwright.manim.editable.source-cycle-observation/1"
                      and result.get("status") == "PASS" and result.get("context") == current
                      and type(result.get("native_effect_invocations")) is int
                      and result["native_effect_invocations"] == 4
                      and all(result.get(key) is True for key in observed_flags)
                      and all(result.get(key) is False for key in (
                          "motion_canvas_equivalence_verified", "all_manim_features_accepted",
                          "human_acceptance", "automatic_retry")),
                      "editable_public_cycle_scope")
              rows = result.get("phase_results")
              require(type(rows) is list and len(rows) == 4
                      and all(type(row) is dict and set(row) == {
                          "phase", "result_sha256", "ciphertext_sha256"} for row in rows)
                      and [row["phase"] for row in rows] == list(PHASES),
                      "editable_public_four_ordered_outcomes")
              summaries = []
              for phase, row in zip(PHASES, rows):
                  root = evidence_root / phase
                  phase_result = read_object(root / "result.json")
                  require(phase_result.get("phase") == phase
                          and row["result_sha256"] == sha(read(root / "result.json")),
                          "editable_public_original_phase_changed")
                  if phase == "reopen-edited":
                      require(phase_result.get("original_pixel_cycle_sha256") == result.get("pixel_cycle_sha256"),
                              "editable_public_fourth_original_pixel_binding")
                  custody = verify_phase({
                      "current": current, "evidence": root, "phase_observation": phase_result,
                      "native_path": root / EVIDENCE_NAME,
                      "sealed_originals": sealed_root / (phase + ".mwseal"),
                  }, current)
                  require(custody.get("recipient_sha256") == recipient_sha256
                          and row["ciphertext_sha256"] == custody["ciphertext_sha256"],
                          "editable_public_seal_binding")
                  summaries.append({
                      "phase": phase, "result_sha256": row["result_sha256"],
                      "ciphertext_sha256": custody["ciphertext_sha256"],
                      "ciphertext_bytes": custody["ciphertext_bytes"],
                  })
              require(len({row["ciphertext_sha256"] for row in summaries}) == 4,
                      "editable_public_distinct_original_seals")
              pixel_path = evidence_root / "reopen-edited" / "editable-pixel-cycle.json"
              pixels = read_object(pixel_path)
              frames = pixels.get("frames")
              require(result.get("pixel_cycle_sha256") == sha(read(pixel_path))
                      and pixels.get("schema") == "motionwright.manim.editable.original-pixel-cycle/1"
                      and pixels.get("status") == "PASS_REQUIRES_SEALED_CUSTODY"
                      and type(pixels.get("frame_count_per_phase")) is int
                      and pixels.get("frame_count_per_phase") == 24
                      and all(pixels.get(key) is True for key in (
                          "original_reopen_all_frames_equal", "edited_reopen_all_frames_equal",
                          "saved_text_change_observed_in_all_frames"))
                      and type(frames) is list and len(frames) == 24
                      and all(type(row) is dict and type(row.get("index")) is int and row["index"] == index
                              and row.get("original_reopen_all_rgba_equal") is True
                              and row.get("edited_reopen_all_rgba_equal") is True
                              and all(type(row.get(key)) is str
                                      and re.fullmatch(r"[0-9a-f]{64}", row[key])
                                      for key in ("original_rgba_sha256", "edited_rgba_sha256"))
                              and row["original_rgba_sha256"] != row["edited_rgba_sha256"]
                              for index, row in enumerate(frames))
                      and type(pixels.get("native_video_decode_invocations")) is int
                      and pixels.get("native_video_decode_invocations") == 0
                      and type(pixels.get("render_invocations")) is int
                      and pixels.get("render_invocations") == 0
                      and pixels.get("human_acceptance") is False,
                      "editable_public_all_original_pixels")
              decoder = pixels.get("png_decoder")
              require(type(decoder) is dict and decoder.get("implementation") == "Pillow"
                      and type(decoder.get("version")) is str
                      and re.fullmatch(r"[A-Za-z0-9_.+-]{1,64}", decoder["version"])
                      and type(decoder.get("files")) is list and len(decoder["files"]) == 2
                      and all(type(row) is dict and set(row) == {"name", "bytes", "sha256"}
                              and type(row["name"]) is str
                              and re.fullmatch(r"[A-Za-z0-9_.-]{1,120}", row["name"])
                              and type(row["bytes"]) is int and 0 < row["bytes"] <= 32 * 1024 * 1024
                              and type(row["sha256"]) is str
                              and re.fullmatch(r"[0-9a-f]{64}", row["sha256"])
                              for row in decoder["files"])
                      and decoder["files"][0]["name"] == "Image.py"
                      and decoder["files"][1]["name"].startswith("_imaging."),
                      "editable_public_observed_png_decoder")
              negative = pixels.get("original_media_as_edited_negative", {})
              require(negative.get("status") == "EXPECTED_PIXEL_REJECTION"
                      and negative.get("rejection") == "editable_text_change_unobserved"
                      and negative.get("synthetic_pixels_used") is False,
                      "editable_public_causal_original_negative")
              outer = verified_outer_cycle(evidence_root, sealed_root, current, recipient_sha256)
              # Reuse the static custody header contract for public structure/context
              # binding. This does not decrypt originals or authenticate the producer.
              envelope, _ = regular(sealed_root / "cycle-outer.mwseal", 64 * 1024 * 1024)
              require(sha(envelope) == outer["ciphertext_sha256"]
                      and len(envelope) == outer["ciphertext_bytes"]
                      and envelope.startswith(MAGIC), "editable_public_outer_ciphertext_binding")
              offset = len(MAGIC)
              length = int.from_bytes(envelope[offset:offset + 4], "big")
              require(0 < length <= 8192, "editable_public_outer_seal_header_size")
              aad = envelope[offset + 4:offset + 4 + length]
              header = strict(aad)
              require(set(header) == {
                          "schema", "algorithm", "recipient_spki_sha256", "context",
                          "nonce", "wrapped_key", "plaintext_sha256", "plaintext_bytes",
                      } and json_bytes(header) == aad
                      and header["schema"] == SEAL_SCHEMA
                      and header["algorithm"] == "RSA-OAEP-SHA256+AES-256-GCM"
                      and header["context"] == current
                      and header["recipient_spki_sha256"] == recipient_sha256
                      and type(header["plaintext_bytes"]) is int
                      and 0 < header["plaintext_bytes"] <= MAX_TOTAL + MAX_FILES * 4096
                      and type(header["plaintext_sha256"]) is str
                      and HEX.fullmatch(header["plaintext_sha256"]) is not None
                      and len(envelope) == offset + 4 + length + header["plaintext_bytes"] + 16,
                      "editable_public_outer_seal_header_binding")
              for key, size in (("nonce", 12), ("wrapped_key", 384)):
                  raw = base64.b64decode(header[key], validate=True)
                  require(len(raw) == size and base64.b64encode(raw).decode() == header[key],
                          "editable_public_outer_seal_header_encoding")
              return {
                  "schema": "motionwright.manim.editable.source-cycle-public/2",
                  "outer_custody": outer,
                  "status": "VERIFIED_SCOPED_EDITABLE_SOURCE_CYCLE",
                  "motionwright_sha": current["source_sha"], "semwright_sha": current["semwright_sha"],
                  "profile": "editable-source-cycle", "native_effect_invocations": 4,
                  "publisher_native_effect_invocations": 0, "decoded_frame_count_per_phase": 24,
                  "original_cycle_result_sha256": sha(read(result_path)),
                  "original_pixel_cycle_sha256": sha(read(pixel_path)),
                  "sealed_originals_recipient_sha256": recipient_sha256, "phases": summaries,
                  **{key: True for key in observed_flags},
                  "motion_canvas_equivalence_verified": False, "all_manim_features_accepted": False,
                  "human_acceptance": False, "automatic_retry": False,
              }

          source = os.environ["GITHUB_SHA"]
          pin = json.loads(Path("SOURCE_LOCK.json").read_bytes())["dependencies"]["semwright"]["revision"]
          current = {"source_sha": source, "semwright_sha": pin,
                     "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"]}
          temporary = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          summary = verified_editable_cycle_summary(
              temporary / ("manim-editable-private-" + source),
              temporary / ("manim-editable-sealed-" + source), current,
              os.environ["PRIVATE_EVIDENCE_RECIPIENT_SHA256"])
          destination = Path("verification/native-manim-editable-public")
          destination.mkdir(parents=True, exist_ok=False)
          with (destination / "public-evidence.json").open("x", encoding="utf-8") as stream:
              json.dump(summary, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PY

      - name: Verify static originals and completed sealed custody
        if: github.event_name == 'workflow_dispatch' && inputs.scenario == 'static-scene'
        env:
          PRIVATE_EVIDENCE_RECIPIENT_SHA256: ${{ inputs.evidence_recipient_sha256 }}
        run: |
          "$RUNNER_TEMP/manim-custody-venv/bin/python" -B - <<'PY'
          import base64
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, "tooling")
          from ci_private_evidence import (
              HEX, MAGIC, MAX_FILES, MAX_TOTAL, SEAL_SCHEMA, json_bytes, regular, strict,
          )
          from native_manim_camera_evidence import read_object, require, sha
          from native_manim_e2e import PIN, checked_static_originals

          def static_typed_metadata(result, sealed, seed, native, terminal, preseal):
              import json

              def same_json(left, right):
                  try:
                      options = dict(sort_keys=True, separators=(",", ":"),
                                     ensure_ascii=True, allow_nan=False)
                      return json.dumps(left, **options) == json.dumps(right, **options)
                  except (TypeError, ValueError):
                      return False

              require(type(seed.get("revision")) is int and seed["revision"] >= 1
                      and same_json(result.get("project"), seed), "static_typed_project")
              require(type(result.get("native_effect_invocations")) is int
                      and result["native_effect_invocations"] == 1,
                      "static_typed_invocation")
              media = result.get("mp4", {})
              artifact = native.get("result", {}).get("artifact", {})
              require(type(media) is dict and type(artifact) is dict
                      and all(type(media.get(key)) is int and media[key] == expected
                              for key, expected in (("width", 640), ("height", 360)))
                      and type(media.get("bytes")) is int and media["bytes"] > 0
                      and type(artifact.get("bytes")) is int
                      and artifact["bytes"] == media["bytes"], "static_typed_media")
              require(type(sealed.get("secondary_error_count")) is int
                      and sealed["secondary_error_count"] == 0
                      and type(sealed.get("ciphertext_bytes")) is int
                      and sealed["ciphertext_bytes"] > 0
                      and type(result.get("sealed_originals_bytes")) is int
                      and result["sealed_originals_bytes"] == sealed["ciphertext_bytes"],
                      "static_typed_custody_counts")
              observation = terminal.get("original_process_observation", {})
              require(type(observation) is dict
                      and type(observation.get("process_returncode")) is int
                      and observation["process_returncode"] == 0
                      and type(observation.get("pid")) is int and observation["pid"] > 0
                      and observation.get("automatic_retry") is False
                      and same_json(terminal.get("native_result"), native),
                      "static_typed_original_terminal")
              expected_preseal = dict(result)
              del expected_preseal["sealed_originals_sha256"], expected_preseal["sealed_originals_bytes"]
              expected_preseal["native_manim_e2e"] = "PASS_REQUIRES_SEALED_CUSTODY"
              require(same_json(preseal, expected_preseal), "static_typed_preseal")

          def verify_static():
              source = os.environ["GITHUB_SHA"]
              temporary = Path(os.environ["RUNNER_TEMP"])
              root = temporary / "manim-static-private" / source
              result = read_object(root / "result.json")
              seed = read_object(root / "static-seed.stdout.log")
              native = read_object(root / "native-example.stdout.log")
              _, original_hashes = checked_static_originals(native, seed, root)
              require(result.get("native_manim_e2e") == "PASS"
                      and result.get("motionwright_sha") == source
                      and result.get("semwright_sha") == PIN
                      and result.get("semwright_version") == "1.0.0"
                      and result.get("manim_version") == "0.21.0"
                      and type(result.get("native_effect_invocations")) is int
                      and result["native_effect_invocations"] == 1
                      and result.get("project") == seed
                      and all(result.get(key) == value for key, value in original_hashes.items())
                      and result.get("sealed_custody_required") is True
                      and result.get("native_editable_reopen_verified") is False
                      and result.get("human_acceptance") is False, "static_result_binding")
              before_seal = dict(result)
              del before_seal["sealed_originals_sha256"], before_seal["sealed_originals_bytes"]
              before_seal["native_manim_e2e"] = "PASS_REQUIRES_SEALED_CUSTODY"
              preseal = read_object(root / "static-render-verification.json")
              require(preseal == before_seal,
                      "static_preseal_verification_binding")
              terminal = read_object(root / "original-terminal.json")
              require(terminal.get("native_example_invoked") is True
                      and terminal.get("native_result") == native
                      and terminal.get("native_error") is None
                      and terminal.get("later_error") is None
                      and terminal.get("secondary_errors") == []
                      and terminal.get("automatic_retry") is False
                      and type(terminal.get("original_process_observation", {}).get(
                          "process_returncode")) is int
                      and terminal["original_process_observation"]["process_returncode"] == 0,
                      "static_original_terminal")
              context = {"source_sha": source, "semwright_sha": PIN,
                         "run_id": os.environ["GITHUB_RUN_ID"],
                         "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"]}
              sealed = read_object(root / "camera-custody.json")
              require(context["run_attempt"] == "1"
                      and sealed.get("schema") == "motionwright.manim.camera.sealed-custody/1"
                      and sealed.get("status") == "PASS"
                      and sealed.get("context") == context
                      and sealed.get("selected_originals_complete") is True
                      and sealed.get("native_result_retained") is True
                      and type(sealed.get("secondary_error_count")) is int
                      and sealed["secondary_error_count"] == 0
                      and sealed.get("original_owner_tree_removed") is False
                      and sealed.get("producer_authenticated_by_encryption") is False
                      and sealed.get("recipient_sha256") == os.environ[
                          "PRIVATE_EVIDENCE_RECIPIENT_SHA256"], "static_complete_custody")
              static_typed_metadata(result, sealed, seed, native, terminal, preseal)
              # Preserve Native5 schema2 runtime and original Rust video admission.
              # These are retained originals, not a new render/decoder or an SDK grant.
              inventory = read_object(root / "runtime-inventory.json")
              require(inventory.get("schema") == "motionwright.manim.runtime-inventory/2"
                      and inventory.get("context") == context
                      and inventory.get("manim_version") == "0.21.0"
                      and inventory.get("pyav_version") == "15.0.0"
                      and inventory.get("native_render_performed") is False,
                      "static_native5_runtime_inventory")
              admission = read_object(root / "native-video-admission.json")
              require(admission.get("schema") == "motionwright.manim.original-native-video-admission/1"
                      and admission.get("status") == "PASS"
                      and admission.get("authority") == "original_driver_rust_parser_and_receipt"
                      and admission.get("artifact_sha256") == result["mp4"]["sha256"]
                      and admission.get("plan_sha256") == native["result"]["plan_sha256"]
                      and type(admission.get("frame_count")) is int and admission["frame_count"] > 0
                      and type(admission.get("native_metadata_frame_count")) is int
                      and admission["native_metadata_frame_count"] == admission["frame_count"]
                      and type(admission.get("native_decode_or_render_invocations")) is int
                      and admission["native_decode_or_render_invocations"] == 0,
                      "static_native5_original_video_admission")
              envelope, _ = regular(temporary / "manim-static-sealed" / "originals.mwci",
                                    MAX_TOTAL + MAX_FILES * 4096 + 8192 + 64)
              require(sha(envelope) == sealed.get("ciphertext_sha256")
                      == result["sealed_originals_sha256"]
                      and len(envelope) == sealed.get("ciphertext_bytes")
                      == result["sealed_originals_bytes"]
                      and envelope.startswith(MAGIC), "static_ciphertext_binding")
              offset = len(MAGIC)
              length = int.from_bytes(envelope[offset:offset + 4], "big")
              require(0 < length <= 8192, "static_seal_header_size")
              aad = envelope[offset + 4:offset + 4 + length]
              header = strict(aad)
              require(set(header) == {
                          "schema", "algorithm", "recipient_spki_sha256", "context",
                          "nonce", "wrapped_key", "plaintext_sha256", "plaintext_bytes",
                      } and json_bytes(header) == aad
                      and header["schema"] == SEAL_SCHEMA
                      and header["algorithm"] == "RSA-OAEP-SHA256+AES-256-GCM"
                      and header["context"] == context
                      and header["recipient_spki_sha256"] == sealed["recipient_sha256"]
                      and type(header["plaintext_bytes"]) is int
                      and 0 < header["plaintext_bytes"] <= MAX_TOTAL + MAX_FILES * 4096
                      and type(header["plaintext_sha256"]) is str
                      and HEX.fullmatch(header["plaintext_sha256"]) is not None
                      and len(envelope) == offset + 4 + length + header["plaintext_bytes"] + 16,
                      "static_seal_header_binding")
              for key, size in (("nonce", 12), ("wrapped_key", 384)):
                  raw = base64.b64decode(header[key], validate=True)
                  require(len(raw) == size and base64.b64encode(raw).decode() == header[key],
                          "static_seal_header_encoding")

          try:
              verify_static()
          except BaseException:
              raise SystemExit(
                  "Static Manim publication withheld; inspect encrypted originals. No replay."
              ) from None
          PY

      - name: Stage only verified Manim MP4, not original Broker receipts
        if: always() && inputs.scenario != 'editable-source-cycle'
        env:
          NATIVE_CI_JOB_STATUS: ${{ job.status }}
          MANIM_NATIVE_SCENARIO: ${{ inputs.scenario }}
          PRIVATE_EVIDENCE_RECIPIENT_SHA256: ${{ inputs.evidence_recipient_sha256 }}
        run: |
          if [ "$MANIM_NATIVE_SCENARIO" = "camera120-source-cycle" ]; then
            "$RUNNER_TEMP/manim-custody-venv/bin/python" -B - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path


          def verified_cycle_summary(original, edited, sealed_original, sealed_edited, source, pin):
              # Publication reads the already retained outcomes. It never invokes a producer.
              from native_manim_camera_evidence import (
                  EVIDENCE_NAME, read, read_object, require, sha, verified_publication,
              )
              from native_manim_camera_cycle import _checked_edit_contract, _verify_native_link

              require(type(source) is str and re.fullmatch(r"[0-9a-f]{40}", source)
                      and type(pin) is str and re.fullmatch(r"[0-9a-f]{40}", pin),
                      "cycle_public_source_identity")
              require(len({original, edited, sealed_original, sealed_edited}) == 4,
                      "cycle_public_distinct_paths")
              first_media, first = verified_publication(
                  original, source, pin, sealed_original, fixture="original")
              first_media_sha = sha(first_media)
              del first_media
              second_media, second = verified_publication(
                  edited, source, pin, sealed_edited, fixture="edited1040")
              second_media_sha = sha(second_media)
              del second_media
              require(first["sealed_originals_recipient_sha256"]
                          == second["sealed_originals_recipient_sha256"]
                      and first["sealed_originals_sha256"] != second["sealed_originals_sha256"],
                      "cycle_public_two_distinct_seals")
              observation = read_object(edited / "source-cycle-observation.json")
              first_native = read_object(original / EVIDENCE_NAME)
              second_native = read_object(edited / EVIDENCE_NAME)
              first_result = read_object(original / "result.json")
              second_result = read_object(edited / "result.json")
              require(observation.get("schema") == "motionwright.manim.camera.source-cycle-observation/1"
                      and observation.get("source_cycle_observation") == "PASS_REQUIRES_SEALED_CUSTODY"
                      and observation.get("motionwright_sha") == source
                      and observation.get("semwright_sha") == pin
                      and type(observation.get("native_effect_invocations")) is int
                      and observation["native_effect_invocations"] == 2,
                      "cycle_public_observation_scope")
              require(all(observation.get(key) is True for key in (
                  "saved_camera_source_cycle_verified", "same_sqlite_store_reopened_in_fresh_process",
                  "current_export_equals_second_native_carrier", "original_native_receipts_unchanged",
                  "fresh_requests_and_distinct_once_scopes",
              )) and all(observation.get(key) is False for key in (
                  "source_export_grants_native_authority", "motion_canvas_equivalence_verified",
                  "voice_or_caption_mixing_verified", "human_acceptance", "automatic_retry",
              )), "cycle_public_observation_authority")
              require(observation.get("original_request_id") == first_native["request_id"]
                      and observation.get("edited_request_id") == second_native["request_id"]
                      and first_native["request_id"] != second_native["request_id"],
                      "cycle_public_fresh_requests")
              require(observation.get("original_plan_sha256") == first["compiled_plan_sha256"]
                      and observation.get("edited_plan_sha256") == second["compiled_plan_sha256"]
                      and first["compiled_plan_sha256"] != second["compiled_plan_sha256"]
                      and first_media_sha != second_media_sha,
                      "cycle_public_distinct_source_and_media")
              retained = {
                  "original_native_evidence_sha256": original / EVIDENCE_NAME,
                  "edited_native_evidence_sha256": edited / EVIDENCE_NAME,
                  "edit_receipt_sha256": edited / "source-cycle-edit.json",
                  "fresh_source_readback_sha256": edited / "source-cycle-readback.json",
                  "original_media_negative_sha256": edited / "original-media-edited-geometry-negative.json",
              }
              require(all(observation.get(key) == sha(read(path)) for key, path in retained.items()),
                      "cycle_public_retained_receipt_digest")
              edit = read_object(retained["edit_receipt_sha256"])
              binding = _checked_edit_contract(edit, {
                  "prepared": {"binding": first_result["project"]},
                  "native": first_native, "native_path": original / EVIDENCE_NAME,
              })
              require(binding == second_result["project"], "cycle_public_edited_binding")
              readback = read_object(retained["fresh_source_readback_sha256"])
              stamp = {key: binding[key] for key in ("generation", "revision")}
              stamp["resource"] = "project:" + binding["project_id"]
              require(readback.get("schema") == "motionwright.manim.camera.source-cycle/1"
                      and readback.get("phase") == "source-cycle-readback"
                      and readback.get("canonical_stamp") == stamp
                      and all(readback.get(key) == binding[key]
                              for key in ("project_id", "scene_id", "deliverable_id"))
                      and type(readback.get("production_receipt_window_limit")) is int
                      and readback.get("production_receipt_window_limit") == 256,
                      "cycle_public_readback_binding")
              require(all(readback.get(key) is True for key in (
                  "fresh_sqlite_readback", "original_native_receipts_unchanged",
                  "production_receipt_window_unchanged", "saved_export_matches_native_carrier",
              )) and all(readback.get(key) is False for key in (
                  "source_changed_by_example", "native_execution_performed",
                  "native_compiler_registered", "provider_dispatch_performed",
                  "new_render_job_created", "imported_source_authority_used",
                  "fresh_registered_source_reopen_verified", "native_video_frame_content_verified",
                  "human_acceptance",
              )), "cycle_public_readback_authority")
              require(all(readback.get(key) == edit[key] for key in (
                  "original_source_asset_id", "edited_source_asset_id", "original_source_sha256",
                  "edited_source_sha256", "source_project_sha256", "current_export_bundle_sha256",
              )) and readback.get("edit_receipt_sha256") == sha(read(retained["edit_receipt_sha256"])),
                  "cycle_public_source_history")
              carrier = _verify_native_link(readback.get("edited_native"), second_native,
                                            edited / EVIDENCE_NAME)
              inspected = readback.get("current_source_inspection", {})
              require(inspected == edit["current_source_inspection"]
                      and inspected.get("current_binding") == binding
                      and inspected.get("current_closure") == carrier.get("closure")
                      and carrier.get("sha256") == readback.get("current_export_bundle_sha256")
                      and carrier.get("closure", {}).get("plan_sha256") == second["compiled_plan_sha256"]
                      and carrier.get("closure", {}).get("source_sha256") == second_result["program_sha256"],
                      "cycle_public_export_carrier_closure")
              negative = read_object(retained["original_media_negative_sha256"])
              require(negative.get("schema") == "motionwright.manim.camera.original-media-negative/1"
                      and negative.get("status") == "EXPECTED_GEOMETRIC_REJECTION"
                      and negative.get("original_media_sha256") == first_media_sha
                      and negative.get("edited_plan_sha256") == second["compiled_plan_sha256"]
                      and negative.get("original_native_evidence_sha256")
                          == observation["original_native_evidence_sha256"]
                      and type(negative.get("decoded_frame_count")) is int
                      and negative.get("decoded_frame_count") == 120
                      and negative.get("metadata_and_original_digest_verified_before_geometry") is True
                      and all(negative.get(key) is False for key in (
                          "synthetic_media_used", "provider_dispatch_performed",
                          "automatic_retry", "human_acceptance",
                      )), "cycle_public_original_media_negative")
              # This explicit allowlist omits native identities, file paths and original receipts.
              return {
                  "schema": "motionwright.manim.camera.source-cycle-public/1",
                  "status": "VERIFIED_SCOPED_CAMERA_CYCLE",
                  "motionwright_sha": source, "semwright_sha": pin,
                  "profile": "camera120-source-cycle",
                  "native_effect_invocations": 2, "publisher_native_effect_invocations": 0,
                  "original": {
                      "media_sha256": first_media_sha, "plan_sha256": first["compiled_plan_sha256"],
                      "sealed_originals_sha256": first["sealed_originals_sha256"],
                      "decoded_frame_count": first["decoded_frame_count"],
                  },
                  "edited": {
                      "media_sha256": second_media_sha, "plan_sha256": second["compiled_plan_sha256"],
                      "sealed_originals_sha256": second["sealed_originals_sha256"],
                      "decoded_frame_count": second["decoded_frame_count"],
                  },
                  "saved_camera_source_cycle_observed": True,
                  "original_media_rejected_by_edited_geometry": True,
                  "source_export_grants_native_authority": False,
                  "motion_canvas_equivalence_verified": False,
                  "voice_or_caption_mixing_verified": False,
                  "full_manim_fidelity_verified": False, "human_acceptance": False,
                  "automatic_retry": False, "release_approved": False,
              }


          def main():
              sys.path.insert(0, "tooling")
              summary = {
                  "schema": "motionwright.manim.camera.source-cycle-public/1",
                  "status": "NOT_PUBLISHED",
                  "reason": "cycle_or_prior_job_verification_incomplete",
                  "publisher_native_effect_invocations": 0,
                  "human_acceptance": False, "automatic_retry": False, "release_approved": False,
              }
              if os.environ.get("NATIVE_CI_JOB_STATUS") == "success":
                  try:
                      source = os.environ["GITHUB_SHA"]
                      pin = json.loads(Path("SOURCE_LOCK.json").read_bytes())["dependencies"]["semwright"]["revision"]
                      temporary = Path(os.environ["RUNNER_TEMP"])
                      summary = verified_cycle_summary(
                          temporary / "manim-camera-private" / ("original-" + source),
                          temporary / "manim-camera-private" / ("edited-" + source),
                          temporary / "manim-camera-sealed" / "originals.mwci",
                          temporary / "manim-camera-sealed" / "edited.mwci", source, pin)
                  except BaseException:
                      # Publication failures disclose no private details in the public artifact.
                      pass
              output = Path("verification/native-manim-public")
              output.mkdir(parents=True, exist_ok=False)
              with (output / "public-evidence.json").open("x", encoding="utf-8") as stream:
                  stream.write(json.dumps(summary, sort_keys=True, indent=2) + "\n")
              if summary["status"] != "VERIFIED_SCOPED_CAMERA_CYCLE":
                  raise SystemExit("Camera cycle publication withheld; inspect encrypted originals. No replay.")


          if __name__ == "__main__":
              main()
          PY
          elif [ "$MANIM_NATIVE_SCENARIO" = "camera120" ]; then
            "$RUNNER_TEMP/manim-custody-venv/bin/python" -B tooling/native_scene_public_artifact.py \
              --scene manim --profile camera120 \
              --source-sha "$GITHUB_SHA" \
              --evidence-root "$RUNNER_TEMP/manim-camera-private/$GITHUB_SHA" \
              --sealed-originals "$RUNNER_TEMP/manim-camera-sealed/originals.mwci" \
              --output-root "verification/native-manim-public" \
              --job-status "$NATIVE_CI_JOB_STATUS"
          elif [ "$MANIM_NATIVE_SCENARIO" = "static-scene" ]; then
            "$RUNNER_TEMP/manim-custody-venv/bin/python" -B tooling/native_scene_public_artifact.py \
              --scene manim --profile static \
              --source-sha "$GITHUB_SHA" \
              --evidence-root "$RUNNER_TEMP/manim-static-private/$GITHUB_SHA" \
              --sealed-originals "$RUNNER_TEMP/manim-static-sealed/originals.mwci" \
              --output-root "verification/native-manim-public" \
              --job-status "$NATIVE_CI_JOB_STATUS"
          else
            exit 2
          fi
          python3 -m json.tool verification/native-manim-public/public-evidence.json >/dev/null

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && inputs.scenario != 'editable-source-cycle'
        with:
          name: motionwright-native-manim-${{ github.sha }}
          path: |
            verification/native-manim-public/public-evidence.json
            verification/native-manim-public/motionwright-manim-community.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Retain both encrypted source-cycle outcomes without replay
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && github.event_name == 'workflow_dispatch' && inputs.scenario == 'camera120-source-cycle'
        with:
          name: motionwright-manim-camera-cycle-originals-${{ github.sha }}-${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/manim-camera-sealed/originals.mwci
            ${{ runner.temp }}/manim-camera-sealed/edited.mwci
          if-no-files-found: error
          retention-days: 14

      - name: Retain encrypted camera originals on every terminal outcome
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && github.event_name == 'workflow_dispatch' && inputs.scenario == 'camera120'
        with:
          name: motionwright-manim-camera-originals-${{ github.sha }}-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/manim-camera-sealed/originals.mwci
          if-no-files-found: error
          retention-days: 14

      - name: Retain encrypted static originals on every terminal outcome
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && github.event_name == 'workflow_dispatch' && inputs.scenario == 'static-scene'
        with:
          name: motionwright-manim-static-originals-${{ github.sha }}-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/manim-static-sealed/originals.mwci
          if-no-files-found: error
          retention-days: 14

      - name: Admit public-upload within the original editable deadline
        id: editable_public_upload_budget
        if: success() && inputs.scenario == 'editable-source-cycle' && steps.editable_outer_origin.outcome == 'success'
        timeout-minutes: 1
        run: |
          python3 -B tooling/native_manim_editable_outer.py admit-action --label public-upload

      - name: Retain verified editable source-cycle summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        timeout-minutes: ${{ fromJSON(steps.editable_public_upload_budget.outputs.minutes) }}
        if: github.event_name == 'workflow_dispatch' && inputs.scenario == 'editable-source-cycle' && steps.editable_public_upload_budget.outcome == 'success'
        with:
          name: motionwright-manim-editable-cycle-${{ github.sha }}-${{ github.run_id }}-a${{ github.run_attempt }}
          path: verification/native-manim-editable-public/public-evidence.json
          if-no-files-found: error

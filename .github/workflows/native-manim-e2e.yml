name: Native Manim Community round-trip

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'SOURCE_LOCK.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/domain/**'
      - 'crates/service/**'
      - 'crates/storage/**'
      - 'crates/native/**'
      - 'crates/manim-profile/**'
      - 'crates/driver-manim-community/**'
      - 'tooling/native_manim_e2e.py'
      - 'tooling/native_scene_public_artifact.py'
      - 'tooling/cross_app_public_artifact.py'
      - 'tooling/tests/test_native_scene_public_artifact.py'
      # native-impact-triggers-begin
      - 'tooling/ci_native_impact.py'
      - 'tooling/tests/test_ci_native_impact.py'
      # native-impact-triggers-end
      - '.github/workflows/native-manim-e2e.yml'

permissions:
  contents: read

concurrency:
  group: native-manim-roundtrip-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  SEMWRIGHT_CHECKOUT: ${{ github.workspace }}/_semwright
  SEMWRIGHT_TEST_MANIM_RUNTIME: /tmp/motionwright-manim-runtime

jobs:
  # native-impact-preflight-begin
  native-impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      native_required: ${{ steps.impact.outputs.native_required }}
      decision: ${{ steps.impact.outputs.decision }}
      receipt_sha256: ${{ steps.impact.outputs.receipt_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create isolated verification directories
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/native-impact-manim/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$target"
          mkdir -p "$target/tmp"
          echo "MW_NATIVE_IMPACT_OUTPUT=$target/evidence" >> "$GITHUB_ENV"
          echo "MW_NATIVE_IMPACT_TEST_TMP=$target/tmp" >> "$GITHUB_ENV"
          echo "TMPDIR=$target/tmp" >> "$GITHUB_ENV"
          echo "TEMP=$target/tmp" >> "$GITHUB_ENV"
          echo "TMP=$target/tmp" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Run G0 and bind native selection to original Git inputs
        id: impact
        env:
          MW_NATIVE_WORKFLOW: .github/workflows/native-manim-e2e.yml
        run: |
          python3 -B -I -S - <<'PY'
          import hashlib, os, pathlib, re, shutil, stat, subprocess, sys
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          expected = os.environ["GITHUB_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", expected):
              raise SystemExit("Invalid checkout SHA")
          git = pathlib.Path(shutil.which("git")).resolve(strict=True)
          if git.is_relative_to(root):
              raise SystemExit("Git resolves into source")
          for name in list(os.environ):
              if name.upper().startswith("GIT_"):
                  del os.environ[name]
          os.environ.update(GIT_NO_REPLACE_OBJECTS="1", GIT_GRAFT_FILE=os.devnull,
              GIT_CONFIG_GLOBAL=os.devnull, GIT_CONFIG_NOSYSTEM="1",
              GIT_NO_LAZY_FETCH="1", GIT_OPTIONAL_LOCKS="0", GIT_TERMINAL_PROMPT="0",
              GIT_CONFIG_COUNT="1", GIT_CONFIG_KEY_0="core.fsmonitor",
              GIT_CONFIG_VALUE_0="false")
          def read_git(*args):
              result = subprocess.run([str(git), "--no-replace-objects", *args],
                  cwd=root, capture_output=True, timeout=30, check=True)
              if len(result.stdout) > 2 * 1024 * 1024 or len(result.stderr) > 65536:
                  raise SystemExit("Bootstrap Git output exceeds budget")
              return result.stdout
          if read_git("rev-parse", "HEAD").strip().decode() != expected:
              raise SystemExit("Checkout differs from workflow source")
          target = root / "tooling/ci_native_impact.py"
          if target.is_symlink() or not target.is_file():
              raise SystemExit("Selector is not a regular source file")
          before = target.lstat()
          if not stat.S_ISREG(before.st_mode):
              raise SystemExit("Selector source mode differs")
          with target.open("rb") as stream:
              data = stream.read(256 * 1024 + 1)
          after = target.stat()
          token = lambda value: (value.st_dev, value.st_ino, value.st_size,
                                 value.st_mtime_ns, value.st_ctime_ns)
          if len(data) > 256 * 1024 or token(before) != token(after):
              raise SystemExit("Selector changed or exceeds budget")
          # Fixed-size rev-parse outputs only; the selector captures full status
          # with bounded pipes before loading any other checkout module.
          original_oid = read_git("rev-parse", "--verify", expected + ":tooling/ci_native_impact.py").strip().decode("ascii")
          actual_oid = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          if not re.fullmatch(r"[0-9a-f]{40}", original_oid) or actual_oid != original_oid:
              raise SystemExit("Selector bytes differ from original Git source")
          sys.argv = [str(target), "--repo", str(root), "--workflow",
              os.environ["MW_NATIVE_WORKFLOW"], "--output",
              os.environ["MW_NATIVE_IMPACT_OUTPUT"], "--github-output",
              os.environ["GITHUB_OUTPUT"]]
          # Execute the exact verified buffer without reopening the pathname.
          scope = {"__name__": "__main__", "__file__": str(target), "__package__": None}
          exec(compile(data, str(target), "exec"), scope)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-impact-manim-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MW_NATIVE_IMPACT_OUTPUT }}
          if-no-files-found: error
          retention-days: 14
  # native-impact-preflight-end
  native-manim-roundtrip:
    # native-impact-dependency-begin
    needs: native-impact
    if: ${{ needs.native-impact.result == 'success' && needs.native-impact.outputs.native_required == 'true' }}
    # native-impact-dependency-end
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Resolve exact Semwright source pin
        id: pin
        run: |
          sha="$(python3 -c 'import json; print(json.load(open("SOURCE_LOCK.json"))["dependencies"]["semwright"]["revision"])')"
          test "${#sha}" -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: seradotcom/semwright
          ref: ${{ steps.pin.outputs.sha }}
          path: _semwright
          persist-credentials: false

      - name: Verify immutable source identities
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git -C _semwright rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"
          python3 tooling/source_policy.py

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: motionwright-native-manim-1.98.1
          cache-on-failure: true

      - name: Install sandbox and Manim Community build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bubblewrap ffmpeg fontconfig libcairo2-dev libpango1.0-dev pkg-config \
            python3-pip python3-dev libpipewire-0.3-dev clang
          bwrap --version
          ffmpeg -version | head -1
          python3 --version

      - name: Provision read-only Manim Community 0.21.0 runtime bundle
        run: |
          runtime="$SEMWRIGHT_TEST_MANIM_RUNTIME"
          mkdir -p "$runtime/site-packages"
          python3 -m pip install \
            --disable-pip-version-check \
            --no-compile \
            --target "$runtime/site-packages" \
            'manim==0.21.0'
          cat > "$runtime/runtime.json" <<'JSON'
          {"schema":1,"manim_version":"0.21.0"}
          JSON
          PYTHONPATH="$runtime/site-packages" \
            PYTHONNOUSERSITE=1 \
            PYTHONDONTWRITEBYTECODE=1 \
            python3 -c 'import manim,sys; assert manim.__version__ == "0.21.0"; print(manim.__version__)'
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["SEMWRIGHT_TEST_MANIM_RUNTIME"])
          rows = []
          for path in sorted((root / "site-packages").rglob("*")):
              if not path.is_file() or path.is_symlink():
                  continue
              rel = path.relative_to(root).as_posix()
              h = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      h.update(chunk)
              rows.append((rel, path.stat().st_size, h.hexdigest()))
          payload = json.dumps(rows, separators=(",", ":"), ensure_ascii=True).encode()
          receipt = {
              "schema": 1,
              "manim_version": "0.21.0",
              "files": len(rows),
              "inventory_sha256": hashlib.sha256(payload).hexdigest(),
          }
          Path("verification/native-manim-e2e").mkdir(parents=True, exist_ok=True)
          Path("verification/native-manim-e2e/runtime-inventory.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Configure disposable-runner Driver Host sandbox
        run: |
          bash _semwright/scripts/dev/ci-driver-bwrap-profile.sh \
            "$GITHUB_WORKSPACE/verification/native-manim-e2e/sandbox-profile.txt"

      - name: Build exact Semwright Broker and sandbox
        working-directory: _semwright
        run: |
          cargo build --locked -p semwright-daemon -p semwright-cli --bins
          cargo build --locked -p semwright-plugin-host --bin semwright-sandbox

      - name: Build and lint bounded Motionwright Manim provider
        run: |
          cargo build --locked -p motionwright-manim-community-driver --bins
          cargo test --locked -p motionwright-manim-profile -p motionwright-manim-community-driver
          cargo clippy --locked -p motionwright-manim-profile -p motionwright-manim-community-driver \
            --all-targets -- -D warnings
          cargo build --locked -p motionwright-native --example native-manim-e2e
          cargo test --locked -p motionwright-native multi_renderer::tests -- --nocapture
          cargo test --locked -p motionwright-native \
            production::tests::production_allowlist_binds_blender_to_the_native_driver \
            -- --nocapture

      - name: Realize application-owned scene through real Broker and Manim Driver Host
        env:
          SEMWRIGHT_TEST_DRIVER_SANDBOX: '1'
          SEMWRIGHT_TEST_SANDBOX_HELPER: ${{ github.workspace }}/_semwright/target/debug/semwright-sandbox
        run: |
          python3 tooling/native_manim_e2e.py \
            | tee verification/native-manim-e2e/run.log

      # native-impact-moved-manim-0

      - name: Verify Manim review evidence
        run: |
          test -s "verification/native-manim-e2e/${GITHUB_SHA}/result.json"
          test -s "verification/native-manim-e2e/${GITHUB_SHA}/motionwright-manim-evidence.json"
          test -s "verification/native-manim-e2e/${GITHUB_SHA}/motionwright-manim-community.mp4"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("verification/native-manim-e2e") / os.environ["GITHUB_SHA"]
          result = json.loads((root / "result.json").read_text())
          assert result["native_manim_e2e"] == "PASS"
          assert result["motionwright_sha"] == os.environ["GITHUB_SHA"]
          assert len(result["semwright_sha"]) == 40
          assert result["semwright_version"] == "1.0.0"
          assert result["manim_version"] == "0.21.0"
          assert result["mp4"]["width"] == 640
          assert result["mp4"]["height"] == 360
          assert result["mp4"]["bytes"] > 0
          assert len(result["mp4"]["sha256"]) == 64
          PY

      - name: Stage only verified Manim MP4, not original Broker receipts
        if: always()
        env:
          NATIVE_CI_JOB_STATUS: ${{ job.status }}
        run: |
          python3 tooling/native_scene_public_artifact.py \
            --scene manim \
            --source-sha "$GITHUB_SHA" \
            --evidence-root "verification/native-manim-e2e/$GITHUB_SHA" \
            --output-root "verification/native-manim-public" \
            --job-status "$NATIVE_CI_JOB_STATUS"
          python3 -m json.tool verification/native-manim-public/public-evidence.json >/dev/null

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: motionwright-native-manim-${{ github.sha }}
          path: verification/native-manim-public
          if-no-files-found: error
          retention-days: 14

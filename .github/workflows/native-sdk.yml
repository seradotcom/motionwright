name: Native SDK Pin

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "SOURCE_LOCK.json"
      - "crates/native/**"
      - "apps/desktop/src-tauri/**"
      - "tooling/native_host_shared_state.py"
      - "tooling/native_shared_state_public_artifact.py"
      - "tooling/tests/test_native_shared_state_public_artifact.py"
      - "tooling/cross_app_public_artifact.py"
      - "tooling/native_av_failure_guard.py"
      - "tooling/tests/test_native_cli_failure_redaction.py"
      - "docs/native-sdk.md"
      - ".github/workflows/native-sdk.yml"
  push:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "SOURCE_LOCK.json"
      - "crates/native/**"
      - "apps/desktop/src-tauri/**"
      - "tooling/native_host_shared_state.py"
      - "tooling/native_shared_state_public_artifact.py"
      - "tooling/tests/test_native_shared_state_public_artifact.py"
      - "tooling/cross_app_public_artifact.py"
      - "tooling/native_av_failure_guard.py"
      - "tooling/tests/test_native_cli_failure_redaction.py"
      - "docs/native-sdk.md"
      - ".github/workflows/native-sdk.yml"
  workflow_dispatch:
    inputs:
      g1_only:
        description: "Run source and platform guards only; requires capsule source admission and does not run Host or G2"
        type: boolean
        required: false
        default: false
      e11_capsule_source:
        description: "Run the original native capsule source Host cycle"
        type: boolean
        required: false
        default: false
      expected_source_sha:
        description: "Exact clean source SHA; required for the capsule source cycle"
        type: string
        required: false
        default: ""
      recovery_recipient:
        description: "Existing admitted RSA3072 public recipient JSON; required for the capsule source cycle"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: native-sdk-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  verify-native-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require capsule source admission for G1-only selection
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.g1_only }}
        env:
          MW_E11_CAPSULE_SOURCE: ${{ inputs.e11_capsule_source && 'true' || 'false' }}
        run: |
          if [ "$MW_E11_CAPSULE_SOURCE" != "true" ]; then
            echo "G1-only requires e11_capsule_source=true" >&2
            exit 1
          fi
      - name: Admit the selected capsule source context and recovery recipient
        id: e11_admission
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.e11_capsule_source }}
        env:
          MW_NATIVE_EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          MOTIONWRIGHT_E11_RECOVERY_RECIPIENT: ${{ inputs.recovery_recipient }}
        run: |
          set -euo pipefail
          umask 077
          python3 -B - <<'PY'
          import os
          import re
          import subprocess

          expected = os.environ.get("MW_NATIVE_EXPECTED_SOURCE_SHA", "")
          if (os.environ.get("GITHUB_EVENT_NAME") != "workflow_dispatch"
                  or os.environ.get("GITHUB_RUN_ATTEMPT") != "1"
                  or re.fullmatch(r"[0-9a-f]{40}", expected) is None
                  or expected != os.environ.get("GITHUB_SHA")):
              raise SystemExit("Native capsule source context was not admitted")
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], stderr=subprocess.PIPE, text=True).strip()
          dirty = subprocess.check_output(
              ["git", "status", "--porcelain", "--untracked-files=all"], stderr=subprocess.PIPE,
          )
          if head != expected or dirty:
              raise SystemExit("Native capsule source requires the exact clean checkout")
          PY
          test ! -e "$RUNNER_TEMP/e11-custody-venv"
          python3 -m venv "$RUNNER_TEMP/e11-custody-venv"
          "$RUNNER_TEMP/e11-custody-venv/bin/python" -m pip install \
            --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r tooling/requirements/mlt-g2-custody.txt
          "$RUNNER_TEMP/e11-custody-venv/bin/python" -B - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path.cwd() / "tooling"))
          import ci_private_evidence as custody

          try:
              pin = json.loads(Path("SOURCE_LOCK.json").read_text(encoding="utf-8"))["dependencies"]["semwright"]["revision"]
              custody.validate_context({
                  "source_sha": os.environ["GITHUB_SHA"], "semwright_sha": pin,
                  "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              })
              custody.public_key(custody.strict(os.environ["MOTIONWRIGHT_E11_RECOVERY_RECIPIENT"].encode()))
          except Exception:
              raise SystemExit("Native capsule source recovery inputs were not admitted") from None
          PY
      - name: Record admitted G1-only scope without Host or G2 acceptance
        id: g1_scope
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.g1_only && steps.e11_admission.outcome == 'success' }}
        run: |
          set -euo pipefail
          umask 077
          python3 -B - <<'PY_SCOPE'
          import json
          import os
          from pathlib import Path

          receipt = {
              "schema": "motionwright.native-sdk-g1-only-scope/1",
              "source_sha": os.environ["GITHUB_SHA"],
              "semwright_sha": json.loads(Path("SOURCE_LOCK.json").read_text(encoding="utf-8"))["dependencies"]["semwright"]["revision"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "selection": "g1_only",
              "capsule_source_admission": "PASSED",
              "source_and_platform_guards_selected": True,
              "host_job_selected": False,
              "g2_selected": False,
              "test_results_asserted": False,
              "formal_acceptance": False,
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "native-sdk-g1-only-scope.original.json"
          with output.open("x", encoding="utf-8") as stream:
              stream.write(json.dumps(receipt, sort_keys=True, indent=2) + "\n")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write("G1-only scope admitted: source and platform guards selected. Host and G2 are not selected. This receipt does not assert test results or formal acceptance.\n")
          PY_SCOPE
      - name: Resolve pinned Semwright revision
        id: pin
        run: |
          sha="$(python3 -c 'import json; print(json.load(open("SOURCE_LOCK.json"))["dependencies"]["semwright"]["revision"])')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: seradotcom/semwright
          ref: ${{ steps.pin.outputs.sha }}
          path: _semwright
          persist-credentials: false
      - name: Verify immutable checkout
        run: |
          test "$(git -C _semwright rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: motionwright-native-sdk-1.98.1
          cache-on-failure: true
      - name: Verify source-bound JSON command failure redaction
        run: python3 -m unittest discover -s tooling/tests -p 'test_native_cli_failure_redaction.py' -v
      - name: Refuse private shared-state receipts in public artifact
        run: python3 -m unittest discover -s tooling/tests -p 'test_native_shared_state_public_artifact.py' -v
      - name: Upstream public Native SDK contract tests
        working-directory: _semwright
        run: cargo test --locked -p semwright-native-sdk --features driver --test cooperation
      - name: Motionwright Native SDK adapter tests
        run: cargo test --locked -p motionwright-native --all-targets
      - name: Native capsule source Service verification
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.e11_capsule_source && steps.e11_admission.outcome == 'success' }}
        run: |
          set -euo pipefail
          umask 077
          controls="$RUNNER_TEMP/e11-service-controls.original.log"
          test ! -e "$controls"
          cargo test --locked -p motionwright-service \
            --test native_capsule_source_inspection -- --test-threads=1 \
            2>&1 | tee "$controls"
          python3 - "$controls" <<'PY'
          from pathlib import Path
          import re
          import sys

          output = Path(sys.argv[1]).read_text(encoding="utf-8")
          if (len(re.findall(r"^running 5 tests$", output, re.MULTILINE)) != 1
                  or len(re.findall(r"^test result: ok\. 5 passed; 0 failed; 0 ignored;", output, re.MULTILINE)) != 1):
              raise SystemExit("Exactly five native capsule source Service tests must execute and pass")
          PY
      - name: Music and SFX domain regression tests
        if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || !inputs.e11_capsule_source || steps.e11_admission.outcome == 'success') && (github.event_name != 'workflow_dispatch' || !inputs.g1_only || steps.e11_admission.outcome == 'success') }}
        run: >-
          cargo test --locked -p motionwright-domain
          --test music_clock --test music_conform
          --test music_sfx_impact_ack --test semantic_sfx
      - name: Preview and music persistence service tests
        if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || !inputs.e11_capsule_source || steps.e11_admission.outcome == 'success') && (github.event_name != 'workflow_dispatch' || !inputs.g1_only || steps.e11_admission.outcome == 'success') }}
        run: >-
          cargo test --locked -p motionwright-service
          --test change_preview --test music_conform_persistence
          --test music_cut_persistence --test native_capsule_source_inspection

      - name: Retain the G1-only scope receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.g1_only && steps.g1_scope.outcome == 'success' }}
        with:
          name: motionwright-native-sdk-g1-only-${{ github.sha }}-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-sdk-g1-only-scope.original.json
          if-no-files-found: error
          retention-days: 14


  macos-owner-path-alias:
    needs: verify-native-sdk
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: motionwright-v01-macos-owner-path-1.98.1
          cache-on-failure: false
      - name: Check trusted macOS system aliases and reject arbitrary parent links
        run: cargo test --locked -p motionwright-native --lib path_boundary_tests -- --nocapture

  windows-ntfs-owner-path:
    needs: [verify-native-sdk, macos-owner-path-alias]
    if: ${{ !cancelled() && needs.verify-native-sdk.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: motionwright-v01-windows-owner-path-1.98.1
          cache-on-failure: false
      - name: Refuse NTFS junctions in production connection and media root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) {
            throw 'Windows source identity does not match this GitHub commit'
          }
          $fixture = Join-Path $env:RUNNER_TEMP 'motionwright-v01-owner-junction'
          $original = Join-Path $fixture 'original'
          $junction = Join-Path $fixture 'junction'
          if (Test-Path $fixture) { throw 'Junction fixture already exists' }
          New-Item -ItemType Directory -Path $original | Out-Null
          try {
            [IO.File]::WriteAllBytes(
              (Join-Path $original 'connection.json'),
              [Text.Encoding]::UTF8.GetBytes('private synthetic connection'))
            [IO.File]::WriteAllBytes(
              (Join-Path $original 'frame.png'),
              [Text.Encoding]::UTF8.GetBytes('native-frame'))
            $createJunction = 'mklink /J "' + $junction + '" "' + $original + '"'
            & cmd.exe /d /c $createJunction | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'NTFS junction could not be created' }
            $attributes = [IO.File]::GetAttributes($junction)
            if (([int]$attributes -band [int][IO.FileAttributes]::ReparsePoint) -eq 0) {
              throw 'Fixture does not have the Windows reparse point attribute'
            }
            $env:MOTIONWRIGHT_V01_JUNCTION_REAL = $original
            $env:MOTIONWRIGHT_V01_JUNCTION = $junction
            $testLines = @(cargo test --locked -p motionwright-native --lib path_boundary_tests::refuses_ntfs_junctions_from_ci_fixture -- --ignored --nocapture 2>&1)
            $testCode = $LASTEXITCODE
            $testText = $testLines | Out-String
            Write-Output $testText
            if ($testCode -ne 0 -or $testText -notmatch 'running 1 test' -or $testText -notmatch '1 passed; 0 failed') {
              throw 'Native NTFS path guard did not execute and pass exactly one real junction test'
            }
          } finally {
            if (Test-Path $junction) { [IO.Directory]::Delete($junction) }
            if (Test-Path $fixture) { Remove-Item $fixture -Recurse -Force }
          }

  real-host-shared-state:
    needs: verify-native-sdk
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.g1_only) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SEMWRIGHT_CHECKOUT_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.e11_capsule_source && 'verification/e11-sdk' || '_semwright' }}
      SEMWRIGHT_CHECKOUT: ${{ github.workspace }}/${{ github.event_name == 'workflow_dispatch' && inputs.e11_capsule_source && 'verification/e11-sdk' || '_semwright' }}
      SEMWRIGHT_TEST_DRIVER_SANDBOX: "1"
      SEMWRIGHT_TEST_SANDBOX_HELPER: ${{ github.workspace }}/${{ github.event_name == 'workflow_dispatch' && inputs.e11_capsule_source && 'verification/e11-sdk' || '_semwright' }}/target/debug/semwright-sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Admit the selected capsule source context and recovery recipient
        id: e11_admission
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.e11_capsule_source }}
        env:
          MW_NATIVE_EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          MOTIONWRIGHT_E11_RECOVERY_RECIPIENT: ${{ inputs.recovery_recipient }}
        run: |
          set -euo pipefail
          umask 077
          python3 -B - <<'PY'
          import os
          import re
          import subprocess

          expected = os.environ.get("MW_NATIVE_EXPECTED_SOURCE_SHA", "")
          if (os.environ.get("GITHUB_EVENT_NAME") != "workflow_dispatch"
                  or os.environ.get("GITHUB_RUN_ATTEMPT") != "1"
                  or re.fullmatch(r"[0-9a-f]{40}", expected) is None
                  or expected != os.environ.get("GITHUB_SHA")):
              raise SystemExit("Native capsule source context was not admitted")
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], stderr=subprocess.PIPE, text=True).strip()
          dirty = subprocess.check_output(
              ["git", "status", "--porcelain", "--untracked-files=all"], stderr=subprocess.PIPE,
          )
          if head != expected or dirty:
              raise SystemExit("Native capsule source requires the exact clean checkout")
          PY
          test ! -e "$RUNNER_TEMP/e11-custody-venv"
          python3 -m venv "$RUNNER_TEMP/e11-custody-venv"
          "$RUNNER_TEMP/e11-custody-venv/bin/python" -m pip install \
            --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r tooling/requirements/mlt-g2-custody.txt
          "$RUNNER_TEMP/e11-custody-venv/bin/python" -B - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path.cwd() / "tooling"))
          import ci_private_evidence as custody

          try:
              pin = json.loads(Path("SOURCE_LOCK.json").read_text(encoding="utf-8"))["dependencies"]["semwright"]["revision"]
              custody.validate_context({
                  "source_sha": os.environ["GITHUB_SHA"], "semwright_sha": pin,
                  "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              })
              custody.public_key(custody.strict(os.environ["MOTIONWRIGHT_E11_RECOVERY_RECIPIENT"].encode()))
          except Exception:
              raise SystemExit("Native capsule source recovery inputs were not admitted") from None
          PY
      - name: Resolve pinned Semwright revision
        id: pin
        run: |
          sha="$(python3 -c 'import json; print(json.load(open("SOURCE_LOCK.json"))["dependencies"]["semwright"]["revision"])')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: seradotcom/semwright
          ref: ${{ steps.pin.outputs.sha }}
          path: ${{ env.SEMWRIGHT_CHECKOUT_PATH }}
          persist-credentials: false
      - name: Verify exact source identities
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git -C "$SEMWRIGHT_CHECKOUT" rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"
      - name: Verify the selected capsule source and SDK locks
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.e11_capsule_source }}
        env:
          MW_NATIVE_EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          "$RUNNER_TEMP/e11-custody-venv/bin/python" -B - <<'PY'
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path.cwd() / "tooling"))
          from native_host_shared_state import capsule_source_identity

          capsule_source_identity()
          PY
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: motionwright-native-real-host-1.98.1
          cache-on-failure: true
      - name: Configure disposable-runner Driver Host sandbox
        run: |
          bash "$SEMWRIGHT_CHECKOUT/scripts/dev/ci-driver-bwrap-profile.sh" \
            "$GITHUB_WORKSPACE/verification/native-sdk/github-actions/shared-state/sandbox-profile.txt"
      - name: Install exact Semwright daemon build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpipewire-0.3-dev pkg-config clang
      - name: Build exact Semwright daemon, CLI and sandbox
        working-directory: ${{ env.SEMWRIGHT_CHECKOUT }}
        run: |
          cargo build --locked -p semwright-daemon -p semwright-cli --bins
          cargo build --locked -p semwright-plugin-host --bin semwright-sandbox
      - name: Build Motionwright provider and app-state actor
        run: |
          cargo build --locked -p motionwright-native \
            --bin motionwright-native-provider \
            --example shared-state-actor
      - name: Real UI-service to Native Host shared-state acceptance
        env:
          MW_SHARED_STATE_CUSTODY: ${{ github.event_name == 'workflow_dispatch' && inputs.e11_capsule_source && github.run_attempt == '1' && '1' || '' }}
          MW_NATIVE_EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          MOTIONWRIGHT_E11_RECOVERY_RECIPIENT: ${{ inputs.recovery_recipient }}
        run: |
          if [ "$MW_SHARED_STATE_CUSTODY" = "1" ]; then
            "$RUNNER_TEMP/e11-custody-venv/bin/python" -B tooling/native_host_shared_state.py --shared-state-custody
          else
            python3 tooling/native_host_shared_state.py
          fi
      - name: Retain encrypted standard shared-state originals
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.e11_capsule_source && github.run_attempt == '1' }}
        with:
          name: motionwright-e11-standard-sealed-${{ github.sha }}-${{ github.run_id }}-attempt1
          path: verification/native-sdk/shared-state-sealed/${{ github.sha }}/sealed-originals.bin
          if-no-files-found: error
          retention-days: 14
      - name: Stage verified public shared-state checks, never owner calls or daemon logs
        if: always()
        env:
          NATIVE_CI_JOB_STATUS: ${{ job.status }}
        run: |
          python3 tooling/native_shared_state_public_artifact.py \
            --source-sha "$GITHUB_SHA" \
            --evidence-root "verification/native-sdk/github-actions/shared-state/$GITHUB_SHA" \
            --output-root "verification/native-sdk/public-shared-state" \
            --job-status "$NATIVE_CI_JOB_STATUS"
          python3 -m json.tool verification/native-sdk/public-shared-state/public-evidence.json >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: motionwright-native-shared-state-${{ github.sha }}
          path: verification/native-sdk/public-shared-state
          if-no-files-found: error
          retention-days: 14
      - name: Real native capsule source Host cycle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.e11_capsule_source && github.run_attempt == '1' }}
        env:
          MW_NATIVE_EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          MOTIONWRIGHT_E11_RECOVERY_RECIPIENT: ${{ inputs.recovery_recipient }}
        run: '"$RUNNER_TEMP/e11-custody-venv/bin/python" -B tooling/native_host_shared_state.py --capsule-source'
      - name: Retain encrypted capsule source originals
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.e11_capsule_source && github.run_attempt == '1' }}
        with:
          name: motionwright-e11-source-sealed-${{ github.sha }}-${{ github.run_id }}-attempt1
          path: verification/native-sdk/capsule-source-sealed/${{ github.sha }}/sealed-originals.bin
          if-no-files-found: error
          retention-days: 14
      # Finish the normal provider's capture and public curation before building
      # the instrumented provider in the same Cargo target directory.
      - name: Real Core Host Native read scope guards
        run: |
          set -euo pipefail
          umask 077
          evidence_parent="$GITHUB_WORKSPACE/verification/native-sdk/github-actions/native-read"
          evidence="$evidence_parent/$GITHUB_SHA"
          mkdir -p "$evidence_parent"
          mkdir -m 700 "$evidence"
          mkdir -m 700 "$evidence/originals"
          cargo build --locked -p motionwright-native \
            --features native-graph-owner-fixture \
            --bin motionwright-native-provider \
            --example native-graph-owner-fixture \

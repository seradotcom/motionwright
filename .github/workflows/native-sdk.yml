name: Native SDK Pin

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "SOURCE_LOCK.json"
      - "crates/native/**"
      - "apps/desktop/src-tauri/**"
      - "tooling/native_host_shared_state.py"
      - "tooling/native_av_failure_guard.py"
      - "tooling/tests/test_native_cli_failure_redaction.py"
      - "docs/native-sdk.md"
      - ".github/workflows/native-sdk.yml"
  push:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "SOURCE_LOCK.json"
      - "crates/native/**"
      - "apps/desktop/src-tauri/**"
      - "tooling/native_host_shared_state.py"
      - "tooling/native_av_failure_guard.py"
      - "tooling/tests/test_native_cli_failure_redaction.py"
      - "docs/native-sdk.md"
      - ".github/workflows/native-sdk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-sdk-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  verify-native-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve pinned Semwright revision
        id: pin
        run: |
          sha="$(python3 -c 'import json; print(json.load(open("SOURCE_LOCK.json"))["dependencies"]["semwright"]["revision"])')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: seradotcom/semwright
          ref: ${{ steps.pin.outputs.sha }}
          path: _semwright
          persist-credentials: false
      - name: Verify immutable checkout
        run: |
          test "$(git -C _semwright rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: motionwright-native-sdk-1.98.1
          cache-on-failure: true
      - name: Verify source-bound JSON command failure redaction
        run: python3 -m unittest discover -s tooling/tests -p 'test_native_cli_failure_redaction.py' -v
      - name: Upstream public Native SDK contract tests
        working-directory: _semwright
        run: cargo test --locked -p semwright-native-sdk --features driver --test cooperation
      - name: Motionwright Native SDK adapter tests
        run: cargo test --locked -p motionwright-native --all-targets

  macos-owner-path-alias:
    needs: verify-native-sdk
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: motionwright-v01-macos-owner-path-1.98.1
          cache-on-failure: false
      - name: Check trusted macOS system aliases and reject arbitrary parent links
        run: cargo test --locked -p motionwright-native --lib path_boundary_tests -- --nocapture

  windows-ntfs-owner-path:
    needs: verify-native-sdk
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: motionwright-v01-windows-owner-path-1.98.1
          cache-on-failure: false
      - name: Refuse NTFS junctions in production connection and media root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) {
            throw 'Windows source identity does not match this GitHub commit'
          }
          $fixture = Join-Path $env:RUNNER_TEMP 'motionwright-v01-owner-junction'
          $original = Join-Path $fixture 'original'
          $junction = Join-Path $fixture 'junction'
          if (Test-Path $fixture) { throw 'Junction fixture already exists' }
          New-Item -ItemType Directory -Path $original | Out-Null
          try {
            [IO.File]::WriteAllBytes(
              (Join-Path $original 'connection.json'),
              [Text.Encoding]::UTF8.GetBytes('private synthetic connection'))
            [IO.File]::WriteAllBytes(
              (Join-Path $original 'frame.png'),
              [Text.Encoding]::UTF8.GetBytes('native-frame'))
            $createJunction = 'mklink /J "' + $junction + '" "' + $original + '"'
            & cmd.exe /d /c $createJunction | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'NTFS junction could not be created' }
            $attributes = [IO.File]::GetAttributes($junction)
            if (([int]$attributes -band [int][IO.FileAttributes]::ReparsePoint) -eq 0) {
              throw 'Fixture does not have the Windows reparse point attribute'
            }
            $env:MOTIONWRIGHT_V01_JUNCTION_REAL = $original
            $env:MOTIONWRIGHT_V01_JUNCTION = $junction
            $testLines = @(cargo test --locked -p motionwright-native --lib path_boundary_tests::refuses_ntfs_junctions_from_ci_fixture -- --ignored --nocapture 2>&1)
            $testCode = $LASTEXITCODE
            $testText = $testLines | Out-String
            Write-Output $testText
            if ($testCode -ne 0 -or $testText -notmatch 'running 1 test' -or $testText -notmatch '1 passed; 0 failed') {
              throw 'Native NTFS path guard did not execute and pass exactly one real junction test'
            }
          } finally {
            if (Test-Path $junction) { [IO.Directory]::Delete($junction) }
            if (Test-Path $fixture) { Remove-Item $fixture -Recurse -Force }
          }

  real-host-shared-state:
    needs: verify-native-sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SEMWRIGHT_CHECKOUT: ${{ github.workspace }}/_semwright
      SEMWRIGHT_TEST_DRIVER_SANDBOX: "1"
      SEMWRIGHT_TEST_SANDBOX_HELPER: ${{ github.workspace }}/_semwright/target/debug/semwright-sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve pinned Semwright revision
        id: pin
        run: |
          sha="$(python3 -c 'import json; print(json.load(open("SOURCE_LOCK.json"))["dependencies"]["semwright"]["revision"])')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: seradotcom/semwright
          ref: ${{ steps.pin.outputs.sha }}
          path: _semwright
          persist-credentials: false
      - name: Verify exact source identities
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git -C _semwright rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: motionwright-native-real-host-1.98.1
          cache-on-failure: true
      - name: Configure disposable-runner Driver Host sandbox
        run: |
          bash _semwright/scripts/dev/ci-driver-bwrap-profile.sh \
            "$GITHUB_WORKSPACE/verification/native-sdk/github-actions/shared-state/sandbox-profile.txt"
      - name: Install exact Semwright daemon build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpipewire-0.3-dev pkg-config clang
      - name: Build exact Semwright daemon, CLI and sandbox
        working-directory: _semwright
        run: |
          cargo build --locked -p semwright-daemon -p semwright-cli --bins
          cargo build --locked -p semwright-plugin-host --bin semwright-sandbox
      - name: Build Motionwright provider and app-state actor
        run: |
          cargo build --locked -p motionwright-native \
            --bin motionwright-native-provider \
            --example shared-state-actor
      - name: Real UI-service to Native Host shared-state acceptance
        run: python3 tooling/native_host_shared_state.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: motionwright-native-shared-state-${{ github.sha }}
          path: verification/native-sdk/github-actions/shared-state
          if-no-files-found: error
          retention-days: 14

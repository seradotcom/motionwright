name: Native SDK Pin

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "SOURCE_LOCK.json"
      - "crates/native/**"
      - "apps/desktop/src-tauri/**"
      - ".github/workflows/native-sdk.yml"
  push:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "SOURCE_LOCK.json"
      - "crates/native/**"
      - "apps/desktop/src-tauri/**"
      - ".github/workflows/native-sdk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-native-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pinned Semwright revision
        id: pin
        run: echo "sha=$(python3 -c 'import json; print(json.load(open("SOURCE_LOCK.json"))["dependencies"]["semwright"]["revision"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: seradotcom/semwright
          ref: ${{ steps.pin.outputs.sha }}
          path: _semwright
      - name: Verify immutable checkout
        run: test "$(git -C _semwright rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Upstream public Native SDK contract tests
        working-directory: _semwright
        run: cargo test -p semwright-native-sdk --features driver --test cooperation
      - name: Motionwright Native SDK adapter tests
        run: cargo test -p motionwright-native --all-targets

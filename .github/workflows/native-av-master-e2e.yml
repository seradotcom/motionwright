name: Native Motionwright AV master

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'SOURCE_LOCK.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/domain/**'
      - 'crates/service/**'
      - 'crates/storage/**'
      - 'crates/native/**'
      - 'apps/studio/**'
      - 'tooling/native_av_master_e2e.py'
      - 'tooling/native_av_media_probe.py'
      - 'tooling/native_provider_lifecycle.py'
      - 'tooling/tests/test_native_av_media_probe.py'
      - 'tooling/tests/test_native_provider_lifecycle.py'
      - '.github/workflows/native-av-master-e2e.yml'

permissions:
  contents: read

concurrency:
  group: native-av-master-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  PLAYWRIGHT_BROWSERS_PATH: '0'
  SEMWRIGHT_CHECKOUT: ${{ github.workspace }}/_semwright

jobs:
  native-av-master:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Resolve exact Semwright source pin
        id: pin
        run: |
          set -euo pipefail
          sha="$(python3 -c 'import json; print(json.load(open("SOURCE_LOCK.json"))["dependencies"]["semwright"]["revision"])')"
          test "${#sha}" -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: seradotcom/semwright
          ref: ${{ steps.pin.outputs.sha }}
          path: _semwright
          persist-credentials: false

      - name: Verify immutable source identities
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git -C _semwright rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"
          python3 tooling/source_policy.py

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: motionwright-native-av-master-1.98.1
          cache-on-failure: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: _semwright/integrations/motion-canvas/runtime/package-lock.json

      - name: Install pinned native runtimes
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bubblewrap apparmor-profiles apparmor-utils \
            melt ffmpeg libpipewire-0.3-dev pkg-config clang
          mkdir -p verification/native-av-master-e2e
          {
            melt -version | head -5
            ffmpeg -version | head -3
            ffprobe -version | head -3
            bwrap --version
          } > verification/native-av-master-e2e/native-runtime-versions.txt

      - name: Configure disposable-runner Driver Host sandbox
        run: |
          set -euo pipefail
          bash _semwright/scripts/dev/ci-driver-bwrap-profile.sh \
            "$GITHUB_WORKSPACE/verification/native-av-master-e2e/sandbox-profile.txt"

      - name: Install exact Motion Canvas runtime and Firefox
        working-directory: _semwright/integrations/motion-canvas/runtime
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps firefox
          npm run probe

      - name: Build exact Semwright Broker and native providers
        working-directory: _semwright
        run: |
          set -euo pipefail
          cargo build --locked -p semwright-daemon -p semwright-cli --bins
          cargo build --locked \
            -p semwright-plugin-host --bin semwright-sandbox \
            -p semwright-driver-motion-canvas --bin semwright-motion-canvas-driver \
            -p semwright-mlt-video-driver --bin semwright-mlt-video-driver \
            -p semwright-mlt-video-driver --bin semwright-mlt-runtime-runner
          test -x target/debug/semwright
          test -x target/debug/semwrightd
          test -x target/debug/semwright-sandbox
          test -x target/debug/semwright-motion-canvas-driver
          test -x target/debug/semwright-mlt-video-driver
          test -x target/debug/semwright-mlt-runtime-runner

      - name: Build Motionwright native AV acceptance
        run: |
          set -euo pipefail
          cargo build --locked -p motionwright-native --example native-render-e2e
          cargo test --locked -p motionwright-native \
            motion_canvas_production_is_revision_bound_rendered_and_natively_verified \
            -- --nocapture

      - name: Adversarial acknowledged render job integrity (synthetic, no redispatch)
        run: |
          set -euo pipefail
          cargo test --locked -p motionwright-native --lib motion_render_integrity -- --nocapture \
            | tee verification/native-av-master-e2e/job-integrity-test.log
          cargo test --locked -p motionwright-service --lib foreign_motion_status_or_result_is_unknown_in_studio_and_sdk_job_projection -- --nocapture \
            | tee -a verification/native-av-master-e2e/job-integrity-test.log
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path("verification/native-av-master-e2e")
          src = Path("crates/native/src/production/motion_render_integrity_tests.rs")
          log = root / "job-integrity-test.log"
          assert src.is_file() and log.stat().st_size > 0
          contents = log.read_text(encoding="utf-8")
          assert "test result: ok." in contents
          assert "forged_status_or_result_must_never_become_native_render_evidence" in contents
          assert "foreign_motion_status_or_result_is_unknown_in_studio_and_sdk_job_projection" in contents
          (root / "job-integrity-contract.json").write_text(json.dumps({
              "schema":"motionwright.synthetic-job-identity-conformance/1",
              "motionwright_sha":os.environ["GITHUB_SHA"],
              "native_driver_mode":"synthetic_broker_envelopes_not_live_provider_fault",
              "source_sha256":hashlib.sha256(src.read_bytes()).hexdigest(),
              "result":"PASS",
              "live_provider_recovery":"NOT_PROVEN",
              "second_render_start":"FORBIDDEN",
          },sort_keys=True,indent=2)+"\n", encoding="utf-8")
          PY

      - name: Verify decoded-media acceptance rejects silent, swapped, or static output
        run: python3 -m unittest discover -s tooling/tests -p 'test_native_av_media_probe.py' -v

      - name: Verify provider lifecycle diagnostics do not record secrets or imply recovery
        run: python3 -m unittest discover -s tooling/tests -p 'test_native_provider_lifecycle.py' -v

      - name: Produce a real application-owned AV master through Broker and Driver Host
        run: |
          set -euo pipefail
          python3 tooling/native_av_master_e2e.py \
            | tee verification/native-av-master-e2e/run.log

      - name: Verify exact-SHA AV evidence
        run: |
          set -euo pipefail
          root="verification/native-av-master-e2e/${GITHUB_SHA}"
          test -s "$root/result.json"
          test -s "$root/motionwright-render-evidence.json"
          test -s "$root/motionwright-av-master-evidence.json"
          test -s "$root/artifact-manifest.json"
          test -s "$root/frame-first.png"
          test -s "$root/frame-middle.png"
          test -s "$root/frame-last.png"
          test -s "$root/motionwright-master.mp4"
          test -s "$root/decoded-media-proof.json"
          test -s "$root/native-provider-lifecycle.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("verification/native-av-master-e2e") / os.environ["GITHUB_SHA"]
          result = json.loads((root / "result.json").read_text())
          assert result["native_av_master_e2e"] == "PASS"
          assert result["motionwright_sha"] == os.environ["GITHUB_SHA"]
          assert result["frame_count"] == 60
          assert len(result["artifact_manifest_sha256"]) == 64
          assert len(result["audio_sha256"]) == 64
          assert len(result["master_sha256"]) == 64
          assert result["master_path"].endswith("-master.mp4")
          assert (root / "motionwright-master.mp4").stat().st_size > 0
          health = json.loads((root / "native-provider-lifecycle.json").read_text())
          assert health["schema"] == "motionwright-ci-provider-lifecycle/1"
          assert health["authority"] == "passive-ci-process-status-not-driver-evidence"
          assert health["sample_count"] >= 1
          assert health["daemon_exit_before_owner_cleanup"] is None
          probe = json.loads((root / "decoded-media-proof.json").read_text())
          assert probe["evidence_scope"] == "actual_decoded_h264_aac_two_second_fixture_only"
          assert probe["master_sha256"] == result["master_sha256"]
          assert probe["source_wav_sha256"] == result["audio_sha256"]
          assert probe["video_frames_decoded"] == 60
          assert probe["video_movement_decoded"] is True
          assert probe["stereo_channel_identity"] == "confirmed_distinct_source_tones"
          assert probe["changed_channel_bytes"] >= 85
          assert result["decoded_moving_frame_channels"] == probe["changed_channel_bytes"]
          assert result["decoded_content_check"] == probe["evidence_scope"]
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: motionwright-native-av-master-${{ github.sha }}
          path: verification/native-av-master-e2e
          if-no-files-found: error
          retention-days: 14

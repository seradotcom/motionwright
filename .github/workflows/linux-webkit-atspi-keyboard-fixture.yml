name: Linux WebKitGTK AT-SPI registered keyboard fixture
on:
  push:
    branches:
      - integrate/phase1-final-composition-20261027
    paths:
      - '.github/workflows/linux-webkit-atspi-keyboard-fixture.yml'
      - 'tooling/ci_linux_webkit_atspi_keyboard_fixture.py'
permissions:
  contents: read
jobs:
  one-registered-input-event:
    if: github.repository == 'seradotcom/motionwright' && github.ref == 'refs/heads/integrate/phase1-final-composition-20261027' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install standalone system GI, WebKitGTK and AT-SPI only
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 gir1.2-atspi-2.0 at-spi2-core libatk-adaptor libglib2.0-bin xvfb dbus-x11 x11-utils
          /usr/bin/python3 -B -E -s - <<'PY_SOURCE'
          import ast
          from pathlib import Path
          for path in ('tooling/ci_linux_webkit_atspi_keyboard_fixture.py',
                       'tooling/ci_linux_webkit_editable_matrix.py'):
              ast.parse(Path(path).read_bytes())
          import gi
          gi.require_version('Atspi','2.0')
          from gi.repository import Atspi
          assert hasattr(Atspi, 'generate_keyboard_event')
          assert Atspi.KeySynthType.STRING is not None
          print('registered-keyboard-GI-method=PASS')
          PY_SOURCE
      - name: One journaled registered input event into disposable GTK fixture, never Motionwright
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          scope="$RUNNER_TEMP/mw-atspi-keyboard-fixture-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$scope"
          mkdir -m 700 "$scope"
          timeout -k 5s 70s xvfb-run -a -s "-screen 0 1440x940x24" dbus-run-session -- /usr/bin/python3 -B -E -s \
            tooling/ci_linux_webkit_atspi_keyboard_fixture.py \
            --ready "$scope/fixture-ready.json" --output "$scope/result.original.json"
      - name: Retain one original source-and-PID-bound fixture input custody
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-webkit-atspi-keyboard-fixture-original-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mw-atspi-keyboard-fixture-${{ github.run_id }}-${{ github.run_attempt }}/original-intent.json
            ${{ runner.temp }}/mw-atspi-keyboard-fixture-${{ github.run_id }}-${{ github.run_attempt }}/result.original.json
            ${{ runner.temp }}/mw-atspi-keyboard-fixture-${{ github.run_id }}-${{ github.run_attempt }}/fixture-ready.json
            ${{ runner.temp }}/mw-atspi-keyboard-fixture-${{ github.run_id }}-${{ github.run_attempt }}/stages/*.json
            ${{ runner.temp }}/mw-atspi-keyboard-fixture-${{ github.run_id }}-${{ github.run_attempt }}/fixture-server.stdout
          if-no-files-found: warn
          retention-days: 30

          STATE = {
              "schema": "motionwright-windows-nsis-update-observation/1",
              "status": "NOT_STARTED", "source_sha": SOURCE, "mode": MODE,
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "stage": "preflight", "actions": [], "snapshots": [],
              "source_before": None, "source_after": None, "source_binding": "PENDING",
              "input_before": None, "input_after": None,

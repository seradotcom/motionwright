  linux:
    if: github.event_name != 'workflow_dispatch' || (inputs.verification_scope != 'windows_contracts' && inputs.verification_scope != 'windows_installed' && inputs.verification_scope != 'nsis_source' && inputs.verification_scope != 'nsis_compile' && inputs.verification_scope != 'nsis_lifecycle')
    needs: receipt-policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: false
      - name: Install Linux desktop bundling prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libfuse2 xvfb x11-utils dbus-x11
      - name: Install locked Studio and Tauri CLI dependencies
        run: npm --prefix apps/studio ci --no-audit --no-fund
      - name: Build unsigned Linux candidate bundles
        run: |
          cd apps/desktop
          npm --prefix ../studio exec -- tauri build --bundles deb,appimage
      - name: Verify actual Linux candidate compiled the reviewed local glib source
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          python3 tooling/v01_glib_product_admission.py --output ci-evidence/glib-patched-source.json
          cargo tree --locked -p motionwright-desktop --target x86_64-unknown-linux-gnu -i glib > ci-evidence/glib-compiled-owner-tree.txt
          grep -F 'vendor/glib-0.18.5' ci-evidence/glib-compiled-owner-tree.txt >/dev/null
          count="$(find target/release/deps -maxdepth 1 -type f -name 'libglib-*.rlib' | wc -l)"
          test "$count" -ge 1
          echo 'v01-glib-product-candidate=LOCAL_BACKPORT_COMPILED linux_installed_gui=NOT_YET_VERIFIED'
      - name: Record exact Linux candidate artifacts
        run: |
          appimage_count="$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | wc -l)"
          deb_count="$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' | wc -l)"
          test "$appimage_count" -eq 1
          test "$deb_count" -eq 1
          appimage="$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print)"
          deb="$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print)"
          python3 tooling/package_receipt.py \
            --git-sha "$GITHUB_SHA" \
            --platform linux \
            --arch x86_64 \
            --artifact "$appimage" \
            --artifact "$deb" \
            --output ci-evidence/linux-candidate.json
      - name: Inspect extracted Linux packages and launch a rootless AppImage window
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          deb="$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          appimage="$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          work="$RUNNER_TEMP/motionwright-smoke"
          mkdir -p "$work/deb" "$work/appimage"
          dpkg-deb --extract "$deb" "$work/deb"
          mapfile -t deb_bins < <(find "$work/deb/usr/bin" -maxdepth 1 -type f -executable -iname "*motionwright*")
          mapfile -t deb_desktop < <(find "$work/deb/usr/share/applications" -maxdepth 1 -type f -name '*.desktop')
          test "${#deb_bins[@]}" -eq 1
          test "${#deb_desktop[@]}" -eq 1
          python3 tooling/candidate_smoke.py \
            --candidate-receipt ci-evidence/linux-candidate.json \
            --expected-source-sha "$GITHUB_SHA" \
            --kind deb --method deb_extract \
            --artifact "$deb" --installed-binary "${deb_bins[0]}" \
            --linux-desktop-entry "${deb_desktop[0]}" \
            --output ci-evidence/linux-deb-smoke.json
          echo "Debian extracted program and desktop metadata validated"
          chmod u+x "$appimage"
          echo "Extracting AppImage to disposable runner directory"
          if ! (cd "$work/appimage" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null); then
            echo "::error::AppImage extraction failed (no FUSE or sandbox bypass was attempted)"
            exit 1
          fi
          extracted="$work/appimage/squashfs-root"
          if ! test -x "$extracted/AppRun"; then
            echo "::error::AppImage extraction contains no executable AppRun"
            find "$extracted" -maxdepth 2 -name 'AppRun' -o -name '*.desktop'
            exit 1
          fi
          mapfile -t image_bins < <(find "$extracted/usr/bin" -maxdepth 1 -type f -executable -iname "*motionwright*")
          mapfile -t image_desktop < <(find "$extracted" -maxdepth 1 -name '*.desktop')
          if [ "${#image_bins[@]}" -ne 1 ]; then
            echo "::error::Expected one Motionwright binary in extracted AppImage, found ${#image_bins[@]}"
            find "$extracted/usr/bin" -maxdepth 1 -type f -printf '%f\n'
            exit 1
          fi
          if [ "${#image_desktop[@]}" -ne 1 ]; then
            echo "::error::Expected one AppImage desktop entry, found ${#image_desktop[@]}"
            find "$extracted" -maxdepth 1 -name '*.desktop' -printf '%f\n'
            exit 1
          fi
          echo "AppImage source payload extracted; testing fresh bootstrap, SQLite persistence and a second real X11 window"
          xvfb-run -a -s "-screen 0 1440x940x24" \
            dbus-run-session -- python3 tooling/linux_cold_start.py \
              --app-run "$extracted/AppRun" \
              --scratch "$work/isolated-gui" \
              --source-sha "$GITHUB_SHA" --storage-source-repo . \
              --source-lock SOURCE_LOCK.json \
              --output ci-evidence/linux-appimage-window.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from tooling.storage_schema_contract import admit_checkout
          cohort = admit_checkout(Path("."), os.environ["GITHUB_SHA"])
          evidence = json.loads(Path("ci-evidence/linux-appimage-window.json").read_text())
          assert evidence["schema"] == "motionwright.ci.installed-cold-relaunch/2"
          assert evidence["storage_cohort"] == cohort
          assert evidence["motionwright_sha"] == os.environ["GITHUB_SHA"]
          assert evidence["semwright_sha"] == json.loads(Path("SOURCE_LOCK.json").read_text())["dependencies"]["semwright"]["revision"]
          assert evidence["status"] == "WINDOW_OBSERVED"
          assert evidence["window_title"] == "Motionwright"
          assert evidence["launch_count"] == 2
          assert evidence["first_launch"]["status"] == "WINDOW_OBSERVED"
          assert evidence["reopened_launch"]["status"] == "WINDOW_OBSERVED"
          persistence = evidence["persistence"]
          assert persistence["status"] == "PASS"
          assert persistence["one_project_after_both_launches"] is True
          assert persistence["same_project_id"] is True
          assert persistence["same_generation"] is True
          assert persistence["same_revision"] is True
          assert persistence["same_domain_document_sha256"] is True
          assert persistence["sqlite_integrity_checked_twice"] is True
          assert persistence["schema_version"] == cohort["storage_schema"]
          assert persistence["native_receipts"] == 0
          assert all(len(persistence[key]) == 64 for key in ("project_identity_sha256", "generation_sha256", "document_sha256"))
          assert evidence["claims"]["human_install_acceptance"] == "NOT_RUN"
          assert evidence["claims"]["native_renderer_execution"] == "NOT_RUN"
          PY
          python3 tooling/candidate_smoke.py \
            --candidate-receipt ci-evidence/linux-candidate.json \
            --expected-source-sha "$GITHUB_SHA" \
            --kind appimage --method appimage_extract \
            --artifact "$appimage" --installed-binary "${image_bins[0]}" \
            --linux-desktop-entry "${image_desktop[0]}" \
            --linux-gui-probe ci-evidence/linux-appimage-window.json \
            --output ci-evidence/linux-appimage-smoke.json
      - name: Retain isolated GUI launch diagnostics if smoke fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-linux-smoke-diagnostics
          path: |
            ${{ runner.temp }}/motionwright-smoke/isolated-gui/app-run.log
            ${{ runner.temp }}/motionwright-smoke/isolated-gui/app-run-first.log
            ${{ runner.temp }}/motionwright-smoke/isolated-gui/app-run-second.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-linux-candidate
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            ci-evidence/linux-candidate.json
            ci-evidence/linux-deb-smoke.json
            ci-evidence/linux-appimage-smoke.json
            ci-evidence/linux-appimage-window.json
          if-no-files-found: error

  windows-contracts:
    if: github.event_name != 'workflow_dispatch' || (inputs.verification_scope != 'nsis_source' && inputs.verification_scope != 'nsis_compile' && inputs.verification_scope != 'nsis_lifecycle')
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Source and acceptance policy before Windows contract execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B -E -s tooling/source_policy.py
          if ($LASTEXITCODE -ne 0) { throw 'Source policy failed before Windows contracts' }
          python -B -E -s tooling/acceptance_policy.py
          if ($LASTEXITCODE -ne 0) { throw 'Acceptance policy failed before Windows contracts' }
      - name: Windows cold-start unit contracts before package build
        id: windows-contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (Resolve-Path $env:GITHUB_WORKSPACE).Path
          $head = (& git --no-replace-objects -C "$source" rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) {
            throw 'Windows contracts require the exact checked-out workflow source'
          }
          $tree = (& git --no-replace-objects -C "$source" rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify Windows contract source tree' }
          $proofDir = Join-Path $env:RUNNER_TEMP "motionwright-windows-contracts-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          if (Test-Path -LiteralPath "$proofDir") { throw 'Windows contract output must be new' }
          New-Item -ItemType Directory -Path "$proofDir" | Out-Null
          $report = Join-Path "$proofDir" 'receipt.json'
          python -B -I -S tooling/ci_test_runner.py `
            --repo "$source" --test-directory tooling/tests `
            --pattern test_windows_cold_start.py --mode both `
            --report "$report" --expected-source "$head" --require-complete --timeout 180
          if ($LASTEXITCODE -ne 0) { throw 'Windows unit contracts failed or were incomplete; NSIS build is blocked' }
          $readback = @'
          import ast, hashlib, json, os, re, sys
          from datetime import datetime, timezone
          from pathlib import Path
          report, root = Path(sys.argv[1]), Path(sys.argv[2])
          head, tree = sys.argv[3:5]
          if sys.platform != "win32":
              raise SystemExit("Windows contract assertions require the real Windows interpreter")
          receipt = json.loads(report.read_bytes())
          test_path = "tooling/tests/test_windows_cold_start.py"
          class_name = "WindowsCandidateUnitTests"
          # AST-bound exact source inventory; reject duplicate or dynamic cases.
          source_tree = ast.parse((root / test_path).read_text(encoding="utf-8"))
          classes = [node for node in source_tree.body
                     if isinstance(node, ast.ClassDef) and node.name == class_name]
          if len(classes) != 1:
              raise SystemExit("The reviewed Windows test class must be unique")
          cls = classes[0]
          if not any(isinstance(parent, ast.Attribute) and isinstance(parent.value, ast.Name)
                     and parent.value.id == "unittest" and parent.attr == "TestCase"
                     for parent in cls.bases):
              raise SystemExit("The reviewed Windows class must subclass unittest.TestCase")
          source_methods = [node.name for node in cls.body
                            if isinstance(node, ast.FunctionDef) and node.name.startswith("test_")]
          methods = set(source_methods)
          all_methods = [node.name for node in ast.walk(source_tree)
                         if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                         and node.name.startswith("test_")]
          dynamic_loaders = [node for node in ast.walk(source_tree)
                             if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                             and node.name == "load_tests"]
          if (len(source_methods) != 43 or len(methods) != 43
                  or len(all_methods) != 43 or dynamic_loaders):
              raise SystemExit("The reviewed Windows contract requires exactly 43 unique static source methods")
          expected_entries = ["discovery:test_windows_cold_start.py", "dotted:tooling.tests.test_windows_cold_start"]
          if (receipt.get("status") != "PASS" or type(receipt.get("exit_code")) is not int or receipt["exit_code"] != 0
                  or receipt.get("require_complete") is not True
                  or receipt.get("executed_source_sha") != head or receipt.get("tree_sha") != tree
                  or receipt.get("source_postcheck_error")
                  or [step.get("entry_point") for step in receipt.get("steps", [])] != expected_entries):
              raise SystemExit("Windows unit receipt is incomplete or belongs to another source")
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          if receipt.get("test_definition_sha256") != {test_path: digest(root / test_path)}:
              raise SystemExit("Windows test definitions changed after execution")
          if receipt.get("runner_sha256") != digest(root / "tooling/ci_test_runner.py"):
              raise SystemExit("Windows unit runner changed after execution")
          for key in ("GITHUB_SHA", "GITHUB_WORKFLOW_REF", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_JOB"):
              if receipt.get("github", {}).get(key) != os.environ[key]:
                  raise SystemExit("Windows unit receipt belongs to another job or attempt")
          method_inventory = {}
          for index, step in enumerate(receipt["steps"]):
              counts = step.get("counts", {})
              if (step.get("status") != "PASS" or type(step.get("exit_code")) is not int or step["exit_code"] != 0
                      or counts.get("terminal_status") != "OK"
                      or type(counts.get("tests_run")) is not int or counts["tests_run"] != 43
                      or type(counts.get("passed")) is not int or counts["passed"] != 43
                      or any(type(counts.get(key)) is not int or counts[key] != 0 for key in
                             ("failures", "errors", "skipped", "expected_failures", "unexpected_successes"))):
                  raise SystemExit("Windows unit entry point did not complete 43 controls without omissions")
              for stream in ("stdout", "stderr"):
                  path = report.with_name(f"{report.stem}-{index:02d}-{stream}.log")
                  if step.get(stream) != {"file": path.name, "sha256": digest(path)}:
                      raise SystemExit("Original unittest stream identity differs from its receipt")
              data = report.with_name(f"{report.stem}-{index:02d}-stderr.log").read_bytes()
              parsed_view = data.decode("utf-8", "strict").replace("\r\n", "\n").replace("\r", "\n")
              observed = re.findall(r"(?m)^test_\w+ \(([^()\n]+)\) \.\.\. ok$", parsed_view)
              module = "test_windows_cold_start" if index == 0 else "tooling.tests.test_windows_cold_start"
              expected = {f"{module}.{class_name}.{method}" for method in methods}
              if len(observed) != 43 or set(observed) != expected:
                  raise SystemExit("Original verbose output does not contain each of the 43 source controls exactly once")
              method_inventory[step["entry_point"]] = sorted(observed)
          source_inputs = {name: digest(root / name) for name in (
              test_path, "tooling/windows_cold_start.py", "tooling/windows_first_project_ui.ps1",
              "tooling/storage_schema_contract.py", "tooling/tests/test_storage_schema_contract.py",
              "tooling/windows_nsis_interruption.py",
              "tooling/ci_test_runner.py", ".github/workflows/package-candidate.yml")}
          result = {"schema": "motionwright.windows-unit-contract-readback/1",
                    "status": "PASS_WINDOWS_UNIT_CONTRACTS", "source_sha": head, "tree_sha": tree,
                    "completed_at_utc": datetime.now(timezone.utc).isoformat(),
                    "receipt_sha256": digest(report), "github": receipt["github"],
                    "source_inputs_sha256": source_inputs, "entrypoint_methods": method_inventory,
                    "unique_source_controls": 43, "entrypoints": 2, "skipped": 0,
                    "scope": "Synthetic G1: temporary SQLite/receipt fixtures and mocked native transport",
                    "installed_application_execution": False, "native_ui_execution": False,
                    "formal_acceptance": False, "release_verdict": False}
          with report.with_name("contract-readback.json").open("x", encoding="utf-8", newline="\n") as handle:
              json.dump(result, handle, indent=2, sort_keys=True)
              handle.write("\n")
          print("windows-unit-contracts=PASS unique=43 entrypoints=2 skipped=0 installed-ui=NOT_RUN")
          '@
          $readbackPath = Join-Path "$proofDir" 'verify-contract-readback.py'
          [System.IO.File]::WriteAllText($readbackPath, $readback, [System.Text.UTF8Encoding]::new($false))
          python -B -I -S "$readbackPath" "$report" "$source" "$head" "$tree"
          if ($LASTEXITCODE -ne 0) { throw 'Windows unit contract source/count/log readback failed' }
      - name: Preserve Windows unit contract receipts and original streams
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-windows-contracts-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/motionwright-windows-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
      - name: Observe original PowerShell guard with successful and failing child exits
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $proofDir = Join-Path $env:RUNNER_TEMP "motionwright-windows-exit-guard-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          python -B -I -S tooling/verify_powershell_exit_guard.py `
            --repo "$env:GITHUB_WORKSPACE" --expected-source "$env:GITHUB_SHA" `
            --powershell (Join-Path $PSHOME 'pwsh.exe') --output "$proofDir"
          if ($LASTEXITCODE -ne 0) { throw 'The real PowerShell exit guard was not verified' }
      - name: Retain original positive and negative PowerShell exit observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-windows-exit-guard-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/motionwright-windows-exit-guard-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error

  windows:
    if: github.event_name != 'workflow_dispatch' || (inputs.verification_scope != 'windows_contracts' && inputs.verification_scope != 'nsis_source' && inputs.verification_scope != 'nsis_compile' && inputs.verification_scope != 'nsis_lifecycle')
    needs: [receipt-policy, windows-contracts, nsis-source-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: false
      - name: Install locked Studio and Tauri CLI dependencies
        run: npm --prefix apps/studio ci --no-audit --no-fund
      - name: Build unsigned current-user Windows NSIS candidate
        shell: pwsh
        run: |
          Set-Location apps/desktop
          npm --prefix ../studio exec -- tauri build --bundles nsis
          Set-Location ../..
      - name: Record exact Windows candidate artifact
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe -File)
          if ($artifacts.Count -ne 1) {
            throw "Expected exactly one NSIS setup artifact, observed $($artifacts.Count)"
          }
          python tooling/package_receipt.py --git-sha "$env:GITHUB_SHA" --platform windows --arch x86_64 --artifact "$($artifacts[0].FullName)" --output ci-evidence/windows-candidate.json
      - name: Silent current-user NSIS install and inspect installed Windows executable
        shell: pwsh
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe -File)
          if ($installers.Count -ne 1) { throw 'Expected one NSIS installer to smoke test' }
          $dest = Join-Path $env:RUNNER_TEMP 'motionwright-nsis-current-user'
          if (Test-Path $dest) { throw 'Installed destination is unexpectedly preexisting' }
          $installer = $installers[0].FullName
          $process = Start-Process -FilePath $installer -ArgumentList "/S /D=$dest" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS current-user installer exited $($process.ExitCode)" }
          if (-not (Test-Path $dest)) { throw 'NSIS silently completed but no installed directory exists' }
          $binaries = @(Get-ChildItem $dest -Recurse -File -Filter '*motionwright*.exe' |
            Where-Object { $_.Name -notmatch '(unins|setup|uninstall)' })
          if ($binaries.Count -ne 1) {
            throw "Expected one installed Motionwright executable, got $($binaries.Count)"
          }
          python tooling/candidate_smoke.py `
            --candidate-receipt ci-evidence/windows-candidate.json `
            --expected-source-sha "$env:GITHUB_SHA" `
            --kind nsis --method nsis_silent_current_user `
            --artifact "$installer" --installed-binary "$($binaries[0].FullName)" `
            --output ci-evidence/windows-nsis-smoke.json
      - name: Cold launch and reopen the real NSIS-installed application
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:RUNNER_TEMP 'motionwright-nsis-current-user'
          $binaries = @(Get-ChildItem $dest -Recurse -File -Filter '*motionwright*.exe' |
            Where-Object { $_.Name -notmatch '(unins|setup|uninstall)' })
          if ($binaries.Count -ne 1) {
            throw 'Cannot uniquely identify the previously validated installed NSIS executable'
          }

  windows-contracts:
    if: github.event_name != 'workflow_dispatch' || (inputs.verification_scope != 'nsis_source' && inputs.verification_scope != 'distribution_source' && inputs.verification_scope != 'nsis_compile' && inputs.verification_scope != 'nsis_lifecycle' && inputs.verification_scope != 'linux_first_use_source' && inputs.verification_scope != 'linux_first_use')
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Source and acceptance policy before Windows contract execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B -E -s tooling/source_policy.py
          if ($LASTEXITCODE -ne 0) { throw 'Source policy failed before Windows contracts' }
          python -B -E -s tooling/acceptance_policy.py
          if ($LASTEXITCODE -ne 0) { throw 'Acceptance policy failed before Windows contracts' }
      - name: Windows cold-start unit contracts before package build
        id: windows-contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (Resolve-Path $env:GITHUB_WORKSPACE).Path
          $head = (& git --no-replace-objects -C "$source" rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) {
            throw 'Windows contracts require the exact checked-out workflow source'
          }
          $tree = (& git --no-replace-objects -C "$source" rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify Windows contract source tree' }
          $proofDir = Join-Path $env:RUNNER_TEMP "motionwright-windows-contracts-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          if (Test-Path -LiteralPath "$proofDir") { throw 'Windows contract output must be new' }
          New-Item -ItemType Directory -Path "$proofDir" | Out-Null
          $report = Join-Path "$proofDir" 'receipt.json'
          python -B -I -S tooling/ci_test_runner.py `
            --repo "$source" --test-directory tooling/tests `
            --pattern test_windows_cold_start.py --mode both `
            --report "$report" --expected-source "$head" --require-complete --timeout 180
          if ($LASTEXITCODE -ne 0) { throw 'Windows unit contracts failed or were incomplete; NSIS build is blocked' }
          $readback = @'
          import ast, hashlib, json, os, re, sys
          from datetime import datetime, timezone
          from pathlib import Path
          report, root = Path(sys.argv[1]), Path(sys.argv[2])
          head, tree = sys.argv[3:5]
          if sys.platform != "win32":
              raise SystemExit("Windows contract assertions require the real Windows interpreter")
          receipt = json.loads(report.read_bytes())
          test_path = "tooling/tests/test_windows_cold_start.py"
          class_name = "WindowsCandidateUnitTests"
          # AST-bound exact source inventory; reject duplicate or dynamic cases.
          source_tree = ast.parse((root / test_path).read_text(encoding="utf-8"))
          classes = [node for node in source_tree.body
                     if isinstance(node, ast.ClassDef) and node.name == class_name]
          if len(classes) != 1:
              raise SystemExit("The reviewed Windows test class must be unique")
          cls = classes[0]
          if not any(isinstance(parent, ast.Attribute) and isinstance(parent.value, ast.Name)
                     and parent.value.id == "unittest" and parent.attr == "TestCase"
                     for parent in cls.bases):
              raise SystemExit("The reviewed Windows class must subclass unittest.TestCase")
          source_methods = [node.name for node in cls.body
                            if isinstance(node, ast.FunctionDef) and node.name.startswith("test_")]
          methods = set(source_methods)
          all_methods = [node.name for node in ast.walk(source_tree)
                         if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                         and node.name.startswith("test_")]
          dynamic_loaders = [node for node in ast.walk(source_tree)
                             if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                             and node.name == "load_tests"]
          if (len(source_methods) != 48 or len(methods) != 48
                  or len(all_methods) != 48 or dynamic_loaders):
              raise SystemExit("The reviewed Windows contract requires exactly 48 unique static source methods")
          expected_entries = ["discovery:test_windows_cold_start.py", "dotted:tooling.tests.test_windows_cold_start"]
          if (receipt.get("schema") != "motionwright.unittest-execution/1"
                  or receipt.get("status") != "PASS" or type(receipt.get("exit_code")) is not int or receipt["exit_code"] != 0
                  or receipt.get("require_complete") is not True
                  or receipt.get("executed_source_sha") != head or receipt.get("tree_sha") != tree
                  or receipt.get("source_postcheck_error")
                  or [step.get("entry_point") for step in receipt.get("steps", [])] != expected_entries):

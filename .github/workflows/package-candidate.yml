              "project_capture_scope": "all_present_members_of_the_one_fresh_fixture_SQLite_family",
              "linked_assets_exports_other_databases": "NOT_EXERCISED",
              "uninstaller_execution": "NOT_RUN",
              "interruption_during_file_extraction": "NOT_EXERCISED",
              "rollback_of_unknown_or_truncated_files": "NOT_CLAIMED",

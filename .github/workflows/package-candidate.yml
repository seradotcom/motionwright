name: Candidate Packages
run-name: Candidate packages / ${{ inputs.verification_scope || 'all' }} / ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      verification_scope:
        description: Candidate packages, Windows contracts, or isolated NSIS source, compiler and lifecycle checks
        required: true
        type: choice
        default: all
        options:
          - all
          - windows_contracts
          - windows_installed
          - nsis_source
          - nsis_compile
          - nsis_lifecycle
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/studio/**"
      - "crates/**"
      - "tooling/package_receipt.py"
      - "tooling/nsis_owned_files.py"
      - "tooling/tests/test_nsis_owned_files.py"
      - "tooling/windows_installer_lifecycle.py"
      - "tooling/tests/test_windows_installer_lifecycle.py"
      - "docs/reliability/windows-uninstall-integrity.md"
      - "tooling/v01_glib_product_admission.py"
      - "tooling/upstream-crates/**"
      - "vendor/glib-0.18.5/**"
      - "tooling/release_manifest.py"
      - "tooling/tests/test_package_receipt.py"
      - "tooling/tests/test_candidate_receipt_source.py"
      - "tooling/candidate_attestation_input.py"
      - "tooling/tests/test_candidate_attestation_input.py"
      - "tooling/owner_candidate_provenance.py"
      - "tooling/tests/test_owner_candidate_provenance.py"
      - "tooling/candidate_smoke.py"
      - "tooling/linux_gui_probe.py"
      - "tooling/windows_cold_start.py"
      - "tooling/windows_first_project_ui.ps1"
      - "tooling/ci_test_runner.py"
      - "tooling/verify_powershell_exit_guard.py"
      - "tooling/tests/test_windows_cold_start.py"
      - "tooling/linux_cold_start.py"
      - "tooling/tests/test_linux_cold_start.py"
      - "tooling/storage_schema_contract.py"
      - "tooling/tests/test_storage_schema_contract.py"
      - "tooling/windows_nsis_interruption.py"
      - "tooling/tests/test_linux_gui_readiness.py"
      - "tooling/tests/test_candidate_smoke.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - "SOURCE_LOCK.json"
      - ".github/workflows/package-candidate.yml"
  push:
    branches: ["main", "feat/**"]
    paths:
      - "apps/desktop/**"
      - "apps/studio/**"
      - "crates/**"
      - "tooling/package_receipt.py"
      - "tooling/nsis_owned_files.py"
      - "tooling/tests/test_nsis_owned_files.py"
      - "tooling/windows_installer_lifecycle.py"
      - "tooling/tests/test_windows_installer_lifecycle.py"
      - "docs/reliability/windows-uninstall-integrity.md"
      - "tooling/v01_glib_product_admission.py"
      - "tooling/upstream-crates/**"
      - "vendor/glib-0.18.5/**"
      - "tooling/release_manifest.py"
      - "tooling/tests/test_package_receipt.py"
      - "tooling/tests/test_candidate_receipt_source.py"
      - "tooling/candidate_attestation_input.py"
      - "tooling/tests/test_candidate_attestation_input.py"
      - "tooling/owner_candidate_provenance.py"
      - "tooling/tests/test_owner_candidate_provenance.py"
      - "tooling/candidate_smoke.py"
      - "tooling/linux_gui_probe.py"
      - "tooling/windows_cold_start.py"
      - "tooling/windows_first_project_ui.ps1"
      - "tooling/ci_test_runner.py"
      - "tooling/verify_powershell_exit_guard.py"
      - "tooling/tests/test_windows_cold_start.py"
      - "tooling/linux_cold_start.py"
      - "tooling/tests/test_linux_cold_start.py"
      - "tooling/storage_schema_contract.py"
      - "tooling/tests/test_storage_schema_contract.py"
      - "tooling/windows_nsis_interruption.py"
      - "tooling/tests/test_linux_gui_readiness.py"
      - "tooling/tests/test_candidate_smoke.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - "SOURCE_LOCK.json"
      - ".github/workflows/package-candidate.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  receipt-policy:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Quick source and conformance policies for every verification scope
        run: |
          python3 tooling/source_policy.py
          python3 tooling/acceptance_policy.py
          python3 tooling/creative_status_policy.py
      - name: Candidate receipt and installed-package smoke policy tests
        run: |
          python3 -m unittest tooling/tests/test_package_receipt.py tooling/tests/test_candidate_receipt_source.py tooling/tests/test_candidate_attestation_input.py tooling/tests/test_owner_candidate_provenance.py
          python3 -m unittest tooling/tests/test_candidate_smoke.py tooling/tests/test_windows_cold_start.py tooling/tests/test_linux_cold_start.py tooling/tests/test_linux_gui_readiness.py tooling/tests/test_storage_schema_contract.py

      - name: Require all seventeen NSIS helper tests on Linux without skips
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import unittest

          ROOT = Path(os.environ["GITHUB_WORKSPACE"])
          sys.path.insert(0, str(ROOT / "tooling"))
          from package_receipt import verified_artifact
          from release_manifest import _checkout

          SOURCE = os.environ["GITHUB_SHA"]
          PATHS = ("tooling/nsis_owned_files.py", "tooling/tests/test_nsis_owned_files.py",
                   "apps/desktop/src-tauri/windows/installer.nsi",
                   "apps/desktop/src-tauri/windows/uninstall-ownership.nsh")
          def source():
              _checkout(ROOT, SOURCE)
              subprocess.run(["git", "ls-files", "--error-unmatch", "--", *PATHS],
                             cwd=ROOT, check=True, capture_output=True, timeout=10)
              files = {}
              for path in PATHS:
                  observed, size, digest = verified_artifact(ROOT, ROOT / path)
                  files[path] = {"bytes": size, "sha256": digest}
              tree = subprocess.run(["git", "rev-parse", "HEAD^{tree}"], cwd=ROOT, check=True,
                                    capture_output=True, text=True).stdout.strip()
              return {"checkout": SOURCE, "tree": tree, "files": files}

          before = source()
          runtime = Path(os.environ["RUNNER_TEMP"]) / "mw-nsis-linux-source-tests"
          runtime.mkdir()
          os.environ["MOTIONWRIGHT_TEST_ROOT"] = str(runtime)
          suite = unittest.defaultTestLoader.discover("tooling/tests", pattern="test_nsis_owned_files.py")
          def cases(node):
              for item in node:
                  if isinstance(item, unittest.TestSuite):
                      yield from cases(item)
                  else:
                      yield item.id()
          ids = list(cases(suite))
          if len(ids) != 17 or len(set(ids)) != 17:
              raise RuntimeError("expected_exactly_seventeen_distinct_nsis_source_tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          after = source()
          record = {
              "schema": "motionwright.nsis-source-tests/1", "platform": sys.platform,
              "source_before": before, "source_after": after, "test_ids": ids,
              "tests": result.testsRun, "failures": len(result.failures), "errors": len(result.errors),
              "skips": [{"id": case.id(), "reason": reason} for case, reason in result.skipped],
              "unexpected_successes": len(result.unexpectedSuccesses),
              "expected_failures": len(result.expectedFailures),
              "nsis_compilation": "NOT_RUN", "installer_execution": "NOT_RUN",
              "human_install_acceptance": "NOT_RUN",
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "mw-nsis-linux-source-tests/receipt.json"
          output.parent.mkdir(exist_ok=True)
          with output.open("x", encoding="utf-8", newline="\n") as stream:
              json.dump(record, stream, indent=2, sort_keys=True)
              stream.write("\n")
          ok = (sys.platform.startswith("linux") and before == after and result.wasSuccessful()
                and result.testsRun == 17 and not result.skipped
                and not result.expectedFailures and not result.unexpectedSuccesses)
          print("nsis-linux-source-tests=" + ("PASS" if ok else "FAIL") + " required=17 skips=0")
          raise SystemExit(0 if ok else 1)
          PY
      - name: Require forty lifecycle contracts through both existing runner entrypoints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          ROOT = Path(os.environ["GITHUB_WORKSPACE"])
          sys.path.insert(0, str(ROOT / "tooling"))
          from release_manifest import write_new_manifest
          from windows_installer_lifecycle import require, source_observation

          SOURCE = os.environ["GITHUB_SHA"]
          before = source_observation(ROOT, SOURCE)
          output = Path(os.environ["RUNNER_TEMP"]) / "motionwright-nsis-lifecycle-contracts"
          output.mkdir(parents=True)
          report = output / "receipt.json"
          completed = subprocess.run([
              sys.executable, "-B", "-I", "-S", "tooling/ci_test_runner.py",
              "--repo", str(ROOT), "--test-directory", "tooling/tests",
              "--pattern", "test_windows_installer_lifecycle.py", "--mode", "both",
              "--report", str(report), "--expected-source", SOURCE,
              "--require-complete", "--timeout", "180"], cwd=ROOT, check=False)
          require(completed.returncode == 0, "lifecycle_contract_runner_failed")
          receipt = json.loads(report.read_bytes())
          test_path = "tooling/tests/test_windows_installer_lifecycle.py"
          tree = ast.parse((ROOT / test_path).read_bytes())
          classes = [item for item in tree.body if isinstance(item, ast.ClassDef)
                     and any(isinstance(method, ast.FunctionDef) and method.name.startswith("test_")
                             for method in item.body)]
          expected_classes = {"WindowsLifecycleTests": 52, "UninstallTemplateFlowTests": 18,
                              "StorageCohortLifecycleTests": 8}
          require({item.name for item in classes} == set(expected_classes)
                  and len(classes) == len(expected_classes), "lifecycle_contract_class_count")
          methods = [f"{item.name}.{method.name}" for item in classes for method in item.body
                     if isinstance(method, ast.FunctionDef) and method.name.startswith("test_")]
          all_methods = [item.name for item in ast.walk(tree)
                         if isinstance(item, (ast.FunctionDef, ast.AsyncFunctionDef))
                         and item.name.startswith("test_")]
          require(all(sum(isinstance(method, ast.FunctionDef) and method.name.startswith("test_")
                          for method in item.body) == expected_classes[item.name] for item in classes)
                  and len(methods) == len(set(methods)) == len(all_methods) == 78
                  and not any(isinstance(item, (ast.FunctionDef, ast.AsyncFunctionDef))
                              and item.name == "load_tests" for item in ast.walk(tree)),
                  "lifecycle_contract_inventory_changed")
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          entries = ["discovery:test_windows_installer_lifecycle.py",
                     "dotted:tooling.tests.test_windows_installer_lifecycle"]
          require(receipt.get("status") == "PASS" and receipt.get("exit_code") == 0
                  and receipt.get("require_complete") is True
                  and receipt.get("executed_source_sha") == SOURCE
                  and receipt.get("tree_sha") == before["tree"]
                  and not receipt.get("source_postcheck_error")
                  and [step.get("entry_point") for step in receipt.get("steps", [])] == entries
                  and receipt.get("test_definition_sha256") == {test_path: digest(ROOT / test_path)}
                  and receipt.get("runner_sha256") == digest(ROOT / "tooling/ci_test_runner.py"),
                  "lifecycle_contract_receipt_identity")
          for key in ("GITHUB_SHA", "GITHUB_WORKFLOW_REF", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_JOB"):
              require(receipt.get("github", {}).get(key) == os.environ[key],
                      "lifecycle_contract_receipt_job")
          inventory = {}
          for index, step in enumerate(receipt["steps"]):
              counts = step.get("counts", {})
              require(step.get("status") == "PASS" and step.get("exit_code") == 0
                      and counts.get("terminal_status") == "OK"
                      and type(counts.get("tests_run")) is int and counts["tests_run"] == 78
                      and type(counts.get("passed")) is int and counts["passed"] == 78
                      and all(type(counts.get(key)) is int and counts[key] == 0 for key in
                              ("failures", "errors", "skipped", "expected_failures", "unexpected_successes")),
                      "lifecycle_contract_omission")
              for stream in ("stdout", "stderr"):
                  path = report.with_name(f"{report.stem}-{index:02d}-{stream}.log")
                  require(step.get(stream) == {"file": path.name, "sha256": digest(path)},
                          "lifecycle_contract_log_binding")
              raw = report.with_name(f"{report.stem}-{index:02d}-stderr.log").read_text(encoding="utf-8")
              observed = re.findall(r"(?m)^test_\w+ \(([^()\n]+)\) \.\.\. ok$", raw.replace("\r\n", "\n"))
              module = "test_windows_installer_lifecycle" if index == 0 else "tooling.tests.test_windows_installer_lifecycle"
              expected = {f"{module}.{method}" for method in methods}
              require(len(observed) == 78 and set(observed) == expected,
                      "lifecycle_contract_original_names")
              inventory[step["entry_point"]] = sorted(observed)
          after = source_observation(ROOT, SOURCE)
          require(after == before, "lifecycle_contract_source_changed")
          write_new_manifest(ROOT, output / "readback.json", {
              "schema": "motionwright.windows-lifecycle-contracts/1", "platform": sys.platform,
              "source_before": before, "source_after": after, "receipt_sha256": digest(report),
              "github": receipt["github"], "entrypoint_methods": inventory,
              "unique_controls": 78, "entrypoints": 2, "skipped": 0,
              "scope": "OFFLINE_CONTRACTS_AND_TEMPORARY_SQLITE_ONLY",
              "PE_native_version_observation": "NOT_RUN", "installer_execution": "NOT_RUN",
              "human_acceptance": "NOT_RUN", "release_published": False})
          PY
      - name: Retain exact lifecycle contract receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-nsis-lifecycle-contracts-linux
          path: ${{ runner.temp }}/motionwright-nsis-lifecycle-contracts/*
          if-no-files-found: warn
      - name: Retain the exact Linux NSIS source-test result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-nsis-linux-source-tests
          path: ${{ runner.temp }}/mw-nsis-linux-source-tests/receipt.json
          if-no-files-found: warn

  nsis-source-windows:
    needs: receipt-policy
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.16'
      - name: Require all seventeen NSIS helper tests on Windows without skips
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import unittest

          ROOT = Path(os.environ["GITHUB_WORKSPACE"])
          sys.path.insert(0, str(ROOT / "tooling"))
          from package_receipt import verified_artifact
          from release_manifest import _checkout

          SOURCE = os.environ["GITHUB_SHA"]
          PATHS = ("tooling/nsis_owned_files.py", "tooling/tests/test_nsis_owned_files.py",
                   "apps/desktop/src-tauri/windows/installer.nsi",
                   "apps/desktop/src-tauri/windows/uninstall-ownership.nsh")
          def source():
              _checkout(ROOT, SOURCE)
              subprocess.run(["git", "ls-files", "--error-unmatch", "--", *PATHS],
                             cwd=ROOT, check=True, capture_output=True, timeout=10)
              files = {}
              for path in PATHS:
                  observed, size, digest = verified_artifact(ROOT, ROOT / path)
                  files[path] = {"bytes": size, "sha256": digest}
              tree = subprocess.run(["git", "rev-parse", "HEAD^{tree}"], cwd=ROOT, check=True,
                                    capture_output=True, text=True).stdout.strip()
              return {"checkout": SOURCE, "tree": tree, "files": files}

          before = source()
          runtime = Path(os.environ["RUNNER_TEMP"]) / "mw-nsis-windows-source-tests"
          runtime.mkdir()
          os.environ["MOTIONWRIGHT_TEST_ROOT"] = str(runtime)
          suite = unittest.defaultTestLoader.discover("tooling/tests", pattern="test_nsis_owned_files.py")
          def cases(node):
              for item in node:
                  if isinstance(item, unittest.TestSuite):
                      yield from cases(item)
                  else:
                      yield item.id()
          ids = list(cases(suite))
          if len(ids) != 17 or len(set(ids)) != 17:
              raise RuntimeError("expected_exactly_seventeen_distinct_nsis_source_tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          after = source()
          record = {
              "schema": "motionwright.nsis-source-tests/1", "platform": sys.platform,
              "python_version": sys.version,
              "source_before": before, "source_after": after, "test_ids": ids,
              "tests": result.testsRun, "failures": len(result.failures), "errors": len(result.errors),
              "skips": [{"id": case.id(), "reason": reason} for case, reason in result.skipped],
              "unexpected_successes": len(result.unexpectedSuccesses),
              "expected_failures": len(result.expectedFailures),
              "nsis_compilation": "NOT_RUN", "installer_execution": "NOT_RUN",
              "human_install_acceptance": "NOT_RUN",
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "mw-nsis-windows-source-tests/receipt.json"
          output.parent.mkdir(exist_ok=True)
          with output.open("x", encoding="utf-8", newline="\n") as stream:
              json.dump(record, stream, indent=2, sort_keys=True)
              stream.write("\n")
          ok = (sys.platform == "win32" and before == after and result.wasSuccessful()
                and result.testsRun == 17 and not result.skipped
                and not result.expectedFailures and not result.unexpectedSuccesses)
          print("nsis-windows-source-tests=" + ("PASS" if ok else "FAIL") + " required=17 skips=0")
          raise SystemExit(0 if ok else 1)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'The Windows source-bound NSIS gate failed' }
      - name: Require forty lifecycle contracts through both existing runner entrypoints
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import ast
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          ROOT = Path(os.environ["GITHUB_WORKSPACE"])
          sys.path.insert(0, str(ROOT / "tooling"))
          from release_manifest import write_new_manifest
          from windows_installer_lifecycle import require, source_observation

          SOURCE = os.environ["GITHUB_SHA"]

                  acquire_previous_self_lock(DEST / "uninstall.exe", previous_self)
                  STATE["stage"] = "one_update_attempt_with_the_owned_lock"
                  installer_action("update-with-owned-lock", current_setup, compiled["setup"], 2)
                  STATE["owned_lock_after_first_exit"] = observe_lock()
                  partial_files = {**current_payloads, "uninstall.exe": previous_self, FOREIGN_NAME: foreign}
                  STATE["known_partial_tree"] = exact_tree(partial_files)
                  partial = seal_project("after-known-refusal", DATABASE, project)
                  require(content_manifest(partial) == content_manifest(BASELINE),
                          "closed_project_family_changed_during_the_known_refusal")
                  STATE["stage"] = "close_only_the_owned_lock"
                  close_owned_lock()
                  require(STATE["actions"][-1]["label"] == "update-with-owned-lock"
                          and STATE["actions"][-1]["status"] == "KNOWN_EXPECTED_EXIT"
                          and STATE["actions"][-1]["native_exit_code"] == 2
                          and STATE["owned_lock_closed"]["status"] == "OWNED_HANDLE_CLOSED"
                          and not STATE["unknown_outcome"],
                          "known_refusal_and_lock_close_are_required_before_recovery")
                  require(exact_tree(partial_files) == STATE["known_partial_tree"],
                          "partial_state_changed_before_explicit_recovery")
                  STATE["stage"] = "one_explicit_recovery_after_the_known_exit"
                  installer_action("reconcile-known-partial-state", current_setup, compiled["setup"], 0)
              else:
                  STATE["stage"] = "one_clean_update"
                  installer_action("clean-update", current_setup, compiled["setup"], 0)

              current_self = identity(DEST / "uninstall.exe")
              require(128 <= current_self["bytes"] <= 4 * 1024 * 1024
                      and current_self != previous_self,
                      "completed_update_did_not_publish_a_distinct_observed_self")
              completed_files = {**current_payloads, "uninstall.exe": current_self, FOREIGN_NAME: foreign}
              STATE["completed_installed_tree"] = exact_tree(completed_files)
              completed = seal_project("after-complete-update", DATABASE, project)
              require(content_manifest(completed) == content_manifest(BASELINE),
                      "closed_project_family_changed_across_update")
              STATE["stage"] = "reopen_previous_project_with_the_current_real_application"
              reopened, reopened_path = boot_project(
                  "current-real-project", DEST / "motionwright-desktop.exe",
                  current_payloads["motionwright-desktop.exe"], SOURCE, roots, expected_db=DATABASE,
              )
              require(reopened_path == DATABASE and reopened == project,
                      "updated_application_replaced_the_original_project")
              reopened_snapshot = seal_project("after-current-reopen", DATABASE, project)
              require(exact_tree(completed_files) == STATE["completed_installed_tree"],
                      "installed_payloads_changed_during_project_reopen")
              STATE["stage"] = "repeat_current_setup_after_a_known_complete_update_and_closed_app"
              require(not STATE["unknown_outcome"], "unknown_outcome_vetoes_the_explicit_repeat")
              installer_action("repeat-current-setup", current_setup, compiled["setup"], 0)
              STATE["repeated_installed_tree"] = exact_tree(completed_files)
              repeated_snapshot = seal_project("after-current-repeat", DATABASE, project)
              require(content_manifest(repeated_snapshot) == content_manifest(reopened_snapshot),
                      "closed_project_family_changed_during_current_setup_repeat")
              retained_self = EVIDENCE / "windows-nsis-update-installed-self.exe"
              self_before = token(DEST / "uninstall.exe")
              digest, size, _ = owned._capture(DEST / "uninstall.exe", retained_self)
              require({"bytes": size, "sha256": digest} == current_self
                      and identity(retained_self) == current_self
                      and token(DEST / "uninstall.exe") == self_before,
                      "current_self_custody_changed")
              STATE["installed_self_custody"] = {
                  "artifact": retained_self.name, **current_self,
                  "capture_phase": "after_known_complete_update_and_successful_explicit_repeat",
                  "execution": "NOT_RUN", "staged_self_hash_readback_from_runtime_guard": "NOT_EXPOSED",
              }
              assert_inputs()
              STATE["case_results"] = {
                  "clean_update_without_injected_lock": "PASS" if MODE == "clean_update" else "NOT_RUN",
                  "known_exit_two_with_current_payloads_and_original_self":
                      "PASS" if MODE == "post_main_recovery" else "NOT_RUN",
                  "explicit_recovery_after_known_exit_and_owned_handle_close":
                      "PASS" if MODE == "post_main_recovery" else "NOT_RUN",
                  "whole_closed_SQLite_family_byte_preservation_across_installer_actions": "PASS",
                  "old_project_generation_revision_and_document_reopened_by_new_application": "PASS",
                  "explicit_current_setup_repeat_after_known_complete_state": "PASS",
                  "unrelated_fixture_file_preservation": "PASS",
                  "per_user_target_with_no_elevation_request_from_this_gate": "OBSERVED",
                  "standard_nonadministrator_token_installation": "NOT_EXERCISED",
                  "version_number_upgrade": "NOT_EXERCISED_SAME_VERSION_DIFFERENT_SOURCES",
                  "mid_File_interruption_or_unknown_outcome_recovery": "NOT_EXERCISED",
                  "human_acceptance": "NOT_RUN",
              }
              STATE["stage"] = "source_and_input_finalization"
              STATE["status"] = "PASS"

          exit_status = 0
          try:
              run_observation()
          except BaseException as error:
              exit_status = 1
              STATE["status"] = "NOT_VERIFIED" if STATE["unknown_outcome"] else "FAIL"
              STATE["primary_failure"] = {
                  "stage": STATE["stage"],
                  "reason": str(error) if isinstance(error, GateError) else type(error).__name__,
              }
          finally:
              # Cleanup is restricted to the handle owned by this Python invocation.
              # It never retries an installer, closes another process's handle, removes
              # destination files, rolls back registry, or erases a partial capture.
              if LOCK is not None and LOCK["fd"] is not None:
                  fd = LOCK["fd"]
                  handle = LOCK["handle"]
                  LOCK["fd"] = None
                  cleanup = {"operation": "close_only_own_remaining_lock_descriptor",
                             "owner_pid": os.getpid(), "handle": handle,
                             "native_success_inferred": False}
                  try:
                      os.close(fd)
                      flags = wintypes.DWORD()
                      ctypes.set_last_error(0)
                      valid = bool(KERNEL.GetHandleInformation(handle, ctypes.byref(flags)))
                      last_error = ctypes.get_last_error()
                      cleanup.update({"handle_still_valid": valid, "GetLastError": last_error})
                      require(not valid and last_error == 6, "cleanup_lock_close_not_verified")
                  except BaseException as error:
                      cleanup["error_type"] = type(error).__name__
                      STATE["unknown_outcome"] = True
                      exit_status = 1
                  STATE["cleanup"].append(cleanup)
              if exit_status and DATABASE is not None and BASELINE is not None and not STATE["unknown_outcome"]:
                  try:
                      seal_project("known-failure-final", DATABASE, BASELINE["project"])
                  except BaseException as error:
                      STATE["cleanup"].append({"final_project_capture_error": type(error).__name__})
              try:
                  if STATE["source_before"] is not None:
                      STATE["source_after"] = source_observation()
                      require(STATE["source_after"] == STATE["source_before"],
                              "source_changed_across_update_observation")
                      STATE["source_binding"] = "VERIFIED"
                  if PINNED:
                      STATE["input_after"] = inputs_observation()
                      assert_inputs()
                      require(STATE["input_after"] == STATE["input_before"],
                              "input_changed_across_update_observation")
              except BaseException as error:
                  STATE["source_binding"] = "NOT_VERIFIED"
                  STATE["finalization_failure"] = (
                      str(error) if isinstance(error, GateError) else type(error).__name__)
                  exit_status = 1
              if exit_status:
                  STATE["status"] = "NOT_VERIFIED" if STATE["unknown_outcome"] else "FAIL"
              try:
                  write_new(PROOF, STATE)
              except BaseException as error:
                  exit_status = 1
                  print("nsis-update-observation=NOT_VERIFIED receipt=" + type(error).__name__
                        + " human=NOT_RUN", file=sys.stderr)
          if exit_status:
              print("nsis-update-observation=" + STATE["status"] + " stage=" + STATE["stage"]
                    + " automatic_retry=false human=NOT_RUN", file=sys.stderr)
              raise SystemExit(1)
          print("nsis-update-observation=PASS mode=" + MODE
                + " source=" + SOURCE + " closed_project_custody=REOPENED"
                + " uninstaller_execution=NOT_RUN human=NOT_RUN")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'The actual NSIS update observation did not pass' }
      - name: Retain complete or partial Project custody and bounded update observations
        if: always() && github.event_name == 'workflow_dispatch' && inputs.nsis_update_probe != 'compile_only'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-windows-nsis-update-${{ inputs.nsis_update_probe }}
          path: |
            ci-evidence/windows-nsis-update-observation.json
            ci-evidence/windows-nsis-update-actions/*.json
            ci-evidence/windows-nsis-update-project-custody/**
            ci-evidence/windows-nsis-update-installed-self.exe
            ci-evidence/windows-nsis-cold-relaunch-diagnostic.json
          if-no-files-found: warn
      - name: Retain available compiler gate receipts after failure or cancellation
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-windows-nsis-render-diagnostics
          path: |
            ci-evidence/windows-nsis-update-*.json
            ci-evidence/windows-nsis-update-original-compiled/*
            ci-evidence/nsis-windows-junction-test.json
            ci-evidence/windows-nsis-update-source-tests.log
          if-no-files-found: warn

  macos:
    if: github.event_name != 'workflow_dispatch' || !inputs.nsis_update_fixture
    needs: receipt-policy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: false
      - name: Install locked Studio and Tauri CLI dependencies
        run: npm --prefix apps/studio ci --no-audit --no-fund
      - name: Build unsigned macOS DMG candidate
        run: |
          cd apps/desktop
          npm --prefix ../studio exec -- tauri build --bundles dmg
      - name: Record exact macOS candidate artifact
        run: |
          dmg_count="$(find target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' | wc -l)"
          test "$dmg_count" -eq 1
          dmg="$(find target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print)"
          arch="$(uname -m)"
          python3 tooling/package_receipt.py \
            --git-sha "$GITHUB_SHA" \
            --platform macos \
            --arch "$arch" \
            --artifact "$dmg" \
            --output ci-evidence/macos-candidate.json
      - name: Read-only DMG mount, copy application and inspect macOS Mach-O
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          dmg="$(find target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          work="$RUNNER_TEMP/motionwright-macos-smoke"
          mkdir -p "$work/mount" "$work/installed"
          hdiutil attach -readonly -nobrowse -mountpoint "$work/mount" "$dmg" >/dev/null
          trap 'hdiutil detach "$work/mount" -quiet || true' EXIT
          app_count="$(find "$work/mount" -maxdepth 1 -type d -name '*.app' | wc -l)"
          test "$app_count" -eq 1
          app="$(find "$work/mount" -maxdepth 1 -type d -name '*.app' -print -quit)"
          ditto "$app" "$work/installed/Motionwright.app"
          plist="$work/installed/Motionwright.app/Contents/Info.plist"
          test -f "$plist"
          exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          binary="$work/installed/Motionwright.app/Contents/MacOS/$exe"
          test -f "$binary"
          python3 tooling/candidate_smoke.py \
            --candidate-receipt ci-evidence/macos-candidate.json \
            --expected-source-sha "$GITHUB_SHA" \
            --kind dmg --method dmg_readonly_mount_copy \
            --artifact "$dmg" --installed-binary "$binary" \
            --mac-info-plist "$plist" \
            --output ci-evidence/macos-dmg-smoke.json
          # No unsigned application is force-launched and no Gatekeeper,
          # signing, notarization or user-level protection is disabled.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-macos-candidate
          path: |
            target/release/bundle/dmg/*.dmg
            ci-evidence/macos-candidate.json
            ci-evidence/macos-dmg-smoke.json
          if-no-files-found: error

  # Keep OIDC/Sigstore/attestation write permissions in this dedicated job.
  # The three package-build jobs continue to have contents:read only.
  # Ordinary PRs cannot mint trusted candidate provenance: source checks run
  # on PRs, while this job is NOT_RUN until trusted dispatch or main push.
  attest-candidates:
    name: Candidate GH provenance (trusted runs only)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: motionwright-linux-candidate
          path: candidates/linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: motionwright-windows-candidate
          path: candidates/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: motionwright-macos-candidate
          path: candidates/macos
      - name: Verify all four downloaded packages match unsigned source-bound receipts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/motionwright-provenance"
          python3 -m unittest discover -s tooling/tests -p test_candidate_attestation_input.py -v
          python3 tooling/candidate_attestation_input.py \
            --source-sha "$GITHUB_SHA" \
            --download-root "$GITHUB_WORKSPACE/candidates" \
            --output-dir "$RUNNER_TEMP/motionwright-provenance"
          test "$(wc -l < "$RUNNER_TEMP/motionwright-provenance/verified-subject-paths.txt")" -eq 4
      # A GitHub workflow attestation is NOT an Authenticode signature, Apple
      # Developer signature/notarization, human approval or a release gate.
      - name: Attest exact candidate package bytes through GitHub Sigstore
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            candidates/linux/**/*.AppImage
            candidates/linux/**/*.deb
            candidates/windows/**/*-setup.exe
            candidates/macos/**/*.dmg
      - name: Independently verify each of the four signed candidate digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r subject; do
            test -f "$subject"
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/package-candidate.yml" \
              --source-digest "$GITHUB_SHA" >/dev/null
            count=$((count+1))
          done < "$RUNNER_TEMP/motionwright-provenance/verified-subject-paths.txt"
          test "$count" -eq 4
          echo "v01-candidate-gh-attestation=VERIFIED subjects=4 unsigned_installers=YES human_acceptance=NOT_RUN release=BLOCKED"
      # Exercise the identical read-only pre-install verification contract
      # an owner can run, on an ACTUAL downloaded NSIS installer + GH signature.
      # This is CI technical evidence, NOT an owner-installed/human PASS.
      - name: Verify actual candidate using owner-side provenance CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t installers < <(find candidates/windows -type f -name '*-setup.exe')
          test "${#installers[@]}" -eq 1
          test -f "$GITHUB_WORKSPACE/candidates/windows/ci-evidence/windows-candidate.json"
          python3 tooling/owner_candidate_provenance.py \
            --source-sha "$GITHUB_SHA" \
            --bundle-kind nsis \
            --artifact "$GITHUB_WORKSPACE/${installers[0]}" \
            --candidate-receipt "$GITHUB_WORKSPACE/candidates/windows/ci-evidence/windows-candidate.json" \
            --output "$RUNNER_TEMP/motionwright-provenance/ci-preinstall-provenance.json"
          python3 -m json.tool "$RUNNER_TEMP/motionwright-provenance/ci-preinstall-provenance.json" >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-v01-candidate-provenance-inputs
          path: |
            ${{ runner.temp }}/motionwright-provenance/verified-candidate-inputs.json
            ${{ runner.temp }}/motionwright-provenance/ci-preinstall-provenance.json
          if-no-files-found: error

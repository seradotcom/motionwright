                  return result
              except BaseException as error:
                  try:
                      write_new(folder / "capture-failure.json", {
                          "schema": "motionwright-windows-update-project-capture-failure/1",
                          "source_sha": SOURCE, "label": label,
                          "status": "NOT_VERIFIED", "completed_copies": members,
                          "reason": str(error) if isinstance(error, GateError) else type(error).__name__,
                          "partial_copies_preserved": True, "human_acceptance": "NOT_RUN",
                      })
                  except BaseException as report_error:
                      STATE["cleanup"].append({"capture": label, "failure_record": type(report_error).__name__})
                  raise

          def installer_action(label, executable, expected_identity, expected_exit):
              require(not STATE["unknown_outcome"], "a_prior_unknown_outcome_vetoes_another_execution")
              require(re.fullmatch(r"[a-z0-9-]+", label) is not None, "action_label_invalid")
              assert_inputs()
              require(identity(executable) == expected_identity, "installer_bytes_changed_before_execution")
              require(not any(char in str(DEST) for char in '\r\n"'),
                      "installer_destination_command_spelling_invalid")
              command = subprocess.list2cmdline([str(executable)]) + " /S /D=" + str(DEST)
              record = {
                  "label": label, "kind": "NSIS_INSTALLER", "status": "PENDING",
                  "producer_source_sha": SOURCE, "installer": expected_identity,
                  "installer_token_before": token(executable),
                  "destination_scope": "this_case_new_runner_temp_installed_directory",
                  "arguments": ["/S", "/D=<case-installed-directory>"],
                  "command_sha256": hashlib.sha256(command.encode("utf-16-le")).hexdigest(),
                  "expected_native_exit": expected_exit,
                  "native_exit_code": None, "pid": None,
                  "attempt_count": 1, "automatic_retry": False,
              }
              STATE["actions"].append(record)
              action_dir = EVIDENCE / "windows-nsis-update-actions"
              write_new(action_dir / (label + "-intent.json"), record)
              process = None
              outcome_error = None
              publication_errors = []
              started = time.monotonic_ns()
              log_path = CASE / (label + ".native.log")
              try:
                  with log_path.open("xb") as log:
                      try:
                          process = subprocess.Popen(
                              command, executable=str(executable), cwd=executable.parent,
                              env=CHILD_ENV, stdin=subprocess.DEVNULL,
                              stdout=log, stderr=subprocess.STDOUT, close_fds=True,
                              creationflags=getattr(subprocess, "CREATE_NEW_PROCESS_GROUP", 0),
                          )
                      except BaseException as error:
                          STATE["unknown_outcome"] = True
                          record["status"] = "UNKNOWN_SPAWN_OUTCOME"
                          record["exception_type"] = type(error).__name__
                          outcome_error = "installer_spawn_outcome_unknown"
                      if process is not None:
                          record["pid"] = process.pid
                          record["status"] = "STARTED"
                          try:
                              write_new(action_dir / (label + "-started.json"), record)
                          except BaseException as error:
                              publication_errors.append(type(error).__name__)
                          try:
                              result = process.wait(timeout=360)
                              record["native_exit_code"] = result
                              record["status"] = ("KNOWN_EXPECTED_EXIT" if result == expected_exit
                                                  else "KNOWN_UNEXPECTED_EXIT")
                              if result != expected_exit:
                                  outcome_error = "installer_returned_an_unexpected_known_exit"
                          except BaseException as error:
                              STATE["unknown_outcome"] = True
                              record["status"] = "UNKNOWN_NATIVE_OUTCOME"
                              record["wait_exception_type"] = type(error).__name__
                              outcome_error = "installer_native_outcome_unknown"
                          finally:
                              if process.poll() is None:
                                  STATE["unknown_outcome"] = True
                                  record["status"] = "UNKNOWN_NATIVE_OUTCOME"
                                  cleanup = {"action": label, "own_pid": process.pid,
                                             "operation": "kill_only_this_owned_popen",
                                             "native_success_inferred": False}
                                  try:
                                      process.kill()
                                      cleanup["observed_cleanup_exit"] = process.wait(timeout=12)
                                  except BaseException as error:
                                      cleanup["error_type"] = type(error).__name__
                                  STATE["cleanup"].append(cleanup)
                                  outcome_error = "installer_native_outcome_unknown"
                      log.flush()
                      os.fsync(log.fileno())
              finally:
                  record["elapsed_ns"] = time.monotonic_ns() - started
                  record["outcome_publication_errors"] = publication_errors
                  try:
                      record["installer_after"] = identity(executable)
                      record["installer_token_after"] = token(executable)
                      require(record["installer_after"] == expected_identity
                              and record["installer_token_after"] == record["installer_token_before"],
                              "installer_source_changed_across_execution")
                  except BaseException as error:
                      record["source_readback_error_type"] = type(error).__name__
                      outcome_error = outcome_error or "installer_source_not_stable_after_execution"
                  try:
                      write_new(action_dir / (label + "-outcome.json"), record)
                  except BaseException as error:
                      publication_errors.append(type(error).__name__)
                      outcome_error = outcome_error or "installer_outcome_receipt_not_durable"
              require(not publication_errors, "installer_action_receipt_was_not_durable")
              require(outcome_error is None and not STATE["unknown_outcome"],
                      outcome_error or "installer_native_outcome_unknown")
              assert_inputs()
              return record

          def boot_project(label, executable, expected_binary, source_sha, roots, expected_db=None):
              require(not STATE["unknown_outcome"], "a_prior_unknown_outcome_vetoes_application_launch")
              require(identity(executable) == expected_binary, "installed_main_changed_before_launch")
              pe = binary_identity(executable, "windows", "x86_64")
              require(pe["binary_bytes"] == expected_binary["bytes"]
                      and pe["binary_sha256"] == expected_binary["sha256"]

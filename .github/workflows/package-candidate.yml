                  check=False, stdout=subprocess.PIPE, stderr=error_log, timeout=45, env=CHILD_ENV)
          require(extraction.returncode == 0, "predecessor_static_extraction_failed")
          require(len(extraction.stdout) == FIXED["main"]["bytes"]
                  and hashlib.sha256(extraction.stdout).hexdigest() == FIXED["main"]["sha256"],
                  "predecessor_main_differs_from_literal_pin")
          write_new(INPUT / "previous-main.exe", extraction.stdout)
          require(identity(seven) == seven_before, "static_extraction_tool_changed")

          config = json.loads(source_bytes("apps/desktop/src-tauri/tauri.conf.json"))
          version_overlay_path = ROOT / "ci-evidence/windows-nsis-update-version-overlay.json"
          version_overlay_identity = identity(version_overlay_path)
          version_overlay = json.loads(version_overlay_path.read_bytes())
          require(version_overlay == {"version": "0.1.1"}
                  and config["version"] == "0.1.0", "fixture_version_overlay_invalid")
          fixture_version = version_overlay["version"]

          windows = config["bundle"]["windows"]
          require(config["productName"] == "Motionwright" and config["identifier"] == "com.seradotcom.motionwright"
                  and config.get("mainBinaryName", "motionwright-desktop") == "motionwright-desktop"
                  and not windows.get("certificateThumbprint") and not windows.get("signCommand")
                  and not config["bundle"].get("createUpdaterArtifacts"),
                  "guarded_update_fixture_requires_the_unsigned_single_nsis_profile")
          require(windows["nsis"]["installMode"] == "currentUser"
                  and windows["nsis"]["template"] == "windows/installer.nsi"
                  and windows["nsis"]["installerHooks"] == "windows/uninstall-ownership.nsh",
                  "guarded_update_template_not_configured")
          main = ROOT / "target/release/motionwright-desktop.exe"
          main_before = identity(main)
          require(main_before["sha256"] != FIXED["main"]["sha256"], "new_main_is_not_a_distinct_build")
          previous_pe = read_pe_versions(INPUT / "previous-main.exe")
          current_pe = read_pe_versions(main)
          require_pe_version(previous_pe, "0.1.0", identity(INPUT / "previous-main.exe"))
          require_pe_version(current_pe, fixture_version, main_before)

          require(not config["bundle"].get("externalBin") and not config["bundle"].get("resources"),
                  "the_render_fixture_must_not_replace_configured_application_payloads")
          fixture = WORK / "render-inputs"
          fixture.mkdir()
          resource_inputs = {}
          expected_fixture = {}
          for name, body in (("resource-alpha.dat", b"Motionwright NSIS render input alpha\n"),
                             ("resource-beta.dat", b"Motionwright NSIS render input beta: distinct bytes\n")):
              resource = fixture / name
              write_new(resource, body)
              target = "mw-ci-render/" + name
              resource_inputs[str(resource)] = target
              expected_fixture[target] = {"kind": "resource", **identity(resource)}
          external_inputs = []
          for stem, binary_source in (("mw-ci-current-sidecar", main),
                                      ("mw-ci-previous-sidecar", INPUT / "previous-main.exe")):
              sidecar = fixture / (stem + "-x86_64-pc-windows-msvc.exe")
              digest, size, captured = _capture(binary_source, sidecar)
              expected_fixture[stem + ".exe"] = {
                  "kind": "external_binary", "bytes": size, "sha256": digest}
              require(identity(sidecar) == {"bytes": size, "sha256": digest},
                      "sidecar_capture_changed")
              external_inputs.append(str(fixture / stem))
          require(expected_fixture["mw-ci-current-sidecar.exe"]["sha256"]
                  != expected_fixture["mw-ci-previous-sidecar.exe"]["sha256"],
                  "the_two_render_sidecars_need_distinct_literal_bytes")
          overlay = {"version": fixture_version, "bundle": {"resources": resource_inputs, "externalBin": external_inputs}}
          overlay_path = INPUT / "render-overlay.json"
          overlay_raw = (json.dumps(overlay, indent=2, sort_keys=True) + "\n").encode("utf-8")
          write_new(overlay_path, overlay_raw)
          overlay_identity = identity(overlay_path)
          require(identity(main) == main_before, "new_main_changed_during_fixture_preparation")

          cli_root = ROOT / "apps/studio/node_modules/@tauri-apps"
          cli_package = json.loads((cli_root / "cli/package.json").read_text(encoding="utf-8"))
          require(cli_package["version"] == "2.12.1", "installed_cli_is_not_the_reviewed_version")
          cli_inputs = {}
          for name in ("cli/package.json", "cli/tauri.js", "cli-win32-x64-msvc/package.json",
                       "cli-win32-x64-msvc/cli.win32-x64-msvc.node"):
              cli_inputs[name] = identity(cli_root / name)
          node = Path(shutil.which("node.exe") or "")
          node_identity = identity(node)
          tool_runs = []
          for label, arguments in (("version", ["--version"]), ("bundle-help", ["bundle", "--help"])):
              run = subprocess.run([str(node), str(cli_root / "cli/tauri.js"), *arguments],
                                   cwd=ROOT / "apps/desktop", env=CHILD_ENV,
                                   capture_output=True, timeout=20, check=False)
              require(run.returncode == 0 and len(run.stdout) <= 128 * 1024
                      and len(run.stderr) <= 128 * 1024, "installed_cli_probe_failed")
              write_new(WORK / ("cli-" + label + ".stdout"), run.stdout)
              write_new(WORK / ("cli-" + label + ".stderr"), run.stderr)
              text = run.stdout.decode("utf-8")
              if label == "version":
                  require(text.strip() == "tauri-cli 2.12.1", "installed_cli_version_output_mismatch")
              else:
                  require("--no-binary-patching" in text and "--bundles" in text,
                          "installed_cli_does_not_offer_the_reviewed_bundle_option")
              tool_runs.append({"label": label, "exit_code": run.returncode,
                                "stdout_sha256": hashlib.sha256(run.stdout).hexdigest(),
                                "stderr_sha256": hashlib.sha256(run.stderr).hexdigest()})
          require(identity(node) == node_identity
                  and all(identity(cli_root / name) == value for name, value in cli_inputs.items()),
                  "installed_cli_bytes_changed_during_probe")
          profile = {
              "schema": "motionwright.nsis-predecessor/1",
              "identity": {"application": "Motionwright", "bundle_id": config["identifier"], "arch": "x64"},
              "version": "0.1.0", "source_sha": FIXED["source"], "source_tree": FIXED["tree"],
              "target": {"version": fixture_version, "main_sha256": main_before["sha256"]},
              "package": {"path": "previous-setup.exe", "bytes": FIXED["package"]["bytes"],
                          "sha256": FIXED["package"]["sha256"]},
              "capture_receipt": {"path": "previous-capture-receipt.json", "bytes": FIXED["receipt"]["bytes"],
                                  "sha256": FIXED["receipt"]["sha256"]},
              "files": [
                  {"relative": "motionwright-desktop.exe", "source": "previous-main.exe", "kind": "main",
                   "bytes": FIXED["main"]["bytes"], "sha256": FIXED["main"]["sha256"]},
                  {"relative": "uninstall.exe", "source": "previous-uninstall.exe", "kind": "uninstaller",
                   "bytes": FIXED["self"]["bytes"], "sha256": FIXED["self"]["sha256"]},
              ],
          }
          raw = (json.dumps(profile, indent=2, sort_keys=True) + "\n").encode("utf-8")
          profile_path = INPUT / "predecessor.json"
          write_new(profile_path, raw)
          profile_sha = hashlib.sha256(raw).hexdigest()
          probe = WORK / "profile-probe"
          probe.mkdir()
          admitted = emit_predecessor_include(
              probe / "mw-predecessor.nsh", application="Motionwright",
              bundle_id=config["identifier"], arch="x64", target_version=fixture_version,
              target_main_sha256=main_before["sha256"],
              environment={"MW_NSIS_PREDECESSOR_MANIFEST": str(profile_path),
                           "MW_NSIS_PREDECESSOR_MANIFEST_SHA256": profile_sha})
          require(admitted == {"enabled": True, "files": 2, "manifest_sha256": profile_sha,
                               "package_sha256": FIXED["package"]["sha256"]},
                  "existing_guard_did_not_admit_the_exact_profile")
          source_after = source_observation()
          require(source_after == source_before, "source_changed_during_input_admission")
          proof = {
              "schema": "motionwright-windows-nsis-update-inputs/1", "source_sha": SOURCE,
              "source_before": source_before, "source_after": source_after,
              "profile_sha256": profile_sha, "profile": profile, "new_main_before_bundle": main_before,
              "source_version": config["version"],
              "version_overlay": version_overlay_identity,
              "version_scope": "ISOLATED_INSTALLER_AND_PE_FIXTURE",
              "previous_pe_version": previous_pe, "current_pe_version": current_pe,
              "render_overlay": overlay_identity, "expected_fixture_payloads": expected_fixture,
              "fixture_scope": "two_resources_and_two_nonexecuted_pe_sidecars_only",
              "previous_package_archive": package_admission, "previous_evidence_archive": evidence_admission,
              "previous_run_conclusion": prior_run.get("conclusion"),
              "original_stock_modified_owned_case": "FAIL_PRESERVED_AS_HISTORICAL_RESULT",
              "static_extraction_tool": seven_before, "static_extraction_exit_code": extraction.returncode,
              "installed_cli_version": cli_package["version"], "installed_cli_inputs": cli_inputs,
              "installed_node": node_identity, "cli_probe_commands": tool_runs,
              "upstream_review_sha": "30da1fd6e17de6107ecc850c95dfb16b5729f2dd",
              "upstream_cli_bundle_sha256": "fa883f16f84ad4a0d7d091daa2a57e177b804b481a9ec8f8227c5a398dcafdf6",
              "upstream_bundler_bundle_sha256": "91c8387ccb2e52388cdcfeccfd23f69dac5439aba397d464b1d5446153fdc82e",
              "guard_profile_preflight": admitted,
              "native_installer_execution": "NOT_RUN", "human_install_acceptance": "NOT_RUN",
              "project_observation_scope": "HISTORICAL_PREDECESSOR_PRESERVATION",
              "current_application_storage_open": "NOT_RUN",
              "current_application_storage_migration": "NOT_RUN",
              "release_published": False,
          }
          write_new(PROOF, (json.dumps(proof, indent=2, sort_keys=True) + "\n").encode("utf-8"))
          require(not any(c in str(profile_path) for c in "\r\n"), "profile_environment_path_invalid")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write("MW_NSIS_PREDECESSOR_MANIFEST=" + str(profile_path) + "\n")
              environment.write("MW_NSIS_PREDECESSOR_MANIFEST_SHA256=" + profile_sha + "\n")
              require(not any(c in str(overlay_path) for c in "\r\n"), "overlay_environment_path_invalid")
              environment.write("MW_NSIS_RENDER_OVERLAY=" + str(overlay_path) + "\n")
              for variable, value in (("MW_NSIS_BUNDLE_NODE", str(node)),
                                      ("MW_NSIS_BUNDLE_CLI", str(cli_root / "cli/tauri.js"))):
                  require(not any(c in value for c in "\r\n"), "bundle_tool_environment_path_invalid")
                  environment.write(variable + "=" + value + "\n")
          print("nsis-predecessor-profile=ADMITTED source=" + SOURCE
                + " owned_files=2 installer_execution=NOT_RUN human=NOT_RUN")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'The source-bound NSIS gate failed' }
      - name: Compile the actual NSIS template with two resources and two distinct PE sidecars
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location apps/desktop
          try {
            & $env:MW_NSIS_BUNDLE_NODE $env:MW_NSIS_BUNDLE_CLI bundle --bundles nsis --no-binary-patching --config "$env:MW_NSIS_RENDER_OVERLAY"
            if ($LASTEXITCODE -ne 0) { throw 'The actual Tauri NSIS compilation failed' }
          } finally {
            Pop-Location
          }
      - name: Record the separate compiled fixture setup digest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setups = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe -File)
          if ($setups.Count -ne 1) { throw 'Expected exactly one fixture setup' }
          python tooling/package_receipt.py --git-sha "$env:GITHUB_SHA" --platform windows --arch x86_64 --artifact "$($setups[0].FullName)" --output ci-evidence/windows-nsis-update-candidate.json
          if ($LASTEXITCODE -ne 0) { throw 'The separate setup receipt failed' }
      - name: Inspect the actual rendered template and every captured payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import sys

          sys.path.insert(0, str(Path.cwd() / "tooling"))
          from nsis_owned_files import (
              _capture, _relative, _require_plain_parents, _require_regular,
              _require_unchanged,
          )
          from package_receipt import verified_artifact
          from release_manifest import _checkout

          ROOT = Path(os.environ["GITHUB_WORKSPACE"])
          SOURCE = os.environ["GITHUB_SHA"]
          WORK = Path(os.environ["RUNNER_TEMP"]) / "motionwright-nsis-guarded-update"
          BUILD = ROOT / "target/release/nsis/x64"
          EVIDENCE = ROOT / "ci-evidence"
          PROOF = EVIDENCE / "windows-nsis-update-compiled.json"

          from windows_installer_lifecycle import (
              SOURCE_PATHS, read_pe_versions, require_pe_version,
              validate_rendered_resource_directories,
          )

          def require(ok, code):
              if not ok:
                  raise RuntimeError(code)

          def identity(path):
              actual, size, digest = verified_artifact(ROOT, path)
              return {"bytes": size, "sha256": digest}

          def read_bound(path, maximum=4 * 1024 * 1024):
              observed = identity(path)
              require(observed["bytes"] <= maximum, "compiled_evidence_exceeds_bound")
              with path.open("rb") as stream:
                  body = stream.read(maximum + 1)
              require(len(body) == observed["bytes"]
                      and hashlib.sha256(body).hexdigest() == observed["sha256"]
                      and identity(path) == observed, "compiled_evidence_changed")
              return body, observed

          def write_new(path, value):
              body = (json.dumps(value, indent=2, sort_keys=True) + "\n").encode("utf-8")
              require(len(body) <= 4 * 1024 * 1024, "compiled_projection_exceeds_bound")
              with path.open("xb") as stream:
                  require(stream.write(body) == len(body), "compiled_projection_short_write")
                  stream.flush()
                  os.fsync(stream.fileno())

          def source_bytes(relative):
              require(relative in SOURCE_PATHS, "source_path_outside_the_explicit_gate_set")
              body, observed = read_bound(ROOT / relative)
              return body

          def literal(value):
              # This reader covers the controlled CI path alphabet. It is not a second
              # NSIS renderer and refuses any unexpanded or escaped expression.
              require(value and not any(c in value for c in '$"\r\n\x00'),
                      "compiled_fixture_has_an_unsupported_nsis_literal")
              return value

          def define(text, name, quoted=True):
              pattern = (r'^!define ' + re.escape(name)
                         + (r' "([^"\r\n]*)"\r?$' if quoted else r' ([0-9]+)\r?$'))
              matches = re.findall(pattern, text, re.MULTILINE)
              require(len(matches) == 1, "compiled_definition_missing_or_duplicated")
              return matches[0]

          def retain_original_compiled_inputs():
              """Retain only bounded compiler outputs before inspecting their semantics."""
              destination = EVIDENCE / "windows-nsis-update-compiled-diagnostics"
              _require_plain_parents(destination)
              destination.mkdir()
              report = {
                  "schema": "motionwright.nsis-compiled-diagnostic-custody/1",
                  "status": "DIAGNOSTIC_NOT_VERIFIED", "source_sha": SOURCE,
                  "collection_complete": False, "files": [],
                  "installer_execution": "NOT_RUN", "update_recovery": "NOT_RUN",
                  "release_published": False,
              }
              try:
                  candidates = [
                      (BUILD / "installer.nsi", 4 * 1024 * 1024),
                      (BUILD / "mw-predecessor.nsh", 64 * 1024),
                      (BUILD / "mw-predecessor-manifest.capture.json", 4 * 1024 * 1024),
                  ]
                  _require_plain_parents(BUILD / "compiler-output")
                  build_entries = []
                  for entry in BUILD.iterdir():
                      require(len(build_entries) < 128, "diagnostic_build_entry_bound")
                      build_entries.append(entry)
                  for entry in sorted(build_entries):
                      if entry.name.startswith("mw-owned-"):
                          require(re.fullmatch(
                              r"mw-owned-MW_(?:MAIN|RESOURCE_[0-9]{1,2}|BINARY_[0-9]{1,2})\.(?:bin|nsh)",
                              entry.name) is not None, "diagnostic_capture_name_not_admitted")
                          maximum = 64 * 1024 if entry.suffix == ".nsh" else 256 * 1024 * 1024
                          candidates.append((entry, maximum))
                  setup_root = ROOT / "target/release/bundle/nsis"
                  _require_plain_parents(setup_root / "setup-output")
                  setup_entries = []
                  for entry in setup_root.iterdir():
                      require(len(setup_entries) < 32, "diagnostic_setup_entry_bound")
                      setup_entries.append(entry)
                  setups = [entry for entry in setup_entries if re.fullmatch(
                      r"Motionwright_[0-9]+\.[0-9]+\.[0-9]+_x64-setup\.exe", entry.name)]
                  require(len(setups) == 1, "diagnostic_setup_count_invalid")
                  candidates.append((setups[0], 256 * 1024 * 1024))
                  require(len(candidates) <= 64, "diagnostic_candidate_count_bound")
                  names = [path.name for path, _ in candidates]
                  require(len(names) == len(set(names)), "diagnostic_output_name_duplicated")
                  total = 0
                  for path, maximum in candidates:
                      _require_plain_parents(path)
                      initial = path.lstat()
                      _require_regular(initial, "diagnostic source")
                      require(0 < initial.st_size <= maximum, "diagnostic_file_size_bound")
                      require(total + initial.st_size <= 512 * 1024 * 1024,
                              "diagnostic_total_size_bound")
                      copied = destination / path.name
                      digest, size, _ = _capture(path, copied)
                      _require_unchanged(path.lstat(), initial, "diagnostic source")
                      require(size == initial.st_size, "diagnostic_source_size_changed")
                      observed = {"bytes": size, "sha256": digest}
                      require(identity(copied) == observed, "diagnostic_retained_bytes_changed")
                      total += size
                      report["files"].append({
                          "source_relative": path.relative_to(ROOT).as_posix(),
                          "retained_name": copied.name, **observed,
                      })
                  report["collection_complete"] = True
                  report["retained_bytes"] = total
              finally:
                  primary_failure = sys.exc_info()[0] is not None
                  try:
                      write_new(destination / "manifest.json", report)
                  except Exception:
                      if not primary_failure:
                          raise
                      print("NSIS_DIAGNOSTIC_MANIFEST_UNAVAILABLE primary_failure_preserved",
                            file=sys.stderr)
              return report

          def verify_retained_compiled_inputs(report):
              """Bind the complete diagnostic copies to the final successful projection."""
              destination = EVIDENCE / "windows-nsis-update-compiled-diagnostics"
              require(report["collection_complete"]
                      and report["status"] == "DIAGNOSTIC_NOT_VERIFIED",
                      "diagnostic_collection_not_complete")
              for entry in report["files"]:
                  expected = {key: entry[key] for key in ("bytes", "sha256")}
                  require(identity(ROOT / entry["source_relative"]) == expected
                          and identity(destination / entry["retained_name"]) == expected,
                          "diagnostic_source_or_copy_changed")
              raw, observed = read_bound(destination / "manifest.json")
              require(json.loads(raw) == report, "diagnostic_manifest_changed")
              return observed

          _checkout(ROOT, SOURCE)
          subprocess.run(["git", "ls-files", "--error-unmatch", "--", *SOURCE_PATHS],
                             cwd=ROOT, check=True, capture_output=True, timeout=10)
          diagnostic_custody = retain_original_compiled_inputs()
          inputs_raw, inputs_identity = read_bound(EVIDENCE / "windows-nsis-update-inputs.json")
          inputs = json.loads(inputs_raw)
          require(inputs["source_sha"] == SOURCE and inputs["source_before"] == inputs["source_after"],
                  "compiled_input_source_binding_invalid")
          before = inputs["source_after"]
          require(set(before["files"]) == set(SOURCE_PATHS), "compiled_source_pathset_changed")
          tree = subprocess.run(["git", "rev-parse", "HEAD^{tree}"], cwd=ROOT,
                                check=True, capture_output=True, text=True).stdout.strip()
          require(tree == before["tree"] and before["checkout"] == SOURCE,
                  "compiled_input_tree_binding_invalid")
          for relative, expected in before["files"].items():
              require(identity(ROOT / relative) == expected, "compiled_source_changed")
          profile_path = WORK / "input/predecessor.json"
          profile_raw, profile_identity = read_bound(profile_path)
          require(profile_identity["sha256"] == inputs["profile_sha256"]
                  and os.environ["MW_NSIS_PREDECESSOR_MANIFEST_SHA256"] == inputs["profile_sha256"]
                  and json.loads(profile_raw) == inputs["profile"],
                  "compiled_predecessor_authority_changed")
          captured_profile, captured_profile_identity = read_bound(
              BUILD / "mw-predecessor-manifest.capture.json")
          require(captured_profile == profile_raw, "native_bundle_did_not_capture_the_exact_profile")
          overlay_path = WORK / "input/render-overlay.json"
          require(identity(overlay_path) == inputs["render_overlay"], "render_overlay_changed")
          rendered_raw, rendered_identity = read_bound(BUILD / "installer.nsi")
          require(rendered_raw.startswith(b"\xef\xbb\xbf"), "bundler_render_is_not_the_expected_utf8_bom")
          rendered = rendered_raw.decode("utf-8-sig")
          require("{{#each" not in rendered, "unexpanded_template_loop")
          config = json.loads(source_bytes("apps/desktop/src-tauri/tauri.conf.json"))
          identity_defines = {
              "PRODUCTNAME": "Motionwright", "BUNDLEID": config["identifier"],
              "ARCH": "x64", "INSTALLMODE": "currentUser", "VERSION": inputs["profile"]["target"]["version"],
              "MAINBINARYNAME": "motionwright-desktop",
          }
          require(all(define(rendered, key) == value for key, value in identity_defines.items()),
                  "compiled_application_identity_invalid")
          version_overlay_path = ROOT / "ci-evidence/windows-nsis-update-version-overlay.json"
          require(identity(version_overlay_path) == inputs["version_overlay"]
                  and json.loads(version_overlay_path.read_bytes())
                  == {"version": inputs["profile"]["target"]["version"]}
                  and inputs["version_scope"] == "ISOLATED_INSTALLER_AND_PE_FIXTURE"
                  and inputs["source_version"] == config["version"],
                  "compiled_fixture_version_overlay_changed")
          main_source = Path(literal(define(rendered, "MAINBINARYSRCPATH")))
          require(main_source == ROOT / "target/release/motionwright-desktop.exe",
                  "compiled_main_path_not_the_built_target")
          require(identity(main_source) == inputs["new_main_before_bundle"],
                  "no_binary_patching_did_not_preserve_the_pinned_main_bytes")
          actual_pe = read_pe_versions(main_source)
          require_pe_version(actual_pe, inputs["profile"]["target"]["version"],
                             inputs["new_main_before_bundle"])
          require(actual_pe == inputs["current_pe_version"], "compiled_pe_metadata_changed")
          cli_root = ROOT / "apps/studio/node_modules/@tauri-apps"
          for name, expected in inputs["installed_cli_inputs"].items():
              require(identity(cli_root / name) == expected, "compiled_cli_input_changed")
          require(identity(Path(os.environ["MW_NSIS_BUNDLE_NODE"])) == inputs["installed_node"],
                  "bundle_node_changed")
          require(Path(os.environ["MW_NSIS_BUNDLE_CLI"]) == cli_root / "cli/tauri.js",
                  "bundle_cli_launch_path_changed")

          symbol_pattern = r"MW_(?:MAIN|RESOURCE_[0-9]+|BINARY_[0-9]+)"
          captures = {}
          for line in rendered.splitlines():
              if line.strip().startswith("!insertmacro MWINST_CAPTURE "):
                  match = re.fullmatch(r'\s*!insertmacro MWINST_CAPTURE (' + symbol_pattern
                                       + r') "([^"\r\n]+)"\s*', line)
                  require(match is not None, "compiled_capture_symbol_did_not_render")
                  symbol, source_text = match.groups()
                  require(symbol not in captures, "compiled_capture_symbol_duplicated")
                  if symbol == "MW_MAIN":
                      require(source_text == "${MAINBINARYSRCPATH}", "compiled_main_capture_source_invalid")
                      source_path = main_source
                  else:
                      source_path = Path(literal(source_text))
                  require(source_path.is_absolute(), "compiled_capture_source_not_absolute")
                  captures[symbol] = source_path
          require("MW_MAIN" in captures, "compiled_main_capture_missing")
          resource_symbols = sorted(s for s in captures if s.startswith("MW_RESOURCE_"))
          binary_symbols = sorted(s for s in captures if s.startswith("MW_BINARY_"))
          for prefix, symbols in (("MW_RESOURCE_", resource_symbols), ("MW_BINARY_", binary_symbols)):
              require(len(symbols) >= 2
                      and {int(symbol.removeprefix(prefix)) for symbol in symbols} == set(range(len(symbols))),
                      "actual_bundler_did_not_render_two_distinct_numeric_indexes")

          entries = []
          self_entries = 0
          for line in rendered.splitlines():
              if line.strip().startswith("!insertmacro MWINST_CURRENT_ENTRY "):
                  if line.strip() == ('!insertmacro MWINST_CURRENT_ENTRY "uninstall.exe" '
                                      '"$MWINST_NewSelfSha" "$MWINST_NewSelfSize"'):
                      self_entries += 1
                      continue
                  match = re.fullmatch(
                      r'\s*!insertmacro MWINST_CURRENT_ENTRY "([^"\r\n]+)" "\$\{('
                      + symbol_pattern + r')_SHA256\}" "\$\{\2_SIZE\}"\s*', line)
                  require(match is not None, "compiled_current_inventory_did_not_render")
                  relative, symbol = match.groups()
                  if symbol == "MW_MAIN":
                      require(relative == "${MAINBINARYNAME}.exe", "compiled_main_destination_invalid")
                      relative = "motionwright-desktop.exe"
                  else:
                      relative = _relative(literal(relative), "compiled destination")
                  entries.append((relative, symbol))
          require(self_entries == 1 and len(entries) == len(captures)
                  and {symbol for _, symbol in entries} == set(captures)
                  and len({relative.casefold() for relative, _ in entries}) == len(entries),
                  "compiled_inventory_is_not_complete_and_unique")

          installed_calls = []
          for line in rendered.splitlines():
              if line.strip().startswith("!insertmacro MWINST_INSTALL_PAYLOAD "):
                  match = re.fullmatch(r'\s*!insertmacro MWINST_INSTALL_PAYLOAD "([^"\r\n]+)" ('
                                       + symbol_pattern + r')\s*', line)
                  require(match is not None, "compiled_install_call_did_not_render")
                  relative, symbol = match.groups()
                  if symbol == "MW_MAIN":
                      require(relative == "${MAINBINARYNAME}.exe", "compiled_main_install_name_invalid")
                      relative = "motionwright-desktop.exe"
                  else:
                      relative = _relative(literal(relative), "compiled install destination")
                  installed_calls.append((relative, symbol))
          require(installed_calls == entries, "compiled_lookup_and_install_inventories_differ")
          validate_rendered_resource_directories(rendered, [
              relative for relative, symbol in entries if symbol.startswith("MW_RESOURCE_")])

          retained = EVIDENCE / "windows-nsis-update-compiled-inputs"
          retained.mkdir()
          render_capture = retained / "installer.nsi"
          render_digest, render_size, _ = _capture(BUILD / "installer.nsi", render_capture)
          require({"bytes": render_size, "sha256": render_digest} == rendered_identity,
                  "render_capture_differs_from_the_observed_template")
          current = {}
          capture_inputs = {}
          for relative, symbol in entries:
              header_path = BUILD / ("mw-owned-" + symbol + ".nsh")
              header_raw, header_identity = read_bound(header_path, 64 * 1024)
              header = header_raw.decode("utf-8-sig")
              digest = define(header, symbol + "_SHA256")
              size_text = define(header, symbol + "_SIZE", quoted=False)
              require(re.fullmatch(r"[0-9a-f]{64}", digest) is not None,
                      "compiled_payload_digest_invalid")
              declared = {"bytes": int(size_text), "sha256": digest}
              capture_path = BUILD / ("mw-owned-" + symbol + ".bin")
              require(Path(literal(define(header, symbol + "_SOURCE"))) == capture_path,
                      "compiled_file_instruction_uses_another_capture")
              # All inputs in this concrete fixture are nonempty. The helper's separate
              # zero-byte contract remains exercised by its source tests.
              require(declared["bytes"] > 0 and identity(capture_path) == declared
                      and identity(captures[symbol]) == declared,
                      "compiled_payload_capture_or_source_mismatch")
              kind = ("main" if symbol == "MW_MAIN" else
                      "resource" if symbol.startswith("MW_RESOURCE_") else "external_binary")
              current[relative] = {"kind": kind, **declared, "symbol": symbol}
              capture_inputs[symbol] = {"capture": declared, "header": header_identity}
              observed_digest, observed_size, _ = _capture(header_path, retained / header_path.name)
              require({"bytes": observed_size, "sha256": observed_digest} == header_identity,
                      "compiled_header_custody_mismatch")
          for relative, expected in inputs["expected_fixture_payloads"].items():
              require(relative in current
                      and {key: current[relative][key] for key in ("kind", "bytes", "sha256")} == expected,
                      "actual_bundler_did_not_preserve_the_distinct_fixture_mapping")
          require(current["motionwright-desktop.exe"]["sha256"]
                  == inputs["new_main_before_bundle"]["sha256"], "compiled_main_digest_not_bound")

          previous_header_raw, previous_header_identity = read_bound(BUILD / "mw-predecessor.nsh")
          previous_header = previous_header_raw.decode("utf-8-sig")
          require(define(previous_header, "MWPREV_ENABLED", quoted=False) == "1"
                  and define(previous_header, "MWPREV_MANIFEST_SHA256") == inputs["profile_sha256"]
                  and define(previous_header, "MWPREV_PACKAGE_SHA256")
                  == inputs["profile"]["package"]["sha256"],
                  "actual_nsis_compile_did_not_consume_the_pinned_predecessor")
          for filename in ("mw-predecessor.nsh", "mw-predecessor-manifest.capture.json"):
              source = BUILD / filename
              expected = identity(source)
              digest, size, _ = _capture(source, retained / filename)
              require({"bytes": size, "sha256": digest} == expected, "predecessor_capture_custody_mismatch")
          setups = sorted((ROOT / "target/release/bundle/nsis").glob("*-setup.exe"))
          require(len(setups) == 1, "compiled_update_setup_count_invalid")
          setup_identity = identity(setups[0])
          receipt_raw, receipt_identity = read_bound(EVIDENCE / "windows-nsis-update-candidate.json")
          receipt = json.loads(receipt_raw)
          require(receipt["candidate"]["source_revision"] == SOURCE
                  and receipt["candidate"]["platform"] == "windows"
                  and receipt["candidate"]["arch"] == "x86_64"
                  and receipt["artifacts"] == [{
                      "bundle_kind": "nsis", **setup_identity, "filename": setups[0].name}],
                  "separate_update_setup_receipt_binding_invalid")
          after_files = {}
          for relative, expected in before["files"].items():
              after_files[relative] = identity(ROOT / relative)
              require(after_files[relative] == expected, "source_changed_during_compiled_inspection")
          _checkout(ROOT, SOURCE)
          after_tree = subprocess.run(["git", "rev-parse", "HEAD^{tree}"], cwd=ROOT,
                                     check=True, capture_output=True, text=True).stdout.strip()
          after = {"checkout": SOURCE, "tree": after_tree, "files": after_files}
          require(after == before, "source_tree_changed_during_compiled_inspection")
          diagnostic_manifest = verify_retained_compiled_inputs(diagnostic_custody)
          proof = {
              "schema": "motionwright-windows-nsis-compiled-fixture/1",
              "status": "COMPILED_SOURCE_BOUND", "source_sha": SOURCE, "source_tree": tree,
              "source_before": before, "source_after": after,
              "inputs_receipt": inputs_identity, "candidate_receipt": receipt_identity,
              "setup": setup_identity, "rendered_installer": rendered_identity,
              "diagnostic_custody_manifest": diagnostic_manifest,
              "predecessor_profile": captured_profile_identity,
              "predecessor_header": previous_header_identity, "profile_sha256": inputs["profile_sha256"],
              "current_payloads": current, "captured_inputs": capture_inputs,
              "resources": len(resource_symbols), "sidecars": len(binary_symbols),
              "self_publication_reference": "RUNTIME_GUARD_STAGED_HASH_NOT_OBSERVED_IN_THIS_COMPILE",
              "native_nsis_compile": "EXIT_ZERO_REQUIRED_BY_PREVIOUS_STEP",
              "sidecar_execution": "NOT_RUN",
              "installer_execution": "NOT_RUN", "update_recovery": "NOT_RUN",
              "project_preservation": "NOT_RUN", "human_install_acceptance": "NOT_RUN",
              "normal_candidate_or_attestation_equivalence": "NOT_CLAIMED",
              "release_published": False,
          }
          write_new(PROOF, proof)
          print("nsis-actual-render=COMPILED_SOURCE_BOUND resources=" + str(len(resource_symbols))
                + " sidecars=" + str(len(binary_symbols))
                + " installer_execution=NOT_RUN human=NOT_RUN")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'The source-bound NSIS gate failed' }
      - name: Retain the compiled fixture and bounded source-bound render observations
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-windows-nsis-render-fixture
          path: |
            target/release/bundle/nsis/*-setup.exe
            ci-evidence/windows-nsis-update-candidate.json
            ci-evidence/windows-nsis-update-inputs.json
            ci-evidence/windows-nsis-update-compiled.json
            ci-evidence/windows-nsis-update-version-overlay.json
            ci-evidence/windows-nsis-update-compiled-inputs/*
            ci-evidence/windows-nsis-update-compiled-diagnostics/*
            ci-evidence/nsis-windows-junction-test.json
          if-no-files-found: error
      - name: Observe one distinct-version fixture install, upgrade and uninstall
        if: inputs.verification_scope == 'nsis_lifecycle'
        timeout-minutes: 18
        env:
          MW_NSIS_LIFECYCLE_SCOPE: ${{ inputs.verification_scope }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import ctypes
          from ctypes import wintypes
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import uuid

          ROOT = Path(os.environ["GITHUB_WORKSPACE"])
          sys.path.insert(0, str(ROOT / "tooling"))
          import candidate_smoke
          from nsis_owned_files import _capture
          from release_manifest import write_new_manifest
          from windows_cold_start import (
              known_databases, native_windows_launch_environment,
              run_installed_relaunch, select_first_use_contract, write_sanitized_failure_record,
          )
          from windows_installer_lifecycle import (
              bound_file, bound_json, capture_snapshot, custody_error, file_identity,
              file_map, family_map, installed_registry,
              observed_terminal, require, retained_ref, retain_observed_result,
              source_observation, validate_inputs, validate_lifecycle,
          )

          SOURCE = os.environ["GITHUB_SHA"]
          RUN = {"repository": os.environ["GITHUB_REPOSITORY"],
                 "run_id": int(os.environ["GITHUB_RUN_ID"]),
                 "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"])}
          require(os.name == "nt" and os.environ.get("GITHUB_ACTIONS") == "true"
                  and os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
                  and os.environ.get("MW_NSIS_LIFECYCLE_SCOPE") == "nsis_lifecycle",
                  "lifecycle_requires_explicit_disposable_windows_workflow")
          require(RUN["run_attempt"] == 1, "lifecycle_does_not_replay_a_rerun")
          before_source = source_observation(ROOT, SOURCE)
          EVIDENCE = ROOT / "ci-evidence/windows-nsis-lifecycle"
          EVIDENCE.mkdir()
          INPUT = EVIDENCE / "inputs"
          INPUT.mkdir()
          WORK = Path(os.environ["RUNNER_TEMP"]) / "motionwright-nsis-guarded-update"
          CHILD_ENV = native_windows_launch_environment(os.environ)
          for name in ("GH_TOKEN", "GITHUB_TOKEN"):
              CHILD_ENV.pop(name, None)

          def publish(name, value):
              write_new_manifest(EVIDENCE, EVIDENCE / name, value)
              return retained_ref(EVIDENCE, EVIDENCE / name)

          def capture_input(role, original):
              destination = INPUT / role / original.name
              destination.parent.mkdir()
              expected = file_identity(original)
              digest, size, unused = _capture(original, destination)
              require({"bytes": size, "sha256": digest} == expected
                      and file_identity(original) == expected, "lifecycle_input_changed")
              return retained_ref(EVIDENCE, destination)

          # Capture the same originals used by the compiler gate. This does not replace
          # their NOT_RUN fields or turn a compiler receipt into installed evidence.
          setups = list((ROOT / "target/release/bundle/nsis").glob("*-setup.exe"))
          require(len(setups) == 1, "lifecycle_setup_count")
          paths = {
              "compiled": ROOT / "ci-evidence/windows-nsis-update-compiled.json",
              "inputs": ROOT / "ci-evidence/windows-nsis-update-inputs.json",
              "candidate": ROOT / "ci-evidence/windows-nsis-update-candidate.json",
              "profile": WORK / "input/predecessor.json",
              "rendered": ROOT / "target/release/nsis/x64/installer.nsi",
              "previous_setup": WORK / "input/previous-setup.exe",
              "current_setup": setups[0],
              "previous_capture": WORK / "input/previous-capture-receipt.json",
              "previous_main": WORK / "input/previous-main.exe",
              "current_main": ROOT / "target/release/motionwright-desktop.exe",
              "version_overlay": ROOT / "ci-evidence/windows-nsis-update-version-overlay.json",
          }
          refs = {role: capture_input(role, original) for role, original in paths.items()}
          admission = {"schema": "motionwright.windows-lifecycle-inputs/1",
              "source_sha": SOURCE, "source_tree": before_source["tree"],
              "run": RUN, "refs": refs}
          admission_ref = publish("admission.json", admission)
          verified = validate_inputs(EVIDENCE, admission, SOURCE, RUN)
          project_contract = select_first_use_contract(
              verified["previous_source"],
              verified["previous_payloads"]["motionwright-desktop.exe"]["sha256"],
          )
          require(verified["source_before"] == before_source, "lifecycle_compiler_source_changed")
          publish("admitted-inputs-and-pe.json", verified)

          # The retained predecessor receipt is validated against its own source metadata,
          # not the current dependency lock. No old code is loaded or executed here.
          profile = bound_json(EVIDENCE, refs["profile"])
          previous_capture = bound_json(EVIDENCE, refs["previous_capture"])
          old_source = profile["source_sha"]
          fetch = subprocess.run(
              ["git", "--no-replace-objects", "fetch", "--no-tags", "--depth=1", "origin", old_source],
              cwd=ROOT, env=CHILD_ENV, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              timeout=90, check=False)
          require(fetch.returncode == 0, "predecessor_source_fetch_failed")
          old_tree = subprocess.run(
              ["git", "--no-replace-objects", "rev-parse", old_source + "^{tree}"],
              cwd=ROOT, env=CHILD_ENV, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              timeout=15, check=True).stdout.decode("ascii").strip()
          require(old_tree == profile["source_tree"], "predecessor_source_tree_mismatch")
          metadata = EVIDENCE / "previous-source-metadata"
          metadata.mkdir()
          metadata_files = {}
          for relative in ("SOURCE_LOCK.json", "Cargo.toml", "apps/desktop/src-tauri/tauri.conf.json"):
              data = subprocess.run(
                  ["git", "--no-replace-objects", "show", old_source + ":" + relative],
                  cwd=ROOT, env=CHILD_ENV, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                  timeout=15, check=True).stdout
              require(0 < len(data) <= 1024 * 1024, "predecessor_metadata_size")
              output = metadata.joinpath(*relative.split("/"))
              output.parent.mkdir(parents=True, exist_ok=True)
              with output.open("xb") as stream:
                  require(stream.write(data) == len(data), "predecessor_metadata_short_write")
                  stream.flush()
                  os.fsync(stream.fileno())
              metadata_files[relative] = retained_ref(EVIDENCE, output)
          publish("previous-source-metadata.json", {
              "source_sha": old_source, "source_tree": old_tree, "files": metadata_files,
              "old_source_code_execution": "NOT_RUN"})
          old_config = json.loads((metadata / "apps/desktop/src-tauri/tauri.conf.json").read_bytes())
          require(old_config["bundle"]["windows"]["nsis"]["installMode"] == "currentUser",
                  "predecessor_must_not_delegate_to_elevation")
          previous_candidate_ref = publish("previous-candidate.json", previous_capture["candidate"])
          # Keep the literal filename required by the unchanged candidate smoke reader.
          old_filename = previous_capture["candidate"]["artifacts"][0]["filename"]
          require(old_filename == "Motionwright_0.1.0_x64-setup.exe", "predecessor_filename")
          old_setup = EVIDENCE / old_filename
          _capture(bound_file(EVIDENCE, refs["previous_setup"]), old_setup)
          require(file_identity(old_setup) == verified["previous_setup"], "predecessor_smoke_setup_binding")

          require("APPDATA" in CHILD_ENV and "LOCALAPPDATA" in CHILD_ENV,
                  "native_appdata_missing")
          roots = [Path(CHILD_ENV["APPDATA"]), Path(CHILD_ENV["LOCALAPPDATA"])]
          require(not known_databases(roots), "fixture_project_store_already_present")
          database = roots[0] / "com.seradotcom.motionwright/motionwright.sqlite3"
          install_root = Path(os.environ["RUNNER_TEMP"]) / "mw-nsis-lifecycle-install"
          require(not install_root.exists() and install_root.is_absolute()
                  and not any(char in str(install_root) for char in '"\r\n\0'),
                  "fixture_install_root_not_fresh")
          project_origin = None
          operations = []
          failure = None
          record_ref = None
          result = None

          # The identity is read from the handle returned by this one Popen invocation,
          # not from a PID search that could attach to another installer.
          def process_identity(process):
              kernel = ctypes.WinDLL("kernel32", use_last_error=True)
              kernel.GetProcessTimes.argtypes = [
                  wintypes.HANDLE, ctypes.POINTER(wintypes.FILETIME),
                  ctypes.POINTER(wintypes.FILETIME), ctypes.POINTER(wintypes.FILETIME),
                  ctypes.POINTER(wintypes.FILETIME)]
              kernel.GetProcessTimes.restype = wintypes.BOOL
              creation, exited, kernel_time, user_time = (wintypes.FILETIME() for unused in range(4))
              require(kernel.GetProcessTimes(
                  wintypes.HANDLE(int(process._handle)), ctypes.byref(creation),
                  ctypes.byref(exited), ctypes.byref(kernel_time), ctypes.byref(user_time)),
                  "installer_process_creation_unavailable")
              stamp = (int(creation.dwHighDateTime) << 32) | int(creation.dwLowDateTime)
              require(process.pid > 0 and stamp > 0, "installer_process_identity_invalid")
              return {"pid": process.pid, "creation_filetime": stamp}

          def observe_phase(phase, executable, command, arguments):
              oid = str(uuid.uuid4())
              executable_before = file_identity(executable)
              baseline = capture_snapshot(EVIDENCE, snapshot_name=phase + "-before",
                  operation=oid, position="before", install_root=install_root,
                  database=database, registry_keys=verified["registry_keys"],
                  first_use_contract=project_contract)
              if phase == "install":
                  initial = bound_json(EVIDENCE, baseline)
                  require(not initial["installed"]
                          and all(all(value is None for value in row.values())
                                  for row in initial["registry"].values())
                          and all(value is None for value in initial["sqlite_family"].values()),
                          "initial_fixture_namespace_not_empty")
              elif phase == "upgrade":
                  initial = bound_json(EVIDENCE, baseline)
                  require(all(file_map(initial).get(path) == value
                              for path, value in verified["previous_payloads"].items()),
                          "predecessor_bytes_changed_before_upgrade")
                  installed_registry(initial, verified["registry_keys"][0], verified["previous_version"])
                  require(project_origin is not None and initial["project"] is not None
                          and initial["project"] == bound_json(EVIDENCE, project_origin)["project"],
                          "real_project_baseline_missing")
              else:
                  initial = bound_json(EVIDENCE, baseline)
                  previous = bound_json(EVIDENCE, operations[-1]["after"])
                  require(file_map(initial) == file_map(previous)
                          and family_map(initial) == family_map(previous)
                          and initial["project"] == previous["project"]
                          and initial["registry"] == previous["registry"],
                          "uninstall_does_not_continue_the_observed_upgrade")
              require(source_observation(ROOT, SOURCE) == before_source,
                      "source_changed_before_installer_effect")
              require(file_identity(executable) == executable_before, "effect_executable_changed")
              # NSIS /D= and _?= must be last and unquoted, including paths with spaces.
              # Only the fixed executable and flags are quoted by list2cmdline.
              command_line = subprocess.list2cmdline([str(executable), *arguments[:-1]]) + " " + arguments[-1]
              publish(phase + "-intent.json", {
                  "schema": "motionwright.windows-lifecycle-intent/1",
                  "source_sha": SOURCE, "run": RUN, "operation_id": oid,
                  "phase": phase, "command": command, "executable": executable_before,
                  "arguments": arguments, "launch_limit": 1, "replay_authorized": False})
              process = None
              identity_value = None
              secondary = []
              # Even launch/wait uncertainty is a terminal UNKNOWN; it cannot authorize
              # another launch. No kill, recovery launch, polling launch, or retry exists.
              original = observed_terminal(None)
              try:
                  process = subprocess.Popen(
                      command_line, executable=str(executable), cwd=str(executable.parent),
                      env=CHILD_ENV, stdin=subprocess.DEVNULL,
                      stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  try:
                      identity_value = process_identity(process)
                  except Exception as error:
                      secondary.append(custody_error("process_identity", error))
                  try:
                      code = process.wait(timeout=180)
                      original = observed_terminal(code)
                  except subprocess.TimeoutExpired:
                      original = observed_terminal(None, timed_out=True)
                  except Exception as error:
                      secondary.append(custody_error("installer_wait", error))
              except Exception as error:
                  secondary.append(custody_error("installer_launch", error))
              context = {"operation_id": oid, "process": identity_value,
                         "executable": executable_before, "source_sha": SOURCE, "run": RUN}
              def after_observation():
                  # A live or unobserved terminal cannot provide a quiescent snapshot.
                  require(original["exit_code"] is not None, "installer_terminal_not_quiescent")
                  reference = capture_snapshot(EVIDENCE, snapshot_name=phase + "-after",
                      operation=oid, position="after", install_root=install_root,
                      database=database, registry_keys=verified["registry_keys"],
                      first_use_contract=project_contract)
                  # Exit zero is only the original process result. Before another effect,
                  # require the same observable invariants the final consumer rechecks.
                  prior = bound_json(EVIDENCE, baseline)
                  actual = bound_json(EVIDENCE, reference)
                  old, current = verified["previous_payloads"], verified["current_payloads"]
                  key = verified["registry_keys"][0]
                  if phase == "install":
                      require(file_map(actual) == old, "previous_install_inventory")
                      installed_registry(actual, key, verified["previous_version"])
                      require(all(value is None for value in family_map(actual).values()),
                              "installer_created_unexpected_project_store")
                  elif phase == "upgrade":
                      before_files, after_files = file_map(prior), file_map(actual)
                      require(all(before_files.get(path) == value for path, value in old.items()),
                              "predecessor_bytes_changed_before_upgrade")
                      foreign = {path: value for path, value in before_files.items() if path not in old}
                      require(bool(foreign) and not (set(foreign) & set(current)),
                              "foreign_fixture_missing_or_conflicting")
                      require(all(after_files.get(path) == value for path, value in current.items())
                              and all(after_files.get(path) == value for path, value in foreign.items())
                              and set(after_files) == set(current) | set(foreign) | {"uninstall.exe"}
                              and after_files["uninstall.exe"] != old["uninstall.exe"],
                              "upgrade_payload_or_foreign_preservation")
                      installed_registry(actual, key, verified["fixture_installer_version"])
                      require(family_map(prior) == family_map(actual)
                              and prior["project"] == actual["project"] and actual["project"] is not None,
                              "upgrade_project_changed")
                  else:
                      previous = bound_json(EVIDENCE, operations[-1]["after"])
                      require(file_map(prior) == file_map(previous)
                              and family_map(prior) == family_map(previous)
                              and prior["project"] == previous["project"]
                              and prior["registry"] == previous["registry"],
                              "uninstall_does_not_continue_the_observed_upgrade")
                      foreign = {path: value for path, value in file_map(prior).items()
                                 if path not in current and path != "uninstall.exe"}
                      require(file_map(actual) == {**foreign, "uninstall.exe": file_map(prior)["uninstall.exe"]}
                              and family_map(prior) == family_map(actual)
                              and prior["project"] == actual["project"],
                              "uninstall_payload_or_project_preservation")
                      require(all(row[key] is None for row in actual["registry"].values()),
                              "uninstall_registration_retained")
                      product = verified["registry_keys"][1]
                      require(all(prior["registry"][view][product] == actual["registry"][view][product]
                                  for view in ("32", "64")), "uninstall_product_metadata_changed")
                  return reference
              retained = retain_observed_result(
                  EVIDENCE, phase, original, after_observation, context=context)
              row = {"phase": phase, "operation_id": oid, "launch_count": 1,
                     "command": command, "process": identity_value,
                     "executable": executable_before, "terminal": retained["original_terminal"],
                     "terminal_receipt": None,
                     "custody_errors": retained["custody_errors"] + secondary,
                     "before": baseline, "after": retained["observation"]}
              # Append the original in memory before any further readback can fail.
              operations.append(row)
              try:
                  row["terminal_receipt"] = retained_ref(EVIDENCE, EVIDENCE / (phase + "-terminal.json"))
              except Exception as error:
                  row["custody_errors"].append(custody_error("terminal_readback", error))
              publish(phase + "-operation.json", row)
              require(row["terminal"]["state"] == "ACK" and not row["custody_errors"],
                      "installer_effect_or_custody_incomplete")
              require(file_identity(executable) == executable_before,
                      "effect_executable_changed_after_terminal")
              return row

          try:
              observe_phase("install", bound_file(EVIDENCE, refs["previous_setup"]),
                            "nsis_install_previous", ["/S", "/D=" + str(install_root)])
              installed = install_root / "motionwright-desktop.exe"
              old_root = candidate_smoke.ROOT
              try:
                  candidate_smoke.ROOT = metadata
                  smoke = candidate_smoke.build_receipt(
                      candidate_receipt=bound_file(EVIDENCE, previous_candidate_ref),
                      artifact=old_setup, installed_binary=installed,
                      kind="nsis", method="nsis_silent_current_user")
              finally:
                  candidate_smoke.ROOT = old_root
              smoke_ref = publish("previous-installed-smoke.json", smoke)
              project_output = EVIDENCE / "previous-real-project.json"
              app_scratch = Path(os.environ["RUNNER_TEMP"]) / "mw-nsis-lifecycle-real-project"
              try:
                  run_installed_relaunch(
                      executable=installed, smoke_receipt=bound_file(EVIDENCE, smoke_ref),
                      expected_sha=old_source, scratch=app_scratch, output=project_output,
                      first_use_contract=project_contract)
              except Exception as error:
                  try:
                      write_sanitized_failure_record(
                          output=project_output, scratch=app_scratch, expected_sha=old_source, error=error)
                  except Exception:
                      pass
                  raise
              project_origin = retained_ref(EVIDENCE, project_output)
              require(known_databases(roots) == [database], "actual_project_store_path_not_the_fixed_fixture")
              foreign = install_root / "user-created-foreign.txt"
              with foreign.open("xb") as stream:
                  body = b"Fixture-owned user data: preserve during update and uninstall.\n"
                  require(stream.write(body) == len(body), "foreign_fixture_short_write")
                  stream.flush()
                  os.fsync(stream.fileno())
              observe_phase("upgrade", bound_file(EVIDENCE, refs["current_setup"]),
                            "nsis_upgrade_current", ["/S", "/UPDATE", "/D=" + str(install_root)])
              observe_phase("uninstall", install_root / "uninstall.exe",
                            "nsis_uninstall_current_in_place", ["/S", "_?=" + str(install_root)])
          except Exception as error:
              failure = custody_error("lifecycle_sequence", error)
          finally:
              record = {"schema": "motionwright.windows-installer-lifecycle/1",
                  "source_sha": SOURCE, "source_tree": before_source["tree"], "run": RUN,
                  "admission_sha256": admission_ref["sha256"],
                  "scope": "DISPOSABLE_WINDOWS_FIXTURE_UPGRADE",
                  "operations": operations, "project_origin": project_origin,
                  "interruption": {"status": "NOT_RUN",
                                  "reason": "OBSERVABLE_PID_START_GUID_CHECKPOINT_REQUIRED"},
                  "claims": {"human_acceptance": "NOT_RUN", "published_product_upgrade": "NOT_CLAIMED",
                             "release_published": False}}
              try:
                  record_ref = publish("record.json", record)
              except Exception as error:
                  # Never overwrite a possibly committed record or repeat an installer.
                  failure = failure or custody_error("record_publication", error)
              if record_ref is not None:
                  try:
                      result = validate_lifecycle(EVIDENCE, record, verified, admission_ref["sha256"])
                      require(source_observation(ROOT, SOURCE) == before_source,
                              "source_changed_during_lifecycle")
                      publish("result.json", {
                          "schema": "motionwright.windows-lifecycle-verification/1",
                          "source_before": before_source,
                          "source_after": source_observation(ROOT, SOURCE),
                          "admission": admission_ref, "record": record_ref, "result": result})
                  except Exception as error:
                      failure = failure or custody_error("lifecycle_verification", error)
              if failure is not None:
                  try:
                      publish("diagnostic.json", {
                          "schema": "motionwright.windows-lifecycle-workflow-diagnostic/1",
                          "failure": failure,
                          "originals": [{"phase": row["phase"], "terminal": row["terminal"],
                                         "custody_errors": row["custody_errors"]} for row in operations],
                          "source_sha": SOURCE, "run": RUN, "installer_replays": 0,
                          "human_acceptance": "NOT_RUN", "release_published": False})
                  except Exception:
                      try:
                          sys.stderr.write("windows-lifecycle=INCOMPLETE diagnostic_publication=UNKNOWN\n")
                          sys.stderr.flush()
                      except Exception:
                          pass
          ok = (failure is None and result is not None
                and result["status"] == "SOURCE_BOUND_FIXTURE_OBSERVATIONS")
          try:
              sys.stdout.write("windows-lifecycle=" + ("SOURCE_BOUND_FIXTURE_OBSERVATIONS" if ok else "INCOMPLETE")
                               + " human=NOT_RUN interruption=NOT_RUN\n")
              sys.stdout.flush()
          except Exception:
              pass
          raise SystemExit(0 if ok else 1)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'The source-bound NSIS lifecycle gate failed' }
      - name: Retain original lifecycle observations even after ERROR or UNKNOWN
        if: always() && inputs.verification_scope == 'nsis_lifecycle'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-windows-nsis-lifecycle-original
          path: ci-evidence/windows-nsis-lifecycle/**
          if-no-files-found: warn
      - name: Retain available compiler gate receipts after failure or cancellation
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-windows-nsis-render-diagnostics
          path: |
            ci-evidence/windows-nsis-update-*.json
            ci-evidence/windows-nsis-update-compiled-diagnostics/*
            ci-evidence/nsis-windows-junction-test.json
          if-no-files-found: warn

  macos:
    if: github.event_name != 'workflow_dispatch' || (inputs.verification_scope != 'windows_contracts' && inputs.verification_scope != 'windows_installed' && inputs.verification_scope != 'nsis_source' && inputs.verification_scope != 'distribution_source' && inputs.verification_scope != 'nsis_compile' && inputs.verification_scope != 'nsis_lifecycle' && inputs.verification_scope != 'linux_first_use_source' && inputs.verification_scope != 'linux_first_use')
    needs: receipt-policy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: false
      - name: Install locked Studio and Tauri CLI dependencies
        run: npm --prefix apps/studio ci --no-audit --no-fund
      - name: Build unsigned macOS DMG candidate
        run: |
          cd apps/desktop
          npm --prefix ../studio exec -- tauri build --bundles dmg
      - name: Record exact macOS candidate artifact
        run: |
          dmg_count="$(find target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' | wc -l)"
          test "$dmg_count" -eq 1
          dmg="$(find target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print)"
          arch="$(uname -m)"
          python3 tooling/package_receipt.py \
            --git-sha "$GITHUB_SHA" \
            --platform macos \
            --arch "$arch" \
            --artifact "$dmg" \
            --output ci-evidence/macos-candidate.json
      - name: Read-only DMG mount, copy application and inspect macOS Mach-O
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          dmg="$(find target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          work="$RUNNER_TEMP/motionwright-macos-smoke"
          mkdir -p "$work/mount" "$work/installed"
          hdiutil attach -readonly -nobrowse -mountpoint "$work/mount" "$dmg" >/dev/null
          trap 'hdiutil detach "$work/mount" -quiet || true' EXIT
          app_count="$(find "$work/mount" -maxdepth 1 -type d -name '*.app' | wc -l)"
          test "$app_count" -eq 1
          app="$(find "$work/mount" -maxdepth 1 -type d -name '*.app' -print -quit)"
          ditto "$app" "$work/installed/Motionwright.app"
          plist="$work/installed/Motionwright.app/Contents/Info.plist"
          test -f "$plist"
          exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          binary="$work/installed/Motionwright.app/Contents/MacOS/$exe"
          test -f "$binary"
          python3 tooling/candidate_smoke.py \
            --candidate-receipt ci-evidence/macos-candidate.json \
            --expected-source-sha "$GITHUB_SHA" \
            --kind dmg --method dmg_readonly_mount_copy \
            --artifact "$dmg" --installed-binary "$binary" \
            --mac-info-plist "$plist" \
            --output ci-evidence/macos-dmg-smoke.json
          # No unsigned application is force-launched and no Gatekeeper,
          # signing, notarization or user-level protection is disabled.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-macos-candidate
          path: |
            target/release/bundle/dmg/*.dmg
            ci-evidence/macos-candidate.json
            ci-evidence/macos-dmg-smoke.json
          if-no-files-found: error

  # Keep OIDC/Sigstore/attestation write permissions in this dedicated job.
  # The three package-build jobs continue to have contents:read only.
  # Ordinary PRs cannot mint trusted candidate provenance: source checks run
  # on PRs, while this job is NOT_RUN until trusted dispatch or main push.
  attest-candidates:
    name: Candidate GH provenance (trusted runs only)
    if: github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'all' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: motionwright-linux-candidate
          path: candidates/linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: motionwright-windows-candidate
          path: candidates/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: motionwright-macos-candidate
          path: candidates/macos
      - name: Verify all four downloaded packages match unsigned source-bound receipts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/motionwright-provenance"
          python3 -m unittest discover -s tooling/tests -p test_candidate_attestation_input.py -v
          python3 tooling/candidate_attestation_input.py \
            --source-sha "$GITHUB_SHA" \
            --download-root "$GITHUB_WORKSPACE/candidates" \
            --output-dir "$RUNNER_TEMP/motionwright-provenance"
          test "$(wc -l < "$RUNNER_TEMP/motionwright-provenance/verified-subject-paths.txt")" -eq 4
      # A GitHub workflow attestation is NOT an Authenticode signature, Apple
      # Developer signature/notarization, human approval or a release gate.
      - name: Attest exact candidate package bytes through GitHub Sigstore
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            candidates/linux/**/*.AppImage
            candidates/linux/**/*.deb
            candidates/windows/**/*-setup.exe
            candidates/macos/**/*.dmg
      - name: Independently verify each of the four signed candidate digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r subject; do
            test -f "$subject"
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/package-candidate.yml" \
              --source-digest "$GITHUB_SHA" >/dev/null
            count=$((count+1))
          done < "$RUNNER_TEMP/motionwright-provenance/verified-subject-paths.txt"
          test "$count" -eq 4
          echo "v01-candidate-gh-attestation=VERIFIED subjects=4 unsigned_installers=YES human_acceptance=NOT_RUN release=BLOCKED"
      # Exercise the identical read-only pre-install verification contract
      # an owner can run, on an ACTUAL downloaded NSIS installer + GH signature.
      # This is CI technical evidence, NOT an owner-installed/human PASS.
      - name: Verify actual candidate using owner-side provenance CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t installers < <(find candidates/windows -type f -name '*-setup.exe')
          test "${#installers[@]}" -eq 1
          test -f "$GITHUB_WORKSPACE/candidates/windows/ci-evidence/windows-candidate.json"
          python3 tooling/owner_candidate_provenance.py \
            --source-sha "$GITHUB_SHA" \
            --bundle-kind nsis \
            --artifact "$GITHUB_WORKSPACE/${installers[0]}" \
            --candidate-receipt "$GITHUB_WORKSPACE/candidates/windows/ci-evidence/windows-candidate.json" \
            --output "$RUNNER_TEMP/motionwright-provenance/ci-preinstall-provenance.json"
          python3 -m json.tool "$RUNNER_TEMP/motionwright-provenance/ci-preinstall-provenance.json" >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-v01-candidate-provenance-inputs
          path: |
            ${{ runner.temp }}/motionwright-provenance/verified-candidate-inputs.json
            ${{ runner.temp }}/motionwright-provenance/ci-preinstall-provenance.json
          if-no-files-found: error

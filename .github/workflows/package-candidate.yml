          class GateError(RuntimeError):
              pass

          def require(ok, code):
              if not ok:
                  raise GateError(code)

          def plain_parents(path):
              owned._require_plain_parents(owned._validated_path(path))

          def identity(path):
              observed, size, digest = verified_artifact(ROOT, path)
              return {"bytes": size, "sha256": digest}

          def token(path):
              plain_parents(path)
              info = path.lstat()
              owned._require_regular(info, "observed file")
              return {
                  "device": info.st_dev, "inode": info.st_ino, "bytes": info.st_size,
                  "mtime_ns": info.st_mtime_ns, "ctime_ns": info.st_ctime_ns,
                  "links": info.st_nlink,
              }

          def absent(path):
              plain_parents(path)
              try:
                  path.lstat()
              except FileNotFoundError:
                  return True
              return False

          def write_new(path, value):
              body = (json.dumps(value, indent=2, sort_keys=True) + "\n").encode("utf-8")
              require(len(body) <= 4 * 1024 * 1024, "observation_document_exceeds_bound")
              plain_parents(path)
              with path.open("xb") as stream:
                  require(stream.write(body) == len(body), "observation_document_short_write")
                  stream.flush()
                  os.fsync(stream.fileno())
              result = identity(path)
              require(result == {"bytes": len(body), "sha256": hashlib.sha256(body).hexdigest()},
                      "observation_document_readback_mismatch")
              return result

          def read_bound(path, maximum=4 * 1024 * 1024):
              before = identity(path)
              require(before["bytes"] <= maximum, "observation_input_exceeds_bound")
              with path.open("rb") as stream:
                  body = stream.read(maximum + 1)
              require(len(body) == before["bytes"]
                      and hashlib.sha256(body).hexdigest() == before["sha256"]
                      and identity(path) == before, "observation_input_changed_during_read")
              return json.loads(body), before

          def source_observation():
              _checkout(ROOT, SOURCE)
              subprocess.run(["git", "ls-files", "--error-unmatch", "--", *SOURCE_PATHS],
                             cwd=ROOT, check=True, capture_output=True, timeout=10)
              tree = subprocess.run(["git", "rev-parse", "HEAD^{tree}"], cwd=ROOT,
                                    check=True, capture_output=True, text=True, timeout=10).stdout.strip()
              require(re.fullmatch(r"[0-9a-f]{40}", tree) is not None, "source_tree_invalid")
              files = {relative: identity(ROOT / relative) for relative in SOURCE_PATHS}
              _checkout(ROOT, SOURCE)
              return {"checkout": SOURCE, "tree": tree, "files": files}

          def inputs_observation():
              return {name: identity(path) for name, (path, expected) in PINNED.items()}

          def assert_inputs():
              require(PINNED and inputs_observation() ==
                      {name: expected for name, (path, expected) in PINNED.items()},
                      "pinned_update_inputs_changed")

          def file_tree(root):
              require(root.is_absolute(), "fixture_destination_must_be_absolute")
              plain_parents(root)
              root_info = root.lstat()
              require(stat.S_ISDIR(root_info.st_mode) and not owned._is_link_or_reparse(root_info),
                      "fixture_destination_is_not_an_ordinary_directory")
              files = {}
              directories = []
              total = 0
              for parent, names, leaves in os.walk(root, topdown=True, followlinks=False):
                  parent_path = Path(parent)
                  for name in names:
                      child = parent_path / name
                      info = child.lstat()
                      require(stat.S_ISDIR(info.st_mode) and not owned._is_link_or_reparse(info),
                              "fixture_tree_contains_a_nonordinary_directory")
                      directories.append(child.relative_to(root).as_posix())
                  for name in leaves:
                      child = parent_path / name
                      value = identity(child)
                      require(token(child)["links"] == 1, "fixture_tree_contains_a_shared_file")
                      total += value["bytes"]
                      require(len(files) < 64 and len(directories) <= 64
                              and total <= 512 * 1024 * 1024, "fixture_tree_exceeds_bound")
                      files[child.relative_to(root).as_posix()] = value
              after = root.lstat()
              require((after.st_dev, after.st_ino) == (root_info.st_dev, root_info.st_ino),
                      "fixture_destination_identity_changed")
              return {"files": files, "directories": sorted(directories)}

          def stable_tree():
              before = file_tree(DEST)
              require(file_tree(DEST) == before, "fixture_tree_changed_during_inventory")
              return before

          def expected_directories(files):
              result = set()
              for relative in files:
                  for parent in Path(relative).parents:
                      if str(parent) != ".":
                          result.add(parent.as_posix())
              return sorted(result)

          def exact_tree(expected_files):
              tree = stable_tree()
              require(tree == {"files": expected_files,
                               "directories": expected_directories(expected_files)},
                      "actual_installed_payload_inventory_differs")
              return tree

          def family_tokens(database):
              require(database.name == "motionwright.sqlite3", "unexpected_project_database_name")
              plain_parents(database)
              admitted = {database.name + suffix for suffix in FAMILY_SUFFIXES}
              for entry in database.parent.iterdir():
                  if entry.name.casefold().startswith(database.name.casefold()):
                      require(entry.name in admitted, "project_family_contains_an_unclassified_member")
              observed = {}
              total = 0
              for suffix in FAMILY_SUFFIXES:
                  path = database.with_name(database.name + suffix)
                  try:
                      info = path.lstat()
                  except FileNotFoundError:
                      observed[suffix] = None
                      continue
                  owned._require_regular(info, "project family member")
                  require(0 <= info.st_size <= MAX_FAMILY_FILE and info.st_nlink == 1,
                          "project_family_member_is_shared_or_exceeds_bound")
                  total += info.st_size
                  observed[suffix] = token(path)
              require(observed[""] is not None and observed[""]["bytes"] > 0
                      and total <= MAX_FAMILY_TOTAL, "project_family_is_incomplete_or_exceeds_bound")
              return observed

          def family_content(database, observed, zero_probe_label):
              result = {}
              zero_dir = None
              for suffix, info in observed.items():
                  if info is None:
                      result[suffix] = None
                      continue
                  path = database.with_name(database.name + suffix)
                  if info["bytes"] == 0:
                      # The general artifact verifier intentionally rejects empty files.
                      # Reuse the existing owned-input capture for an observed empty
                      # SQLite companion, including its initial-size+1 read and checks.
                      if zero_dir is None:
                          zero_dir = CASE / zero_probe_label
                          zero_dir.mkdir()
                      digest, size, _ = owned._capture(path, zero_dir / path.name)
                      require(size == 0, "empty_project_companion_changed")
                      result[suffix] = {"bytes": size, "sha256": digest}
                  else:
                      result[suffix] = identity(path)
                  require(result[suffix]["bytes"] == info["bytes"],
                          "project_family_size_changed_during_hash_observation")
              return result

          def content_manifest(snapshot):
              return {suffix: (None if item is None else
                               {"bytes": item["bytes"], "sha256": item["sha256"]})
                      for suffix, item in snapshot["members"].items()}

          def seal_project(label, database, expected_project):
              require(re.fullmatch(r"[a-z0-9-]+", label) is not None, "capture_label_invalid")
              before = family_tokens(database)
              folder = CUSTODY / label
              folder.mkdir()
              payload_dir = folder / "files"
              payload_dir.mkdir()
              intent = {
                  "schema": "motionwright-windows-update-project-capture-intent/1",
                  "source_sha": SOURCE, "label": label, "status": "PENDING",
                  "source_before": before,
                  "database_name": database.name,
                  "scope": "DB_WAL_SHM_and_rollback_journal_present_at_this_observation",
                  "linked_assets_exports_other_databases": "NOT_EXERCISED",
                  "human_acceptance": "NOT_RUN",

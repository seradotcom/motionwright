name: Candidate Packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/studio/**"
      - "crates/**"
      - "tooling/package_receipt.py"
      - "tooling/tests/test_package_receipt.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - "SOURCE_LOCK.json"
      - ".github/workflows/package-candidate.yml"
  push:
    branches: ["main", "feat/**"]
    paths:
      - "apps/desktop/**"
      - "apps/studio/**"
      - "crates/**"
      - "tooling/package_receipt.py"
      - "tooling/tests/test_package_receipt.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - "SOURCE_LOCK.json"
      - ".github/workflows/package-candidate.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  receipt-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Candidate receipt policy tests
        run: python3 -m unittest tooling/tests/test_package_receipt.py

  linux:
    needs: receipt-policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: false
      - name: Install Linux desktop bundling prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libfuse2
      - name: Install locked Studio and Tauri CLI dependencies
        run: npm --prefix apps/studio ci --no-audit --no-fund
      - name: Build unsigned Linux candidate bundles
        run: |
          cd apps/desktop
          npm --prefix ../studio exec -- tauri build --bundles deb,appimage
      - name: Record exact Linux candidate artifacts
        run: |
          appimage_count="$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | wc -l)"
          deb_count="$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' | wc -l)"
          test "$appimage_count" -eq 1
          test "$deb_count" -eq 1
          appimage="$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print)"
          deb="$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print)"
          python3 tooling/package_receipt.py \
            --git-sha "$GITHUB_SHA" \
            --platform linux \
            --arch x86_64 \
            --artifact "$appimage" \
            --artifact "$deb" \
            --output ci-evidence/linux-candidate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-linux-candidate
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            ci-evidence/linux-candidate.json
          if-no-files-found: error

  windows:
    needs: receipt-policy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: false
      - name: Install locked Studio and Tauri CLI dependencies
        run: npm --prefix apps/studio ci --no-audit --no-fund
      - name: Build unsigned current-user Windows NSIS candidate
        shell: pwsh
        run: |
          Set-Location apps/desktop
          npm --prefix ../studio exec -- tauri build --bundles nsis
          Set-Location ../..
      - name: Record exact Windows candidate artifact
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe -File)
          if ($artifacts.Count -ne 1) {
            throw "Expected exactly one NSIS setup artifact, observed $($artifacts.Count)"
          }
          python tooling/package_receipt.py --git-sha "$env:GITHUB_SHA" --platform windows --arch x86_64 --artifact "$($artifacts[0].FullName)" --output ci-evidence/windows-candidate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-windows-candidate
          path: |
            target/release/bundle/nsis/*-setup.exe
            ci-evidence/windows-candidate.json
          if-no-files-found: error

  macos:
    needs: receipt-policy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: false
      - name: Install locked Studio and Tauri CLI dependencies
        run: npm --prefix apps/studio ci --no-audit --no-fund
      - name: Build unsigned macOS DMG candidate
        run: |
          cd apps/desktop
          npm --prefix ../studio exec -- tauri build --bundles dmg
      - name: Record exact macOS candidate artifact
        run: |
          dmg_count="$(find target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' | wc -l)"
          test "$dmg_count" -eq 1
          dmg="$(find target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print)"
          arch="$(uname -m)"
          python3 tooling/package_receipt.py \
            --git-sha "$GITHUB_SHA" \
            --platform macos \
            --arch "$arch" \
            --artifact "$dmg" \
            --output ci-evidence/macos-candidate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-macos-candidate
          path: |
            target/release/bundle/dmg/*.dmg
            ci-evidence/macos-candidate.json
          if-no-files-found: error

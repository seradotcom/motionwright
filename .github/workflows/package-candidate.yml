name: Candidate Packages

on:
  workflow_dispatch:
    inputs:
      package_scope:
        description: Run all candidate gates or the existing Windows uninstall route
        type: choice
        required: true
        default: all
        options: [all, windows-uninstall]
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/studio/**"
      - "crates/**"
      - "tooling/package_receipt.py"
      - "tooling/v01_glib_product_admission.py"
      - "tooling/upstream-crates/**"
      - "vendor/glib-0.18.5/**"
      - "tooling/release_manifest.py"
      - "tooling/tests/test_package_receipt.py"
      - "tooling/tests/test_candidate_receipt_source.py"
      - "tooling/candidate_attestation_input.py"
      - "tooling/tests/test_candidate_attestation_input.py"
      - "tooling/owner_candidate_provenance.py"
      - "tooling/tests/test_owner_candidate_provenance.py"
      - "tooling/candidate_smoke.py"
      - "tooling/linux_gui_probe.py"
      - "tooling/windows_cold_start.py"
      - "tooling/tests/test_windows_cold_start.py"
      - "tooling/linux_cold_start.py"
      - "tooling/tests/test_linux_cold_start.py"
      - "tooling/tests/test_linux_gui_readiness.py"
      - "tooling/tests/test_candidate_smoke.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - "SOURCE_LOCK.json"
      - ".github/workflows/package-candidate.yml"
  push:
    branches: ["main", "feat/**"]
    paths:
      - "apps/desktop/**"
      - "apps/studio/**"
      - "crates/**"
      - "tooling/package_receipt.py"
      - "tooling/v01_glib_product_admission.py"
      - "tooling/upstream-crates/**"
      - "vendor/glib-0.18.5/**"
      - "tooling/release_manifest.py"
      - "tooling/tests/test_package_receipt.py"
      - "tooling/tests/test_candidate_receipt_source.py"
      - "tooling/candidate_attestation_input.py"
      - "tooling/tests/test_candidate_attestation_input.py"
      - "tooling/owner_candidate_provenance.py"
      - "tooling/tests/test_owner_candidate_provenance.py"
      - "tooling/candidate_smoke.py"
      - "tooling/linux_gui_probe.py"
      - "tooling/windows_cold_start.py"
      - "tooling/tests/test_windows_cold_start.py"
      - "tooling/linux_cold_start.py"
      - "tooling/tests/test_linux_cold_start.py"
      - "tooling/tests/test_linux_gui_readiness.py"
      - "tooling/tests/test_candidate_smoke.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - "SOURCE_LOCK.json"
      - ".github/workflows/package-candidate.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  receipt-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Candidate receipt and installed-package smoke policy tests
        run: |
          python3 -m unittest tooling/tests/test_package_receipt.py tooling/tests/test_candidate_receipt_source.py tooling/tests/test_candidate_attestation_input.py tooling/tests/test_owner_candidate_provenance.py
          python3 -m unittest tooling/tests/test_candidate_smoke.py tooling/tests/test_windows_cold_start.py tooling/tests/test_linux_cold_start.py tooling/tests/test_linux_gui_readiness.py

  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.package_scope != 'windows-uninstall'
    needs: receipt-policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: false
      - name: Install Linux desktop bundling prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libfuse2 xvfb x11-utils dbus-x11
      - name: Install locked Studio and Tauri CLI dependencies
        run: npm --prefix apps/studio ci --no-audit --no-fund
      - name: Build unsigned Linux candidate bundles
        run: |
          cd apps/desktop
          npm --prefix ../studio exec -- tauri build --bundles deb,appimage
      - name: Verify actual Linux candidate compiled the reviewed local glib source
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          python3 tooling/v01_glib_product_admission.py --output ci-evidence/glib-patched-source.json
          cargo tree --locked -p motionwright-desktop --target x86_64-unknown-linux-gnu -i glib > ci-evidence/glib-compiled-owner-tree.txt
          grep -F 'vendor/glib-0.18.5' ci-evidence/glib-compiled-owner-tree.txt >/dev/null
          count="$(find target/release/deps -maxdepth 1 -type f -name 'libglib-*.rlib' | wc -l)"
          test "$count" -ge 1
          echo 'v01-glib-product-candidate=LOCAL_BACKPORT_COMPILED linux_installed_gui=NOT_YET_VERIFIED'
      - name: Record exact Linux candidate artifacts
        run: |
          appimage_count="$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | wc -l)"
          deb_count="$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' | wc -l)"
          test "$appimage_count" -eq 1
          test "$deb_count" -eq 1
          appimage="$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print)"
          deb="$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print)"
          python3 tooling/package_receipt.py \
            --git-sha "$GITHUB_SHA" \
            --platform linux \
            --arch x86_64 \
            --artifact "$appimage" \
            --artifact "$deb" \
            --output ci-evidence/linux-candidate.json
      - name: Inspect extracted Linux packages and launch a rootless AppImage window
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          deb="$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          appimage="$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          work="$RUNNER_TEMP/motionwright-smoke"
          mkdir -p "$work/deb" "$work/appimage"
          dpkg-deb --extract "$deb" "$work/deb"
          mapfile -t deb_bins < <(find "$work/deb/usr/bin" -maxdepth 1 -type f -executable -iname "*motionwright*")
          mapfile -t deb_desktop < <(find "$work/deb/usr/share/applications" -maxdepth 1 -type f -name '*.desktop')
          test "${#deb_bins[@]}" -eq 1
          test "${#deb_desktop[@]}" -eq 1
          python3 tooling/candidate_smoke.py \
            --candidate-receipt ci-evidence/linux-candidate.json \
            --expected-source-sha "$GITHUB_SHA" \
            --kind deb --method deb_extract \
            --artifact "$deb" --installed-binary "${deb_bins[0]}" \
            --linux-desktop-entry "${deb_desktop[0]}" \
            --output ci-evidence/linux-deb-smoke.json
          echo "Debian extracted program and desktop metadata validated"
          chmod u+x "$appimage"
          echo "Extracting AppImage to disposable runner directory"
          if ! (cd "$work/appimage" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null); then
            echo "::error::AppImage extraction failed (no FUSE or sandbox bypass was attempted)"
            exit 1
          fi
          extracted="$work/appimage/squashfs-root"
          if ! test -x "$extracted/AppRun"; then
            echo "::error::AppImage extraction contains no executable AppRun"
            find "$extracted" -maxdepth 2 -name 'AppRun' -o -name '*.desktop'
            exit 1
          fi
          mapfile -t image_bins < <(find "$extracted/usr/bin" -maxdepth 1 -type f -executable -iname "*motionwright*")
          mapfile -t image_desktop < <(find "$extracted" -maxdepth 1 -name '*.desktop')
          if [ "${#image_bins[@]}" -ne 1 ]; then
            echo "::error::Expected one Motionwright binary in extracted AppImage, found ${#image_bins[@]}"
            find "$extracted/usr/bin" -maxdepth 1 -type f -printf '%f\n'
            exit 1
          fi
          if [ "${#image_desktop[@]}" -ne 1 ]; then
            echo "::error::Expected one AppImage desktop entry, found ${#image_desktop[@]}"
            find "$extracted" -maxdepth 1 -name '*.desktop' -printf '%f\n'
            exit 1
          fi
          echo "AppImage source payload extracted; testing fresh bootstrap, SQLite persistence and a second real X11 window"
          xvfb-run -a -s "-screen 0 1440x940x24" \
            dbus-run-session -- python3 tooling/linux_cold_start.py \
              --app-run "$extracted/AppRun" \
              --scratch "$work/isolated-gui" \
              --source-sha "$GITHUB_SHA" \
              --source-lock SOURCE_LOCK.json \
              --output ci-evidence/linux-appimage-window.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          evidence = json.loads(Path("ci-evidence/linux-appimage-window.json").read_text())
          assert evidence["schema"] == "motionwright.ci.installed-cold-relaunch/1"
          assert evidence["motionwright_sha"] == os.environ["GITHUB_SHA"]
          assert evidence["semwright_sha"] == json.loads(Path("SOURCE_LOCK.json").read_text())["dependencies"]["semwright"]["revision"]
          assert evidence["status"] == "WINDOW_OBSERVED"
          assert evidence["window_title"] == "Motionwright"
          assert evidence["launch_count"] == 2
          assert evidence["first_launch"]["status"] == "WINDOW_OBSERVED"
          assert evidence["reopened_launch"]["status"] == "WINDOW_OBSERVED"
          persistence = evidence["persistence"]
          assert persistence["status"] == "PASS"
          assert persistence["one_project_after_both_launches"] is True
          assert persistence["same_project_id"] is True
          assert persistence["same_generation"] is True
          assert persistence["same_revision"] is True
          assert persistence["same_domain_document_sha256"] is True
          assert persistence["sqlite_integrity_checked_twice"] is True
          assert persistence["schema_version"] == 2
          assert persistence["native_receipts"] == 0
          assert all(len(persistence[key]) == 64 for key in ("project_identity_sha256", "generation_sha256", "document_sha256"))
          assert evidence["claims"]["human_install_acceptance"] == "NOT_RUN"
          assert evidence["claims"]["native_renderer_execution"] == "NOT_RUN"
          PY
          python3 tooling/candidate_smoke.py \
            --candidate-receipt ci-evidence/linux-candidate.json \
            --expected-source-sha "$GITHUB_SHA" \
            --kind appimage --method appimage_extract \
            --artifact "$appimage" --installed-binary "${image_bins[0]}" \
            --linux-desktop-entry "${image_desktop[0]}" \
            --linux-gui-probe ci-evidence/linux-appimage-window.json \
            --output ci-evidence/linux-appimage-smoke.json
      - name: Retain isolated GUI launch diagnostics if smoke fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-linux-smoke-diagnostics
          path: |
            ${{ runner.temp }}/motionwright-smoke/isolated-gui/app-run.log
            ${{ runner.temp }}/motionwright-smoke/isolated-gui/app-run-first.log
            ${{ runner.temp }}/motionwright-smoke/isolated-gui/app-run-second.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-linux-candidate
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            ci-evidence/linux-candidate.json
            ci-evidence/linux-deb-smoke.json
            ci-evidence/linux-appimage-smoke.json
            ci-evidence/linux-appimage-window.json
          if-no-files-found: error

  windows:
    needs: receipt-policy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: false
      - name: Install locked Studio and Tauri CLI dependencies
        run: npm --prefix apps/studio ci --no-audit --no-fund
      - name: Build unsigned current-user Windows NSIS candidate
        shell: pwsh
        run: |
          Set-Location apps/desktop
          npm --prefix ../studio exec -- tauri build --bundles nsis
          Set-Location ../..
      - name: Record exact Windows candidate artifact
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe -File)
          if ($artifacts.Count -ne 1) {
            throw "Expected exactly one NSIS setup artifact, observed $($artifacts.Count)"
          }
          python tooling/package_receipt.py --git-sha "$env:GITHUB_SHA" --platform windows --arch x86_64 --artifact "$($artifacts[0].FullName)" --output ci-evidence/windows-candidate.json
      - name: Silent current-user NSIS install and inspect installed Windows executable
        shell: pwsh
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe -File)
          if ($installers.Count -ne 1) { throw 'Expected one NSIS installer to smoke test' }
          $dest = Join-Path $env:RUNNER_TEMP 'motionwright-nsis-current-user'
          if (Test-Path $dest) { throw 'Installed destination is unexpectedly preexisting' }
          $installer = $installers[0].FullName
          $process = Start-Process -FilePath $installer -ArgumentList "/S /D=$dest" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS current-user installer exited $($process.ExitCode)" }
          if (-not (Test-Path $dest)) { throw 'NSIS silently completed but no installed directory exists' }
          $binaries = @(Get-ChildItem $dest -Recurse -File -Filter '*motionwright*.exe' |
            Where-Object { $_.Name -notmatch '(unins|setup|uninstall)' })
          if ($binaries.Count -ne 1) {
            throw "Expected one installed Motionwright executable, got $($binaries.Count)"
          }
          python tooling/candidate_smoke.py `
            --candidate-receipt ci-evidence/windows-candidate.json `
            --expected-source-sha "$env:GITHUB_SHA" `
            --kind nsis --method nsis_silent_current_user `
            --artifact "$installer" --installed-binary "$($binaries[0].FullName)" `
            --output ci-evidence/windows-nsis-smoke.json
      - name: Cold launch and reopen the real NSIS-installed application
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:RUNNER_TEMP 'motionwright-nsis-current-user'
          $binaries = @(Get-ChildItem $dest -Recurse -File -Filter '*motionwright*.exe' |
            Where-Object { $_.Name -notmatch '(unins|setup|uninstall)' })
          if ($binaries.Count -ne 1) {
            throw 'Cannot uniquely identify the previously validated installed NSIS executable'
          }
          $scratch = Join-Path $env:RUNNER_TEMP 'motionwright-windows-cold-relaunch'
          $proofPath = Join-Path $env:GITHUB_WORKSPACE 'ci-evidence/windows-nsis-cold-relaunch.json'
          python tooling/windows_cold_start.py `
            --installed-binary "$($binaries[0].FullName)" `
            --candidate-smoke ci-evidence/windows-nsis-smoke.json `
            --expected-source-sha "$env:GITHUB_SHA" `
            --scratch "$scratch" `
            --output "$proofPath"
          if ($LASTEXITCODE -ne 0) {
            throw 'Installed NSIS cold boot or persisted-project relaunch did not pass'
          }
          $proof = Get-Content "$proofPath" -Raw | ConvertFrom-Json
          if ($proof.source_sha -ne $env:GITHUB_SHA -or
              $proof.first_launch_real_visible_hwnd -ne $true -or
              $proof.second_launch_real_visible_hwnd -ne $true -or
              $proof.same_project_generation_revision_document -ne $true -or
              $proof.human_install_acceptance -ne 'NOT_RUN' -or
              $proof.renderer_runtime_acceptance -ne 'NOT_RUN') {
            throw 'Windows cold-launch proof does not match the exact source or evidence scope'
          }
      - name: Verify actual NSIS removal and modified-file preservation
        shell: python
        timeout-minutes: 8
        env:
          PACKAGE_SCOPE: ${{ inputs.package_scope || 'all' }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          from contextlib import closing
          import hashlib
          import json
          import os
          from pathlib import Path
          import stat
          import sqlite3
          import subprocess
          import sys
          import time
          import traceback

          root = Path.cwd().resolve(strict=True)
          sys.path.insert(0, str(root / "tooling"))
          import package_receipt as packages
          import windows_cold_start as cold

          out = root / "ci-evidence/windows-nsis-uninstall"
          out.mkdir(parents=True, exist_ok=False)
          temporary = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          execution_root = temporary / "motionwright-uninstall-execution"
          control_root = temporary / "motionwright-nsis-current-user"
          modified_root = temporary / "motionwright-nsis-modified-owned"
          receipt = {
              "schema": "motionwright.ci.windows-nsis-uninstall/1",
              "status": "NOT_VERIFIED", "source_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "package_scope": os.environ.get("PACKAGE_SCOPE", "all"), "python": sys.version,
              "runner_profile": "disposable_hosted_runner_current_user",
              "explicit_elevation_requested": False,
              "processes": [], "cases": [], "evidence_errors": [],
              "claims": {
                  "human_install_acceptance": "NOT_RUN", "distribution_signature": "NOT_CLAIMED",
                  "project_edit_execution": "NOT_RUN", "product_export_execution": "NOT_RUN",
                  "cancelled_install_recovery": "NOT_RUN", "incomplete_install_recovery": "NOT_RUN",
                  "repeated_update_preservation": "NOT_RUN", "release_published": False,
              },
          }
          case_roots = {}
          original_project_database = None
          started = time.monotonic()

          def require(condition, code):
              if not condition:
                  raise RuntimeError(code)

          def save():
              (out / "receipt.json").write_text(
                  json.dumps(receipt, indent=2, sort_keys=True, allow_nan=False) + "\n", encoding="utf-8",
              )

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def record(path):
              initial = path.lstat()
              if initial.st_size == 0:
                  for component in (path, *path.parents):
                      info = component.lstat()
                      require(not component.is_symlink() and not packages._path_has_reparse(component, info),
                              "empty_file_path_not_ordinary")
                  require(stat.S_ISREG(initial.st_mode), "empty_file_not_regular")
                  with path.open("rb") as handle:
                      first = os.fstat(handle.fileno())
                      require(handle.read(1) == b"", "empty_file_grew")
                      final = os.fstat(handle.fileno())
                  stamp = lambda info: (info.st_dev, info.st_ino, info.st_size, info.st_mtime_ns, info.st_nlink)
                  require(stamp(initial) == stamp(first) == stamp(final) == stamp(path.lstat()),
                          "empty_file_changed")
                  return {"bytes": 0, "sha256": sha(b"")}
              _, size, digest = packages.verified_artifact(root, path)
              return {"bytes": size, "sha256": digest}

          def read_json(path):
              expected = record(path)
              require(expected["bytes"] <= 4 * 1024 * 1024, "record_exceeds_4MiB")
              data = path.read_bytes()
              require(len(data) == expected["bytes"] and sha(data) == expected["sha256"], "record_changed")
              return json.loads(data.decode("utf-8"), object_pairs_hook=packages._strict_object)

          def git(*args):
              return subprocess.check_output(["git", *args], timeout=20).decode("utf-8").strip()

          def source():
              packages._checkout(root, os.environ["GITHUB_SHA"])
              paths = (
                  "tooling/package_receipt.py", "tooling/candidate_smoke.py", "tooling/windows_cold_start.py",
                  ".github/workflows/package-candidate.yml", "apps/desktop/src-tauri/tauri.conf.json",
                  "Cargo.lock", "SOURCE_LOCK.json", "apps/studio/package-lock.json",
              )
              return {"checkout": git("rev-parse", "HEAD"), "tree": git("rev-parse", "HEAD^{tree}"),
                      "files": {name: record(root / name) for name in paths}}

          def inventory(directory):
              if not os.path.lexists(directory):
                  return {"directory_present": False, "files": {}, "directories": []}
              pending, files, directories, count, total = [(directory, 0)], {}, [], 0, 0
              while pending:
                  parent, depth = pending.pop()
                  info = parent.lstat()
                  require(depth <= 16 and stat.S_ISDIR(info.st_mode)
                          and not packages._path_has_reparse(parent, info) and not parent.is_symlink(),
                          "installation_directory_not_ordinary")
                  for path in sorted(parent.iterdir()):
                      count += 1
                      require(count <= 2048, "installation_inventory_exceeds_2048_entries")
                      relative = path.relative_to(directory).as_posix()
                      require(len(relative.encode("utf-8")) <= 1024, "installation_path_too_long")
                      info = path.lstat()
                      require(not packages._path_has_reparse(path, info) and not path.is_symlink(),
                              "installation_contains_link_or_reparse")
                      if stat.S_ISDIR(info.st_mode):
                          directories.append(relative)
                          pending.append((path, depth + 1))
                      else:
                          require(stat.S_ISREG(info.st_mode), "installation_contains_nonregular_entry")
                          observation = record(path)
                          total += observation["bytes"]
                          require(total <= 2 * 1024 * 1024 * 1024, "installation_inventory_exceeds_2GiB")
                          files[relative] = observation
              require(len({key.casefold() for key in files}) == len(files), "installation_case_collision")
              return {"directory_present": True, "files": files, "directories": sorted(directories)}

          def copy_exact(source_path, destination, expected):
              require(record(source_path) == expected, "copy_source_identity_differs")
              with source_path.open("rb") as source_file, destination.open("xb") as target:
                  remaining = expected["bytes"]
                  while remaining:
                      block = source_file.read(min(1024 * 1024, remaining))
                      require(block, "copy_source_ended_early")
                      require(target.write(block) == len(block), "copy_write_incomplete")
                      remaining -= len(block)
                  require(not source_file.read(1), "copy_source_grew")
                  target.flush()
                  os.fsync(target.fileno())
              require(record(source_path) == record(destination) == expected, "copy_bytes_changed")

          def invoke(label, executable, trailing, expected_executable):
              require(not any(char in str(executable) + trailing for char in '"\r\n'), "nonliteral_nsis_command")
              command = subprocess.list2cmdline([str(executable)]) + trailing
              require(record(executable) == expected_executable, "process_executable_changed_before_launch")
              row = {"label": label, "command_line": command, "shell": False,
                     "executable": expected_executable, "pid": None,
                     "returncode": None, "state": "NOT_VERIFIED", "timeout_seconds": 120}
              receipt["processes"].append(row)
              save()
              with (out / (label + ".stdout.log")).open("xb") as stdout, \
                      (out / (label + ".stderr.log")).open("xb") as stderr:
                  process = subprocess.Popen(
                      command, executable=str(executable), shell=False, stdin=subprocess.DEVNULL,
                      stdout=stdout, stderr=stderr, env=cold.native_windows_launch_environment(os.environ),
                  )
                  try:
                      row["pid"] = process.pid
                      row["state"] = "RUNNING"
                      save()
                      row["returncode"] = process.wait(timeout=120)
                      row["state"] = "EXITED"
                  except BaseException as error:
                      row["state"] = "UNKNOWN"
                      row["original_exception"] = {"type": type(error).__name__, "code": str(error)[:300]}
                      raise
                  finally:
                      if process.poll() is None:
                          row["state"] = "UNKNOWN"
                          try:
                              process.kill()
                              process.wait(timeout=10)
                          except Exception as error:
                              row["owned_process_reap"] = "NOT_VERIFIED"
                              row["cleanup_error"] = {"type": type(error).__name__, "code": str(error)[:300]}
                      row["observed_returncode_after_cleanup"] = process.poll()
                      save()
              (out / (label + ".exit-code.log")).write_text(str(row["returncode"]) + "\n", encoding="utf-8")
              require(row["state"] == "EXITED" and type(row["returncode"]) is int
                      and row["returncode"] == 0, label + "_did_not_complete_successfully")

          def project_snapshot():
              global original_project_database
              found = cold.known_databases([Path(os.environ["APPDATA"]), Path(os.environ["LOCALAPPDATA"])])
              require(len(found) == 1, "expected_one_real_installed_project_database")
              snapshot = {"project": cold.read_project_snapshot(found[0]), "database": record(found[0])}
              if original_project_database is None:
                  original_project_database = found[0]
              return snapshot

          def observe_original_project():
              require(original_project_database is not None, "original_project_database_not_bound")
              try:
                  original_project_database.lstat()
              except FileNotFoundError:
                  return {"status": "MISSING_DATABASE", "project_preserved": False}
              before = record(original_project_database)
              require(0 < before["bytes"] < 64 * 1024 * 1024, "original_project_database_size_invalid")
              with closing(sqlite3.connect(original_project_database.as_uri() + "?mode=ro",
                                           uri=True, timeout=3)) as database:
                  require(database.execute("PRAGMA quick_check").fetchone() == ("ok",),
                          "original_project_database_integrity_unverified")
                  present = database.execute(
                      "SELECT 1 FROM projects WHERE id = ? LIMIT 1",
                      (receipt["original_cold_project"]["project"]["project_id"],),
                  ).fetchone()
              require(record(original_project_database) == before, "original_project_database_changed_during_observation")
              if present is None:
                  return {"status": "MISSING_PROJECT", "project_preserved": False, "database": before}
              snapshot = project_snapshot()
              require(record(original_project_database) == before, "original_project_database_changed_during_snapshot")
              return {"status": "OBSERVED", "project_preserved": snapshot == receipt["original_cold_project"],
                      "snapshot": snapshot}

          def evidence_error(stage, error):
              receipt["evidence_errors"].append(
                  {"stage": stage, "type": type(error).__name__, "code": str(error)[:300]},
              )

          def prepare_case(label, directory, binary_name, change_byte):
              case_roots[label] = directory
              initial = inventory(directory)
              require(initial["directory_present"] and binary_name in initial["files"]
                      and "uninstall.exe" in initial["files"], "installed_payload_or_uninstaller_missing")
              row = {"id": label, "initial_inventory": initial,
                     "inventory_role": "observation_only_never_installer_authority", "status": "NOT_VERIFIED"}
              receipt["cases"].append(row)
              uninstaller_record = initial["files"]["uninstall.exe"]
              retained = out / (label + "-original-uninstaller.exe")
              copy_exact(directory / "uninstall.exe", retained, uninstaller_record)
              execution = execution_root / (label + "-uninstaller.exe")
              copy_exact(retained, execution, uninstaller_record)
              row["retained_original_uninstaller"] = {"filename": retained.name, **uninstaller_record}
              require(initial["files"][binary_name] == expected_binary, "installed_main_differs_from_same_package")
              sentinel = directory / "motionwright-unrelated-sentinel.bin"
              sentinel_bytes = b"Motionwright synthetic unrelated uninstall sentinel v1\n"
              with sentinel.open("xb") as handle:
                  require(handle.write(sentinel_bytes) == len(sentinel_bytes), "sentinel_write_incomplete")
                  handle.flush()
                  os.fsync(handle.fileno())
              row["foreign_before"] = record(sentinel)
              row["main_before"] = record(directory / binary_name)
              if change_byte:
                  binary = directory / binary_name
                  before = row["main_before"]
                  require(before["bytes"] > 128, "installed_main_too_short")
                  offset = before["bytes"] // 2
                  with binary.open("r+b", buffering=0) as handle:
                      require(os.fstat(handle.fileno()).st_size == before["bytes"], "mutation_size_changed")
                      handle.seek(offset)
                      old = handle.read(1)
                      require(len(old) == 1, "mutation_read_incomplete")
                      handle.seek(offset)
                      require(handle.write(bytes([old[0] ^ 1])) == 1, "mutation_write_incomplete")
                      os.fsync(handle.fileno())
                      require(os.fstat(handle.fileno()).st_size == before["bytes"], "mutation_resized_main")
                  changed = record(binary)
                  require(changed["bytes"] == before["bytes"] and changed["sha256"] != before["sha256"],
                          "one_byte_mutation_did_not_change_hash_at_same_size")
                  row["mutation"] = {"offset": offset, "old_byte": old[0], "new_byte": old[0] ^ 1,
                                     "after": changed, "modified_executable_launched": False}
              row["project_before"] = project_snapshot()
              require(row["project_before"] == original_project, "project_changed_before_uninstall")
              save()
              invoke(label + "-uninstall", execution, " /S _?=" + str(directory), uninstaller_record)
              row["after_inventory"] = inventory(directory)
              after = row["after_inventory"]["files"]
              row["foreign_preserved"] = after.get(sentinel.name) == row["foreign_before"]
              if change_byte:
                  row["main_disposition"] = (
                      "PRESERVED_MODIFIED" if after.get(binary_name) == row["mutation"]["after"] else "NOT_PRESERVED"
                  )
                  row["main_oracle_passed"] = row["main_disposition"] == "PRESERVED_MODIFIED"
              else:
                  row["main_disposition"] = "REMOVED_UNCHANGED" if binary_name not in after else "NOT_REMOVED"
                  row["main_oracle_passed"] = row["main_disposition"] == "REMOVED_UNCHANGED"
              try:
                  observation = observe_original_project()
                  row["project_observation"] = observation
                  row["project_after"] = observation.get("snapshot")
                  row["project_preserved"] = observation["project_preserved"]
              except Exception as error:
                  row["project_observation"] = {"status": "NOT_VERIFIED", "error_type": type(error).__name__}
                  row["project_preserved"] = None
                  evidence_error(label + "_project_observation", error)
              if not row["main_oracle_passed"] or not row["foreign_preserved"] or row["project_preserved"] is False:
                  row["status"] = "FAIL"
                  receipt["status"] = "FAIL"
              elif row["project_preserved"] is None:
                  row["status"] = "NOT_VERIFIED"
              else:
                  row["status"] = "PASS"
              save()
              require(row["status"] == "PASS", label + "_file_preservation_not_passed")

          save()
          try:
              require(sys.version_info[:2] == (3, 13), "Python313_required")
              require(receipt["package_scope"] in {"all", "windows-uninstall"}, "invalid_package_scope")
              require(os.name == "nt" and os.environ.get("GITHUB_ACTIONS") == "true"
                      and os.environ.get("RUNNER_OS") == "Windows", "disposable_Windows_runner_required")
              require(not os.path.lexists(execution_root) and not os.path.lexists(modified_root),
                      "new_uninstall_case_paths_required")
              execution_root.mkdir()
              before = source()
              receipt["source_before"] = before
              event = read_json(Path(os.environ["GITHUB_EVENT_PATH"]))
              pr = event.get("pull_request") or {}
              receipt["pr_head_metadata"] = (pr.get("head") or {}).get("sha")
              receipt["pr_base_metadata"] = (pr.get("base") or {}).get("sha")
              print("WINDOWS_UNINSTALL_CHECKOUT", before["checkout"], "TREE", before["tree"], flush=True)
              config = read_json(root / "apps/desktop/src-tauri/tauri.conf.json")
              require(config["bundle"]["windows"]["nsis"]["installMode"] == "currentUser",
                      "candidate_must_be_current_user")
              setups = list((root / "target/release/bundle/nsis").glob("*-setup.exe"))
              require(len(setups) == 1, "one_actual_nsis_setup_required")
              setup = setups[0]
              candidate = packages.make_receipt(root, before["checkout"], "windows", "x86_64", [setup])
              require(candidate == read_json(root / "ci-evidence/windows-candidate.json"), "actual_candidate_receipt_differs")
              receipt["candidate"] = candidate
              smoke = read_json(root / "ci-evidence/windows-nsis-smoke.json")
              expected_binary = {"bytes": smoke["automated_inspection"]["binary"]["binary_bytes"],
                                 "sha256": smoke["automated_inspection"]["binary"]["binary_sha256"]}
              require(type(expected_binary["bytes"]) is int and expected_binary["bytes"] > 128
                      and type(expected_binary["sha256"]) is str and len(expected_binary["sha256"]) == 64,
                      "invalid_installed_binary_record")
              binary_name = smoke["automated_inspection"]["binary"]["binary_filename"]
              require(Path(binary_name).name == binary_name and binary_name.casefold().endswith(".exe")
                      and binary_name.casefold() != "uninstall.exe", "invalid_installed_binary_name")
              cold.check_installed_candidate(root / "ci-evidence/windows-nsis-smoke.json",
                                             control_root / binary_name, before["checkout"])
              cold_proof = read_json(root / "ci-evidence/windows-nsis-cold-relaunch.json")
              original_project = project_snapshot()
              require(cold_proof["source_sha"] == before["checkout"]
                      and cold_proof["installed_binary_sha256"] == expected_binary["sha256"]
                      and cold_proof["same_project_generation_revision_document"] is True
                      and cold_proof["project"] == original_project["project"], "real_cold_project_binding_differs")
              receipt["original_cold_project"] = original_project
              prepare_case("unchanged-control", control_root, binary_name, False)
              case_roots["modified-owned"] = modified_root
              invoke("modified-case-install", setup, " /S /D=" + str(modified_root),
                     {"bytes": candidate["artifacts"][0]["bytes"], "sha256": candidate["artifacts"][0]["sha256"]})
              prepare_case("modified-owned", modified_root, binary_name, True)
              receipt["status"] = "PASS_PENDING_FINAL_EVIDENCE"
          except BaseException as error:
              receipt["failure"] = {"type": type(error).__name__, "code": str(error)[:300]}
              (out / "gate-error.log").write_text(traceback.format_exc(), encoding="utf-8")
          finally:
              for label, directory in case_roots.items():
                  try:
                      receipt.setdefault("final_installation_observations", {})[label] = inventory(directory)
                  except Exception as error:
                      evidence_error(label + "_final_inventory", error)
              try:
                  after = source()
                  receipt["source_after"] = after
                  require(after == receipt.get("source_before"), "source_changed_during_uninstall_gate")
              except Exception as error:
                  evidence_error("final_source", error)
              if "candidate" in receipt:
                  try:
                      observed_candidate = packages.make_receipt(root, receipt["source_sha"], "windows", "x86_64", [setup])
                      receipt["candidate_after"] = observed_candidate
                      require(observed_candidate == receipt["candidate"], "candidate_changed_during_uninstall_gate")
                  except Exception as error:
                      evidence_error("final_package", error)
              if "original_cold_project" in receipt:
                  try:
                      observation = observe_original_project()
                      receipt["final_project_observation"] = observation
                      receipt["final_project_oracle_status"] = "PASS" if observation["project_preserved"] else "FAIL"
                      if not observation["project_preserved"]:
                          receipt.setdefault("failure", {"type": "OracleFailure", "code": "original_project_changed_or_removed"})
                          if receipt["status"] == "PASS_PENDING_FINAL_EVIDENCE":
                              receipt["status"] = "FAIL"
                  except Exception as error:
                      receipt["final_project_oracle_status"] = "NOT_VERIFIED"
                      evidence_error("final_project", error)
              for case in receipt["cases"]:
                  retained = case.get("retained_original_uninstaller")
                  if retained:
                      try:
                          require(record(out / retained["filename"]) ==
                                  {"bytes": retained["bytes"], "sha256": retained["sha256"]},
                                  "retained_original_uninstaller_changed")
                      except Exception as error:
                          evidence_error(case["id"] + "_retained_uninstaller", error)
              receipt["retained_files"] = {}
              try:
                  retained_paths = sorted(out.iterdir())
              except Exception as error:
                  retained_paths = []
                  evidence_error("retained_files_inventory", error)
              for path in retained_paths:
                  if path.name == "receipt.json":
                      continue
                  try:
                      receipt["retained_files"][path.name] = record(path)
                  except Exception as error:
                      evidence_error("retained_file:" + path.name, error)
              if receipt["status"] == "PASS_PENDING_FINAL_EVIDENCE":
                  receipt["status"] = "PASS" if not receipt["evidence_errors"] else "NOT_VERIFIED"
              receipt["elapsed_seconds"] = time.monotonic() - started
              save()
              print(json.dumps({"windows_uninstall": receipt["status"], "failure": receipt.get("failure"),
                                "evidence_errors": receipt["evidence_errors"]}, sort_keys=True), flush=True)
          raise SystemExit(0 if receipt["status"] == "PASS" else 1)
      - name: Preserve sanitized Windows first-use failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-windows-relaunch-failure-${{ github.sha }}
          path: |
            ci-evidence/windows-candidate.json
            ci-evidence/windows-nsis-smoke.json
            ci-evidence/windows-nsis-cold-relaunch-diagnostic.json
          if-no-files-found: warn
      - name: Retain complete Windows uninstall observations and original uninstaller bytes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-windows-uninstall-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/windows-nsis-uninstall
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: motionwright-windows-candidate
          path: |
            target/release/bundle/nsis/*-setup.exe
            ci-evidence/windows-candidate.json
            ci-evidence/windows-nsis-smoke.json
            ci-evidence/windows-nsis-cold-relaunch.json
          if-no-files-found: error

  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.package_scope != 'windows-uninstall'
    needs: receipt-policy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: false
      - name: Install locked Studio and Tauri CLI dependencies
        run: npm --prefix apps/studio ci --no-audit --no-fund
      - name: Build unsigned macOS DMG candidate
        run: |
          cd apps/desktop
          npm --prefix ../studio exec -- tauri build --bundles dmg
      - name: Record exact macOS candidate artifact
        run: |
          dmg_count="$(find target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' | wc -l)"
          test "$dmg_count" -eq 1
          dmg="$(find target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print)"
          arch="$(uname -m)"
          python3 tooling/package_receipt.py \
            --git-sha "$GITHUB_SHA" \
            --platform macos \
            --arch "$arch" \
            --artifact "$dmg" \
            --output ci-evidence/macos-candidate.json
      - name: Read-only DMG mount, copy application and inspect macOS Mach-O
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          dmg="$(find target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          work="$RUNNER_TEMP/motionwright-macos-smoke"
          mkdir -p "$work/mount" "$work/installed"
          hdiutil attach -readonly -nobrowse -mountpoint "$work/mount" "$dmg" >/dev/null
          trap 'hdiutil detach "$work/mount" -quiet || true' EXIT
          app_count="$(find "$work/mount" -maxdepth 1 -type d -name '*.app' | wc -l)"
          test "$app_count" -eq 1
          app="$(find "$work/mount" -maxdepth 1 -type d -name '*.app' -print -quit)"
          ditto "$app" "$work/installed/Motionwright.app"
          plist="$work/installed/Motionwright.app/Contents/Info.plist"
          test -f "$plist"
          exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          binary="$work/installed/Motionwright.app/Contents/MacOS/$exe"
          test -f "$binary"
          python3 tooling/candidate_smoke.py \
            --candidate-receipt ci-evidence/macos-candidate.json \
            --expected-source-sha "$GITHUB_SHA" \
            --kind dmg --method dmg_readonly_mount_copy \
            --artifact "$dmg" --installed-binary "$binary" \
            --mac-info-plist "$plist" \
            --output ci-evidence/macos-dmg-smoke.json
          # No unsigned application is force-launched and no Gatekeeper,
          # signing, notarization or user-level protection is disabled.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-macos-candidate
          path: |
            target/release/bundle/dmg/*.dmg
            ci-evidence/macos-candidate.json
            ci-evidence/macos-dmg-smoke.json
          if-no-files-found: error

  # Keep OIDC/Sigstore/attestation write permissions in this dedicated job.
  # The three package-build jobs continue to have contents:read only.
  # Ordinary PRs cannot mint trusted candidate provenance: source checks run
  # on PRs, while this job is NOT_RUN until trusted dispatch or main push.
  attest-candidates:
    name: Candidate GH provenance (trusted runs only)
    if: github.event_name == 'workflow_dispatch' && inputs.package_scope != 'windows-uninstall' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: motionwright-linux-candidate
          path: candidates/linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: motionwright-windows-candidate
          path: candidates/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: motionwright-macos-candidate
          path: candidates/macos
      - name: Verify all four downloaded packages match unsigned source-bound receipts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/motionwright-provenance"
          python3 -m unittest discover -s tooling/tests -p test_candidate_attestation_input.py -v
          python3 tooling/candidate_attestation_input.py \
            --source-sha "$GITHUB_SHA" \
            --download-root "$GITHUB_WORKSPACE/candidates" \
            --output-dir "$RUNNER_TEMP/motionwright-provenance"
          test "$(wc -l < "$RUNNER_TEMP/motionwright-provenance/verified-subject-paths.txt")" -eq 4
      # A GitHub workflow attestation is NOT an Authenticode signature, Apple
      # Developer signature/notarization, human approval or a release gate.
      - name: Attest exact candidate package bytes through GitHub Sigstore
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            candidates/linux/**/*.AppImage
            candidates/linux/**/*.deb
            candidates/windows/**/*-setup.exe
            candidates/macos/**/*.dmg
      - name: Independently verify each of the four signed candidate digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r subject; do
            test -f "$subject"
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/package-candidate.yml" \
              --source-digest "$GITHUB_SHA" >/dev/null
            count=$((count+1))
          done < "$RUNNER_TEMP/motionwright-provenance/verified-subject-paths.txt"
          test "$count" -eq 4
          echo "v01-candidate-gh-attestation=VERIFIED subjects=4 unsigned_installers=YES human_acceptance=NOT_RUN release=BLOCKED"
      # Exercise the identical read-only pre-install verification contract
      # an owner can run, on an ACTUAL downloaded NSIS installer + GH signature.
      # This is CI technical evidence, NOT an owner-installed/human PASS.
      - name: Verify actual candidate using owner-side provenance CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t installers < <(find candidates/windows -type f -name '*-setup.exe')
          test "${#installers[@]}" -eq 1
          test -f "$GITHUB_WORKSPACE/candidates/windows/ci-evidence/windows-candidate.json"
          python3 tooling/owner_candidate_provenance.py \
            --source-sha "$GITHUB_SHA" \
            --bundle-kind nsis \
            --artifact "$GITHUB_WORKSPACE/${installers[0]}" \
            --candidate-receipt "$GITHUB_WORKSPACE/candidates/windows/ci-evidence/windows-candidate.json" \
            --output "$RUNNER_TEMP/motionwright-provenance/ci-preinstall-provenance.json"
          python3 -m json.tool "$RUNNER_TEMP/motionwright-provenance/ci-preinstall-provenance.json" >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-v01-candidate-provenance-inputs
          path: |
            ${{ runner.temp }}/motionwright-provenance/verified-candidate-inputs.json
            ${{ runner.temp }}/motionwright-provenance/ci-preinstall-provenance.json
          if-no-files-found: error

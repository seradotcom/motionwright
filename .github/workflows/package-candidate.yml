permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  receipt-policy:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Quick source and conformance policies for every verification scope
        run: |
          python3 tooling/source_policy.py
          python3 tooling/acceptance_policy.py
          python3 tooling/creative_status_policy.py
          python3 tooling/public_surface_policy.py
      - name: Candidate receipt and installed-package smoke policy tests
        run: |
          python3 -m unittest tooling/tests/test_package_receipt.py tooling/tests/test_candidate_receipt_source.py tooling/tests/test_candidate_attestation_input.py tooling/tests/test_owner_candidate_provenance.py
          python3 -m unittest tooling/tests/test_candidate_smoke.py tooling/tests/test_windows_cold_start.py tooling/tests/test_linux_cold_start.py tooling/tests/test_linux_gui_readiness.py tooling/tests/test_storage_schema_contract.py tooling/tests/test_source_checkout_observation.py

      - name: Linux first-use gate control tests in both import modes
        run: |
          python3 -B -E -s -m unittest discover -s tooling/tests -p test_ci_linux_first_use.py -v
          python3 -B -E -s -m unittest tooling.tests.test_ci_linux_first_use -v

      - name: Require closed selected source contracts through both entrypoints on Linux
        env:
          SOURCE_CONTRACT_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'distribution_source' && 'distribution_source' || 'nsis_source' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -E -s -m unittest tooling.tests.test_ci_nsis_source_selection -v
          python3 -B -E -s -m tooling.ci_suites.nsis_source_selection --scope "$SOURCE_CONTRACT_SCOPE" --repo "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/mw-nsis-linux-source-tests" --expected-source "$GITHUB_SHA"
      - name: Require sixty-three lifecycle contracts through both existing runner entrypoints
        if: github.event_name != 'workflow_dispatch' || inputs.verification_scope != 'distribution_source'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          ROOT = Path(os.environ["GITHUB_WORKSPACE"])
          sys.path.insert(0, str(ROOT / "tooling"))
          from release_manifest import write_new_manifest
          from windows_installer_lifecycle import require, source_observation

          SOURCE = os.environ["GITHUB_SHA"]
          before = source_observation(ROOT, SOURCE)
          output = Path(os.environ["RUNNER_TEMP"]) / "motionwright-nsis-lifecycle-contracts"
          output.mkdir(parents=True)
          report = output / "receipt.json"
          completed = subprocess.run([
              sys.executable, "-B", "-I", "-S", "tooling/ci_test_runner.py",
              "--repo", str(ROOT), "--test-directory", "tooling/tests",
              "--pattern", "test_windows_installer_lifecycle.py", "--mode", "both",
              "--report", str(report), "--expected-source", SOURCE,
              "--require-complete", "--timeout", "180"], cwd=ROOT, check=False)
          require(completed.returncode == 0, "lifecycle_contract_runner_failed")
          receipt = json.loads(report.read_bytes())
          test_path = "tooling/tests/test_windows_installer_lifecycle.py"
          tree = ast.parse((ROOT / test_path).read_bytes())
          classes = [item for item in tree.body if isinstance(item, ast.ClassDef)
                     and any(isinstance(method, ast.FunctionDef) and method.name.startswith("test_")
                             for method in item.body)]
          expected_classes = {"WindowsLifecycleTests": 52, "StorageCohortLifecycleTests": 11}
          require({item.name for item in classes} == set(expected_classes)
                  and len(classes) == len(expected_classes), "lifecycle_contract_class_count")
          methods = [f"{item.name}.{method.name}" for item in classes for method in item.body
                     if isinstance(method, ast.FunctionDef) and method.name.startswith("test_")]
          all_methods = [item.name for item in ast.walk(tree)
                         if isinstance(item, (ast.FunctionDef, ast.AsyncFunctionDef))
                         and item.name.startswith("test_")]
          require(all(sum(isinstance(method, ast.FunctionDef) and method.name.startswith("test_")
                          for method in item.body) == expected_classes[item.name] for item in classes)
                  and len(methods) == len(set(methods)) == len(all_methods) == 63
                  and not any(isinstance(item, (ast.FunctionDef, ast.AsyncFunctionDef))
                              and item.name == "load_tests" for item in ast.walk(tree)),
                  "lifecycle_contract_inventory_changed")
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          entries = ["discovery:test_windows_installer_lifecycle.py",
                     "dotted:tooling.tests.test_windows_installer_lifecycle"]
          require(receipt.get("schema") == "motionwright.unittest-execution/1"
                  and receipt.get("status") == "PASS" and type(receipt.get("exit_code")) is int
                  and receipt["exit_code"] == 0
                  and receipt.get("require_complete") is True
                  and receipt.get("executed_source_sha") == SOURCE
                  and receipt.get("tree_sha") == before["tree"]
                  and not receipt.get("source_postcheck_error")
                  and [step.get("entry_point") for step in receipt.get("steps", [])] == entries
                  and receipt.get("test_definition_sha256") == {test_path: digest(ROOT / test_path)}
                  and receipt.get("runner_sha256") == digest(ROOT / "tooling/ci_test_runner.py"),
                  "lifecycle_contract_receipt_identity")
          for key in ("GITHUB_SHA", "GITHUB_WORKFLOW_REF", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_JOB"):
              require(receipt.get("github", {}).get(key) == os.environ[key],
                      "lifecycle_contract_receipt_job")
          inventory = {}
          for index, step in enumerate(receipt["steps"]):
              counts = step.get("counts", {})
              require(step.get("status") == "PASS" and type(step.get("exit_code")) is int
                      and step["exit_code"] == 0
                      and counts.get("terminal_status") == "OK"
                      and type(counts.get("tests_run")) is int and counts["tests_run"] == 63
                      and type(counts.get("passed")) is int and counts["passed"] == 63
                      and all(type(counts.get(key)) is int and counts[key] == 0 for key in
                              ("failures", "errors", "skipped", "expected_failures", "unexpected_successes")),
                      "lifecycle_contract_omission")
              for stream in ("stdout", "stderr"):
                  path = report.with_name(f"{report.stem}-{index:02d}-{stream}.log")
                  require(step.get(stream) == {"file": path.name, "sha256": digest(path)},
                          "lifecycle_contract_log_binding")
              raw = report.with_name(f"{report.stem}-{index:02d}-stderr.log").read_text(encoding="utf-8")
              observed = re.findall(r"(?m)^test_\w+ \(([^()\n]+)\) \.\.\. ok$", raw.replace("\r\n", "\n"))
              module = "test_windows_installer_lifecycle" if index == 0 else "tooling.tests.test_windows_installer_lifecycle"
              expected = {f"{module}.{method}" for method in methods}
              require(len(observed) == 63 and set(observed) == expected,
                      "lifecycle_contract_original_names")
              inventory[step["entry_point"]] = sorted(observed)
          after = source_observation(ROOT, SOURCE)
          require(after == before, "lifecycle_contract_source_changed")
          write_new_manifest(ROOT, output / "readback.json", {
              "schema": "motionwright.windows-lifecycle-contracts/1", "platform": sys.platform,
              "source_before": before, "source_after": after, "receipt_sha256": digest(report),
              "github": receipt["github"], "entrypoint_methods": inventory,
              "unique_controls": 63, "entrypoints": 2, "skipped": 0,
              "scope": "OFFLINE_CONTRACTS_AND_TEMPORARY_SQLITE_ONLY",
              "PE_native_version_observation": "NOT_RUN", "installer_execution": "NOT_RUN",
              "human_acceptance": "NOT_RUN", "release_published": False})
          PY
      - name: Retain exact lifecycle contract receipts
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.verification_scope != 'distribution_source')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-nsis-lifecycle-contracts-linux
          path: ${{ runner.temp }}/motionwright-nsis-lifecycle-contracts/*
          if-no-files-found: warn
      - name: Retain the exact Linux selected source-test result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'distribution_source' && 'motionwright-distribution-linux-source-tests' || 'motionwright-nsis-linux-source-tests' }}
          path: |
            ${{ runner.temp }}/mw-nsis-linux-source-tests/*.json
            ${{ runner.temp }}/mw-nsis-linux-source-tests/*.log
          if-no-files-found: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'distribution_source' && 'error' || 'warn' }}

  nsis-source-windows:
    if: github.event_name != 'workflow_dispatch' || (inputs.verification_scope != 'linux_first_use_source' && inputs.verification_scope != 'linux_first_use')
    needs: receipt-policy
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.16'
      - name: Require closed selected source contracts through both entrypoints on Windows
        env:
          SOURCE_CONTRACT_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'distribution_source' && 'distribution_source' || 'nsis_source' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B -E -s -m unittest tooling.tests.test_ci_nsis_source_selection -v
          if ($LASTEXITCODE -ne 0) { throw 'The source selection guards failed' }
          python -B -E -s -m tooling.ci_suites.nsis_source_selection --scope "$env:SOURCE_CONTRACT_SCOPE" --repo "$env:GITHUB_WORKSPACE" --output "$env:RUNNER_TEMP/mw-nsis-windows-source-tests" --expected-source "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'The Windows selected source gate failed' }
      - name: Require sixty-three lifecycle contracts through both existing runner entrypoints
        if: github.event_name != 'workflow_dispatch' || inputs.verification_scope != 'distribution_source'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import ast
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          ROOT = Path(os.environ["GITHUB_WORKSPACE"])
          sys.path.insert(0, str(ROOT / "tooling"))
          from release_manifest import write_new_manifest
          from windows_installer_lifecycle import require, source_observation

          SOURCE = os.environ["GITHUB_SHA"]
          before = source_observation(ROOT, SOURCE)
          output = Path(os.environ["RUNNER_TEMP"]) / "motionwright-nsis-lifecycle-contracts"
          output.mkdir(parents=True)
          report = output / "receipt.json"
          completed = subprocess.run([
              sys.executable, "-B", "-I", "-S", "tooling/ci_test_runner.py",
              "--repo", str(ROOT), "--test-directory", "tooling/tests",
              "--pattern", "test_windows_installer_lifecycle.py", "--mode", "both",
              "--report", str(report), "--expected-source", SOURCE,
              "--require-complete", "--timeout", "180"], cwd=ROOT, check=False)
          require(completed.returncode == 0, "lifecycle_contract_runner_failed")
          receipt = json.loads(report.read_bytes())
          test_path = "tooling/tests/test_windows_installer_lifecycle.py"
          tree = ast.parse((ROOT / test_path).read_bytes())
          classes = [item for item in tree.body if isinstance(item, ast.ClassDef)
                     and any(isinstance(method, ast.FunctionDef) and method.name.startswith("test_")
                             for method in item.body)]
          expected_classes = {"WindowsLifecycleTests": 52, "StorageCohortLifecycleTests": 11}
          require({item.name for item in classes} == set(expected_classes)
                  and len(classes) == len(expected_classes), "lifecycle_contract_class_count")
          methods = [f"{item.name}.{method.name}" for item in classes for method in item.body
                     if isinstance(method, ast.FunctionDef) and method.name.startswith("test_")]
          all_methods = [item.name for item in ast.walk(tree)
                         if isinstance(item, (ast.FunctionDef, ast.AsyncFunctionDef))
                         and item.name.startswith("test_")]
          require(all(sum(isinstance(method, ast.FunctionDef) and method.name.startswith("test_")
                          for method in item.body) == expected_classes[item.name] for item in classes)
                  and len(methods) == len(set(methods)) == len(all_methods) == 63
                  and not any(isinstance(item, (ast.FunctionDef, ast.AsyncFunctionDef))
                              and item.name == "load_tests" for item in ast.walk(tree)),
                  "lifecycle_contract_inventory_changed")
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          entries = ["discovery:test_windows_installer_lifecycle.py",
                     "dotted:tooling.tests.test_windows_installer_lifecycle"]
          require(receipt.get("schema") == "motionwright.unittest-execution/1"
                  and receipt.get("status") == "PASS" and type(receipt.get("exit_code")) is int
                  and receipt["exit_code"] == 0
                  and receipt.get("require_complete") is True
                  and receipt.get("executed_source_sha") == SOURCE
                  and receipt.get("tree_sha") == before["tree"]
                  and not receipt.get("source_postcheck_error")
                  and [step.get("entry_point") for step in receipt.get("steps", [])] == entries
                  and receipt.get("test_definition_sha256") == {test_path: digest(ROOT / test_path)}
                  and receipt.get("runner_sha256") == digest(ROOT / "tooling/ci_test_runner.py"),
                  "lifecycle_contract_receipt_identity")
          for key in ("GITHUB_SHA", "GITHUB_WORKFLOW_REF", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_JOB"):
              require(receipt.get("github", {}).get(key) == os.environ[key],
                      "lifecycle_contract_receipt_job")
          inventory = {}
          for index, step in enumerate(receipt["steps"]):
              counts = step.get("counts", {})
              require(step.get("status") == "PASS" and type(step.get("exit_code")) is int
                      and step["exit_code"] == 0
                      and counts.get("terminal_status") == "OK"
                      and type(counts.get("tests_run")) is int and counts["tests_run"] == 63
                      and type(counts.get("passed")) is int and counts["passed"] == 63
                      and all(type(counts.get(key)) is int and counts[key] == 0 for key in
                              ("failures", "errors", "skipped", "expected_failures", "unexpected_successes")),
                      "lifecycle_contract_omission")
              for stream in ("stdout", "stderr"):
                  path = report.with_name(f"{report.stem}-{index:02d}-{stream}.log")
                  require(step.get(stream) == {"file": path.name, "sha256": digest(path)},
                          "lifecycle_contract_log_binding")
              raw = report.with_name(f"{report.stem}-{index:02d}-stderr.log").read_text(encoding="utf-8")
              observed = re.findall(r"(?m)^test_\w+ \(([^()\n]+)\) \.\.\. ok$", raw.replace("\r\n", "\n"))
              module = "test_windows_installer_lifecycle" if index == 0 else "tooling.tests.test_windows_installer_lifecycle"
              expected = {f"{module}.{method}" for method in methods}
              require(len(observed) == 63 and set(observed) == expected,
                      "lifecycle_contract_original_names")
              inventory[step["entry_point"]] = sorted(observed)
          after = source_observation(ROOT, SOURCE)
          require(after == before, "lifecycle_contract_source_changed")
          write_new_manifest(ROOT, output / "readback.json", {

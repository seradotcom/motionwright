            --candidate-smoke ci-evidence/windows-nsis-smoke.json `
            --expected-source-sha "$env:GITHUB_SHA" --storage-source-repo "$env:GITHUB_WORKSPACE" `
            --scratch "$scratch" `
            --output "$proofPath"
          if ($LASTEXITCODE -ne 0) {

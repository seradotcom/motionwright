                      members[suffix] = {
                          "file": "files/" + source.name, "bytes": size, "sha256": digest,
                          "capture_identity": token(destination),
                      }
                  after_hashes = family_content(database, before, "empty-after-" + label)
                  after = family_tokens(database)
                  copied_hashes = {
                      suffix: (None if member is None else
                               {"bytes": member["bytes"], "sha256": member["sha256"]})
                      for suffix, member in members.items()
                  }
                  require(after == before and after_hashes == before_hashes == copied_hashes,
                          "project_family_changed_across_complete_copy")
                  captured_tokens = family_tokens(payload_dir / database.name)
                  require(all(captured_tokens[suffix] ==
                              (None if item is None else item["capture_identity"])
                              for suffix, item in members.items()),
                          "project_capture_family_changed_before_seal")
                  seal = {
                      "schema": "motionwright-windows-update-project-capture-seal/1",
                      "source_sha": SOURCE, "label": label, "status": "SEALED_COMPLETE_FAMILY",
                      "database_name": database.name, "source_before": before, "source_after": after,
                      "source_hashes_before": before_hashes, "source_hashes_after": after_hashes,
                      "members": members, "scope": intent["scope"],
                      "independent_readback": "SEPARATE_RECEIPT",
                      "human_acceptance": "NOT_RUN",
                  }
                  seal_identity = write_new(folder / "capture-seal.json", seal)
                  # SQLite may change the SHM file even during a read-only connection.
                  # Open a second complete copy, never a member of the sealed evidence.
                  clone_dir = CASE / ("independent-readback-" + label)
                  clone_dir.mkdir()
                  clones = {}
                  for suffix, member in members.items():
                      if member is None:
                          continue
                      source = payload_dir / (database.name + suffix)
                      destination = clone_dir / source.name
                      digest, size, cloned = owned._capture(source, destination)
                      require({"bytes": size, "sha256": digest} ==
                              {"bytes": member["bytes"], "sha256": member["sha256"]}
                              and (cloned.st_dev, cloned.st_ino) !=
                              (member["capture_identity"]["device"], member["capture_identity"]["inode"]),
                              "independent_reopen_copy_differs_from_sealed_member")
                      clones[suffix] = {"bytes": size, "sha256": digest}
                  clone_before = family_tokens(clone_dir / database.name)
                  require(all((clone_before[suffix] is None) == (members[suffix] is None)
                              for suffix in FAMILY_SUFFIXES), "independent_reopen_family_presence_differs")
                  project = read_project_snapshot(clone_dir / database.name)
                  require(project == expected_project, "captured_project_identity_or_document_differs")
                  require(family_tokens(payload_dir / database.name) == captured_tokens
                          and identity(folder / "capture-seal.json") == seal_identity,
                          "sealed_capture_changed_during_independent_reopen")
                  readback = {
                      "schema": "motionwright-windows-update-project-readback/1",
                      "source_sha": SOURCE, "label": label,
                      "status": "PASS", "capture_seal": seal_identity,
                      "copied_members": clones, "project": project,
                      "reader": "windows_cold_start.read_project_snapshot",
                      "connection": "mode=ro_on_a_separate_complete_copy",
                      "sealed_members_opened_by_sqlite": False,
                      "human_acceptance": "NOT_RUN",
                  }
                  readback_identity = write_new(folder / "independent-readback.json", readback)
                  result = {
                      "label": label, "status": "SEALED_AND_INDEPENDENTLY_REOPENED",
                      "capture_seal": seal_identity, "readback": readback_identity,
                      "members": members, "project": project,

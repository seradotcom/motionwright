              "github": receipt["github"], "entrypoint_methods": inventory,
              "unique_controls": 63, "entrypoints": 2, "skipped": 0,
              "scope": "OFFLINE_CONTRACTS_AND_TEMPORARY_SQLITE_ONLY",
              "PE_native_version_observation": "NOT_RUN", "installer_execution": "NOT_RUN",
              "human_acceptance": "NOT_RUN", "release_published": False})
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'The source-bound NSIS lifecycle gate failed' }
      - name: Retain exact lifecycle contract receipts
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.verification_scope != 'distribution_source')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-nsis-lifecycle-contracts-windows
          path: ${{ runner.temp }}/motionwright-nsis-lifecycle-contracts/*
          if-no-files-found: warn
      - name: Retain the exact Windows selected source-test result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'distribution_source' && 'motionwright-distribution-windows-source-tests' || 'motionwright-nsis-windows-source-tests' }}
          path: |
            ${{ runner.temp }}/mw-nsis-windows-source-tests/*.json
            ${{ runner.temp }}/mw-nsis-windows-source-tests/*.log
          if-no-files-found: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'distribution_source' && 'error' || 'warn' }}

  linux-first-use-source:
    if: github.event_name == 'workflow_dispatch' && (inputs.verification_scope == 'linux_first_use_source' || inputs.verification_scope == 'linux_first_use')
    needs: receipt-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Exact Linux source roster in discovery and dotted module modes
        shell: bash
        env:
          MW_CI_JOB_TEST_TMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -E -s tooling/ci_linux_first_use.py source \
            --repo "$GITHUB_WORKSPACE" --source "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/linux-first-use-source"
      - name: Preserve exact source execution originals on every terminal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-first-use-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/linux-first-use-source/
          if-no-files-found: error
          retention-days: 30

  linux-first-use-installed:
    if: github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'linux_first_use'
    needs: [receipt-policy, linux-first-use-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-first-use-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/linux-first-use-source-admitted
      - name: Reserve one exact run and source before build or installed effects
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -E -s tooling/ci_linux_first_use.py reserve \
            --repo "$GITHUB_WORKSPACE" --source "$GITHUB_SHA" \
            --namespace "$RUNNER_TEMP/linux-first-use-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_SHA" \
            --source-evidence "$RUNNER_TEMP/linux-first-use-source-admitted"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: false
      - name: Install Linux desktop bundling and system Python AT-SPI prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libfuse2 xvfb x11-utils dbus-x11 python3-gi gir1.2-atspi-2.0 at-spi2-core
      - name: Install locked Studio and Tauri CLI dependencies
        run: npm --prefix apps/studio ci --no-audit --no-fund
      - name: Build unsigned Linux candidate bundles
        run: |
          cd apps/desktop
          npm --prefix ../studio exec -- tauri build --bundles deb,appimage
      - name: Verify actual Linux candidate compiled the reviewed local glib source
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          /usr/bin/python3 -B -E -s tooling/v01_glib_product_admission.py --output ci-evidence/glib-patched-source.json
          cargo tree --locked -p motionwright-desktop --target x86_64-unknown-linux-gnu -i glib > ci-evidence/glib-compiled-owner-tree.txt
          grep -F 'vendor/glib-0.18.5' ci-evidence/glib-compiled-owner-tree.txt >/dev/null
          count="$(find target/release/deps -maxdepth 1 -type f -name 'libglib-*.rlib' | wc -l)"
          test "$count" -ge 1
          echo 'v01-glib-product-candidate=LOCAL_BACKPORT_COMPILED linux_installed_gui=NOT_YET_VERIFIED'
      - name: Record exact Linux candidate artifacts
        run: |
          appimage_count="$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | wc -l)"
          deb_count="$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' | wc -l)"
          test "$appimage_count" -eq 1
          test "$deb_count" -eq 1
          appimage="$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print)"
          deb="$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print)"
          /usr/bin/python3 -B -E -s tooling/package_receipt.py \
            --git-sha "$GITHUB_SHA" \
            --platform linux \
            --arch x86_64 \
            --artifact "$appimage" \
            --artifact "$deb" \
            --output ci-evidence/linux-candidate.json
      - name: One accessible first-use attempt and a read-only cold relaunch
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          deb="$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          appimage="$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          work="$RUNNER_TEMP/linux-first-use-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_SHA"
          test -f "$work/reservation.json"
          mkdir "$work/deb" "$work/appimage"
          dpkg-deb --extract "$deb" "$work/deb"
          mapfile -t deb_bins < <(find "$work/deb/usr/bin" -maxdepth 1 -type f -executable -iname "*motionwright*")
          mapfile -t deb_desktop < <(find "$work/deb/usr/share/applications" -maxdepth 1 -type f -name '*.desktop')
          test "${#deb_bins[@]}" -eq 1
          test "${#deb_desktop[@]}" -eq 1
          /usr/bin/python3 -B -E -s tooling/candidate_smoke.py \
            --candidate-receipt ci-evidence/linux-candidate.json \
            --expected-source-sha "$GITHUB_SHA" \
            --kind deb --method deb_extract \
            --artifact "$deb" --installed-binary "${deb_bins[0]}" \
            --linux-desktop-entry "${deb_desktop[0]}" \
            --output ci-evidence/linux-deb-smoke.json
          echo "Debian extracted program and desktop metadata validated"
          chmod u+x "$appimage"
          echo "Extracting AppImage to disposable runner directory"
          if ! (cd "$work/appimage" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null); then
            echo "::error::AppImage extraction failed (no FUSE or sandbox bypass was attempted)"
            exit 1
          fi
          extracted="$work/appimage/squashfs-root"
          if ! test -x "$extracted/AppRun"; then
            echo "::error::AppImage extraction contains no executable AppRun"
            find "$extracted" -maxdepth 2 -name 'AppRun' -o -name '*.desktop'
            exit 1
          fi
          mapfile -t image_bins < <(find "$extracted/usr/bin" -maxdepth 1 -type f -executable -iname "*motionwright*")
          mapfile -t image_desktop < <(find "$extracted" -maxdepth 1 -name '*.desktop')
          if [ "${#image_bins[@]}" -ne 1 ]; then
            echo "::error::Expected one Motionwright binary in extracted AppImage, found ${#image_bins[@]}"
            find "$extracted/usr/bin" -maxdepth 1 -type f -printf '%f\n'
            exit 1
          fi
          if [ "${#image_desktop[@]}" -ne 1 ]; then
            echo "::error::Expected one AppImage desktop entry, found ${#image_desktop[@]}"
            find "$extracted" -maxdepth 1 -name '*.desktop' -printf '%f\n'
            exit 1
          fi
          echo "One accessible creation attempt; second real window has no interaction"
          xvfb-run -a -s "-screen 0 1440x940x24" \
            dbus-run-session -- /usr/bin/python3 -B -E -s tooling/ci_linux_first_use.py installed \
              --repo "$GITHUB_WORKSPACE" --source "$GITHUB_SHA" --namespace "$work" \
              --app-run "$extracted/AppRun" --binary "${image_bins[0]}" \
              --artifact "$appimage" --candidate-receipt ci-evidence/linux-candidate.json
          /usr/bin/python3 -B -E -s tooling/candidate_smoke.py \
            --candidate-receipt ci-evidence/linux-candidate.json \
            --expected-source-sha "$GITHUB_SHA" \
            --kind appimage --method appimage_extract \
            --artifact "$appimage" --installed-binary "${image_bins[0]}" \
            --linux-desktop-entry "${image_desktop[0]}" \
            --linux-gui-probe "$work/window.json" \
            --output ci-evidence/linux-appimage-smoke.json
      - name: Retain bounded first-use originals without following application data links
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/linux-first-use-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_SHA"
          /usr/bin/python3 -B -E -s tooling/ci_linux_first_use.py retain \
            --repo "$GITHUB_WORKSPACE" --source "$GITHUB_SHA" \
            --namespace "$work" --output "$work-custody"
      - name: Admit only fixed retained files for upload
        id: first-use-originals-custody
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/linux-first-use-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_SHA"
          /usr/bin/python3 -B -E -s tooling/ci_linux_first_use.py admit-upload \
            --repo "$GITHUB_WORKSPACE" --source "$GITHUB_SHA" \
            --namespace "$work" --output "$work-custody" >> "$GITHUB_OUTPUT"
      - name: Preserve admitted first-use archive or explicit custody refusal
        if: always() && steps.first-use-originals-custody.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-first-use-installed-originals-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/linux-first-use-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-custody/originals.zip
            ${{ runner.temp }}/linux-first-use-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-custody/custody.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve exact unsigned package payloads for the installed attempt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-first-use-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: warn
          retention-days: 30


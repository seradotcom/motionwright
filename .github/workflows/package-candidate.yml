          def previous_registry_absence():
              import winreg
              uninstall_root = r"SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall"
              fixed = (
                  uninstall_root + r"\Motionwright",
                  r"Software\seradotcom\Motionwright",
              )
              results = []
              started = time.monotonic()
              for hive_name, hive in (("HKCU", winreg.HKEY_CURRENT_USER), ("HKLM", winreg.HKEY_LOCAL_MACHINE)):
                  for view_name, view in (("32", winreg.KEY_WOW64_32KEY), ("64", winreg.KEY_WOW64_64KEY)):
                      absent_keys = []
                      for key_path in fixed:
                          try:
                              key = winreg.OpenKey(hive, key_path, 0, winreg.KEY_READ | view)
                          except FileNotFoundError:
                              absent_keys.append(key_path)
                          else:
                              key.Close()
                              raise GateError("stock_predecessor_found_a_preexisting_registration")
                      count = 0
                      try:
                          parent = winreg.OpenKey(hive, uninstall_root, 0, winreg.KEY_READ | view)
                      except FileNotFoundError:
                          parent = None
                      if parent is not None:
                          with parent:
                              subkeys, _, _ = winreg.QueryInfoKey(parent)
                              require(subkeys <= 4096, "stock_predecessor_registry_inventory_exceeds_bound")
                              for index in range(subkeys):
                                  require(time.monotonic() - started <= 40,
                                          "stock_predecessor_registry_inspection_exceeded_deadline")
                                  name = winreg.EnumKey(parent, index)
                                  # Never retain other installed products' names or commands.
                                  with winreg.OpenKey(parent, name, 0, winreg.KEY_READ | view) as key:
                                      values = []
                                      for field in ("DisplayName", "Publisher"):
                                          try:
                                              value, kind = winreg.QueryValueEx(key, field)
                                          except FileNotFoundError:
                                              value = ""
                                              kind = winreg.REG_SZ
                                          require(kind in (winreg.REG_SZ, winreg.REG_EXPAND_SZ)
                                                  and isinstance(value, str) and len(value) <= 65536,
                                                  "stock_predecessor_registry_selector_not_inspectable")
                                          values.append(value)
                                      display_name, publisher = values
                                      require(display_name.casefold() != "motionwright"
                                              and (display_name + publisher).casefold() !=
                                              ("Motionwright" + "seradotcom").casefold(),
                                              "stock_predecessor_found_a_wix_or_nsis_reinstall_selector")
                                  count += 1
                              final_subkeys, _, _ = winreg.QueryInfoKey(parent)
                              require(final_subkeys == subkeys,
                                      "stock_predecessor_registry_inventory_changed")
                      results.append({
                          "hive": hive_name, "view": view_name,
                          "fixed_keys_absent": absent_keys,
                          "uninstall_subkeys_inspected": count,
                          "matching_product_or_concatenated_product_publisher": 0,
                      })
              return {
                  "status": "ABSENT_AT_PREFLIGHT", "identity": PREVIOUS_REGISTRY_IDENTITY,
                  "views": results, "registry_writes": False,
                  "uninstall_commands_read_or_executed": False,
                  "atomic_registry_lock_across_installer_dispatch": False,
              }


name: Candidate Packages

on:
  workflow_dispatch:
    inputs:
      nsis_update_fixture:
        description: 'Compile the separate 2-resource/2-sidecar predecessor fixture; choose any observation separately'
        type: boolean
        required: false
        default: false
      nsis_update_probe:
        description: 'Optional observation on a fresh Windows runner using the compiled fixture'
        type: choice
        required: false
        default: compile_only
        options:
          - compile_only
          - clean_update
          - post_main_recovery
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/studio/**"
      - "crates/**"
      - "tooling/package_receipt.py"
      - "tooling/nsis_owned_files.py"
      - "tooling/tests/test_nsis_owned_files.py"
      - "tooling/v01_glib_product_admission.py"
      - "tooling/upstream-crates/**"
      - "vendor/glib-0.18.5/**"
      - "tooling/release_manifest.py"
      - "tooling/tests/test_package_receipt.py"
      - "tooling/tests/test_candidate_receipt_source.py"
      - "tooling/candidate_attestation_input.py"
      - "tooling/tests/test_candidate_attestation_input.py"
      - "tooling/owner_candidate_provenance.py"
      - "tooling/tests/test_owner_candidate_provenance.py"
      - "tooling/candidate_smoke.py"
      - "tooling/linux_gui_probe.py"
      - "tooling/windows_cold_start.py"
      - "tooling/tests/test_windows_cold_start.py"
      - "tooling/linux_cold_start.py"
      - "tooling/tests/test_linux_cold_start.py"
      - "tooling/tests/test_linux_gui_readiness.py"
      - "tooling/tests/test_candidate_smoke.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - "SOURCE_LOCK.json"
      - ".github/workflows/package-candidate.yml"
  push:
    branches: ["main", "feat/**"]
    paths:
      - "apps/desktop/**"
      - "apps/studio/**"
      - "crates/**"
      - "tooling/package_receipt.py"
      - "tooling/nsis_owned_files.py"
      - "tooling/tests/test_nsis_owned_files.py"
      - "tooling/v01_glib_product_admission.py"
      - "tooling/upstream-crates/**"
      - "vendor/glib-0.18.5/**"
      - "tooling/release_manifest.py"
      - "tooling/tests/test_package_receipt.py"
      - "tooling/tests/test_candidate_receipt_source.py"
      - "tooling/candidate_attestation_input.py"
      - "tooling/tests/test_candidate_attestation_input.py"
      - "tooling/owner_candidate_provenance.py"
      - "tooling/tests/test_owner_candidate_provenance.py"
      - "tooling/candidate_smoke.py"
      - "tooling/linux_gui_probe.py"
      - "tooling/windows_cold_start.py"
      - "tooling/tests/test_windows_cold_start.py"
      - "tooling/linux_cold_start.py"
      - "tooling/tests/test_linux_cold_start.py"
      - "tooling/tests/test_linux_gui_readiness.py"
      - "tooling/tests/test_candidate_smoke.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - "SOURCE_LOCK.json"
      - ".github/workflows/package-candidate.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  receipt-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Require the compiled fixture for an explicitly selected update observation
        if: github.event_name == 'workflow_dispatch' && inputs.nsis_update_probe != 'compile_only' && !inputs.nsis_update_fixture
        run: |
          echo "An NSIS update observation requires nsis_update_fixture=true."
          exit 1
      - name: Candidate receipt and installed-package smoke policy tests
        run: |
          python3 -m unittest tooling/tests/test_package_receipt.py tooling/tests/test_candidate_receipt_source.py tooling/tests/test_candidate_attestation_input.py tooling/tests/test_owner_candidate_provenance.py
          python3 -m unittest tooling/tests/test_candidate_smoke.py tooling/tests/test_windows_cold_start.py tooling/tests/test_linux_cold_start.py tooling/tests/test_linux_gui_readiness.py

      - name: Require all sixteen NSIS helper tests on Linux without skips
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import unittest

          ROOT = Path(os.environ["GITHUB_WORKSPACE"])
          sys.path.insert(0, str(ROOT / "tooling"))
          from package_receipt import verified_artifact
          from release_manifest import _checkout

          SOURCE = os.environ["GITHUB_SHA"]
          PATHS = ("tooling/nsis_owned_files.py", "tooling/tests/test_nsis_owned_files.py",
                   "apps/desktop/src-tauri/windows/installer.nsi",
                   "apps/desktop/src-tauri/windows/uninstall-ownership.nsh")
          def source():
              _checkout(ROOT, SOURCE)
              subprocess.run(["git", "ls-files", "--error-unmatch", "--", *PATHS],
                             cwd=ROOT, check=True, capture_output=True, timeout=10)
              files = {}
              for path in PATHS:
                  observed, size, digest = verified_artifact(ROOT, ROOT / path)
                  files[path] = {"bytes": size, "sha256": digest}
              tree = subprocess.run(["git", "rev-parse", "HEAD^{tree}"], cwd=ROOT, check=True,
                                    capture_output=True, text=True).stdout.strip()
              return {"checkout": SOURCE, "tree": tree, "files": files}

          before = source()
          runtime = Path(os.environ["RUNNER_TEMP"]) / "mw-nsis-linux-source-tests"
          runtime.mkdir()
          os.environ["MOTIONWRIGHT_TEST_ROOT"] = str(runtime)
          suite = unittest.defaultTestLoader.discover("tooling/tests", pattern="test_nsis_owned_files.py")
          def cases(node):
              for item in node:
                  if isinstance(item, unittest.TestSuite):
                      yield from cases(item)
                  else:
                      yield item.id()
          ids = list(cases(suite))
          if len(ids) != 16 or len(set(ids)) != 16:
              raise RuntimeError("expected_exactly_sixteen_distinct_nsis_source_tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          after = source()
          record = {
              "schema": "motionwright.nsis-source-tests/1", "platform": sys.platform,
              "source_before": before, "source_after": after, "test_ids": ids,
              "tests": result.testsRun, "failures": len(result.failures), "errors": len(result.errors),
              "skips": [{"id": case.id(), "reason": reason} for case, reason in result.skipped],
              "unexpected_successes": len(result.unexpectedSuccesses),
              "expected_failures": len(result.expectedFailures),
              "nsis_compilation": "NOT_RUN", "installer_execution": "NOT_RUN",
              "human_install_acceptance": "NOT_RUN",
          }
          output = ROOT / "ci-evidence/nsis-linux-source-tests.json"
          output.parent.mkdir(exist_ok=True)
          with output.open("x", encoding="utf-8", newline="\n") as stream:
              json.dump(record, stream, indent=2, sort_keys=True)
              stream.write("\n")
          ok = (sys.platform.startswith("linux") and before == after and result.wasSuccessful()
                and result.testsRun == 16 and not result.skipped
                and not result.expectedFailures and not result.unexpectedSuccesses)
          print("nsis-linux-source-tests=" + ("PASS" if ok else "FAIL") + " required=16 skips=0")
          raise SystemExit(0 if ok else 1)
          PY
      - name: Retain the exact Linux NSIS source-test result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-nsis-linux-source-tests
          path: ci-evidence/nsis-linux-source-tests.json
          if-no-files-found: warn

  linux:
    if: github.event_name != 'workflow_dispatch' || !inputs.nsis_update_fixture
    needs: receipt-policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: false
      - name: Install Linux desktop bundling prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libfuse2 xvfb x11-utils dbus-x11
      - name: Install locked Studio and Tauri CLI dependencies
        run: npm --prefix apps/studio ci --no-audit --no-fund
      - name: Build unsigned Linux candidate bundles
        run: |
          cd apps/desktop
          npm --prefix ../studio exec -- tauri build --bundles deb,appimage
      - name: Verify actual Linux candidate compiled the reviewed local glib source
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          python3 tooling/v01_glib_product_admission.py --output ci-evidence/glib-patched-source.json
          cargo tree --locked -p motionwright-desktop --target x86_64-unknown-linux-gnu -i glib > ci-evidence/glib-compiled-owner-tree.txt
          grep -F 'vendor/glib-0.18.5' ci-evidence/glib-compiled-owner-tree.txt >/dev/null
          count="$(find target/release/deps -maxdepth 1 -type f -name 'libglib-*.rlib' | wc -l)"
          test "$count" -ge 1
          echo 'v01-glib-product-candidate=LOCAL_BACKPORT_COMPILED linux_installed_gui=NOT_YET_VERIFIED'
      - name: Record exact Linux candidate artifacts
        run: |
          appimage_count="$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | wc -l)"
          deb_count="$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' | wc -l)"
          test "$appimage_count" -eq 1
          test "$deb_count" -eq 1
          appimage="$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print)"
          deb="$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print)"
          python3 tooling/package_receipt.py \
            --git-sha "$GITHUB_SHA" \
            --platform linux \
            --arch x86_64 \
            --artifact "$appimage" \
            --artifact "$deb" \
            --output ci-evidence/linux-candidate.json
      - name: Inspect extracted Linux packages and launch a rootless AppImage window
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          deb="$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          appimage="$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          work="$RUNNER_TEMP/motionwright-smoke"
          mkdir -p "$work/deb" "$work/appimage"
          dpkg-deb --extract "$deb" "$work/deb"
          mapfile -t deb_bins < <(find "$work/deb/usr/bin" -maxdepth 1 -type f -executable -iname "*motionwright*")
          mapfile -t deb_desktop < <(find "$work/deb/usr/share/applications" -maxdepth 1 -type f -name '*.desktop')
          test "${#deb_bins[@]}" -eq 1
          test "${#deb_desktop[@]}" -eq 1
          python3 tooling/candidate_smoke.py \
            --candidate-receipt ci-evidence/linux-candidate.json \
            --expected-source-sha "$GITHUB_SHA" \
            --kind deb --method deb_extract \
            --artifact "$deb" --installed-binary "${deb_bins[0]}" \
            --linux-desktop-entry "${deb_desktop[0]}" \
            --output ci-evidence/linux-deb-smoke.json
          echo "Debian extracted program and desktop metadata validated"
          chmod u+x "$appimage"
          echo "Extracting AppImage to disposable runner directory"
          if ! (cd "$work/appimage" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null); then
            echo "::error::AppImage extraction failed (no FUSE or sandbox bypass was attempted)"
            exit 1
          fi
          extracted="$work/appimage/squashfs-root"
          if ! test -x "$extracted/AppRun"; then
            echo "::error::AppImage extraction contains no executable AppRun"
            find "$extracted" -maxdepth 2 -name 'AppRun' -o -name '*.desktop'
            exit 1
          fi
          mapfile -t image_bins < <(find "$extracted/usr/bin" -maxdepth 1 -type f -executable -iname "*motionwright*")
          mapfile -t image_desktop < <(find "$extracted" -maxdepth 1 -name '*.desktop')
          if [ "${#image_bins[@]}" -ne 1 ]; then
            echo "::error::Expected one Motionwright binary in extracted AppImage, found ${#image_bins[@]}"
            find "$extracted/usr/bin" -maxdepth 1 -type f -printf '%f\n'
            exit 1
          fi
          if [ "${#image_desktop[@]}" -ne 1 ]; then
            echo "::error::Expected one AppImage desktop entry, found ${#image_desktop[@]}"
            find "$extracted" -maxdepth 1 -name '*.desktop' -printf '%f\n'
            exit 1
          fi
          echo "AppImage source payload extracted; testing fresh bootstrap, SQLite persistence and a second real X11 window"
          xvfb-run -a -s "-screen 0 1440x940x24" \
            dbus-run-session -- python3 tooling/linux_cold_start.py \
              --app-run "$extracted/AppRun" \
              --scratch "$work/isolated-gui" \
              --source-sha "$GITHUB_SHA" \
              --source-lock SOURCE_LOCK.json \
              --output ci-evidence/linux-appimage-window.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          evidence = json.loads(Path("ci-evidence/linux-appimage-window.json").read_text())
          assert evidence["schema"] == "motionwright.ci.installed-cold-relaunch/1"
          assert evidence["motionwright_sha"] == os.environ["GITHUB_SHA"]
          assert evidence["semwright_sha"] == json.loads(Path("SOURCE_LOCK.json").read_text())["dependencies"]["semwright"]["revision"]
          assert evidence["status"] == "WINDOW_OBSERVED"
          assert evidence["window_title"] == "Motionwright"
          assert evidence["launch_count"] == 2
          assert evidence["first_launch"]["status"] == "WINDOW_OBSERVED"
          assert evidence["reopened_launch"]["status"] == "WINDOW_OBSERVED"
          persistence = evidence["persistence"]
          assert persistence["status"] == "PASS"
          assert persistence["one_project_after_both_launches"] is True
          assert persistence["same_project_id"] is True
          assert persistence["same_generation"] is True
          assert persistence["same_revision"] is True
          assert persistence["same_domain_document_sha256"] is True
          assert persistence["sqlite_integrity_checked_twice"] is True
          assert persistence["schema_version"] == 2
          assert persistence["native_receipts"] == 0
          assert all(len(persistence[key]) == 64 for key in ("project_identity_sha256", "generation_sha256", "document_sha256"))
          assert evidence["claims"]["human_install_acceptance"] == "NOT_RUN"
          assert evidence["claims"]["native_renderer_execution"] == "NOT_RUN"
          PY
          python3 tooling/candidate_smoke.py \
            --candidate-receipt ci-evidence/linux-candidate.json \
            --expected-source-sha "$GITHUB_SHA" \
            --kind appimage --method appimage_extract \
            --artifact "$appimage" --installed-binary "${image_bins[0]}" \
            --linux-desktop-entry "${image_desktop[0]}" \
            --linux-gui-probe ci-evidence/linux-appimage-window.json \
            --output ci-evidence/linux-appimage-smoke.json
      - name: Retain isolated GUI launch diagnostics if smoke fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-linux-smoke-diagnostics
          path: |
            ${{ runner.temp }}/motionwright-smoke/isolated-gui/app-run.log
            ${{ runner.temp }}/motionwright-smoke/isolated-gui/app-run-first.log
            ${{ runner.temp }}/motionwright-smoke/isolated-gui/app-run-second.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-linux-candidate
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            ci-evidence/linux-candidate.json
            ci-evidence/linux-deb-smoke.json
            ci-evidence/linux-appimage-smoke.json
            ci-evidence/linux-appimage-window.json
          if-no-files-found: error

  windows:
    if: github.event_name != 'workflow_dispatch' || !inputs.nsis_update_fixture
    needs: receipt-policy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: false
      - name: Install locked Studio and Tauri CLI dependencies
        run: npm --prefix apps/studio ci --no-audit --no-fund
      - name: Build unsigned current-user Windows NSIS candidate
        shell: pwsh
        run: |
          Set-Location apps/desktop
          npm --prefix ../studio exec -- tauri build --bundles nsis
          Set-Location ../..
      - name: Record exact Windows candidate artifact
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe -File)
          if ($artifacts.Count -ne 1) {
            throw "Expected exactly one NSIS setup artifact, observed $($artifacts.Count)"
          }
          python tooling/package_receipt.py --git-sha "$env:GITHUB_SHA" --platform windows --arch x86_64 --artifact "$($artifacts[0].FullName)" --output ci-evidence/windows-candidate.json
      - name: Observe one real cancellation at the initial NSIS wizard
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import ctypes
          from ctypes import wintypes
          import hashlib
          import json
          import os
          from pathlib import Path
          import stat
          import subprocess
          import sys
          import time

          sys.path.insert(0, str(Path.cwd() / "tooling"))
          from candidate_smoke import verify_installer
          from package_receipt import verified_artifact
          from release_manifest import _checkout, _path_has_reparse
          from windows_cold_start import native_windows_launch_environment

          ROOT = Path(os.environ["GITHUB_WORKSPACE"])
          SOURCE = os.environ["GITHUB_SHA"]
          TEMP = Path(os.environ["RUNNER_TEMP"])
          DEST = TEMP / "motionwright-nsis-current-user"
          PRIVATE = TEMP / "motionwright-nsis-initial-cancel"
          OUTPUT = ROOT / "ci-evidence/windows-nsis-initial-cancel.json"
          ATTEMPT = ROOT / "ci-evidence/windows-nsis-initial-cancel-attempt.json"
          SOURCE_PATHS = (
              ".github/workflows/package-candidate.yml",
              "apps/desktop/src-tauri/tauri.conf.json",
              "apps/desktop/src-tauri/windows/installer.nsi",
              "apps/desktop/src-tauri/windows/uninstall-ownership.nsh",
              "tooling/nsis_owned_files.py",
              "tooling/package_receipt.py",
              "tooling/release_manifest.py",
              "tooling/candidate_smoke.py",
              "tooling/windows_cold_start.py",
              "SOURCE_LOCK.json",
              "Cargo.lock",
          )
          proof = {
              "schema": "motionwright-windows-nsis-initial-cancel/1",
              "source_sha": SOURCE,
              "status": "NOT_COMPLETED",
              "scope": "initial_wizard_cancel_before_install_section",
              "absence_scope": "only_the_explicit_destination_not_all_initialization_effects",
              "installer_process": {"state": "NOT_STARTED"},
              "cancel_message": {"attempts": 0, "state": "NOT_SENT"},
              "destination_before": "NOT_OBSERVED",
              "destination_after": "NOT_OBSERVED",
              "source_before": None,
              "source_after": None,
              "package_before": None,
              "package_after": None,
              "primary_failure": None,
              "cleanup": [],
              "raw_logs_uploaded": False,
              "project_preservation": "NOT_EXERCISED_BY_THIS_CASE",
              "mid_extraction_cancel": "NOT_RUN",
              "rollback": "NOT_RUN",
              "human_install_acceptance": "NOT_RUN",
              "release_published": False,
          }
          process = None
          installer = None
          log = None

          def require(ok, reason):
              if not ok:
                  raise RuntimeError(reason)

          def absent(path):
              # The target is a direct child of a checked real runner directory.
              for parent in path.parents:
                  info = parent.lstat()
                  require(stat.S_ISDIR(info.st_mode) and not stat.S_ISLNK(info.st_mode)
                          and not _path_has_reparse(parent, info),
                          "destination_ancestor_not_an_ordinary_directory")
              try:
                  path.lstat()
              except FileNotFoundError:
                  return True
              return False

          def source_bytes(relative):
              require(relative in SOURCE_PATHS, "source_path_outside_the_explicit_gate_set")
              path = ROOT / relative
              observed, size, digest = verified_artifact(ROOT, path)
              require(size <= 4 * 1024 * 1024, "source_text_exceeds_gate_bound")
              with path.open("rb") as stream:
                  body = stream.read(4 * 1024 * 1024 + 1)
              final, final_size, final_digest = verified_artifact(ROOT, path)
              require(len(body) == size and hashlib.sha256(body).hexdigest() == digest
                      and (final, final_size, final_digest) == (observed, size, digest),
                      "source_text_changed_during_read")
              return body

          def sources():
              _checkout(ROOT, SOURCE)
              subprocess.run(["git", "ls-files", "--error-unmatch", "--", *SOURCE_PATHS],
                             cwd=ROOT, check=True, capture_output=True, timeout=10)
              result = {}
              for name in SOURCE_PATHS:
                  observed, size, digest = verified_artifact(ROOT, ROOT / name)
                  result[name] = {"bytes": size, "sha256": digest}
              tree = subprocess.run(["git", "rev-parse", "HEAD^{tree}"], cwd=ROOT,
                                    check=True, capture_output=True, text=True, timeout=10).stdout.strip()
              require(len(tree) == 40 and all(c in "0123456789abcdef" for c in tree),
                      "source_tree_invalid")
              _checkout(ROOT, SOURCE)
              return {"tree": tree, "files": result}

          def package(path):
              observed, size, digest = verified_artifact(ROOT, path)
              return {"filename": observed.name, "bytes": size, "sha256": digest}

          try:
              require(os.name == "nt" and os.environ.get("GITHUB_ACTIONS") == "true",
                      "host_is_not_the_disposable_windows_job")
              require(ROOT.is_absolute() and TEMP.is_absolute(), "runner_paths_not_absolute")
              require(absent(DEST), "cancel_destination_already_exists")
              proof["destination_before"] = "ABSENT"
              require(absent(PRIVATE), "cancel_private_directory_already_exists")
              PRIVATE.mkdir()
              require(not OUTPUT.exists() and not ATTEMPT.exists(), "cancel_evidence_already_exists")
              proof["source_before"] = sources()
              installers = list((ROOT / "target/release/bundle/nsis").glob("*-setup.exe"))
              require(len(installers) == 1, "installer_not_unique")
              installer = installers[0]
              proof["package_before"] = package(installer)
              receipt_path = ROOT / "ci-evidence/windows-candidate.json"
              _, receipt_size, receipt_sha = verified_artifact(ROOT, receipt_path)
              require(receipt_size <= 1024 * 1024, "candidate_receipt_exceeds_limit")
              with receipt_path.open("rb") as stream:
                  receipt_bytes = stream.read(receipt_size + 1)
              require(len(receipt_bytes) == receipt_size

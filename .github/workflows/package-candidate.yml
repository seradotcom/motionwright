          class NativeJunctionTests(unittest.TestCase):
              def test_real_ntfs_junction_refuses_source_and_output_before_publication(self):
                  self.assertEqual(os.name, "nt")
                  child_env = dict(os.environ)
                  child_env.pop("GH_TOKEN", None)
                  child_env.pop("GITHUB_TOKEN", None)
                  child_env["MW_NSIS_FIXTURE_TARGET"] = str(target)
                  child_env["MW_NSIS_FIXTURE_LINK"] = str(link)
                  command = (
                      "$ErrorActionPreference='Stop'; "
                      "New-Item -ItemType Junction -Path $env:MW_NSIS_FIXTURE_LINK "
                      "-Target $env:MW_NSIS_FIXTURE_TARGET -ErrorAction Stop | Out-Null"
                  )
                  run = subprocess.run(["powershell.exe", "-NoProfile", "-NonInteractive",
                                        "-Command", command], env=child_env,
                                       capture_output=True, timeout=20, check=False)
                  self.assertEqual(run.returncode, 0)
                  observed = link.lstat()
                  self.assertEqual(getattr(observed, "st_reparse_tag", None), 0xA0000003)
                  self.assertTrue(getattr(observed, "st_file_attributes", 0) & 0x400)
                  self.assertTrue(stat.S_ISDIR(observed.st_mode))
                  self.assertTrue(owned._is_link_or_reparse(observed))
                  fixture.update({
                      "create_exit": run.returncode,
                      "stdout_sha256": hashlib.sha256(run.stdout).hexdigest(),
                      "stderr_sha256": hashlib.sha256(run.stderr).hexdigest(),
                      "reparse_tag": observed.st_reparse_tag,
                      "file_attributes": observed.st_file_attributes,
                      "file_identity": {"device": observed.st_dev, "inode": observed.st_ino},
                  })
                  with self.assertRaises(owned.CaptureError):
                      owned.capture_owned_file(link / "owned.bin", plain / "capture.bin",
                                               plain / "capture.nsh", "MW_JUNCTION")
                  with self.assertRaises(owned.CaptureError):

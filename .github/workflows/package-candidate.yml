          KERNEL = ctypes.WinDLL("kernel32", use_last_error=True)
          KERNEL.CreateFileW.argtypes = [
              wintypes.LPCWSTR, wintypes.DWORD, wintypes.DWORD, ctypes.c_void_p,
              wintypes.DWORD, wintypes.DWORD, wintypes.HANDLE,
          ]
          KERNEL.CreateFileW.restype = wintypes.HANDLE
          KERNEL.CloseHandle.argtypes = [wintypes.HANDLE]
          KERNEL.CloseHandle.restype = wintypes.BOOL
          KERNEL.GetHandleInformation.argtypes = [wintypes.HANDLE, ctypes.POINTER(wintypes.DWORD)]
          KERNEL.GetHandleInformation.restype = wintypes.BOOL
          INVALID_HANDLE = ctypes.c_void_p(-1).value

          def observe_lock():
              require(LOCK is not None and LOCK["fd"] is not None, "owned_lock_is_not_open")
              path = LOCK["path"]
              fd = LOCK["fd"]
              initial = LOCK["initial"]
              initial_descriptor = LOCK["initial_descriptor"]
              require(initial_descriptor is not None, "owned_lock_descriptor_baseline_missing")
              descriptor_before = os.fstat(fd)
              path_before = path.lstat()
              owned._require_unchanged(descriptor_before, initial_descriptor, "owned lock descriptor")
              owned._require_unchanged(path_before, initial, "owned lock path")
              owned._require_path_descriptor_match(descriptor_before, path_before, "owned lock")
              require(descriptor_before.st_nlink == 1, "owned_lock_file_became_shared")
              os.lseek(fd, 0, os.SEEK_SET)
              digest = hashlib.sha256()
              seen = 0
              remaining = initial.st_size + 1
              while remaining:
                  block = os.read(fd, min(1024 * 1024, remaining))
                  if not block:
                      break
                  remaining -= len(block)
                  require(seen + len(block) <= initial.st_size, "owned_lock_source_grew")
                  digest.update(block)
                  seen += len(block)
              require({"bytes": seen, "sha256": digest.hexdigest()} == LOCK["expected"],
                      "owned_lock_descriptor_does_not_read_the_pinned_self")
              descriptor_after = os.fstat(fd)
              path_after = path.lstat()
              owned._require_unchanged(descriptor_after, initial_descriptor, "owned lock descriptor")
              owned._require_unchanged(path_after, initial, "owned lock path")
              owned._require_path_descriptor_match(descriptor_after, path_after, "owned lock")
              require(descriptor_after.st_nlink == 1, "owned_lock_file_became_shared")
              plain_parents(path)
              flags = wintypes.DWORD()
              require(bool(KERNEL.GetHandleInformation(LOCK["handle"], ctypes.byref(flags)))
                      and not (flags.value & 1), "owned_lock_handle_missing_or_inheritable")
              return {
                  "owner_pid": os.getpid(), "handle": LOCK["handle"], "descriptor": fd,
                  "handle_flags": flags.value, "file": LOCK["expected"], "file_token": token(path),
                  "desired_access": 0x80000000, "share_mode": 1,
                  "creation_disposition": 3, "flags_and_attributes": 0x08200000,
                  "read_allowed_delete_not_shared": True,
                  "ctime_comparison": "WITHIN_EACH_API_DOMAIN_ONLY",
                  "stat_domains": {
                      name: {field: getattr(info, field, None) for field in (
                          "st_dev", "st_ino", "st_size", "st_mtime_ns", "st_ctime_ns",
                          "st_birthtime_ns", "st_birthtime",
                      )}
                      for name, info in (
                          ("path_initial", initial), ("descriptor_initial", initial_descriptor),
                          ("path_before_read", path_before), ("descriptor_before_read", descriptor_before),
                          ("path_after_read", path_after), ("descriptor_after_read", descriptor_after),
                      )
                  },
              }

          def acquire_previous_self_lock(path, expected):
              global LOCK
              require(LOCK is None and identity(path) == expected,
                      "previous_self_lock_precondition_failed")
              initial = path.lstat()
              owned._require_regular(initial, "previous self")
              require(initial.st_nlink == 1, "previous_self_is_shared")
              plain_parents(path)
              ctypes.set_last_error(0)
              handle = KERNEL.CreateFileW(str(path), 0x80000000, 1, None, 3, 0x08200000, None)
              require(handle not in (None, 0, INVALID_HANDLE), "owned_previous_self_lock_open_failed")
              try:
                  fd = msvcrt.open_osfhandle(handle, os.O_RDONLY | os.O_BINARY
                                            | getattr(os, "O_NOINHERIT", 0))
              except BaseException:
                  closed = bool(KERNEL.CloseHandle(handle))
                  STATE["cleanup"].append({"raw_owned_lock_close_succeeded": closed})
                  raise
              # Record ownership before fstat: a failed observation still leaves exactly
              # this descriptor available to the existing finalization path.
              LOCK = {"fd": fd, "handle": handle, "path": path,
                      "initial": initial, "initial_descriptor": None, "expected": expected}
              LOCK["initial_descriptor"] = os.fstat(fd)
              owned._require_path_descriptor_match(LOCK["initial_descriptor"], initial, "owned lock")
              observation = observe_lock()
              STATE["owned_lock_before"] = observation
              write_new(EVIDENCE / "windows-nsis-update-actions/previous-self-lock-open.json",
                        {"status": "OWNED_HANDLE_OPEN", "source_sha": SOURCE, **observation})

          def close_owned_lock():
              global LOCK
              require(LOCK is not None and LOCK["fd"] is not None, "owned_lock_already_closed_or_unknown")
              before = observe_lock()
              fd = LOCK["fd"]
              handle = LOCK["handle"]
              # open_osfhandle transferred ownership to this descriptor. Closing it once
              # closes exactly that handle; never also call CloseHandle on the same owner.
              LOCK["fd"] = None
              try:
                  os.close(fd)
              except BaseException:
                  STATE["unknown_outcome"] = True
                  raise
              flags = wintypes.DWORD()
              ctypes.set_last_error(0)
              still_valid = bool(KERNEL.GetHandleInformation(handle, ctypes.byref(flags)))
              error = ctypes.get_last_error()
              if still_valid or error != 6:
                  STATE["unknown_outcome"] = True
                  raise GateError("owned_lock_close_not_observed_as_invalid_handle")
              observation = {
                  "status": "OWNED_HANDLE_CLOSED", "source_sha": SOURCE, "before": before,
                  "GetHandleInformation_succeeded": still_valid, "GetLastError": error,
                  "native_installer_outcome_inferred_from_close": False,
              }
              STATE["owned_lock_closed"] = observation
              write_new(EVIDENCE / "windows-nsis-update-actions/previous-self-lock-closed.json", observation)
              return observation


                  require(len(setups) == 1, "diagnostic_setup_count_invalid")
                  candidates.append((setups[0], 256 * 1024 * 1024))
                  require(len(candidates) <= 64, "diagnostic_candidate_count_bound")
                  names = [path.name for path, _ in candidates]
                  require(len(names) == len(set(names)), "diagnostic_output_name_duplicated")
                  total = 0
                  for path, maximum in candidates:
                      _require_plain_parents(path)
                      initial = path.lstat()
                      _require_regular(initial, "diagnostic source")
                      require(0 < initial.st_size <= maximum, "diagnostic_file_size_bound")
                      require(total + initial.st_size <= 512 * 1024 * 1024,

                          link / "predecessor.nsh", application="Motionwright",
                          bundle_id="com.seradotcom.motionwright", arch="x64",
                          target_version="0.1.0", target_main_sha256="1" * 64, environment={})
                  self.assertEqual(source_file.read_bytes(), source_bytes)
                  self.assertEqual(sorted(item.name for item in target.iterdir()), ["owned.bin"])
                  self.assertEqual(list(plain.iterdir()), [])
                  final = link.lstat()
                  self.assertEqual((final.st_dev, final.st_ino, final.st_reparse_tag),
                                   (observed.st_dev, observed.st_ino, observed.st_reparse_tag))
                  fixture["outside_bytes_sha256"] = hashlib.sha256(source_file.read_bytes()).hexdigest()
                  fixture["new_output_files"] = 0


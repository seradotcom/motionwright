name: Candidate Packages
run-name: Candidate packages / ${{ inputs.verification_scope || 'all' }} / ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      verification_scope:
        description: Candidate packages or selected Windows, NSIS, distribution and Linux first-use verification
        required: true
        type: choice
        default: all
        options:
          - all
          - windows_contracts
          - windows_installed
          - nsis_source
          - distribution_source
          - nsis_compile
          - nsis_lifecycle
          - linux_first_use_source
          - linux_first_use
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/studio/**"
      - "crates/**"
      - "tooling/package_receipt.py"
      - "tooling/nsis_owned_files.py"
      - "tooling/distribution_build_record.py"

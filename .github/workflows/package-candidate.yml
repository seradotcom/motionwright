          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import sys

          sys.path.insert(0, str(Path.cwd() / "tooling"))
          from nsis_owned_files import (
              _capture, _relative, _require_plain_parents, _require_regular,
          )
          from package_receipt import verified_artifact
          from release_manifest import _checkout

          ROOT = Path(os.environ["GITHUB_WORKSPACE"])
          SOURCE = os.environ["GITHUB_SHA"]
          WORK = Path(os.environ["RUNNER_TEMP"]) / "motionwright-nsis-guarded-update"
          BUILD = ROOT / "target/release/nsis/x64"
          EVIDENCE = ROOT / "ci-evidence"
          PROOF = EVIDENCE / "windows-nsis-update-compiled.json"

          SOURCE_PATHS = (
              ".github/workflows/package-candidate.yml",
              "apps/desktop/src-tauri/tauri.conf.json",
              "apps/desktop/src-tauri/windows/installer.nsi",
              "apps/desktop/src-tauri/windows/uninstall-ownership.nsh",
              "tooling/nsis_owned_files.py",
              "tooling/tests/test_nsis_owned_files.py",
              "tooling/package_receipt.py",
              "tooling/release_manifest.py",
              "tooling/candidate_smoke.py",
              "tooling/windows_cold_start.py",
              "apps/studio/package.json",
              "apps/studio/package-lock.json",
              "Cargo.toml", "Cargo.lock", "SOURCE_LOCK.json",
          )

          def require(ok, code):
              if not ok:
                  raise RuntimeError(code)

          def identity(path):
              actual, size, digest = verified_artifact(ROOT, path)
              return {"bytes": size, "sha256": digest}

          def read_bound(path, maximum=4 * 1024 * 1024):
              observed = identity(path)
              require(observed["bytes"] <= maximum, "compiled_evidence_exceeds_bound")
              with path.open("rb") as stream:
                  body = stream.read(maximum + 1)
              require(len(body) == observed["bytes"]
                      and hashlib.sha256(body).hexdigest() == observed["sha256"]
                      and identity(path) == observed, "compiled_evidence_changed")
              return body, observed

          def write_new(path, value):
              body = (json.dumps(value, indent=2, sort_keys=True) + "\n").encode("utf-8")
              require(len(body) <= 4 * 1024 * 1024, "compiled_projection_exceeds_bound")
              with path.open("xb") as stream:
                  require(stream.write(body) == len(body), "compiled_projection_short_write")
                  stream.flush()
                  os.fsync(stream.fileno())

          def source_bytes(relative):
              require(relative in SOURCE_PATHS, "source_path_outside_the_explicit_gate_set")
              body, observed = read_bound(ROOT / relative)
              return body

          def literal(value):
              # This reader covers the controlled CI path alphabet. It is not a second
              # NSIS renderer and refuses any unexpanded or escaped expression.
              require(value and not any(c in value for c in '$"\r\n\x00'),
                      "compiled_fixture_has_an_unsupported_nsis_literal")
              return value

          def define(text, name, quoted=True):
              pattern = (r'^!define ' + re.escape(name)
                         + (r' "([^"\r\n]*)"\r?$' if quoted else r' ([0-9]+)\r?$'))
              matches = re.findall(pattern, text, re.MULTILINE)
              require(len(matches) == 1, "compiled_definition_missing_or_duplicated")
              return matches[0]

          def retain_original_compiled_inputs():
              # These are generated bytes, not an admitted installer. Preserve them
              # before parsing any definition so a failed inspection remains reviewable.
              destination = EVIDENCE / "windows-nsis-update-original-compiled"
              manifest_path = EVIDENCE / "windows-nsis-update-original-compiled.json"
              destination.mkdir()
              manifest = {
                  "schema": "motionwright-windows-nsis-original-compiled/1",
                  "status": "DIAGNOSTIC_NOT_VERIFIED",
                  "source_sha": SOURCE,
                  "collection_complete": False,
                  "installer_execution": "NOT_RUN",
                  "human_install_acceptance": "NOT_RUN",
                  "files": [],
              }
              operation_error = None
              try:
                  candidates = []
                  fixed = {
                      "installer.nsi": 4 * 1024 * 1024,
                      "mw-predecessor.nsh": 64 * 1024,
                      "mw-predecessor-manifest.capture.json": 4 * 1024 * 1024,
                  }
                  _require_plain_parents(BUILD / "installer.nsi")
                  for index, path in enumerate(BUILD.iterdir()):
                      require(index < 128, "compiled_original_directory_exceeds_bound")
                      name = path.name
                      if name in fixed:
                          candidates.append((path, name, fixed[name]))
                      elif name.startswith("mw-owned-"):
                          match = re.fullmatch(
                              r"mw-owned-MW_(?:MAIN|RESOURCE_[0-9]{1,2}|BINARY_[0-9]{1,2})\.(bin|nsh)",
                              name,
                          )
                          require(match is not None, "compiled_original_capture_name_invalid")
                          maximum = 64 * 1024 if match.group(1) == "nsh" else 256 * 1024 * 1024
                          candidates.append((path, name, maximum))
                  setup_root = ROOT / "target/release/bundle/nsis"
                  _require_plain_parents(setup_root / "fixture-setup.exe")
                  for index, path in enumerate(setup_root.iterdir()):
                      require(index < 32, "compiled_original_setup_directory_exceeds_bound")
                      if path.name.endswith("-setup.exe"):
                          require(re.fullmatch(r"[A-Za-z0-9._-]+-setup\.exe", path.name) is not None,
                                  "compiled_original_setup_name_invalid")
                          candidates.append((path, path.name, 256 * 1024 * 1024))
                  require(0 < len(candidates) <= 64, "compiled_original_file_count_invalid")
                  require(len({name for _, name, _ in candidates}) == len(candidates),
                          "compiled_original_destination_duplicated")
                  total = 0
                  for source, name, maximum in sorted(candidates, key=lambda item: item[1]):
                      _require_plain_parents(source)
                      initial = source.lstat()
                      _require_regular(initial, "compiled original")
                      require(0 < initial.st_size <= maximum
                              and total + initial.st_size <= 512 * 1024 * 1024,
                              "compiled_original_size_exceeds_bound")
                      record = {
                          "source": source.relative_to(ROOT).as_posix(),
                          "retained": name,
                          "status": "NOT_VERIFIED",
                      }
                      manifest["files"].append(record)
                      digest, size, _ = _capture(source, destination / name)
                      require(size == initial.st_size and size <= maximum
                              and total + size <= 512 * 1024 * 1024,
                              "compiled_original_changed_before_capture")
                      observed = {"bytes": size, "sha256": digest}
                      require(identity(source) == observed
                              and identity(destination / name) == observed,
                              "compiled_original_custody_mismatch")
                      record.update({"status": "CAPTURED", **observed})
                      total += size
                  names = {row["retained"] for row in manifest["files"]}
                  require(set(fixed).issubset(names)
                          and "mw-owned-MW_MAIN.bin" in names
                          and "mw-owned-MW_MAIN.nsh" in names
                          and len([name for name in names if name.endswith("-setup.exe")]) == 1,
                          "compiled_original_required_file_missing")
                  manifest["collection_complete"] = True
                  manifest["total_bytes"] = total
              except BaseException as error:
                  operation_error = error
                  manifest["error_type"] = type(error).__name__

name: Real SQLite OS path authority (NTFS and Darwin G2)
on:
  push:
    paths:
      - '.github/workflows/storage-sqlite-os-path-authority.yml'
      - 'tooling/ci_sqlite_os_path_g2.py'
      - 'tooling/tests/test_ci_sqlite_os_path_g2.py'
      - 'tooling/contracts/sqlite-os-path-g2/reviewed-source.json'
  workflow_dispatch:
    inputs:
      os_scope:
        description: Select only the required genuine OS-path authority checks
        required: true
        type: choice
        options: [windows, macos, both, windows-cas]
        default: windows
      expected_source_sha:
        description: Exact integrated Motionwright commit containing the reviewed gate and manifest
        required: true
        type: string
      reviewed_manifest_sha256:
        description: SHA-256 of the exact tracked A1 reviewed source manifest (proposal is rejected)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sqlite-path-g2-${{ github.ref }}-${{ inputs.os_scope || 'source-only' }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  MW_EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
  MW_REVIEWED_MANIFEST_SHA256: ${{ inputs.reviewed_manifest_sha256 }}
jobs:
  g0-source-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Reject retries of a native observation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$MW_EXPECTED_SOURCE_SHA" = "$GITHUB_SHA"
      - name: Enforce G0 source and conformance policies
        run: |
          set -euo pipefail
          python -B tooling/source_policy.py
          python -B tooling/acceptance_policy.py
          python -B tooling/creative_status_policy.py
      - name: Reject fake, skipped and changed test receipts
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tooling/tests -p test_ci_sqlite_os_path_g2.py -v
  windows-ntfs-real-g2:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.os_scope == 'windows' || inputs.os_scope == 'both') }}
    needs: g0-source-policy
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.98.1'
      - name: Prepare exact Git sources and genuine NTFS fixtures
        run: |
          $ErrorActionPreference = 'Stop'
          git config --local core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Cannot configure exact Git bytes' }
          git config --local core.eol lf
          if ($LASTEXITCODE -ne 0) { throw 'Cannot configure Git LF checkout' }
          git -c core.autocrlf=false -c core.eol=lf checkout --force "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot restore exact Git checkout' }
          git -c core.autocrlf=false -c core.eol=lf checkout-index --force --all
          if ($LASTEXITCODE -ne 0) { throw 'Cannot restore exact Git source bytes' }
          $root = Join-Path $env:RUNNER_TEMP ("mw-sqlite-path-" + $env:GITHUB_SHA + "-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $root) { throw 'Fixture root is not new' }
          $evidence = Join-Path $root 'public'
          $target = Join-Path $root 'target'
          $fixture = Join-Path $root 'ntfs'
          New-Item -ItemType Directory -Path $evidence,$target,$fixture -Force | Out-Null
          $owner = Join-Path $fixture 'owner'
          New-Item -ItemType Directory -Path $owner | Out-Null
          [System.IO.File]::WriteAllBytes((Join-Path $fixture 'file-target.bin'),[byte[]](73,81,76,84,69,33))
          New-Item -ItemType Junction -Path (Join-Path $fixture 'junction') -Target $owner | Out-Null
          New-Item -ItemType SymbolicLink -Path (Join-Path $fixture 'file-reparse.bin') -Target (Join-Path $fixture 'file-target.bin') | Out-Null
          $junction = Get-Item -LiteralPath (Join-Path $fixture 'junction') -Force
          $symlink = Get-Item -LiteralPath (Join-Path $fixture 'file-reparse.bin') -Force
          if ((($junction.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -eq 0) -or (($symlink.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -eq 0)) { throw 'Genuine NTFS fixtures missing' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ("MW_SQLITE_NTFS_FIXTURE_ROOT=" + $fixture)
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ("MW_SQLITE_EVIDENCE=" + $evidence)
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ("CARGO_TARGET_DIR=" + $target)
      - name: Run all three ignored-by-default NTFS authority tests
        run: |
          $ErrorActionPreference = 'Stop'
          python -B -I -S tooling/ci_sqlite_os_path_g2.py --repo "$env:GITHUB_WORKSPACE" --expected-sha "$env:MW_EXPECTED_SOURCE_SHA" --platform windows --report "$env:MW_SQLITE_EVIDENCE\real-NTFS-G2.json" --manifest-sha256 "$env:MW_REVIEWED_MANIFEST_SHA256" --expected-attempt 1
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows NTFS G2 failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && env.MW_SQLITE_EVIDENCE != '' }}
        with:
          name: sqlite-NTFS-real-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.MW_SQLITE_EVIDENCE }}/started.json
            ${{ env.MW_SQLITE_EVIDENCE }}/source-before.json
            ${{ env.MW_SQLITE_EVIDENCE }}/source-after.json
            ${{ env.MW_SQLITE_EVIDENCE }}/real-NTFS-G2.json
            ${{ env.MW_SQLITE_EVIDENCE }}/original-rust.stdout.log
            ${{ env.MW_SQLITE_EVIDENCE }}/original-rust.stderr.log
            ${{ env.MW_SQLITE_EVIDENCE }}/cleanup.json
            ${{ env.MW_SQLITE_EVIDENCE }}/original-cleanup.stdout.log
            ${{ env.MW_SQLITE_EVIDENCE }}/original-cleanup.stderr.log
          if-no-files-found: error
          retention-days: 14
  macos-var-alias-real-g2:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.os_scope == 'macos' || inputs.os_scope == 'both') }}
    needs: g0-source-policy
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.98.1'
      - name: Prepare isolated real Darwin source and target
        run: |
          set -euo pipefail
          git config --local core.autocrlf false
          git -c core.autocrlf=false checkout --force "$GITHUB_SHA"
          work="$RUNNER_TEMP/mw-sqlite-path-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$work"
          mkdir -p "$work/public" "$work/target"
          echo "MW_SQLITE_EVIDENCE=$work/public" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$work/target" >> "$GITHUB_ENV"
      - name: Execute both actual macOS system-alias tests
        run: |
          set -euo pipefail
          python -B -I -S tooling/ci_sqlite_os_path_g2.py --repo "$GITHUB_WORKSPACE" --expected-sha "$MW_EXPECTED_SOURCE_SHA" --platform macos --report "$MW_SQLITE_EVIDENCE/real-Darwin-G2.json" --manifest-sha256 "$MW_REVIEWED_MANIFEST_SHA256" --expected-attempt 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && env.MW_SQLITE_EVIDENCE != '' }}
        with:
          name: sqlite-Darwin-real-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.MW_SQLITE_EVIDENCE }}/started.json
            ${{ env.MW_SQLITE_EVIDENCE }}/source-before.json
            ${{ env.MW_SQLITE_EVIDENCE }}/source-after.json
            ${{ env.MW_SQLITE_EVIDENCE }}/real-Darwin-G2.json
            ${{ env.MW_SQLITE_EVIDENCE }}/original-rust.stdout.log
            ${{ env.MW_SQLITE_EVIDENCE }}/original-rust.stderr.log
            ${{ env.MW_SQLITE_EVIDENCE }}/cleanup.json
            ${{ env.MW_SQLITE_EVIDENCE }}/original-cleanup.stdout.log
            ${{ env.MW_SQLITE_EVIDENCE }}/original-cleanup.stderr.log
          if-no-files-found: error
          retention-days: 14
  # windows-cas is deliberately separate; both retains its original NTFS + Darwin scope.
  windows-cas-symlink-real-g2:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.os_scope == 'windows-cas' }}
    needs: g0-source-policy
    runs-on: windows-2025
    timeout-minutes: 55
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.98.1'
      - name: Prepare exact Git sources and verify actual Windows symlink capability
        run: |
          $ErrorActionPreference = 'Stop'
          git config --local core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Cannot configure exact Git bytes' }
          git config --local core.eol lf
          if ($LASTEXITCODE -ne 0) { throw 'Cannot configure Git LF checkout' }
          git -c core.autocrlf=false -c core.eol=lf checkout --force "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot restore exact Git checkout' }
          git -c core.autocrlf=false -c core.eol=lf checkout-index --force --all
          if ($LASTEXITCODE -ne 0) { throw 'Cannot restore exact Git source bytes' }
          $root = Join-Path $env:RUNNER_TEMP ("mw-sqlite-cas-" + $env:GITHUB_SHA + "-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $root) { throw 'Fixture root is not new' }
          $evidence = Join-Path $root 'public'
          $target = Join-Path $root 'target'
          $fixture = Join-Path $root 'ntfs'
          New-Item -ItemType Directory -Path $evidence,$target,$fixture -Force | Out-Null
          $owner = Join-Path $fixture 'owner'
          New-Item -ItemType Directory -Path $owner | Out-Null
          [System.IO.File]::WriteAllBytes((Join-Path $fixture 'file-target.bin'),[byte[]](73,81,76,84,69,33))
          New-Item -ItemType Junction -Path (Join-Path $fixture 'junction') -Target $owner | Out-Null
          New-Item -ItemType SymbolicLink -Path (Join-Path $fixture 'file-reparse.bin') -Target (Join-Path $fixture 'file-target.bin') | Out-Null
          $junction = Get-Item -LiteralPath (Join-Path $fixture 'junction') -Force
          $symlink = Get-Item -LiteralPath (Join-Path $fixture 'file-reparse.bin') -Force
          if ((($junction.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -eq 0) -or (($symlink.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -eq 0)) { throw 'Genuine NTFS fixtures missing' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ("MW_SQLITE_NTFS_FIXTURE_ROOT=" + $fixture)
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ("MW_SQLITE_EVIDENCE=" + $evidence)
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ("CARGO_TARGET_DIR=" + $target)
      - name: Enumerate compiled storage and run each of four ignored CAS cases exactly once
        run: |
          $ErrorActionPreference = 'Stop'
          python -B -I -S tooling/ci_sqlite_os_path_g2.py --repo "$env:GITHUB_WORKSPACE" --expected-sha "$env:MW_EXPECTED_SOURCE_SHA" --platform windows-cas --report "$env:MW_SQLITE_EVIDENCE\real-Windows-CAS-G2.json" --manifest-sha256 "$env:MW_REVIEWED_MANIFEST_SHA256" --expected-attempt 1
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows CAS symlink G2 failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && env.MW_SQLITE_EVIDENCE != '' }}
        with:
          name: sqlite-Windows-CAS-real-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MW_SQLITE_EVIDENCE }}/
          if-no-files-found: error
          retention-days: 14

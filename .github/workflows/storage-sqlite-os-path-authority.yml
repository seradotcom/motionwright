name: Real SQLite OS path authority (NTFS and Darwin G2)
on:
  push:
    paths:
      - '.github/workflows/storage-sqlite-os-path-authority.yml'
      - 'tooling/ci_sqlite_os_path_g2.py'
      - 'tooling/tests/test_ci_sqlite_os_path_g2.py'
  workflow_dispatch:
    inputs:
      os_scope:
        description: Select only the required genuine OS-path authority checks
        required: true
        type: choice
        options: [windows, macos, both]
        default: windows
permissions:
  contents: read
concurrency:
  group: sqlite-path-g2-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  g0-source-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Enforce G0 source and conformance policies
        run: |
          set -euo pipefail
          python -B tooling/source_policy.py
          python -B tooling/acceptance_policy.py
          python -B tooling/creative_status_policy.py
      - name: Reject fake, skipped and changed test receipts
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tooling/tests -p test_ci_sqlite_os_path_g2.py -v
  windows-ntfs-real-g2:
    if: ${{ github.event_name == 'push' || inputs.os_scope == 'windows' || inputs.os_scope == 'both' }}
    needs: g0-source-policy
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - name: Prepare exact Git sources and genuine NTFS fixtures
        run: |
          $ErrorActionPreference = 'Stop'
          git config --local core.autocrlf false
          git config --local core.eol lf
          git -c core.autocrlf=false -c core.eol=lf checkout --force "$env:GITHUB_SHA"
          git -c core.autocrlf=false -c core.eol=lf checkout-index --force -- Cargo.lock SOURCE_LOCK.json crates/storage/src/lib.rs crates/storage/tests/sqlite_windows_reparse_authority.rs crates/storage/tests/sqlite_darwin_system_alias.rs
          if ($LASTEXITCODE -ne 0) { throw 'Cannot restore exact Git source bytes' }
          $root = Join-Path $env:RUNNER_TEMP ("mw-sqlite-path-" + $env:GITHUB_SHA + "-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $root) { throw 'Fixture root is not new' }
          $evidence = Join-Path $root 'public'
          $target = Join-Path $root 'target'
          $fixture = Join-Path $root 'ntfs'
          New-Item -ItemType Directory -Path $evidence,$target,$fixture -Force | Out-Null
          $owner = Join-Path $fixture 'owner'
          New-Item -ItemType Directory -Path $owner | Out-Null
          [System.IO.File]::WriteAllBytes((Join-Path $fixture 'file-target.bin'),[byte[]](73,81,76,84,69,33))
          New-Item -ItemType Junction -Path (Join-Path $fixture 'junction') -Target $owner | Out-Null
          New-Item -ItemType SymbolicLink -Path (Join-Path $fixture 'file-reparse.bin') -Target (Join-Path $fixture 'file-target.bin') | Out-Null
          $junction = Get-Item -LiteralPath (Join-Path $fixture 'junction') -Force
          $symlink = Get-Item -LiteralPath (Join-Path $fixture 'file-reparse.bin') -Force
          if ((($junction.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -eq 0) -or (($symlink.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -eq 0)) { throw 'Genuine NTFS fixtures missing' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ("MW_SQLITE_NTFS_FIXTURE_ROOT=" + $fixture)
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ("MW_SQLITE_EVIDENCE=" + $evidence)
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ("CARGO_TARGET_DIR=" + $target)
      - name: Run all three ignored-by-default NTFS authority tests
        run: |
          $ErrorActionPreference = 'Stop'
          python -B -I -S tooling/ci_sqlite_os_path_g2.py --repo "$env:GITHUB_WORKSPACE" --expected-sha "$env:GITHUB_SHA" --platform windows --report "$env:MW_SQLITE_EVIDENCE\real-NTFS-G2.json"
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows NTFS G2 failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sqlite-NTFS-real-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MW_SQLITE_EVIDENCE }}
          if-no-files-found: warn
          retention-days: 14
  macos-var-alias-real-g2:
    if: ${{ inputs.os_scope == 'macos' || inputs.os_scope == 'both' }}
    needs: g0-source-policy
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - name: Prepare isolated real Darwin source and target
        run: |
          set -euo pipefail
          git config --local core.autocrlf false
          git -c core.autocrlf=false checkout --force "$GITHUB_SHA"
          work="$RUNNER_TEMP/mw-sqlite-path-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$work"
          mkdir -p "$work/public" "$work/target"
          echo "MW_SQLITE_EVIDENCE=$work/public" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$work/target" >> "$GITHUB_ENV"
      - name: Execute both actual macOS system-alias tests
        run: |
          set -euo pipefail
          python -B -I -S tooling/ci_sqlite_os_path_g2.py --repo "$GITHUB_WORKSPACE" --expected-sha "$GITHUB_SHA" --platform macos --report "$MW_SQLITE_EVIDENCE/real-Darwin-G2.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sqlite-Darwin-real-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MW_SQLITE_EVIDENCE }}
          if-no-files-found: warn
          retention-days: 14

name: V05 Launchwright immutable handoff contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tooling/launchwright-handoff/**'
      - 'docs/creative-production/V05_LAUNCHWRIGHT_IMMUTABLE_HANDOFF.md'
      - 'docs/creative-production/requirements-status.json'
      - '.github/workflows/v05-launchwright-handoff.yml'
  push:
    branches: ['main']
    paths:
      - 'tooling/launchwright-handoff/**'
      - 'docs/creative-production/**'
      - '.github/workflows/v05-launchwright-handoff.yml'

permissions:
  contents: read

concurrency:
  group: v05-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-owner-reviewed-immutable-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reject stale source, rights, claims, and accidental publication
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tooling/launchwright-handoff -p 'test_*.py' -v
          python3 tooling/source_policy.py
          python3 tooling/creative_status_policy.py
          python3 -m py_compile tooling/launchwright-handoff/*.py
      - name: Produce an explicitly synthetic, independently decodable media fixture
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          mkdir -p verification/fixture-source
          ffmpeg -nostdin -hide_banner -loglevel error -y \
            -f lavfi -i color=c=navy:s=320x180:r=30:d=1 \
            -an -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -movflags +faststart verification/fixture-source/original-test.mp4
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate \
            -of csv=p=0 verification/fixture-source/original-test.mp4 | grep '^320,180,30/1$'
          python3 tooling/launchwright-handoff/ci_fixture.py \
            --mp4 verification/fixture-source/original-test.mp4 \
            --output-dir verification/launchwright-handoff-SYNTHETIC
          python3 tooling/launchwright-handoff/verify_handoff.py \
            verification/launchwright-handoff-SYNTHETIC/motionwright-to-launchwright-SYNTHETIC-NOT_PUBLISHED.zip
      - name: Curate immutable handoff facts, never source project/master/ZIP
        if: always()
        env:
          HANDOFF_CI_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 tooling/launchwright-handoff/public_artifact.py --source-sha "$GITHUB_SHA" --evidence-root verification/launchwright-handoff-SYNTHETIC --public-root verification/launchwright-handoff-public --job-status "$HANDOFF_CI_STATUS"
          python3 -m json.tool verification/launchwright-handoff-public/public-evidence.json >/dev/null
      - name: Upload verified public handoff facts only, never owner source ZIP
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v05-handoff-public-facts-${{ github.sha }}
          path: verification/launchwright-handoff-public/
          if-no-files-found: error
          retention-days: 7

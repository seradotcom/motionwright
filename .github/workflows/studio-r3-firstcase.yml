name: Studio R3 first-case real physical diagnostic

# Create a unique reviewed verification branch only after source and physical
# identity admission. No push to integration or normal PR can launch this run.
# Branch creation is the one deliberate launch; later pushes/retries fail closed.
on:
  push:
    branches: ['verify/r3-firstcase-reviewed-*']

permissions:
  contents: read

concurrency:
  group: studio-r3-firstcase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firstcase:
    name: One original StudioService Store, independent real R3 reader (not G2)
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      R3_EVENT_BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.98.1'
          components: rustfmt

      - name: Source-only first-case selection and fail-closed preflight
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$R3_EVENT_BEFORE" = 0000000000000000000000000000000000000000
          python3 -B -m unittest tooling.tests.test_ci_service_r3_firstcase -v
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Compile once and run exactly one source-built physical Store readback
        timeout-minutes: 88
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = seradotcom/motionwright
          root="$RUNNER_TEMP/motionwright-r3-firstcase-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$root"
          python3 -I -B -X utf8 tooling/ci_service_r3_firstcase.py \
            --repo "$GITHUB_WORKSPACE" \
            --root "$root" \
            --expected-source "$GITHUB_SHA"

      - name: Retain original source, build, Playwright, real reader and terminal receipts
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r3-firstcase-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/motionwright-r3-firstcase-${{ github.run_id }}-${{ github.run_attempt }}/evidence
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

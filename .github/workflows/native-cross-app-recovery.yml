name: Native cross-app selective recovery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'SOURCE_LOCK.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/native/**'
      - 'crates/domain/**'
      - 'crates/service/**'
      - 'crates/storage/**'
      - 'tooling/native_cross_app_recovery_e2e.py'
      - 'tooling/cross_app_public_artifact.py'
      - 'tooling/tests/test_cross_app_public_artifact.py'
      - 'tooling/cross_app_demo_report.py'
      - 'tooling/tests/test_cross_app_demo_report.py'
      - 'tooling/native_blender_e2e.py'
      - 'tooling/native_render_e2e.py'
      # native-impact-triggers-begin
      - 'tooling/ci_native_impact.py'
      - 'tooling/tests/test_ci_native_impact.py'
      # native-impact-triggers-end
      - '.github/workflows/native-cross-app-recovery.yml'

permissions:
  contents: read

concurrency:
  group: cross-app-selective-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  PLAYWRIGHT_BROWSERS_PATH: '0'
  SEMWRIGHT_CHECKOUT: ${{ github.workspace }}/_semwright
  SEMWRIGHT_TEST_BLENDER_ROOT: /usr/local/blender-4.5.14-linux-x64

jobs:
  # native-impact-preflight-begin
  native-impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      native_required: ${{ steps.impact.outputs.native_required }}
      decision: ${{ steps.impact.outputs.decision }}
      receipt_sha256: ${{ steps.impact.outputs.receipt_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create isolated verification directories
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/native-impact-cross_app/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$target"
          mkdir -p "$target/tmp"
          echo "MW_NATIVE_IMPACT_OUTPUT=$target/evidence" >> "$GITHUB_ENV"
          echo "MW_NATIVE_IMPACT_TEST_TMP=$target/tmp" >> "$GITHUB_ENV"
          echo "TMPDIR=$target/tmp" >> "$GITHUB_ENV"
          echo "TEMP=$target/tmp" >> "$GITHUB_ENV"
          echo "TMP=$target/tmp" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Run G0 and bind native selection to original Git inputs
        id: impact
        env:
          MW_NATIVE_WORKFLOW: .github/workflows/native-cross-app-recovery.yml
        run: |
          python3 -B -I -S - <<'PY'
          import hashlib, os, pathlib, re, shutil, stat, subprocess, sys
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          expected = os.environ["GITHUB_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", expected):
              raise SystemExit("Invalid checkout SHA")
          git = pathlib.Path(shutil.which("git")).resolve(strict=True)
          if git.is_relative_to(root):
              raise SystemExit("Git resolves into source")
          for name in list(os.environ):
              if name.upper().startswith("GIT_"):
                  del os.environ[name]
          os.environ.update(GIT_NO_REPLACE_OBJECTS="1", GIT_GRAFT_FILE=os.devnull,
              GIT_CONFIG_GLOBAL=os.devnull, GIT_CONFIG_NOSYSTEM="1",
              GIT_NO_LAZY_FETCH="1", GIT_OPTIONAL_LOCKS="0", GIT_TERMINAL_PROMPT="0",
              GIT_CONFIG_COUNT="1", GIT_CONFIG_KEY_0="core.fsmonitor",
              GIT_CONFIG_VALUE_0="false")
          def read_git(*args):
              result = subprocess.run([str(git), "--no-replace-objects", *args],
                  cwd=root, capture_output=True, timeout=30, check=True)
              if len(result.stdout) > 2 * 1024 * 1024 or len(result.stderr) > 65536:
                  raise SystemExit("Bootstrap Git output exceeds budget")
              return result.stdout
          if read_git("rev-parse", "HEAD").strip().decode() != expected:
              raise SystemExit("Checkout differs from workflow source")
          target = root / "tooling/ci_native_impact.py"
          if target.is_symlink() or not target.is_file():
              raise SystemExit("Selector is not a regular source file")
          before = target.lstat()
          if not stat.S_ISREG(before.st_mode):
              raise SystemExit("Selector source mode differs")
          with target.open("rb") as stream:
              data = stream.read(256 * 1024 + 1)
          after = target.stat()
          token = lambda value: (value.st_dev, value.st_ino, value.st_size,
                                 value.st_mtime_ns, value.st_ctime_ns)
          if len(data) > 256 * 1024 or token(before) != token(after):
              raise SystemExit("Selector changed or exceeds budget")
          # Fixed-size rev-parse outputs only; the selector captures full status
          # with bounded pipes before loading any other checkout module.
          original_oid = read_git("rev-parse", "--verify", expected + ":tooling/ci_native_impact.py").strip().decode("ascii")
          actual_oid = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          if not re.fullmatch(r"[0-9a-f]{40}", original_oid) or actual_oid != original_oid:
              raise SystemExit("Selector bytes differ from original Git source")
          sys.argv = [str(target), "--repo", str(root), "--workflow",
              os.environ["MW_NATIVE_WORKFLOW"], "--output",
              os.environ["MW_NATIVE_IMPACT_OUTPUT"], "--github-output",
              os.environ["GITHUB_OUTPUT"]]
          # Execute the exact verified buffer without reopening the pathname.
          scope = {"__name__": "__main__", "__file__": str(target), "__package__": None}
          exec(compile(data, str(target), "exec"), scope)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-impact-cross_app-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MW_NATIVE_IMPACT_OUTPUT }}
          if-no-files-found: error
          retention-days: 14
  # native-impact-preflight-end
  real-blender-motion-restart:
    # native-impact-dependency-begin
    needs: native-impact
    if: ${{ needs.native-impact.result == 'success' && needs.native-impact.outputs.native_required == 'true' }}
    # native-impact-dependency-end
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Resolve immutable Semwright Native SDK pin
        id: pin
        run: |
          sha="$(python3 -c 'import json; print(json.load(open("SOURCE_LOCK.json"))["dependencies"]["semwright"]["revision"])')"
          test "${#sha}" -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: seradotcom/semwright
          ref: ${{ steps.pin.outputs.sha }}
          path: _semwright
          persist-credentials: false

      - name: Verify exact source identities
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git -C _semwright rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"
          python3 tooling/source_policy.py

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: motionwright-cross-app-recovery-1.98.1
          cache-on-failure: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: _semwright/integrations/motion-canvas/runtime/package-lock.json

      - name: Install pinned Blender and native sandbox requirements
        env:
          BLENDER_URL: https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz
          BLENDER_SHA256: 9ba871ff2ecd36526b77432745980b7e6664ecd0c7ca11c48849073dcfe06da3
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bubblewrap xz-utils fontconfig libpipewire-0.3-dev pkg-config clang
          curl --fail --location --retry 3 --output /tmp/blender.tar.xz "$BLENDER_URL"
          echo "$BLENDER_SHA256  /tmp/blender.tar.xz" | sha256sum --check -
          sudo tar -xJf /tmp/blender.tar.xz -C /usr/local
          test "$("$SEMWRIGHT_TEST_BLENDER_ROOT/blender" --version | head -1)" = "Blender 4.5.14 LTS"
          bwrap --version

      - name: Install exact Motion Canvas runtime and Firefox
        working-directory: _semwright/integrations/motion-canvas/runtime
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps firefox
          npm run probe
          node --input-type=module -e "import { firefox } from 'playwright'; import { existsSync } from 'node:fs'; const p=firefox.executablePath(); if (!existsSync(p)) process.exit(2); console.log('Pinned Firefox bundle present');"

      - name: Provision ephemeral Semwright driver sandbox
        run: |
          mkdir -p verification/native-cross-app-recovery
          bash _semwright/scripts/dev/ci-driver-bwrap-profile.sh \
            "$GITHUB_WORKSPACE/verification/native-cross-app-recovery/sandbox-profile.txt"

      - name: Build Semwright Broker and BOTH real drivers
        working-directory: _semwright
        run: |
          cargo build --locked -p semwright-daemon -p semwright-cli --bins
          cargo build --locked \
            -p semwright-plugin-host --bin semwright-sandbox \
            -p semwright-driver-blender --bin semwright-blender-driver --bin semwright-blender-session-runner \
            -p semwright-driver-motion-canvas --bin semwright-motion-canvas-driver

      # native-impact-moved-cross_app-0

      - name: Test recovery semantics and build integration binary
        run: |
          cargo test --locked -p motionwright-native recovery -- --nocapture
          cargo build --locked -p motionwright-native --example native-cross-app-recovery-e2e
          python3 -m py_compile tooling/native_cross_app_recovery_e2e.py
          python3 -m py_compile tooling/cross_app_demo_report.py
          # native-impact-moved-cross-app-demo

      - name: Cross-app native resume with immutable artifact evidence
        env:
          SEMWRIGHT_TEST_DRIVER_SANDBOX: '1'
          SEMWRIGHT_TEST_SANDBOX_HELPER: ${{ github.workspace }}/_semwright/target/debug/semwright-sandbox
        run: |
          python3 tooling/native_cross_app_recovery_e2e.py \
            | tee verification/native-cross-app-recovery/run.log

      - name: Independently verify bounded review evidence
        run: |
          test -s "verification/native-cross-app-recovery/$GITHUB_SHA/result.json"
          test -s "verification/native-cross-app-recovery/$GITHUB_SHA/stop.json"
          test -s "verification/native-cross-app-recovery/$GITHUB_SHA/failure.json"
          test -s "verification/native-cross-app-recovery/$GITHUB_SHA/bounded-native-failure-reasons.json"
          test -s "verification/native-cross-app-recovery/$GITHUB_SHA/resume.json"
          test -s "verification/native-cross-app-recovery/$GITHUB_SHA/repeat.json"
          test -s "verification/native-cross-app-recovery/$GITHUB_SHA/reused-blender.glb"
          test -s "verification/native-cross-app-recovery/$GITHUB_SHA/recovery-demo.html"
          test -s "verification/native-cross-app-recovery/$GITHUB_SHA/artifact-manifest.json"
          test -s "verification/native-cross-app-recovery/$GITHUB_SHA/first-frame.png"
          test -s "verification/native-cross-app-recovery/$GITHUB_SHA/middle-frame.png"
          test -s "verification/native-cross-app-recovery/$GITHUB_SHA/last-frame.png"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p = Path("verification/native-cross-app-recovery") / os.environ["GITHUB_SHA"]
          result = json.loads((p / "result.json").read_text())
          stop = json.loads((p / "stop.json").read_text())
          failure = json.loads((p / "failure.json").read_text())
          bounded = json.loads((p / "bounded-native-failure-reasons.json").read_text())
          resume = json.loads((p / "resume.json").read_text())
          repeat = json.loads((p / "repeat.json").read_text())
          sha = lambda f: hashlib.sha256(f.read_bytes()).hexdigest()
          assert result["native_cross_app_recovery_e2e"] == "PASS"
          assert result["source_motionwright"] == os.environ["GITHUB_SHA"]
          assert result["app_processes"] == 4
          assert result["native_motion_canvas_failed_attempts"] == 1
          assert result["native_motion_canvas_successful_attempts"] == 1
          assert len(result["browser_original_sha256"]) == 64
          assert failure["native_failure_class"] == "font_evidence"
          assert failure["native_status"] == "failed"
          assert failure["outcome_known"] is True
          assert failure["retryable"] is True
          assert failure["motion_canvas_attempt"] == 1
          assert failure["blender_reexecution_count"] == 0
          assert any(x.get("error_class") == "font_evidence"
                     and "enoent" in x.get("reason_codes", [])
                     for x in bounded["observations"])
          assert result["blender_native_driver_reexecutions"] == 0
          assert resume["recovery"]["blender"] == "reused"
          assert repeat["recovery"]["blender"] == "reused"
          assert repeat["recovery"]["motion_canvas"] == "reused"
          assert stop["blender_proof"]["sha256"] == sha(p / "reused-blender.glb")
          assert result["blender_glb_sha256"] == sha(p / "reused-blender.glb")
          assert result["motion_canvas_frame_count"] == 60
          assert result["motion_canvas_manifest_sha256"] == sha(p / "artifact-manifest.json")
          PY

      - name: Stage only verified public v0.1 artifacts, never raw private logs
        if: always()
        env:
          NATIVE_CI_JOB_STATUS: ${{ job.status }}
        run: |
          python3 tooling/cross_app_public_artifact.py \
            --source-sha "$GITHUB_SHA" \
            --evidence-root "verification/native-cross-app-recovery/$GITHUB_SHA" \
            --output-root "verification/native-cross-app-public" \
            --job-status "$NATIVE_CI_JOB_STATUS"
          python3 -m json.tool verification/native-cross-app-public/public-evidence.json >/dev/null

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cross-app-selective-recovery-${{ github.sha }}
          path: verification/native-cross-app-public
          if-no-files-found: error
          retention-days: 14

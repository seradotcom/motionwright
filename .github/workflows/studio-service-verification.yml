name: Selected Studio verification
run-name: Studio verification ${{ github.event_name == 'workflow_dispatch' && inputs.selection || 'G0 only' }} / ${{ github.sha }}
on:
  push:
    branches: ['verify/studio-service-*']
  workflow_dispatch:
    inputs:
      selection:
        description: Run a closed selection; all requires four bounded same-source shards (132 plus 11 plus 30 plus 35)
        type: choice
        required: true
        default: authoring-drafts
        options: [studio-service-68, phase1-service47, phase1-native-graph, criterion-partials, window-frontend, camera-with-v2, creative-production, creative-production-browser, project-authoring, project-authoring-core, production-design, creative-workbench, complete-authoring, authoring-drafts, narrative, all, canvas, ink, program, brief, brief-recovery, brief-uncertain, active-voice, camera, gesture, beat-draft, beat-time, delivery-recipe, recipe-authority, review, review-browser, inspector, profile-metadata, profile-authority, projection-navigation, browser-contracts, workflow-preview-browser, branch-claim, branch-authoring, claim-source, branch-combination]
      graph_review_spki_der_base64:
        description: Existing external review recipient RSA3072 public SPKI, required only for phase1-native-graph
        type: string
        required: false
      graph_review_spki_sha256:
        description: SHA256 of that public SPKI DER, required only for phase1-native-graph
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: studio-service-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
defaults:
  run:
    shell: bash
    working-directory: g
jobs:
  g0:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: g
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Always verify source, contracts and formatting
        run: |
          set -euo pipefail
          python -B tooling/source_policy.py
          python -B tooling/acceptance_policy.py
          python -B tooling/creative_status_policy.py
          python -B tooling/public_surface_policy.py
          cargo fmt --all -- --check
      - name: Require source-bound complete selection controls
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python -B tooling/ci_test_runner.py --repo . --mode both \
            --pattern test_ci_canvas_service.py --expected-source "$GITHUB_SHA" \
            --report ../v/g0/receipt.json --require-complete --timeout 600
      - name: Observe the immutable independent reader controls
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python -B tooling/ci_test_runner.py --repo . --mode discovery \
            --test-directory tooling/service_readback --pattern test_readback_r3.py \
            --expected-source "$GITHUB_SHA" --report ../v/g0/independent-reader.json \
            --require-complete --timeout 120
      - name: Retain original guard results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-service-g0-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: v/g0
          if-no-files-found: warn
          retention-days: 14
  creative-unit-build:
    name: ${{ inputs.selection == 'window-frontend' && 'Window and saved-font units (250), build and six Chromium contracts' || inputs.selection == 'branch-claim' && 'Branch and Claim units (134), domain and SQLite contracts' || inputs.selection == 'workflow-preview-browser' && 'Workflow and Preview units (79), native route and desktop compile' || inputs.selection == 'review' && 'Review units (72) and production build' || 'Creative Production and Workbench units (67) and production build' }}
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","creative-production","creative-production-browser","production-design","creative-workbench","review","workflow-preview-browser","branch-claim","window-frontend"]'), inputs.selection)
    needs: g0
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.selection == 'window-frontend' && 75 || inputs.selection == 'branch-claim' && 105 || inputs.selection == 'workflow-preview-browser' && 75 || 30 }}
    env:
      CARGO_HOME: ${{ github.workspace }}/v/c
      CARGO_TARGET_DIR: ${{ github.workspace }}/v/t
      NPM_CONFIG_CACHE: ${{ github.workspace }}/v/npm
      TMP: ${{ github.workspace }}/v/x
      TEMP: ${{ github.workspace }}/v/x
      TMPDIR: ${{ github.workspace }}/v/x
    steps:
      - name: Prepare isolated unit and build evidence
        working-directory: .
        run: |
          set -euo pipefail
          test ! -e v
          mkdir -p v/x v/npm
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: g
          ref: ${{ github.sha }}
          fetch-depth: ${{ inputs.selection == 'window-frontend' && 2 || 1 }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Observe the exact single-parent Window base in this same job
        if: inputs.selection == 'window-frontend'
        timeout-minutes: 2
        env:
          CI: 'true'
          MOTIONWRIGHT_CANDIDATE_BUILD: '0'
          NODE_OPTIONS: '--max-old-space-size=384'
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/v/pw
        run: |
          set -euo pipefail
          python -B -I tooling/ci_canvas_service.py window-base --repo . \
            --output ../v/tools/window-base
      - name: Bind Window source and hosted resource inputs before dependencies
        if: inputs.selection == 'window-frontend'
        timeout-minutes: 2
        env:
          CI: 'true'
          MOTIONWRIGHT_CANDIDATE_BUILD: '0'
          NODE_OPTIONS: '--max-old-space-size=384'
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/v/pw
        run: |
          set -euo pipefail
          python -B -I tooling/ci_canvas_service.py window-preflight --repo .
      - name: Install locked Window frontend dependencies
        if: inputs.selection == 'window-frontend'
        timeout-minutes: 10
        env:
          CI: 'true'
          MOTIONWRIGHT_CANDIDATE_BUILD: '0'
          NODE_OPTIONS: '--max-old-space-size=384'
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/v/pw
        working-directory: g/apps/studio
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
      - name: Install locked unit and build dependencies
        if: inputs.selection != 'window-frontend'
        working-directory: g/apps/studio
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
      - name: Verify security probe, selected exact Vitest assertions and build
        if: inputs.selection != 'window-frontend'
        env:
          REQUESTED_UNIT_SELECTION: ${{ inputs.selection == 'branch-claim' && 'branch-claim' || inputs.selection == 'workflow-preview-browser' && 'workflow-preview' || inputs.selection == 'review' && 'review' || 'creative-production' }}
        run: |
          set -euo pipefail
          python -B -I tooling/ci_canvas_service.py unit-build --repo . --output ../v/unit-build --selection "$REQUESTED_UNIT_SELECTION"
      - name: Observe exact Window55 and complete saved-font195 units and production build
        if: inputs.selection == 'window-frontend'
        timeout-minutes: 17
        env:
          CI: 'true'
          MOTIONWRIGHT_CANDIDATE_BUILD: '0'
          NODE_OPTIONS: '--max-old-space-size=384'
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/v/pw
        run: |
          set -euo pipefail
          python -B -I tooling/ci_canvas_service.py unit-build --repo . \
            --output ../v/e/window-unit-build --selection window-frontend
      - name: Install locked Chromium and retain frontend tool identities
        if: inputs.selection == 'window-frontend'
        timeout-minutes: 10
        env:
          CI: 'true'
          MOTIONWRIGHT_CANDIDATE_BUILD: '0'
          NODE_OPTIONS: '--max-old-space-size=384'
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/v/pw
        run: |
          set -euo pipefail
          test -d ../v/tools/window-base
          test ! -e ../v/tools/node.txt
          test ! -e ../v/tools/npm.txt
          test ! -e ../v/tools/python.txt
          node --version > ../v/tools/node.txt
          npm --version > ../v/tools/npm.txt
          python --version > ../v/tools/python.txt
          node apps/studio/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: List and observe the six exact synthetic Window browser contracts
        if: inputs.selection == 'window-frontend'
        timeout-minutes: 10
        env:
          CI: 'true'
          MOTIONWRIGHT_CANDIDATE_BUILD: '0'
          NODE_OPTIONS: '--max-old-space-size=384'
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/v/pw
        run: |
          set -euo pipefail
          python -B -I tooling/ci_canvas_service.py --repo . \
            --target ../v/t --output ../v/e --selection window-frontend
      - name: Close original Window unit build and browser evidence into the existing TAR
        id: window-archive
        if: success() && inputs.selection == 'window-frontend'
        timeout-minutes: 5
        env:
          CI: 'true'
          MOTIONWRIGHT_CANDIDATE_BUILD: '0'
          NODE_OPTIONS: '--max-old-space-size=384'
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/v/pw
        run: |
          set -euo pipefail
          python -B -I tooling/ci_canvas_service.py archive --repo . --evidence ../v
      - name: Retain Window original evidence and closed archive or incomplete diagnostics
        if: always() && inputs.selection == 'window-frontend'
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-window-frontend-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            v/e
            v/tools
            v/retained
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        if: contains(fromJSON('["workflow-preview-browser","branch-claim"]'), inputs.selection)
        with:
          toolchain: '1.98.1'
      - name: Install desktop compile prerequisites
        if: inputs.selection == 'workflow-preview-browser'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Verify original workflow route contracts and actual desktop compile
        if: inputs.selection == 'workflow-preview-browser'
        run: |
          set -euo pipefail
          python -B -I tooling/ci_canvas_service.py workflow-route --repo . --output ../v/native-route
      - name: Retain original native route commands and source identities
        if: always() && inputs.selection == 'workflow-preview-browser'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workflow-route-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: v/native-route
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Verify Claim domain, SQLite and compiled native consumers
        if: inputs.selection == 'branch-claim'
        run: |
          set -euo pipefail
          python -B -I tooling/ci_canvas_service.py claim-source-contracts --repo . --output ../v/claim-contracts
      - name: Retain original Claim contracts and source identities
        if: always() && inputs.selection == 'branch-claim'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: claim-contracts-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: v/claim-contracts
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Retain original unit report, command receipts and actual build output
        if: always() && inputs.selection != 'window-frontend'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-${{ inputs.selection == 'branch-claim' && 'branch-claim' || inputs.selection == 'workflow-preview-browser' && 'workflow-preview' || inputs.selection == 'review' && 'review' || 'creative' }}-unit-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: v/unit-build
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
  real-service:
    name: ${{ contains(fromJSON('["browser-contracts","creative-production-browser","review-browser","workflow-preview-browser"]'), matrix.selection) && 'Synthetic browser contracts' || 'Real SQLite and Studio' }} / ${{ matrix.selection }}
    if: github.event_name == 'workflow_dispatch' && inputs.selection != 'studio-service-68' && inputs.selection != 'window-frontend'
    needs: g0
    # Metadata read is job-wide; only the conditional Service47 guard receives its token.
    permissions:
      contents: read
      actions: read
      statuses: read
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        selection: ${{ fromJSON(inputs.selection == 'all' && '["project-authoring-core","review","creative-production","branch-claim"]' || inputs.selection == 'project-authoring' && '["project-authoring-core","review"]' || inputs.selection == 'review' && '["review-browser","review"]' || format('["{0}"]', inputs.selection)) }}
    # Each child keeps every original per-case bound; all requires every child.
    timeout-minutes: ${{ matrix.selection == 'phase1-native-graph' && 180 || matrix.selection == 'phase1-service47' && 110 || matrix.selection == 'camera-with-v2' && 90 || matrix.selection == 'branch-claim' && 120 || matrix.selection == 'browser-contracts' && 240 || matrix.selection == 'creative-production-browser' && 75 || matrix.selection == 'project-authoring-core' && 360 || matrix.selection == 'creative-production' && 110 || matrix.selection == 'review' && 70 || contains(fromJSON('["creative-production","production-design","creative-workbench","branch-claim","branch-authoring","claim-source"]'), matrix.selection) && 90 || matrix.selection == 'complete-authoring' && 180 || matrix.selection == 'authoring-drafts' && 120 || 60 }}
    env:
      CARGO_HOME: ${{ github.workspace }}/v/c
      CARGO_TARGET_DIR: ${{ github.workspace }}/v/t
      NPM_CONFIG_CACHE: ${{ github.workspace }}/v/npm
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/v/pw
      TMP: ${{ github.workspace }}/v/x
      TEMP: ${{ github.workspace }}/v/x
      TMPDIR: ${{ github.workspace }}/v/x
    steps:
      - name: Bind Service47 to its authenticated original job deadline
        if: matrix.selection == 'phase1-service47'
        working-directory: .
        timeout-minutes: 2
        env:
          MOTIONWRIGHT_SERVICE47_METADATA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import hashlib, json, os, re, signal, ssl, time, urllib.error, urllib.request
          from datetime import datetime
          from email.utils import parsedate_to_datetime
          from pathlib import Path

          def check(ok, reason):
              if not ok:
                  raise SystemExit("Service47 NOT_STARTED: " + reason)

          def timeout(_signal, _frame):
              raise SystemExit("Service47 NOT_STARTED: metadata deadline expired")

          signal.signal(signal.SIGALRM, timeout)
          signal.alarm(60)
          begin = time.monotonic_ns()
          binding = {key: os.environ.get(key) for key in (
              "GITHUB_REPOSITORY", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_JOB", "GITHUB_SHA",
              "GITHUB_WORKFLOW_REF", "GITHUB_WORKFLOW_SHA", "RUNNER_NAME")}
          check(all(isinstance(value, str) and value for value in binding.values()), "job binding absent")
          check(binding["GITHUB_JOB"] == "real-service" and os.environ.get("GITHUB_API_URL") == "https://api.github.com"
                and re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", binding["GITHUB_REPOSITORY"])
                and re.fullmatch(r"[0-9a-f]{40}", binding["GITHUB_SHA"])
                and binding["GITHUB_WORKFLOW_SHA"] == binding["GITHUB_SHA"]
                and binding["GITHUB_WORKFLOW_REF"].startswith(binding["GITHUB_REPOSITORY"]
                    + "/.github/workflows/studio-service-verification.yml@")
                and all(re.fullmatch(r"[1-9][0-9]*", binding[key])
                        for key in ("GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT")), "job/source binding differs")
          token = os.environ.pop("MOTIONWRIGHT_SERVICE47_METADATA_TOKEN", "")
          check(token != "", "read-only metadata token absent")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise SystemExit("Service47 NOT_STARTED: metadata redirect refused")
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect(),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()))
          base = ("https://api.github.com/repos/" + binding["GITHUB_REPOSITORY"] + "/actions/runs/"
                  + binding["GITHUB_RUN_ID"] + "/attempts/" + binding["GITHUB_RUN_ATTEMPT"])
          responses, originals, transport_originals = {}, {}, {}
          root = Path("v")
          check(not root.exists(), "fresh evidence namespace required")
          # Only bounded metadata originals are created here. Product preparation follows
          # authentication of the original GitHub job start and complete-phase admission.
          (root / "tools").mkdir(parents=True, exist_ok=False)
          def fetch(name, suffix):
              request = urllib.request.Request(base + suffix, headers={"Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "Cache-Control": "no-cache"})
              try:
                  response = opener.open(request, timeout=15)
              except urllib.error.HTTPError as error:
                  response = error
              with response:
                  dates = response.headers.get_all("Date", [])
                  raw = response.read(4 * 1024 * 1024 + 1)
                  with (root / "tools" / name).open("xb") as stream:
                      check(stream.write(raw) == len(raw), "metadata original short write")
                      stream.flush(); os.fsync(stream.fileno())
                  originals[name] = {"bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()}
                  responses[name] = {"url": base + suffix, "http_date": dates[0] if len(dates) == 1 else None,
                                     "http_dates": dates, "status": response.status, "age": response.headers.get("Age", "0"),
                                     "received_mono_ns": time.monotonic_ns(), "body_bytes": len(raw),
                                     "body_within_bound": 0 < len(raw) <= 4 * 1024 * 1024}
                  transport_name = name.replace(".original.json", ".transport.original.json")
                  transport = (json.dumps(responses[name], sort_keys=True, separators=(",", ":")) + "\n").encode()
                  check(len(transport) <= 65536, "metadata transport original exceeds bound")
                  with (root / "tools" / transport_name).open("xb") as stream:
                      check(stream.write(transport) == len(transport), "metadata transport original short write")
                      stream.flush(); os.fsync(stream.fileno())
                  transport_originals[transport_name] = {"bytes": len(transport), "sha256": hashlib.sha256(transport).hexdigest()}
                  # A failed response retains its original body/Date/status before denial.
                  # It never becomes an authenticated deadline and is never retried.
                  check(response.status == 200 and len(dates) == 1 and response.headers.get("Age", "0") == "0",
                        "metadata status/date/cache differs")
                  check(0 < len(raw) <= 4 * 1024 * 1024, "metadata original exceeds bound")
                  return json.loads(raw), dates[0]
          run, _ = fetch("phase1-run-response.original.json", "")
          jobs, date = fetch("phase1-jobs-response.original.json", "/jobs?per_page=100")
          end = time.monotonic_ns()
          token = None
          check(type(run.get("id")) is int and type(run.get("run_attempt")) is int
                and run.get("id") == int(binding["GITHUB_RUN_ID"])
                and run.get("run_attempt") == int(binding["GITHUB_RUN_ATTEMPT"])
                and run.get("head_sha") == binding["GITHUB_SHA"]
                and run.get("repository", {}).get("full_name") == binding["GITHUB_REPOSITORY"]
                and run.get("path", "").split("@", 1)[0] == ".github/workflows/studio-service-verification.yml"
                and run.get("event") == "workflow_dispatch" and run.get("status") == "in_progress", "run original differs")
          rows = jobs.get("jobs")
          check(isinstance(rows, list) and type(jobs.get("total_count")) is int
                and 0 < jobs["total_count"] == len(rows) <= 100, "job list is incomplete or paginated")
          selected = [row for row in rows if isinstance(row, dict)
                      and row.get("name") == "Real SQLite and Studio / phase1-service47"]
          check(len(selected) == 1, "current job is absent or ambiguous")
          job = selected[0]
          check(type(job.get("run_id")) is int and type(job.get("run_attempt")) is int
                and job.get("run_id") == int(binding["GITHUB_RUN_ID"])
                and job.get("run_attempt") == int(binding["GITHUB_RUN_ATTEMPT"])
                and job.get("head_sha") == binding["GITHUB_SHA"] and job.get("status") == "in_progress"
                and job.get("conclusion") is None and job.get("runner_name") == binding["RUNNER_NAME"]
                and type(job.get("id")) is int and job["id"] > 0, "job/runner original differs")
          server = parsedate_to_datetime(date)
          started = datetime.fromisoformat(job.get("started_at", "").replace("Z", "+00:00"))
          check(server.tzinfo is not None and started.tzinfo is not None
                and server.utcoffset().total_seconds() == started.utcoffset().total_seconds() == 0
                and server >= started, "original job start/HTTP Date differs")
          age = server - started
          elapsed_upper_ns = ((age.days * 86400 + age.seconds + 2) * 1_000_000_000 + age.microseconds * 1000)
          deadline = end + 6600 * 1_000_000_000 - elapsed_upper_ns - (end - begin)
          custody = {"execution_cleanup": 30, "seal_guard": 60, "seal": 300, "seal_cleanup": 30,
                     "closed_upload_guard": 60, "closed_upload": 300, "unsealed_upload_guard": 60, "unsealed_upload": 300}
          original = {"schema": "motionwright.service47-job-deadline/1", "binding": binding,
              "boot_id": Path("/proc/sys/kernel/random/boot_id").read_text().strip(),
              "job_seconds": 6600, "custody_seconds": custody, "rounding_allowance_seconds": 2,
              "request_started_mono_ns": begin, "response_received_mono_ns": end,
              "deadline_mono_ns": deadline, "jobs_http_date": date, "run": run, "jobs": jobs,
              "response_originals": originals, "response_transport_originals": transport_originals,
              "transport_observations": responses,
              "transport": "HTTPS_VERIFIED_NO_REDIRECT_NO_PROXY_AUTHENTICATED_READ_ONLY"}
          raw = (json.dumps(original, sort_keys=True, separators=(",", ":")) + "\n").encode()
          check(len(raw) <= 8 * 1024 * 1024 + 65536, "deadline original exceeds bound")
          with (root / "tools/phase1-deadline.original.json").open("xb") as stream:
              check(stream.write(raw) == len(raw), "deadline original short write")
              stream.flush(); os.fsync(stream.fileno())
          check(deadline - time.monotonic_ns() >= (180 + sum(custody.values())) * 1_000_000_000,
                "prepare/checkout plus custody does not fit the original job deadline")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write("MOTIONWRIGHT_SERVICE47_DEADLINE_SHA256=" + hashlib.sha256(raw).hexdigest() + "\n")
          signal.alarm(0)
          print("Service47 original job deadline admitted; no Service/browser/native process has run")
          PY
      - name: Bind Graph to its authenticated original job deadline
        if: matrix.selection == 'phase1-native-graph'
        working-directory: .
        timeout-minutes: 2
        env:
          MOTIONWRIGHT_GRAPH_METADATA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import hashlib, json, os, re, signal, ssl, time, urllib.error, urllib.request
          from datetime import datetime
          from email.utils import parsedate_to_datetime
          from pathlib import Path

          def check(ok, reason):
              if not ok:
                  raise SystemExit("Graph NOT_STARTED: " + reason)

          def timeout(_signal, _frame):
              raise SystemExit("Graph NOT_STARTED: metadata deadline expired")

          signal.signal(signal.SIGALRM, timeout)
          signal.alarm(60)
          begin = time.monotonic_ns()
          binding = {key: os.environ.get(key) for key in (
              "GITHUB_REPOSITORY", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_JOB", "GITHUB_SHA",
              "GITHUB_WORKFLOW_REF", "GITHUB_WORKFLOW_SHA", "RUNNER_NAME")}
          check(all(isinstance(value, str) and value for value in binding.values()), "job binding absent")
          check(binding["GITHUB_JOB"] == "real-service" and os.environ.get("GITHUB_API_URL") == "https://api.github.com"
                and re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", binding["GITHUB_REPOSITORY"])
                and re.fullmatch(r"[0-9a-f]{40}", binding["GITHUB_SHA"])
                and binding["GITHUB_WORKFLOW_SHA"] == binding["GITHUB_SHA"]
                and binding["GITHUB_WORKFLOW_REF"].startswith(binding["GITHUB_REPOSITORY"]
                    + "/.github/workflows/studio-service-verification.yml@")
                and all(re.fullmatch(r"[1-9][0-9]*", binding[key])
                        for key in ("GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT")), "job/source binding differs")
          token = os.environ.pop("MOTIONWRIGHT_GRAPH_METADATA_TOKEN", "")
          check(token != "", "read-only metadata token absent")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise SystemExit("Graph NOT_STARTED: metadata redirect refused")
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect(),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()))
          base = ("https://api.github.com/repos/" + binding["GITHUB_REPOSITORY"] + "/actions/runs/"
                  + binding["GITHUB_RUN_ID"] + "/attempts/" + binding["GITHUB_RUN_ATTEMPT"])
          responses, originals, transport_originals = {}, {}, {}
          root = Path("v")
          check(not root.exists(), "fresh evidence namespace required")
          # Only bounded metadata originals are created here. Product preparation follows
          # authentication of the original GitHub job start and complete-phase admission.
          (root / "tools").mkdir(parents=True, exist_ok=False)
          def fetch(name, suffix):
              request = urllib.request.Request(base + suffix, headers={"Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "Cache-Control": "no-cache"})
              try:
                  response = opener.open(request, timeout=15)
              except urllib.error.HTTPError as error:
                  response = error
              with response:
                  dates = response.headers.get_all("Date", [])
                  raw = response.read(4 * 1024 * 1024 + 1)
                  with (root / "tools" / name).open("xb") as stream:
                      check(stream.write(raw) == len(raw), "metadata original short write")
                      stream.flush(); os.fsync(stream.fileno())
                  originals[name] = {"bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()}
                  responses[name] = {"url": base + suffix, "http_date": dates[0] if len(dates) == 1 else None,
                                     "http_dates": dates, "status": response.status, "age": response.headers.get("Age", "0"),
                                     "received_mono_ns": time.monotonic_ns(), "body_bytes": len(raw),
                                     "body_within_bound": 0 < len(raw) <= 4 * 1024 * 1024}
                  transport_name = name.replace(".original.json", ".transport.original.json")
                  transport = (json.dumps(responses[name], sort_keys=True, separators=(",", ":")) + "\n").encode()
                  check(len(transport) <= 65536, "metadata transport original exceeds bound")
                  with (root / "tools" / transport_name).open("xb") as stream:
                      check(stream.write(transport) == len(transport), "metadata transport original short write")
                      stream.flush(); os.fsync(stream.fileno())
                  transport_originals[transport_name] = {"bytes": len(transport), "sha256": hashlib.sha256(transport).hexdigest()}
                  # A failed response retains its original body/Date/status before denial.
                  # It never becomes an authenticated deadline and is never retried.
                  check(response.status == 200 and len(dates) == 1 and response.headers.get("Age", "0") == "0",
                        "metadata status/date/cache differs")
                  check(0 < len(raw) <= 4 * 1024 * 1024, "metadata original exceeds bound")
                  return json.loads(raw), dates[0]
          run, _ = fetch("graph-run-response.original.json", "")
          jobs, date = fetch("graph-jobs-response.original.json", "/jobs?per_page=100")
          end = time.monotonic_ns()
          token = None
          check(type(run.get("id")) is int and type(run.get("run_attempt")) is int
                and run.get("id") == int(binding["GITHUB_RUN_ID"])
                and run.get("run_attempt") == int(binding["GITHUB_RUN_ATTEMPT"])
                and run.get("head_sha") == binding["GITHUB_SHA"]
                and run.get("repository", {}).get("full_name") == binding["GITHUB_REPOSITORY"]
                and run.get("path", "").split("@", 1)[0] == ".github/workflows/studio-service-verification.yml"
                and run.get("event") == "workflow_dispatch" and run.get("status") == "in_progress"
                and run.get("head_repository", {}).get("full_name") == "seradotcom/motionwright"
                and run.get("actor", {}).get("type") == "User" and type(run["actor"].get("id")) is int
                and run["actor"]["id"] > 0 and binding["GITHUB_REPOSITORY"] == "seradotcom/motionwright"
                and binding["GITHUB_RUN_ATTEMPT"] == "1", "run original differs")
          rows = jobs.get("jobs")
          check(isinstance(rows, list) and type(jobs.get("total_count")) is int
                and 0 < jobs["total_count"] == len(rows) <= 100, "job list is incomplete or paginated")
          selected = [row for row in rows if isinstance(row, dict)
                      and row.get("name") == "Real SQLite and Studio / phase1-native-graph"]
          check(len(selected) == 1, "current job is absent or ambiguous")
          job = selected[0]
          check(type(job.get("run_id")) is int and type(job.get("run_attempt")) is int
                and job.get("run_id") == int(binding["GITHUB_RUN_ID"])
                and job.get("run_attempt") == int(binding["GITHUB_RUN_ATTEMPT"])
                and job.get("head_sha") == binding["GITHUB_SHA"] and job.get("status") == "in_progress"
                and job.get("conclusion") is None and job.get("runner_name") == binding["RUNNER_NAME"]
                and type(job.get("id")) is int and job["id"] > 0, "job/runner original differs")
          server = parsedate_to_datetime(date)
          started = datetime.fromisoformat(job.get("started_at", "").replace("Z", "+00:00"))
          check(server.tzinfo is not None and started.tzinfo is not None
                and server.utcoffset().total_seconds() == started.utcoffset().total_seconds() == 0
                and server >= started, "original job start/HTTP Date differs")
          age = server - started
          elapsed_upper_ns = ((age.days * 86400 + age.seconds + 2) * 1_000_000_000 + age.microseconds * 1000)
          deadline = end + 10800 * 1_000_000_000 - elapsed_upper_ns - (end - begin)
          phases = {"prepare": 1200, "runtime": 1200, "sdk-build": 1800, "product-build": 1800,
                    "producer-index": 600, "review-upload": 300, "approval-wait": 1200,
                    "discovery": 60, "cases": 780, "closure": 300, "archive": 600, "final-upload": 300}
          anchor_mono, anchor_wall = time.monotonic_ns(), time.time_ns() // 1000000
          original = {"schema": "motionwright.graph-job-deadline/1", "binding": binding,
              "boot_id": Path("/proc/sys/kernel/random/boot_id").read_text().strip(),
              "job_seconds": 10800, "phase_seconds": phases, "rounding_allowance_seconds": 2,
              "request_started_mono_ns": begin, "response_received_mono_ns": end,
              "deadline_mono_ns": deadline, "jobs_http_date": date,
              "clock_anchor_mono_ns": anchor_mono, "clock_anchor_wall_ms": anchor_wall,
              "deadline_unix_ms": anchor_wall + (deadline - anchor_mono) // 1000000, "run": run, "jobs": jobs,
              "response_originals": originals, "response_transport_originals": transport_originals,
              "transport_observations": responses,
              "transport": "HTTPS_VERIFIED_NO_REDIRECT_NO_PROXY_AUTHENTICATED_READ_ONLY"}
          raw = (json.dumps(original, sort_keys=True, separators=(",", ":")) + "\n").encode()
          check(len(raw) <= 8 * 1024 * 1024 + 65536, "deadline original exceeds bound")
          with (root / "tools/graph-deadline.original.json").open("xb") as stream:
              check(stream.write(raw) == len(raw), "deadline original short write")
              stream.flush(); os.fsync(stream.fileno())
          check(deadline - time.monotonic_ns() >= sum(phases.values()) * 1_000_000_000,
                "all Graph phases plus the original remaining custody does not fit the original job deadline")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write("MOTIONWRIGHT_GRAPH_DEADLINE_SHA256=" + hashlib.sha256(raw).hexdigest() + "\n")
          signal.alarm(0)
          print("Graph original job deadline admitted; no Service/browser/native process has run")
          PY
      - name: Prepare isolated output and temporary paths
        working-directory: .
        timeout-minutes: ${{ contains(fromJSON('["phase1-service47","phase1-native-graph"]'), matrix.selection) && 1 || 360 }}
        env:
          REQUESTED_SELECTION: ${{ matrix.selection }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED_SELECTION" = phase1-service47 ]; then
            test -f v/tools/phase1-deadline.original.json
            test ! -e v/x
            test ! -e v/c
          elif [ "$REQUESTED_SELECTION" = phase1-native-graph ]; then
            test -f v/tools/graph-deadline.original.json
            test ! -e v/x
            test ! -e v/c
          else
            test ! -e v
          fi
          mkdir -p v/x v/c v/tools

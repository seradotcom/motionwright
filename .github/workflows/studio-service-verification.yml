          check(original["deadline_mono_ns"] - now >= (300 + reserve) * 1_000_000_000,
                "whole upload and pending custody no longer fit")
          record = {"schema": "motionwright.service47-upload-admission/1", "mode": mode,
                    "deadline_original_sha256": hashlib.sha256(raw).hexdigest(), "observed_mono_ns": now,
                    "deadline_mono_ns": original["deadline_mono_ns"], "phase_seconds": 300, "reserve_seconds": reserve,
                    "status": "ADMITTED_NOT_AN_UPLOAD_RESULT", "retry": "FORBIDDEN"}
          directory = Path("v/retained") if mode == "closed" else Path("v/tools")
          directory.mkdir(exist_ok=True)
          with (directory / ("phase1-" + mode + "-upload-admission.json")).open("x", encoding="utf-8") as stream:
              stream.write(json.dumps(record, sort_keys=True) + "\n"); stream.flush(); os.fsync(stream.fileno())
          check(original["deadline_mono_ns"] - time.monotonic_ns() >= (300 + reserve) * 1_000_000_000,
                "upload admission custody consumed its remaining budget")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("admitted=true\n")
          signal.alarm(0)
          PY
      - name: Preserve unsealed diagnostics when archive custody fails
        if: always() && steps.archive.outcome != 'success' && (matrix.selection != 'phase1-service47' || steps.phase1-unsealed-upload-admission.outputs.admitted == 'true') && (matrix.selection != 'phase1-native-graph' || steps.graph-final-upload-admission.outputs.admitted == 'true')
        timeout-minutes: ${{ contains(fromJSON('["phase1-service47","phase1-native-graph"]'), matrix.selection) && 5 || 360 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-service-unsealed-${{ matrix.selection }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            v/e
            v/tools
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  studio-service-68:
    name: Exact F278 Studio service and independent closed-store readback (68)
    if: github.event_name == 'workflow_dispatch' && inputs.selection == 'studio-service-68'
    needs: g0
    runs-on: ubuntu-24.04
    # Eight phase caps: 18660 s; original H: 19800 s; custody reserve: 1140 s.
    # Setup/upload plus the bounded controller total at most 359 minutes.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 2
        with:
          path: g
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 2
        with:
          path: p
          ref: '278f6777b999275e1d7c69e46e91a6439c172e90'
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        timeout-minutes: 2
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        timeout-minutes: 2
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        timeout-minutes: 5
        with:
          toolchain: '1.98.1'
          components: clippy, rustfmt
      - name: Set one fresh evidence namespace outside both source checkouts
        timeout-minutes: 1
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/motionwright-studio68-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$root"
          printf 'MW_STUDIO68_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Observe F G0, one source-built service, the exact 68 cases and R3 readback
        timeout-minutes: 335
        env:
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
        run: |
          set -euo pipefail
          env -u LD_PRELOAD -u LD_LIBRARY_PATH -u LD_AUDIT \
            python -I -B -X utf8 tooling/ci_canvas_service.py studio68 \
            --gate-repo . --product-repo ../p \
            --product-source 278f6777b999275e1d7c69e46e91a6439c172e90 \
            --root "$MW_STUDIO68_ROOT"
      - name: Retain observed source, build, binary, service and readback originals
        timeout-minutes: 10
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio68-gate-${{ github.sha }}-product-278f6777-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MW_STUDIO68_ROOT }}/evidence
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

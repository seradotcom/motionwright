name: Selected Studio service verification
run-name: Studio service ${{ github.event_name == 'workflow_dispatch' && inputs.selection || 'G0 only' }} / ${{ github.sha }}
on:
  push:
    branches: ['verify/studio-service-*']
    paths:
      - '.github/workflows/studio-service-verification.yml'
      - 'tooling/ci_canvas_service.py'
      - 'tooling/tests/test_ci_canvas_service.py'
  workflow_dispatch:
    inputs:
      selection:
        description: Run only the required real-service selection; all is the complete defined roster
        type: choice
        required: true
        default: narrative
        options: [narrative, all, canvas, ink, program, brief, brief-recovery, brief-uncertain, active-voice, camera, gesture]
permissions:
  contents: read
concurrency:
  group: studio-service-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
defaults:
  run:
    shell: bash
    working-directory: g
jobs:
  g0:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: g
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Always verify source, contracts and formatting
        run: |
          set -euo pipefail
          python -B tooling/source_policy.py
          python -B tooling/acceptance_policy.py
          python -B tooling/creative_status_policy.py
          python -B tooling/public_surface_policy.py
          cargo fmt --all -- --check
      - name: Require source-bound complete selection controls
        run: |
          set -euo pipefail
          python -B tooling/ci_test_runner.py --repo . --mode both \
            --pattern test_ci_canvas_service.py --expected-source "$GITHUB_SHA" \
            --report ../v/g0/receipt.json --require-complete
      - name: Retain original guard results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-service-g0-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: v/g0
          if-no-files-found: warn
          retention-days: 14
  real-service:
    name: Real SQLite and Studio / ${{ inputs.selection }}
    if: github.event_name == 'workflow_dispatch'
    needs: g0
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_HOME: ${{ github.workspace }}/v/c
      CARGO_TARGET_DIR: ${{ github.workspace }}/v/t
      NPM_CONFIG_CACHE: ${{ github.workspace }}/v/npm
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/v/pw
      TMP: ${{ github.workspace }}/v/x
      TEMP: ${{ github.workspace }}/v/x
      TMPDIR: ${{ github.workspace }}/v/x
    steps:
      - name: Prepare isolated output and temporary paths
        working-directory: .
        run: |
          set -euo pipefail
          test ! -e v
          mkdir -p v/x v/c v/tools
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: g
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.98.1'
      - name: Retain tool identities
        run: |
          set -euo pipefail
          rustc -Vv > ../v/tools/rustc.txt
          cargo -V > ../v/tools/cargo.txt
          node --version > ../v/tools/node.txt
          npm --version > ../v/tools/npm.txt
          python --version > ../v/tools/python.txt
      - name: Install locked Studio dependencies and Chromium
        working-directory: g/apps/studio
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Execute selected cases against the real source-built service
        env:
          REQUESTED_SELECTION: ${{ inputs.selection }}
        run: |
          set -euo pipefail
          python -B -I tooling/ci_canvas_service.py --repo . \
            --target ../v/t --output ../v/e --selection "$REQUESTED_SELECTION"
      - name: Retain original reports, closed stores, streams and service binary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-service-${{ inputs.selection }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            v/e
            v/tools
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Admit the complete Service47 closed upload
        id: phase1-closed-upload-admission
        if: always() && matrix.selection == 'phase1-service47'
        working-directory: .
        timeout-minutes: 1
        env:
          SERVICE47_UPLOAD_MODE: closed
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import hashlib, json, os, signal, stat, time
          from pathlib import Path

          def check(ok, reason):
              if not ok:
                  raise SystemExit("Service47 upload NOT_STARTED: " + reason)

          def timeout(_signal, _frame):
              raise SystemExit("Service47 upload NOT_STARTED: custody guard expired")

          signal.signal(signal.SIGALRM, timeout); signal.alarm(50)
          path = Path("v/tools/phase1-deadline.original.json")
          check(not path.is_symlink() and path.parent.is_dir() and not path.parent.is_symlink()
                and path.parent.parent.is_dir() and not path.parent.parent.is_symlink(), "original ancestry differs")
          before = path.stat()
          check(stat.S_ISREG(before.st_mode) and 0 < before.st_size <= 8 * 1024 * 1024 + 65536, "original size differs")
          with os.fdopen(os.open(path, os.O_RDONLY | os.O_NOFOLLOW), "rb") as stream:
              opened = os.fstat(stream.fileno())
              check((opened.st_dev, opened.st_ino, opened.st_size, opened.st_mtime_ns, opened.st_ctime_ns)
                    == (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_ctime_ns), "original changed before open")
              raw = stream.read(8 * 1024 * 1024 + 65537)
          check(len(raw) == before.st_size and hashlib.sha256(raw).hexdigest()
                == os.environ.get("MOTIONWRIGHT_SERVICE47_DEADLINE_SHA256"), "pinned original changed")
          original = json.loads(raw)
          check(original.get("schema") == "motionwright.service47-job-deadline/1"
                and original.get("binding") == {key: os.environ.get(key) for key in (
                    "GITHUB_REPOSITORY", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_JOB", "GITHUB_SHA",
                    "GITHUB_WORKFLOW_REF", "GITHUB_WORKFLOW_SHA", "RUNNER_NAME")}
                and original.get("boot_id") == Path("/proc/sys/kernel/random/boot_id").read_text().strip()
                and original.get("job_seconds") == 6600, "original job/host binding differs")
          now = time.monotonic_ns()
          check(type(original.get("response_received_mono_ns")) is int and original["response_received_mono_ns"] <= now
                and type(original.get("deadline_mono_ns")) is int, "original monotonic clock differs")
          mode = os.environ.get("SERVICE47_UPLOAD_MODE")
          check(mode in ("closed", "unsealed"), "unknown upload phase")
          # Both existing uploads are reserved. The fallback is never granted a fresh H.
          reserve = 360 if mode == "closed" else 0
          check(original["deadline_mono_ns"] - now >= (300 + reserve) * 1_000_000_000,
                "whole upload and pending custody no longer fit")
          record = {"schema": "motionwright.service47-upload-admission/1", "mode": mode,
                    "deadline_original_sha256": hashlib.sha256(raw).hexdigest(), "observed_mono_ns": now,
                    "deadline_mono_ns": original["deadline_mono_ns"], "phase_seconds": 300, "reserve_seconds": reserve,
                    "status": "ADMITTED_NOT_AN_UPLOAD_RESULT", "retry": "FORBIDDEN"}
          directory = Path("v/retained") if mode == "closed" else Path("v/tools")
          directory.mkdir(exist_ok=True)
          with (directory / ("phase1-" + mode + "-upload-admission.json")).open("x", encoding="utf-8") as stream:
              stream.write(json.dumps(record, sort_keys=True) + "\n"); stream.flush(); os.fsync(stream.fileno())
          check(original["deadline_mono_ns"] - time.monotonic_ns() >= (300 + reserve) * 1_000_000_000,
                "upload admission custody consumed its remaining budget")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("admitted=true\n")
          signal.alarm(0)
          PY

      - name: Close complete original evidence into a verified TAR
        id: archive
        timeout-minutes: ${{ matrix.selection == 'phase1-native-graph' && 11 || matrix.selection == 'phase1-service47' && 7 || 360 }}
        if: success()
        run: |

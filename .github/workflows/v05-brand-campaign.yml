name: V05 owner-reviewed brand campaign CAS

on:
  pull_request:
    paths:
      - 'crates/domain/src/brand_campaign.rs'
      - 'crates/domain/src/lib.rs'
      - 'crates/domain/tests/brand_campaign.rs'
      - 'crates/service/tests/brand_campaign_persistence.rs'
      - 'crates/native/src/brand_campaign_tests.rs'
      - 'crates/native/src/lib.rs'
      - 'apps/studio/src/brandCampaign*'
      - 'apps/studio/src/BrandCampaignWorkbench.tsx'
      - 'apps/studio/src/BrandTasteWorkbench.tsx'
      - 'apps/studio/src/brand-campaign.css'
      - 'apps/studio/src/api.ts'
      - 'apps/studio/src/types.ts'
      - 'apps/studio/tests/brand-campaign.spec.ts'
      - 'docs/creative-production/V05_BRAND_CAMPAIGN_ROLLOUT.md'
      - 'docs/creative-production/requirements-status.json'
      - '.github/workflows/v05-brand-campaign.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v05-brand-campaign-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-source-and-cas:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - run: python3 tooling/source_policy.py && python3 tooling/creative_status_policy.py
      - run: cargo fmt --all -- --check
      - name: One source-bound multi-scene project CAS and SQLite replay
        run: |
          cargo test --locked -p motionwright-domain --test brand_campaign
          cargo test --locked -p motionwright-service --test brand_campaign_persistence
          cargo test --locked -p motionwright-native --lib brand_campaign_tests
      - name: Strict first-party source and native SDK Clippy
        run: cargo clippy --locked -p motionwright-domain -p motionwright-service -p motionwright-native --all-targets -- -D warnings

  owner-visual-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run src/brandCampaign.test.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/brand-campaign.spec.ts --project=chromium

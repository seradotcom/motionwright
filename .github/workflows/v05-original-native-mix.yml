name: V05 physical original 3-bus mix and audition

on:
  # Compile the bounded original-mix Rust suite on affected source or lock pushes.
  # Full meter, renderer and audition gates remain PR or explicitly manual.
  push:
    branches: ['integrate/phase1-final-composition-20261027']
    paths:
      - 'crates/native/src/original_mix.rs'
      - 'crates/native/src/original_mix/**'
      - 'crates/native/tests/original_mix.rs'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/native/Cargo.toml'
      - '.github/workflows/v05-original-native-mix.yml'
  pull_request:
    paths:
      - 'crates/native/src/original_mix.rs'
      - 'crates/native/src/original_mix/**'
      - 'crates/native/src/lib.rs'
      - 'crates/native/tests/original_mix.rs'
      - 'crates/native/examples/native_mix_fixture.rs'
      - 'crates/service/src/audio.rs'
      - 'crates/service/src/lib.rs'
      - 'crates/service/tests/original_mix_custody.rs'
      - 'apps/desktop/src-tauri/src/original_mix_native.rs'
      - 'apps/desktop/src-tauri/src/main.rs'
      - 'apps/studio/src/NativeOriginalMixReview.tsx'
      - 'apps/studio/src/nativeMixTypes.ts'
      - 'apps/studio/src/nativeOriginalMixBrowser.test.ts'
      - 'apps/studio/src/AudioWorkspace.tsx'
      - 'apps/studio/src/api.ts'
      - 'apps/studio/tests/native-original-mix.spec.ts'
      - 'tooling/native-original-mix/**'
      - 'docs/creative-production/V05_ORIGINAL_NATIVE_PCM_MIX.md'
      - 'docs/creative-production/requirements-status.json'
      - '.github/workflows/v05-original-native-mix.yml'
      - 'crates/native/src/mlt_av_audio.rs'
      - 'crates/native/src/production.rs'
      - 'crates/native/src/production/mlt_multisegment_av.rs'
      - 'crates/native/tests/saved_original_mix.rs'
      - 'crates/native/tests/saved_mix_native_consumers.rs'
      - 'apps/desktop/src-tauri/src/av_master.rs'
      - 'apps/desktop/src-tauri/Cargo.toml'
      - 'apps/desktop/src-tauri/build.rs'
      - 'crates/native/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'SOURCE_LOCK.json'
      - 'tooling/ci_saved_original_mix.py'
      - 'tooling/tests/test_ci_saved_original_mix.py'
      - 'tooling/native_original_mix_custody.py'
      - 'tooling/tests/test_native_original_mix_custody.py'
      - 'tooling/ci_test_runner.py'
      - 'tooling/ci_storage_apply_recovery.py'
  workflow_dispatch:
    inputs:
      verification:
        description: "Select the original meter/audition checks or saved-recipe source contracts"
        type: choice
        required: true
        default: original
        options:
          - original
          - saved-mix
          - tauri-audition
      tauri_expected_source:
        description: "Exact source SHA for the isolated Tauri development case"
        type: string
        required: false
        default: ''
      tauri_public_recipient_json:
        description: "Public RSA recipient JSON only; never a private key"
        type: string
        required: false
        default: ''
      tauri_recipient_sha256:
        description: "Expected public recipient SPKI SHA-256"
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: v05-original-native-mix-${{ github.ref }}-${{ inputs.verification || 'original' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || (inputs.verification != 'saved-mix' && inputs.verification != 'tauri-audition') }}

jobs:
  original-mix-rust-source-impact:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.98.1'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: v05-original-first-party-source-mix-1.98.1
          cache-on-failure: true
      - name: Verify bounded source route and compile the changed original mix
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/integrate/phase1-final-composition-20261027
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REPOSITORY" = seradotcom/motionwright
          python3 -B -m unittest -q tooling.tests.test_ci_v05_original_mix_impact_route
          python3 -B tooling/source_policy.py
          mkdir -p "$RUNNER_TEMP/original-mix-rust-source-impact"
          cargo test --locked -p motionwright-native --test original_mix 2>&1 | tee "$RUNNER_TEMP/original-mix-rust-source-impact/roster.original.log"
          # Reuse the same original compiled integration suite. Once the
          # source contains the PCM16 unity regression, require an actual
          # passing test result, not merely the presence of a test name.
          if grep -Fq 'fn unity_gain_original_pcm16_source_retains_exact_quantized_samples()' crates/native/tests/original_mix.rs; then
            test "$(grep -Fxc 'test unity_gain_original_pcm16_source_retains_exact_quantized_samples ... ok' "$RUNNER_TEMP/original-mix-rust-source-impact/roster.original.log")" -eq 1
          else
            printf '%s\n' 'NOT_RUN: unity PCM16 source test is absent; no selected regression G1 credit'
          fi
          # Source-bound emitted PCM16 peak/RMS receipts are checked against
          # the actual compiled integration-test output, not a source label.
          # Reuse the existing original_mix Cargo run and its retained log.
          if grep -Fq 'fn emitted_pcm16_peak_and_rms_receipts_follow_actual_quantized_samples()' crates/native/tests/original_mix.rs; then
            test "$(grep -Fxc 'test emitted_pcm16_peak_and_rms_receipts_follow_actual_quantized_samples ... ok' "$RUNNER_TEMP/original-mix-rust-source-impact/roster.original.log")" -eq 1
          else
            printf '%s\n' 'NOT_RUN: emitted PCM16 meter source test is absent; no selected regression G1 credit'
          fi
          sha256sum "$RUNNER_TEMP/original-mix-rust-source-impact/roster.original.log" > "$RUNNER_TEMP/original-mix-rust-source-impact/roster.original.sha256"
          # The PCM floor unit resides in the library module, not the
          # external original_mix test target. Run it exactly once when
          # the corresponding source change has actually been admitted.
          if test -f crates/native/src/original_mix/semantic_bus.rs &&
             grep -Fq 'fn additive_semantic_sfx_keeps_valid_negative_pcm16_endpoint_and_rejects_overflow()' crates/native/src/original_mix/semantic_bus.rs; then
            cargo test --locked -p motionwright-native --lib original_mix::semantic_bus::tests::additive_semantic_sfx_keeps_valid_negative_pcm16_endpoint_and_rejects_overflow -- --exact 2>&1 | tee "$RUNNER_TEMP/original-mix-rust-source-impact/semantic-unit.original.log"
            grep -Eq '^test result: ok[.] 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9]+([.][0-9]+)?s$' "$RUNNER_TEMP/original-mix-rust-source-impact/semantic-unit.original.log"
          sha256sum "$RUNNER_TEMP/original-mix-rust-source-impact/semantic-unit.original.log" > "$RUNNER_TEMP/original-mix-rust-source-impact/semantic-unit.original.sha256"
          else
            printf '%s\n' 'NOT_RUN: semantic PCM floor unit absent from this source; no G1 credit'
          fi
      - name: Retain original bounded Rust source unit roster
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: original-mix-rust-source-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/original-mix-rust-source-impact/
          if-no-files-found: warn
          retention-days: 7

  native-source-and-independent-meter:
    if: ${{ github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || (inputs.verification != 'saved-mix' && inputs.verification != 'tauri-audition')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: v05-original-first-party-source-mix-1.98.1
          cache-on-failure: true
      - name: Source policy and creative requirement truth
        run: |
          python3 tooling/source_policy.py
          python3 tooling/creative_status_policy.py
          cargo fmt --all -- --check
      - name: Full-source PCM hashes, clipping bounds, source custody, independent replay
        run: |
          cargo test --locked -p motionwright-native --test original_mix
          cargo test --locked -p motionwright-service --test original_mix_custody
          cargo clippy --locked -p motionwright-service -p motionwright-native --all-targets -- -D warnings
          cargo build --locked -p motionwright-native --example native_mix_fixture
          python3 -m py_compile tooling/native-original-mix/original_mix_e2e.py
      - name: Independent FFmpeg true peak and EBU R128 instrument on disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg python3-pil
      - name: Actual three-locale WAV decode and source-specific duck measurements
        run: /usr/bin/python3 tooling/native-original-mix/original_mix_e2e.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: V05-original-mix-technical-NOT_MASTERED-${{ github.sha }}
          path: verification/original-voice-music-sfx/
          if-no-files-found: warn
          retention-days: 7

  studio-audition:
    if: ${{ github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || (inputs.verification != 'saved-mix' && inputs.verification != 'tauri-audition')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run src/nativeOriginalMixBrowser.test.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/native-original-mix.spec.ts --project=chromium

  saved-mix-g0:
    if: ${{ github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.verification != 'tauri-audition') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Selected source gate admission controls
        run: |
          python3 -B -E -s tooling/ci_test_runner.py --repo "$GITHUB_WORKSPACE" \
            --mode both --pattern test_ci_saved_original_mix.py --require-complete --pattern test_native_original_mix_custody.py \
            --expected-source "$GITHUB_SHA" --report "$RUNNER_TEMP/saved-mix-g0/receipt.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: saved-mix-G0-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/saved-mix-g0/
          if-no-files-found: error
          retention-days: 7

  saved-mix:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verification == 'saved-mix' }}
    needs: saved-mix-g0
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SAVED_MIX_SELECTION: ${{ inputs.verification }}
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.98.1'
          components: clippy
      - name: Desktop build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Execute exactly 70 selected source contracts
        run: |
          python3 -B -E -s tooling/ci_saved_original_mix.py --repo "$GITHUB_WORKSPACE" \
            --expected-source "$GITHUB_SHA" --selection saved-mix \
            --output "$RUNNER_TEMP/saved-mix-evidence" --target "$RUNNER_TEMP/saved-mix-target"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: saved-mix-source-contracts-NOT_NATIVE_RENDER-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/saved-mix-evidence/
          if-no-files-found: error
          retention-days: 7

  tauri-audition:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verification == 'tauri-audition' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MW_AUDIO_DIAGNOSTIC_SELECTION: ${{ inputs.verification }}
      MW_TAURI_AUDIO_EXPECTED_SOURCE: ${{ inputs.tauri_expected_source }}
      MW_TAURI_AUDIO_PUBLIC_RECIPIENT_JSON: ${{ inputs.tauri_public_recipient_json }}
      MW_TAURI_AUDIO_RECIPIENT_SHA256: ${{ inputs.tauri_recipient_sha256 }}
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.98.1'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - name: Install existing Tauri and accessible desktop prerequisites
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_SHA" = "$MW_TAURI_AUDIO_EXPECTED_SOURCE"
          test "$GITHUB_REPOSITORY" = seradotcom/motionwright
          test "$MW_AUDIO_DIAGNOSTIC_SELECTION" = tauri-audition
          # Ubuntu 24.04 runners can expose either the signed deb822 archive
          # or a mirror+file list. Prefer the existing official fallback if
          # present, but never reject a valid signed runner for a missing file.
          sources=/etc/apt/sources.list.d/ubuntu.sources
          mirrors=/etc/apt/apt-mirrors.txt
          if test -f "$sources" && test ! -L "$sources" &&
             grep -Fqx 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' "$sources"; then
            if grep -Eq '^URIs: mirror[+]file:/etc/apt/apt-mirrors[.]txt$' "$sources"; then
              if test -f "$mirrors" && test ! -L "$mirrors" &&
                 grep -Eq '^https?://archive[.]ubuntu[.]com/ubuntu/?[[:space:]]*$' "$mirrors"; then
                sudo sed -i '/azure[.]archive[.]ubuntu[.]com/d' "$mirrors"
                grep -Eq '^https?://archive[.]ubuntu[.]com/ubuntu/?[[:space:]]*$' "$mirrors"
                echo 'APT_OFFICIAL_UBUNTU_MIRROR=existing-list-fallback'
              else
                sudo sed -i 's|^URIs: mirror+file:/etc/apt/apt-mirrors[.]txt$|URIs: https://archive.ubuntu.com/ubuntu/|' "$sources"
                grep -Fqx 'URIs: https://archive.ubuntu.com/ubuntu/' "$sources"
                echo 'APT_OFFICIAL_UBUNTU_MIRROR=signed-deb822-fallback'
              fi
            elif grep -Eq '^URIs: https?://azure[.]archive[.]ubuntu[.]com/ubuntu/?$' "$sources"; then
              sudo sed -i -E 's|^URIs: https?://azure[.]archive[.]ubuntu[.]com/ubuntu/?$|URIs: https://archive.ubuntu.com/ubuntu/|' "$sources"
              grep -Fqx 'URIs: https://archive.ubuntu.com/ubuntu/' "$sources"
              echo 'APT_OFFICIAL_UBUNTU_MIRROR=signed-deb822-replacement'
            else
              echo 'APT_OFFICIAL_UBUNTU_MIRROR=runner-default'
            fi
          else
            echo 'APT_OFFICIAL_UBUNTU_MIRROR=runner-default'
          fi
          # Same signed packages as before; bounds apply to downloads, not
          # acceptance, authority, or release policy.
          timeout --signal=TERM --kill-after=30s 240s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          timeout --signal=TERM --kill-after=30s 1080s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev python3-gi python3-cryptography gir1.2-atspi-2.0 gir1.2-gtk-3.0 at-spi2-core xvfb x11-utils dbus-x11 openbox
      - name: Admit exact source and public recipient before Native
        id: admission
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3 -B -E -s tooling/ci_tauri_audio_audition.py admit \
            --repo "$GITHUB_WORKSPACE" --expected-source "$MW_TAURI_AUDIO_EXPECTED_SOURCE"
          printf 'CARGO_TARGET_DIR=%s/tauri-audition-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Verify changed development admission and routing
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3 -B -E -s tooling/ci_test_runner.py --repo "$GITHUB_WORKSPACE" \
            --mode both --pattern test_ci_tauri_audio_audition.py \
            --pattern test_ci_v05_original_mix_impact_route.py \
            --pattern test_native_tauri_audio_audition.py --require-complete \
            --expected-source "$GITHUB_SHA" --report "$RUNNER_TEMP/tauri-audition-ci/source-tests.original.json"
          /usr/bin/python3 -B -E -s tooling/source_policy.py
      - name: Build the unchanged real Studio frontend
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npm --prefix apps/studio ci --no-audit --no-fund > "$RUNNER_TEMP/tauri-audition-ci/npm-ci.original.log" 2>&1
          npm --prefix apps/studio run build > "$RUNNER_TEMP/tauri-audition-ci/frontend-build.original.log" 2>&1
      - name: Run only affected Native custody fixture and audition contracts
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cargo test --locked -p motionwright-native --lib original_mix::development_audition_custody::linux::tests:: \
            > "$RUNNER_TEMP/tauri-audition-ci/native-custody-tests.original.log" 2>&1
          cargo test --locked -p motionwright-native --example native-render-e2e native_saved_mix_e2e::tauri_audio::tests:: \
            > "$RUNNER_TEMP/tauri-audition-ci/native-fixture-tests.original.log" 2>&1
          cargo test --locked -p motionwright-desktop --bin motionwright-desktop original_mix_native::tests:: \
            > "$RUNNER_TEMP/tauri-audition-ci/desktop-audition-tests.original.log" 2>&1
          /usr/bin/python3 -B -E -s - <<'PY'
          import os, pathlib, re
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "tauri-audition-ci"
          for name, count in (("native-custody", 5), ("native-fixture", 6), ("desktop-audition", None)):
              text = (root / (name + "-tests.original.log")).read_text()
              found = re.findall(r"(?m)^test result: ok\. ([1-9][0-9]*) passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9.]+s$", text)
              if len(found) != 1 or (count is not None and int(found[0]) != count):
                  raise SystemExit("Selected Rust roster missing or changed: " + name)
          PY
      - name: Build exact real desktop and independent fixture executables
        env:
          MOTIONWRIGHT_DEVELOPMENT_AUDITION_BUILD_SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cargo build --locked -p motionwright-desktop -p motionwright-native \
            --bin motionwright-desktop --example native-render-e2e --features tauri/custom-protocol \
            --message-format=json-render-diagnostics \
            > "$RUNNER_TEMP/tauri-audition-ci/build.original.jsonl" \
            2> "$RUNNER_TEMP/tauri-audition-ci/build.original.stderr"
      - name: Execute one genuine Tauri save audition and closed Store readback
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24" \
            dbus-run-session -- /usr/bin/python3 -B -E -s tooling/ci_tauri_audio_session.py \
            --repo "$GITHUB_WORKSPACE" \
            --desktop "$CARGO_TARGET_DIR/debug/motionwright-desktop" \
            --fixture "$CARGO_TARGET_DIR/debug/examples/native-render-e2e" \
            --build-original "$RUNNER_TEMP/tauri-audition-ci/build.original.jsonl" --seconds 120 \
            > "$RUNNER_TEMP/tauri-audition-ci/harness.original.stdout" \
            2> "$RUNNER_TEMP/tauri-audition-ci/harness.original.stderr"
      - name: Seal original development evidence once
        if: always() && steps.admission.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3 -B -E -s tooling/ci_tauri_audio_audition.py seal \
            --repo "$GITHUB_WORKSPACE" --expected-source "$MW_TAURI_AUDIO_EXPECTED_SOURCE"
      - name: Upload only sealed development originals
        if: always() && steps.admission.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tauri-audition-development-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tauri-audition-ci/sealed-originals.bin
            ${{ runner.temp }}/tauri-audition-ci/public-evidence.json
          if-no-files-found: error
          overwrite: false
          compression-level: 0
          retention-days: 14

      MOTIONWRIGHT_OTIO_INPUT_PROFILE: ${{ inputs.interchange_case == 'otio-kdenlive' && 'kdenlive' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

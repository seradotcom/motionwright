          elif selection == "camera-spatial":
            print(f"SPATIAL_CAMERA_SOURCE_STUDIO=PASS; cases={expected}; real_Service_SQLite_cases=2; browser_fixture_cases=4; original_source=SYNTHETIC_AUTHORED; OriginalStoreReopen=YES; NativeHost=NOT_RUN; G2=NOT_GRANTED")

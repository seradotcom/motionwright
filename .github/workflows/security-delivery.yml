  native-otio-media-real:
    name: ${{ inputs.interchange_case == 'portable-project' && 'Original portable project in Studio through real Service and Store reopen' || 'Original OTIO media in Studio through real Service and closed Store' }}
    if: github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'native-otio-real-media'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      MOTIONWRIGHT_OTIO_REAL_MEDIA_OWNER: ${{ inputs.interchange_case == 'portable-project' && '0' || '1' }}
      MW_INTERCHANGE_CASE: ${{ inputs.interchange_case || 'otio' }}
      MOTIONWRIGHT_OTIO_INPUT_PROFILE: ${{ inputs.interchange_case == 'otio-kdenlive' && 'kdenlive' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Original source policy and actual protected system media runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
          python3 -B -E -s tooling/source_policy.py
          python3 -B -E -s tooling/public_surface_policy.py
          if [ "$MW_INTERCHANGE_CASE" = otio ] || [ "$MW_INTERCHANGE_CASE" = otio-kdenlive ]; then
          python3 -B -E -s -m unittest \
            tooling.tests.test_ci_saved_original_mix.GeneratedPermissionContracts -v
          fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev ffmpeg python3
          if [ "$MW_INTERCHANGE_CASE" = otio ] || [ "$MW_INTERCHANGE_CASE" = otio-kdenlive ]; then
          test -x /usr/bin/python3
          test -x /usr/bin/ffprobe
          /usr/bin/python3 -B -E -s - <<'PY_NATIVE_OTIO_HOST'
          import os, pathlib, stat
          for name in ('python3', 'ffprobe'):
              real = pathlib.Path('/usr/bin',name).resolve(strict=True)
              assert real.parent in (pathlib.Path('/usr/bin'),pathlib.Path('/bin'))
              for path in (real,real.parent):
                  info=path.stat()
                  assert info.st_uid == 0 and not info.st_mode & 0o022, name
              assert real.stat().st_mode & 0o111, name
          print('native-otio-protected-runtime=PASS')
          PY_NATIVE_OTIO_HOST
          fi
      - name: Compile exact Desktop OTIO source and real StudioService test owner
        shell: bash
        env:
          MW_OTIO_CI: ${{ runner.temp }}/otio-media-${{ github.run_id }}-${{ github.run_attempt }}
          MW_OTIO_STORE: ${{ runner.temp }}/otio-private-store-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          umask 077
          test ! -e "$MW_OTIO_CI"
          test ! -e "$MW_OTIO_STORE"
          mkdir -m 700 "$MW_OTIO_CI" "$MW_OTIO_STORE"
          if [ "$MW_INTERCHANGE_CASE" = otio ] || [ "$MW_INTERCHANGE_CASE" = otio-kdenlive ]; then
          cargo test --locked --jobs 2 -p motionwright-desktop --bin motionwright-desktop \
            'otio_bridge::tests::' -- --test-threads=1 \
            2>&1 | tee "$MW_OTIO_CI/desktop-tests.original.log"
          /usr/bin/python3 -B -E -s - <<'PY_NATIVE_OTIO_RUST'
          import os, pathlib, re
          text=pathlib.Path(os.environ['MW_OTIO_CI'],'desktop-tests.original.log').read_text()
          text=re.sub(r'\x1b\[[0-9;]*m','',text)
          expected={
            'isolated_original_bridge_stages_the_real_decoder_supervisor_source',
            'refused_otio_names_and_missing_bundle_never_touch_media_or_grants',
            'original_source_identity_rejects_same_size_name_replacement_and_symlink',
            'portable_otio_publication_never_clobbers_a_racing_directory_or_dangling_symlink',
            'request_rejects_foreign_fields_before_bridge_authority',
            'media_bundle_export_rejects_implicit_rights_and_noncanonical_origins',
          }
          found=set(re.findall(r'(?m)^test otio_bridge::tests::([A-Za-z0-9_]+) \.\.\. ok$',text))
          assert found==expected,(found,expected)
          assert re.search(r'(?m)^test result: ok\. 6 passed; 0 failed; 0 ignored;',text)
          print('native-otio-bridge-compiled=PASS 6/6 exact Rust tests')
          PY_NATIVE_OTIO_RUST
          fi
          cargo build --locked --jobs 2 -p motionwright-service --example studio_review_session \
            > "$MW_OTIO_CI/cargo-service.original.log" 2>&1 || {
              tail -n 35 "$MW_OTIO_CI/cargo-service.original.log"; exit 1;
            }
          bin="$GITHUB_WORKSPACE/target/debug/examples/studio_review_session"
          test -f "$bin" && test -x "$bin" && test ! -L "$bin"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          /usr/bin/python3 -B -E -s - <<'PY_NATIVE_OTIO_GENERATED'
          import json, os, pathlib, subprocess, sys
          repo = pathlib.Path.cwd()
          output = pathlib.Path(os.environ["MW_OTIO_CI"])
          sys.path.insert(0, str(repo / "tooling"))
          import ci_saved_original_mix as generated
          # Tauri emits its bounded command permissions during compilation.
          # Admit exact provider-derived bytes only, retaining every other
          # untracked file as a hard failure instead of ignoring the checkout.
          inventories = []
          for label, options in (
              ("untracked", ("--others", "--exclude-standard")),
              ("generated-ignored", ("--others", "--ignored", "--exclude-standard",
                                    "--", "apps/desktop/src-tauri/gen",
                                    "apps/desktop/src-tauri/permissions")),
          ):
              raw = subprocess.check_output(["git", "ls-files", "-z", *options], cwd=repo)
              assert len(raw) <= 128 * 1024
              (output / (label + ".original")).write_bytes(raw)
              inventories.append(raw)
          permissions = generated.generated_permissions(repo)
          observed = generated.generated_schemas(repo, permissions, inventories)
          if os.environ["MW_INTERCHANGE_CASE"] in ("otio", "otio-kdenlive"):
              assert set(permissions).issubset(observed), "generated command permissions are incomplete"
          else:
              assert os.environ["MW_INTERCHANGE_CASE"] == "portable-project"
              assert not observed, "Service-only compilation must keep the checkout pristine"
          (output / "generated-permissions.json").write_text(json.dumps({
              "source_sha": os.environ["GITHUB_SHA"],
              "permission_count": len(permissions) if observed else 0,
              "files": observed,
              "status": "EXACT_LOCKED_GENERATED_PERMISSIONS" if observed else "PRISTINE_SERVICE_ONLY_BUILD",
          }, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print("original-interchange-source=PASS", os.environ["MW_INTERCHANGE_CASE"])
          PY_NATIVE_OTIO_GENERATED
          printf 'MOTIONWRIGHT_SERVICE_TEST_BIN=%s\n' "$bin" >> "$GITHUB_ENV"
          printf 'MOTIONWRIGHT_SERVICE_TEST_TMPDIR=%s\n' "$MW_OTIO_STORE" >> "$GITHUB_ENV"
      - name: One selected original Studio interchange with actual Store readback
        working-directory: apps/studio
        shell: bash
        env:
          MW_OTIO_CI: ${{ runner.temp }}/otio-media-${{ github.run_id }}-${{ github.run_attempt }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/otio-media-${{ github.run_id }}-${{ github.run_attempt }}/playwright.json
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          case "$MW_INTERCHANGE_CASE" in
            otio|otio-kdenlive) selection=(tests/otio-real-media-bridge-service.spec.ts) ;;
            portable-project)
              selection=(tests/project-mutation.spec.ts --grep 'real portable export and verified restore rotate generation, preserve CAS and serialize the next Brief edit$') ;;
            *) echo 'Unadmitted original interchange selection'; exit 2 ;;
          esac
          npx playwright test "${selection[@]}" \
            --project chromium --workers=1 --retries=0 --reporter=line,json \
            2>&1 | tee "$MW_OTIO_CI/otio-playwright.original.log"
          /usr/bin/python3 -B -E -s - <<'PY_NATIVE_OTIO_PASS'
          import hashlib, json, os, pathlib
          root=pathlib.Path(os.environ['MW_OTIO_CI'])
          result=json.loads((root/'playwright.json').read_bytes())
          stats=result['stats']
          assert stats.get('expected')==1,stats
          assert all(stats.get(k,0)==0 for k in ('unexpected','flaky','skipped')),stats
          original=(root/'otio-playwright.original.log').read_bytes()
          assert 0<len(original)<8*1024*1024
          receipt={
            'schema':'motionwright.ci.original-studio-interchange/1',
            'case':os.environ['MW_INTERCHANGE_CASE'],
            'source_sha':os.environ['GITHUB_SHA'],
            'run_id':os.environ['GITHUB_RUN_ID'],
            'attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'status':{
              'otio':'ONE_REAL_MEDIA_STUDIO_SERVICE_SQLITE_CAS_ROUNDTRIP_PASS',
              'otio-kdenlive':'ONE_KDENLIVE_CUT_STUDIO_SERVICE_SQLITE_CAS_ROUNDTRIP_PASS',
              'portable-project':'ONE_ORIGINAL_PORTABLE_PROJECT_EXPORT_IMPORT_REOPEN_PASS',
            }[os.environ['MW_INTERCHANGE_CASE']],
            'input_profile':os.environ.get('MOTIONWRIGHT_OTIO_INPUT_PROFILE') or None,
            'expected':1,'unexpected':0,'flaky':0,'skipped':0,
            'original_log_sha256':hashlib.sha256(original).hexdigest(),
            'original_log_bytes':len(original),
            'installed_tauri':False,'actual_nle_installed':False,
            'human_acceptance':False,'release_authorized':False,
            'G2':'NOT_GRANTED','G3':'STOP'
          }
          (root/'receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('studio-interchange=PASS',os.environ['MW_INTERCHANGE_CASE'],'one original Store flow')
          PY_NATIVE_OTIO_PASS
      - name: Retain only safe source-bound logs and outcome, never original media or Store
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: original-${{ inputs.interchange_case == 'portable-project' && 'portable-project' || 'otio-media' }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/otio-media-${{ github.run_id }}-${{ github.run_attempt }}/desktop-tests.original.log
            ${{ runner.temp }}/otio-media-${{ github.run_id }}-${{ github.run_attempt }}/cargo-service.original.log
            ${{ runner.temp }}/otio-media-${{ github.run_id }}-${{ github.run_attempt }}/untracked.original
            ${{ runner.temp }}/otio-media-${{ github.run_id }}-${{ github.run_attempt }}/generated-ignored.original
            ${{ runner.temp }}/otio-media-${{ github.run_id }}-${{ github.run_attempt }}/generated-permissions.json
            ${{ runner.temp }}/otio-media-${{ github.run_id }}-${{ github.run_attempt }}/otio-playwright.original.log
            ${{ runner.temp }}/otio-media-${{ github.run_id }}-${{ github.run_attempt }}/playwright.json
            ${{ runner.temp }}/otio-media-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json
          if-no-files-found: warn
          retention-days: 14

      - name: Retain original portable Service observations and closed Store metadata
        if: always() && inputs.interchange_case == 'portable-project'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: original-portable-service-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/studio/test-results/**/canonical-mutation-real-service-evidence.json
            apps/studio/test-results/**/font-copy-editor.png
            apps/studio/test-results/**/real-portable-restored-edited-reopened.png
          if-no-files-found: warn
          retention-days: 14

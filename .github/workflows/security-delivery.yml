              require(git("rev-parse", "HEAD") == expected_source, "checkout source changed")
              tree = git("rev-parse", "HEAD^{tree}")
              require(not git("status", "--porcelain", "--untracked-files=no"),
                      "tracked checkout changed")
              for options in (("--others", "--exclude-standard"),
                              ("--others", "--ignored", "--exclude-standard")):
                  require(not git("ls-files", *options), "unbound checkout input exists")
              receipt = json.loads(report.read_text(encoding="utf-8"))
              require(receipt["schema"] == "motionwright.unittest-execution/1", "unexpected receipt schema")
              require(receipt["executed_source_sha"] == expected_source and receipt["tree_sha"] == tree,
                      "receipt source binding differs")
              require(receipt["status"] == "PASS" and receipt["exit_code"] == 0
                      and receipt["require_complete"] is True, "receipt is not complete PASS")
              require(receipt["runner_sha256"] == digest(repo / "tooling/ci_test_runner.py"),
                      "runner identity differs")
              definitions = {"tooling/tests/" + pattern: digest(repo / "tooling/tests" / pattern)
                             for pattern in patterns}
              require(receipt["test_definition_sha256"] == definitions, "test definition closure differs")
              require(receipt["source_locks"] == {name: digest(repo / name) for name in
                      ("Cargo.lock", "SOURCE_LOCK.json", "apps/studio/package-lock.json")},
                      "source-lock bindings differ")
              require(receipt["github"] == {name: os.environ.get(name, "") for name in
                      ("GITHUB_SHA", "GITHUB_WORKFLOW_REF", "GITHUB_RUN_ID",
                       "GITHUB_RUN_ATTEMPT", "GITHUB_JOB")}, "workflow binding differs")
              labels = {}
              for module in rosters:
                  labels["discovery:" + module + ".py"] = (
                      module, [sys.executable, "-B", "-E", "-s", "-m", "unittest", "discover",
                               "-s", "tooling/tests", "-p", module + ".py", "-v"])
                  labels["dotted:tooling.tests." + module] = (
                      module, [sys.executable, "-B", "-E", "-s", "-m", "unittest",
                               "tooling.tests." + module, "-v"])
              steps = receipt["steps"]
              require(len(steps) == len(labels)
                      and {step["entry_point"] for step in steps} == set(labels),
                      "entry-point labels are missing, duplicated or unexpected")
              observed = {}
              for index, step in enumerate(steps):
                  label = step["entry_point"]
                  module, command = labels[label]
                  expected_ids = sorted(rosters[module])
                  require(step["command"] == command, "entry-point command differs: " + label)
                  require(step["status"] == "PASS" and step["exit_code"] == 0,
                          "entry point did not pass: " + label)
                  require(step["counts"] == {
                      "terminal_status": "OK", "tests_run": len(expected_ids), "passed": len(expected_ids),
                      "failures": 0, "errors": 0, "skipped": 0,
                      "expected_failures": 0, "unexpected_successes": 0,
                  }, "entry-point counts differ: " + label)
                  for stream in ("stdout", "stderr"):
                      path = output / ("unittest-" + str(index).zfill(2) + "-" + stream + ".log")
                      require(step[stream] == {"file": path.name, "sha256": digest(path)},
                              "original log binding differs: " + label + "/" + stream)
                  raw = (output / step["stderr"]["file"]).read_bytes().decode("utf-8", "strict")
                  ids = []
                  for line in raw.splitlines():
                      if not line.startswith("test_"):
                          continue
                      match = re.fullmatch(r"(test_\w+) \(([A-Za-z_]\w*(?:\.[A-Za-z_]\w*)*)\) \.\.\. ok", line)
                      require(match is not None, "unexpected verbose test record: " + label)
                      method, qualified = match.groups()
                      qualified = qualified.removeprefix("tooling.tests.")
                      if not qualified.endswith("." + method):
                          qualified += "." + method
                      ids.append(qualified)
                  require(len(ids) == len(set(ids)) and sorted(ids) == expected_ids,
                          "executed test identities differ: " + label)
                  observed[label] = sorted(ids)
              require(len(policy_results) == len(policy_names)
                      and all(item["exit_code"] == 0 for item in policy_results),

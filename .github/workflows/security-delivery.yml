        shell: python -B -E -s {0}
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          from datetime import datetime, timezone

          repo = (Path(os.environ["GITHUB_WORKSPACE"]) / "source").resolve(strict=True)

            unrepresentable_shape_geometry_never_silently_becomes_a_native_motion
            unsupported_position_curves_stay_out_of_canonical_film
            unsupported_canvas_semantics_fail_closed
          )
          for name in "${names[@]}"; do
            test_case="film::tests::$name"
            cargo test --locked --jobs 2 -p motionwright-native --lib "$test_case" \
              -- --exact --test-threads=1 \
              2>&1 | tee "$MW_GEOMETRY_ORIGINALS/$name.original.log"
          done
          python3 -B -E -s - <<'PY_NATIVE_FILM_GEOMETRY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          names = (
            "exact_shape_resize_and_rotation_preserve_top_left_authoring_in_native_tweens",
            "vertical_replan_shape_resize_keeps_native_top_left_across_asymmetric_scales",
            "unrepresentable_shape_geometry_never_silently_becomes_a_native_motion",
            "unsupported_position_curves_stay_out_of_canonical_film",
            "unsupported_canvas_semantics_fail_closed",
          )
          folder = Path(os.environ["MW_GEOMETRY_ORIGINALS"])
          observed = []
          for name in names:
              path = folder / (name + ".original.log")
              raw = path.read_bytes()
              text = re.sub(r"\x1b\[[0-9;]*m", "", raw.decode("utf-8", "strict"))
              case = "film::tests::" + name
              assert re.search(r"(?m)^test " + re.escape(case) + r" \.\.\. ok$", text), case
              assert re.search(r"(?m)^test result: ok\. 1 passed; 0 failed; 0 ignored;", text), case
              observed.append({
                  "name": case, "bytes": len(raw),
                  "sha256": hashlib.sha256(raw).hexdigest(),
              })
          assert len(observed) == 5
          record = {
              "schema": "motionwright.ci.native-film-geometry-source/1",
              "source_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "status": "FIVE_COMPILED_SOURCE_TESTS_PASS",
              "cases": observed,
              "actual_native_renderer": "NOT_RUN",
              "authoring_native_frame_oracle": "NOT_RUN",
              "G2": "NOT_GRANTED",
              "G3": "STOP",
              "release_authorized": False,
          }
          (folder / "receipt.json").write_text(json.dumps(record, sort_keys=True, indent=2) + "\n")
          print("native-film-geometry=PASS cases=5 physical-G2=NOT_GRANTED")
          PY_NATIVE_FILM_GEOMETRY
          git diff --exit-code
      - name: Retain exact compiled Native Film test originals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-film-geometry-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-film-geometry-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14


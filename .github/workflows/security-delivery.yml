              require(receipt["status"] == "PASS" and receipt["exit_code"] == 0
                      and receipt["require_complete"] is True, "receipt is not complete PASS")
              require(receipt["runner_sha256"] == digest(repo / "tooling/ci_test_runner.py"),
                      "runner identity differs")
              definitions = {"tooling/tests/" + pattern: digest(repo / "tooling/tests" / pattern)
                             for pattern in patterns}
              require(receipt["test_definition_sha256"] == definitions, "test definition closure differs")
              require(receipt["source_locks"] == {name: digest(repo / name) for name in
                      ("Cargo.lock", "SOURCE_LOCK.json", "apps/studio/package-lock.json")},

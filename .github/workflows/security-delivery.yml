          assert stats["expected"] == expected, stats
          assert all(stats.get(key, 0) == 0 for key in ("unexpected","flaky","skipped")), stats
          if selection == "asset-media":
              print(f"ORIGINAL_ASSET_MEDIA_STUDIO=PASS; cases={expected}; real_Service_SQLite_cases=2; component_cases=1; MP4_WAV_decode_and_seek=YES; PNG_JPEG_original_decode=YES; original_sources=SYNTHETIC; StoreReopen=YES; NativeHost=NOT_RUN; installed_WebView=NOT_VERIFIED; G2=NOT_GRANTED")
          elif selection == "source-boards-ui":

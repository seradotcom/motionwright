              selected_cases='.' ;;
            camera-spatial)
              specs=(tests/blender-product-recipe-service.spec.ts tests/craft-library.spec.ts)
              selected_cases='.' ;;
            camera-craft)
              specs=(tests/camera-reframe-service.spec.ts tests/mask-window-service.spec.ts tests/craft-library.spec.ts)
              selected_cases='.' ;;
            series-silence)
              specs=(tests/measured-comparison.spec.ts tests/measured-comparison-service.spec.ts tests/silence-release-service.spec.ts)
              selected_cases='.' ;;
            measured-comparison)

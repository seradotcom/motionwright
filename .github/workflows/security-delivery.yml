name: Security and Delivery

on:
  push:
    branches: ["main", "feat/**"]
    paths:
      - "apps/desktop/src-tauri/**"
      - "apps/studio/src/**"
      - "crates/storage/**"
      - "crates/service/**"
      - "tooling/source_policy.py"
      - "tooling/release_manifest.py"
      - "tooling/v01_release_readiness.py"
      - "docs/v01-release-readiness.md"
      - "docs/acceptance/**"
      - "docs/security/known-rustsec-advisories.json"
      - "tooling/package_receipt.py"
      - "tooling/security_advisory_policy.py"
      - "tooling/glib_owner_chain.py"
      - "tooling/v01_glib_product_admission.py"
      - "tooling/upstream-crates/**"
      - "vendor/glib-0.18.5/**"
      - "tooling/tests/**"
      - "docs/security/**"
      - "SOURCE_LOCK.json"
      - "Cargo.lock"
      - "apps/studio/package-lock.json"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "docs/security.md"
      - ".github/workflows/security-delivery.yml"
      - ".github/workflows/package-candidate.yml"
      - ".github/workflows/heavy-verification.yml"
  pull_request:
    paths:
      - "apps/desktop/src-tauri/**"
      - "apps/studio/src/**"
      - "crates/storage/**"
      - "crates/service/**"
      - "tooling/source_policy.py"
      - "tooling/release_manifest.py"
      - "tooling/v01_release_readiness.py"
      - "docs/v01-release-readiness.md"
      - "docs/acceptance/**"
      - "docs/security/known-rustsec-advisories.json"
      - "tooling/package_receipt.py"
      - "tooling/security_advisory_policy.py"
      - "tooling/glib_owner_chain.py"
      - "tooling/v01_glib_product_admission.py"
      - "tooling/upstream-crates/**"
      - "vendor/glib-0.18.5/**"
      - "tooling/tests/**"
      - "docs/security/**"
      - "SOURCE_LOCK.json"
      - "Cargo.lock"
      - "apps/studio/package-lock.json"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "docs/security.md"
      - ".github/workflows/security-delivery.yml"
      - ".github/workflows/package-candidate.yml"
      - ".github/workflows/heavy-verification.yml"
  workflow_dispatch:
    inputs:
      verification_scope:
        description: Verification scope for this dispatch
        required: true
        type: choice
        default: full
        options:
          - full
          - source-admission-contracts
          - foundation-causal
          - foundation-import-budget
          - foundation-current
          - foundation-projection-diagnostic
          - foundation-composed-current
          - foundation-coherent-current
          - storage-api-regressions
          - storage-service-current
          - service-legacy-fixtures
          - native-source-export
          - desktop-source
          - desktop-compile
          - desktop-hyperframes
          - desktop-blender
          - desktop-playback
          - desktop-saved-delivery
          - desktop-workflow
          - first-use-example
          - native-otio-snapshot
          - native-otio-real-media
          - native-source-browser
          - native-film-geometry
          - native-film-hold
          - native-geometry-readback
      desktop_compile_platform:
        description: Operating system for targeted Desktop checks; macOS applies to desktop-compile; no Native execution
        type: choice
        required: false
        default: linux
        options: [linux, windows, macos]
      first_use_case:
        description: Impact selection for coherent source projections and actual Service product flows
        type: choice
        required: false
        default: all
        options: [all, static-group, static-alignment, static-layout, follow, follow-ui, static-rotation, creative-batch, audio-cut, native-preview-blend, delivery-hero, measured-comparison, series-silence, camera-craft, source-boards, source-boards-ui, asset-media, camera-spatial, project-compatibility, runtime-profiles, code-experiment]
      interchange_case:
        description: One original Studio flow for native-otio-real-media; no other suites
        type: choice
        required: true
        default: otio
        options: [otio, otio-kdenlive, portable-project]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  source-boundary:
    if: github.event_name != 'workflow_dispatch' || (inputs.verification_scope != 'source-admission-contracts' && inputs.verification_scope != 'foundation-causal' && inputs.verification_scope != 'foundation-import-budget' && inputs.verification_scope != 'foundation-current' && inputs.verification_scope != 'foundation-projection-diagnostic' && inputs.verification_scope != 'foundation-composed-current' && inputs.verification_scope != 'foundation-coherent-current' && inputs.verification_scope != 'storage-api-regressions' && inputs.verification_scope != 'storage-service-current' && inputs.verification_scope != 'service-legacy-fixtures' && inputs.verification_scope != 'native-source-export' && inputs.verification_scope != 'desktop-source' && inputs.verification_scope != 'desktop-compile' && inputs.verification_scope != 'desktop-hyperframes' && inputs.verification_scope != 'desktop-blender' && inputs.verification_scope != 'desktop-playback' && inputs.verification_scope != 'desktop-saved-delivery' && inputs.verification_scope != 'desktop-workflow' && inputs.verification_scope != 'first-use-example' && inputs.verification_scope != 'native-otio-snapshot' && inputs.verification_scope != 'native-otio-real-media' && inputs.verification_scope != 'native-source-browser' && inputs.verification_scope != 'native-film-geometry' && inputs.verification_scope != 'native-film-hold' && inputs.verification_scope != 'native-geometry-readback')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Public source, WebView and credential policy
        run: python3 tooling/source_policy.py
      - name: Verify exact crates.io glib two-line FFI backport chosen by Cargo
        run: |
          mkdir -p ci-evidence
          python3 tooling/v01_glib_product_admission.py --output ci-evidence/v01-glib-patched-desktop-source.json
          python3 -m json.tool ci-evidence/v01-glib-patched-desktop-source.json >/dev/null
      - name: Install hash-pinned custody test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --no-input --no-cache-dir \
            --only-binary=:all: --require-hashes -r tooling/requirements/mlt-g2-custody.txt
          python3 -m pip check
      - name: Security policy regressions
        run: python3 -m unittest discover -s tooling/tests -p 'test_*.py'
      - name: Exact-source delivery manifest
        run: |
          mkdir -p ci-evidence
          python3 tooling/release_manifest.py \
            --git-sha "$(git rev-parse HEAD)" \
            --output ci-evidence/delivery-manifest.json
          python3 -m json.tool ci-evidence/delivery-manifest.json >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-delivery-manifest
          path: ci-evidence/delivery-manifest.json
          if-no-files-found: error
      - name: Produce exact-source v0.1.0 release-blocker assessment
        run: |
          python3 tooling/v01_release_readiness.py \
            --source-sha "$(git rev-parse HEAD)" \
            --verify-checkout \
            --expect-blocked \
            --output ci-evidence/v01-release-readiness.json
          python3 -m json.tool ci-evidence/v01-release-readiness.json > /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-v01-release-readiness
          path: ci-evidence/v01-release-readiness.json
          if-no-files-found: error

  dependency-advisories:
    needs: source-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: false
      - name: Verify reviewed glib 0.18 GTK/Tauri owner graph is unchanged
        run: |
          mkdir -p ci-evidence
          python3 -m unittest discover -s tooling/tests -p 'test_glib_owner_chain.py' -v
          python3 tooling/security_advisory_policy.py \
            --output ci-evidence/glib-source-owner-chain.json
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Enforce exact reviewed advisory set
        run: |
          mkdir -p ci-evidence
          set +e
          cargo audit --json > ci-evidence/cargo-audit.json
          audit_status=$?
          set -e
          python3 tooling/security_advisory_policy.py \
            --audit-json ci-evidence/cargo-audit.json \
            --output ci-evidence/security-advisory-policy.json
          if [ "$audit_status" -ne 0 ]; then
            echo "cargo audit reported a vulnerability; the reviewed warning policy is not a waiver."
            exit "$audit_status"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: motionwright-security-advisory-evidence
          path: ci-evidence
          if-no-files-found: ignore

  controlled-imports:
    needs: source-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: false
      - name: Format
        run: cargo fmt --all -- --check
      - name: Storage and import security contracts
        run: cargo test -p motionwright-storage -p motionwright-service --all-targets
      - name: Clippy
        run: cargo clippy -p motionwright-storage -p motionwright-service --all-targets -- -D warnings

  desktop-boundary:
    needs: source-boundary
    if: ${{ !cancelled() && (needs.source-boundary.result == 'success' || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["desktop-source","desktop-compile","desktop-hyperframes","desktop-blender","desktop-playback","desktop-saved-delivery","desktop-workflow"]'), inputs.verification_scope))) }}
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'desktop-compile' && inputs.desktop_compile_platform == 'macos' && 'macos-latest' || github.event_name == 'workflow_dispatch' && contains(fromJSON('["desktop-compile","desktop-blender","desktop-playback","desktop-saved-delivery"]'), inputs.verification_scope) && inputs.desktop_compile_platform == 'windows' && 'windows-latest' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: clippy
      - name: Check selected Desktop source policy
        run: python -B tooling/source_policy.py
      - name: Verify selected offline runtime host before compilation
        if: inputs.verification_scope == 'desktop-compile' && inputs.first_use_case == 'runtime-profiles'
        shell: bash
        run: |
          python -B - <<'PY_RUNTIME_HOST'
          import os, runpy, tempfile
          from pathlib import Path
          producer = runpy.run_path("tooling/runtime_profile_bundle.py")
          platform = producer["host_platform"]()
          with tempfile.TemporaryDirectory(dir=Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)) as temporary:
              root = os.open(temporary, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              try:
                  producer["security_metadata"](root)
                  file = os.open("inert-host-probe", os.O_RDWR | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600, dir_fd=root)
                  try:
                      producer["security_metadata"](file)
                  finally:
                      os.close(file)
              finally:
                  os.close(root)
          metadata = "READ" if platform == "macos-aarch64" else "NOT_APPLICABLE"
          print("OFFLINE_RUNTIME_HOST=" + platform + "; host_fd_probe=PASS; macos_extended_metadata=" + metadata + "; packaged_tools=NOT_EXECUTED")
          PY_RUNTIME_HOST
      - name: Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          # Regional EC2 mirrors stalled the original prerequisite download.
          # Change only that URI; suites, components and signed keyrings stay intact.
          for apt_source in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if test -f "$apt_source"; then
              sudo sed -i -E 's@https?://[a-z0-9-]+\.ec2\.archive\.ubuntu\.com/ubuntu/?@https://archive.ubuntu.com/ubuntu/@g' "$apt_source"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libpipewire-0.3-dev pkg-config clang
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install declared Linux MP4 playback dependencies
        if: inputs.verification_scope == 'desktop-playback' && runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends ffmpeg gstreamer1.0-tools gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - name: Decode synthetic H264 and AAC with the declared system plugins
        if: inputs.verification_scope == 'desktop-playback' && runner.os == 'Linux'
        run: |
          set -euo pipefail
          for element in qtdemux h264parse avdec_h264 aacparse avdec_aac; do
            gst-inspect-1.0 "$element" >/dev/null
          done
          fixture="$RUNNER_TEMP/synthetic-playback-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.mp4"
          ffmpeg -nostdin -hide_banner -loglevel error -n \
            -f lavfi -i testsrc2=size=160x90:rate=30:duration=1 \
            -f lavfi -i sine=frequency=440:sample_rate=48000:duration=1 \
            -t 1 -c:v libx264 -threads 1 -pix_fmt yuv420p -c:a aac -movflags +faststart "$fixture"
          timeout 30s gst-launch-1.0 -q filesrc location="$fixture" ! qtdemux name=demux \
            demux.video_0 ! queue ! h264parse ! avdec_h264 ! fakesink sync=false \
            demux.audio_0 ! queue ! aacparse ! avdec_aac ! fakesink sync=false
          echo "LINUX_H264_AAC_PLUGIN_DECODE=PASS; source=SYNTHETIC; NativeHost=NOT_RUN; installed_WebView=NOT_VERIFIED"
      - name: Check bounded desktop command surface
        run: cargo check --locked --jobs 2 -p motionwright-desktop
      - name: Shared original asset URI and retained reader contracts
        if: inputs.verification_scope == 'desktop-compile' && inputs.first_use_case == 'asset-media'
        run: cargo test --locked --jobs 2 -p motionwright-service --example studio_review_session asset_preview::tests -- --test-threads=1
      - name: Bounded hybrid Desktop admission and original root continuity
        if: inputs.verification_scope == 'desktop-compile' && inputs.first_use_case == 'camera-spatial'
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/hybrid-desktop-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.log"
          cargo test --locked --jobs 2 -p motionwright-native --lib hybrid_ -- --test-threads=1 | tee "$log"
          grep -E 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$log"
          if test "$RUNNER_OS" = Linux; then
            grep -F 'hybrid_source_preflight_uses_saved_mc_intents_without_root_receipt_or_output ... ok' "$log"
            grep -F 'hybrid_source_preflight_rejects_stale_foreign_clock_and_changed_original_without_effects ... ok' "$log"
          fi
          cargo test --locked --jobs 2 -p motionwright-desktop native_hybrid::tests:: -- --test-threads=1 | tee "$log"
          grep -F '4 passed; 0 failed; 0 ignored' "$log"
          cargo test --locked --jobs 2 -p motionwright-desktop effect_grants -- --test-threads=1
          cargo test --locked --jobs 2 -p motionwright-desktop desktop_owner -- --test-threads=1
          cargo clippy --locked --jobs 2 -p motionwright-native --lib -- -D warnings
      - name: Effect-grant boundary regressions
        if: github.event_name != 'workflow_dispatch' || !contains(fromJSON('["desktop-compile","desktop-hyperframes","desktop-blender","desktop-playback","desktop-saved-delivery","desktop-workflow"]'), inputs.verification_scope) || (inputs.verification_scope == 'desktop-compile' && inputs.first_use_case == 'runtime-profiles')
        run: cargo test --locked --jobs 2 -p motionwright-desktop effect_grants
      - name: Original offline runtime files, SQLite reopen and rollback
        if: github.event_name != 'workflow_dispatch' || !contains(fromJSON('["desktop-compile","desktop-hyperframes","desktop-blender","desktop-playback","desktop-saved-delivery","desktop-workflow"]'), inputs.verification_scope) || (inputs.verification_scope == 'desktop-compile' && inputs.first_use_case == 'runtime-profiles')
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY_RUNTIME_PROFILES'
          import hashlib, importlib.util, json, os, re, subprocess
          from pathlib import Path
          pin = "c2c40c74e5714a3e680415d0dddcf27743f0f0fa"
          metadata = json.loads(subprocess.run(
              ["cargo", "metadata", "--locked", "--format-version", "1"],
              check=True, capture_output=True, text=True).stdout)
          sdk = next(item for item in metadata["packages"] if item["name"] == "semwright-native-sdk")
          assert sdk["version"] == "1.0.0" and sdk["source"].endswith("#" + pin)
          candidates = [parent / "integrations/motion-canvas/runtime"
                        for parent in Path(sdk["manifest_path"]).parents]
          runtime = next(path for path in candidates if (path / "render.mjs").is_file())
          spec = importlib.util.spec_from_file_location("runtime_profile_fixtures", "tooling/tests/runtime_profile_fixtures.py")
          fixtures = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(fixtures)
          destination = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True) / ("runtime-profile-fixtures-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"])
          mc, hf = fixtures.create(runtime, destination)
          env = dict(os.environ, MOTIONWRIGHT_RUNTIME_TEST_PACKAGE_MC=str(mc),
                     PYTHONDONTWRITEBYTECODE="1")
          if hf is not None:
              env["MOTIONWRIGHT_RUNTIME_TEST_PACKAGE_HF"] = str(hf)
          log = destination / "desktop-original.log"
          with log.open("xb") as stream:
              result = subprocess.run(["cargo", "test", "--locked", "--jobs", "2", "-p", "motionwright-desktop",
                  "runtime_profiles::local_unix::tests::", "--", "--test-threads=1"], env=env, stdout=stream, stderr=subprocess.STDOUT)
          raw = log.read_text(encoding="utf-8")
          if result.returncode:
              print("\n".join(raw.splitlines()[-90:]))
              raise SystemExit(result.returncode)
          expected = {
              "actual_copy_reopens_sqlite_and_rollback_preserves_original_files",
              "exact_grant_scope_manifest_and_expiry_reject_before_package_writes",
              "changed_selected_bytes_leave_a_partial_original_that_can_be_rolled_back",
              "link_hardlink_fifo_and_source_root_replacement_are_rejected",
              "destination_identity_and_project_scope_cannot_be_substituted",
              "unknown_original_survives_restart_and_blocks_a_new_profile_identity",
              "lost_reply_recovers_original_bytes_without_reinstall_or_new_receipt",
              "original_rollback_without_ack_is_recovered_without_another_move",
              "closed_manifest_rejects_authority_fields_paths_collisions_and_budgets",
              "hyperframes_original_runner_and_lock_install_without_executing_the_fixture_tools",
              "unavailable_runtime_storage_keeps_original_projects_open_and_unchanged",
              "foreign_architecture_or_truncated_executable_is_refused_before_effects",
              "rollback_never_replaces_a_foreign_disabled_destination",
              "reselection::replacement_reviews_release_unsent_plans_and_reject_their_old_permission",
              "reselection::invalid_reselection_retires_only_this_projects_unsent_review",
          }
          platform = fixtures.bundle.host_platform()
          if platform == "macos-aarch64":
              expected.remove("hyperframes_original_runner_and_lock_install_without_executing_the_fixture_tools")
              expected.update({
                  "macos_extended_attributes_refuse_inspection_and_survive_unchanged",
                  "macos_extended_acl_refuses_source_and_destination_before_effects",
                  "macos_attribute_change_after_plan_retains_one_partial_original_without_replay",
                  "macos_hyperframes_manifest_is_refused_without_mutating_the_original",
              })
          observed = re.findall(r"^test runtime_profiles::local_unix::tests::([a-z0-9_:]+) \.\.\. ok$", raw, re.M)
          assert len(observed) == len(expected) and set(observed) == expected
          assert f"{len(expected)} passed; 0 failed; 0 ignored" in raw
          print(f"RUNTIME_PROFILE_LOCAL_COPY=PASS; cases={len(expected)}; platform={platform}; SQLite=REAL; package_description=ACTUAL_PRODUCER; tools=INERT_BYTE_FIXTURES; NativeHost=NOT_RUN; G2=NOT_GRANTED")
          PY_RUNTIME_PROFILES
      - name: HyperFrames original Desktop render and PNG recovery contracts
        if: github.event_name != 'workflow_dispatch' || !contains(fromJSON('["desktop-compile","desktop-blender","desktop-playback","desktop-saved-delivery","desktop-workflow"]'), inputs.verification_scope)
        run: |
          set -euo pipefail
          cargo clippy --locked --jobs 2 -p motionwright-native --test desktop_hyperframes_render -- -D warnings
          log="$RUNNER_TEMP/hyperframes-desktop-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.original.log"
          test ! -e "$log"
          cargo test --locked --jobs 2 -p motionwright-native --test desktop_hyperframes_render \
            desktop_render_tests:: -- --test-threads=1 > "$log" 2>&1 || {
              tail -n 80 "$log"
              exit 1
            }
          python3 -B - "$log" <<'PY_HF_RENDER'
          from pathlib import Path
          import re, sys
          raw = Path(sys.argv[1]).read_text(encoding="utf-8")
          expected = {
              "durable_intent_and_live_lease_prevent_duplicate_dispatch",
              "altered_source_runtime_and_grant_reject_before_native_intent",
              "completed_original_reopens_sqlite_and_verifies_each_png_without_native_execution",
              "lost_desktop_ack_recovers_original_result_without_appending_or_dispatching",
              "foreign_provider_connection_job_or_source_never_recovers_a_success",
              "unknown_original_blocks_new_request_ids_after_reopen_and_keeps_project_editable",
              "png_reads_reject_drift_and_cannot_supply_motion_canvas_master_authority",
              "historical_results_remain_original_and_never_become_current_preview",
              "original_job_observation_reopens_original_pngs_and_preserves_later_edits",
              "unacknowledged_or_tampered_job_observation_never_settles_original",
              "terminal_job_observation_cannot_be_downgraded_or_replayed",
              "native_observer_dispatches_only_original_status_and_result",
              "native_observer_rejects_unacknowledged_start_and_changed_provider_before_result",
          }
          observed = re.findall(r"^test desktop_render_tests::([a-z0-9_]+) \.\.\. ok$", raw, re.M)
          assert len(observed) == len(expected) and set(observed) == expected
          assert "13 passed; 0 failed; 0 ignored" in raw
          print("HYPERFRAMES_DESKTOP_ORIGINAL_RECOVERY=PASS; cases=13; SQLite=REAL; provider_transport=SYNTHETIC; NativeHost=NOT_RUN; G2=NOT_GRANTED")
          PY_HF_RENDER
          cargo test --locked --jobs 2 -p motionwright-service --lib jobs::tests:: -- --test-threads=1
      - name: Native PNG preview security regressions

            --expected-source 2789c76c703f48bc2789f1a30a71fe1911e3600e \
            --report "$GITHUB_WORKSPACE/verification/foundation-composed-linux-consumer/receipt.json"
      - name: Verify exact coherent observer, schema and installed-source consumers

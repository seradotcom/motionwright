          cargo test --locked --jobs 2 -p motionwright-service --test capture_source -- --test-threads=1
          cargo test --locked --jobs 2 -p motionwright-service --example studio_review_session capture_source_preview::tests:: -- --test-threads=1
      - name: Original imported media read, current-scope ranges and closed readers
        if: inputs.first_use_case == 'asset-media'
        run: |

  foundation-causal-g0:
    if: github.event_name == 'workflow_dispatch' && (inputs.verification_scope == 'foundation-causal' || inputs.verification_scope == 'foundation-import-budget' || inputs.verification_scope == 'foundation-current' || inputs.verification_scope == 'foundation-projection-diagnostic' || inputs.verification_scope == 'foundation-composed-current' || inputs.verification_scope == 'foundation-coherent-current')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: gate
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Verify exact selected gate in both test entry points
        run: |
          mkdir -p "$GITHUB_WORKSPACE/verification/foundation-g0"
          python3 gate/tooling/ci_test_runner.py --repo gate \
            --pattern test_ci_foundation_causal.py \
            --pattern test_ci_storage_apply_recovery.py \
            --pattern test_ci_saved_original_mix.py --mode both --require-complete \
            --expected-source "$GITHUB_SHA" \
            --report "$GITHUB_WORKSPACE/verification/foundation-g0/receipt.json"
      - name: Public source policies
        working-directory: gate
        run: |
          python3 tooling/source_policy.py
          python3 tooling/public_surface_policy.py
          python3 tooling/acceptance_policy.py
          python3 tooling/creative_status_policy.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: foundation-causal-g0-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/foundation-g0
          if-no-files-found: error

  foundation-causal:
    if: github.event_name == 'workflow_dispatch' && (inputs.verification_scope == 'foundation-causal' || inputs.verification_scope == 'foundation-import-budget' || inputs.verification_scope == 'foundation-current' || inputs.verification_scope == 'foundation-projection-diagnostic' || inputs.verification_scope == 'foundation-composed-current' || inputs.verification_scope == 'foundation-coherent-current')
    needs: foundation-causal-g0
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      FOUNDATION_CAUSAL_SELECTION: ${{ inputs.verification_scope }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: gate
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Verify frozen Linux consumer contracts
        if: inputs.verification_scope == 'foundation-composed-current'
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test ! -e "$GITHUB_WORKSPACE/composed-consumer-source"
          git --no-replace-objects -c core.autocrlf=false -c core.fsmonitor=false -C gate \
            worktree add --detach "$GITHUB_WORKSPACE/composed-consumer-source" 2789c76c703f48bc2789f1a30a71fe1911e3600e
          mkdir -p "$GITHUB_WORKSPACE/verification/foundation-composed-linux-consumer"
          python3 "$GITHUB_WORKSPACE/composed-consumer-source/tooling/ci_test_runner.py" \
            --repo "$GITHUB_WORKSPACE/composed-consumer-source" \
            --pattern test_linux_cold_start.py --mode both --require-complete \
            --expected-source 2789c76c703f48bc2789f1a30a71fe1911e3600e \
            --report "$GITHUB_WORKSPACE/verification/foundation-composed-linux-consumer/receipt.json"
      - name: Verify exact coherent observer, schema and installed-source consumers
        if: inputs.verification_scope == 'foundation-coherent-current'
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test ! -e "$GITHUB_WORKSPACE/coherent-consumer-source"
          git --no-replace-objects -c core.autocrlf=false -c core.fsmonitor=false -C gate \
            worktree add --detach "$GITHUB_WORKSPACE/coherent-consumer-source" effb0263785f828b6048878bafd3d162686f90d2
          mkdir -p "$GITHUB_WORKSPACE/verification/foundation-coherent-consumers"
          python3 "$GITHUB_WORKSPACE/coherent-consumer-source/tooling/ci_test_runner.py" \
            --repo "$GITHUB_WORKSPACE/coherent-consumer-source" \
            --pattern test_source_checkout_observation.py --pattern test_storage_schema_contract.py \
            --pattern test_linux_cold_start.py --pattern test_windows_installer_lifecycle.py \
            --mode both --require-complete --expected-source effb0263785f828b6048878bafd3d162686f90d2 \
            --report "$GITHUB_WORKSPACE/verification/foundation-coherent-consumers/receipt.json"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: clippy
      - name: Observe the selected frozen causal pairs sequentially
        run: |
          python3 gate/tooling/ci_foundation_causal.py \
            --workspace "$GITHUB_WORKSPACE" \
            --selection "$FOUNDATION_CAUSAL_SELECTION" \
            --output "$GITHUB_WORKSPACE/verification/foundation-causal" --execute
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: foundation-causal-originals-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ (inputs.verification_scope == 'foundation-composed-current' || inputs.verification_scope == 'foundation-coherent-current') && 'verification' || 'verification/foundation-causal' }}
          include-hidden-files: true
          if-no-files-found: error

  storage-api-regressions:
    name: SQLite budget and schema API regressions
    if: github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'storage-api-regressions'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: motionwright-storage-api-1.98.1
          cache-on-failure: true
      - name: Preserve tested source and dependency identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-evidence/storage-api
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD > ci-evidence/storage-api/source-sha.original.txt
          rustc -Vv > ci-evidence/storage-api/rustc.original.txt
          sha256sum Cargo.toml Cargo.lock SOURCE_LOCK.json \
            crates/storage/Cargo.toml crates/storage/src/lib.rs \
            crates/storage/tests/production_operation_budget.rs \
            crates/storage/tests/schema_migration_atomicity.rs \
            > ci-evidence/storage-api/source-digests.original.txt
      - name: Execute actual SQLite budget and migration regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --jobs 2 --no-fail-fast -p motionwright-storage \
            --test production_operation_budget --test schema_migration_atomicity \
            -- --test-threads=1 2>&1 | tee ci-evidence/storage-api/tests.original.log
          python3 - <<'PY'
          import pathlib
          import re
          raw = pathlib.Path("ci-evidence/storage-api/tests.original.log").read_text()
          results = re.findall(
              r"(?m)^test result: ok\. (\d+) passed; 0 failed; (\d+) ignored; "
              r"0 measured; 0 filtered out;", raw)
          assert sorted((int(passed), int(ignored)) for passed, ignored in results) == [
              (14, 0), (33, 1)
          ], "SQLite API regression roster incomplete"
          print("47 SQLite regressions passed; the original v5 producer case is selected separately.")
          PY
      - name: Build and run the original schema-five producer
        shell: bash
        run: |
          set -euo pipefail
          legacy="$RUNNER_TEMP/storage-v5-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fixture="$RUNNER_TEMP/storage-v5-fixture-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$legacy"
          test ! -e "$fixture"
          git fetch --no-tags --depth=1 origin 246873f2d908d0f801c990963a2f570934f29b83
          git worktree add --detach "$legacy" 246873f2d908d0f801c990963a2f570934f29b83
          test "$(git -C "$legacy" rev-parse HEAD^{tree})" = 6f93eb6f774da4aa5dbb35ada99888f00ab3a373
          test -z "$(git -C "$legacy" status --porcelain)"
          export MW_STORAGE_V5_SOURCE="$legacy"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          source = Path("crates/storage/tests/production_operation_budget.rs").read_bytes()
          marker = b'const LEGACY_PRODUCER_RS: &str = r####"'
          assert source.count(marker) == 1
          body, ending, _ = source.split(marker, 1)[1].partition(b'"####;')
          assert ending and body.startswith(b"// Test-only overlay for source 246873f2")
          legacy = Path(os.environ["MW_STORAGE_V5_SOURCE"])
          overlay = legacy / "crates/storage/examples/a2_v5_budget_fixture.rs"
          overlay.parent.mkdir(exist_ok=True)
          with overlay.open("xb") as stream:
              stream.write(body)
          receipt = {
              "source_sha": "246873f2d908d0f801c990963a2f570934f29b83",
              "source_tree": "6f93eb6f774da4aa5dbb35ada99888f00ab3a373",
              "consumer_sha": os.environ["GITHUB_SHA"],
              "overlay_sha256": hashlib.sha256(body).hexdigest(),
              "cargo_lock_sha256": hashlib.sha256((legacy / "Cargo.lock").read_bytes()).hexdigest(),
          }
          Path("ci-evidence/storage-api/v5-source.original.json").write_text(
              json.dumps(receipt, indent=2) + "\n")
          PY
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          cargo build --locked --jobs 2 --manifest-path "$legacy/Cargo.toml" \
            -p motionwright-storage --example a2_v5_budget_fixture \
            2>&1 | tee ci-evidence/storage-api/v5-build.original.log
          git -C "$legacy" diff --exit-code
          producer="$CARGO_TARGET_DIR/debug/examples/a2_v5_budget_fixture"
          test -x "$producer"
          sha256sum "$producer" > ci-evidence/storage-api/v5-binary.original.sha256
          "$producer" "$fixture" 2>&1 | tee ci-evidence/storage-api/v5-producer.original.log
          cp "$fixture/fixture.json" ci-evidence/storage-api/v5-fixture.original.json
          stat -c '%d:%i' "$fixture/destination/state.sqlite3" \
            > ci-evidence/storage-api/sqlite-identity-before.original.txt
          echo "MOTIONWRIGHT_BUDGET_V5_FIXTURE=$fixture" >> "$GITHUB_ENV"
          echo "MOTIONWRIGHT_BUDGET_V5_FIXTURE_MANIFEST_SHA256=$(sha256sum "$fixture/fixture.json" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Migrate the genuine v5 fixture through the current Store
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --jobs 2 -p motionwright-storage \
            --test production_operation_budget \
            original_v5_causal_controls::genuine_v5_public_import_preserves_cas_marker_blob_and_receipts_through_v6 \
            -- --ignored --exact --test-threads=1 --nocapture \
            2>&1 | tee ci-evidence/storage-api/v5-to-v6.original.log
          python3 - <<'PY'
          import pathlib
          import re
          raw = pathlib.Path("ci-evidence/storage-api/v5-to-v6.original.log").read_text()
          assert re.search(r"(?m)^test result: ok\. 1 passed; 0 failed; 0 ignored; "
                           r"0 measured; 33 filtered out;", raw), "Original v5 migration did not execute"
          PY
          stat -c '%d:%i' "$MOTIONWRIGHT_BUDGET_V5_FIXTURE/destination/state.sqlite3" \
            > ci-evidence/storage-api/sqlite-identity-after.original.txt
          cmp ci-evidence/storage-api/sqlite-identity-before.original.txt \
            ci-evidence/storage-api/sqlite-identity-after.original.txt
          tar -cf ci-evidence/storage-api/migrated-fixture.tar \
            -C "$MOTIONWRIGHT_BUDGET_V5_FIXTURE" .
      - name: Retain original SQLite regression output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storage-api-regressions-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/storage-api/
          if-no-files-found: error
          retention-days: 7

  storage-service-current:
    name: Current Storage and Service regressions
    if: github.event_name == 'workflow_dispatch' && (inputs.verification_scope == 'storage-service-current' || inputs.verification_scope == 'service-legacy-fixtures')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: motionwright-storage-api-1.98.1
          cache-on-failure: true
      - name: Bind current source and dependency identity
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/mw-storage-service-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$work"
          echo "MW_STORAGE_SERVICE_EVIDENCE=$work" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD > "$work/source-sha.original.txt"
          git rev-parse 'HEAD^{tree}' > "$work/source-tree.original.txt"
          rustc -Vv > "$work/rustc.original.txt"
          sha256sum Cargo.toml Cargo.lock SOURCE_LOCK.json \
            crates/storage/Cargo.toml crates/service/Cargo.toml \
            crates/storage/src/apply_receipt_binding.rs \
            crates/storage/tests/apply_receipt_binding.rs \
            crates/storage/tests/production_operation_budget.rs \
            crates/storage/tests/fixtures/schema_v5.sql \
            crates/service/tests/mlt_inventory.rs \
            crates/service/tests/production_receipt_commit_order.rs \
            crates/service/tests/project_projection.rs \
            crates/service/tests/support/legacy_v5_fixture.rs \
            > "$work/source-digests.original.txt"
          python3 -B tooling/source_policy.py
      - name: Run current Store and Service contracts
        if: inputs.verification_scope == 'storage-service-current'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --jobs 2 --no-fail-fast \
            -p motionwright-storage -p motionwright-service --all-targets \
            -- --test-threads=1 2>&1 | tee "$MW_STORAGE_SERVICE_EVIDENCE/tests.original.log"
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          root = pathlib.Path(os.environ["MW_STORAGE_SERVICE_EVIDENCE"])
          raw = (root / "tests.original.log").read_text()
          raw = re.sub(r"\x1b\[[0-9;]*m", "", raw)
          results = re.findall(r"(?m)^test result: ok\. (\d+) passed; 0 failed; (\d+) ignored;", raw)
          assert results and sum(int(passed) for passed, _ in results) > 0
          assert re.search(r"(?m)^test invalid_sqlite_receipt_types_and_utf8_are_content_failures \.\.\. ok$", raw)
          receipt = {
              "source_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "passed": sum(int(passed) for passed, _ in results),
              "ignored": sum(int(ignored) for _, ignored in results),
              "rust_test_targets": len(results),
              "corrupt_utf8_rejection": "PASS",
              "historical_v5_producer": "NOT_REBUILT",
              "formal_acceptance": "NOT_GRANTED",
          }
          (root / "tests-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt))
          PY
          git diff --exit-code
      - name: Run legacy Service fixture regressions
        if: inputs.verification_scope == 'service-legacy-fixtures'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --jobs 2 --no-fail-fast -p motionwright-service \
            --test mlt_inventory --test production_receipt_commit_order --test project_projection \
            -- --test-threads=1 2>&1 | tee "$MW_STORAGE_SERVICE_EVIDENCE/tests.original.log"
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          root = pathlib.Path(os.environ["MW_STORAGE_SERVICE_EVIDENCE"])
          raw = (root / "tests.original.log").read_text()
          raw = re.sub(r"\x1b\[[0-9;]*m", "", raw)
          results = re.findall(r"(?m)^test result: ok\. (\d+) passed; 0 failed; (\d+) ignored;", raw)
          passed = sum(int(count) for count, _ in results)
          ignored = sum(int(count) for _, count in results)
          assert len(results) == 3 and passed == 16 and ignored == 0, results
          regressions = [
              "legacy_cross_revision_request_history_retains_uncertainty_after_current_rejection",
              "service_job_read_failure_cannot_be_overwritten_by_an_earlier_future_clock_status",
              "service_jobs_are_ranked_by_last_committed_observation_not_display_date",
              "service_full_receipt_pages_keep_commit_order_and_reject_stale_snapshots",
              "response_budget_includes_restored_defaults_and_wire_envelope",
          ]
          for name in regressions:
              assert re.search(r"(?m)^test " + re.escape(name) + r" \.\.\. ok$", raw), name
          receipt = {
              "source_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "verification_scope": "service-legacy-fixtures",
              "passed": passed,
              "ignored": ignored,
              "rust_test_targets": len(results),
              "legacy_setup_regressions": {name: "PASS" for name in regressions},
              "corrupt_utf8_rejection": "NOT_SELECTED",
              "historical_v5_producer": "NOT_REBUILT",
              "formal_acceptance": "NOT_GRANTED",
          }
          (root / "tests-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt))
          PY
          git diff --exit-code
      - name: Check current Store and Service warnings
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --jobs 2 \
            -p motionwright-storage -p motionwright-service --all-targets -- -D warnings \
            2>&1 | tee "$MW_STORAGE_SERVICE_EVIDENCE/clippy.original.log"
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: storage-service-current-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MW_STORAGE_SERVICE_EVIDENCE }}
          if-no-files-found: error
          retention-days: 14

  native-source-export-rust:
    name: Desktop owner exports (exact selected source regressions)
    if: github.event_name == 'workflow_dispatch' && (inputs.verification_scope == 'native-source-export' || inputs.verification_scope == 'native-otio-snapshot')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.98.1
      - name: Install Tauri Linux build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Compile only the selected owner-export source regressions on desktop
        shell: bash
        env:
          MW_NATIVE_EXPORT_ORIGINALS: ${{ runner.temp }}/native-source-export-originals
          MW_EXPORT_CASE_SCOPE: ${{ inputs.verification_scope }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e "$MW_NATIVE_EXPORT_ORIGINALS"
          mkdir -m 700 "$MW_NATIVE_EXPORT_ORIGINALS"
          case "$MW_EXPORT_CASE_SCOPE" in
            native-source-export) selected_filter="native_source_" ;;
            native-otio-snapshot) selected_filter="otio_current_project_snapshot_" ;;
            *) echo "Unsupported owner-export test scope" >&2; exit 64 ;;
          esac
          cargo test --locked -p motionwright-desktop --bin motionwright-desktop \
            "project_export::tests::$selected_filter" -- --test-threads=1 \
            2>&1 | tee "$MW_NATIVE_EXPORT_ORIGINALS/cargo.original.log"
          /usr/bin/python3 -B -E -s - <<'PY_NATIVE_EXPORT'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          folder = Path(os.environ["MW_NATIVE_EXPORT_ORIGINALS"])
          original = (folder / "cargo.original.log").read_bytes()
          text = re.sub(r"\x1b\[[0-9;]*m", "", original.decode("utf-8", "strict"))
          selected = os.environ["MW_EXPORT_CASE_SCOPE"]
          expected = {
              "native-source-export": {
                  "project_export::tests::native_source_exports_exact_original_bytes_without_launch_or_replay",
                  "project_export::tests::native_source_export_cannot_overwrite_an_existing_file_or_switch_capsule",
                  "project_export::tests::native_source_export_rejects_a_peer_revision_before_creating_the_destination",
                  "project_export::tests::native_source_export_then_reimport_preserves_both_original_versions_and_reopens_store",
                  "project_export::tests::native_source_export_rejects_same_revision_branch_asset_and_digest_substitution_before_effect",
              },
              "native-otio-snapshot": {
                  "project_export::tests::otio_current_project_snapshot_exports_exact_bridge_bytes_and_reopens_store",
                  "project_export::tests::otio_current_project_snapshot_rejects_later_peer_revision_before_publish",
                  "project_export::tests::otio_current_project_snapshot_rejects_bad_extension_and_foreign_destination",
              },
          }
          required = expected[selected]
          passed = re.findall(r"(?m)^test (project_export::tests::(?:native_source_|otio_current_project_snapshot_)[A-Za-z0-9_]+) \.\.\. ok$", text)
          assert len(passed) == len(required) == len(set(passed)) and set(passed) == required, passed
          assert re.search(
              r"(?m)^test result: ok\. " + str(len(required)) + r" passed; 0 failed; 0 ignored;", text
          )
          record = {
              "schema": "motionwright.ci.desktop-owner-export-source/1",
              "selected_scope": selected,
              "source_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "status": "SOURCE_REGRESSIONS_PASS",
              "tests": sorted(passed),
              "log_bytes": len(original),
              "log_sha256": hashlib.sha256(original).hexdigest(),
              "native_editor_launched": False,
              "human_acceptance": False,
              "G2": "NOT_GRANTED",
              "G3": "STOP",
          }
          (folder / "receipt.json").write_text(json.dumps(record, sort_keys=True, indent=2) + "\n")
          print("desktop-owner-export=PASS selected=" + selected + " exact_tests=" + str(len(required)))
          PY_NATIVE_EXPORT
          git diff --exit-code
      - name: Preserve exact Rust regression originals without converting to physical acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-source-export-rust-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/native-source-export-originals/
          if-no-files-found: warn
          retention-days: 14

  native-source-service-browser:
    name: Native source original export and reopen (one real-service Chromium case)
    if: github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'native-source-browser'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install locked Studio browser test dependencies
        working-directory: apps/studio
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Compile one exact Desktop-source service against real SQLite/CAS
        shell: bash
        env:
          MW_BROWSER_ORIGINALS: ${{ runner.temp }}/native-source-browser-${{ github.run_id }}-${{ github.run_attempt }}
          MW_BROWSER_STORES: ${{ runner.temp }}/native-source-browser-stores-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e "$MW_BROWSER_ORIGINALS"
          test ! -e "$MW_BROWSER_STORES"
          mkdir -m 700 "$MW_BROWSER_ORIGINALS" "$MW_BROWSER_STORES"
          if ! cargo build --locked --jobs 1 -p motionwright-service \
            --example studio_review_session --message-format=json \
            > "$MW_BROWSER_ORIGINALS/cargo.original.jsonl" \
            2> "$MW_BROWSER_ORIGINALS/cargo.stderr.original"; then
            tail -n 35 "$MW_BROWSER_ORIGINALS/cargo.stderr.original"
            exit 1
          fi
          python3 -B -E -s - <<'PY_NATIVE_BROWSER_SOURCE'
          import hashlib, json, os
          from pathlib import Path
          import subprocess
          def require(value, code):
              if not value:
                  raise SystemExit("NATIVE_SOURCE_BROWSER_BUILD_REJECTED:" + code)
          repo=Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          folder=Path(os.environ["MW_BROWSER_ORIGINALS"]).resolve(strict=True)
          sha=os.environ["GITHUB_SHA"]
          require(subprocess.check_output(["git","rev-parse","HEAD"],cwd=repo,text=True).strip()==sha,"SHA")
          for name in ("Cargo.lock","SOURCE_LOCK.json"):
              require((repo/name).read_bytes()==subprocess.check_output(["git","show",sha+":"+name],cwd=repo),"LOCK")
          raw=(folder/"cargo.original.jsonl").read_bytes()
          require(0<len(raw)<=64*1024*1024,"CARGO_LOG_LIMIT")
          records=[json.loads(line) for line in raw.splitlines() if line.strip()]
          require(any(row.get("reason")=="build-finished" and row.get("success") is True for row in records),"BUILD_FINISHED")
          matches=[row for row in records if row.get("reason")=="compiler-artifact"
                   and row.get("target",{}).get("name")=="studio_review_session"
                   and "example" in row.get("target",{}).get("kind",[])
                   and row.get("executable")]
          require(len(matches)==1,"ONE_EXAMPLE")
          binary=Path(matches[0]["executable"]).resolve(strict=True)
          require(binary==repo/"target/debug/examples/studio_review_session"
                  and binary.is_file() and not binary.is_symlink(),"EXACT_BINARY")
          require(0<binary.stat().st_size<=256*1024*1024,"BINARY_SIZE")
          def digest(path):
              data=path.read_bytes()
              return {"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()}
          result={"schema":"motionwright.ci.native-source-real-service-browser/1",
                  "source_sha":sha,"run_id":os.environ["GITHUB_RUN_ID"],
                  "attempt":os.environ["GITHUB_RUN_ATTEMPT"],"status":"SOURCE_BINARY_BOUND",
                  "binary":digest(binary),"cargo_original":digest(folder/"cargo.original.jsonl"),
                  "cargo_stderr_original":digest(folder/"cargo.stderr.original"),
                  "G2":"NOT_GRANTED","G3":"STOP","native_editor_launched":False,
                  "installed_tauri":False,"release_authorized":False}
          (folder/"build-receipt.json").write_text(json.dumps(result,sort_keys=True,indent=2)+"\n")
          with Path(os.environ["GITHUB_ENV"]).open("a") as env:
              env.write("MOTIONWRIGHT_SERVICE_TEST_BIN="+str(binary)+"\n")
              env.write("MOTIONWRIGHT_SERVICE_TEST_TMPDIR="+os.environ["MW_BROWSER_STORES"]+"\n")
          print("native-source-browser-source-bound="+sha)
          PY_NATIVE_BROWSER_SOURCE
      - name: Execute one real-service Chromium native original export/reimport
        working-directory: apps/studio
        shell: bash
        env:
          MW_BROWSER_ORIGINALS: ${{ runner.temp }}/native-source-browser-${{ github.run_id }}-${{ github.run_attempt }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/native-source-browser-${{ github.run_id }}-${{ github.run_attempt }}/playwright.json
        run: |
          set -euo pipefail
          npx playwright test tests/native-source-save-service.spec.ts \
            --grep "the exported original returns to the native source editor as a new version with both CAS revisions durable" \
            --project chromium --reporter=line,json \
            2>&1 | tee "$MW_BROWSER_ORIGINALS/playwright.original.log"
          python3 -B -E -s - <<'PY_NATIVE_BROWSER_PASS'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ["MW_BROWSER_ORIGINALS"])
          report=json.loads((root/"playwright.json").read_bytes())
          stats=report["stats"]
          assert stats.get("expected")==1 and all(stats.get(key,0)==0
              for key in ("unexpected","flaky","skipped")), stats
          screenshots=list(Path.cwd().glob("test-results/**/native-source-export-reimport-saved.png"))
          assert len(screenshots)==1, screenshots
          screenshot=screenshots[0].read_bytes()
          assert 0<len(screenshot)<=16*1024*1024
          record={"schema":"motionwright.ci.native-source-real-service-browser-result/1",
                  "source_sha":os.environ["GITHUB_SHA"],"run_id":os.environ["GITHUB_RUN_ID"],

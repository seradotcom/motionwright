name: Security and Delivery

on:
  push:
    branches: ["main", "feat/**", "verify/sdk-foundation-candidate-20261026-a6"]
    paths:
      - "apps/desktop/src-tauri/**"
      - "apps/studio/src/**"
      - "crates/storage/**"
      - "crates/service/**"
      - "tooling/source_policy.py"
      - "tooling/ci_sdk_foundation_candidate.py"
      - "tooling/release_manifest.py"
      - "tooling/v01_release_readiness.py"
      - "docs/v01-release-readiness.md"
      - "docs/acceptance/**"
      - "docs/security/known-rustsec-advisories.json"
      - "tooling/package_receipt.py"
      - "tooling/security_advisory_policy.py"
      - "tooling/glib_owner_chain.py"
      - "tooling/v01_glib_product_admission.py"
      - "tooling/upstream-crates/**"
      - "vendor/glib-0.18.5/**"
      - "tooling/tests/**"
      - "docs/security/**"
      - "SOURCE_LOCK.json"
      - "Cargo.lock"
      - "apps/studio/package-lock.json"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "docs/security.md"
      - ".github/workflows/security-delivery.yml"
      - ".github/workflows/package-candidate.yml"
      - ".github/workflows/heavy-verification.yml"
  pull_request:
    paths:
      - "apps/desktop/src-tauri/**"
      - "apps/studio/src/**"
      - "crates/storage/**"
      - "crates/service/**"
      - "tooling/source_policy.py"
      - "tooling/ci_sdk_foundation_candidate.py"
      - "tooling/release_manifest.py"
      - "tooling/v01_release_readiness.py"
      - "docs/v01-release-readiness.md"
      - "docs/acceptance/**"
      - "docs/security/known-rustsec-advisories.json"
      - "tooling/package_receipt.py"
      - "tooling/security_advisory_policy.py"
      - "tooling/glib_owner_chain.py"
      - "tooling/v01_glib_product_admission.py"
      - "tooling/upstream-crates/**"
      - "vendor/glib-0.18.5/**"
      - "tooling/tests/**"
      - "docs/security/**"
      - "SOURCE_LOCK.json"
      - "Cargo.lock"
      - "apps/studio/package-lock.json"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "docs/security.md"
      - ".github/workflows/security-delivery.yml"
      - ".github/workflows/package-candidate.yml"
      - ".github/workflows/heavy-verification.yml"
  workflow_dispatch:
    inputs:
      verification_scope:
        description: Verification scope for this dispatch
        required: true
        type: choice
        default: full
        options:
          - full
          - source-admission-contracts
          - foundation-causal
          - foundation-import-budget
          - foundation-current
          - foundation-projection-diagnostic
          - foundation-composed-current
          - foundation-coherent-current
          - sdk-foundation-source-controls
          - sdk-foundation-linux-two
          - sdk-foundation-windows-g1
      sdk_foundation_source_sha:
        description: Exact reviewed SDK source (source profile is not execution authority)
        required: false
        type: string
        default: ""
      sdk_foundation_authority:
        description: Reviewed original-dispatch authority identifier
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  source-boundary:
    if: (github.event_name == 'workflow_dispatch' || (github.ref != 'refs/heads/verify/sdk-foundation-candidate-20261026-a6' && github.head_ref != 'verify/sdk-foundation-candidate-20261026-a6')) && (github.event_name != 'workflow_dispatch' || (inputs.verification_scope != 'source-admission-contracts' && inputs.verification_scope != 'foundation-causal' && inputs.verification_scope != 'foundation-import-budget' && inputs.verification_scope != 'foundation-current' && inputs.verification_scope != 'foundation-projection-diagnostic' && inputs.verification_scope != 'foundation-composed-current' && inputs.verification_scope != 'foundation-coherent-current' && inputs.verification_scope != 'sdk-foundation-source-controls' && inputs.verification_scope != 'sdk-foundation-linux-two' && inputs.verification_scope != 'sdk-foundation-windows-g1'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Public source, WebView and credential policy
        run: python3 tooling/source_policy.py
      - name: Verify exact crates.io glib two-line FFI backport chosen by Cargo
        run: |
          mkdir -p ci-evidence
          python3 tooling/v01_glib_product_admission.py --output ci-evidence/v01-glib-patched-desktop-source.json
          python3 -m json.tool ci-evidence/v01-glib-patched-desktop-source.json >/dev/null
      - name: Install hash-pinned custody test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --no-input --no-cache-dir \
            --only-binary=:all: --require-hashes -r tooling/requirements/mlt-g2-custody.txt
          python3 -m pip check
      - name: Security policy regressions
        run: python3 -m unittest discover -s tooling/tests -p 'test_*.py'
      - name: Exact-source delivery manifest
        run: |
          mkdir -p ci-evidence
          python3 tooling/release_manifest.py \
            --git-sha "$(git rev-parse HEAD)" \
            --output ci-evidence/delivery-manifest.json
          python3 -m json.tool ci-evidence/delivery-manifest.json >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-delivery-manifest
          path: ci-evidence/delivery-manifest.json
          if-no-files-found: error
      - name: Produce exact-source v0.1.0 release-blocker assessment
        run: |
          python3 tooling/v01_release_readiness.py \
            --source-sha "$(git rev-parse HEAD)" \
            --verify-checkout \
            --expect-blocked \
            --output ci-evidence/v01-release-readiness.json
          python3 -m json.tool ci-evidence/v01-release-readiness.json > /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-v01-release-readiness
          path: ci-evidence/v01-release-readiness.json
          if-no-files-found: error

  dependency-advisories:
    needs: source-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: false
      - name: Verify reviewed glib 0.18 GTK/Tauri owner graph is unchanged
        run: |
          mkdir -p ci-evidence
          python3 -m unittest discover -s tooling/tests -p 'test_glib_owner_chain.py' -v
          python3 tooling/security_advisory_policy.py \
            --output ci-evidence/glib-source-owner-chain.json
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Enforce exact reviewed advisory set
        run: |
          mkdir -p ci-evidence
          set +e
          cargo audit --json > ci-evidence/cargo-audit.json
          audit_status=$?
          set -e
          python3 tooling/security_advisory_policy.py \
            --audit-json ci-evidence/cargo-audit.json \
            --output ci-evidence/security-advisory-policy.json
          if [ "$audit_status" -ne 0 ]; then
            echo "cargo audit reported a vulnerability; the reviewed warning policy is not a waiver."
            exit "$audit_status"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: motionwright-security-advisory-evidence
          path: ci-evidence
          if-no-files-found: ignore

  controlled-imports:
    needs: source-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: false
      - name: Format
        run: cargo fmt --all -- --check
      - name: Storage and import security contracts
        run: cargo test -p motionwright-storage -p motionwright-service --all-targets
      - name: Clippy
        run: cargo clippy -p motionwright-storage -p motionwright-service --all-targets -- -D warnings

  desktop-boundary:
    needs: source-boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: clippy
      - name: Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check bounded desktop command surface
        run: cargo check -p motionwright-desktop
      - name: Effect-grant boundary regressions
        run: cargo test -p motionwright-desktop effect_grants
      - name: Native PNG preview security regressions
        run: cargo test --locked -p motionwright-desktop native_preview
      - name: Measured WAV / native AV master source regressions
        run: cargo test --locked -p motionwright-desktop av_master
      - name: Verified MP4 local delivery security regressions
        run: cargo test --locked -p motionwright-desktop av_delivery
      - name: Clippy desktop boundary
        run: cargo clippy -p motionwright-desktop --all-targets -- -D warnings

  dependency-review:
    if: github.event_name == 'pull_request' && github.head_ref != 'verify/sdk-foundation-candidate-20261026-a6'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4

  v01-private-ntfs-evidence:
    needs: source-boundary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: v0.1 private manifest and real NTFS junction guardrails
        run: python -m unittest discover -s tooling/tests -p "test_acceptance*.py" -v

  source-admission-linux:
    name: Source admission contracts (Linux 64)
    if: github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'source-admission-contracts'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
      GIT_CONFIG_KEY_1: core.eol
      GIT_CONFIG_VALUE_1: lf
      SOURCE_ADMISSION_EVIDENCE: ${{ github.workspace }}/verification/source-admission-linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Execute exact source contracts and verify closed test rosters
        shell: python -B -E -s {0}
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          from datetime import datetime, timezone

          repo = (Path(os.environ["GITHUB_WORKSPACE"]) / "source").resolve(strict=True)
          output = Path(os.environ["SOURCE_ADMISSION_EVIDENCE"]).resolve()
          output.mkdir(parents=True, exist_ok=False)
          expected_source = os.environ["GITHUB_SHA"]
          rosters = {
              "test_source_lock_admission": [
                  "test_source_lock_admission.SourceLockAdmissionTests.test_boolean_length_is_not_an_evidence_byte_count",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_captured_source_cannot_escape_the_evidence_root",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_device_names_and_alternate_streams_are_refused_before_open",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_distinct_sources_cannot_share_one_local_evidence_path",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_duplicate_json_keys_are_rejected_even_with_a_matching_record_hash",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_evidence_reference_cannot_escape_or_use_an_absolute_path",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_evidence_requires_each_distinct_upstream_file",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_hardlinked_source_is_rejected_without_modifying_either_name",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_missing_or_changed_captured_source_bytes_are_rejected",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_missing_or_changed_evidence_record_is_rejected",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_missing_or_legacy_verification_is_not_admission",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_other_repository_is_refused_even_when_all_record_bindings_match",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_oversized_evidence_record_is_rejected_with_correct_hash",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_oversized_source_is_rejected_even_with_updated_proof",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_posix_path_descriptor_change_time_mismatch_is_still_rejected",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_rehashed_cargo_bytes_must_keep_declared_version_and_license",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_rehashed_deep_cargo_metadata_returns_a_static_admission_refusal",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_rehashed_evidence_cannot_change_source_identity_or_license",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_small_deep_json_returns_a_static_source_admission_refusal",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_source_lock_loader_is_bounded_read_only_and_has_no_external_effects",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_source_lock_loader_rejects_bytes_above_its_bound",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_source_lock_loader_rejects_duplicate_status_before_last_value_wins",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_symlinked_evidence_parent_is_rejected",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_symlinked_source_is_rejected_without_modifying_target",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_unknown_or_boolean_outer_schema_is_not_admitted",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_unverified_or_unavailable_states_fail_closed",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_verification_cannot_move_to_another_revision_or_repository",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_verified_fixed_bytes_are_read_only_and_do_not_launch_external_effects",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_windows_descriptor_change_time_still_detects_mutation_during_read",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_windows_other_path_descriptor_identity_fields_must_still_match",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_windows_path_and_descriptor_clock_difference_preserves_stable_admission",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_windows_path_change_time_still_detects_mutation_during_read",
                  "test_source_lock_admission.SourceLockAdmissionTests.test_wrong_git_blob_hash_or_declared_size_is_rejected"
              ],
              "test_public_surface_policy": [
                  "test_public_surface_policy.PublicSurfaceGitTests.test_effective_ignored_untracked_material_is_not_public",
                  "test_public_surface_policy.PublicSurfaceGitTests.test_git_tracked_nested_instruction_is_rejected",
                  "test_public_surface_policy.PublicSurfaceGitTests.test_git_tracked_private_entries_and_descendants_are_rejected",
                  "test_public_surface_policy.PublicSurfaceGitTests.test_invalid_utf8_and_oversized_public_text_are_rejected",
                  "test_public_surface_policy.PublicSurfaceGitTests.test_later_negations_cannot_satisfy_effective_ignore",
                  "test_public_surface_policy.PublicSurfaceGitTests.test_tracked_public_symlink_is_rejected",
                  "test_public_surface_policy.PublicSurfaceGitTests.test_unavailable_git_cannot_report_success",
                  "test_public_surface_policy.PublicSurfacePolicyTests.test_current_tracked_repository_is_clean",
                  "test_public_surface_policy.PublicSurfacePolicyTests.test_development_speech_is_rejected_without_copying_its_body",
                  "test_public_surface_policy.PublicSurfacePolicyTests.test_instruction_names_are_rejected_at_any_depth",
                  "test_public_surface_policy.PublicSurfacePolicyTests.test_multiline_instructions_report_their_start_line",
                  "test_public_surface_policy.PublicSurfacePolicyTests.test_nested_product_paths_are_not_private_roots",
                  "test_public_surface_policy.PublicSurfacePolicyTests.test_private_roots_include_exact_entries_and_descendants",
                  "test_public_surface_policy.PublicSurfacePolicyTests.test_private_text_is_not_reported_as_public_text",
                  "test_public_surface_policy.PublicSurfacePolicyTests.test_real_product_agents_are_not_forbidden",
                  "test_public_surface_policy.PublicSurfacePolicyTests.test_root_markdown_and_uppercase_extensions_are_checked",
                  "test_public_surface_policy.SourcePolicyConsumerTests.test_nested_local_names_cannot_hide_credential_findings",
                  "test_public_surface_policy.SourcePolicyConsumerTests.test_parent_worktrees_directory_cannot_hide_credential_findings",
                  "test_public_surface_policy.SourcePolicyConsumerTests.test_source_policy_refuses_duplicate_verification_status",
                  "test_public_surface_policy.SourcePolicyConsumerTests.test_source_policy_refuses_explicitly_unverified_entry",
                  "test_public_surface_policy.SourcePolicyConsumerTests.test_source_policy_refuses_unavailable_evidence_bytes",
                  "test_public_surface_policy.SourcePolicyConsumerTests.test_source_policy_refuses_unresolved_source_license",
                  "test_public_surface_policy.SourcePolicyConsumerTests.test_valid_minimal_consumer_fixture_passes",
                  "test_public_surface_policy.SourceTraversalTests.test_repository_parent_named_worktrees_does_not_hide_source",
                  "test_public_surface_policy.SourceTraversalTests.test_walk_prunes_local_roots_but_keeps_nested_source"
              ],
              "test_source_policy_credentials": [
                  "test_source_policy_credentials.ApiCredentialBoundaryTests.test_api_keys_after_header_whitespace_are_rejected",
                  "test_source_policy_credentials.ApiCredentialBoundaryTests.test_api_keys_after_punctuation_are_rejected",
                  "test_source_policy_credentials.ApiCredentialBoundaryTests.test_api_keys_at_file_start_and_end_are_rejected",
                  "test_source_policy_credentials.ApiCredentialBoundaryTests.test_api_keys_in_json_strings_are_rejected",
                  "test_source_policy_credentials.ApiCredentialBoundaryTests.test_immutable_assessment_ids_in_json_are_not_credentials",
                  "test_source_policy_credentials.ApiCredentialBoundaryTests.test_immutable_assessment_ids_in_text_are_not_credentials"
              ]
          }
          policy_names = ["source_policy","public_surface_policy","acceptance_policy","creative_status_policy"]
          patterns = [module + ".py" for module in rosters]
          report = output / "unittest.json"

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def write_json(name, value):
              with (output / name).open("x", encoding="utf-8", newline="\n") as handle:
                  json.dump(value, handle, indent=2, sort_keys=True)
                  handle.write("\n")

          def require(condition, message):
              if not condition:
                  raise ValueError(message)

          def git(*args):
              return subprocess.check_output(["git", *args], cwd=repo, text=True,
                                             encoding="utf-8").strip()

          def run_retained(command, label):
              streams = {}
              started = datetime.now(timezone.utc).isoformat()
              with (output / (label + "-stdout.log")).open("xb") as stdout:
                  with (output / (label + "-stderr.log")).open("xb") as stderr:
                      process = subprocess.run(command, cwd=repo, stdout=stdout, stderr=stderr)
              for stream in ("stdout", "stderr"):
                  path = output / (label + "-" + stream + ".log")
                  streams[stream] = {"file": path.name, "sha256": digest(path)}
              return {"command": command, "exit_code": process.returncode, **streams,
                      "started_at_utc": started,
                      "completed_at_utc": datetime.now(timezone.utc).isoformat()}

          runner_command = [sys.executable, "-B", "-E", "-s", str(repo / "tooling/ci_test_runner.py"),
                            "--repo", str(repo), "--mode", "both", "--expected-source",
                            expected_source, "--require-complete", "--report", str(report)]
          for pattern in patterns:
              runner_command.extend(["--pattern", pattern])
          driver = run_retained(runner_command, "driver")
          write_json("driver.json", {"executed_source_sha": expected_source, **driver})
          classification = None
          classification_error = None
          try:
              classification = json.loads(report.read_text(encoding="utf-8"))
          except (OSError, ValueError, RecursionError) as error:
              classification_error = type(error).__name__ + ": " + str(error)

          runner_status = (
              classification.get("status")
              if isinstance(classification, dict)
              else None
          )
          if driver["exit_code"] == 124 or runner_status == "UNKNOWN":
              verification = {
                  "schema": "motionwright.source-admission-roster/1",
                  "status": "UNKNOWN",
                  "requested_source_sha": expected_source,
                  "driver_exit_code": driver["exit_code"],
                  "runner_reported_status": runner_status,
                  "expected_rosters": rosters,
                  "expected_unique_tests": sum(len(ids) for ids in rosters.values()),
                  "expected_test_invocations": 2 * sum(len(ids) for ids in rosters.values()),
                  "public_policies": [
                      {
                          "name": name,
                          "status": "NOT_RUN",
                          "reason": "prior canonical execution is UNKNOWN",
                      }
                      for name in policy_names
                  ],
                  "postchecks": "NOT_RUN",
                  "operations_retried": False,
                  "scope": "Incomplete canonical execution; no source, release or human acceptance",
              }
              if classification_error is not None:
                  verification["classification_error"] = classification_error
              write_json("roster-verification.json", verification)
              print(json.dumps(verification, sort_keys=True))
              raise SystemExit(124)
          policy_results = []
          for name in policy_names:
              path = repo / "tooling" / (name + ".py")
              result = run_retained([sys.executable, "-B", "-E", "-s", str(path)], name)
              result.update(name=name, source_sha256=digest(path))
              policy_results.append(result)
          if policy_names:
              write_json("policies.json", {
                  "schema": "motionwright.source-admission-policies/1",
                  "executed_source_sha": expected_source, "steps": policy_results,
                  "status": "PASS" if all(item["exit_code"] == 0 for item in policy_results) else "FAIL",
              })

          verification = {
              "schema": "motionwright.source-admission-roster/1", "status": "FAIL",
              "executed_source_sha": expected_source, "expected_rosters": rosters,
              "expected_unique_tests": sum(len(ids) for ids in rosters.values()),

          cargo test --locked --jobs 2 -p motionwright-native --test desktop_workflow_route -- --test-threads=1 | tee "$log"
          # Includes the 11 exact effect-grant tests imported by this integration target.
          grep -F '25 passed; 0 failed; 0 ignored' "$log"
      - name: Native owner lifetime and resource identity regressions
        if: contains(fromJSON('["desktop-playback","desktop-saved-delivery","desktop-workflow"]'), inputs.verification_scope)
        run: cargo test --locked --jobs 2 -p motionwright-desktop desktop_owner -- --test-threads=1
      - name: Clippy desktop boundary
        run: cargo clippy --locked --jobs 2 -p motionwright-desktop --keep-going --all-targets -- -D warnings

  first-use-example:
    needs: source-boundary
    if: ${{ !cancelled() && (needs.source-boundary.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'first-use-example')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Source policy
        run: python3 -B tooling/source_policy.py
      - name: Atomic creation and portable import recovery
        if: inputs.first_use_case == 'all' || inputs.first_use_case == ''
        run: |
          set -euo pipefail
          cargo test --locked --jobs 2 -p motionwright-storage --lib project_creation::tests:: -- --test-threads=1
          cargo test --locked --jobs 2 -p motionwright-storage --lib imported_project_recovery_rejects_tampered_or_ambiguous_original_markers -- --test-threads=1
          cargo test --locked --jobs 2 -p motionwright-service --test project_portability_authority portable_import_recovery_ -- --test-threads=1
      - name: Stable Ubuntu package mirrors
        run: |
          # Regional EC2 mirrors stalled the original prerequisite download.
          # Change only that URI; suites, components and signed keyrings stay intact.
          for apt_source in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if test -f "$apt_source"; then
              sudo sed -i -E 's@https?://[a-z0-9-]+\.ec2\.archive\.ubuntu\.com/ubuntu/?@https://archive.ubuntu.com/ubuntu/@g' "$apt_source"
            fi
          done
      - name: Native source prerequisites
        if: inputs.first_use_case == 'all' || inputs.first_use_case == '' || inputs.first_use_case == 'static-layout' || inputs.first_use_case == 'follow' || inputs.first_use_case == 'static-rotation' || inputs.first_use_case == 'creative-batch'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpipewire-0.3-dev pkg-config clang
      - name: First-use original example, creation custody and free portable source
        if: inputs.first_use_case == 'all' || inputs.first_use_case == ''
        run: |
          set -euo pipefail
          cargo clippy --locked --jobs 2 -p motionwright-native --test first_use_example -- -D warnings
          cargo test --locked --jobs 2 -p motionwright-service --test project_creation_idempotency -- --test-threads=1
          log="$RUNNER_TEMP/first-use-example-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.original.log"
          test ! -e "$log"
          cargo test --locked --jobs 2 -p motionwright-native --test first_use_example first_use_tests:: -- --test-threads=1 > "$log" 2>&1 || {
            tail -n 75 "$log"; exit 1;
          }
          python3 -B - "$log" <<'PY_FIRST_USE_SOURCE'
          import re, sys
          from pathlib import Path
          raw = Path(sys.argv[1]).read_text(encoding="utf-8")
          expected = {
              "bundled_example_reopens_as_complete_editable_native_source",
              "example_selection_is_bound_to_the_grant_and_original_request",
              "lost_example_reply_recovers_the_original_without_replacing_saved_edits",
              "bundled_example_exports_and_imports_portably_without_accounts_or_external_media",
          }
          found = re.findall(r"^test first_use_tests::([a-z0-9_]+) \.\.\. ok$", raw, re.M)
          assert len(found) == len(expected) and set(found) == expected
          assert "4 passed; 0 failed; 0 ignored" in raw
          print("FIRST_USE_EXAMPLE_SOURCE=PASS; cases=4; SQLite=REAL; MotionCanvas=SOURCE_REALIZATION; HyperFrames=UNSUPPORTED_MOTION_VERIFIED; NativeHost=NOT_RUN; G2=NOT_GRANTED")
          PY_FIRST_USE_SOURCE
      - name: Source checks for hierarchy, camera, cut continuity and editable Manim
        if: inputs.first_use_case == 'all' || inputs.first_use_case == ''
        run: |
          set -euo pipefail
          cargo test --locked --jobs 2 -p motionwright-domain --lib camera_reframe:: -- --test-threads=1
          cargo test --locked --jobs 2 -p motionwright-domain --lib exact_native_position_move_inside_static_clip_saves_four_editable_keys_once -- --test-threads=1
          cargo test --locked --jobs 2 -p motionwright-domain --lib scene_boundary -- --test-threads=1
          cargo test --locked --jobs 2 -p motionwright-native --lib film::tests:: -- --test-threads=1
          cargo test --locked --jobs 2 -p motionwright-native --test manim_editable_projection -- --test-threads=1
      - name: Exact authored relation projections for landscape, portrait and square
        if: inputs.first_use_case == 'static-layout' || inputs.first_use_case == 'follow'
        run: |
          set -euo pipefail
          cargo clippy --locked --jobs 2 -p motionwright-native --lib -- -D warnings
          cargo test --locked --jobs 2 -p motionwright-native --lib film::tests::authored_static_alignment_preserves_exact_output_box_edges_and_source -- --exact --test-threads=1
          cargo test --locked --jobs 2 -p motionwright-native --lib film::tests::authored_follow_chain_compiles_exact_native_translation_without_saved_keys -- --exact --test-threads=1
      - name: Exact saved shape rotation at original shot starts and composed camera
        if: inputs.first_use_case == 'static-rotation'
        run: |
          set -euo pipefail
          cargo clippy --locked --jobs 2 -p motionwright-native --lib -- -D warnings
          cargo test --locked --jobs 2 -p motionwright-domain --lib camera_reframe:: -- --test-threads=1
          cargo test --locked --jobs 2 -p motionwright-native --lib film::tests::saved_static_shape_rotation_compiles_at_every_original_shot_start -- --exact --test-threads=1
          cargo test --locked --jobs 2 -p motionwright-native --lib film::tests::saved_static_rotation_preserves_camera_translation_and_rejects_unsafe_geometry -- --exact --test-threads=1
      - name: Integrated creative source, animation, typography and transactional Timeline cohort
        if: inputs.first_use_case == 'creative-batch'

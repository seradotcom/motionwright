              selected_cases='saves nested Clip Group Clip|all three bus automation|native property review edits a complete source-bound batch|procedural influence edits|editable procedural path and count reflow|Measured actual source bytes|Measured original binding receipt|Measured complete output editing|saved scene camera follows the same playhead|typography_focus|typography_contrast|caption emphasis keeps|saved Follow inherits translation|context label retains authored pose|scoped style and complete animation|Canvas arrangement uses real grants|Timeline animation timing retains|Beat split uses real Service authority|A continuous editorial production|first-use native keyboard sequence|Selected descendants update together|Filled rectangles survive actual|Relink retained source through actual|Studio-authored Blender recipe becomes one immutable source capsule|Blender camera and primitive authoring survive actual' ;;

          case "$MW_INTERCHANGE_CASE" in
            otio|otio-kdenlive) selection=(tests/otio-real-media-bridge-service.spec.ts) ;;
            portable-project)
              selection=(tests/project-mutation.spec.ts --grep 'real portable export and verified restore rotate generation, preserve CAS and serialize the next Brief edit$') ;;
            *) echo 'Unadmitted original interchange selection'; exit 2 ;;
          esac
          npx playwright test "${selection[@]}" \
            --project chromium --workers=1 --retries=0 --reporter=line,json \
            2>&1 | tee "$MW_OTIO_CI/otio-playwright.original.log"
          /usr/bin/python3 -B -E -s - <<'PY_NATIVE_OTIO_PASS'
          import hashlib, json, os, pathlib
          root=pathlib.Path(os.environ['MW_OTIO_CI'])
          result=json.loads((root/'playwright.json').read_bytes())
          stats=result['stats']
          assert stats.get('expected')==1,stats
          assert all(stats.get(k,0)==0 for k in ('unexpected','flaky','skipped')),stats
          original=(root/'otio-playwright.original.log').read_bytes()
          assert 0<len(original)<8*1024*1024
          receipt={
            'schema':'motionwright.ci.original-studio-interchange/1',
            'case':os.environ['MW_INTERCHANGE_CASE'],
            'source_sha':os.environ['GITHUB_SHA'],
            'run_id':os.environ['GITHUB_RUN_ID'],
            'attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'status':{
              'otio':'ONE_REAL_MEDIA_STUDIO_SERVICE_SQLITE_CAS_ROUNDTRIP_PASS',
              'otio-kdenlive':'ONE_KDENLIVE_CUT_STUDIO_SERVICE_SQLITE_CAS_ROUNDTRIP_PASS',
              'portable-project':'ONE_ORIGINAL_PORTABLE_PROJECT_EXPORT_IMPORT_REOPEN_PASS',
            }[os.environ['MW_INTERCHANGE_CASE']],
            'input_profile':os.environ.get('MOTIONWRIGHT_OTIO_INPUT_PROFILE') or None,
            'expected':1,'unexpected':0,'flaky':0,'skipped':0,
            'original_log_sha256':hashlib.sha256(original).hexdigest(),
            'original_log_bytes':len(original),
            'installed_tauri':False,'actual_nle_installed':False,
            'human_acceptance':False,'release_authorized':False,
            'G2':'NOT_GRANTED','G3':'STOP'
          }
          (root/'receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('studio-interchange=PASS',os.environ['MW_INTERCHANGE_CASE'],'one original Store flow')
          PY_NATIVE_OTIO_PASS
      - name: Retain only safe source-bound logs and outcome, never original media or Store
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: original-${{ inputs.interchange_case == 'portable-project' && 'portable-project' || 'otio-media' }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/otio-media-${{ github.run_id }}-${{ github.run_attempt }}/desktop-tests.original.log
            ${{ runner.temp }}/otio-media-${{ github.run_id }}-${{ github.run_attempt }}/cargo-service.original.log
            ${{ runner.temp }}/otio-media-${{ github.run_id }}-${{ github.run_attempt }}/untracked.original
            ${{ runner.temp }}/otio-media-${{ github.run_id }}-${{ github.run_attempt }}/generated-ignored.original
            ${{ runner.temp }}/otio-media-${{ github.run_id }}-${{ github.run_attempt }}/generated-permissions.json
            ${{ runner.temp }}/otio-media-${{ github.run_id }}-${{ github.run_attempt }}/otio-playwright.original.log
            ${{ runner.temp }}/otio-media-${{ github.run_id }}-${{ github.run_attempt }}/playwright.json
            ${{ runner.temp }}/otio-media-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json

          grep -F '12 passed; 0 failed; 0 ignored' "$log"
          cargo test --locked --jobs 2 -p motionwright-native --lib saved_delivery_audio_ -- --test-threads=1 | tee "$log"
          grep -F '1 passed; 0 failed; 0 ignored' "$log"
          # Compile-compatible consumer coverage omitted by the prior incorrect module filter.
          cargo test --locked --jobs 2 -p motionwright-native --lib production::blender_original::product::tests:: -- --test-threads=1 | tee "$log"
          grep -E 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$log"
          cargo clippy --locked --jobs 2 -p motionwright-native --lib -- -D warnings
          cargo test --locked --jobs 2 -p motionwright-desktop effect_grants -- --test-threads=1

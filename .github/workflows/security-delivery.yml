          cargo clippy --locked --jobs 2 -p motionwright-native --lib -- -D warnings
          cargo test --locked --jobs 2 -p motionwright-native --lib root_budget_productive_tests:: -- --test-threads=1 | tee "$log"
          grep -F 'productive_shared_custody_retains_only_original_store_and_connection ... ok' "$log"
          grep -F 'productive_mlt_continuation_keeps_root_and_fences_unknown_changed_output ... ok' "$log"
          grep -F 'saved_capture_reopens_closed_store_without_redispatch_or_new_budget ... ok' "$log"
          grep -F 'saved_capture_recovery_rejects_changed_files_owner_and_source ... ok' "$log"
          grep -F 'saved_capture_recovery_preserves_unknown_delivery_and_spent_capacity ... ok' "$log"
          grep -F 'saved_capture_legacy_full_receipts_are_not_backfilled ... ok' "$log"
      - name: Saved original delivery after SQLite reopen with fresh destination authority

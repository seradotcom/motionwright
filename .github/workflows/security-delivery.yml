          cargo clippy --locked --jobs 2 -p motionwright-native --lib -- -D warnings
          # Collect independent selected unit/transaction failures in one job.
          # A shared compilation/Clippy failure still stops before this block.
          cohort_status=0
          selected_check() { "$@" || cohort_status=1; }
          selected_check cargo test --no-fail-fast --locked --jobs 2 -p motionwright-domain --lib nested_static_group_order_validates_all_ancestors_and_sibling_scopes -- --test-threads=1
          selected_check cargo test --no-fail-fast --locked --jobs 2 -p motionwright-domain --test camera_reframe --test procedural_fields --test craft_components --test caption_emphasis --test production_design --test scene_beat_timeline --test delivery_family_propagation --test native_capsule_source_atomicity --test music_clock -- --test-threads=1
          selected_check cargo test --no-fail-fast --locked --jobs 2 -p motionwright-native --lib film::tests:: -- --test-threads=1
          selected_check cargo test --no-fail-fast --locked --jobs 2 -p motionwright-native --test procedural_fields --test craft_components --test native_caption_burn_in -- --test-threads=1
          selected_check cargo test --no-fail-fast --locked --jobs 2 -p motionwright-native --lib hyperframes::tests:: -- --test-threads=1
          selected_check cargo test --no-fail-fast --locked --jobs 2 -p motionwright-native --test blender_studio_recipe --test blender_static_camera_source --test voice_audition --test manim_editable_projection -- --test-threads=1
          selected_check cargo test --locked --jobs 2 -p motionwright-native --lib original_blender_plan_ -- --test-threads=1
          selected_check cargo test --locked --jobs 2 -p motionwright-native --lib lit_scene_projects_the_saved_orthographic_zoom_and_roll_into_native_camera -- --test-threads=1
          selected_check cargo test --locked --jobs 2 -p motionwright-domain --lib explicit_music_source_window_is_a_bounded_exact_saved_cut -- --test-threads=1
          selected_check cargo test --locked --jobs 2 -p motionwright-native --test saved_original_mix saved_music_window_selects_exact_original_samples_and_reopens_without_source_rewrite -- --test-threads=1
          selected_check cargo test --no-fail-fast --locked --jobs 2 -p motionwright-service --test scene_beat_timeline --test delivery_family_persistence --test native_capsule_source_import --test music_cut_persistence -- --test-threads=1
          exit "$cohort_status"
      - name: Bound original voice cuts and localized delivery source checks
        if: inputs.first_use_case == 'audio-cut'
        run: |
          set -euo pipefail
          cargo clippy --locked --jobs 2 -p motionwright-native --lib -- -D warnings
          cargo test --locked --jobs 2 -p motionwright-domain --lib voice_cut:: -- --test-threads=1
          cargo test --locked --jobs 2 -p motionwright-domain --lib delivery:: -- --test-threads=1
          cargo test --locked --jobs 2 -p motionwright-domain --lib delivery_recipe:: -- --test-threads=1
          cargo test --no-fail-fast --locked --jobs 2 -p motionwright-native --test original_mix --test saved_original_mix -- --test-threads=1
          cargo test --no-fail-fast --locked --jobs 2 -p motionwright-service --test delivery_recipe_persistence --test music_cut_persistence -- --test-threads=1
          cargo test --locked --jobs 2 -p motionwright-native --lib production::audio_analysis::tests:: -- --test-threads=1
          cargo test --locked --jobs 2 -p motionwright-native --test saved_mix_native_consumers --no-run
      - name: Negotiated Film v2 and native preview raster source regressions
        if: inputs.first_use_case == 'native-preview-blend'
        run: |
          set -euo pipefail
          cargo test --locked --jobs 2 -p motionwright-native --lib native_subject_blend_selects_v2_only_for_saved_non_normal_leaves -- --test-threads=1
          cargo test --locked --jobs 2 -p motionwright-native --lib native_blend_ -- --test-threads=1
          cargo test --locked --jobs 2 -p motionwright-native --lib reduced_window_raster_preserves_film_and_refuses_foreign_png_or_scale -- --test-threads=1
      - name: Delivery-local Hero layout and native localized text source regressions

                  "test_source_lock_admission_ntfs.SourceLockAdmissionNtfsTests.test_rewritten_source_lock_is_admitted_without_changing_its_bytes"
              ]
          }
          policy_names = []
          patterns = [module + ".py" for module in rosters]
          report = output / "unittest.json"

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def write_json(name, value):
              with (output / name).open("x", encoding="utf-8", newline="\n") as handle:
                  json.dump(value, handle, indent=2, sort_keys=True)
                  handle.write("\n")

          def require(condition, message):
              if not condition:
                  raise ValueError(message)

          def git(*args):
              return subprocess.check_output(["git", *args], cwd=repo, text=True,
                                             encoding="utf-8").strip()

          def run_retained(command, label):
              streams = {}
              started = datetime.now(timezone.utc).isoformat()
              with (output / (label + "-stdout.log")).open("xb") as stdout:
                  with (output / (label + "-stderr.log")).open("xb") as stderr:
                      process = subprocess.run(command, cwd=repo, stdout=stdout, stderr=stderr)
              for stream in ("stdout", "stderr"):
                  path = output / (label + "-" + stream + ".log")
                  streams[stream] = {"file": path.name, "sha256": digest(path)}
              return {"command": command, "exit_code": process.returncode, **streams,
                      "started_at_utc": started,
                      "completed_at_utc": datetime.now(timezone.utc).isoformat()}

          runner_command = [sys.executable, "-B", "-E", "-s", str(repo / "tooling/ci_test_runner.py"),
                            "--repo", str(repo), "--mode", "both", "--expected-source",
                            expected_source, "--require-complete", "--report", str(report)]
          for pattern in patterns:
              runner_command.extend(["--pattern", pattern])
          driver = run_retained(runner_command, "driver")
          write_json("driver.json", {"executed_source_sha": expected_source, **driver})
          classification = None
          classification_error = None
          try:
              classification = json.loads(report.read_text(encoding="utf-8"))
          except (OSError, ValueError, RecursionError) as error:
              classification_error = type(error).__name__ + ": " + str(error)

          runner_status = (
              classification.get("status")
              if isinstance(classification, dict)
              else None
          )
          if driver["exit_code"] == 124 or runner_status == "UNKNOWN":
              verification = {
                  "schema": "motionwright.source-admission-roster/1",
                  "status": "UNKNOWN",
                  "requested_source_sha": expected_source,
                  "driver_exit_code": driver["exit_code"],
                  "runner_reported_status": runner_status,
                  "expected_rosters": rosters,
                  "expected_unique_tests": sum(len(ids) for ids in rosters.values()),
                  "expected_test_invocations": 2 * sum(len(ids) for ids in rosters.values()),
                  "public_policies": [
                      {
                          "name": name,
                          "status": "NOT_RUN",
                          "reason": "prior canonical execution is UNKNOWN",
                      }
                      for name in policy_names
                  ],
                  "postchecks": "NOT_RUN",
                  "operations_retried": False,
                  "scope": "Incomplete canonical execution; no source, release or human acceptance",
              }
              if classification_error is not None:
                  verification["classification_error"] = classification_error
              write_json("roster-verification.json", verification)
              print(json.dumps(verification, sort_keys=True))
              raise SystemExit(124)
          policy_results = []
          for name in policy_names:
              path = repo / "tooling" / (name + ".py")
              result = run_retained([sys.executable, "-B", "-E", "-s", str(path)], name)
              result.update(name=name, source_sha256=digest(path))
              policy_results.append(result)
          if policy_names:
              write_json("policies.json", {
                  "schema": "motionwright.source-admission-policies/1",
                  "executed_source_sha": expected_source, "steps": policy_results,
                  "status": "PASS" if all(item["exit_code"] == 0 for item in policy_results) else "FAIL",
              })

          verification = {
              "schema": "motionwright.source-admission-roster/1", "status": "FAIL",
              "executed_source_sha": expected_source, "expected_rosters": rosters,
              "expected_unique_tests": sum(len(ids) for ids in rosters.values()),
              "expected_test_invocations": 2 * sum(len(ids) for ids in rosters.values()),

name: Security and Delivery

on:
  push:
    branches: ["main", "feat/**"]
    paths:
      - "apps/desktop/src-tauri/**"
      - "apps/studio/src/**"
      - "crates/storage/**"
      - "crates/service/**"
      - "tooling/source_policy.py"
      - "tooling/release_manifest.py"
      - "tooling/v01_release_readiness.py"
      - "docs/v01-release-readiness.md"
      - "docs/acceptance/**"
      - "docs/security/known-rustsec-advisories.json"
      - "tooling/package_receipt.py"
      - "tooling/security_advisory_policy.py"
      - "tooling/glib_owner_chain.py"
      - "tooling/v01_glib_product_admission.py"
      - "tooling/upstream-crates/**"
      - "vendor/glib-0.18.5/**"
      - "tooling/tests/**"
      - "docs/security/**"
      - "SOURCE_LOCK.json"
      - "Cargo.lock"
      - "apps/studio/package-lock.json"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "docs/security.md"
      - ".github/workflows/security-delivery.yml"
      - ".github/workflows/package-candidate.yml"
      - ".github/workflows/heavy-verification.yml"
  pull_request:
    paths:
      - "apps/desktop/src-tauri/**"
      - "apps/studio/src/**"
      - "crates/storage/**"
      - "crates/service/**"
      - "tooling/source_policy.py"
      - "tooling/release_manifest.py"
      - "tooling/v01_release_readiness.py"
      - "docs/v01-release-readiness.md"
      - "docs/acceptance/**"
      - "docs/security/known-rustsec-advisories.json"
      - "tooling/package_receipt.py"
      - "tooling/security_advisory_policy.py"
      - "tooling/glib_owner_chain.py"
      - "tooling/v01_glib_product_admission.py"
      - "tooling/upstream-crates/**"
      - "vendor/glib-0.18.5/**"
      - "tooling/tests/**"
      - "docs/security/**"
      - "SOURCE_LOCK.json"
      - "Cargo.lock"
      - "apps/studio/package-lock.json"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "docs/security.md"
      - ".github/workflows/security-delivery.yml"
      - ".github/workflows/package-candidate.yml"
      - ".github/workflows/heavy-verification.yml"
  workflow_dispatch:
      inputs:
        verification_scope:
          description: Select established checks, frozen causal pairs, or the current composition
          type: choice
          options: [full, foundation-causal, foundation-import-budget, foundation-current, foundation-projection-diagnostic]
          default: full

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  source-boundary:
    if: github.event_name != 'workflow_dispatch' || (inputs.verification_scope != 'foundation-causal' && inputs.verification_scope != 'foundation-import-budget' && inputs.verification_scope != 'foundation-current' && inputs.verification_scope != 'foundation-projection-diagnostic')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Public source, WebView and credential policy
        run: python3 tooling/source_policy.py
      - name: Verify exact crates.io glib two-line FFI backport chosen by Cargo
        run: |
          mkdir -p ci-evidence
          python3 tooling/v01_glib_product_admission.py --output ci-evidence/v01-glib-patched-desktop-source.json
          python3 -m json.tool ci-evidence/v01-glib-patched-desktop-source.json >/dev/null
      - name: Install hash-pinned custody test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --no-input --no-cache-dir \
            --only-binary=:all: --require-hashes -r tooling/requirements/mlt-g2-custody.txt
          python3 -m pip check
      - name: Security policy regressions
        run: python3 -m unittest discover -s tooling/tests -p 'test_*.py'
      - name: Exact-source delivery manifest
        run: |
          mkdir -p ci-evidence
          python3 tooling/release_manifest.py \
            --git-sha "$(git rev-parse HEAD)" \
            --output ci-evidence/delivery-manifest.json
          python3 -m json.tool ci-evidence/delivery-manifest.json >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-delivery-manifest
          path: ci-evidence/delivery-manifest.json
          if-no-files-found: error
      - name: Produce exact-source v0.1.0 release-blocker assessment
        run: |
          python3 tooling/v01_release_readiness.py \
            --source-sha "$(git rev-parse HEAD)" \
            --verify-checkout \
            --expect-blocked \
            --output ci-evidence/v01-release-readiness.json
          python3 -m json.tool ci-evidence/v01-release-readiness.json > /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motionwright-v01-release-readiness
          path: ci-evidence/v01-release-readiness.json
          if-no-files-found: error

  dependency-advisories:
    needs: source-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: false
      - name: Verify reviewed glib 0.18 GTK/Tauri owner graph is unchanged
        run: |
          mkdir -p ci-evidence
          python3 -m unittest discover -s tooling/tests -p 'test_glib_owner_chain.py' -v
          python3 tooling/security_advisory_policy.py \
            --output ci-evidence/glib-source-owner-chain.json
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Enforce exact reviewed advisory set
        run: |
          mkdir -p ci-evidence
          set +e
          cargo audit --json > ci-evidence/cargo-audit.json
          audit_status=$?
          set -e
          python3 tooling/security_advisory_policy.py \
            --audit-json ci-evidence/cargo-audit.json \
            --output ci-evidence/security-advisory-policy.json
          if [ "$audit_status" -ne 0 ]; then
            echo "cargo audit reported a vulnerability; the reviewed warning policy is not a waiver."
            exit "$audit_status"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: motionwright-security-advisory-evidence
          path: ci-evidence
          if-no-files-found: ignore

  controlled-imports:
    needs: source-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: false
      - name: Format
        run: cargo fmt --all -- --check
      - name: Storage and import security contracts
        run: cargo test -p motionwright-storage -p motionwright-service --all-targets
      - name: Clippy
        run: cargo clippy -p motionwright-storage -p motionwright-service --all-targets -- -D warnings

  desktop-boundary:
    needs: source-boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: clippy
      - name: Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check bounded desktop command surface
        run: cargo check -p motionwright-desktop
      - name: Effect-grant boundary regressions
        run: cargo test -p motionwright-desktop effect_grants
      - name: Native PNG preview security regressions
        run: cargo test --locked -p motionwright-desktop native_preview
      - name: Measured WAV / native AV master source regressions
        run: cargo test --locked -p motionwright-desktop av_master
      - name: Verified MP4 local delivery security regressions
        run: cargo test --locked -p motionwright-desktop av_delivery
      - name: Clippy desktop boundary
        run: cargo clippy -p motionwright-desktop --all-targets -- -D warnings

  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4

  v01-private-ntfs-evidence:
    needs: source-boundary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: v0.1 private manifest and real NTFS junction guardrails
        run: python -m unittest discover -s tooling/tests -p "test_acceptance*.py" -v

  foundation-causal-g0:
    if: github.event_name == 'workflow_dispatch' && (inputs.verification_scope == 'foundation-causal' || inputs.verification_scope == 'foundation-import-budget' || inputs.verification_scope == 'foundation-current' || inputs.verification_scope == 'foundation-projection-diagnostic')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: gate
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Verify exact selected gate in both test entry points
        run: |
          mkdir -p "$GITHUB_WORKSPACE/verification/foundation-g0"
          python3 gate/tooling/ci_test_runner.py --repo gate \
            --pattern test_ci_foundation_causal.py --mode both --require-complete \
            --expected-source "$GITHUB_SHA" \
            --report "$GITHUB_WORKSPACE/verification/foundation-g0/receipt.json"
      - name: Public source policies
        working-directory: gate
        run: |
          python3 tooling/source_policy.py
          python3 tooling/public_surface_policy.py
          python3 tooling/acceptance_policy.py
          python3 tooling/creative_status_policy.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: foundation-causal-g0-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/foundation-g0
          if-no-files-found: error

  foundation-causal:
    if: github.event_name == 'workflow_dispatch' && (inputs.verification_scope == 'foundation-causal' || inputs.verification_scope == 'foundation-import-budget' || inputs.verification_scope == 'foundation-current' || inputs.verification_scope == 'foundation-projection-diagnostic')
    needs: foundation-causal-g0
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      FOUNDATION_CAUSAL_SELECTION: ${{ inputs.verification_scope }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: gate
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: clippy
      - name: Observe the selected frozen causal pairs sequentially
        run: |
          python3 gate/tooling/ci_foundation_causal.py \
            --workspace "$GITHUB_WORKSPACE" \
            --selection "$FOUNDATION_CAUSAL_SELECTION" \
            --output "$GITHUB_WORKSPACE/verification/foundation-causal" --execute
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: foundation-causal-originals-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/foundation-causal
          include-hidden-files: true
          if-no-files-found: error

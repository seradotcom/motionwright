name: Review key filesystem portability

on:
  push:
    branches: ['codex/graph6-closure-*', 'integrate/phase1-final-composition-20261027']
    paths:
      - '.github/workflows/review-key-portability.yml'
      - 'tooling/review_private_key.py'
      - 'tooling/tests/test_review_private_key.py'
      - 'tooling/graph_review_artifact.py'
      - 'tooling/tests/test_graph_review_artifact.py'
      - 'tooling/requirements/graph-review-fixtures.txt'
      - 'tooling/review_original_io.py'
      - 'tooling/tests/test_review_original_io.py'
      - 'tooling/nsis_owned_files.py'
  pull_request:
    paths:
      - '.github/workflows/review-key-portability.yml'
      - 'tooling/review_private_key.py'
      - 'tooling/tests/test_review_private_key.py'
      - 'tooling/graph_review_artifact.py'
      - 'tooling/tests/test_graph_review_artifact.py'
      - 'tooling/requirements/graph-review-fixtures.txt'
      - 'tooling/review_original_io.py'
      - 'tooling/tests/test_review_original_io.py'
      - 'tooling/nsis_owned_files.py'

permissions:
  contents: read

jobs:
  filesystem-custody:
    name: Protected key files on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Check actual owner permissions and alias rejection
        run: python -B -m unittest tooling.tests.test_review_private_key -v
      - name: Install hash-pinned artifact fixture dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r tooling/requirements/graph-review-fixtures.txt
      - name: Check retained review originals across filesystem metadata domains
        run: python -B -m unittest tooling.tests.test_review_original_io -v
      - name: Check original GitHub artifact transport without live secrets
        run: python -B -m unittest tooling.tests.test_graph_review_artifact -v

name: Exact Native Cubic-Out Motion

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/domain/src/lib.rs"
      - "crates/native/src/film.rs"
      - "crates/native/src/lib.rs"
      - "crates/native/examples/native-render-e2e.rs"
      - "crates/service/tests/native_out_cubic_persistence.rs"
      - "apps/studio/src/CanvasWorkspace.tsx"
      - "apps/studio/src/api.ts"
      - "apps/studio/src/types.ts"
      - "apps/studio/src/nativeOutCubicMotion.test.ts"
      - "apps/studio/tests/canvas-native-outcubic.spec.ts"
      - "tooling/native_render_e2e.py"
      - "tooling/tests/test_native_out_cubic_pixels.py"
      - "docs/creative-production/NATIVE_OUT_CUBIC_MOTION.md"
      - "docs/creative-production/requirements-status.json"
      - ".github/workflows/native-motion-outcubic.yml"
  push:
    branches: ["main"]
    paths:
      - "crates/domain/src/lib.rs"
      - "crates/native/src/film.rs"
      - "crates/native/src/lib.rs"
      - "apps/studio/src/CanvasWorkspace.tsx"
      - "apps/studio/src/nativeOutCubicMotion.test.ts"
      - "tooling/native_render_e2e.py"
      - ".github/workflows/native-motion-outcubic.yml"

permissions:
  contents: read

concurrency:
  group: native-cubic-out-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sources-and-roi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Preserve exact Semwright pin and private acceptance status
        run: |
          python3 tooling/source_policy.py
          python3 tooling/creative_status_policy.py
          python3 tooling/acceptance_policy.py
      - name: Reject fabricated cubic motion or opacity from synthetic pixels
        run: python3 -m unittest discover -s tooling/tests -p test_native_out_cubic_pixels.py -v

  rust-domain-native-and-service:
    needs: sources-and-roi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Require exact authored Rust formatting
        run: cargo fmt --all -- --check
      - name: Domain atomic frame-aligned motion and source locks
        run: cargo test --locked -p motionwright-domain --lib native_out_cubic -- --nocapture
      - name: Actual SQLite CAS and generation/revision persistence
        run: cargo test --locked -p motionwright-service --test native_out_cubic_persistence -- --nocapture
      - name: Native Film original cubic ease-in/out boundaries
        run: cargo test --locked -p motionwright-native --lib exact_cubic_out_ -- --nocapture
      - name: Native SDK operation and input safety
        run: cargo test --locked -p motionwright-native --lib exact_out_cubic_native_sdk_operation_is_typed_and_fails_closed -- --nocapture
      - name: No Rust warnings in affected authoritative crates
        run: cargo clippy --locked -p motionwright-domain -p motionwright-service -p motionwright-native --all-targets -- -D warnings

  studio-source-and-browser:
    needs: sources-and-roi
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Exact editor easing and immutable node identity
        run: npx vitest run src/nativeOutCubicMotion.test.ts
      - name: Production TypeScript and source build
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Legacy linear UI and new cubic-out UI both preserve atomicity
        run: npx playwright test tests/canvas-native-linear-motion.spec.ts tests/canvas-native-outcubic.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-cubic-out-browser-evidence
          path: |
            apps/studio/test-results
            apps/studio/playwright-report
          if-no-files-found: ignore

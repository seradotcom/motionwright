          def gc_proxy_environment(environment, temporary, isolated):
              """Keep the existing compiler policy; only admit a contained test-root override."""
              from pathlib import Path
              if type(environment) is not dict or any(type(key) is not str or type(value) is not str
                                                     for key, value in environment.items()):
                  raise ValueError("gc-proxy-environment-shape")
              root = Path(temporary)
              if not root.is_absolute() or root.is_symlink() or not root.is_dir():
                  raise ValueError("gc-proxy-private-temporary-root-required")
              root = root.resolve(strict=True)
              clean = dict(environment)
              root_keys = [key for key in clean if key.upper() == "MOTIONWRIGHT_TEST_ROOT"]
              if len(root_keys) > 1:
                  raise ValueError("gc-proxy-test-root-case-alias")
              # These literal controls are read by the frozen product's actor/crash paths.
              # Unknown test controls remain rejected by the existing isolation policy.
              blocked = [key for key in clean if key.upper() in gc_proxy_actor_controls()]
              if blocked:
                  raise ValueError("gc-proxy-inherited-actor-or-crash-control:" + ",".join(sorted(blocked)))
              for key in clean:
                  if key.upper().startswith("MOTIONWRIGHT_TEST_") and key not in root_keys:
                      raise ValueError("gc-proxy-unreviewed-test-control:" + key)
              chosen = root
              if root_keys:
                  requested = Path(clean.pop(root_keys[0]))
                  if not requested.is_absolute() or requested.is_symlink() or not requested.is_dir():
                      raise ValueError("gc-proxy-inherited-test-root-not-an-existing-absolute-directory")
                  requested = requested.resolve(strict=True)
                  if requested.is_relative_to(root):
                      chosen = requested
                  elif not root.is_relative_to(requested):
                      raise ValueError("gc-proxy-inherited-test-root-does-not-contain-owned-temporaries")
              result = isolated(clean)
              result["MOTIONWRIGHT_TEST_ROOT"] = str(chosen)
              return result


          def gc_proxy_formatter_environment(environment, tools, formatters):
              from pathlib import Path
              if type(formatters) is not dict or set(formatters) != {"cargo-fmt", "rustfmt"}:
                  raise ValueError("gc-proxy-observed-formatter-roster")
              parent = Path(tools["cargo"]["absolute_path"]).parent
              for name, row in formatters.items():
                  if (type(row) is not dict or type(row.get("absolute_path")) is not str
                          or not Path(row["absolute_path"]).is_absolute()
                          or Path(row["absolute_path"]).parent != parent
                          or type(row.get("bytes")) is not int or row["bytes"] <= 0
                          or type(row.get("sha256")) is not str or not re.fullmatch(r"[0-9a-f]{64}", row["sha256"])
                          or type(row.get("version")) is not str or not row["version"].startswith("rustfmt ")
                          or not 0 < len(row["version"]) <= 8192):
                      raise ValueError("gc-proxy-formatter-not-observed-in-selected-toolchain:" + name)
              if environment.get("RUSTFMT") not in (None, formatters["rustfmt"]["absolute_path"]):
                  raise ValueError("gc-proxy-inherited-formatter-override")
              return {**environment, "RUSTFMT": formatters["rustfmt"]["absolute_path"]}



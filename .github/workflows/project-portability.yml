name: Project Portability

on:
  push:
    branches: ["main", "feat/**"]
    paths:
      - "crates/domain/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/storage/**"
      - "crates/service/**"
      - "docs/architecture.md"
      - "docs/testing.md"
      - ".github/workflows/project-portability.yml"
  pull_request:
    paths:
      - "crates/domain/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/storage/**"
      - "crates/service/**"
      - "docs/architecture.md"
      - "docs/testing.md"
      - ".github/workflows/project-portability.yml"
  workflow_dispatch:
    inputs:
      verification_scope:
        description: Select complete portability, cache publication, or desktop OTIO export contracts
        required: true
        default: full
        type: choice
        options: [full, derived_cache, otio_export]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  storage-contracts:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.verification_scope != 'derived_cache' && inputs.verification_scope != 'otio_export') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Source policy
        run: python3 tooling/source_policy.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Storage and service tests
        run: cargo test --locked -p motionwright-storage -p motionwright-service --all-targets
      - name: Storage and service clippy
        run: cargo clippy --locked -p motionwright-storage -p motionwright-service --all-targets -- -D warnings

  file-import-platforms:
    name: File import authority and CAS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'otio_export' && 1 || 3 }}
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (inputs.verification_scope == 'derived_cache' || inputs.verification_scope == 'otio_export') && '["macos-latest","windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    env:
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Always verify selected export source and fast contracts
        if: github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'otio_export'
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path

          for policy in ("source_policy", "acceptance_policy", "creative_status_policy", "public_surface_policy"):
              subprocess.run([sys.executable, "-B", "tooling/" + policy + ".py"], check=True)
          subprocess.run(["cargo", "fmt", "--all", "--", "--check"], check=True)
          report = Path(os.environ["RUNNER_TEMP"]) / "project-portability-g0" / "receipt.json"
          subprocess.run([
              sys.executable, "-B", "tooling/ci_test_runner.py", "--repo", ".",
              "--mode", "both", "--pattern", "test_ci_test_runner.py",
              "--expected-source", os.environ["GITHUB_SHA"], "--report", str(report),
              "--require-complete",
          ], check=True)
      - name: Verify exact checkout and selective file import contracts
        shell: python
        run: |
          import hashlib, json, os, re, subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], encoding="utf-8", errors="replace").strip()

          actual = git("rev-parse", "HEAD")
          if actual != os.environ["GITHUB_SHA"] or git("status", "--porcelain", "--untracked-files=no"):
              raise SystemExit("file-import-platform-checkout-mismatch")
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          selection = "full"
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              selection = (event.get("inputs") or {}).get("verification_scope", "full")
          if selection not in {"full", "derived_cache", "otio_export"}:
              raise SystemExit("portability-selection-unsupported")
          pr = event.get("pull_request") or {}
          root = Path("verification/file-import-platforms")
          root.mkdir(parents=True, exist_ok=True)
          receipt = {
              "schema": "motionwright.file-import-platform-check/1",
              "actual_checkout": actual, "tree": git("rev-parse", "HEAD^{tree}"),
              "parents": [line.removeprefix("parent ") for line in
                          git("cat-file", "-p", "HEAD").split("\n\n", 1)[0].splitlines()
                          if line.startswith("parent ")],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "pr_head": (pr.get("head") or {}).get("sha"),
              "pr_base": (pr.get("base") or {}).get("sha"),
              "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_os": os.environ["RUNNER_OS"],
              "rustc": subprocess.check_output(["rustc", "--version"], text=True).strip(),
              "cargo": subprocess.check_output(["cargo", "--version"], text=True).strip(),
              "selection": selection, "selected_sources": {}, "results": [],
          }
          source_paths = (
              ".github/workflows/project-portability.yml", "Cargo.lock", "SOURCE_LOCK.json",
              "crates/storage/src/derived_cache.rs", "crates/service/tests/derived_cache_publication.rs",
              "crates/storage/tests/schema_migration_atomicity.rs",
          )
          if selection == "otio_export":
              source_paths = (
                  ".github/workflows/project-portability.yml",
                  "Cargo.toml", "Cargo.lock", "SOURCE_LOCK.json", "rust-toolchain.toml",
                  "crates/service/Cargo.toml",
                  "crates/service/tests/desktop_project_export.rs",
                  "apps/desktop/src-tauri/Cargo.toml",
                  "apps/desktop/src-tauri/src/effect_grants.rs",
                  "apps/desktop/src-tauri/src/local_error.rs",
                  "apps/desktop/src-tauri/src/project_export.rs",
                  "apps/desktop/src-tauri/src/project_library.rs",
              )
          for source_path in source_paths:
              git_bytes = subprocess.check_output(["git", "show", actual + ":" + source_path])
              checkout_bytes = Path(source_path).read_bytes()
              exact_checkout = checkout_bytes == git_bytes
              checkout_crlf = b"\r\n" not in git_bytes and checkout_bytes == git_bytes.replace(b"\n", b"\r\n")
              if not exact_checkout and not checkout_crlf:
                  raise SystemExit("portability-source-bytes-mismatch:" + source_path)
              receipt["selected_sources"][source_path] = {
                  "git_blob_oid": git("rev-parse", actual + ":" + source_path),
                  "git_sha256": hashlib.sha256(git_bytes).hexdigest(), "git_bytes": len(git_bytes),
                  "checkout_sha256": hashlib.sha256(checkout_bytes).hexdigest(), "checkout_bytes": len(checkout_bytes),
                  "bytes_equal": exact_checkout, "equal_after_exact_lf_to_crlf": checkout_crlf,
              }
          print(json.dumps(receipt, sort_keys=True), flush=True)
          cases = [
              ("service", ["-p", "motionwright-service", "--test", "file_import_idempotency"], {
                  "asset_import_replays_identical_bytes_and_metadata_after_reopen",
                  "voice_import_replays_identical_bytes_and_metadata_after_reopen",
                  "invalid_import_authority_takes_precedence_over_missing_source_io",
                  "changed_file_bytes_cannot_reuse_a_committed_asset_import_key",
                  "committed_import_keeps_real_cas_content_when_the_original_file_disappears",
                  "historical_asset_and_voice_recovery_preserves_head_without_source_or_cas",
                  "normal_asset_and_voice_replay_does_not_rehydrate_missing_cas",
                  "concurrent_connections_import_identical_bytes_with_one_event_and_one_outcome",
                  "rejected_active_svg_and_undecodable_voice_leave_no_published_blob_or_staging",
              }),
              ("storage", ["-p", "motionwright-storage", "--lib", "file_import::"], {
                  "file_import::tests::original_import_remains_readable_without_sources_after_edit_and_reopen",
                  "file_import::tests::absent_receipt_requires_current_revision_only_when_requested",
                  "file_import::tests::corrupt_receipt_hash_event_or_result_is_never_treated_as_absent",
                  "file_import::tests::changed_purpose_or_metadata_rejects_request_reuse_without_effects",
                  "file_import::staging_tests::staged_import_rejects_changed_capture_without_publishing_or_leaking_stage",
                  "file_import::staging_tests::dropping_duplicate_stages_and_rejecting_stale_import_preserve_blob",
              }),
          ]
          cases.extend([
              ('service-file-secrets', ['-p', 'motionwright-service', '--test', 'file_import_secret_boundaries'], {
                  'store_and_service_raw_ingestion_reject_late_credentials_and_preserve_existing_files',
                  'unbounded_staging_rejects_patterns_split_across_capture_reads',
                  'canonical_asset_import_rejects_bytes_before_project_journal_or_receipt_changes',
                  'canonical_voice_import_rejects_credential_shaped_pcm_before_commit',
                  'derived_cache_input_cannot_bypass_new_blob_admission_policy',
                  'known_legacy_import_keeps_source_binding_and_source_free_receipt_recovery',
                  'ordinary_inputs_preserve_original_bytes_measurement_and_reopened_state',
                  'bounded_and_unbounded_staging_reject_patterns_split_across_capture_reads',
              }),
              ('service-main-portable-secrets', ['-p', 'motionwright-service', '--test', 'main_portable_secret_boundaries'], {
                  'json_backup_export_rejects_credentials_in_current_metadata_and_retained_journal',
                  'json_backup_import_rejects_sensitive_metadata_before_any_project_write',
                  'portable_text_credential_rejection_does_not_depend_on_declared_mime',
                  'bundle_inspection_and_import_scan_actual_members_before_cas_publication',
                  'credential_patterns_cross_portable_read_boundaries_without_mime_trust',
                  'ordinary_text_media_and_large_opaque_bytes_roundtrip_without_rewriting',
                  'safe_json_backup_roundtrip_preserves_digest_history_and_editability',
                  'safe_json_backups_larger_than_bundle_budget_restore_and_reexport',
                  'bundle_metadata_keeps_its_existing_budget_on_export_inspect_and_import',
                  'complete_bundle_metadata_is_rejected_before_project_or_blob_publication',
                  'ordinary_text_larger_than_eight_mib_roundtrips_with_unchanged_bytes',
                  'credentials_after_eight_mib_of_opaque_legacy_media_refuse_export',
              }),
              ('service-portable-secrets', ['-p', 'motionwright-service', '--test', 'portable_secret_boundaries'], {
                  'json_backup_export_rejects_credentials_in_current_metadata_and_retained_journal',
                  'json_backup_import_rejects_sensitive_metadata_before_any_project_write',
                  'portable_text_credential_rejection_does_not_depend_on_declared_mime',
                  'bundle_inspection_and_import_scan_actual_members_before_cas_publication',
                  'credential_patterns_cross_portable_read_boundaries_without_mime_trust',
                  'ordinary_text_media_and_large_opaque_bytes_roundtrip_without_rewriting',
                  'safe_json_backup_roundtrip_preserves_digest_history_and_editability',
                  'safe_json_backups_larger_than_bundle_budget_restore_and_reexport',
                  'bundle_metadata_keeps_its_existing_budget_on_export_inspect_and_import',
              }),
              ('service-portability-authority', ['-p', 'motionwright-service', '--test', 'project_portability_authority'], {
                  'export_rejects_peer_revision_committed_after_precheck',
                  'bundle_export_rejects_stale_snapshot_before_creating_destination',
                  'import_rejects_complete_valid_bundle_replaced_after_inspection',
                  'service_inspected_bundle_transfers_real_cas_and_reopens_without_operational_receipts',
                  'service_export_preconditions_reject_foreign_scope_before_missing_source_io',
                  'service_exact_inspection_rejects_even_semantically_equal_manifest_reencoding',
                  'service_rejects_changed_blob_with_unchanged_manifest_and_publishes_no_member',
              }),
              ('storage-row-authority', ['-p', 'motionwright-storage', '--test', 'project_row_authority'], {
                  'ordinary_project_commits_replay_and_reopen_keep_their_own_identity',
                  'a_valid_document_in_the_wrong_row_cannot_redirect_a_commit',
                  'full_project_loads_reject_individually_corrupted_authority_columns',
                  'full_project_lists_reject_individually_corrupted_authority_columns',
                  'new_commits_reject_individually_corrupted_columns_without_effects',
                  'corrupt_current_row_is_rejected_before_receipt_replay',
                  'corrupt_row_rejection_precedes_missing_cas_source_access',
                  'cross_project_rejection_preserves_both_receipt_and_cache_streams',
                  'production_append_rejects_corrupt_rows_before_recording_observations',
                  'recovery_claim_rejects_corrupt_rows_before_allocating_an_attempt',
                  'file_import_absence_does_not_bypass_current_row_validation',
                  'historical_import_survives_later_edits_and_source_deletion_but_not_row_corruption',
                  'historical_production_observation_and_exact_recovery_claim_keep_distinct_rules',
                  'exact_title_and_column_only_summary_contract_remain_compatible',
              }),
              ('storage-schema-atomicity', ['-p', 'motionwright-storage', '--test', 'schema_migration_atomicity'], {
                  'failed_schema_upgrade_never_publishes_partial_new_tables_or_version',
                  'valid_fresh_open_and_reopen_keep_exact_schema_and_no_extra_objects',
                  'too_new_version_fails_without_rewriting_original_schema',
                  'production_order_allocation_failure_cannot_publish_a_partial_append_or_claim',
                  'production_order_backfill_failure_rolls_back_ddl_rows_and_sequence_counter',
                  'production_order_concurrent_migrations_publish_one_mapping_per_receipt',
                  'production_order_extension_trigger_failure_rolls_back_every_receipt_effect',
                  'production_order_migration_preserves_receipts_extension_foreign_keys_and_audit_triggers',
                  'production_order_missing_mapping_is_never_silently_backfilled_or_hidden',
                  'production_order_project_mismatch_is_rejected_from_both_scopes',
                  'production_order_reserved_object_collisions_are_rejected_without_adoption',
              }),
          ])
          cases.extend([
              ('cache-storage-publication', ['-p', 'motionwright-storage', '--lib', 'derived_cache::publication_interleaving_tests::'], {
                  'derived_cache::publication_interleaving_tests::equivalent_late_publication_preserves_the_winner_record',
                  'derived_cache::publication_interleaving_tests::late_publication_cannot_replace_a_different_winner',
                  'derived_cache::publication_interleaving_tests::late_publication_preserves_an_unowned_regular_destination',
              }),
              ('cache-service-publication', ['-p', 'motionwright-service', '--test', 'derived_cache_publication'], {
                  'distinct_scopes_and_kinds_remain_independent',
                  'exact_blob_repair_preserves_manifest_metadata_and_reopens',
                  'known_conflict_does_not_publish_the_rejected_blob',
                  'malformed_existing_manifest_does_not_publish_candidate_bytes',
                  'missing_blob_does_not_authorize_different_output_for_the_same_key',
              }),
          ])
          if selection == "derived_cache":
              selected_names = {"cache-storage-publication", "cache-service-publication"}
              cases = [case for case in cases if case[0] in selected_names]
              if {case[0] for case in cases} != selected_names or len(cases) != 2 or sum(len(case[2]) for case in cases) != 8:
                  raise SystemExit("derived-cache-selection-incomplete")
          elif selection == "otio_export":
              cases = [
                  ("desktop-otio-export", ["-p", "motionwright-service", "--test", "desktop_project_export", "project_export::tests::"], {
                      "project_export::tests::bundle_peer_revision_after_consumption_cannot_publish_a_later_snapshot",
                      "project_export::tests::otio_peer_revision_after_consumption_never_replaces_the_captured_project",
                      "project_export::tests::exact_bundle_command_exports_verified_project_journal_and_original_blob",
                      "project_export::tests::exact_otio_command_preserves_the_existing_response_and_document",
                      "project_export::tests::occupied_destinations_preserve_foreign_files_and_consume_only_the_original_grant",
                      "project_export::tests::changed_destination_subject_is_rejected_before_any_export",
                      "project_export::tests::failed_otio_write_never_exposes_or_retains_a_partial_destination",
                      "project_export::tests::failed_otio_finalization_never_exposes_or_retains_unconfirmed_bytes",
                      "project_export::tests::late_otio_competitor_is_preserved_and_staging_is_removed",
                  }),
              ]
              if len(cases) != 1 or len(cases[0][2]) != 9:
                  raise SystemExit("otio-export-selection-incomplete")
          if not cases:
              raise SystemExit("portability-selection-empty")
          receipt["selected_suites"] = [case[0] for case in cases]
          receipt["expected_invocations"] = sum(len(case[2]) for case in cases)
          for suite, selector, expected in cases:
              test_options = ["--nocapture"] if selection == "otio_export" else ["--test-threads=1"]
              command = ["cargo", "test", "--locked", *selector, "--", *test_options]
              result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              data = result.stdout
              output = data.decode("utf-8", errors="replace")
              print(output, end="", flush=True)
              (root / (suite + ".log")).write_bytes(data)
              observed = re.findall(r"^test (\S+) \.\.\. (\w+)\s*$", output, re.MULTILINE)
              summary = re.findall(
                  r"^test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out;",
                  output, re.MULTILINE,
              )
              passed = (
                  result.returncode == 0
                  and len(observed) == len(expected)
                  and dict(observed) == {name: "ok" for name in expected}
                  and len(summary) == 1
                  and summary[0][:5] == ("ok", str(len(expected)), "0", "0", "0")
              )
              receipt["results"].append({
                  "suite": suite, "command": command, "returncode": result.returncode,
                  "status": "PASS" if passed else "FAIL",
                  "expected_tests": sorted(expected), "observed_tests": observed,
                  "summary": summary, "log_sha256": hashlib.sha256(data).hexdigest(),
              })
          receipt["tracked_source_unchanged"] = (
              git("rev-parse", "HEAD") == actual
              and git("rev-parse", "HEAD^{tree}") == receipt["tree"]
              and not git("status", "--porcelain", "--untracked-files=no")
          )
          passed = receipt["tracked_source_unchanged"] and all(item["status"] == "PASS" for item in receipt["results"])
          receipt["status"] = "PASS" if passed else "FAIL"
          (root / "receipt.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          if receipt["status"] != "PASS":
              raise SystemExit("file-import-platform-tests-not-verified")
      - name: Retain source binding and selective test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: file-import-platform-${{ matrix.os }}-${{ github.sha }}
          path: verification/file-import-platforms
          if-no-files-found: error
      - name: Retain selected export G0 originals
        if: always() && github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'otio_export'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: otio-export-g0-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/project-portability-g0
          if-no-files-found: error

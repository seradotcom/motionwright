                      return "FAIL_OR_INCOMPLETE"
                  for result, (group, row) in zip(results, groups.items()):
                      expected = sorted(row["tests"])
                      unselected = sorted(set(report["complete_rosters"][row["binary"]]) - set(expected))
                      expected_auxiliary = [{"id": name, "role": "AUXILIARY_PROCESS_HARNESS_ENTRY",
                                             "independent_functional_success_credit": 0} for name in row["auxiliary_tests"]]
                      if (result.get("status") != "PASS_SELECTED_CASES" or result.get("binary") != row["binary"]
                              or type(result.get("command", {}).get("exit_code")) is not int
                              or result["command"]["exit_code"] != 0
                              or result.get("selected_tests") != expected
                              or dict(result.get("observed_tests", [])) != {name: "ok" for name in expected}
                              or len(result.get("observed_tests", [])) != len(expected)
                              or result.get("not_selected_tests") != unselected
                              or result.get("not_selected_status") != "NOT_SELECTED"
                              or type(result.get("not_selected_success_credit")) is not int
                              or result["not_selected_success_credit"] != 0
                              or type(result.get("selected_omissions")) is not int or result["selected_omissions"] != 0
                              or [tuple(parts) for parts in result.get("summary", [])] != [

          def cas_source_binding_mode(inputs):
              if type(inputs) is not dict:
                  raise ValueError("cas-inputs-not-object")
              scope = inputs.get("verification_scope")
              new_fields = ("candidate_source_manifest", "candidate_manifest_sha256")
              if scope == "cas_retention":
                  if any(inputs.get(key) not in (None, "") for key in new_fields):
                      raise ValueError("cas-legacy-binding-cannot-consume-candidate-manifest")
                  return "REVIEWED_DIRECT_CHILD_977"
              if scope in {"cas_candidate", "gc_proxy_candidate"}:
                  if inputs.get("product_source_sha") not in (None, ""):
                      raise ValueError("cas-candidate-binding-cannot-consume-legacy-product-pin")
                  if any(type(inputs.get(key)) is not str or not inputs[key] for key in new_fields):
                      raise ValueError("cas-candidate-manifest-and-pin-required")
                  return "REVIEWED_COMPOSED_CANDIDATE"
              raise ValueError("cas-source-binding-mode-unsupported")


          def candidate_source_manifest(raw, digest, actual, os_scope, profile):
              if type(profile) is not str or profile not in {"cas_candidate", "gc_proxy_candidate"}:
                  raise ValueError("candidate-manifest-profile-not-reviewed")
              schema = ("motionwright.gc-proxy-candidate-source-binding/1" if profile == "gc_proxy_candidate"
                        else "motionwright.cas-candidate-source-binding/1")
              import hashlib
              import json
              if (type(raw) is not str or not 0 < len(raw.encode("utf-8")) <= 65536
                      or type(digest) is not str or not re.fullmatch(r"[0-9a-f]{64}", digest)
                      or hashlib.sha256(raw.encode("utf-8")).hexdigest() != digest
                      or type(actual) is not str or not re.fullmatch(r"[0-9a-f]{40}", actual)):
                  raise ValueError("cas-candidate-original-manifest-bytes-or-source-pin")
              def pairs(items):
                  result = {}
                  for key, value in items:
                      if key in result:
                          raise ValueError("cas-candidate-duplicate-json-key")
                      result[key] = value
                  return result
              def forbidden_number(value):
                  raise ValueError("cas-candidate-float-or-nonfinite-json-number")
              value = json.loads(raw, object_pairs_hook=pairs, parse_float=forbidden_number,
                                 parse_constant=forbidden_number)
              fields = {"schema", "repository", "source_sha", "tree_sha", "source_binding", "platforms",
                        "closure", "locks", "verification_sources", "tool_policy", "rosters"}
              if (type(value) is not dict or set(value) != fields
                      or value["schema"] != schema
                      or value["repository"] != "seradotcom/motionwright"
                      or value["source_sha"] != actual
                      or type(value["tree_sha"]) is not str or not re.fullmatch(r"[0-9a-f]{40}", value["tree_sha"])
                      or value["source_binding"] != "ALL_TRACKED_REGULAR_GIT_BLOBS_AND_EXACT_EXECUTED_BYTES"):
                  raise ValueError("cas-candidate-manifest-schema-or-exact-source")
              platforms = value["platforms"]
              expected = cas_candidate_os_names(os_scope)
              if (type(platforms) is not list or not platforms or any(type(x) is not str for x in platforms)
                      or len(platforms) != len(set(platforms)) or set(platforms) != expected
                      or platforms != [name for name in ("Linux", "macOS", "Windows") if name in expected]):
                  raise ValueError("cas-candidate-explicit-platform-roster")
              closure = value["closure"]
              if (type(closure) is not dict or set(closure) != {
                      "algorithm", "git_tree_listing_sha256", "executed_file_metadata_sha256", "files", "bytes"}
                      or closure["algorithm"] != "sha256"
                      or any(type(closure[key]) is not str or not re.fullmatch(r"[0-9a-f]{64}", closure[key])
                             for key in ("git_tree_listing_sha256", "executed_file_metadata_sha256"))
                      or type(closure["files"]) is not int or not 0 < closure["files"] <= 100000
                      or type(closure["bytes"]) is not int or not 0 <= closure["bytes"] <= 2**63 - 1):
                  raise ValueError("cas-candidate-closed-source-metadata")
              required_maps = {
                  "locks": {"Cargo.lock", "SOURCE_LOCK.json", "rust-toolchain.toml", "apps/studio/package-lock.json"},
                  "verification_sources": {".github/workflows/project-portability.yml",
                      "tooling/tests/test_project_portability_contracts.py", "tooling/ci_foundation_causal.py",
                      "tooling/ci_storage_apply_recovery.py", "tooling/ci_test_runner.py"},
              }
              def pin(item):
                  return (type(item) is dict and set(item) == {"bytes", "sha256"}
                          and type(item["bytes"]) is int and item["bytes"] >= 0
                          and type(item["sha256"]) is str and re.fullmatch(r"[0-9a-f]{64}", item["sha256"]) is not None)
              for name, paths in required_maps.items():
                  if type(value[name]) is not dict or set(value[name]) != paths or not all(pin(x) for x in value[name].values()):
                      raise ValueError("cas-candidate-closed-pin-map:" + name)
              policy = value["tool_policy"]
              if (type(policy) is not dict or set(policy) != {"rust_toolchain", "host_triples", "preapproved_binary_pins"}
                      or policy["rust_toolchain"] != "1.98.1"
                      or type(policy["host_triples"]) is not dict or set(policy["host_triples"]) != expected
                      or type(policy["preapproved_binary_pins"]) is not dict
                      or not set(policy["preapproved_binary_pins"]) <= expected):
                  raise ValueError("cas-candidate-tool-policy")
              supported_hosts = {
                  "Linux": {"x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"},
                  "macOS": {"x86_64-apple-darwin", "aarch64-apple-darwin"},
                  "Windows": {"x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"},
              }
              for platform in platforms:
                  host = policy["host_triples"][platform]
                  if type(host) is not str or host not in supported_hosts[platform]:
                      raise ValueError("cas-candidate-tool-host-not-reviewed-for-platform")
                  if platform in policy["preapproved_binary_pins"]:
                      pins = policy["preapproved_binary_pins"][platform]
                      if type(pins) is not dict or set(pins) != {"cargo", "rustc"} or not all(pin(p) and p["bytes"] > 0 for p in pins.values()):
                          raise ValueError("cas-candidate-preapproved-physical-tool-pins")
              rosters = value["rosters"]
              if type(rosters) is not dict or set(rosters) != expected:
                  raise ValueError("cas-candidate-platform-rosters")
              for platform in platforms:
                  expected_rows = (gc_proxy_expected_rosters(platform) if profile == "gc_proxy_candidate" else
                                   {"cas-process": sorted(cas_retention_cases(platform)),
                                    "schema-atomicity": sorted(schema_atomicity_cases())})
                  if rosters[platform] != expected_rows:
                      raise ValueError("cas-candidate-input-cannot-reduce-or-substitute-rosters")
              return value


          def cas_candidate_manifest(raw, digest, actual, os_scope):
              return candidate_source_manifest(raw, digest, actual, os_scope, "cas_candidate")


          def cas_candidate_tree_entries(raw):
              if type(raw) is not bytes or not raw or not raw.endswith(b"\0") or len(raw) > 16 * 1024 * 1024:
                  raise ValueError("cas-candidate-full-tree-original-required")
              rows, folded = {}, set()
              for entry in raw[:-1].split(b"\0"):
                  parts = entry.split(b"\t")
                  if len(parts) != 2:
                      raise ValueError("cas-candidate-tree-entry-shape")
                  metadata, name = parts
                  try:
                      mode, kind, oid = metadata.decode("ascii", "strict").split(" ")
                      path = name.decode("utf-8", "strict")
                  except (ValueError, UnicodeError) as error:
                      raise ValueError("cas-candidate-tree-entry-encoding") from error
                  if (mode not in {"100644", "100755"} or kind != "blob" or not re.fullmatch(r"[0-9a-f]{40}", oid)
                          or not path or path.startswith("/") or any(part in ("", ".", "..", ".git") for part in path.split("/"))
                          or any(char in path for char in ("\\", ":")) or any(ord(char) < 32 for char in path)
                          or path in rows or path.casefold() in folded):
                      raise ValueError("cas-candidate-linked-nonregular-or-duplicate-path")
                  rows[path] = {"mode": mode, "git_blob_oid": oid}
                  folded.add(path.casefold())
              if not rows or len(rows) > 100000:
                  raise ValueError("cas-candidate-full-tree-roster-bound")
              return rows


          def cas_candidate_source_projection(snapshot, raw_tree):
              import hashlib
              import json
              entries = cas_candidate_tree_entries(raw_tree)
              files = snapshot.get("files") if type(snapshot) is dict else None
              if type(files) is not dict or set(files) != set(entries):
                  raise ValueError("cas-candidate-all-tracked-physical-files-required")
              physical = []
              for path in sorted(entries):
                  row = files[path]
                  if (type(row) is not dict or row.get("path") != path
                          or type(row.get("bytes")) is not int or row["bytes"] < 0
                          or type(row.get("sha256")) is not str or not re.fullmatch(r"[0-9a-f]{64}", row["sha256"])
                          or row.get("git_blob_oid") != entries[path]["git_blob_oid"]):
                      raise ValueError("cas-candidate-executed-byte-and-git-object-identities-differ")
                  physical.append({"path": path, "bytes": row["bytes"], "sha256": row["sha256"],
                                   "git_blob_oid": entries[path]["git_blob_oid"]})
              canonical = json.dumps(physical, sort_keys=True, separators=(",", ":"), ensure_ascii=False, allow_nan=False).encode("utf-8")
              return {"algorithm": "sha256", "git_tree_listing_sha256": hashlib.sha256(raw_tree).hexdigest(),
                      "executed_file_metadata_sha256": hashlib.sha256(canonical).hexdigest(),
                      "files": len(physical), "bytes": sum(row["bytes"] for row in physical)}


          def cas_candidate_source_binding(manifest, snapshot, raw_tree):
              if (snapshot.get("sha") != manifest["source_sha"] or snapshot.get("tree") != manifest["tree_sha"]
                      or cas_candidate_source_projection(snapshot, raw_tree) != manifest["closure"]):
                  raise ValueError("cas-candidate-source-sha-tree-or-byte-closure-mismatch")
              for category in ("locks", "verification_sources"):
                  for path, expected in manifest[category].items():
                      observed = snapshot["files"].get(path)
                      if observed is None or {key: observed.get(key) for key in ("bytes", "sha256")} != expected:
                          raise ValueError("cas-candidate-reviewed-input-pin-mismatch:" + path)
              return {"mode": "REVIEWED_COMPOSED_CANDIDATE", "source_sha": manifest["source_sha"],
                      "tree_sha": manifest["tree_sha"], "closure": manifest["closure"],
                      "manifest_is_authority": False, "historical_pass_credit": 0}


          def cas_candidate_runtime(manifest, inputs, environment, actual_platform):
              expected = cas_candidate_os_names(inputs.get("os_scope"))
              schema = {"cas_candidate": "motionwright.cas-candidate-source-binding/1",
                        "gc_proxy_candidate": "motionwright.gc-proxy-candidate-source-binding/1"}.get(inputs.get("verification_scope"))
              if (manifest.get("schema") != schema
                      or cas_source_binding_mode(inputs) != "REVIEWED_COMPOSED_CANDIDATE"
                      or environment.get("GITHUB_ACTIONS") != "true"
                      or environment.get("GITHUB_EVENT_NAME") != "workflow_dispatch"
                      or environment.get("GITHUB_REPOSITORY") != "seradotcom/motionwright"
                      or environment.get("GITHUB_SHA") != manifest["source_sha"]
                      or environment.get("MW_CAS_WORKFLOW_SHA") != manifest["source_sha"]
                      or environment.get("GITHUB_JOB") != "file-import-platforms"
                      or environment.get("GITHUB_RUN_ATTEMPT") != "1"
                      or type(environment.get("GITHUB_RUN_ID")) is not str
                      or not re.fullmatch(r"[1-9][0-9]*", environment["GITHUB_RUN_ID"])
                      or type(environment.get("GITHUB_WORKFLOW_REF")) is not str
                      or not environment["GITHUB_WORKFLOW_REF"].startswith(
                          "seradotcom/motionwright/.github/workflows/project-portability.yml@")
                      or type(actual_platform) is not str or actual_platform not in expected or environment.get("RUNNER_OS") != actual_platform
                      or set(manifest["platforms"]) != expected):
                  raise ValueError("cas-candidate-exact-first-run-workflow-platform-binding")
              return {"workflow_source_sha": environment["MW_CAS_WORKFLOW_SHA"],
                      "run_id": environment["GITHUB_RUN_ID"], "run_attempt": environment["GITHUB_RUN_ATTEMPT"],
                      "job": environment["GITHUB_JOB"], "runner_os": actual_platform,
                      "selected_platforms": manifest["platforms"], "other_platform_execution_credit": 0}


          def cas_candidate_tool_binding(manifest, actual_platform, tools):
              if (type(actual_platform) is not str or actual_platform not in manifest["platforms"]
                      or type(tools) is not dict or set(tools) != {"cargo", "rustc"}):
                  raise ValueError("cas-candidate-observed-tool-roster")
              for tool in tools.values():
                  if (type(tool) is not dict or type(tool.get("bytes")) is not int or tool["bytes"] <= 0
                          or type(tool.get("sha256")) is not str or not re.fullmatch(r"[0-9a-f]{64}", tool["sha256"])
                          or type(tool.get("version")) is not str or not 0 < len(tool["version"]) <= 8192):
                      raise ValueError("cas-candidate-observed-physical-tool-identity")
              policy = manifest["tool_policy"]
              cargo_lines = tools["cargo"]["version"].splitlines()
              rustc_lines = tools["rustc"]["version"].splitlines()
              if (len(cargo_lines) != 1 or not re.fullmatch(r"cargo 1\.98\.1(?: \([^()\r\n]+\))?", cargo_lines[0])
                      or not rustc_lines or not re.fullmatch(r"rustc 1\.98\.1(?: \([^()\r\n]+\))?", rustc_lines[0])
                      or [line for line in rustc_lines if line.startswith("release:")] != ["release: 1.98.1"]
                      or [line for line in rustc_lines if line.startswith("host:")] != ["host: " + policy["host_triples"][actual_platform]]):
                  raise ValueError("cas-candidate-tool-release-or-host-policy-mismatch")
              observed = {name: {key: row[key] for key in ("bytes", "sha256")} for name, row in tools.items()}
              pins = policy["preapproved_binary_pins"].get(actual_platform)
              if pins is not None and pins != observed:
                  raise ValueError("cas-candidate-preapproved-tool-binary-pin-mismatch")
              return {"rust_toolchain": "1.98.1", "host_triple": policy["host_triples"][actual_platform],
                      "observed_physical_binary_identities": observed, "preapproved_binary_pins_supplied": pins is not None,
                      "preapproved_binary_pins": pins, "postcheck_required": "EXISTING_PHYSICAL_IDENTITY_CHECKS_UNCHANGED"}


          def cas_candidate_build_environment(environment, manifest, actual_platform, tools):
              from pathlib import Path
              cas_candidate_tool_binding(manifest, actual_platform, tools)
              for name in ("cargo", "rustc"):
                  path = tools[name].get("absolute_path")
                  if type(path) is not str or not Path(path).is_absolute():
                      raise ValueError("cas-candidate-observed-tool-path-not-absolute")
              required = {
                  "CARGO": tools["cargo"]["absolute_path"],
                  "RUSTC": tools["rustc"]["absolute_path"],
                  "CARGO_BUILD_RUSTC": tools["rustc"]["absolute_path"],
                  "CARGO_BUILD_TARGET": manifest["tool_policy"]["host_triples"][actual_platform],
                  "RUSTC_WRAPPER": "", "RUSTC_WORKSPACE_WRAPPER": "",
                  "CARGO_BUILD_RUSTC_WRAPPER": "", "CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER": "",
              }
              for key, value in required.items():
                  if key in environment and environment[key] != value:
                      raise ValueError("cas-candidate-unreviewed-inherited-build-tool:" + key)
              return {**environment, **required}



        uses: actions/upload-artifact@v4
        with:
          name: file-import-platform-${{ matrix.os }}-${{ github.sha }}
          path: verification/file-import-platforms
          if-no-files-found: error
      - name: Retain selected export G0 originals
        if: always() && github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'otio_export'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: otio-export-g0-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/project-portability-g0
          if-no-files-found: error

      - name: Retain complete CAS source, binary and command originals
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.verification_scope == 'cas_retention' || inputs.verification_scope == 'cas_candidate' || inputs.verification_scope == 'gc_proxy_candidate')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cas-retention-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cas-retention-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json
            ${{ runner.temp }}/cas-retention-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}/originals/
            ${{ runner.temp }}/cas-retention-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}/sources/
            ${{ runner.temp }}/cas-retention-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}/binaries/
          if-no-files-found: error
          retention-days: 14

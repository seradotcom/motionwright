name: Project Portability

on:
  push:
    branches: ["main", "feat/**"]
    paths:
      - "crates/domain/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/storage/**"
      - "crates/service/**"
      - "docs/architecture.md"
      - "docs/testing.md"
      - ".github/workflows/project-portability.yml"
      - "tooling/tests/test_project_portability_contracts.py"
      - "tooling/ci_test_runner.py"
      - "tooling/tests/test_ci_test_runner.py"
      - "tooling/ci_foundation_causal.py"
      - "tooling/ci_storage_apply_recovery.py"
      - "tooling/*policy.py"
      - ".gitattributes"
  pull_request:
    paths:
      - "crates/domain/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/storage/**"
      - "crates/service/**"
      - "docs/architecture.md"
      - "docs/testing.md"
      - ".github/workflows/project-portability.yml"
      - "tooling/tests/test_project_portability_contracts.py"
      - "tooling/ci_test_runner.py"
      - "tooling/tests/test_ci_test_runner.py"
      - "tooling/ci_foundation_causal.py"
      - "tooling/ci_storage_apply_recovery.py"
      - "tooling/*policy.py"
      - ".gitattributes"
  workflow_dispatch:
    inputs:
      verification_scope:
        description: Select portability, cache publication, desktop OTIO export, or bounded projection contracts
        required: true
        default: full
        type: choice
        options: [full, derived_cache, otio_export, project_projection, cas_retention, cas_candidate, gc_proxy_candidate]
      os_scope:
        description: Explicit CAS operating systems; all is valid only for reviewed candidate source profiles
        required: true
        type: choice
        options: [windows, macos, both, linux, all]
        default: both
      product_source_sha:
        description: Reviewed product commit for project_projection or legacy cas_retention; empty for composed candidate profiles
        required: false
        type: string
      candidate_source_manifest:
        description: Exact reviewed candidate source-binding JSON; never authority or a prior test result
        required: false
        type: string
        default: ""
      candidate_manifest_sha256:
        description: SHA-256 of the exact UTF-8 manifest input bytes; required for composed candidate profiles
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  g0-source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Reject mixed CAS source bindings before selecting native jobs
        if: github.event_name == 'workflow_dispatch' && (inputs.verification_scope == 'cas_retention' || inputs.verification_scope == 'cas_candidate' || inputs.verification_scope == 'gc_proxy_candidate')
        shell: python
        run: |
          import ast, json, os, re, textwrap
          from pathlib import Path

          text = Path(".github/workflows/project-portability.yml").read_text(encoding="utf-8")
          start = text.index("          import hashlib, json, os, re, subprocess, sys, time\n")
          end = text.index("      - name: Retain source binding and selective test evidence", start)
          parsed = ast.parse(textwrap.dedent(text[start:end]))
          required = {"cas_source_binding_mode", "cas_candidate_manifest", "cas_candidate_os_names",
                      "cas_os_names", "schema_atomicity_cases", "cas_retention_cases", "candidate_source_manifest",
                      "gc_proxy_candidate_manifest", "gc_proxy_groups", "gc_proxy_expected_rosters"}
          functions = [node for node in parsed.body if isinstance(node, ast.FunctionDef) and node.name in required]
          if {node.name for node in functions} != required or len(functions) != len(required):
              raise ValueError("cas-dispatch-preflight-functions-missing-or-duplicated")
          namespace = {"re": re}
          exec(compile(ast.Module(body=functions, type_ignores=[]), "cas-source-input-contracts", "exec"), namespace)
          folder = Path(os.environ["RUNNER_TEMP"]) / "portability-g0"
          folder.mkdir(exist_ok=True)
          event_raw = Path(os.environ["GITHUB_EVENT_PATH"]).read_bytes()
          with (folder / "cas-input-event.original.json").open("xb") as original:
              original.write(event_raw)
          inputs = json.loads(event_raw).get("inputs") or {}
          mode = namespace["cas_source_binding_mode"](inputs)
          if mode == "REVIEWED_DIRECT_CHILD_977":
              namespace["cas_os_names"](inputs.get("os_scope"))
          else:
              validator = namespace["gc_proxy_candidate_manifest" if inputs.get("verification_scope") == "gc_proxy_candidate"
                                    else "cas_candidate_manifest"]
              validator(inputs["candidate_source_manifest"],
                  inputs["candidate_manifest_sha256"], os.environ["GITHUB_SHA"], inputs.get("os_scope"))
          with (folder / "cas-input-preflight.json").open("x", encoding="utf-8", newline="\n") as output:
              json.dump({"schema": "motionwright.cas-input-preflight/1", "status": "VALIDATED_INPUT_ONLY",
                  "source_sha": os.environ["GITHUB_SHA"], "binding_mode": mode,
                  "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "job": os.environ["GITHUB_JOB"],
                  "product_execution": "NOT_RUN", "manifest_is_authority": False}, output, sort_keys=True)
              output.write("\n")
      - name: Enforce G0 policies and closed portability selectors
        shell: bash
        run: |
          set -euo pipefail
          python -B tooling/source_policy.py
          python -B tooling/acceptance_policy.py
          python -B tooling/creative_status_policy.py
          python -B tooling/public_surface_policy.py
          python -B tooling/ci_test_runner.py --repo "$GITHUB_WORKSPACE" \
            --expected-source "$GITHUB_SHA" --test-directory tooling/tests \
            --pattern test_project_portability_contracts.py \
            --mode both --require-complete --timeout 180 \
            --report "$RUNNER_TEMP/portability-g0/receipt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: portability-G0-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/portability-g0/
          if-no-files-found: error
          retention-days: 14

  storage-contracts:
    needs: g0-source-controls
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.verification_scope != 'derived_cache' && inputs.verification_scope != 'otio_export' && inputs.verification_scope != 'project_projection' && inputs.verification_scope != 'cas_retention' && inputs.verification_scope != 'cas_candidate' && inputs.verification_scope != 'gc_proxy_candidate') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Storage and service tests
        run: cargo test --locked -p motionwright-storage -p motionwright-service --all-targets
      - name: Storage and service clippy
        run: cargo clippy --locked -p motionwright-storage -p motionwright-service --all-targets -- -D warnings

  file-import-platforms:
    needs: g0-source-controls
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'project_projection' && 'Bounded project projection' || 'File import authority and CAS' }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'gc_proxy_candidate' && 105 || github.event_name == 'workflow_dispatch' && (inputs.verification_scope == 'cas_retention' || inputs.verification_scope == 'cas_candidate' || inputs.verification_scope == 'gc_proxy_candidate') && 60 || 45 }}
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'otio_export' && 1 || 3 }}
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (inputs.verification_scope == 'cas_candidate' || inputs.verification_scope == 'gc_proxy_candidate') && (inputs.os_scope == 'windows' && '["windows-latest"]' || inputs.os_scope == 'macos' && '["macos-latest"]' || inputs.os_scope == 'both' && '["macos-latest","windows-latest"]' || inputs.os_scope == 'linux' && '["ubuntu-latest"]' || inputs.os_scope == 'all' && '["ubuntu-latest","macos-latest","windows-latest"]' || '[]') || github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'cas_retention' && (inputs.os_scope == 'windows' && '["windows-latest"]' || inputs.os_scope == 'macos' && '["macos-latest"]' || inputs.os_scope == 'both' && '["macos-latest","windows-latest"]' || inputs.os_scope == 'linux' && '["ubuntu-latest"]' || '[]') || github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'project_projection' && '["ubuntu-latest"]' || github.event_name == 'workflow_dispatch' && (inputs.verification_scope == 'derived_cache' || inputs.verification_scope == 'otio_export') && '["macos-latest","windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    env:
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: '1'
      MW_CAS_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Prepare byte-exact source for Windows CAS
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'cas_retention'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @('GIT_CONFIG_COUNT=1', 'GIT_CONFIG_KEY_0=core.autocrlf', 'GIT_CONFIG_VALUE_0=false') |
            Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
      - name: Prepare byte-exact source for Windows CAS candidate
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && (inputs.verification_scope == 'cas_candidate' || inputs.verification_scope == 'gc_proxy_candidate')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @('GIT_CONFIG_COUNT=1', 'GIT_CONFIG_KEY_0=core.autocrlf', 'GIT_CONFIG_VALUE_0=false') |
            Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && (inputs.verification_scope == 'project_projection' || inputs.verification_scope == 'cas_retention') && 2 || 1 }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'project_projection' && 'rustfmt, clippy' || 'rustfmt' }}
      - uses: Swatinem/rust-cache@v2
        if: github.event_name != 'workflow_dispatch' || (inputs.verification_scope != 'cas_retention' && inputs.verification_scope != 'cas_candidate' && inputs.verification_scope != 'gc_proxy_candidate')
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install selected desktop compilation dependencies
        if: github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'project_projection'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Always verify selected export source and fast contracts
        if: github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'otio_export'
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path

          for policy in ("source_policy", "acceptance_policy", "creative_status_policy", "public_surface_policy"):
              subprocess.run([sys.executable, "-B", "tooling/" + policy + ".py"], check=True)
          subprocess.run(["cargo", "fmt", "--all", "--", "--check"], check=True)
          report = Path(os.environ["RUNNER_TEMP"]) / "project-portability-g0" / "receipt.json"
          subprocess.run([
              sys.executable, "-B", "tooling/ci_test_runner.py", "--repo", ".",
              "--mode", "both", "--pattern", "test_ci_test_runner.py",
              "--expected-source", os.environ["GITHUB_SHA"], "--report", str(report),
              "--require-complete",
          ], check=True)
      - name: Verify exact checkout and selective file import contracts
        shell: python
        run: |
          import hashlib, json, os, re, subprocess, sys, time
          from pathlib import Path

          WORKFLOW_PATH = ".github/workflows/project-portability.yml"
          PROJECTION_PRODUCT = "f4e7f4930940ce48b243f67dee13556172b1de89"
          PROJECTION_PRODUCT_TREE = "6737ed76dfba064001ce409c5901a243ca3dda86"
          PROJECTION_PRODUCT_PATHS = (
              "crates/domain/src/lib.rs",
              "crates/service/src/lib.rs",
              "crates/service/src/project_projection.rs",
              "crates/service/tests/project_projection.rs",
              "crates/storage/src/lib.rs",
              "crates/storage/src/project_projection.rs",
              "docs/reliability/project-projection-paging.md",
              "apps/desktop/src-tauri/src/main.rs",
              "apps/desktop/src-tauri/src/project_projection.rs",
              "crates/service/tests/desktop_project_projection.rs",
          )
          PROJECTION_DEPENDENCIES = (
              "Cargo.toml", "Cargo.lock", "SOURCE_LOCK.json", "rust-toolchain.toml",
              "crates/domain/Cargo.toml", "crates/storage/Cargo.toml",
              "crates/service/Cargo.toml", "apps/desktop/src-tauri/Cargo.toml",
              "tooling/ci_test_runner.py", "tooling/tests/test_ci_test_runner.py",
          )

          def git(*args):
              return subprocess.check_output(["git", *args], encoding="utf-8", errors="replace").strip()

          def source_snapshot(source, paths, product=None):
              captured = {}
              for source_path in paths:
                  git_bytes = subprocess.check_output(["git", "show", source + ":" + source_path])
                  checkout_bytes = Path(source_path).read_bytes()
                  exact_checkout = checkout_bytes == git_bytes
                  checkout_crlf = b"\r\n" not in git_bytes and checkout_bytes == git_bytes.replace(b"\n", b"\r\n")
                  if not exact_checkout and not checkout_crlf:
                      raise RuntimeError("portability-source-bytes-mismatch:" + source_path)
                  captured[source_path] = {
                      "git_blob_oid": git("rev-parse", source + ":" + source_path),
                      "git_sha256": hashlib.sha256(git_bytes).hexdigest(), "git_bytes": len(git_bytes),
                      "checkout_sha256": hashlib.sha256(checkout_bytes).hexdigest(), "checkout_bytes": len(checkout_bytes),
                      "bytes_equal": exact_checkout, "equal_after_exact_lf_to_crlf": checkout_crlf,
                  }
                  if product and source_path != WORKFLOW_PATH:
                      product_bytes = subprocess.check_output(["git", "show", product + ":" + source_path])
                      if product_bytes != git_bytes:
                          raise RuntimeError("projection-product-bytes-mismatch:" + source_path)
                      captured[source_path]["product_git_blob_oid"] = git("rev-parse", product + ":" + source_path)
                      captured[source_path]["product_sha256"] = hashlib.sha256(product_bytes).hexdigest()
              return captured

          def storage_import_cases(runner_os):
              if runner_os not in {"Linux", "macOS", "Windows"}:
                  raise ValueError("unsupported-file-import-platform")
              cases = {
                  'file_import::source_budget_tests::bounded_replay_hash_accepts_exact_budget_and_rejects_initial_excess',
                  'file_import::source_budget_tests::bounded_replay_hash_includes_growth_to_exact_budget',
                  'file_import::source_budget_tests::bounded_replay_hash_rejects_growth_after_first_read',
                  'file_import::source_budget_tests::staging_captures_growth_to_exact_budget_then_removes_its_private_file',
                  'file_import::source_budget_tests::staging_rejects_growth_without_touching_sql_cas_or_another_capture',
                  'file_import::source_open_tests::oversized_opened_source_is_rejected_before_staging',
                  'file_import::source_open_tests::regular_source_capture_preserves_exact_bytes_and_sql',
                  'file_import::source_open_tests::replaced_directory_source_is_rejected_before_staging',
                  'file_import::source_open_tests::replaced_fifo_source_is_rejected_without_waiting_for_a_writer',
                  'file_import::source_open_tests::replaced_symlink_source_is_rejected_before_staging',
                  'file_import::source_open_tests::replay_source_hash_preserves_bytes_without_staging_or_database',
                  'file_import::source_open_tests::replay_source_hash_rejects_replaced_symlink_without_creating_outputs',
                  'file_import::staging_tests::dropping_duplicate_stages_and_rejecting_stale_import_preserve_blob',
                  'file_import::staging_tests::staged_import_rejects_changed_capture_without_publishing_or_leaking_stage',
                  'file_import::tests::absent_receipt_requires_current_revision_only_when_requested',
                  'file_import::tests::changed_purpose_or_metadata_rejects_request_reuse_without_effects',
                  'file_import::tests::corrupt_receipt_hash_event_or_result_is_never_treated_as_absent',
                  'file_import::tests::original_import_remains_readable_without_sources_after_edit_and_reopen',
              }
              if runner_os == "Windows":
                  cases.remove("file_import::source_open_tests::replaced_fifo_source_is_rejected_without_waiting_for_a_writer")
              return cases

          def portability_test_options(selection, suite, runner_os):
              options = ["--nocapture"] if selection == "otio_export" else ["--test-threads=1"]
              # Hosted Windows must actually execute both privileged symlink
              # cases; an ignored result never satisfies the closed roster.
              if suite == "storage" and runner_os == "Windows":
                  options.append("--include-ignored")
              return options

          def verify_test_output(returncode, output, expected):
              observed = re.findall(r"^test (\S+) \.\.\. (\w+)\s*$", output, re.MULTILINE)
              summary = re.findall(
                  r"^test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out;",
                  output, re.MULTILINE,
              )
              passed = (
                  type(returncode) is int and returncode == 0
                  and len(observed) == len(expected)
                  and dict(observed) == {name: "ok" for name in expected}
                  and len(summary) == 1
                  and summary[0][:5] == ("ok", str(len(expected)), "0", "0", "0")
              )
              return passed, observed, summary

          def checkpoint():
              (root / "receipt.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          def run_logged(stage, expected=None):
              stage["status"] = "RUNNING"
              checkpoint()
              started = time.monotonic()
              data = b""
              try:
                  result = subprocess.run(stage["command"], stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  data = result.stdout
                  output = data.decode("utf-8", errors="replace")
                  print(output, end="", flush=True)
                  stage["returncode"] = result.returncode
                  if expected is None:
                      stage["status"] = "PASS" if result.returncode == 0 else "FAIL"
                  else:
                      passed, observed, summary = verify_test_output(result.returncode, output, expected)
                      stage.update({
                          "status": "PASS" if passed else "FAIL",
                          "observed_tests": observed, "summary": summary,
                          "filtered_out": int(summary[0][5]) if len(summary) == 1 else None,
                      })
              except Exception as exc:
                  stage["status"] = "FAIL"
                  stage["error"] = {"type": type(exc).__name__, "message": str(exc)}
                  raise
              finally:
                  stage["elapsed_seconds"] = time.monotonic() - started
                  stage["log"] = stage["suite"] + ".log"
                  (root / stage["log"]).write_bytes(data)
                  stage["log_sha256"] = hashlib.sha256(data).hexdigest()
                  checkpoint()

          def schema_atomicity_cases():
              return {
                  "failed_schema_upgrade_never_publishes_partial_new_tables_or_version",
                  "valid_fresh_open_and_reopen_keep_exact_schema_and_no_extra_objects",
                  "too_new_version_fails_without_rewriting_original_schema",
                  "production_order_allocation_failure_cannot_publish_a_partial_append_or_claim",
                  "production_order_backfill_failure_rolls_back_ddl_rows_and_sequence_counter",
                  "production_order_concurrent_migrations_publish_one_mapping_per_receipt",
                  "production_order_extension_trigger_failure_rolls_back_every_receipt_effect",
                  "production_order_migration_preserves_receipts_extension_foreign_keys_and_audit_triggers",
                  "production_order_missing_mapping_is_never_silently_backfilled_or_hidden",
                  "production_order_project_mismatch_is_rejected_from_both_scopes",
                  "production_order_reserved_object_collisions_are_rejected_without_adoption",
                  "cas_v4_upgrade_preserves_project_receipts_and_sequence_values",
                  "import_marker_removed_by_late_trigger_rolls_back_project_and_events",
                  "committed_import_marker_survives_project_deletion_with_foreign_keys_enabled",
              }


          def cas_retention_cases(runner_os):
              if runner_os not in {"Linux", "macOS", "Windows"}:
                  raise ValueError("cas-retention-platform")
              names = {
                  "real_live_bundle_writer_survives_peer_cas_recovery",
                  "real_precommit_exit_retains_then_reclaims_only_owned_orphan",
                  "real_peer_database_adoption_protects_shared_digest",
                  "real_gc_exit_after_unlink_cannot_delete_republished_digest",
                  "real_hundred_crash_recover_cycles_do_not_accumulate_cas_or_staging_media",
                  "real_replaced_live_intent_lock_keeps_unknown_and_preserves_foreign_lock",
                  "real_unix_fifo_control_entries_reject_without_blocking",
                  "real_budget_one_reopens_reclaim_orphan_behind_live_capture",
              }
              if runner_os == "Windows":
                  names.remove("real_unix_fifo_control_entries_reject_without_blocking")
              return {"cas_retention_process_tests::" + name for name in names}


          def cas_os_names(selection):
              choices = {"windows": {"Windows"}, "macos": {"macOS"},
                         "both": {"Windows", "macOS"}, "linux": {"Linux"}}
              if selection not in choices:
                  raise ValueError("cas-retention-os-selection")
              return choices[selection]


          def complete_cas_roster(code, text):
              if type(code) is not int or code != 0:
                  raise ValueError("cas-roster-process-failed")
              text = text.replace("\r\n", "\n")
              names = re.findall(r"(?m)^([A-Za-z_][A-Za-z_0-9:]*): test$", text)
              footer = re.findall(r"(?m)^(\d+) tests?, 0 benchmarks?\s*$", text)
              remainder = re.sub(r"(?m)^[A-Za-z_][A-Za-z_0-9:]*: test\n?", "", text)
              remainder = re.sub(r"(?m)^\d+ tests?, 0 benchmarks?\s*$", "", remainder)
              if (not names or len(names) != len(set(names))
                      or footer != [str(len(names))] or remainder.strip()):
                  raise ValueError("cas-complete-roster-required")
              return tuple(names)


          def admit_cas_cases(code, text, expected, complete):
              if len(complete) != len(set(complete)) or not expected <= set(complete):
                  raise ValueError("cas-selection-not-in-complete-roster")
              passed, observed, summary = verify_test_output(code, text, expected)
              not_selected = sorted(set(complete) - expected)
              if (type(code) is not int or not passed
                      or int(summary[0][5]) != len(not_selected)):
                  raise ValueError("cas-selected-result-or-filter-count")
              return {
                  "status": "PASS_SELECTED_CASES", "selected_tests": sorted(expected),
                  "observed_tests": observed, "summary": summary,
                  "not_selected_tests": not_selected, "not_selected_status": "NOT_SELECTED",
                  "not_selected_success_credit": 0, "selected_omissions": 0,
              }


          def review_cas_rosters(rosters, expected_process):
              selected = {name for name in rosters["cas-process"]
                          if name.startswith("cas_retention_process_tests::")}
              if (selected != expected_process
                      or set(rosters["schema-atomicity"]) != schema_atomicity_cases()):
                  raise ValueError("cas-missing-or-extra-reviewed-cases")


          def cas_dependency_paths(tracked):
              required = {
                  ".gitattributes", "Cargo.toml", "Cargo.lock", "SOURCE_LOCK.json",

                                     for item in result.get("auxiliary_tests", []))
                              or result.get("auxiliary_tests") != expected_auxiliary):
                          return "FAIL_OR_INCOMPLETE"
                  return "PASS_SELECTED_SOURCE_G2"
              except (KeyError, TypeError, ValueError):
                  return "FAIL_OR_INCOMPLETE"



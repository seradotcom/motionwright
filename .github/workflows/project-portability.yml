                      if not report.get("failure")
                      and report.get("source_postcheck") == "VERIFIED_UNCHANGED"
                      and report.get("binary_and_tool_postcheck") == "VERIFIED_UNCHANGED"
                      and len(results) == 2
                      and {row["suite"] for row in results} == {"cas-process", "schema-atomicity"}
                      and all(row["status"] == "PASS_SELECTED_CASES" for row in results)
                      else "FAIL_OR_INCOMPLETE")


          def cas_source_postcheck(report, before, snapshot, unknown_types):
              if report.get("status") == "UNKNOWN_NO_RETRY":
                  report["source_postcheck"] = "NOT_OBSERVED_AFTER_UNKNOWN"
                  return
              try:
                  report["source_after"] = snapshot()
                  if report["source_after"] != before:
                      raise ValueError("cas-source-changed-after-execution")
                  report["source_postcheck"] = "VERIFIED_UNCHANGED"
              except unknown_types as error:
                  report.update(status="UNKNOWN_NO_RETRY", uncertain_command=error.command,
                                source_postcheck="NOT_OBSERVED_AFTER_UNKNOWN",
                                failure={"type": type(error).__name__, "message": str(error)})
              except Exception as error:
                  report["source_postcheck"] = "REJECTED"
                  report["source_postcheck_error"] = {"type": type(error).__name__, "message": str(error)}



                      binary_name, expected = group["binary"], set(group["tests"])
                      argv = [binaries[binary_name]["absolute_path"]]
                      if group["filter"] is not None:
                          argv.append(group["filter"])
                      argv += ["--test-threads=1", "--show-output"]
                      row, raw = command(name + "-selected-cases", argv, group["timeout_seconds"])
                      stderr = observer.original_stream(logs, row, "stderr")
                      result = admit_cas_cases(row["exit_code"], (raw + b"\n" + stderr).decode(), expected, rosters[binary_name])

name: V05 source-bound generation accounting

on:
  pull_request:
    paths:
      - 'crates/domain/src/paid_generation.rs'
      - 'crates/domain/tests/paid_generation_ledger.rs'
      - 'crates/domain/src/lib.rs'
      - 'crates/native/src/lib.rs'
      - 'crates/native/src/generation_journal_tests.rs'
      - 'crates/service/tests/paid_generation_persistence.rs'
      - 'apps/desktop/src-tauri/src/generation_journal.rs'
      - 'apps/studio/src/PaidGenerationWorkspace.tsx'
      - 'apps/studio/src/generationJournalApi*'
      - 'apps/studio/tests/generation-journal.spec.ts'
      - 'docs/creative-production/V05_GENERATION_ACCOUNTING.md'
      - '.github/workflows/v05-generation-budget.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v05-generation-budget-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-domain:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - run: python3 tooling/source_policy.py && python3 tooling/creative_status_policy.py
      - run: cargo fmt --all -- --check
      - name: Verify source-owned generation journal, SQLite and SDK contracts
        run: |
          cargo test -p motionwright-domain --test paid_generation_ledger
          cargo test -p motionwright-service --test paid_generation_persistence
          cargo test -p motionwright-native --lib generation_journal_tests
      - run: cargo clippy -p motionwright-domain -p motionwright-service -p motionwright-native --all-targets -- -D warnings

  editor-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run src/generationJournalApi.test.ts src/paidGenerationBrowser.test.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/generation-journal.spec.ts --project=chromium

[workspace]
resolver = "2"
members = [
  "crates/domain",
  "crates/storage",
  "crates/service",
  "crates/manim-profile",
  "crates/driver-manim-community",
  "crates/hyperframes-profile",
  "crates/driver-hyperframes",
  "crates/native",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
license-file = "LICENSE"
repository = "https://github.com/seradotcom/motionwright"

[workspace.dependencies]
schemars = { version = "1", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
tempfile = "3.23"
parking_lot = "0.12"
async-trait = "0.1"
symphonia = { version = "0.6.1", features = ["all"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync"] }
semwright-audio-domain = { git = "https://github.com/seradotcom/semwright", rev = "e64a2d28d1d866c539a2c40824cbb57f86a13c10", package = "semwright-audio-domain" }
semwright-video-domain = { git = "https://github.com/seradotcom/semwright", rev = "e64a2d28d1d866c539a2c40824cbb57f86a13c10", package = "semwright-video-domain" }
semwright-native-sdk = { git = "https://github.com/seradotcom/semwright", rev = "e64a2d28d1d866c539a2c40824cbb57f86a13c10", package = "semwright-native-sdk" }
semwright-platform-api = { git = "https://github.com/seradotcom/semwright", rev = "e64a2d28d1d866c539a2c40824cbb57f86a13c10", package = "semwright-platform-api" }
semwright-platform-services = { git = "https://github.com/seradotcom/semwright", rev = "e64a2d28d1d866c539a2c40824cbb57f86a13c10", package = "semwright-platform-services" }
semwright-driver-sdk = { git = "https://github.com/seradotcom/semwright", rev = "e64a2d28d1d866c539a2c40824cbb57f86a13c10", package = "semwright-driver-sdk" }
semwright-types = { git = "https://github.com/seradotcom/semwright", rev = "e64a2d28d1d866c539a2c40824cbb57f86a13c10", package = "semwright-types" }
semwright-media-time = { git = "https://github.com/seradotcom/semwright", rev = "e64a2d28d1d866c539a2c40824cbb57f86a13c10", package = "semwright-media-time" }
semwright-project-graph = { git = "https://github.com/seradotcom/semwright", rev = "e64a2d28d1d866c539a2c40824cbb57f86a13c10", package = "semwright-project-graph" }
semwright-effect-conformance = { git = "https://github.com/seradotcom/semwright", rev = "e64a2d28d1d866c539a2c40824cbb57f86a13c10", package = "semwright-effect-conformance" }
semwright-motion-authoring = { git = "https://github.com/seradotcom/semwright", rev = "e64a2d28d1d866c539a2c40824cbb57f86a13c10", package = "semwright-motion-authoring" }
semwright-semantic-composition = { git = "https://github.com/seradotcom/semwright", rev = "e64a2d28d1d866c539a2c40824cbb57f86a13c10", package = "semwright-semantic-composition" }
semwright-driver-blender = { git = "https://github.com/seradotcom/semwright", rev = "e64a2d28d1d866c539a2c40824cbb57f86a13c10", package = "semwright-driver-blender" }
semwright-driver-motion-canvas = { git = "https://github.com/seradotcom/semwright", rev = "e64a2d28d1d866c539a2c40824cbb57f86a13c10", package = "semwright-driver-motion-canvas" }

# v0.1 security: exact crates.io glib 0.18.5 with the independently
# audited VariantStrIter FFI out-parameter backport. Do not replace this
# path with a registry 0.18.5 or treat its version as an advisory waiver.
[patch.crates-io]
glib = { path = "vendor/glib-0.18.5" }
# Exact Tauri IPC diagnostics source patch; independently verified by source_policy.
tauri = { path = "vendor/tauri-2.12.1" }

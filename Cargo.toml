[workspace]
resolver = "2"
members = [
  "crates/domain",
  "crates/storage",
  "crates/service",
  "crates/native",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
repository = "https://github.com/seradotcom/motionwright"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
tempfile = "3.23"
parking_lot = "0.12"
async-trait = "0.1"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "sync"] }
semwright-native-sdk = { git = "https://github.com/seradotcom/semwright", rev = "4d291de26724810017ce7b6d185326514cb79fa6", package = "semwright-native-sdk" }

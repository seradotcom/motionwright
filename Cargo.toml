[workspace]
resolver = "2"
members = [
  "crates/domain",
  "crates/storage",
  "crates/service",
  "crates/manim-profile",
  "crates/hyperframes-profile",
  "crates/creative-library",
  "crates/driver-hyperframes",
  "crates/driver-manim-community",
  "crates/native",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
repository = "https://github.com/seradotcom/motionwright"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
tempfile = "3.23"
parking_lot = "0.12"
async-trait = "0.1"
symphonia = { version = "0.6.1", features = ["all"] }
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "sync"] }
semwright-native-sdk = { git = "https://github.com/seradotcom/semwright", rev = "61a64a9c541cf19ea88dd022b4e51e111ad24ecc", package = "semwright-native-sdk" }
semwright-driver-sdk = { git = "https://github.com/seradotcom/semwright", rev = "61a64a9c541cf19ea88dd022b4e51e111ad24ecc", package = "semwright-driver-sdk" }
semwright-types = { git = "https://github.com/seradotcom/semwright", rev = "61a64a9c541cf19ea88dd022b4e51e111ad24ecc", package = "semwright-types" }
semwright-media-time = { git = "https://github.com/seradotcom/semwright", rev = "61a64a9c541cf19ea88dd022b4e51e111ad24ecc", package = "semwright-media-time" }
semwright-project-graph = { git = "https://github.com/seradotcom/semwright", rev = "61a64a9c541cf19ea88dd022b4e51e111ad24ecc", package = "semwright-project-graph" }
semwright-effect-conformance = { git = "https://github.com/seradotcom/semwright", rev = "61a64a9c541cf19ea88dd022b4e51e111ad24ecc", package = "semwright-effect-conformance" }
semwright-motion-authoring = { git = "https://github.com/seradotcom/semwright", rev = "61a64a9c541cf19ea88dd022b4e51e111ad24ecc", package = "semwright-motion-authoring" }
semwright-semantic-composition = { git = "https://github.com/seradotcom/semwright", rev = "61a64a9c541cf19ea88dd022b4e51e111ad24ecc", package = "semwright-semantic-composition" }

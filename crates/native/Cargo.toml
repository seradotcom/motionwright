[package]
name = "motionwright-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true

[features]
# Checkpoints in the actual Core/Host9 subprocess fixture only.
# Synchronous storage timing is observed by the external owner.
# No release/default feature enables these observations or waits.
native-graph-owner-fixture = []

[dependencies]
base64 = "0.23"
motionwright-domain = { path = "../domain" }
motionwright-storage = { path = "../storage" }
motionwright-service = { path = "../service" }
motionwright-manim-profile = { path = "../manim-profile" }
motionwright-hyperframes-profile = { path = "../hyperframes-profile" }
semwright-native-sdk = { workspace = true, features = ["driver", "graph", "effects"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["process", "time", "io-util"] }
sha2.workspace = true
hex.workspace = true
semwright-audio-domain.workspace = true
semwright-project-graph.workspace = true
semwright-media-time.workspace = true
semwright-motion-authoring.workspace = true
semwright-semantic-composition.workspace = true
semwright-driver-blender.workspace = true

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true
tokio.workspace = true
semwright-effect-conformance.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.190"

[package]
name = "motionwright-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true

[dependencies]
base64 = "=0.23.1"
wasmi = { version = "=2.0.3", default-features = false, features = ["stable", "std", "wat", "validate", "portable-dispatch"] }
cssparser = "=0.37.0"
quick-xml = "=0.42.0"
motionwright-domain = { path = "../domain" }
motionwright-storage = { path = "../storage" }
parking_lot.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
symphonia.workspace = true
semwright-driver-motion-canvas.workspace = true

[dev-dependencies]
tempfile.workspace = true
rusqlite.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_Shell"] }

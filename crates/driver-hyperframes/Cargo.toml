[package]
name = "motionwright-driver-hyperframes"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
description = "Closed native HyperFrames sources through the existing Driver Host"

[[bin]]
name = "semwright-hyperframes-driver"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
hex.workspace = true
libc = "0.2"
schemars.workspace = true
semwright-driver-sdk.workspace = true
semwright-types.workspace = true
motionwright-hyperframes-profile = { path = "../hyperframes-profile" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
semwright-backend-api = { git = "https://github.com/seradotcom/semwright", rev = "54d3459a051adbce4cae9f60c0dea8f60c824be6", package = "semwright-backend-api" }
semwright-driver-host = { git = "https://github.com/seradotcom/semwright", rev = "54d3459a051adbce4cae9f60c0dea8f60c824be6", package = "semwright-driver-host" }
semwright-policy = { git = "https://github.com/seradotcom/semwright", rev = "54d3459a051adbce4cae9f60c0dea8f60c824be6", package = "semwright-policy" }
tokio = { workspace = true, features = ["time"] }
tokio-util = { version = "0.7", features = ["rt"] }
